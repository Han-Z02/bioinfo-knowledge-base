ate(-249.000000, -126.000000)' fill='%23FFFFFF'%3E%3Crect x='249' y='126' width='1' height='1'%3E%3C/rect%3E%3C/g%3E%3C/g%3E%3C/svg%3E) 然后再输出svg文件 ![图片](data:image/svg+xml,%3C%3Fxml version='1.0' encoding='UTF-8'%3F%3E%3Csvg width='1px' height='1px' viewBox='0 0 1 1' version='1.1' xmlns=' http://www.w3.org/2000/svg ' xmlns:xlink=' http://www.w3.org/1999/xlink'%3E%3Ctitle%3E%3C/title%3E%3Cg stroke='none' stroke-width='1' fill='none' fill-rule='evenodd' fill-opacity='0'%3E%3Cg transform='translate(-249.000000, -126.000000)' fill='%23FFFFFF'%3E%3Crect x='249' y='126' width='1' height='1'%3E%3C/rect%3E%3C/g%3E%3C/g%3E%3C/svg%3E) 然后用Adobe illustrator打开 ![图片](data:image/svg+xml,%3C%3Fxml version='1.0' encoding='UTF-8'%3F%3E%3Csvg width='1px' height='1px' viewBox='0 0 1 1' version='1.1' xmlns=' http://www.w3.org/2000/svg ' xmlns:xlink=' http://www.w3.org/1999/xlink'%3E%3Ctitle%3E%3C/title%3E%3Cg stroke='none' stroke-width='1' fill='none' fill-rule='evenodd' fill-opacity='0'%3E%3Cg transform='translate(-249.000000, -126.000000)' fill='%23FFFFFF'%3E%3Crect x='249' y='126' width='1' height='1'%3E%3C/rect%3E%3C/g%3E%3C/g%3E%3C/svg%3E) 怎么样，这次这个方案终于对应了吧*-* svg出来的图片和png很接近了 而且这个方案是使用GPT网页版，不用考虑什么额度的问题 不过我比较纳闷，Codex输出的图像可能Claude理解不了，输出svg效果不好可以理解，但是为啥综合能力更强的Codex桌面版效果反而没有网页版要好？ 同一套提示词，这不应该啊，莫非AI生图真就开盲盒？？？ 你永远不知道什么时候能抽中你心目中的“卡片” 好吧，那这次的一次科研绘图探索也不算白费力气 至少知道各个工具间的局限性 有句话说得好—— 真正能把AI用得好的人，从来不是掌握了多少AI工具 而是清楚知道AI的使用边界 做科研当然还是要练好基本功，AI顶多算个辅助 还有AI生成的图片也不能直接用，像GPT直接生成的图片其实早就已经带上了“AI数字签名”，很容易就能识别出是AI生成的 你除了用相机拍照扫描，几乎没有任何办法去除“水印”，最近谷歌和OpenAI好像也有专门讲这件事 对了，还有一个工具我发现比较好用 名字叫open design： ![图片](data:image/svg+xml,%3C%3Fxml version='1.0' encoding='UTF-8'%3F%3E%3Csvg width='1px' height='1px' viewBox='0 0 1 1' version='1.1' xmlns=' http://www.w3.org/2000/svg ' xmlns:xlink=' http://www.w3.org/1999/xlink'%3E%3Ctitle%3E%3C/title%3E%3Cg stroke='none' stroke-width='1' fill='none' fill-rule='evenodd' fill-opacity='0'%3E%3Cg transform='translate(-249.000000, -126.000000)' fill='%23FFFFFF'%3E%3Crect x='249' y='126' width='1' height='1'%3E%3C/rect%3E%3C/g%3E%3C/g%3E%3C/svg%3E) 有机会我可以再讲讲这个的用法 前阵子用它来制作一个HTML demo玩具，属实经验到我了 不过现在还没有接入skills功能，毕竟这个product是能接入Codex和Claude code的，后面能玩出来的花样想想都知道有不少哈！ 最后——非常感谢大家的支持啊 上大学以来第一次以微信公众号作者的身份和这个世界对话 如今也总算收获了不少粉丝嘻嘻嘻（差不多就突破1000啦！） 不过，快进入期末周了，还有一个比赛我作为队长要负责好多内容啊！！！后期可能真的没有多少精力维持一天一更了 希望大家谅解！ 那么，有缘我们下期再见！ 科研工作 · 目录 作者提示: 个人观点，仅供参考 继续滑动看下一个 口天三木 向上滑动看下一个 闪记 复制 LaTeX 公式 复制 LaTeX 公式","tags":["clippings","暂未试用"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"网页剪藏","updated":"2026-10-25T17:37:28.606Z","url":"ai-automation/notes/2f6ac82dc91d1bffe3a0fa33.html"},{"kbId":"KB-000100","title":"oh-my-codex (OMX) 项目完整使用指南","subtitle":"","summary":"一、项目简介oh-my-codex（OMX） 是一个构建在 OpenAI Codex CLI[1] 之上的工","body":"原创 Ranger 2026年4月8日 08:40 一、项目简介 # oh-my-codex（OMX） 是一个构建在 OpenAI Codex CLI [1] 之上的 工作流编排层（Workflow Orchestration Layer） 。 它的定位类似于 oh-my-zsh 之于 zsh ——不替换底层工具，而是在其上提供更强大的工作流、角色系统、技能库和状态管理能力，让 Codex CLI 更好用、更强大、更适合复杂的日常开发任务。 核心概念 # ┌─────────────────────────────────────┐ │ 你的项目 │ ├─────────────────────────────────────┤ │ oh-my-codex (OMX) │ ← 工作流层：角色 / 技能 / 状态 / 编排 ├─────────────────────────────────────┤ │ OpenAI Codex CLI │ ← 执行引擎（不被替换） ├─────────────────────────────────────┤ │ OpenAI API │ └─────────────────────────────────────┘ Codex 负责实际的 Agent 执行； OMX 负责提供更好的任务路由、工作流和运行时管理。 二、解决什么问题 # 痛点 OMX 的解法 每次使用 Codex 都要手动写大量 prompt 提供标准化的技能库（40个技能），通过 $skill-name 一键触发 复杂任务没有标准化流程 提供从需求澄清 → 计划 → 执行 → 验证的完整工作流 多智能体并行协作复杂 $team 模式一键启动 tmux 多 Agent 并行工作流 会话间上下文丢失 .omx/ 目录持久化计划、日志、内存、状态 Codex 角色不明确，执行质量不稳定 提供 30 个专业角色 prompt（architect、debugger、executor 等） 大任务执行到一半就停止 $ralph 持久化完成循环，强制推进到真正完成 三、环境要求 # 依赖 版本要求 备注 Node.js \u003e= 20 必须 OpenAI Codex CLI 最新 npm install -g @openai/codex OpenAI API Key — 需要配置认证 tmux 任意版本 macOS/Linux 下 Team 模式必须 psmux 任意版本 Windows 原生 Team 模式 四、安装与初始化 # 方式一：推荐（npm 全局安装） # # 安装 Codex CLI 和 OMX npm install -g @openai/codex oh-my-codex # 初始化 OMX（安装 prompts、skills、配置 Codex CLI） omx setup # 验证安装是否成功 omx doctor 方式二：从源码安装 # git clone https://github.com/Yeachan-Heo/oh-my-codex.git cd oh-my-codex npm install npm run build npm link # 初始化 omx setup 安装验证 # 执行 omx doctor 后，正常输出应如下： oh-my-codex doctor ================== [OK] Codex CLI: installed [OK] Node.js: v20+ [OK] Codex home: ~/.codex [OK] Config: config.toml has OMX entries [OK] Prompts: 30 agent prompts installed [OK] Skills: 40 skills installed [OK] AGENTS.md: found in project root [OK] State dir: .omx/state [OK] MCP Servers: 4 servers configured (OMX present) Results: 9 passed, 0 warnings, 0 failed 五、使用方式 # 5.1 启动 OMX # # 推荐方式：以最强配置启动 omx --madmax --high # 普通启动 omx --madmax 启用最大上下文和能力， --high 提升推理强度。 5.2 核心工作流（推荐路径） # OMX 的推荐工作流分为四步： $deep-interview → $ralplan → $ralph / $team 在 Codex 会话中依次执行： # 第一步：澄清需求（当任务边界不清晰时） $deep-interview \"clarify the authentication change\" # 第二步：制定并审批计划 $ralplan \"approve the auth plan and review tradeoffs\" # 第三步A：单 Agent 持久完成（适合中小任务） $ralph \"carry the approved plan to completion\" # 第三步B：多 Agent 并行执行（适合大型任务） $team 3:executor \"execute the approved plan in parallel\" 5.3 技能（Skills）关键字一览 # 技能通过关键字自动触发，无需额外确认： 触发关键字 技能 用途 $ralph / \"don't stop\" $ralph 持久完成循环，强制推进到验证完成 $deep-interview / \"interview me\" $deep-interview Socratic 需求澄清，Ouroboros 模式 $ralplan / \"consensus plan\" $ralplan 共识规划，结构化 deliberation $team / \"swarm\" $team 多 Agent 协同并行执行 $autopilot / \"build me\" $autopilot 全自动流水��：需求 → 设计 → 实现 → QA $ultrawork / \"parallel\" $ultrawork 并行多 Agent 执行 $ultraqa $ultraqa QA 循环工作流 $analyze / \"investigate\" $analyze 深度代码分析 $tdd / \"test first\" $tdd 测试驱动开发流程 $code-review $code-review 代码审查 $security-review $security-review 安全审计（OWASP Top 10） $build-fix / \"fix build\" $build-fix 修复构建/类型错误 $web-clone / \"clone site\" $web-clone 网站克隆流水线 $ecomode / \"budget\" $ecomode 节省 token 的精简模式 5.4 Agent 角色系统 # 30 个专业角色 prompt 内置安装按复杂度分类： 复杂度 适用角色 低 explore 、 style-reviewer 、 writer 中 executor 、 debugger 、 test-engineer 高 architect 、 critic # 在 Codex 会话中直接调用 $architect \"analyze the authentication module\" $debugger \"root cause the memory leak in worker.ts\" $explore \"find all database query patterns\" $security-reviewer \"review the API endpoints\" 5.5 Team 模式（多 Agent 并行） # Team 模式通过 tmux 启动多个并行工作 Agent，适合大型任务： # 启动 3 个 executor Agent 并行工作 omx team 3:executor \"fix the failing tests with verification\" # 启动 6 个混合 Agent（Codex + Claude） export OMX_TEAM_WORKER_CLI_MAP=codex,codex,codex,claude,claude,claude omx team 6:executor \"e2e team demo\" # Team 生命周期管理 omx team status \u003cteam-name\u003e # 查看状态 omx team resume \u003cteam-name\u003e # 恢复中断的 team omx team shutdown \u003cteam-name\u003e # 关闭 team Team 流水线： team-plan → team-prd → team-exec → team-verify → team-fix (loop) 5.6 常用 CLI 命令 # omx setup # 安装/重新安装所有组件 omx setup --force # 强制覆盖已有配置 omx doctor # 检查安装状态 omx version # 查看版本信息 omx status # 查看当前活跃的模式 omx cancel # 取消当前活跃模式 omx hud --watch # 实时监控 HUD（状态面板） # 只读仓库探查（不执行编辑操作） omx explore --prompt \"find where team state is written\" # 安全 shell 执行（有限白名单命令，适合验证/检查） omx sparkshell git status omx sparkshell --tmux-pane %12 --tail-lines 400 5.7 状态持久化（.omx/ 目录） # OMX 在项目根目录下的 .omx/ 中保存所有运行时状态： .omx/ ├── state/ # 当前模式状态（ralph / team / autopilot 等） ├── notepad.md # 会话笔记 ├── project-memory.json # 跨会话项目记忆 ├── plans/ # PRD 和测试规格文档 │ ├── prd-*.md │ └── test-spec-*.md └── logs/ # 运行日志 └── autoresearch/ # autoresearch 迭代日志 六、使用场景 # 场景 推荐做法 功能需求不清晰，想先澄清边界 $deep-interview \"...\" 需求清晰，想在实现前制定计划和权衡 $ralplan \"...\" 大型功能开发，多个子任务可并行 $team N:executor \"...\" 一个任务需要持续推进直到完成/验证通过 $ralph \"...\" 从零构建一个新功能/应用 $autopilot \"build me ...\" 代码审查 $code-review 安全审计 $security-review 修复 TypeScript 类型错误或构建失败 $build-fix 自动化研究/优化任务 omx autoresearch missions/\u003cmission-dir\u003e 只需查看仓库结构，不需要编辑 omx explore --prompt \"...\" 七、完整使用示例 # 示例 1：全流程开发一个认证模块 # # 1. 启动 OMX omx --madmax --high # 在 Codex 会话中： # 2. 澄清需求 $deep-interview \"我想给 API 添加 JWT 认证，请帮我明确边界和非目标\" # 3. 审批计划 $ralplan \"approve the safest JWT implementation path\" # 4. 执行（小任务用 ralph，大任务用 team） $ralph \"carry the approved plan to completion\" 示例 2：并行修复测试 # omx --madmax --high # 在会话中： $team 3:executor \"fix all failing tests with verification\" 示例 3：代码安全审查 # omx # 在会话中： $security-review \"review all API endpoints in src/routes/\" 示例 4：Autoresearch 优化任务 # # 运行内置的 Bayesian 优化 showcase omx autoresearch missions/noisy-bayesopt-highdim # 查看结果 RUN_ID=$(find .omx/logs/autoresearch -maxdepth 1 -mindepth 1 -type d | sort | tail -1 | xargs basename) cat .omx/logs/autoresearch/$RUN_ID/iteration-ledger.json 示例 5：一键运行 E2E Team 演示 # chmod +x scripts/demo-team-e2e.sh ./scripts/demo-team-e2e.sh 八、常见问题与解决方案 # 问题 1：Codex CLI not found # Error: command not found: codex 解决： npm install -g @openai/codex 问题 2：技能/slash 命令没有出现 # 解决： omx setup --force # 强制重新安装 prompts 和 skills 问题 3：MCP Servers 未连接 # 解决： 检查 ~/.codex/config.toml 中是否包含以下四个 MCP server 条目： • [mcp_servers.omx_state] • [mcp_servers.omx_memory] • [mcp_servers.omx_code_intel] • [mcp_servers.omx_trace] 如果缺失，重新运行： omx setup 问题 4：omx doctor 显示 warnings # omx setup # 安装缺失的组件 omx doctor # 再次检查 问题 5：Intel Mac 启动时 CPU 飙升（syspolicyd / trustd） # 启动 omx --madmax --high 时，macOS Gatekeeper 会对大量并发进程进行验证，导致 CPU 占用高。 解决方案（任选一种）： # 方法 1：移除隔离属性 xattr -dr com.apple.quarantine $(which omx) # 方法 2：在 macOS 安全设置中将终端 App 加入 Developer Tools 白名单 # 方法 3：降低并发（不使用 --madmax --high） omx 问题 6：Team 模式无法启动（找不到 tmux） # 解决： 安装对应平台的 tmux： 平台 命令 macOS brew install tmux Ubuntu/Debian sudo apt install tmux Fedora sudo dnf install tmux Arch sudo pacman -S tmux Windows winget install psmux Windows (WSL2) sudo apt install tmux 问题 7：$ralph 执行前 OMX 要求先生成计划 # OMX 有一个 ralplan-first 执行门：当 ralph 模式激活时，需要先存在 .omx/plans/prd-*.md 和 .omx/plans/test-spec-*.md 才能开始实现。 解决： 先运行 $ralplan \"...\" 完成计划，再运行 $ralph 。 问题 8：会话中断后 Team 状态丢失 # Team 的状态保存在 .omx/ 目录中，可以恢复： omx team status \u003cteam-name\u003e # 查看状态 omx team resume \u003cteam-name\u003e # 恢复中断的 team 九、项目架构概览 # oh-my-codex/ ├── src/ # TypeScript 核心源码 │ ├── cli/ # CLI 命令实现（omx 入口） │ ├── team/ # Team 模式运行时 │ ├── state/ # 状态管理 │ ├── hooks/ # Notify-hook / explore / sparkshell │ └── runtime/ # 与 Rust 运行时的 bridge ├── crates/ # Rust 核心组件（omx-runtime, omx-explore-harness） ├── prompts/ # 30 个 Agent 角色 prompt ├── skills/ # 40 个 workflow 技能 ├── templates/ # AGENTS.md 模板 ├── missions/ # Autoresearch 任务定义 ├── playground/ # Autoresearch 演示场景 ├── docs/ # 文档 └── .omx/ # (运行时生成) 状态、计划、日志 十、进阶功能：Autoresearch # OMX 内置了一个 自动化研究/优化引擎 ，可以对指定任务进行多轮迭代优化： # 列出所有内置任务 ./scripts/run-autoresearch-showcase.sh --list # 运行单个任务 ./scripts/run-autoresearch-showcase.sh bayesopt 已验证的 Autoresearch 结果： 场景 基线 最优结果 提升 Kaggle 表格 ML (AUC) 0.9458 0.9977 +0.0519 高维 Bayes 优化 2.833 4.760 +1.927 自适应排序优化 2.120 9.411 +7.291 潜在子空间发现 3.702 4.176 +0.474 十一、Lore Commit 协议 # OMX 推荐一套结构化的 commit message 格式，用于记录决策而非变更： \u003c意图行：为什么改，而不是改了什么\u003e \u003c背景说明：约束条件、方案选择理由\u003e Constraint: \u003c影响决策的外部约束\u003e Rejected: \u003c被否定的方案\u003e | \u003c否定原因\u003e Confidence: \u003clow|medium|high\u003e Scope-risk: \u003cnarrow|moderate|broad\u003e Directive: \u003c对未来修改者的前瞻性警告\u003e Tested: \u003c验证了什么\u003e Not-tested: \u003c已知的验证空白\u003e 十二、相关资源 # • 📖 官方网站 [2] • 📦 npm 包 [3] • 💬 Discord 社区 [4] • 🐛 问题反馈 [5] • 🤝 贡献指南 [6] • 📋 更新日志 [7] 引用链接 [1] OpenAI Codex CLI: https://github.com/openai/codex [2] 官方网站: https://yeachan-heo.github.io/oh-my-codex-website/ [3] npm 包: https://www.npmjs.com/package/oh-my-codex [4] Discord 社区: https://discord.gg/PUwSMR9XNk [5] 问题反馈: https://github.com/Yeachan-Heo/oh-my-codex/issues [6] 贡献指南: https://github.com/Yeachan-Heo/oh-my-codex/blob/main/CONTRIBUTING.md [7] 更新日志: https://github.com/Yeachan-Heo/oh-my-codex/blob/main/CHANGELOG.md 继续滑动看下一个 Ranger Ramblings 向上滑动看下一个 闪记 复制 LaTeX 公式","tags":["clippings"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"网页剪藏","updated":"2026-10-25T17:37:28.605Z","url":"ai-automation/notes/e501821c735ccea7dae47142.html"},{"kbId":"KB-000101","title":"可能是我在windows里用过的最好的终端","subtitle":"","summary":"与其寻找一个好用的终端，不如创造一个","body":"摘要 LLM 归库摘要 核心内容： 介绍 Phantty 这个面向 Windows、WSL、SSH 与远程开发场景的终端工具，重点强调它为 AI 编程工作流减少文件传输、图片传递和 Markdown 预览等操作摩擦。 可复用知识： 终端工具在 AI 编程时代的核心价值不只是连接服务器，而是让 Codex、Claude Code 等命令行 AI 更容易获得真实开发现场的上下文。 关联页面建议： 可后续整合到 04 AI_API与自动化库/02_wiki/claude_code/终端中的 AI 编程工作流 或 Windows/SSH 远程开发工具对比页面。 下一步处理： 若实际试用 Phantty，可补充安装方式、快捷键、与 Windows Terminal/Xshell/MobaXterm 的对比，以及是否适合生信服务器远程分析。 归库说明： 分类到 04 AI_API与自动化库，置信度 0.84；理由是正文明确围绕 Codex、Claude Code、AI 编程、终端、WSL、SSH 与远程开发工作流展开。 徐 2026年5月23日 10:19 Windows 下其实从来不缺终端工具。 系统自带有 Windows Terminal，远程连接可以用 Xshell，功能大而全的可以用 MobaXterm。它们当然都能用，而且很多人也用了很多年。 但问题是，我一直觉得 Windows 下始终缺少一个“真正顺手”的终端。 有些工具太复杂，像 Xshell 这一类软件，更像是传统的 SSH 连接管理器。它适合管理很多服务器、配置很多会话、做比较正式的远程运维，但它的设计思路还是偏传统：先建会话，再连服务器，再围绕连接做管理。 MobaXterm 也很强，集成了很多东西，SSH、SFTP、X server、远程文件管理都放在一起。但也正因为它什么都有，整个工具会变得很重，界面也更像一个远程运维套件。 而我想要的不是一个越来越复杂的“大工具箱”。 我想要的是一个真正适合日常开发的 Windows 终端：打开就能用，连接远程服务器也顺手，配合 WSL 也自然，最重要的是，它应该适合今天 Codex、Claude Code 这类 AI 编程工具的工作流。 这就是我做 Phantty 的原因。 开源免费： https://phantty.cc-remote.app/ Phantty 不是单纯为了替代 Windows Terminal，也不是为了做一个更复杂的 Xshell 或 MobaXterm。它更像是一个面向 AI 时代重新设计的 Windows 终端。 它关注的不是“我能不能连上服务器”，而是： 连上之后，我每天反复做的事情，能不能更简单？ 功能一：Ctrl + Shift + Click 下载远程文件 # 在远程服务器上工作时，经常会遇到一个场景：终端里出现了一个文件路径，我想把它下载到本地。 传统做法一般是复制路径，然后重新写一条 scp 命令。你需要确认远程地址、用户名、远程路径、本地保存位置。这个过程不难，但非常烦。 Phantty 里可以直接对远程文件路径使用 Ctrl + Shift + Click 。 比如终端里出现： /home/user/project/results/report.html 你可以直接按住 Ctrl + Shift 点击这个路径，Phantty 就会把远程文件下载到本地。 也就是说，这里的设计不是 让你再去记一遍 scp 命令 ，而是 把远程文件下载变成一个点击动作 。 这对我来说非常重要。因为开发过程中真正浪费时间的，往往不是某个大功能，而是这些每天重复几十次的小摩擦。 功能二：拖动文件到终端，直接上传到远程服务器 # 下载之外，另一个高频操作就是上传。 比如你本地有一个配置文件、脚本、图片、数据文件，想传到当前 SSH 会话所在的服务器目录。传统方式还是 scp ，或者打开 SFTP 工具，再手动找目录。 Phantty 里可以直接把本地文件拖进终端。 如果你当前在 SSH 远程环境里，Phantty 会把这个文件上传到远程服务器当前目录，并把上传后的路径返回到终端里。 整个过程就是： 本地文件 → 拖进终端 → 上传到远程当前目录 → 获得远程路径 这件事看起来很小，但用起来会非常自然。 我不想每次上传文件都切到另一个工具，也不想为了一个临时文件打开完整的文件传输界面。既然我已经在终端里工作，那么上传文件这件事，也应该直接发生在终端里。 功能三：直接粘贴图片到 Codex / Claude Code # 今年使用 Codex、Claude Code 这类 AI 编程工具的人越来越多，而这些工具很多时候就运行在终端里。 但这里有一个很烦的问题：如果我想把截图给 AI 看，该怎么办？ 传统流程通常是： 截图 → 保存图片 → 上传到远程服务器 → 复制图片路径 → 粘贴给 AI 如果 AI 工具运行在本地还好，麻烦少一点；如果它运行在远程服务器里，这个流程就更绕。 Phantty 解决的是这个痛点：你可以直接把剪贴板里的图片粘贴到终端。 这意味着你可以截图之后，直接粘贴给终端里的 Codex 或 Claude Code。即使你的 AI 工具运行在远程服务器上，也可以更自然地获得图片上下文。 这对 AI 编程非常有用。因为很多问题不是几句话能说清楚的。 比如前端页面布局错了，浏览器里出现奇怪报错，图表显示不对，生信分析结果图需要判断，软件界面里有一个难以描述的状态，这些场景都很适合直接截图给 AI。 以前你要把这些信息讲给 AI，需要绕很多步。现在在 Phantty 里，可以更接近直觉：看到问题，截图，粘贴，继续让 AI 处理。 也就是说，这里的设计不是 把终端做成聊天软件 ，而是 让终端里的 AI 真正获得它需要的上下文 。 功能四：Ctrl + Click 预览 Markdown 文件 # 开发过程中，我们经常会遇到各种 Markdown 文件： README.md CHANGELOG.md notes.md result.md analysis.md 传统做法是用 cat 、 less 、 vim ，或者打开编辑器查看。能看，但不够顺手。 Phantty 支持对 Markdown 文件使用 Ctrl + Click 预览。 当终端输出里出现一个 Markdown 文件路径时，你可以直接点击打开预览，不需要离开当前终端环境。 这个功能特别适合看项目说明、分析记录、运行日志、课程文档和 AI 生成的报告。 很多时候，我们并不是想“编辑”这个 Markdown 文件，只是想快速确认里面写了什么。那最自然的方式就应该是：看到路径，点一下，直接预览。 功能五：更适合 WSL、SSH 和远程开发 # Phantty 不是只面向本地命令行的工具。 它面向的是今天真实的开发环境：Windows 本地、WSL、远程 Linux 服务器，以及运行在这些环境里的各种命令行工具。 很多终端在本地用起来还可以，但一到 SSH 或 WSL 场景，就会变得割裂。比如文件上传下载、图片传递、Markdown 预览，这些操作常常需要用户自己再去找别的工具补上。 Phantty 想把这些能力统一起来。 无论你是在本地工作，还是在 WSL 里开发，还是 SSH 到远程服务器上运行 Codex / Claude Code，Phantty 都希望这些操作尽量保持一致。 这也是它和传统 SSH 工具最大的区别。 Xshell、MobaXterm 这类工具解决的是“如何连接服务器”和“如何管理远程会话”。 而 Phantty 更关心的是“连接服务器之后，开发者每天在终端里做的事情，能不能更自然”。 功能六：让 AI 更适合待在终端里 # 我一直觉得，AI 最适合待的地方其实是终端。 因为终端连接着真实的开发现场：代码、日志、进程、服务器、脚本、数据、环境变量、软件依赖、运行结果。 如果 AI 只是待在网页聊天框里，它离真实工作还有一段距离。你需要不断复制粘贴，把终端里的信息搬给它，再把它的建议搬回终端执行。 但如果 AI 本身就运行在终端里，这个距离会被大幅缩短。 Phantty 做的这些功能，本质上都是在减少这种距离： 远程文件路径可以直接下载 本地文件可以直接拖进远程终端 截图可以直接粘贴给 AI Markdown 文件可以直接预览 这些功能不是为了炫技，而是为了让终端更适合今天的 AI 编程工作流。 结语 # Windows 下不是没有终端工具。 只是长期以来，我们要么使用系统自带的通用终端，要么使用 Xshell、MobaXterm 这类偏传统、偏复杂的远程工具。 它们都能解决问题，但我一直想要一个更轻、更直接、更适合日常开发和 AI 工作流的 Windows 终端。 Phantty 就是这个想法的产物。 它解决的都是一些非常具体的问题： 远程文件怎么快速下载？ 本地文件怎么快速上传？ 截图怎么直接给终端里的 AI？ Markdown 文件怎么不用离开终端就能预览？ 这些问题每一个都不大，但每天重复出现，就会变成开发体验里的摩擦。 而 Phantty 想做的，就是把这些摩擦一个一个抹掉。 它不是为了让你多学一套复杂工具，而是为了让你少做很多无意义的操作。 终端应该更自然。 终端应该更适合 AI。 这就是我做 Phantty 的原因。 阅读原文 继续滑动看下一个 洲更的第二大脑 向上滑动看下一个 闪记 复制 LaTeX 公式","tags":["clippings"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"网页剪藏","updated":"2026-10-25T17:37:28.605Z","url":"ai-automation/notes/9406f4e6916cf5c86bb860e2.html"},{"kbId":"KB-000097","title":"jarrodwatts/claude-hud: A Claude Code plugin that shows what's happening - context usage, active tools, running agents, and todo progress","subtitle":"","summary":"A Claude Code plugin that shows what's happening - context usage, active tools, running agents, and todo progress - jarrodwatts/claude-hud","body":"摘要 LLM 归库摘要 核心内容： claude-hud 是一款 Claude Code 状态栏插件，实时显示上下文使用率、工具活动、子代理状态和待办进度。支持通过 /plugin 命令安装，通过 /claude-hud:setup 和 /claude-hud:configure 配置布局、语言、颜色和显示元素。 可复用知识： Claude Code 的插件机制（ /plugin marketplace add + /plugin install ）与状态栏 API 工作方式；HUD 预设（Full/Basic/Minimal）和各项配置参数（颜色、布局、元素顺序、Git 状态、速率限制显示等）。 关联页面建议： 04 AI_API与自动化库/02_wiki/claude_code/ 、 04 AI_API与自动化库/02_wiki/skills/ 下一步处理： 可在 Claude Code 中试用 /claude-hud:setup 完成安装与配置，体验上下文可视化监控与代理跟踪功能。 归库说明： 分类到 04 AI_API与自动化库，置信度 0.85，理由为 Claude Code 插件安装/配置文档，属于 AI 开发工具生态。 克劳德·胡德 # 一款 Claude Code 插件，可显示当前正在发生的事情——上下文使用情况、活动工具、正在运行的代理以及待办事项进度。始终显示在输入框下方。 🌐 English | 中文文档 安装 # 在 Claude Code 实例中，运行以下命令： 步骤 1：添加市场 /plugin marketplace add jarrodwatts/claude-hud 步骤 2：安装插件 Linux 用户：请先点击此处 On Linux, /tmp is often a separate filesystem (tmpfs), which causes plugin installation to fail with: EXDEV: cross-device link not permitted Fix : Set TMPDIR before installing: mkdir -p ~/.cache/tmp \u0026\u0026 TMPDIR=~/.cache/tmp claude Then run the install command below in that session. This is a Claude Code platform limitation . /plugin install claude-hud 之后，重新加载插件： /reload-plugins 步骤 3：配置状态栏 /claude-hud:setup ⚠️ Windows 用户：如果安装程序提示未找到 JavaScript 运行时，请点击此处。 On Windows, Node.js LTS is the supported runtime for Claude HUD setup. If setup says no JavaScript runtime was found, install Node.js for your shell first: winget install OpenJS.NodeJS.LTS Then restart your shell and run /claude-hud:setup again. 完成！重启 Claude Code 以加载新的 statusLine 配置，然后 HUD 就会出现。 在 Windows 系统上，安装程序写入新的 statusLine 配置后，需要完全重启 Claude Code。 什么是 Claude HUD？ # Claude HUD 让您更好地了解 Claude Code 会话中正在发生的事情。 你所看到的 为什么这很重要 项目路径 知道你当前所在的项目（可配置 1-3 个目录级别） 背景健康 在为时已晚之前，准确了解您的上下文窗口已满多少。 工具活动 观看克劳德阅读、编辑和搜索文件的过程。 代理跟踪 查看哪些子代理正在运行以及它们正在做什么 待办事项进度 实时跟踪任务完成情况 你所看到的 # 默认值（2 行） # [Opus] │ my-project git:(main*) Context █████░░░░░ 45% │ Usage ██░░░░░░░░ 25% (1h 30m / 5h) 第 1 行 — 模型、提供者标签（如果已明确识别，例如 Bedrock 、 Vertex ）、项目路径、Git 分支 第 2 行 — 上下文栏（绿色 → 黄色 → 红色）和使用速率限制 可选行（通过 /claude-hud:configure ） # ◐ Edit: auth.ts | ✓ Read ×3 | ✓ Grep ×2 ← Tools activity ◐ explore [haiku]: Finding auth code (2m 15s) ← Agent status ▸ Fix authentication bug (2/5) ← Todo progress 工作原理 # Claude HUD 使用 Claude Code 的原生 状态栏 API—— 无需单独的窗口，无需 tmux，可在任何终端中使用。 Claude Code → stdin JSON → claude-hud → stdout → displayed in your terminal ↘ transcript JSONL (tools, agents, todos) 主要特点： 来自 Claude Code 的原生令牌数据（非估算值） 与 Claude Code 报告的上下文窗口大小相匹配，包括最新的 100 万上下文会话 解析转录文本中的工具/代理活动 每隔 1001 300 毫秒更新一次 配置 # 随时自定义您的 HUD： /claude-hud:configure 引导流程负责布局、语言和常用显示切换。高级设置（例如自定义颜色和阈值）也保留在其中，但您需要直接编辑配置文件进行设置： 首次设置 ：选择一个预设（完整/基本/极简），选择标签语言，然后微调各个元素 随时自定义 ：切换项目显示/隐藏、调整 Git 显示样式、切换布局或更改标签语言 保存前预览 ：在提交更改前，准确查看 HUD 的外观。 预设 # 预设 所示内容 满的 所有功能均已启用——工具、代理、待办事项、Git、使用情况、持续时间 基本的 活动行 + Git 状态，信息简洁明了。 最低限度 仅核心功能——仅包含型号名称和上下文栏 After choosing a preset, you can turn individual elements on or off. Manual Configuration # Edit ~/.claude/plugins/claude-hud/config.json directly for advanced settings such as colors.* , pathLevels , maxWidth , threshold overrides, display.timeFormat , and display.promptCacheTtlSeconds . Running /claude-hud:configure preserves those manual settings while still letting you change language , layout, and the common guided toggles. Chinese HUD labels are available as an explicit opt-in. English stays the default unless you choose 中文 in /claude-hud:configure or set language in config. The short zh alias remains valid, and new guided config writes the canonical zh-Hans value. Options # Option Type Default Description language en | zh | zh-Hans en HUD label language. English is the default; set zh or zh-Hans to enable Simplified Chinese labels. lineLayout string expanded Layout: expanded (multi-line) or compact (single line) pathLevels 1-3 1 Directory levels to show in project path maxWidth number | null null Optional fallback width used only when terminal width detection fails completely forceMaxWidth boolean false Always use maxWidth when it is set, even if terminal width detection returns a smaller value elementOrder string[] [\"project\",\"context\",\"usage\",\"promptCache\",\"memory\",\"environment\",\"tools\",\"agents\",\"todos\",\"sessionTime\"] Expanded-mode element order. Omit entries to hide them in expanded mode. Existing configs keep their explicit order until updated. display.mergeGroups string[][] \u003ca href=\"%22context%22%2C%22usage%22\"\u003e\u0026quot;context\u0026quot;,\u0026quot;usage\u0026quot;\u003c/a\u003e Expanded-mode groups that should share a line when adjacent. Set [] to disable merged lines. gitStatus.enabled boolean true Show git branch in HUD gitStatus.showDirty boolean true Show * for uncommitted changes gitStatus.showAheadBehind boolean false Show ↑N ↓N for ahead/behind remote gitStatus.pushWarningThreshold number 0 Color the ahead count with the warning color at or above this unpushed-commit count ( 0 disables it) gitStatus.pushCriticalThreshold number 0 Color the ahead count with the critical color at or above this unpushed-commit count ( 0 disables it) gitStatus.showFileStats boolean false Show file change counts !M +A ✘D ?U gitStatus.branchOverflow truncate | wrap truncate Keep current truncation behavior or let the git block wrap onto its own line boundary when possible display.showModel boolean true Show model name [Opus] display.showAddedDirs boolean true Show extra workspace directories from /add-dir (e.g. +sparkle +lib-foo ); empty array renders nothing. In both layouts at most 5 dirs render (overflow shown as +N more ) and basenames are truncated to 24 chars with … display.addedDirsLayout inline | line inline inline puts dirs next to the project name with a +name prefix per dir; line renders them on a separate Added dirs: name1, name2 line (no + prefix, comma-separated) display.showContextBar boolean true Show visual context bar ████░░░░░░ display.contextValue percent | tokens | remaining | both percent Context display format ( 45% , 45k/200k , 55% remaining, or 45% (45k/200k) ) display.showConfigCounts boolean false Show CLAUDE.md, rules, MCPs, hooks counts display.showCost boolean false Show session cost using Claude Code's native cost.total_cost_usd when available, with a local estimate fallback for direct Anthropic sessions display.showOutputStyle boolean false Show the active Claude Code outputStyle from settings files as style: \u003cname\u003e display.showDuration boolean false Show session duration ⏱️ 5m display.showSpeed boolean false Show output token speed out: 42.1 tok/s display.showUsage boolean true Show Claude subscriber usage limits when available display.usageValue percent | remaining percent Usage display format ( 25% used, or 75% remaining) display.usageBarEnabled boolean true Display usage as visual bar instead of text display.usageCompact boolean false Display usage in a shorter text form such as 5h: 25% (1h 30m) ; takes precedence over display.usageBarEnabled display.showResetLabel boolean true Show the resets in prefix before usage countdowns display.timeFormat relative | absolute | both | elapsed | elapsedAndAbsolute relative How usage-window time is shown: countdown only ( resets in 2h 30m ), wall-clock reset ( resets at 14:30 ), both, elapsed window percentage ( 53% elapsed ), or elapsed plus wall-clock reset display.sevenDayThreshold 0-100 80 Show 7-day usage when \u003e= threshold (0 = always) display.externalUsagePath string \"\" Optional path to a local usage snapshot file used only when stdin rate_limits are missing display.externalUsageWritePath string \"\" Optional absolute .json path in an existing directory. When stdin rate_limits exists, ClaudeHUD writes a private snapshot for other local tools. Relative paths, non-json files, and missing parent directories are ignored display.externalUsageFreshnessMs number 300000 Maximum allowed age for the external usage snapshot before it is ignored display.showTokenBreakdown boolean true Show token details at high context (85%+) display.showTools boolean false Show tools activity line display.toolNameMaxLength number 0 Maximum displayed tool-name length. 0 keeps full names; MCP names may shorten to their final segment when truncating display.toolsMaxVisible number 4 Maximum completed tools shown on the tools line. 0 means unlimited display.showAgents boolean false Show agents activity line display.showTodos boolean false Show todos progress line display.showSessionName boolean false Show session slug or custom title from /rename display.showSessionStartDate boolean false Show the transcript session start timestamp display.showLastResponseAt boolean false Show how long ago the last assistant response was written display.showClaudeCodeVersion boolean false Show the installed Claude Code version, e.g. CC v2.1.81 display.showMemoryUsage boolean false Show an approximate system RAM usage line in expanded layout display.showPromptCache boolean false Show a prompt cache countdown based on the last assistant response timestamp in the transcript display.promptCacheTtlSeconds number 300 Prompt cache TTL in seconds. Keep the default for Pro, set 3600 for Max colors.context color value green Base color for the context bar and context percentage colors.usage color value brightBlue Base color for usage bars and percentages below warning thresholds colors.warning color value yellow Warning color for context thresholds and usage warning text colors.usageWarning color value brightMagenta Warning color for usage bars and percentages near their threshold colors.critical color value red Critical color for limit-reached states and critical thresholds colors.model color value cyan Color for the model badge such as [Opus] colors.project color value yellow Color for the project path colors.git color value magenta Color for git wrapper text such as git:( and ) colors.gitBranch color value cyan Color for the git branch and branch status text colors.label color value dim Color for labels and secondary metadata such as Context , Usage , counts, and progress text colors.custom color value 208 Color for the optional custom line colors.barFilled string █ Character used for the filled portion of progress bars colors.barEmpty string ░ Character used for the empty portion of progress bars colors.barFilled and colors.barEmpty accept a single visible grapheme. Control characters, invisible format characters (bidi controls, zero-width joiners, variation selectors), line/paragraph separators, and noncharacters are rejected. Wide characters (emoji, CJK) may affect bar alignment depending on the terminal. Supported color names: dim , red , green , yellow , magenta , cyan , brightBlue , brightMagenta . You can also use a 256-color number ( 0-255 ) or hex ( #rrggbb ). display.showMemoryUsage is fully opt-in and only renders in expanded layout. It reports approximate system RAM usage from the local machine, not precise memory pressure inside Claude Code or a specific process. The number may overstate actual pressure because reclaimable OS cache and buffers can still be counted as used memory. display.showCost is fully opt-in. ClaudeHUD prefers the native cost.total_cost_usd field that Claude Code provides on stdin when it is available. If that field is absent or invalid for a direct Anthropic session, ClaudeHUD falls back to the existing local transcript-based estimate so the cost line still works on older payloads. The native field is absent before the first API response in a session, so the cost display may stay hidden until then. ClaudeHUD also keeps the cost hidden for known routed providers such as Bedrock and Vertex AI, because cloud-provider billed sessions may report $0.00 or omit the field even though the session was not literally free. display.showPromptCache is fully opt-in. When enabled, ClaudeHUD looks at the timestamp of the last assistant response in the local transcript and shows a live countdown until the prompt cache expires. The default TTL is 5 minutes ( 300 seconds). Set display.promptCacheTtlSeconds to 3600 if you want a 1-hour Max-style window. If the transcript does not have an assistant timestamp yet, the cache element stays hidden. Usage Limits # Usage display is enabled by default when Claude Code provides subscriber rate_limits data on stdin. It shows your rate limit consumption on line 2 alongside the context bar. Set display.usageValue to remaining to show quota left instead of quota used. Warning colors and 7-day threshold checks still use the underlying used percentage. ClaudeHUD prefers the official statusline stdin payload. If rate_limits are missing, you can opt into a local sidecar fallback by setting display.externalUsagePath to a JSON snapshot written by another tool such as a proxy. Stdin still wins whenever both sources exist. The fallback snapshot must be fresh enough ( display.externalUsageFreshnessMs ) and include valid updated_at , plus a five_hour window, seven_day window, or balance_label . balance_label is optional text for prepaid provider balances; it is trimmed, length-limited, and sanitized before display. Invalid JSON, stale files, or invalid timestamps are ignored quietly. Set display.externalUsageWritePath if you want ClaudeHUD to write the official stdin rate_limits into a local snapshot for other tools. The path must be absolute, end in .json , and live in an existing directory. ClaudeHUD writes the file with private permissions and ignores invalid paths quietly. Free/weekly-only accounts render the weekly window by itself instead of showing a ghost 5h: -- placeholder. The 7-day percentage appears when above the display.sevenDayThreshold (default 80%): Context █████░░░░░ 45% │ Usage ██░░░░░░░░ 25% (1h 30m / 5h) | ██████████ 85% (2d / 7d) To disable, set display.showUsage to false . Reset times use relative countdowns by default. Set display.timeFormat to absolute for wall-clock times, both to show both forms, elapsed to show how far through each usage window you are, or elapsedAndAbsolute to show elapsed window progress plus the wall-clock reset time. This setting is manual-only today; /claude-hud:configure preserves it without editing it. Set display.showResetLabel to false if you want shorter usage countdowns such as (3h 17m) instead of (resets in 3h 17m) . Set display.usageCompact to true if you want the shorter usage-only form, for example 5h: 25% (1h 30m) . Compact usage takes precedence over display.usageBarEnabled . Requirements: Claude Code must include subscriber rate_limits data on stdin for the current session Not available for API-key-only users Troubleshooting: If usage doesn't appear: Ensure you're logged in with a Claude subscriber account (not API key) Check display.showUsage is not set to false in config API users see no usage display (they have pay-per-token, not rate limits) AWS Bedrock models display Bedrock and hide usage limits (usage is managed in AWS) Google Vertex AI models display Vertex and hide cost estimates (pricing differs from Anthropic direct) Claude Code may leave rate_limits empty until after the first model response in a session Some Claude Code builds and subscription tiers may still omit rate_limits , even after the first response If you configured display.externalUsagePath , ClaudeHUD will try that local snapshot before hiding usage ClaudeHUD never falls back to credential scraping or undocumented API calls Example fallback snapshot: { \"updated_at\": \"2026-04-20T12:00:00.000Z\", \"five_hour\": { \"used_percentage\": 42, \"resets_at\": \"2026-04-20T15:00:00.000Z\" }, \"seven_day\": { \"used_percentage\": 84, \"resets_at\": \"2026-04-27T12:00:00.000Z\" } } Example Configuration # { \"language\": \"zh\", \"lineLayout\": \"expanded\", \"pathLevels\": 2, \"elementOrder\": [\"project\", \"tools\", \"context\", \"usage\", \"memory\", \"environment\", \"agents\", \"todos\", \"sessionTime\"], \"gitStatus\": { \"enabled\": true, \"showDirty\": true, \"showAheadBehind\": true, \"showFileStats\": true }, \"display\": { \"showTools\": true, \"showAgents\": true, \"showTodos\": true, \"showConfigCounts\": true, \"showDuration\": true, \"showMemoryUsage\": true }, \"colors\": { \"context\": \"cyan\", \"usage\": \"cyan\", \"warning\": \"yellow\", \"usageWarning\": \"magenta\", \"critical\": \"red\", \"model\": \"cyan\", \"project\": \"yellow\", \"git\": \"magenta\", \"gitBranch\": \"cyan\", \"label\": \"dim\", \"custom\": \"#FF6600\" } } Display Examples # 1 level (default): [Opus] │ my-project git:(main) 2 levels: [Opus] │ apps/my-project git:(main) 3 levels: [Opus] │ dev/apps/my-project git:(main) With dirty indicator: [Opus] │ my-project git:(main*) With ahead/behind: [Opus] │ my-project git:(main ↑2 ↓1) With file stats: [Opus] │ my-project git:(main* !3 +1 ?2) ! = modified files, + = added/staged, ✘ = deleted, ? = untracked Counts of 0 are omitted for cleaner display Troubleshooting # Config not applying? Check for JSON syntax errors: invalid JSON silently falls back to defaults Ensure valid values: pathLevels must be 1, 2, or 3; lineLayout must be expanded or compact ; maxWidth must be a positive number Delete config and run /claude-hud:configure to regenerate Git status missing? Verify you're in a git repository Check gitStatus.enabled is not false in config Tool/agent/todo lines missing? These are hidden by default — enable with showTools , showAgents , showTodos in config They also only appear when there's activity to show HUD not appearing after setup? Restart Claude Code so it picks up the new statusLine config On macOS, fully quit Claude Code and run claude again in your terminal Requirements # Claude Code v1.0.80+ macOS/Linux: Node.js 18+ or Bun Windows: Node.js 18+ Development # git clone https://github.com/jarrodwatts/claude-hud cd claude-hud npm ci \u0026\u0026 npm run build npm test See CONTRIBUTING.md for guidelines. License # MIT — see LICENSE","tags":["clippings","暂未试用"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"网页剪藏","updated":"2026-10-25T17:37:28.604Z","url":"ai-automation/notes/14081e62e6f641bd380c8a2c.html"},{"kbId":"KB-000098","title":"llm-wiki","subtitle":"","summary":"llm-wiki. GitHub Gist: instantly share code, notes, and snippets.","body":"LLM Wiki # 利用 LLM 构建个人知识库的模式。 这是一个概念文件，旨在复制粘贴到您自己的 LLM 代理（例如 OpenAI Codex、Claude Code、OpenCode/Pi 等）中。它的目标是传达高层次的概念，但您的代理将与您协作构建具体细节。 核心思想 # 大多数人使用学习型学习模型（LLM）和文档的体验都类似于随机生成（RAG）：你上传一系列文件，LLM 在查询时检索相关片段，并生成答案。这种方式虽然可行，但 LLM 每次都要从头开始重新发现知识，没有积累。如果你提出一个需要综合五个文档的复杂问题，LLM 每次都必须找到并拼凑相关的片段，没有任何知识积累。NotebookLM、ChatGPT 文件上传以及大多数 RAG 系统都是这样工作的。 这里的理念有所不同。LLM 并非仅仅在查询时从原始文档中检索信息， 而是逐步构建并维护一个持久化的维基 ——一个结构化的、相互链接的 Markdown 文件集合，它位于用户和原始数据源之间。当您添加新的数据源时，LLM 不仅会对其进行索引以便后续检索，还会读取它，提取关键信息，并将其整合到现有的维基中——更新实体页面，修订主题摘要，指出新数据与旧说法相矛盾之处，从而强化或挑战不断演进的综合分析。知识只需编译一次即可 保持最新 ，无需在每次查询时重新推导。 这就是关键区别： 维基百科是一个持续更新、不断完善的资源。 交叉引用已经存在，矛盾之处也已被标记，综合信息已经反映了你阅读过的所有内容。你添加的每一个来源、提出的每一个问题都会让维基百科的内容更加丰富。 你几乎从不（或者很少）亲自编写维基——所有内容都由 LLM（知识库管理员）编写和维护。你负责寻找资料、探索和提出正确的问题。LLM 负责所有繁琐的工作——总结、交叉引用、归档和记账，这些工作使知识库能够长期发挥作用。实际上，我一边打开 LLM 代理，一边打开 Obsidian。LLM 根据我们的对话进行编辑，我实时浏览结果——点击链接、查看图表视图、阅读更新后的页面。Obsidian 是集成开发环境（IDE）；LLM 是程序员；维基就是代码库。 这可以应用于许多不同的情境。以下是一些例子： 个人 ：跟踪自己的目标、健康、心理、自我提升——记录日记、文章、播客笔记，并随着时间的推移构建一个结构化的自我形象。 研究 ：对某个主题进行数周或数月的深入研究——阅读论文、文章、报告，并逐步构建一个包含不断发展的论点的综合维基。 阅读一本书 ：边读边整理章节，创建页面记录人物、主题、情节线索以及它们之间的联系。最终，你将拥有一个内容丰富的配套维基。想想像 托尔金门户网站（Tolkien Gateway）这样的粉丝维基——成千上万个相互关联的页面，涵盖人物、地点、事件、语言等等，由志愿者社区历经数年构建而成。你可以在阅读的同时，亲手构建类似的内容，而 LLM（图书馆学硕士 ）则负责所有的交叉引用和维护工作。 业务/团队 ：一个由 LLM 维护的内部 wiki，内容来源于 Slack 讨论串、会议记录、项目文档和客户电话。可能也会有人工参与审核更新。wiki 之所以能保持最新，是因为 LLM 负责团队中其他人都不愿意做的维护工作。 竞争分析、尽职调查、旅行计划、课程笔记、兴趣爱好深度研究 ——任何需要你随着时间的推移积累知识，并且希望将其整理成册而不是散乱无章的事物。 建筑学 # 它分为三层： 原始资源 ——您精心收集的源文档。包括文章、论文、图像和数据文件。这些资源是不可更改的——LLM 系统会读取它们，但绝不会对其进行修改。这就是您的真实来源。 维基 ——一个由 LLM 生成的 Markdown 文件目录。内容包括摘要、实体页面、概念页面、对比、概述和综合。LLM 完全掌控这一层。它创建页面，在新资源到来时更新页面，维护交叉引用，并确保所有内容的一致性。您阅读它，LLM 编写它。 模式 文件（例如 Claude Code 的 CLAUDE.md 或 Codex 的 AGENTS.md）告诉 LLM wiki 的结构、约定俗成的规则以及在导入资源、回答问题或维护 wiki 时应遵循的工作流程。这是关键的配置文件——它使 LLM 成为一个规范的 wiki 维护者，而不是一个普通的聊天机器人。随着时间的推移，您和 LLM 会共同完善这个模式文件，并不断探索适合您领域的有效方法。 运营 # 导入。 您将新源添加到原始集合中，并指示 LLM 进行处理。流程示例：LLM 读取源，与您讨论关键要点，在 wiki 中编写摘要页面，更新索引，更新 wiki 中相关的实体和概念页面，并将条目添加到日志中。单个源可能会影响 10-15 个 wiki 页面。我个人更喜欢一次导入一个源并全程参与——我会阅读摘要，检查更新，并指导 LLM 重点关注哪些内容。当然，您也可以一次性批量导入多个源，这样可以减少监督。您可以根据自己的习惯开发工作流程，并将其记录在模式中，以便将来使用。 查询。 您在维基中提出问题。LLM 会搜索相关页面，读取它们，并综合整理出包含引用的答案。答案可以根据问题的不同而呈现不同的形式——Markdown 页面、对比表格、幻灯片（Marp）、图表（matplotlib）或画布。重要的一点是： 优秀的答案可以作为新页面归档到维基中。 您提出的对比、分析、发现的关联——这些都很有价值，不应该消失在聊天记录中。这样，您的探索就像已导入的资源一样，不断积累在知识库中。 定期 检查。 请 LLM 定期对 wiki 进行健康检查。检查内容包括：页面之间的矛盾、已被新资料取代的过时说法、没有外部链接的孤立页面、提及但缺少独立页面的重要概念、缺失的交叉引用以及可以通过网络搜索填补的数据空白。LLM 擅长提出新的研究问题和新的参考资料。这有助于 wiki 在发展过程中保持健康。 索引和日志记录 # 随着维基百科的不断扩充，有两个特殊文件可以帮助 LLM（以及您）更好地浏览维基百科。它们各有不同的用途： index.md 是一个面向内容的索引。它是一个维基百科所有内容的目录——每个页面都包含一个链接、一行摘要，以及可选的元数据，例如日期或来源数量。索引按类别（实体、概念、来源等）组织。LLM 会在每次数据摄取时更新它。当响应查询时，LLM 首先读取索引以查找相关页面，然后深入查看这些页面。这种方法在中等规模（约 100 个来源，约数百个页面）下效果出奇地好，并且避免了使用基于嵌入的 RAG 架构。 log.md 是按时间顺序排列的日志。它记录了所有事件及其发生的时间，包括内容导入、查询和代码检查等。一个实用技巧：如果每个条目都以一致的前缀开头（例如 ## [2026-04-02] ingest | Article Title ），则可以使用简单的 Unix 工具解析该日志—— grep \"^## \\[\" log.md | tail -5 即可获取最近的 5 个条目。该日志提供了 wiki 的发展历程，并有助于 LLM 了解最近的工作内容。 可选：命令行工具 # 在某些时候，您可能需要构建一些小型工具来帮助 LLM 更高效地操作 wiki。最显而易见的就是 wiki 页面搜索引擎——在小规模时，索引文件就足够了，但随着 wiki 的增长，您需要更完善的搜索功能 。qmd 是一个不错的选择：它是一个本地 Markdown 文件搜索引擎，支持混合 BM25/vector 搜索和 LLM 重新排名，所有操作都在设备端完成。它既有命令行界面 (CLI)（LLM 可以通过 shell 调用它），也有 MCP 服务器（LLM 可以将其作为原生工具使用）。您也可以自己构建一个更简单的工具——LLM 可以在需要时帮助您编写一个简单的搜索脚本。 技巧和窍门 # Obsidian Web Clipper 是一款浏览器扩展程序，可以将网页文章转换为 Markdown 格式。对于快速将资源添加到您的原始收藏中非常有用。 将图片下载到本地。 在 Obsidian 设置 → 文件和链接中，将“附件文件夹路径”设置为一个固定目录（例如 raw/assets/ ）。然后在设置 → 热键中，搜索“下载”，找到“下载当前文件的附件”并将其绑定到一个热键（例如 Ctrl+Shift+D）。剪辑文章后，按下热键，所有图片都会下载到本地磁盘。虽然此步骤是可选的，但非常实用——它允许 LLM 直接查看和引用图片，而无需依赖可能失效的 URL。请注意，LLM 无法一次性读取包含内联图片的 Markdown 文本——解决方法是让 LLM 先读取文本，然后单独查看部分或全部引用的图片以获取更多上下文信息。这种方法略显繁琐，但效果尚可。 Obsidian 的图形视图 是查看 wiki 结构的最佳方式——哪些内容相互连接，哪些页面是中心页面，哪些页面是孤立页面。 Marp 是一种基于 Markdown 的幻灯片格式。Obsidian 有相应的插件。它可用于直接从 wiki 内容生成演示文稿。 Dataview 是一个 Obsidian 插件，用于对页面 frontmatter 进行查询。如果您的 LLM 系统向 wiki 页面添加了 YAML frontmatter（标签、日期、来源计数），Dataview 可以生成动态表格和列表。 这个维基百科其实就是一个存放 Markdown 文件的 Git 仓库。您可以免费获得版本历史记录、分支管理和协作功能。 为什么这种方法有效 # 维护知识库最繁琐的部分并非阅读或思考，而是记录。更新交叉引用、保持摘要的时效性、记录新数据与旧说法的矛盾之处、确保数十个页面内容的一致性，这些都至关重要。人们放弃维基百科，是因为维护负担的增长速度超过了其价值的增长速度。而 LLM（知识库管理员）不会感到厌倦，不会忘记更新交叉引用，而且一次就能处理 15 个文件。维基百科之所以能够持续维护，是因为其维护成本几乎为零。 人的职责是筛选资料、指导分析、提出好问题，并思考这一切的意义。法学硕士的职责则是其他一切。 这个想法在精神上与范内瓦·布什的 Memex（1945）一脉相承——Memex 是一个个人化的、精心维护的知识库，文档之间存在关联。布什的设想比后来的网络更接近于此：私密的、主动维护的，文档之间的关联与文档本身同样重要。他未能解决的问题是谁来维护。LLM 项目则负责解决这个问题。 笔记 # 本文档有意保持抽象。它描述的是概念，而非具体的实现方式。具体的目录结构、模式约定、页面格式、工具等等，都将取决于您的领域、您的偏好以及您选择的 LLM（生命周期管理）系统。以上所有内容都是可选且模块化的——选择有用的部分，忽略不需要的部分。例如：您的资源可能只有文本，因此您完全不需要图像处理功能。您的 wiki 可能很小，只需要索引文件，无需搜索引擎。您可能不需要幻灯片，而只需要 Markdown 页面。您可能需要完全不同的输出格式。使用本文档的正确方法是与您的 LLM 代理共享，并共同协作，创建一个符合您需求的版本。本文档的唯一作用是传达模式。您的 LLM 可以处理其余部分。","tags":["clippings"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"网页剪藏","updated":"2026-10-25T17:37:28.604Z","url":"ai-automation/notes/51948a44bde356d4de50fa17.html"},{"kbId":"KB-000099","title":"Odysseus：打造属于自己的 AI Workspace，让 AI 与数据都留在本地","subtitle":"","summary":"","body":"摘要 LLM 归库摘要 核心内容： 该文介绍 Odysseus 这一 Local-first、Privacy-first 的 AI Workspace，强调其核心不是聊天界面，而是可编排的 Agent 工作方式。 适用场景： 适合希望在本地统一管理 AI 助手、模型调用、隐私数据与自动化工作流的个人开发/研究环境。 输入： 本地模型（如 Ollama）、云端 API（OpenAI/Anthropic/Gemini）、源码或 Docker 安装环境。 输出： 一个可在 macOS、Windows、Linux 运行的本地 AI Workspace，以及可扩展的案例/接口调用能力。 关键参数/步骤： 关注安装方式（源码/Docker）、模型接入统一层、Agent 调用逻辑，以及文中提到的 PlotCase API 扩展能力。 常见错误： 文章偏宣传型，实操细节较少；后续试用时需补充部署步骤、模型配置、授权机制与真实使用边界。 与口腔生信连接： 可作为本地科研 AI 工作台候选，用于整理分析脚本、调用本地/云端模型、管理敏感研究数据与复用案例库。 可复用知识： “本地优先 + 隐私优先 + Agent 编排 + 多模型统一接入”是值得沉淀的 AI 工作区设计框架。 关联页面建议： 04 AI_API与自动化库/02_wiki/claude_code/终端中的 AI 编程工作流 下一步处理： 若后续实际部署 Odysseus，可补充安装记录、模型接入对比、与 Claude Code/Codex/本地知识库协同方式。 归库说明： 分类到 04 AI_API与自动化库，置信度 0.88；主要依据为 AI Workspace、Agent、本地模型、Anthropic/OpenAI/Gemini、Docker 等强信号。 2026年6月6日 17:18 它的核心思想不是「聊天」，而是「Agent」 github仓库 # https://github.com/pewdiepie-archdaemon/odysseus 作为一个新兴的 AI Workspace，Odysseus 已支持 macOS、Windows 和 Linux 三大操作系统，可通过源码部署或 Docker 快速安装。它采用 Local-first、Privacy-first 的设计理念，拥有极高的自定义能力，既可以接入 Ollama 等本地模型，也可以无缝切换 OpenAI、Anthropic、Gemini 等云端 API，开发者已经对不同模型和服务进行了统一适配，让用户能够根据自己的硬件、隐私需求和使用场景自由组合，真正打造属于自己的 AI Workspace。 PlotCase介绍 # PlotCase 1.0.6版现已完成推送 ，包含了完整API接口功能，通过此接口可以在codex类的智能体中实现准确、高效的案例内容调用，目前总案例数目已达190。PlotCase 1.0.7版将计划6月初进行推送，此次将优化智能体调用功能及新案例增加。 目前阶段将持续进行更新，但不会一直更新下去。后期到了一定阶段会停止更新。通过QQ群分发后续更新版本，App与设备绑定。 已全面支持 macOS 与 Windows 系统，为确保用户权益， 该App使用一机一码的方式进行付费激活 安装激活 # 更新日志 # 若想了解更多细节，可点击下方链接跳转到对应的文档 PlotCase v1.0.6：面向 AI 智能体的本地 R 图表知识库 关注下方公众号下回更新不迷路 # 作者提示: 个人观点，仅供参考 阅读原文 继续滑动看下一个 R语言数据分析指南 向上滑动看下一个 闪记 复制 LaTeX 公式","tags":["clippings","暂未试用"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"网页剪藏","updated":"2026-10-25T17:37:28.604Z","url":"ai-automation/notes/b19b68dce9751311fb2df906.html"},{"kbId":"KB-000096","title":"ClaudeR/clauder-mcp at main","subtitle":"","summary":"Connect RStudio to Claude Code, Codex, Gemini, and other LLM agents via MCP. Multi-agent orchestration, automated manuscript auditing, and zero-config setup with uvx - ClaudeR/clauder-mcp at main · IMNMV/ClaudeR","body":"摘要 LLM 归库摘要 核心内容： ClaudeR 是一个 R 包，通过 MCP 协议在 RStudio 和 LLM 代理（Claude Code、Codex、Qwen Code、Gemini CLI）之间建立双向连接。支持交互式编码、多代理编排、自动稿件审核（Reviewer Zero）、数据标注等功能。提供 execute_r 、 execute_r_async 、 search_project_code 、 verify_references 等 20+ MCP 工具。安装方式为 devtools::install_github(\"IMNMV/ClaudeR\") ，支持 uvx 零配置启动。 可复用知识： 涵盖 AI 驱动的学术审核协议（Reviewer Zero 4 步扫描：提取→验证→重新计算→参考文献检查）、多代理协调协议（共享消息板、任务认领、交叉检查）、R 最佳实践协议（EDA→假设检验→模型构建→诊断→报告）。这些协议可直接用于其他 AI 辅助科研场景。 关联页面建议： 04 AI_API与自动化库/02_wiki/mcp/MCP 工具开发与使用 （ClaudeR 是 MCP 服务器在科研场景的典型实践） 04 AI_API与自动化库/02_wiki/skills/ （其 Reviewer Zero 协议可启发 skill 设计） 下一步处理： 可实测安装 ClaudeR 包并试用 Reviewer Zero 功能；其多代理编排协议值得深入阅读并可能适配到当前 workflow。 归库说明： 分类到 04 AI_API与自动化库，置信度 0.85，理由：标题含 clauder-mcp ；正文集中介绍 MCP/Claude Code/Codex/Qwen/Gemini 等多代理 AI 工具集成；无 DOI/PMID 论文信号。 ClaudeR - 现代研究人员工具包 # 将 RStudio 连接到 Claude Code、Codex、Qwen Code、Gemini CLI 或任何基于 MCP 的 LLM 代理，以实现交互式编码、多代理编排、自动稿件审核和数据标注。 ClaudeR 是一个 R 包，它能在 RStudio 和配置了 MCP 的 LLM 代理（例如 Claude Code、Codex 或 Qwen Code）之间建立直接连接。这使得交互式编码会话成为可能，代理可以在您当前使用的 RStudio 环境中执行代码，从而实时查看执行的代码和生成的图表。如果您需要帮助编辑脚本、进行快速分析，或者需要 LLM 在提交稿件前审核您的统计结论，ClaudeR 都能为您提供支持。 此外，该软件包还允许多个代理同时处理同一个脚本，或者可以将多个 RStudio 窗口隔离，以便多个代理可以独立处理不同的数据集。它还兼容 Cursor 以及任何支持 MCP 服务器的服务。 快速入门 # # Install if (!require(\"devtools\")) install.packages(\"devtools\") devtools::install_github(\"IMNMV/ClaudeR\") # Set up your AI tool library(ClaudeR) install_clauder() # For Claude Desktop / Cursor install_cli(tools = \"claude\") # For Claude Code CLI # Start the server in RStudio claudeAddin() AI 代理： 有关自动化安装说明，请参阅 llms-install.md 。 最新动态 （点击展开） AI-Driven Data Annotation. Five MCP tools ( load_annotation_data , annotate , run_annotation_job , get_annotation_job_status , cancel_annotation_job ) let an agent label a CSV dataset row by row without writing any code. Two modes: interactive (context accumulates across rows) or fully-isolated via run_annotation_job (one fresh claude , codex , gemini , or qwen subprocess per row, or a local ollama HTTP call for free, private, offline labeling). Codex jobs accept a reasoning_effort parameter; Ollama jobs accept an ollama_base_url parameter. The original file is never modified and sessions resume automatically if interrupted. Multi-Agent Coordination Protocol. Built-in protocol for multiple agents sharing one RStudio session. Agents negotiate through a shared message board in the R environment, agree on a task plan, claim tasks before working, and cross-check each other's output. Load it with multi_agent_prompt() . verify_references tool. Extracts DOIs from a manuscript's bibliography, queries the CrossRef API for each, and returns metadata (title, authors, year, journal) for comparison against manuscript claims. Non-resolving DOIs, metadata mismatches, and references without DOIs are flagged. Works standalone (\"check my references\") or as Pass 4 of Reviewer Zero. R Best Practices Protocol. Built-in statistical analysis protocol covering EDA, assumption checking, model building, diagnostics, multiple-corrections, and reporting. Load it with r_best_practices_prompt() or tell the agent to read it. Reviewer Zero: Automated Academic Audits. Now a 4-pass protocol for AI-driven manuscript verification. The agent extracts every statistical and methodological claim, verifies its extraction, recomputes values against the author's R code, and checks references via CrossRef. Methodological claims (e.g., \"zero variance made testing impossible\") are tested directly rather than accepted at face value. Run reviewer_zero_prompt() to get the full protocol. clean_error_log tool. Point the agent at a session log and it will parse every code block, find errors, check whether a fix follows each one, then strip the error blocks and any duplicate code that preceded them. The result is a clean log with only the working code. Accepts an optional output_path to write to a separate file instead of overwriting the original. Persistent server across UI restarts. Closing the Shiny addin (console stop or Done button) no longer kills the MCP server. Re-running claudeAddin() reconnects to the still-running server with the correct port, session name, and execution count. Only clicking \"Stop Server\" in the UI actually stops the server. Descriptive log filenames. Log files now include the session name, port, and timestamp: clauder_default_8787_20260301_143022.R . A new log file is created each time you click Start Server. All subsequent code execution appends to that file. Viewer content capture \u0026 insert_text tool. Two new tools: get_viewer_content reads HTML from interactive widgets (plotly, DT, leaflet) with pagination so agents can inspect htmlwidget output without blowing up context. insert_text inserts text at the cursor position or a specific line/column in the active document. During agent execution, htmlwidgets open in the browser instead of stealing the Shiny addin's viewer pane. Multi-session routing fix. Agents now prefer the session named \"default\" when multiple sessions are active, preventing misrouting caused by non-deterministic discovery order. Once bound, agents stay sticky to their session. Non-default agents should call connect_session to target a specific session. Reproducibility metadata in logs. When logging is enabled, each new session log starts with a header containing the date, working directory, and full sessionInfo() output (R version, platform, attached packages). Anyone who receives the log can see exactly what environment the code ran in. Export clean script. Click \"Export Clean Script\" in the Shiny addin to strip all timestamps, agent labels, and log headers from a session log, producing a runnable .R file with just the code. Error blocks are preserved as comments. Also available programmatically via export_log_as_script() . PyPI package ( clauder-mcp ). The Python MCP bridge is now available as a standalone package on PyPI. Run it with uvx clauder-mcp for zero-config setup with no Python path or pip install needed. The installers ( install_cli() and install_clauder() ) default to uvx, with a use_uvx = FALSE fallback for legacy setups. read_file tool. Agents can now read any text file from disk (.R,.qmd,.csv,.log, etc.) without it being open in RStudio. Enables session continuity workflows: point an agent at a previous log file and tell it to pick up where the last session left off. Codex + Qwen Code CLI support. install_cli(tools = \"codex\") and install_cli(tools = \"qwen\") generate setup commands for OpenAI Codex and the Qwen Code CLI (Alibaba's gemini-cli fork). Both join Claude Code and Gemini as supported CLI agents. Multi-agent orchestration. Run multiple AI agents on the same R session or spread them across separate RStudio windows. Each agent gets a unique ID on startup. Console output, log files, and execution history are all attributed per agent, so you always know who did what. On its very first tool call, each agent receives a context briefing with its own ID, any other agents active on the session, and the log file path, giving it full awareness of the shared environment without any manual setup. Agents can call get_session_history to review what other agents have done, or read the shared log file directly. The Shiny viewer tracks connected agents in real-time. Session discovery. Each RStudio session writes a discovery file to ~/.claude_r_sessions/ on startup. AI agents find sessions automatically with no hardcoded ports. Name your sessions (e.g. \"analysis\", \"modeling\") and run them on different ports. When multiple sessions exist, agents automatically route to the session named \"default\". Non-default agents should call connect_session to bind to their target session. Single-session setups work with zero config. Redesigned Shiny viewer. Cleaner UI with grouped panels for Session, Agents, Logging, and Advanced settings. Shows connected agents and execution count in real-time. Click the ? button for a built-in guide on multi-session setup and agent identity. Non-blocking async execution. execute_r_async now runs long-running code in a separate R process via callr , keeping the main session fully responsive. Other agents can continue working while a job runs. The agent writes self-contained code (explicitly saving/loading data via saveRDS ), submits it, and polls with get_async_result . No environment copying and no memory doubling, only the data the job needs gets serialized. Stale plot detection. Fixed a bug where the last generated plot image would persist and re-appear on every subsequent execute_r call, even when no new plot was created. Reduced plot token usage. Plot capture now uses smaller dimensions (600x400, dpi 100) to reduce base64 image size and avoid token overflow errors. MCP tool annotations. All tools now include readOnlyHint , destructiveHint , and idempotentHint annotations per the current MCP spec. Hardened string escaping. escape_r_string now handles backticks, carriage returns, tabs, and null bytes. Applied to task tool inputs to prevent injection. Fixed install_cli() command syntax. Updated to use --transport stdio flag and -- separator for current Claude Code CLI. Now removes stale MCP registrations before adding fresh ones, preventing issues when upgrading R versions. 演示 # 通过 Claude 桌面应用程序进行单代理操作 多代理：Codex + Claude Code（通过 CLI） GPT 5.4 Codex：数据分析 + Quarto 报告 目录 # 快速入门 特征 工作原理 评论员零 R 最佳实践协议 多智能体协调协议 CLI 集成 安全限制 安装 用法 日志记录选项 交互示例 重要提示 故障排除 局限性 执照 贡献 特征 # ClaudeR 为您的 AI 助手提供了一套工具，使其能够与您的 R 环境进行交互： execute_r ：执行 R 代码并返回输出。 execute_r_with_plot ：执行生成模型可以看到的图表的 R 代码。 execute_r_async ：异步执行耗时较长的 R 代码（\u003e25 秒）。返回一个用于轮询的作业 ID。 get_async_result ：轮询异步作业的结果。内置延迟以限制轮询频率。 list_sessions ：列出代理可以连接的所有活动的 RStudio 会话。 connect_session ：通过名称连接到特定的 RStudio 会话，以进行多会话工作流程。 get_session_history ：查看按代理 ID 筛选的执行历史记录。 read_file ：无需在 RStudio 中打开，即可从磁盘读取任何文本文件（.R、.qmd、.csv、.log 等）。支持对大型文件进行 start_line / end_line 分页。 get_active_document ：获取 RStudio 中活动文档的内容。 get_r_info ：获取有关 R 环境的信息。 modify_code_section ：修改活动文档中的特定代码段。 insert_text ：在当前光标位置或活动文档中的特定行/列插入文本。 get_viewer_content ：从查看器窗格（plotly、DT、leaflet 小部件）读取 HTML 内容，支持分页。 clean_error_log ：通过删除错误块及其重复的前身来清理会话日志，只留下工作代码和后续的修复。 search_project_code ：在项目源文件（.R、.Rmd、.qmd）中搜索正则表达式模式。返回文件名、行号和代码片段。 probe_scripts ：在干净的后台会话中运行 R 脚本，并报告创建的对象（名称、类别、维度），而不会影响您的主会话。 verify_references ：通过提取 DOI 并将其与 CrossRef API 进行比对来验证学术参考文献。返回用于比较的元数据（标题、作者、年份、期刊）。没有 DOI 的参考文献将被标记，以便进行人工网络搜索。 create_task_list ：根据您的提示生成任务列表，以防止遗漏长上下文任务。 update_task_status ：跟踪生成的列表中每个任务的进度。 load_annotation_data ：加载用于标注的 CSV 文件。创建一个工作副本，解析 _schema 列，并显示第一个未标注的行。中断后可恢复。 annotate ：注释当前行，根据模式进行验证，立即保存，并自动加载下一行。 run_annotation_job ：在后台对整个 CSV 文件进行标注，行与行之间无上下文信息泄露。每一行都由一个全新的 claude 、 codex 、 gemini 或 qwen 进程进行评分，或者通过本地 ollama HTTP 调用进行评分（用于免费、私密、离线标注）。接受一个 reasoning_effort 参数（ low 、 medium 、 high ，用于 Codex 标注）和一个 ollama_base_url 参数，用于指向远程 Ollama 服务器。 get_annotation_job_status ：检查正在运行或已完成的标注作业的进度。 cancel_annotation_job ：取消正在运行的后台标注作业。取消前已完成的行将保留在输出文件中。 借助这些工具，您可以： 直接代码执行 ：AI 可以在您当前 RStudio 会话中编写、执行和安装软件包。 反馈与帮助 ：获取 R 脚本的解释或请求对特定行进行编辑。 可视化 ：人工智能可以生成、查看和改进图表和可视化效果。 数据分析 ：让人工智能分析您的数据集并迭代提供见解。 多代理工作流 ：在同一个 R 会话中同时运行 Claude Desktop、Claude Code、Codex、Qwen Code 和 Gemini CLI。每个代理都有唯一的标识符，它们可以通过共享的历史记录和日志文件查看彼此的工作。 长时间运行分析 ：异步执行可处理模型拟合、模拟和大数据处理，而不会超时。 代码日志记录 ：将人工智能执行的所有代码保存到日志文件中，以供将来参考。每个条目都会标记执行它的代理。 控制台打印 ：在执行前将 AI 的代码打印到控制台。 环境集成 ：人工智能可以访问 R 环境中的变量和函数。 动态摘要 ：摘要可以动态地从对象和数据框中提取结果，以防止出现幻觉。 Quarto 渲染 ：人工智能可以创建和渲染 Quarto 演示文稿。为了获得最佳效果，请提供.qmd 文件，并在完成后将其渲染为 HTML 格式。 Reviewer Zero ：一套用于自动化学术审核的内置协议。该人工智能系统逐段读取稿件，将每一项统计结论提取到注册表中，验证提取结果，然后根据作者的 R 代码重新计算每一项结论。运行 reviewer_zero_prompt() 可查看完整协议。请参阅下方的 Reviewer Zero 部分。 数据标注 ：使用内置标注工具逐行标注 CSV 数据集。在 _schema 列中定义标注模式，运行 data_annotation_prompt() 获取协议，然后使用 run_annotation_job 以交互方式或完全隔离的逐行子进程模式进行标注。 Reviewer Zero：自动化学术审核 # ClaudeR 内置了一套基于人工智能的学术论文技术评审协议。人工智能充当\"零号审稿人\"的角色：系统地验证论文中的每个 p 值、系数和置信区间是否与生成它们的程序代码相符。 工作原理（4次扫描协议）： 提取 ：AI 使用分页 read_file 逐块读取您的手稿，将每个定量和方法论主张提取到结构化注册表中（在您的 RStudio 环境窗格中可见的数据框）。 验证 ：人工智能会重新读取每条声明的源代码，以确认没有误读数值。所有声明都验证完毕后，代码才会运行。 重新计算 ：人工智能使用 search_project_code 和 probe_scripts 查找相关的 R 脚本，然后执行 execute_r 重新运行分析，并将重新计算的值与原文进行比较。方法论上的断言（例如，\"零方差使得测试无法进行\"）会直接进行检验，而不是简单地接受其表面含义。 参考文献 ：人工智能使用 verify_references 从参考文献中提取 DOI，并逐一对照 CrossRef API 进行验证。元数据不匹配、DOI 无法解析以及缺少 DOI 的参考文献都会被标记出来。文中引用也会与参考文献进行交叉核对。 开始使用： # Print the full protocol prompt to give to your AI agent reviewer_zero_prompt() 该协议适用于 .docx 、 .pdf 、 .qmd 、 .Rmd 、 .tex 或纯文本稿件，并支持多脚本 R 项目。 R 最佳实践协议 # ClaudeR 内置了一套统计分析协议，其灵感来源于我从统计学课程中学到的建模工作流程，并结合我在实际统计工作中使用 AI 代理的经验教训不断完善。其目标是利用自然语言引导模型进行可复现的、理论驱动的分析，涵盖探索性数据分析 (EDA)、假设检验、模型构建、诊断、多重校正和报告生成。 # Print the full protocol to give to your AI agent r_best_practices_prompt() 你也可以直接告诉代理运行 ClaudeR::r_best_practices_prompt() ，它会自动读取协议。 多智能体协调协议 # 当两个或多个智能体共享同一个 RStudio 会话时，它们需要一种方法来分配工作，避免相互干扰。多智能体协议通过结构化的工作流程来解决这个问题：智能体通过读取会话日志进行签到，第一个智能体创建任务计划，智能体在开始任务前认领任务，并在任务完成后相互检查彼此的工作。 # Print the full protocol to give to your AI agents multi_agent_prompt() 你也可以直接告诉代理运行 ClaudeR::multi_agent_prompt() ，它们会自行读取协议。 人工智能驱动的数据标注 # ClaudeR 包含一个专为使用 AI 代理标注 CSV 数据集而设计的标注工作流程。该代理使用两个专用的 MCP 工具逐行处理数据集，无需在代理端编写任何代码。 CSV 格式： 在文件中添加一个 _schema 列，并在第一行使用简单的类型语法定义注释字段： text,label,confidence,_schema \"Some text\",\"\",\"\",\"label:choice[positive,negative,neutral];confidence:float[0,1]\" \"More text\",\"\",\"\",\"\" 支持的类型： choice[a,b,c] 、 float[min,max] 、 int[min,max] 、 bool 、 text 运行标注会话： # Print the full protocol to give to your agent data_annotation_prompt() 或者，您可以指示代理运行 ClaudeR::data_annotation_prompt() ，它将自动读取协议。然后，代理调用 load_annotation_data 开始 annotate ，并对每一行数据进行标记。原始文件不会被修改，会话中断后会自动恢复。 有两种标注模式可供选择： 默认的 load_annotation_data + annotate 流程在代理的现有对话中运行，上下文信息会逐行累积，这有助于保持一致性，但可能会在长数据集上引入锚定效应。要实现完全的行隔离，请改用 run_annotation_job ：它会为每一行生成一个新的 claude 、 codex 、 gemini 或 qwen 进程，或者将每一行发送到本地 ollama 服务器，因此每次标注都不会受到先前行的影响。 模式 1：完整上下文（交互式）： You are annotating a dataset. Your only job is to call annotation tools. Do not write code or use any other tools. Step 1: Call load_annotation_data with: - csv_path: /path/to/your/file.csv Step 2: For each row displayed, call annotate with the fields defined in the schema. Step 3: After each annotate call, the next row loads automatically. Keep annotating until you see \"Annotation complete.\" If you get a validation error, read it carefully and call annotate again with corrected values. 模式 2：独立上下文（每行一个子进程）： You are annotating a dataset. Step 1: Call run_annotation_job with: - csv_path: /path/to/your/file.csv - tool: claude # or \"codex\" / \"gemini\" / \"qwen\" / \"ollama\" - model: qwen2.5 # ollama only: any model tag you have pulled - reasoning_effort: high # codex only: low | medium | high - ollama_base_url: http://localhost:11434 # ollama only, defaults shown Step 2: Once you have the job ID, periodically call get_annotation_job_status with that ID to check progress. To stop early, call cancel_annotation_job with the job ID. Rows already annotated are preserved. That's it. The annotation runs automatically in the background. Do not call any other tools unless checking status. 工作原理 # ClaudeR 使用 模型上下文协议 (MCP) 在 AI 助手和您的 RStudio 环境之间建立双向连接。MCP 是 Anthropic 开发的开放协议，它允许 AI 安全地与本地工具和数据进行交互。 工作流程如下： Python MCP 服务器充当桥梁。 AI 向 MCP 服务器发送代码执行请求。 服务器将请求转发给在 RStudio 中运行的 R 插件。 代码在您的 R 会话中执行，并将结果发送回 AI。 该架构确保 AI 只能通过定义良好的接口执行已批准的操作，从而使您完全掌控您的 R 环境。 CLI 集成 # ClaudeR 支持命令行界面 (CLI) 工具： Claude Code CLI 、 OpenAI Codex CLI 、 Qwen Code CLI 和 Google Gemini CLI 。这对于喜欢基于终端的工作流程的开发者来说非常理想，他们可以直接从命令行与 AI 助手交互，同时保持与 RStudio 会话的实时连接。 MCP 配置命令速查 # 以下是在各 AI 工具中注册 clauder-mcp （即 ClaudeR MCP 桥接组件）的原始命令，使用 uvx 零配置运行： Claude Code： claude mcp add --transport stdio --scope user r-studio -- uvx clauder-mcp Codex CLI： codex mcp add r-studio -- uvx clauder-mcp Qwen Code CLI： qwen mcp add --scope user --transport stdio r-studio uvx clauder-mcp Gemini CLI（添加到 ~/.gemini/settings.json ）： { \"mcpServers\": { \"r-studio\": { \"command\": \"uvx\", \"args\": [\"clauder-mcp\"] } } } Claude Desktop / Cursor（添加到 MCP 配置文件）： { \"mcpServers\": { \"r-studio\": { \"command\": \"uvx\", \"args\": [\"clauder-mcp\"] } } } 与使用 install_cli() 辅助函数相比，上述命令跳过 R 包安装步骤直接注册 MCP 服务器，适合已安装 ClaudeR 后的快速配置或手动排查连接问题。 安全模型 # ClaudeR 是一款 受监督的强大工具 。该代理会在您的 RStudio 实时会话中执行 R 代码，该会话也包含您的数据和变量。您应该像运行同事的代码一样，仔细检查它的运行结果。 ClaudeR 阻止了什么 # 系统命令 ： system() 、 system2() 、 shell() 及相关调用被阻止，以防止代理程序访问 R 外部。 文件删除 ：禁止 unlink() 、 file.remove() 以及包含 rm 的 shell 命令。 错误反馈 ：阻塞的操作会返回清晰的错误消息，解释原因。 ClaudeR 不限制的内容 # 代理程序仍然可以读取文件、安装软件包、创建/覆盖环境中的对象以及消耗计算资源。这些对于代理程序的正常运行至关重要，但也意味着您应该： 使用日志记录 （默认启用），以便您可以完整记录代理执行的每一行代码以及运行该代码的代理。 在项目目录中进行操作 ，以限制代理可以看到的内容。 信任之前先审核 ：特别是对于 Reviewer Zero 审核，应将输出结果视为草稿审核，需要进行验证。 这些限制仅适用于人工智能执行的代码。您手动执行的 R 代码不受影响。 安装 # 步骤 1：从 GitHub 安装 ClaudeR # 在 RStudio 控制台中运行以下命令： if (!require(\"devtools\")) install.packages(\"devtools\") devtools::install_github(\"IMNMV/ClaudeR\") 步骤 2：运行正确的安装程序 # 选择符合您工作流程的选项。 选项 A：适用于桌面应用程序（Claude Desktop / Cursor） 此函数会自动配置桌面应用程序的 MCP 配置文件。默认情况下，它使用 uvx 运行 clauder-mcp PyPI 包，该包会自动处理所有 Python 依赖项。 # Load the package library(ClaudeR) # Run the installer for Claude Desktop install_clauder() # Optional: For Cursor users # install_clauder(for_cursor = TRUE) 对于无法使用 uvx 用户（例如受限环境），请回退到传统的 Python 路径方法： library(ClaudeR) install_clauder(use_uvx = FALSE, python_path = \"/path/to/your/python\") 选项 B：适用于 CLI 工具（Claude Code / Codex / Qwen / Gemini） 这个非交互式函数会生成 CLI 工具所需的精确命令或 JSON 配置。 library(ClaudeR) # For Claude Code CLI install_cli(tools = \"claude\") # For OpenAI Codex CLI install_cli(tools = \"codex\") # For Qwen Code CLI (requires \\`npm install -g @qwen-code/qwen-code\\`) install_cli(tools = \"qwen\") # For Google Gemini CLI install_cli(tools = \"gemini\") 对于无法使用 uvx 的用户，请回退到传统的 Python 路径方法： install_cli(tools = \"claude\", use_uvx = FALSE, python_path = \"/path/to/my/python\") 运行该函数后，您必须 手动应用配置 ： 对于 Claude / Codex / Qwen ：复制 R 控制台中打印的命令，并在终端中运行它。 对于 Gemini ：复制生成的 JSON 并手动将其添加到您的 gemini.json 设置文件中。 设置完成后， 请退出并重新启动 所有正在运行的桌面应用程序或终端会话，以便加载新设置。 注意 ：如果您升级了 R 版本，请重新运行 install_cli() 或 install_clauder() 以更新 MCP 服务器路径。CLI 安装程序会在添加新注册信息之前自动删除过期的注册信息。 用法 # 第一部分：在 RStudio 中 # 对于 所有 工作流程，您必须首先从 RStudio 启动 ClaudeR 服务器。 library(ClaudeR) claudeAddin() ClaudeR 插件将出现在 RStudio 查看器窗格中。点击 \"启动服务器\" 。在使用您喜欢的工具时，请保持此窗口处于活动状态。 第二部分：在你的 AI 工具中 # 对于桌面应用程序 ：打开 Claude 桌面应用程序或光标，然后开始您的会话。 对于 CLI 工具 ：打开终端并使用 claude 、 codex 、 qwen 或 gemini 命令开始与您的 AI 助手进行交互。 注意：您可以通过单击 RStudio 控制台中的停止按钮来重新获得控制台/活动文档的控制权。这将关闭 Shiny UI，但 MCP 服务器会在后台继续运行，您的 AI 代理也会保持连接。重新运行 claudeAddin() 即可恢复查看器窗格，并保持相同的服务器状态（端口、会话名称、执行计数）。要完全停止服务器，请在关闭前单击 UI 中的 \"停止服务器\" 。 日志记录选项 # 将代码打印到控制台 ：在 AI 运行之前，您可以在 R 控制台中查看其代码。代码前面会显示标题： ### LLM [agent-id] executing the following code ### 。 将代码记录到文件 ：将所有执行的代码保存到日志文件中。每个条目都会标记执行该条目的代理 ID，因此您可以追踪哪个 AI 代理执行了哪些操作。 自定义日志路径 ：指定日志文件的自定义位置。 描述性文件名 ：日志文件命名为 clauder_\u003csession\u003e_\u003cport\u003e_\u003ctimestamp\u003e.R （例如 clauder_default_8787_20260301_143022.R ），这样您就可以一目了然地知道哪个会话生成了哪个日志。 可复现性头部信息 ：每条日志都以一个头部信息开头，其中包含日期、工作目录和完整的 sessionInfo() 输出（R 版本、平台、已加载/附加的包）。这使得日志具有自文档性，便于复现。 导出干净脚本 ：在日志面板中单击\"导出干净脚本\"以生成一个可运行的 .R 文件，该文件已去除所有时间戳和日志头。错误块将保留为注释，以便您可以查看出错原因。也可以使用 export_log_as_script() 从控制台调用。 每次单击 \"启动服务器\" 时，都会创建一个新的日志文件。代理执行的所有代码都会追加到该文件中，直到您停止并再次启动服务器为止。 交互示例 # \"我的环境中有一个名为 data 的数据集。请对其执行探索性数据分析。\" \"加载 mtcars 数据集，并创建 mpg 与 hp 的散点图，并添加趋势线。\" \"根据 wt 和 hp 拟合线性模型来预测 mpg 。\" \"为 iris 数据集生成相关矩阵并将其可视化。\" 我有一个 QMD 文件正在运行。请制作一个关于梯度下降的精美四开本演示文稿。听众都是技术人员。请确保演示文稿流畅美观。请将演示文稿保存在/Users/nyk/QuartoDocs/文件夹中。 如果你能用 R 语言做到，你的 AI 助手也能做到。 重要提示 # 会话持久性 ：AI 创建的变量、数据和函数将保留在您的 R 会话中。 代码可见性 ：默认情况下，AI 的代码会打印到您的控制台。 端口配置 ：默认端口为 8787 ，但您可以根据需要更改它。方法一：在 Shiny 插件界面的 Advanced 设置中手动改端口；方法二：用 claude_rstudio_addin(port = 21015) 启动指定端口。 软件包安装 ：AI 可以安装软件包。请使用清晰的提示来引导其行为。如果您注重可复现性，请在 renv 项目中进行操作： renv 会劫持当前会话的 install.packages() 函数，因此代理的安装会进入您的项目库，而不是全局库。 停止连接 ：关闭 Shiny 插件（控制台中的\"停止\"按钮或\"完成\"）并 不会 终止 MCP 服务器。重新运行 claudeAddin() 函数即可恢复 Viewer 并保持相同的服务器状态。要彻底停止桥接，请在关闭插件前，在插件界面中点击 \"停止服务器\" 。 故障排除 # 连接问题 ： 请确保您的 AI 工具配置正确。 请检查 config 或 CLI 命令中的 Python 路径。 请确保服务器在插件中正在运行。 如果端口正在使用，请重启 RStudio。 Python 依赖问题 ： could not find function install_clauder ：请重新启动 R 会话（ Session -\u003e Restart R ）并重试。 MCP 服务器启动失败 ：如果使用 uvx ，请确保已安装 uv （ curl -LsSf https://astral.sh/uv/install.sh | sh ）。如果使用旧方法，这通常意味着检测到了错误的 Python 环境。请使用正确的 python_path 重新运行安装程序，或将 use_uvx = TRUE 。 人工智能看不到结果 ： 请确保加载项窗口已打开且服务器正在运行。 图表未显示 ： 指示 AI 将绘图对象包装在 print() 中（例如， print(my_plot) ）。 告诉 AI 使用 execute_r_with_plot 函数。 长时间运行的代码超时 ： 要求 AI 对执行时间超过 25 秒的代码使用 execute_r_async 。 AI 将使用 get_async_result 自动轮询结果。 异步作业通过 callr 在单独的 R 进程中运行， 无法 访问主会话的环境。AI 必须编写独立的代码，使用 saveRDS() 传入数据并输出结果，然后在作业完成后将结果加载回主会话。 服务器重启问题 ： 如果在重启服务器后看到\"地址已被占用\"的错误提示，这是用户界面错误，服务器仍然处于运行状态。如果遇到连接问题，请在查看器窗格中切换端口号或重启 RStudio。 如果 AI 仍然无法连接，请点击\"高级\"设置下的 \"强制释放端口\" 。这将强制终止占用端口的进程，以便您可以重新开始。 R 升级后 MCP 路径失效 ： 如果在升级 R 后工具停止工作，请重新运行 install_cli() 或 install_clauder() 以更新脚本路径。 局限性 # 每个 R 会话一次只能连接到一个 Claude Desktop/Cursor 应用程序。但是，多个 CLI 代理（Claude Code、Codex、Qwen Code、Gemini）可以与一个 Desktop 应用程序共享同一个会话。要隔离不同的代理，请使用不同的会话名称和端口运行单独的 RStudio 窗口。 R 语言是单线程的，但异步作业会通过 callr 在单独的进程中运行，因此主会话保持响应。默认情况下，后台进程不共享主会话的环境。可以使用 execute_r_async 的 inputs / outputs 参数自动编组输入和输出数据，或者编写独立的代码手动使用 saveRDS() / readRDS() 函数。 执照 # 本项目采用 MIT 许可证 。详情请参阅 LICENSE 文件。 贡献 # 欢迎贡献代码！请随时提交 Pull Request。","tags":["clippings","MCP","RStudio","Claude_Code","Codex","multi_agent","Reviewer_Zero","AI_workflow","已试用"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"网页剪藏","updated":"2026-10-25T17:37:28.603Z","url":"ai-automation/notes/a7974a32b1f3b17b92588575.html"},{"kbId":"KB-000094","title":"chenhg5/cc-connect: Bridge local AI coding agents (Claude Code, Cursor, Gemini CLI, Codex) to messaging platforms (Feishu/Lark, DingTalk, Slack, Telegram, Discord, LINE, WeChat Work). Chat with your AI dev assistant from anywhere — no public IP required for most platforms.","subtitle":"","summary":"Bridge local AI coding agents (Claude Code, Cursor, Gemini CLI, Codex) to messaging platforms (Feishu/Lark, DingTalk, Slack, Telegram, Discord, LINE, WeChat Work). Chat with your AI dev assistant from anywhere — no public IP required for most platforms. - chenhg5/cc-connect","body":"English | 中文 随时随地，通过任何聊天应用控制您的本地 AI 代理。 cc-connect 将运行在您机器上的 AI 代理与您已使用的消息平台连接起来。 代码审查、研究、自动化、数据分析——人工智能代理能做的任何事情， 现在可以通过手机、平板电脑或任何装有聊天应用程序的设备访问。 🆕 最新动态（测试版） # 这些亮点功能目前仅存在于 测试版/预发布 版本中——请安装 cc-connect@beta 或获取 预发布 二进制文件。它们 尚未 包含在默认的 稳定 版本中；在正式发布之前，相关细节可能会有所更改。 个人微信 — 通过 ilink 长轮询技术，使用 微信（个人版） 与您的本地代理聊天；二维码 weixin setup ，CDN 媒体，无公网 IP。 设置 → docs/weixin.md 自动压缩 — 当会话估计超过您的阈值时，cc-connect 可以修剪上下文，以便长时间运行的线程能够继续工作，而不是默默地崩溃。 更友好的 --continue — 继续时会创建子进程，这样你的桥接会话就不会意外地继承一个未完成的 CLI 终端会话。 带有边界的 Cron — 每次都在 新的会话 中运行作业，并限制 每个作业的超时时间 ，以防止失控的任务阻塞机器人。 更丰富的平台 ——例如 Discord 的 @everyone / @here 、 Telegram 的 语音回复、 Feishu 对回复线程和异步分发的修复。 🧩 平台功能概览 # cc-connect 中各个 内置平台 功能的概览。灵感源自 OpenClaw China 的功能矩阵 ——方便用户一目了然地比较不同渠道。 传奇 象征 意义 ✅ 在典型的配置下，可在 稳定的 cc-connect 环境中工作 ✅（测试版） 仅限 Beta 版/预发布版 — 微信（个人） 栏：安装 cc-connect@beta 或 预发布版二进制文件 ； 尚未包含 在默认的稳定版 npm 构建中 ⚠️ 部分功能，需要额外配置（例如语音/自动语音识别），或受限于供应商应用程序或 API ❌ 不支持或实际不适用 † QQ（NapCat / OneBot） — 非官方的自托管桥接器；其行为取决于您的 NapCat / 网络设置。 能力 Feishu 钉钉 电报 松弛 Discord LINE 韦康 威贡 （个人的） QQ† QQ 机器人 文本和斜杠命令 ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅（测试版） ✅ ✅ Markdown / 卡片 ✅ ✅ ✅ ✅ ✅ ⚠️ ⚠️ ✅（测试版） ✅ ✅ 流式/分块回复 ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅（测试版） ✅ ✅ 图片和文件 ✅ ✅ ✅ ✅ ✅ ⚠️ ✅ ✅（测试版） ✅ ✅ 语音/STT/TTS ⚠️ ⚠️ ✅ ⚠️ ⚠️ ❌ ⚠️ ✅（测试版） ⚠️ ⚠️ 私信（DM） ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅（测试版） ✅ ✅ 群组/频道 ✅ ✅ ✅ ✅ ✅ ⚠️ ✅ ✅（测试版） ✅ ✅ 微信栏目： 每个 ✅（beta） 表示“仅在运行 beta/预发布 版本时可用”，并不表示该功能不完整——整个 个人微信（ilink） 通道仍处于 预稳定阶段 。 WeCom： Webhook 模式需要 公共 URL ；长连接/WS 风格的设置通常不需要。 语音行： 许多平台需要在 config.toml 中启用 [speech] / TTS 提供商；值是尽力而为的摘要。 平台设置： 平台设置指南 如下。 ✨ 为什么选择 cc-connect？ # 🤖 通用代理支持 # 7 款 AI 代理 ——Claude Code、Codex、Cursor Agent、Qoder CLI、Gemini CLI、OpenCode、iFlow CLI。您可以根据工作流程选择合适的代理，也可以同时使用全部代理。 📱 平台灵活性 # 10 个聊天平台 ——飞书、钉钉、Slack、Telegram、Discord、企业微信、LINE、QQ、QQ Bot（官方版），以及用于 个人微信的 微信（个人 ilink） 。 个人微信 目前仅提供测试版/预发布版本 ——请安装 cc-connect@beta 或 GitHub 预发布 二进制文件；默认的 稳定 版 npm 包 尚未 包含 weixin 平台。大多数平台不需要 公网 IP 地址 。 🔄 多智能体编排 # 多机器人接力 ——将多个机器人绑定到一个群聊中，让它们彼此交流。向 Claude 提问，从 Gemini 获取见解——所有这一切都可以在一次对话中完成。 🎮 完全聊天控制 # 通过聊天进行完全控制 ——切换模型（ /model ）、调整推理（ /reasoning ）、更改权限模式（ /mode ）、管理会话，所有操作均可通过斜杠命令完成。 聊天中的目录切换 — 使用 /dir \u003cpath\u003e 更改下一个会话的起始位置（兼容别名是 /cd \u003cpath\u003e ），还可以通过 /dir \u003cnumber\u003e / /dir - 快速跳转到历史记录。 🧠 持久内存 # 代理内存 — 无需接触终端即可读取和写入代理指令文件（ /memory ）。 ⏰ 智能调度 # 定时任务 ——用自然语言设置定时任务。 “每天早上 6 点，汇总 GitHub 热搜” 就能轻松实现。 🎤 多模态支持 # 语音和图像 — 发送语音消息或屏幕截图；cc-connect 处理 STT/TTS 和多模式转发。 📦 多项目建筑 # 多项目 ——一个流程，多个项目，每个项目都有自己的代理+平台组合。 🌍 多语言界面 # 支持 5 种语言 ——原生支持英语、中文（简体和繁体）、日语和西班牙语。内置 i18n 功能，确保每位用户都能轻松上手。 左：Lark | Telegram | 右：微信 🚀 快速入门 # 🤖 通过 AI 代理安装和配置（推荐） # 最简单的方法 ——将此文件发送给 Claude Code 或任何 AI 编码代理，它将为您处理整个安装和配置过程： Follow https://raw.githubusercontent.com/chenhg5/cc-connect/refs/heads/main/INSTALL.md to install and configure cc-connect. 📦 手动安装 # 通过 npm： # Stable version npm install -g cc-connect # Beta version (more features, may be unstable) npm install -g cc-connect@beta 个人微信（Weixin ilink）： 仅在 beta/预发布 版本中可用（ cc-connect@beta 或 Releases 下的预发布资源）。 稳定的 npm install -g cc-connect 在正式版发布前 不 包含此平台。 从 GitHub Releases 下载二进制文件： # Linux amd64 - Stable curl -L -o cc-connect https://github.com/chenhg5/cc-connect/releases/latest/download/cc-connect-linux-amd64 chmod +x cc-connect sudo mv cc-connect /usr/local/bin/ # Beta version (from pre-release) curl -L -o cc-connect https://github.com/chenhg5/cc-connect/releases/download/v1.x.x-beta/cc-connect-linux-amd64 从源代码构建（需要 Go 1.22+）： git clone https://github.com/chenhg5/cc-connect.git cd cc-connect make build ⚙️ 配置 # mkdir -p ~/.cc-connect cp config.example.toml ~/.cc-connect/config.toml vim ~/.cc-connect/config.toml 在项目中设置 admin_from = \"alice,bob\" 以允许这些用户 ID 运行 /dir 和 /shell 等特权命令。当用户运行 /dir reset 时，cc-connect 会恢复配置的 work_dir 并清除存储在 data_dir/projects/\u003cproject\u003e.state.json 下的持久化覆盖。 ▶️ 运行 # ./cc-connect 🔄 升级 # # npm npm install -g cc-connect # Binary self-update cc-connect update # Stable cc-connect update --pre # Beta (includes pre-releases) 📊 支持矩阵 # 成分 类型 地位 代理人 克劳德·科德 ✅ 已支持 代理人 Codex（OpenAI） ✅ 已支持 代理人 光标代理 ✅ 已支持 代理人 Gemini CLI（谷歌） ✅ 已支持 代理人 Qoder CLI ✅ 已支持 代理人 OpenCode（Crush） ✅ 已支持 代理人 iFlow CLI ✅ 已支持 代理人 鹅（方块） 🔜 计划中 代理人 帮助 🔜 计划中 平台 Feishu (Lark) ✅ WebSocket — 无需公网 IP 平台 钉钉 ✅ 流媒体播放——无需公共 IP 地址 平台 电报 ✅ 长轮询——无需公共 IP 地址 平台 松弛 ✅ 套接字模式——无需公网 IP 平台 Discord ✅ 网关 — 无需公网 IP 平台 LINE ✅ Webhook — 需要公开 URL 平台 企业微信 ✅ WebSocket / Webhook 平台 微信（个人，ilink） ✅（测试版）— HTTP 长轮询 — 无需公网 IP 平台 QQ（NapCat/OneBot） ✅ WebSocket — Beta 平台 QQ Bot（官方） ✅ WebSocket — 无需公网 IP 📖 平台设置指南 # 平台 指导 联系 公网 IP？ Feishu (Lark) docs/feishu.md WebSocket 不 钉钉 docs/dingtalk.md 溪流 不 电报 docs/telegram.md 长投票 不 松弛 docs/slack.md 套接字模式 不 Discord docs/discord.md 网关 不 企业微信 docs/wecom.md WebSocket/Webhook 否（WS）/ 是（Webhook） Weixin (personal) docs/weixin.md HTTP 长轮询 (ilink) — 仅限测试版 不 QQ/QQ 机器人 docs/qq.md WebSocket 不 🎯 主要功能 # 💬 会话管理 # /new [name] Start a new session /list List all sessions /switch \u003cid\u003e Switch session /current Show current session /dir [path|reset] Show, switch, or reset work directory 项目配置在长时间不活动后也可以自动轮换到新的会话： \u003ca href=\"projects\"\u003eprojects\u003c/a\u003e reset_on_idle_mins = 60 🛡️操作系统用户隔离（以用户 run_as_user ） # 在 Linux/macOS 系统上，项目可以以不同的 Unix 用户身份运行其代理，从而实现操作系统级别的文件系统隔离，使其与运行 cc-connect 的管理用户保持隔离。目前 Claude Code 支持此功能。 \u003ca href=\"projects\"\u003eprojects\u003c/a\u003e name = \"claude-sandboxed\" run_as_user = \"partseeker-coder\" run_as_env = [\"PGSSLROOTCERT\"] 目标用户需要从管理员处获得免密码 sudo 权限，自身不具备 sudo 权限，对 work_dir 拥有读写权限，并且需要拥有自己的 ~/.claude/settings.json 使用代理使用的任何凭据。如果您通过以下方式进行身份验证： claude.ai OAuth，创建指向目标用户 ~/.claude/.credentials.json 的符号链接 更新到主管的副本，以便令牌刷新保持同步——参见 环境传播检查清单 详情请见。 docs/usage.md 完整设置。 启动 cc-connect 之前，请使用以下命令审核设置： cc-connect doctor user-isolation 该程序运行三个允许/禁止的预检门和一个隔离探测器，用于报告目标用户可以读取和不能读取的内容。如果任何一个预检门失败，或者探测器检测到跨用户泄漏，cc-connect 将拒绝启动。 🔐 权限模式 # /mode Show available modes /mode yolo # Auto-approve all tools /mode default # Ask for each tool 🔄 供应商管理 # /provider list List providers /provider switch \u003cname\u003e Switch API provider at runtime 🤖 型号选择 # /model List available models (format: alias - model) /model switch \u003calias\u003e Switch to model by alias 📂 工作目录 # /dir Show current work directory and history /dir \u003cpath\u003e Switch to a path (relative or absolute) /dir \u003cnumber\u003e Switch from history /dir - Switch to previous directory /cd \u003cpath\u003e Compatibility alias for /dir \u003cpath\u003e ⏰ 计划任务 # /cron add 0 6 * * * Summarize GitHub trending 📎 代理附件发送返回 # 当客服人员生成本地屏幕截图、图表、PDF、文件包或其他文件时，可以将该附件发送回当前聊天。 首个版本支持： Feishu 电报 如果您的代理程序没有原生注入系统提示符，请在升级后在聊天窗口中运行以下命令： /bind setup 或者： /cron setup 这样可以刷新项目内存文件中的 cc-connect 指令，以便代理知道如何发送附件。 您可以在 config.toml 中全局控制此功能： attachment_send = \"on\" # default: \"on\"; set to \"off\" to block image/file send-back 此开关与代理的 /mode 无关。它仅控制 cc-connect send --image/--file 。 例如： cc-connect send --image /absolute/path/to/chart.png cc-connect send --file /absolute/path/to/report.pdf cc-connect send --file /absolute/path/to/report.pdf --image /absolute/path/to/chart.png 笔记： 绝对路径是最安全的选择。 --image 和 --file 都可以重复使用。 attachment_send = \"off\" 仅禁用附件发送功能；普通文本回复功能仍然有效。 此命令用于生成附件，不适用于普通文本回复。 📖 完整文档： docs/usage.md 📚 文档 # 使用指南 — 完整功能文档 INSTALL.md — 适用于 AI 代理的安装指南 config.example.toml — 配置模板 CONTRIBUTING.md — 如何报告问题和提交拉取请求 👥 社区 # Discord 电报 ❤️赞助商 # 想在这里展示您的内容吗？请联系我们： 邮箱 ： chg80333@gmail.com | 微信 ：mongorz | Telegram | Discord 赞助商 成为赞助商！我们为用户提供专属福利。联系我们了解更多赞助机会。 ☕ 支持本项目 # 如果您觉得 cc-connect 对您有所帮助，不妨请我们喝杯咖啡！您的支持对我们至关重要： 🛠️ 维护和改进项目 📚 编写更好的文档和教程 🐛 更快地修复漏洞并添加新功能 ☕ 让开发者们保持咖啡因摄入 如何捐款 # 请我喝杯咖啡 ： https://buymeacoffee.com/cg33 微信支付/支付宝 ： 微信支付 恭喜！ 感谢捐赠者们！🎉 # 我们衷心感谢所有支持本项目的人。如果您希望在此处获得鸣谢，请在捐赠留言中留下您的 GitHub 用户名！ 🤝 商业合作 # 我们接受以下商业合作： 企业定制 ：针对内部 AI 工具（飞书、钉钉、企业微信、Slack 等）的定制部署 技术咨询 ：人工智能代理集成和架构设计 外包项目 ：人工智能相关系统开发 联系方式 ： 邮箱 ： chg80333@gmail.com | 微信 ：mongorz | Telegram | Discord 🙏 贡献者 # ⭐ 明星历史 # 📄 许可证 # MIT 许可证 Built with ❤️ by the cc-connect community","tags":["clippings"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"网页剪藏","updated":"2026-10-25T17:37:28.602Z","url":"ai-automation/notes/e42ce5f45a42afb8b93f51c3.html"},{"kbId":"KB-000095","title":"Claude Desktop app安装错误解决，Windows下安装Claude Cowork、Claude Codex","subtitle":"","summary":"文章浏览阅读1.3w次，点赞26次，收藏25次。Claude Desktop 的安装程序采用的是\\\"引导程序 + 在线下载\\\"模式——你下载的那个小 exe 本身不包含完整应用，运行时它会联网去服务器拉取完整安装包。我在官网下载了Claude 的桌面版，就是想在windows上安装Claude Desktop 使用Claude Cowork与Claude Code，但是出现了下面的问题。安装 MSIX 时如果报权限错误，去 Windows 设置 → 系统 → 开发者选项，打开\\\"开发人员模式\\\"，然后重新执行上面的 PowerShell 命令。_claude desktop","body":"https://code.claude.com/docs/en/overview#desktop-app 我在官网下载了Claude 的桌面版，就是想在windows上安装Claude Desktop 使用Claude Cowork与Claude Code，但是出现了下面的问题 报错内容为： Download failed. Check your internet connection and try again. Diagnostic log saved to: C:\\Users\\winston\\AppData\\Local\\Temp\\ClaudeSetup.log 然后我去问 大模型 怎么解决： https://claude.ai/share/4d5b2114-46b3-4460-9af3-a353628585c7 解决方案如下： 我才用的方案二 This is a common installation issue. Let me search for the latest troubleshooting info.你遇到的\"Download failed\"错误是一个比较常见的问题。Claude Desktop 的安装程序采用的是\"引导程序 + 在线下载\"模式——你下载的那个小 exe 本身不包含完整应用，运行时它会联网去服务器拉取完整安装包。如果网络环境涉及代理、防火墙或 CDN 节点不稳定，引导程序就可能下载失败。 以下是几个解决方案，从简单到复杂： 方案一：基础排查 关闭 VPN/代理，或者反过来——如果你在国内，尝试开启代理（安装程序需要访问 storage.googleapis.com ） 暂时关闭杀毒软件和防火墙，重新运行安装程序 右键安装程序，选择\"以管理员身份运行\" == 方案二：直接下载 MSIX 手动安装（推荐） == ==绕过那个有问题的 exe 安装程序，直接下载 MSIX 安装包。具体步骤：== ==用浏览器访问这个链接下载 MSIX 文件： https://claude.ai/api/desktop/win32/x64/msix/latest/redirect == ==下载完成后， 不要双击 打开== ==在 Windows 搜索栏输入 PowerShell，右键选择\"以管理员身份运行\"，然后执行命令：== Add-AppxPackage -Path \"C:\\Users\\你的用户名\\Downloads\\Claude.msix\" powershell1 ==（把路径替换为你实际的下载位置）== ==如果命令执行后没有报错、光标直接回到新行，就说明安装成功了。== 方案三：如果提示需要开发者模式 安装 MSIX 时如果报权限错误，去 Windows 设置 → 系统 → 开发者选项，打开\"开发人员模式\"，然后重新执行上面的 PowerShell 命令。 大多数情况下方案二就能解决问题，因为浏览器下载比那个引导程序更能正确处理网络代理。试试看，有问题再告诉我。","tags":["clippings"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"网页剪藏","updated":"2026-10-25T17:37:28.602Z","url":"ai-automation/notes/691bb59ca09a942f62215787.html"}]</script><footer class="site-footer">检索范围与阅读站点一致。编号与页面均为公开内容；待归库、日志、模板与私密笔记不进入搜索。</footer></main>
