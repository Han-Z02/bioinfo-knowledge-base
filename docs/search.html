中 scANVI、scVI、Scanorama、scGen 表现较稳；HVG 筛选通常有利，scaling 更偏向增强批次效应去除。 证据线索： 文中给出 DOI 10.1038/s41592-021-01336-8 与代码仓库 https://github.com/theislab/scib-reproducibility ，适合作为后续精读与复现入口。 关联页面建议： 可后续整合到 03 生信教程与工具库/02_wiki/methods/单细胞批次整合方法选型 或项目方法页中。 下一步处理： 若要扩展为完整文献笔记、图表提取或汇报材料，建议继续调用 paper-import-workflow 。 归库说明： 已归入 02 文献精读与汇报库，置信度 0.89；依据为明确 DOI、论文型结构与方法基准比较内容。 阿野 2025年1月24日 23:13 老铁快点击蓝字 关注俺 生信碱移 68种单细胞批次整合方法的比较 整合多个批次的单细胞数据往往是把研究做大的第一步，来自德国慕尼黑工业大学的研究者测试了已有的 68 种单细胞批次整合方法，应该认为各位老铁提供一些选择参考。 单细胞图谱通常包括跨越不同位置、实验室和条件的样本，导致数据中存在复杂的嵌套批次效应。 目前，已经发表的文献中存在多种单细胞批次整合方法，并没有一致的评估标准来用于选择最合适的方法。 来自，来自德国慕尼黑工业大学的研究者 使用了 85 个批次的基因表达 、染色质可及性和模拟数据，涵盖 120 万细胞与 13 个图谱整合任务，测试了已有的 68 种单细胞批次整合方法 。作者根据可扩展性、易用性和其在去除批次效应同时保留生物变异性方面的表现来评估不同的整合方法与预处理组合（涉及 14 个评估指标）。 ▲ DOI: 10.1038/s41592-021-01336-8IF: 32.1 Q1 研究结果表明，高变基因的选择可以 提高 数据整合方法的性能，而数据缩放则 促使方法优先考虑 去除批次效应而非保留生物变异性。 总体而言， scANVI 、 Scanorama 、 scVI 和 scGen 表现良好，尤其是在复杂整合任务中表现尤为突出，而单细胞 ATAC-测序的整合性能则强烈依赖于特征空间的选择。 作者还提供了免费 Python 模块和基准测试管道用于识别新数据的最佳整合方法， 用于 benchmark 新方法并改进已有方法： https://github.com/theislab/scib-reproducibility 一、基于 16 种方法、13 项任务与 14 个指标的单细胞数据整合基准测试简介 # 该研究通过搭建 单细胞整合评估平台（scIB） ，在 13 个整合任务（含 2 个模拟任务、 5 个 scRNA-seq 任务和 6 个 scATAC-seq 任务）上 。 为检验方法的准确性、可用性和可扩展性， 研究设计了 14 个性能指标 从批次效应移除与生物学变异保持两大维度进行量化评估； 同时，考虑了多种输出格式（嵌入、矫正矩阵、集成图等）及不同的预处理策略（含/不含缩放与高变基因筛选） 。最终对高达 68 种不同方法与预处理组合进行了 590 次整合尝试，并通过新开发的指标（如基于图的 kBET 和 LISI 等）对结果进行多方面衡量，力求为用户提供可重复、可拓展的单细胞整合方法评估与选择框架。 ▲ 研究整体设计与评估方法。 二、在人类免疫细胞整合中的评估：多种方法在批次效应移除与生物学保真间的表现 # 在人类免疫细胞整合任务中，研究团队针对来自五个数据集、共计十个不同批次（供体）的外周血和骨髓细胞进行了整合测试。 结果显示， Scanorama (embedding 方式)、 FastMNN ( embedding 方式 ) 、 scANVI 以及 Harmony 的综合表现最优：它们在大幅减小批次间差异的同时，较好地保留了细胞类型及亚型的生物学特征。 具体来看，Scanorama 对 Smart-seq2 与 10X 等不同测序平台的整合效果更出色，scANVI 则在 处理完整转录本（Smart-seq2）数据 时出现剩余批次结构，Harmony 在 维持孤立标签的生物保真度 上表现不足。对于红细胞发育轨迹的还原，表现优异的方法均能保留从造血干细胞到成熟红细胞的连续性；而 DESC、scGen 和 Seurat v3 CCA 等方法则分别因过度聚类、缺失生物学潜在结构或过度合并细胞类型等原因导致轨迹保留不佳。 ▲ 多种方法在免疫细胞整合测试中的排名，图a只展示了部分结果，所有排名可以在补充文件获得。 三、多种场景与不同预处理策略的单细胞整合评估 # 在对五个 scRNA-seq 实际数据集和两个模拟数据集的整合任务进行评估后发现，整合方法的表现在不同任务间存在差异，主要受生物学复杂度和批次差异强度影响 。 通常，越复杂的生物学场景越容易出现“批次效应移除”与“生物学变异保持”之间的权衡。 例如， Seurat v3 、 Harmony 等在较简单的数据集或模拟情形下表现优异，但在更复杂的真实数据中可能无法兼顾这两方面； 而 Scanorama 、 scVI 及具备细胞类型先验信息的 scANVI 能在保留更多生物学信息的同时，仍然显著减少批次效应 。此外， scGen 与 scANVI 在生物学特征编码越精细（如细胞类型分辨更高）时，其整合效果越好，特别是在跨物种或跨测序模式（单细胞 vs. 单核）整合时能更好地平衡差异与变异。 在预处理方面，高变基因（HVG）筛选多半能带来更好的综合得分；而是否进行 scaling（标准化处理）则因方法而异，总体上有利于强化批次效应移除却会牺牲生物学变异保持。 基于邻近匹配（MNN）或深度学习（如 scVI、trVAE）的方法在细胞数目庞大、批次结构复杂时往往表现更佳。若使用 CPU，scGen 在超大规模数据（如百万级小鼠脑细胞数据）上的运行效率可能受到限制。 综合排名显示， Scanorama （embedding 输出）、 scVI 及 scANVI 在更真实的复杂场景中表现最为出色； 而 SAUCIE、DESC 等方法得分较低。 对需要跨物种整合且注重全球连续发育轨迹的应用而言，仍面临较大挑战，需要在保留精细生物学差异与减少批次效应之间进行权衡与选择。 ▲ 所有 RNA 整合任务和模拟的基准测试结果概述，包括易用性和可扩展性。 四、单细胞 ATAC-seq 批次整合：特征空间选择、可扩展性与方法平衡性评估 # 在三套小鼠大脑单细胞 ATAC-seq 数据（不同技术平台）上进行整合测试，结果显示不同特征空间（峰、窗口及基因活性）对整合效果影响明显：仅有不到三成（27%）的整合结果能优于未整合状态（尤其在峰特征空间中表现相对更好，基因活性特征空间则整体生物变异度较低）。 在 ATAC 任务中，多数方法的批次效应移除能力和生物学保真难以兼顾： LIGER 在峰和窗口两个特征空间中表现相对稳定，能较好地去除批次差异，但可能引入新的亚群结构； Harmony 整合后保留了较多生物学差异，但仍会出现部分小型神经元亚群的重叠； Seurat v3 RPCA 、 BBKNN 在小规模 ATAC 整合中具备一定平衡性，却无法彻底去除所有批次效应。 在可扩展性评估中，由于 ATAC-seq 特征数量庞大，仅 7/16 的方法能运行在含 9.4 万以上特征的“大规模”任务上。ComBat、BBKNN 和 SAUCIE 的运行时间最短，而 scVI、scANVI 与 BBKNN 最节省内存；相较之下，MNN、scGen 和 trVAE 对大规模数据的 CPU 时间或内存需求不具可行性。另外，在可用性（文档、教程、维护度及鲁棒性验证）上，Harmony、Seurat v3 与 BBKNN 表现最好，而 DESC、scANVI 及 trVAE 仍需改进。 ▲ 鼠脑 ATAC 整合任务的基准测试结果。 总结 # 在本基准研究中，作者使用 14 项指标对 16 种整合方法与 4 种预处理方式进行了综合评估，涵盖 13 个具备不同复杂度的单细胞整合任务（包括五个 scRNA-seq、两个模拟以及多个 scATAC-seq 任务）。 结果发现，方法表现与数据本身的生物学复杂度和批次差异强弱紧密相关： Harmony 适合较 简单且批次信号明显 的数据，但在真实且复杂的场景中通常无法排入前三（这个排名已经超乎小编的预期了，没想到Harmony的排名在60多种方法里面仍然具备一定竞争力）；当细胞类型注释可用时。 scGen 和 scANVI 能出色地 平衡批次校正与生物学变异保留 ； 若缺乏注释或数据量足够大 ， scVI 与 Scanorama 同样在复杂任务中表现优异； 对于 scATAC-seq 数据， LIGER 与 Harmony 侧重去除强批次效应，但可能牺牲某些生物学细节 ；以峰或窗口为特征空间通常能更好保持细胞类型特征； 深度学习方法（scGen、scANVI、scVI、trVAE 等）在更大规模、批次多样的任务上具备潜力 ，但对计算资源（如 GPU）和超参数优化的需求更高； 就可扩展性与实用性而言，BBKNN、ComBat、SAUCIE 在运行时间上表现相对较好，scVI、scANVI 在内存消耗上更具优势，而部分方法（如 MNN、scGen、trVAE）在百万级或上十万特征的整合任务上表现不佳。 作者最后给出了一套基于可用性、可扩展性与预期表现的选型建议，并指出如需兼顾罕见细胞状态发现与批次校正，应谨慎评估是否需要去除某些“混合”了生物信号的批次差异。 此外，结合自己的数据规模、下游分析需求（如轨迹分析、基因模块挖掘等）以及对 GPU 等硬件资源的可用程度，选择合适的整合方法至关重要。 ▲ 作者最后提供的图片，可以用于指导集成方法的选择。 今天就分享到这 马上要春节休息了 大家再跟小编冲一冲 END~ 仅供粉丝老铁们参考 如有侵权或错误，请联系删除改正～ 推荐好文，点击查看: 【教程】一文读懂孟德尔随机化！ 【工具】还在用单细胞非负矩阵分解吗？广义二值协方差分解+疾病异质性，又是遥遥领先了！（GBCD包） 【文献】Transofomer+图表示学习，16种泛癌的纯数据库深度学习又又又登上顶刊了！ 【期刊】收稿范围广泛！影响因子3+，中科院3区，近期刊登纯生信研究！ 生信文献分享 · 目录 继续滑动看下一个 生信碱移 向上滑动看下一个 闪记 复制 LaTeX 公式","tags":["clippings"],"section":"literature","sectionTitle":"文献整理","category":"网页文献","updated":"2026-10-25T17:37:28.559Z","url":"literature/notes/3d895a489020f8ad6fbdc7f7.html"},{"kbId":"KB-000018","title":"Advanced Science｜吉大/川大/南方医大联合：AI筛选甘草酸/辛伐他汀自组装纳米晶，破解骨髓炎感染-炎症-骨损三重死结","subtitle":"","summary":"AI 精准筛选甘草酸 / 辛伐他汀自组装纳米晶，一药打通杀菌、抗炎、骨修复全链条，破解细菌性骨髓炎临床治疗困局。","body":"摘要 LLM 归库摘要 核心内容： 吉林大学李冬松团队、四川大学邵丹团队、南方医科大学王亮团队联合在 Advanced Science 发表研究。构建 XGBoost 机器学习模型（准确率 0.81），从 144 组 FDA 药物对中筛选出甘草酸（GA）+辛伐他汀（Sim）组合，自组装形成无载体纳米晶 SGNCs（~17nm）。在大鼠骨髓炎模型中实现细菌彻底清除、骨微结构近乎完全修复（BV/TV 恢复至 22.62%，接近正常 24.34%）。机制上通过抑制 NF-κB 抗炎 + 激活 Wnt/β-catenin 促成骨双通路协同。 可复用知识： AI预测药物自组装的工作流（XGBoost分类器→200组训练集→144组候选打分）；无载体纳米晶的表征方法学（TEM/DLS/XRD/FTIR+分子动力学模拟）；骨髓炎动物模型评价体系（micro-CT/细菌培养/组织学/免疫组化）。 关联页面建议： 若需扩展为完整文献笔记，可调用 paper-import-workflow 深度整理。 下一步处理： 考虑是否精读原文并扩展为结构化 paper note；AI+纳米药物筛选的方法学设计值得在口腔相关课题中参考。 归库说明： 分类到 02 文献精读与汇报库，置信度 0.85，理由：Advanced Science 级别论文解读，包含完整 AI 筛选-实验验证-机制研究链条。 Advanced Science｜吉大/川大/南方医大联合：AI筛选甘草酸/辛伐他汀自组装纳米晶，破解骨髓炎感染-炎症-骨损三重死结 # 董好人 集思慧远医学 2026年7月30日 17:00 今天这篇由吉林大学李冬松团队、四川大学邵丹团队、南方医科大学王亮团队联合发表的研究，开发了一套AI辅助的无载体纳米晶筛选策略，从FDA批准的原料药库中精准锁定甘草酸（GA）+辛伐他汀（Sim）这对黄金组合，二者可自组装形成均一的纳米晶（SGNCs），单颗粒同时实现抗菌、抗炎、促骨再生三重功效，在大鼠细菌性骨髓炎模型中实现了细菌彻底清除与骨微结构的近乎完全修复。 作者思路 作者没有陷入传统的\"试错式合成\"，而是用计算筛选替代实验筛选，用AI模型预判组装可能性，搭建了一套\"疾病靶点挖掘→药物库构建→AI预测组装→实验验证功能\"的完整闭环。 疾病靶点锚定： 通过数据库挖掘骨髓炎相关基因，富集出免疫炎症与骨代谢两大核心通路，锁定关键调控靶点 候选药物库构建： 针对核心靶点，筛选出16种FDA批准的抗炎天然产物+9种成骨活性药物，两两组合生成144组候选药物对 AI模型预测： 基于200组已验证的API配对数据训练XGBoost机器学习模型，对144组组合进行自组装概率打分排序 实验验证闭环： 选取得分最高的组合进行制备优化，再从分子、细胞、动物多层面验证结构与功能 集思专业从事药物分子自组装、纳米酶、水凝胶、脂质体等多种纳米功能材料的研发和合成，需要的老师长按下面二维码联系 直播预告 中草药衍生碳点研究思路 核心发现：从AI预测到体内验证，完整闭环验证疗效 1.AI精准命中：144组候选中筛出最优自组装组合 研究首先构建了XGBoost机器学习分类器，在10折交叉验证中准确率达0.81±0.027，AUC-ROC、F1值等指标均显著优于KNN等传统模型，外部验证集召回率达73.0%，具备良好的泛化能力（ Fig.1d-i ）。 将模型用于144组候选药物对的筛选后， 辛伐他汀-甘草酸（Sim-GA）组合获得了最高的自组装概率得分（Fig.1j ） 。后续实验优化证实，当二者摩尔比为1:2时，可形成粒径分布最优、均一性最好的纳米晶SGNCs（ Fig.1k ）。 Fig1 2.结构表征+分子模拟：阐明自组装底层机制 通过多种表征手段与计算模拟，研究系统解析了SGNCs的结构特征与组装驱动力： 形貌结构： TEM显示SGNCs为均一球形，平均粒径约17nm，具有清晰的晶格条纹，证实其晶态结构；水合粒径约20nm，zeta电位-28.5mV，胶体稳定性优异（Fig.2a-c） 晶型与相互作用： XRD出现新的衍射峰，FTIR显示特征官能团峰位偏移，证明二者通过氢键形成了新的共晶相，而非简单物理混合（Fig.2d-e） 缓释与稳定： 体外48h缓慢同步释放，血清中7天稳定，冻干后180天性质不变（Fig.2f） 分子机制： 量子化学计算与600ns分子动力学模拟证实，二者表面电荷互补，自组装主要由范德华力、氢键和疏水作用共同驱动，组装后热力学稳定（Fig.2g-q） Fig2 3.体外三重功效：抗菌、抗炎、抗氧化全面覆盖 细胞层面实验证实，SGNCs实现了多功能的协同增效： 抗氧化： 在灭活金葡菌诱导的巨噬细胞氧化应激模型中，SGNCs清除ROS的效果显著优于游离药物与物理混合组，对H₂O₂诱导的细胞损伤保护作用更强（ Fig.3c-f ） 抗炎： 显著抑制M1型巨噬细胞极化，下调TNF-α等促炎因子分泌，抗炎效果远超单药与物理混合物（ Fig.3g-h ） 抗菌： 对金黄色葡萄球菌的抑菌、杀菌活性提升，还能强效抑制细菌生物膜形成，将生物膜量降至对照组的12%（ Fig.3i-j ）同时SGNCs具有良好的生物相容性，高浓度下骨髓间充质干细胞存活率仍高于90%（ Fig.3b ）。 Fig3 4.逆转感染抑制：高效恢复成骨分化能力 在细菌刺激抑制成骨的细胞模型中，SGNCs展现出优异的骨修复保护作用： 早期成骨指标ALP活性、晚期矿化结节形成均显著提升，效果明显优于辛伐他汀单药与物理混合组（ Fig.4a-c ） 分子层面显著下调促炎基因Tnf，上调成骨关键转录因子Runx2、成骨标志物Ocn以及修复相关因子Tgfb1，从基因水平验证了\"抗炎+成骨\"的协同调控（ Fig.4d-g ） Fig4 5.体内疗效惊艳：彻底清除细菌，近乎完全修复骨缺损 在大鼠胫骨骨髓炎模型中，SGNCs的治疗效果远超预期： 骨结构修复： micro-CT三维重建显示，SGNCs治疗组骨体积分数（BV/TV）恢复至22.62%，接近正常对照组的24.34%；骨密度、骨小梁厚度等指标均基本恢复至正常水平，远优于单药与混合组（ Fig.5a-d ） 细菌清除： 骨组织匀菌培养证实，SGNCs实现了彻底的细菌清除，菌落数与健康对照组无差异（ Fig.5e ） 组织学验证： HE染色显示炎症浸润基本消失，骨髓结构恢复正常；Masson染色可见大量新生骨基质；免疫组化证实巨噬细胞从促炎M1向修复M2表型转化；免疫荧光显示成骨标志物RUNX2、OCN显著上调（ Fig.6 ） Fig5 Fig6 6.机制揭秘：双通路协同调控抗炎与成骨 通过转录组测序与通路验证，研究阐明了SGNCs的分子作用机制： 转录组分析显示，SGNCs处理后样本的转录谱最接近正常组，共筛选出808个差异基因（ Fig.7a-c ） 通路富集证实，SGNCs显著抑制 细胞因子-细胞因子受体相互作用 等炎症通路，同时激活Wnt信号通路等骨再生程序（ Fig.7d-h ） 免疫荧光验证：SGNCs通过抑制NF-κB p65核转位发挥抗炎作用，通过上调β-连环蛋白激活Wnt通路促进成骨；通路抑制剂与基因敲低实验从正反两面验证了机制的特异性（ Fig.7i-j ） Fig7 7.安全长效：生物相容性优异，局部滞留更持久 安全性与体内行为研究进一步支撑了转化潜力： 4周治疗期间大鼠体重增长正常，肝肾功能指标无异常，主要脏器未见病理损伤，安全性良好（ Fig.8a-e ） 局部给药后，SGNCs在骨缺损处的滞留时间长达168h以上，远长于游离药物混合物，更适合局部长效治疗（ Fig.8f ） Fig8 三大创新，重构多功能纳米药研发范式 1.方法学创新：AI驱动的骨髓炎靶向纳米晶筛选平台 这是首个专门面向细菌性骨髓炎、兼顾\"自组装可行性+三重功能整合\"的AI筛选体系。它将无载体纳米晶的研发从\"经验试错\"推向\"智能预测\"，大幅缩小了实验筛选范围，提升了研发效率，也为其他复杂疾病的多功能纳米药设计提供了可复用的技术框架。 2.科学发现创新：两种上市药组装实现三重功能协同 甘草酸与辛伐他汀都是临床广泛应用的成熟药物，安全性已得到充分验证。二者自组装形成的SGNCs，不仅解决了溶解性与递送问题，更实现了\"抗菌+抗炎+成骨\"的功能协同，无需额外载体、无需合成新材料，就完成了对骨髓炎病理全链条的干预。 3.应用创新：为慢性骨髓炎提供无载体局部治疗新方案 目前骨髓炎局部给药系统多依赖抗生素+载体材料，存在辅料毒性、载药量低、功能单一等问题。SGNCs作为全活性成分的无载体纳米晶，载药量高、安全性好、功能全面，局部给药滞留时间长，为细菌性骨髓炎的局部治疗提供了更具临床转化潜力的新方案。 结语 这项研究不仅为细菌性骨髓炎提供了一款兼具抗菌、抗炎、成骨三重功效的纳米晶候选，更重要的是，它验证了\"AI辅助筛选+无载体自组装\"模式在复杂疾病多功能药物研发中的巨大价值。 集思专业从事药物分子自组装、纳米酶、水凝胶、脂质体等多种纳米功能材料的研发和合成，需要的老师长按下面二维码联系 往期推荐 · 西南医科大学Journal of Nanobiotechnology：药食同源藕节炭碳点+葛根素自凝胶粉末，快速止血兼修糖尿病伤口 1区11+ 客户文章 | ABPP靶点垂钓+真核蛋白表达+SPR精准验证锁定桑叶天然生物碱DNJ心肌保护新靶点！ 靶向 K298 琥珀酰化：破解心肌 I/R 损伤铁死亡调控密码 上海中医药大学Redox biology：豆蔻明衍生PROTAC分子选择性降解肝脏KEAP1，激活双信号通路以减轻药物性肝损伤 注：本文原创表明为原创编译， 非声张版权 ，侵删！ 关于集思慧远 集思慧远（GENEPIONEER）致力于将生命科学和化学相结合，助力客户达成科研创新的目标。更多信息请浏览：genepioneer.cn 南京集思慧远生物科技有限公司于2015年4月成立，是一家专业从事科研实验服务的公司。公司总部坐落在具有丰厚历史底蕴的南京，坐标在南京大学旁的江苏生命科技创新园，办公面积2000m²，员工人数100+。 集思医学主营业务有： 1.基因/转录/蛋白/代谢/微生物等常规高通量组学及单细胞和空间转录组等时空组学； 2.表观组学：WGBS/Ribo-seq/CUT\u0026Tag/ATAC-seq/Hi-c/m6A/m5C/ac4C等各类修饰）的表观遗传研究，助力新靶点发现、药物作用机制研究及疾病表观调控机制探索； 3.蛋白修饰：磷酸化、乙酰化、泛素化、乳酸化、组蛋白甲基化等修饰 4.专业的医学方案整体设计，利用生物信息学对公共数据进行深入挖掘分析，并提供干湿结合实验； 5.新靶点发现及验证服务，通过ABPP/TPP/DARTS等技术加速小分子药物靶点发现； 6.难成药靶点降解剂开发技术PROTAC； 7.基于AI的药物筛选/设计/优化/抑制剂开发等； 8.无需抗体的临近标记（PLA）技术提供蛋白互作研究。 9.纳米材料递送药物系统开发，定制化纳米载体设计与制备，解决药物靶向递送至病灶组织/细胞等药物递送难题。 集思的荣誉及成果： 2017获国家高新技术企业，2020众创板挂牌，2021获江苏省民营科技企业称号。2024荣膺江苏省\"专精特新\"中小企业、栖霞高新区TOP20明星企业称号。创始人先后获\"创业南京\"人才计划二等奖，\"中国江苏创新创业大赛\"优胜奖，\"南京市创新型企业家\"称号等。 集思的愿景： 打造生命科学行业的航空母舰，为人类生命健康保驾护航，为人类生产生活谋福祉。 纳米 · 目录 闪记 复制 LaTeX 公式","tags":["clippings","文献解读","骨髓炎","纳米药物","AI药物筛选","自组装","XGBoost","抗菌抗炎成骨","Advanced Science"],"section":"literature","sectionTitle":"文献整理","category":"网页文献","updated":"2026-10-25T17:37:28.559Z","url":"literature/notes/05d05cc17c0f3c62bb5867ad.html"},{"kbId":"KB-000133","title":"01 口腔生信研究库","subtitle":"","summary":"这是整个 vault 的核心研究操作系统，面向「口腔医学 + 生信分析 + 课题推进」。 核心原则： 原始资料进 01 sources ，可复用知识进 02 wiki ，真实课题进 03 project 公开转录组和单细胞数据，识别牙周炎中稳定、可解释、可验证的炎症相关 biomarker 或细胞状态？ 背景与意义 # 牙周炎是口腔医学中高发的慢性炎症性疾病。公开数据库中已有较多牙周炎相关表达谱数据，适合进行可复现的生信分析。但已有研究常见问题是： 单数据集筛基因，缺少外部验证； 只做 biomarker 模型，机制解释不足； bulk 分析和单细胞分析割裂； 免疫浸润结果缺少细胞来源验证。 当前假说 # 牙周炎组织中存在稳定的 inflammatory immune signature，其中中性粒细胞、巨噬细胞和趋化因子相关基因可能构成跨数据集可复现的疾病特征。单细胞数据可用于解释 bulk signature 的细胞来源。 初始分析路线 # 搜索并整理牙周炎 GEO 数据集。 筛选至少 2 个可用于 discovery / validation 的 bulk 数据集。 进行差异表达分析和交叉验证。 做 GSEA / GSVA 或 GO/KEGG 富集，确认炎症、免疫、骨吸收相关信号。 做免疫浸润分析，观察主要免疫细胞变化。 如果有合适单细胞数据，验证关键基因和 signature 的细胞来源。 构建候选 biomarker panel，但避免过度包装机器学习。 数据集清单 # 数据集 类型 样本 用途 状态 待搜索 bulk transcriptome 牙周炎 vs 健康 discovery pending 待搜索 bulk transcriptome 牙周炎 vs 健康 validation pending 待搜索 scRNA-seq 牙周组织 / 牙龈 cell source validation pending 相关 Wiki 页面 # 牙周炎 免疫浸润 口腔微生物组失衡 巨噬细胞 NF-kB信号通路 破骨细胞分化 差异表达分析 WGCNA 单细胞RNA测序分析 下一步最小动作 # 搜索 GEO 中牙周炎相关表达谱数据集。 为候选数据集建立 dataset notes。 判断哪些数据集适合 discovery / validation。 制定第一版分析计划。","tags":["project","periodontitis","biomarker","bioinformatics"],"section":"oral-research","sectionTitle":"口腔生信研究","category":"研究项目","updated":"2026-10-25T17:37:28.558Z","url":"oral-research/notes/a86083bfa39accf6a12a6b91.html"},{"kbId":"KB-000014","title":"Project: OSCC Bioinformatics","subtitle":"","summary":"能否整合 bulk、single-cell 和临床数据，识别 OSCC 中具有预后意义和机制解释力的肿瘤微环境特征？ OSCC 是头颈部鳞癌的重要亚型。公开数据库中有 TCGA-HNSC、GEO bulk、单细胞和空间转录组数据，可用于研究肿瘤细胞状态、免疫微环境和预后关联。 OSCC 中的预后差异不仅由肿瘤细胞本身决定，也与 TAM、CAF、T cell exhaustion、ECM remodeling 和 hypoxia 等微环境特征有关。将 bulk 预后 signa","body":"研究问题 # 能否整合 bulk、single-cell 和临床数据，识别 OSCC 中具有预后意义和机制解释力的肿瘤微环境特征？ 背景与意义 # OSCC 是头颈部鳞癌的重要亚型。公开数据库中有 TCGA-HNSC、GEO bulk、单细胞和空间转录组数据，可用于研究肿瘤细胞状态、免疫微环境和预后关联。 当前假说 # OSCC 中的预后差异不仅由肿瘤细胞本身决定，也与 TAM、CAF、T cell exhaustion、ECM remodeling 和 hypoxia 等微环境特征有关。将 bulk 预后 signature 与单细胞细胞状态结合，可能比单纯构建 prognostic model 更有解释力。 初始分析路线 # 从 TCGA-HNSC 中筛选 oral cavity 相关样本。 整理 OSCC GEO bulk 数据集作为外部验证。 收集 OSCC single-cell / spatial transcriptomics 数据。 分析 bulk 中与预后或分期相关的基因模块。 用单细胞数据解释模块或 signature 的细胞来源。 分析 TAM、CAF、T cell exhaustion 等细胞状态。 构建机制导向的论文故事线。 数据集清单 # 数据集 类型 样本 用途 状态 TCGA-HNSC oral subset bulk RNA-seq + clinical OSCC / HNSC discovery pending 待搜索 GEO bulk OSCC validation pending 待搜索 scRNA-seq OSCC tumor microenvironment mechanism pending 相关 Wiki 页面 # 口腔鳞状细胞癌 免疫浸润 巨噬细胞 差异表达分析 WGCNA 单细胞RNA测序分析 下一步最小动作 # 确认 TCGA-HNSC 中 anatomical site 筛选策略。 搜索 OSCC 外部验证数据集。 搜索 OSCC 单细胞 / 空间转录组数据。 决定主线：预后模型、TME 机制，还是细胞状态图谱。","tags":["project","OSCC","tumor-microenvironment","bioinformatics"],"section":"oral-research","sectionTitle":"口腔生信研究","category":"研究项目","updated":"2026-10-25T17:37:28.558Z","url":"oral-research/notes/d361ef4431c1c86a6d502fe7.html"},{"kbId":"KB-000012","title":"NF-kB信号通路","subtitle":"","summary":"NF-κB signaling 是炎症、免疫应答、细胞存活和应激反应中的关键通路。在口腔炎症和肿瘤微环境中，NF-κB 相关基因常与炎症因子、趋化因子和免疫细胞募集有关。 牙周炎中，微生物刺激和宿主炎症反应可激活 NF-κB 相关通路，促进 IL1B、TNF、CXCL8 等炎症介质表达，并可能与骨吸收过程间接相关。 相关疾病：牙周炎 在 OSCC 中，NF-κB 可能与肿瘤细胞存活、炎症性肿瘤微环境、免疫调节和治疗抵抗有关。 相关疾病：口腔鳞状细胞癌 可通过以下方式评估： 差","body":"核心概念 # NF-κB signaling 是炎症、免疫应答、细胞存活和应激反应中的关键通路。在口腔炎症和肿瘤微环境中，NF-κB 相关基因常与炎症因子、趋化因子和免疫细胞募集有关。 与口腔疾病的关系 # 牙周炎 # 牙周炎中，微生物刺激和宿主炎症反应可激活 NF-κB 相关通路，促进 IL1B、TNF、CXCL8 等炎症介质表达，并可能与骨吸收过程间接相关。 相关疾病： 牙周炎 OSCC # 在 OSCC 中，NF-κB 可能与肿瘤细胞存活、炎症性肿瘤微环境、免疫调节和治疗抵抗有关。 相关疾病： 口腔鳞状细胞癌 生信分析角度 # 可通过以下方式评估： 差异表达基因富集分析 GSEA / GSVA pathway score 单细胞中按细胞类型计算 pathway activity 与免疫浸润分数或临床表型相关分析 代表性基因 # NFKB1 RELA NFKBIA TNF IL1B CXCL8 CCL2 注意事项 # pathway enrichment 只能说明基因集层面的关联，不能直接证明通路被功能性激活。 NF-κB 是广泛通路，特异性不足，需要结合疾病背景和细胞类型解释。 相关 Wiki 页面 # 免疫浸润 巨噬细胞","tags":["inflammation","signaling","immunity"],"section":"oral-research","sectionTitle":"口腔生信研究","category":"Wiki 知识","updated":"2026-10-25T17:37:28.557Z","url":"oral-research/notes/03d32f6cb8e16bd1265ce8d3.html"},{"kbId":"KB-000013","title":"破骨细胞分化","subtitle":"","summary":"破骨细胞分化是单核/巨噬细胞系前体细胞在特定刺激下分化为破骨细胞并参与骨吸收的过程。它是牙周炎牙槽骨吸收的重要机制之一。 牙周炎中，慢性炎症环境可促进破骨细胞生成和活化，导致牙槽骨吸收。RANKL/OPG 轴、炎症因子和免疫细胞共同参与这一过程。 相关疾病：牙周炎 TNFSF11 / RANKL TNFRSF11B / OPG TNFRSF11A / RANK ACP5 / TRAP CTSK NFATC1 SPI1 在 bulk 数据中评估 osteoclast diffe","body":"核心概念 # 破骨细胞分化是单核/巨噬细胞系前体细胞在特定刺激下分化为破骨细胞并参与骨吸收的过程。它是牙周炎牙槽骨吸收的重要机制之一。 与牙周炎的关系 # 牙周炎中，慢性炎症环境可促进破骨细胞生成和活化，导致牙槽骨吸收。RANKL/OPG 轴、炎症因子和免疫细胞共同参与这一过程。 相关疾病： 牙周炎 关键分子 # TNFSF11 / RANKL TNFRSF11B / OPG TNFRSF11A / RANK ACP5 / TRAP CTSK NFATC1 SPI1 生信分析角度 # 在 bulk 数据中评估 osteoclast differentiation pathway enrichment。 在单细胞数据中寻找 osteoclast-like cells 或 osteoclast precursor states。 将破骨相关基因与炎症因子、巨噬细胞状态、临床骨吸收指标关联。 注意事项 # 牙龈组织 bulk transcriptome 中未必能直接捕捉破骨细胞信号，取样组织很关键。 破骨相关通路富集不等于存在成熟破骨细胞，需要结合 marker 和组织来源判断。 相关 Wiki 页面 # 牙周炎 巨噬细胞","tags":["bone","periodontitis","osteoimmunology"],"section":"oral-research","sectionTitle":"口腔生信研究","category":"Wiki 知识","updated":"2026-10-25T17:37:28.557Z","url":"oral-research/notes/432a1f9e0e7b5fdb7f5c5998.html"},{"kbId":"KB-000011","title":"NCBI 下载方式变更速记","subtitle":"","summary":"起 ，NCBI 将 停止支持 rsync 协议 下载。 受影响的是所有依赖 rsync 拉取 NCBI/FTP 数据的旧脚本、自动化流程和下载管线。 官方会在 2026-05-12 和 2026-05-27 进行 brownout（断网演练） ，可提前用来测试脚本是否会失效。 安全性 ：rsync 已不太适配现代网络安全要求。 稳定性/扩展性 ：NCBI 正转向 HTTPS 和专用 API / CLI 工具 ，以支撑更大规模并发下载。 数据规模增长 ：例如 GenBank R","body":"核心变化 # 2026-06-01 起 ，NCBI 将 停止支持 rsync 协议 下载。 受影响的是所有依赖 rsync 拉取 NCBI/FTP 数据的旧脚本、自动化流程和下载管线。 官方会在 2026-05-12 和 2026-05-27 进行 brownout（断网演练） ，可提前用来测试脚本是否会失效。 为什么停用 rsync # 安全性 ：rsync 已不太适配现代网络安全要求。 稳定性/扩展性 ：NCBI 正转向 HTTPS 和专用 API / CLI 工具 ，以支撑更大规模并发下载。 数据规模增长 ：例如 GenBank Release 271.0 已达到超大体量，更需要现代化下载方式。 迁移建议 # 1. 大型/结构化数据：优先用 NCBI Datasets CLI # 适合基因组、注释等结构化数据下载。 conda create -n ncbi_datasets conda activate ncbi_datasets conda install -c conda-forge ncbi-datasets-cli 官方文档： https://www.ncbi.nlm.nih.gov/datasets/docs/v2/how-tos/ 2. SRA 原始测序数据：用 SRA Toolkit # conda install -c bioconda sra-tools # 单个下载 prefetch SRR000001 # 批量下载 prefetch --option-file sra_list.txt sra_list.txt 示例： SRR000001 SRR000002 SRR000003 3. 少量文件：直接改成 HTTPS + wget/curl # wget -c https://sra-pub-run-odp.s3.amazonaws.com/sra/SRR38325455/SRR38325455 curl -O https://sra-pub-run-odp.s3.amazonaws.com/sra/SRR38325455/SRR38325455 国内下载加速思路 # 如果直接访问 NCBI 很慢，可以到 CNCB / NGDC 查询对应数据的镜像链接。 示例： wget -c https://download2.cncb.ac.cn/INSDC6/SRA/36/SRR36608/SRR36608452//SRR36608452 优点：可绕开 NCBI 直连慢的问题，速度可能明显提升。 实操结论 # 先排查脚本里是否还有 rsync 。 能换成 Datasets CLI / SRA Toolkit 的尽量换。 简单文件下载改成 HTTPS + wget/curl 。 不要等到 6 月 1 日 ；最好在 5 月两次 brownout 前后就完成迁移测试。","tags":[],"section":"oral-research","sectionTitle":"口腔生信研究","category":"Wiki 知识","updated":"2026-10-25T17:37:28.557Z","url":"oral-research/notes/0e53b413ff145276e2d5036d.html"},{"kbId":"KB-000008","title":"WGCNA","subtitle":"","summary":"WGCNA（Weighted Gene Co-expression Network Analysis）用于根据基因表达相关性构建共表达网络，将基因划分为模块，并分析模块与表型之间的关系。 哪些基因模块与牙周炎疾病状态、炎症评分或免疫浸润程度相关？ OSCC 中是否存在与预后、分期或肿瘤微环境相关的共表达模块？ 某个模块的 hub genes 是否可作为候选 biomarker？ 直接证明调控因果关系。 在样本量很小的数据集中稳定识别模块。 不经验证就把 hub gene 当作","body":"方法目的 # WGCNA（Weighted Gene Co-expression Network Analysis）用于根据基因表达相关性构建共表达网络，将基因划分为模块，并分析模块与表型之间的关系。 适合回答的问题 # 哪些基因模块与牙周炎疾病状态、炎症评分或免疫浸润程度相关？ OSCC 中是否存在与预后、分期或肿瘤微环境相关的共表达模块？ 某个模块的 hub genes 是否可作为候选 biomarker？ 不适合回答的问题 # 直接证明调控因果关系。 在样本量很小的数据集中稳定识别模块。 不经验证就把 hub gene 当作可靠靶点。 输入数据 # 通常使用 bulk RNA-seq 或 microarray 表达矩阵。 行为基因，列为样本。 需要相对足够的样本量；样本过少时模块稳定性差。 核心步骤 # 样本和基因过滤。 选择 soft-thresholding power。 构建邻接矩阵和拓扑重叠矩阵 TOM。 层次聚类并识别模块。 计算 module eigengene。 分析模块与表型之间的相关性。 在关键模块中筛选 hub genes。 对模块基因做功能富集。 常见误区 # 样本量不足仍强行做 WGCNA。 把模块-表型相关性解释成因果关系。 只报告 hub genes，不解释模块生物学含义。 未进行外部数据集验证。 口腔生信应用场景 # 牙周炎炎症相关模块识别。 OSCC 预后相关模块识别。 将 WGCNA 模块与免疫浸润分数、临床指标或通路活性关联。 相关 Wiki 页面 # 牙周炎 口腔鳞状细胞癌 免疫浸润","tags":["bioinformatics","network","module","rnaseq"],"section":"oral-research","sectionTitle":"口腔生信研究","category":"Wiki 知识","updated":"2026-10-25T17:37:28.556Z","url":"oral-research/notes/d86748e98ce6fb25e3cbd6c4.html"},{"kbId":"KB-000009","title":"单细胞RNA测序分析","subtitle":"","summary":"单细胞 RNA 测序分析用于在单细胞分辨率下识别细胞类型、细胞状态、疾病相关转录变化和细胞间通讯关系。 牙周炎组织中哪些免疫细胞或 stromal cells 发生扩增？ OSCC 中 malignant epithelial cells、TAM、CAF、T cells 是否存在特定状态？ bulk RNA-seq 中观察到的 signature 来源于哪些细胞类型？ 疾病进展过程中是否存在连续的细胞状态变化？ 单独估计总体组织中精确细胞比例，尤其在 dissociation","body":"方法目的 # 单细胞 RNA 测序分析用于在单细胞分辨率下识别细胞类型、细胞状态、疾病相关转录变化和细胞间通讯关系。 适合回答的问题 # 牙周炎组织中哪些免疫细胞或 stromal cells 发生扩增？ OSCC 中 malignant epithelial cells、TAM、CAF、T cells 是否存在特定状态？ bulk RNA-seq 中观察到的 signature 来源于哪些细胞类型？ 疾病进展过程中是否存在连续的细胞状态变化？ 不适合回答的问题 # 单独估计总体组织中精确细胞比例，尤其在 dissociation bias 明显时。 在没有空间信息时直接推断空间邻近关系。 不经验证就确定细胞间通讯是真实物理互作。 核心步骤 # 读取 count matrix。 细胞质控：基因数、UMI 数、线粒体比例等。 标准化与高变基因选择。 降维：PCA、UMAP/t-SNE。 聚类。 细胞类型注释。 差异表达和 marker gene 分析。 细胞状态、轨迹、通讯或整合分析。 常用工具 # R # Seurat SingleCellExperiment Monocle CellChat inferCNV Python # Scanpy AnnData scvi-tools scVelo Squidpy 口腔生信应用场景 # 牙周炎免疫微环境解析。 OSCC tumor microenvironment 分析。 牙髓、牙周膜、牙龈组织细胞图谱构建。 bulk signature 的细胞来源解释。 常见误区 # 只看 UMAP，不做严谨 marker 验证。 细胞注释完全依赖自动工具，不结合文献 marker。 忽略批次、样本来源和组织消化偏倚。 把细胞通讯分析结果直接当作真实配体-受体互作。 相关 Wiki 页面 # 牙周炎 口腔鳞状细胞癌 巨噬细胞","tags":["bioinformatics","single-cell","scanpy","seurat"],"section":"oral-research","sectionTitle":"口腔生信研究","category":"Wiki 知识","updated":"2026-10-25T17:37:28.556Z","url":"oral-research/notes/7bf04dfdf5639db1c44778cc.html"},{"kbId":"KB-000010","title":"差异表达分析","subtitle":"","summary":"差异表达分析用于识别两个或多个条件之间表达水平显著不同的基因，例如疾病组 vs 健康对照组。 牙周炎组织中哪些基因相对健康牙龈显著上调或下调？ OSCC 肿瘤组织中哪些基因相对邻近正常组织异常表达？ 某个细胞亚群在不同状态下是否存在炎症或代谢相关转录变化？ 单独证明因果关系。 在没有外部验证的情况下直接确定 biomarker。 忽略批次效应后比较不同平台数据。 bulk RNA-seq count matrix microarray expression matrix si","body":"方法目的 # 差异表达分析用于识别两个或多个条件之间表达水平显著不同的基因，例如疾病组 vs 健康对照组。 适合回答的问题 # 牙周炎组织中哪些基因相对健康牙龈显著上调或下调？ OSCC 肿瘤组织中哪些基因相对邻近正常组织异常表达？ 某个细胞亚群在不同状态下是否存在炎症或代谢相关转录变化？ 不适合回答的问题 # 单独证明因果关系。 在没有外部验证的情况下直接确定 biomarker。 忽略批次效应后比较不同平台数据。 输入数据 # bulk RNA-seq count matrix microarray expression matrix single-cell pseudo-bulk matrix 分组信息和协变量信息 核心步骤 # 数据质控与样本过滤。 表达矩阵标准化或建模。 构建设计矩阵。 进行统计检验。 多重检验校正。 可视化：volcano plot、heatmap、PCA。 下游富集分析：GO、KEGG、GSEA。 常用工具 # R # DESeq2：RNA-seq count 数据常用。 edgeR：RNA-seq count 数据，适合复杂设计。 limma：microarray 常用； limma-voom 可用于 RNA-seq。 Python # scanpy：单细胞差异表达。 pydeseq2：Python 版 DESeq2 风格分析。 关键注意事项 # RNA-seq count 数据不要直接对 TPM/FPKM 做 DESeq2。 多数据集合并前要考虑 batch effect。 小样本数据中 p 值不稳定，应重视效应量和跨队列复现。 bulk 组织差异表达可能反映细胞比例变化，而不一定是同一细胞内的表达改变。 口腔生信应用场景 # 牙周炎 vs 健康牙龈。 OSCC tumor vs normal。 牙髓炎、根尖周炎等炎症组织比较。 单细胞中 disease vs control 的 pseudo-bulk 分析。 相关 Wiki 页面 # 牙周炎 口腔鳞状细胞癌 免疫浸润","tags":["bioinformatics","rnaseq","statistics"],"section":"oral-research","sectionTitle":"口腔生信研究","category":"Wiki 知识","updated":"2026-10-25T17:37:28.556Z","url":"oral-research/notes/7a6a02e999ad1f1ecdaf2f80.html"},{"kbId":"KB-000006","title":"口腔鳞状细胞癌","subtitle":"","summary":"口腔鳞状细胞癌（oral squamous cell carcinoma, OSCC）是发生于口腔黏膜鳞状上皮的恶性肿瘤，是头颈部鳞癌的重要亚型。 肿瘤微环境 remodeling 免疫逃逸 上皮-间质转化 EMT 缺氧与代谢重编程 ECM remodeling 癌相关成纤维细胞 CAF 肿瘤相关巨噬细胞 TAM：巨噬细胞 OSCC 中哪些 malignant epithelial cell states 与侵袭、转移或预后相关？ 肿瘤微环境中哪些免疫细胞或 stromal","body":"核心定义 # 口腔鳞状细胞癌（oral squamous cell carcinoma, OSCC）是发生于口腔黏膜鳞状上皮的恶性肿瘤，是头颈部鳞癌的重要亚型。 关键机制 # 肿瘤微环境 remodeling 免疫逃逸 上皮-间质转化 EMT 缺氧与代谢重编程 ECM remodeling 癌相关成纤维细胞 CAF 肿瘤相关巨噬细胞 TAM： 巨噬细胞 生信研究常见问题 # OSCC 中哪些 malignant epithelial cell states 与侵袭、转移或预后相关？ 肿瘤微环境中哪些免疫细胞或 stromal cell states 与免疫抑制相关？ 是否存在稳定的 prognostic signature？ 单细胞和空间转录组能否解释 bulk RNA-seq 的预后基因模块？ OSCC 与其他 HNSC 亚型相比是否存在口腔特异性特征？ 常用数据来源 # TCGA-HNSC 中的 oral cavity subset GEO OSCC bulk RNA-seq / microarray OSCC single-cell RNA-seq OSCC spatial transcriptomics 常用分析方法 # 差异表达与通路富集 survival analysis immune infiltration single-cell clustering and annotation cell-cell communication pseudotime / trajectory analysis copy number variation inference spatial domain analysis 当前综合判断 # OSCC 生信研究适合围绕“肿瘤细胞状态 + 肿瘤微环境 + 临床预后”构建故事线。相比单纯筛选 prognostic genes，结合单细胞或空间数据解释 gene signature 的细胞来源和空间生态位，更容易形成有机制感的研究。 尚不确定的问题 # TCGA-HNSC 是否能代表口腔原发 OSCC，需严格筛选 anatomical site。 bulk prognostic signature 的细胞来源经常不清楚，需要单细胞验证。 OSCC 中 CAF、TAM、T cell exhaustion 等状态是否具有跨队列稳定性，需要多数据集比较。 对当前项目的启发 # 可考虑以 OSCC tumor microenvironment 为主线，整合 TCGA-HNSC、GEO bulk、single-cell 数据，避免只做普通预后模型。 相关项目： 01 hz-wiki-生信/03_projects/project_oscc_bioinfo/project_overview","tags":["oral-cancer","tumor-microenvironment","single-cell","bioinformatics"],"section":"oral-research","sectionTitle":"口腔生信研究","category":"Wiki 知识","updated":"2026-10-25T17:37:28.555Z","url":"oral-research/notes/cd76bee5b898e0a5932e6425.html"},{"kbId":"KB-000007","title":"牙周炎","subtitle":"","summary":"牙周炎是一种由菌斑生物膜驱动、宿主免疫炎症反应参与的慢性口腔疾病，主要表现为牙周支持组织破坏、牙周袋形成和牙槽骨吸收。 微生物群落失衡：口腔微生物组失衡 免疫炎症反应：免疫浸润 NF-κB 相关炎症通路：NF-kB信号通路 破骨细胞活化与骨吸收：破骨细胞分化 巨噬细胞、中性粒细胞、T 细胞等免疫细胞参与：巨噬细胞 牙周炎组织中有哪些稳定差异表达基因？ 不同数据集之间是否存在可复现的 inflammatory signature？ bulk RNA-seq 中的免疫信号主要来自","body":"核心定义 # 牙周炎是一种由菌斑生物膜驱动、宿主免疫炎症反应参与的慢性口腔疾病，主要表现为牙周支持组织破坏、牙周袋形成和牙槽骨吸收。 关键机制 # 微生物群落失衡： 口腔微生物组失衡 免疫炎症反应： 免疫浸润 NF-κB 相关炎症通路： NF-kB信号通路 破骨细胞活化与骨吸收： 破骨细胞分化 巨噬细胞、中性粒细胞、T 细胞等免疫细胞参与： 巨噬细胞 生信研究常见问题 # 牙周炎组织中有哪些稳定差异表达基因？ 不同数据集之间是否存在可复现的 inflammatory signature？ bulk RNA-seq 中的免疫信号主要来自细胞比例变化，还是细胞内转录状态改变？ 是否能构建跨数据集稳定的诊断 biomarker panel？ 牙周炎与糖尿病、心血管疾病等全身疾病是否存在 shared inflammatory signature？ 常用数据类型 # 牙龈组织 bulk transcriptome 牙周组织 microarray 单细胞 RNA 测序 口腔微生物组 16S / metagenomics 蛋白组 / 代谢组 常用分析方法 # 差异表达分析 WGCNA 免疫浸润分析 GSEA / GSVA 机器学习 biomarker 筛选 单细胞细胞类型注释 当前综合判断 # 牙周炎的公开转录组研究通常可以观察到炎症、趋化因子、基质降解、免疫细胞募集相关信号。但不同研究之间可能受到组织来源、疾病分级、取样部位、测序平台和样本量影响，因此不能只依赖单一数据集得出 biomarker 结论。 尚不确定的问题 # 不同牙周组织取样方式是否会显著改变转录组 signature？ bulk 数据中的免疫浸润结果是否能被单细胞数据支持？ 牙周炎是否存在口腔特异性的 macrophage activation state？ 诊断 biomarker 是否具有跨平台泛化能力？ 对当前项目的启发 # 可从多个 GEO 数据集出发，先建立稳定差异表达和免疫浸润特征，再用单细胞数据解释 bulk signature 的细胞来源。 相关项目： 01 hz-wiki-生信/03_projects/project_periodontitis_bioinfo/project_overview","tags":["oral-disease","inflammation","microbiome","bone-resorption","bioinformatics"],"section":"oral-research","sectionTitle":"口腔生信研究","category":"Wiki 知识","updated":"2026-10-25T17:37:28.555Z","url":"oral-research/notes/51e308e862e7d7d5ad49fad6.html"},{"kbId":"KB-000004","title":"免疫浸润","subtitle":"","summary":"免疫浸润指免疫细胞进入组织、肿瘤或炎症微环境的现象。在生信分析中，常通过 bulk transcriptome 或 single-cell data 推断不同免疫细胞类型的丰度或活化状态。 牙周炎：反映中性粒细胞、巨噬细胞、T 细胞、B 细胞等参与的炎症反应。 OSCC：反映肿瘤免疫微环境，包括 T cell exhaustion、TAM、MDSC、NK cell 等。 牙髓炎 / 根尖周炎：反映局部炎症细胞募集和组织破坏。 CIBERSORT / CIBERSORTx xC","body":"核心概念 # 免疫浸润指免疫细胞进入组织、肿瘤或炎症微环境的现象。在生信分析中，常通过 bulk transcriptome 或 single-cell data 推断不同免疫细胞类型的丰度或活化状态。 在口腔疾病中的意义 # 牙周炎：反映中性粒细胞、巨噬细胞、T 细胞、B 细胞等参与的炎症反应。 OSCC：反映肿瘤免疫微环境，包括 T cell exhaustion、TAM、MDSC、NK cell 等。 牙髓炎 / 根尖周炎：反映局部炎症细胞募集和组织破坏。 常用方法 # CIBERSORT / CIBERSORTx xCell MCP-counter ssGSEA / GSVA immune signatures TIMER quanTIseq 单细胞细胞类型比例统计 解释时的关键问题 # bulk 数据中的 immune score 可能同时受细胞比例和基因表达状态影响。 不同算法使用的 signature matrix 不同，结果不能简单等同。 组织类型和疾病背景会影响免疫细胞 marker 的特异性。 单细胞数据可以帮助解释 bulk signature 的细胞来源，但也有 dissociation bias。 常见误区 # 只报告免疫浸润柱状图，不解释其生物学含义。 把算法推断的细胞比例当成真实流式结果。 不验证 marker gene 或不与单细胞数据交叉验证。 相关 Wiki 页面 # 牙周炎 口腔鳞状细胞癌 巨噬细胞","tags":["immunology","bioinformatics","tumor-microenvironment","inflammation"],"section":"oral-research","sectionTitle":"口腔生信研究","category":"Wiki 知识","updated":"2026-10-25T17:37:28.554Z","url":"oral-research/notes/8b5ce0a1f3d6a0cd27fcd19a.html"},{"kbId":"KB-000005","title":"口腔微生物组失衡","subtitle":"","summary":"口腔微生物组失衡指口腔局部微生物群落结构和功能从健康稳态转向疾病相关状态，常表现为致病相关菌群富集、群落多样性改变、宿主炎症反应增强等。 牙周炎通常被视为微生物群落失衡与宿主免疫炎症反应共同作用的结果。菌斑生物膜可诱导炎症，而炎症环境又可能反过来选择适应炎症生态位的微生物，形成正反馈。 相关疾病：牙周炎 常见数据类型： S rRNA sequencing shotgun metagenomics metatranscriptomics host transcriptome +","body":"核心概念 # 口腔微生物组失衡指口腔局部微生物群落结构和功能从健康稳态转向疾病相关状态，常表现为致病相关菌群富集、群落多样性改变、宿主炎症反应增强等。 与牙周炎的关系 # 牙周炎通常被视为微生物群落失衡与宿主免疫炎症反应共同作用的结果。菌斑生物膜可诱导炎症，而炎症环境又可能反过来选择适应炎症生态位的微生物，形成正反馈。 相关疾病： 牙周炎 生信分析角度 # 常见数据类型： 16S rRNA sequencing shotgun metagenomics metatranscriptomics host transcriptome + microbiome integration 常见问题： 疾病组与健康组的 alpha / beta diversity 是否不同？ 哪些菌属或菌种与疾病状态相关？ 微生物功能通路是否发生改变？ 微生物特征是否与宿主炎症基因表达相关？ 常见误区 # 16S 分辨率有限，不能轻易下到菌种或菌株层面。 相关性不等于因果关系。 口腔取样部位会显著影响微生物组成。 批次、测序区域、数据库版本会影响结果。 对项目的启发 # 如果课题关注牙周炎，可以考虑将宿主 transcriptome 与 microbiome 数据关联，但需要谨慎处理样本匹配和混杂因素。","tags":["oral-microbiome","periodontitis","inflammation"],"section":"oral-research","sectionTitle":"口腔生信研究","category":"Wiki 知识","updated":"2026-10-25T17:37:28.554Z","url":"oral-research/notes/685091f16d4ccd4340347c2e.html"},{"kbId":"KB-000003","title":"巨噬细胞","subtitle":"","summary":"巨噬细胞是先天免疫系统的重要细胞，参与吞噬、抗原呈递、炎症调控、组织修复和肿瘤微环境塑造。 巨噬细胞参与炎症因子产生、抗原呈递和骨吸收相关炎症环境形成。传统 M1/M2 框架可以作为入门理解，但在单细胞数据中更应关注连续的 activation states，而不是简单二分。 相关疾病：牙周炎 在肿瘤中，肿瘤相关巨噬细胞（tumor-associated macrophages, TAMs）可能参与免疫抑制、血管生成、侵袭转移和治疗抵抗。 相关疾病：口腔鳞状细胞癌 marke","body":"核心概念 # 巨噬细胞是先天免疫系统的重要细胞，参与吞噬、抗原呈递、炎症调控、组织修复和肿瘤微环境塑造。 在口腔疾病中的角色 # 牙周炎 # 巨噬细胞参与炎症因子产生、抗原呈递和骨吸收相关炎症环境形成。传统 M1/M2 框架可以作为入门理解，但在单细胞数据中更应关注连续的 activation states，而不是简单二分。 相关疾病： 牙周炎 OSCC # 在肿瘤中，肿瘤相关巨噬细胞（tumor-associated macrophages, TAMs）可能参与免疫抑制、血管生成、侵袭转移和治疗抵抗。 相关疾病： 口腔鳞状细胞癌 常见 marker # marker 需要根据物种、组织、平台和分析场景验证，不应机械套用。 pan-macrophage：CD68, CD14, LST1, TYROBP inflammatory-like：IL1B, TNF, CXCL8, NFKBIA antigen presentation：HLA-DRA, HLA-DRB1, CD74 tissue remodeling / TAM-like：MRC1, MSR1, C1QA, C1QB, C1QC, APOE 生信分析问题 # 巨噬细胞比例是否在疾病组织中升高？ 巨噬细胞是否呈现 inflammatory、antigen-presenting、tissue-remodeling 或 immunosuppressive 状态？ bulk RNA-seq 中的炎症 signature 是否来自巨噬细胞？ 巨噬细胞是否与成纤维细胞、上皮细胞或 T 细胞存在潜在通讯？ 常见误区 # 过度依赖 M1/M2 二分法。 把单个 marker 当作细胞类型绝对证据。 不区分 monocyte、macrophage、dendritic cell。 将 cell-cell communication 结果过度解释成真实因果互作。 相关 Wiki 页面 # 免疫浸润 NF-kB信号通路","tags":["immunology","inflammation","tumor-microenvironment"],"section":"oral-research","sectionTitle":"口腔生信研究","category":"Wiki 知识","updated":"2026-10-25T17:37:28.554Z","url":"oral-research/notes/0f241e5473d71d2080eef174.html"},{"kbId":"KB-000002","title":"放射性颌骨骨坏死（ORN）相关单细胞测序公共数据集检索与评估报告","subtitle":"","summary":"数据库名 数据集ID/链接 样本类型 组织来源 样本数量 数据类型 是否开放下载 相关论文引用（DOI） 备注（ORN/放疗/临床信息等） GEO GSE269255 放射性颌骨坏死 27(https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE269255) 单细胞 小鼠体内照射模型 下颌/颌骨基质细胞（mandibular stromal cells）27(https://www.ncbi.nlm.nih.gov/geo","body":"数据库名 数据集ID/链接 样本类型 组织来源 样本数量 数据类型 是否开放下载 相关论文引用（DOI） 备注（ORN/放疗/临床信息等） GEO GSE269255 放射性颌骨坏死 27 ( https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE269255 ) 单细胞 小鼠体内照射模型 下颌/颌骨基质细胞（mandibular stromal cells） 27 ( https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE269255 ) 3 个库（Ctrl、照后1天、照后7天；每组多只小鼠合并） 27 ( https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE269255 ) processed counts（MTX/TSV）；原始 reads 在 S ，并在 frontmatter 中补充对应标签。 查找时 ：可从组学维度（第 1 章）或教程类型维度（第 2 章）交叉定位。 扩展时 ：在对应分类下新增 #### 子标题，保持编号层级一致。 跨分类内容 ：允许同一资源出现在多个分类下（用 \u003ca href=\"wikilink\"\u003ewikilink\u003c/a\u003e 引用，不复制内容）。 空分类 ：标注「待补充」的分类为预留位，后续新内容入库时填充。","tags":["bioinformatics","classification","index"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"其他资料","updated":"2026-10-25T17:41:01.068Z","url":"bioinfo-tools/notes/a893a315924d6da3906202b7.html"},{"kbId":"KB-000092","title":"单细胞动态分析：Vector Field 向量场分析 与 RNA velocity / scVelo 的关系","subtitle":"","summary":"单细胞动态分析的三个层次：RNA velocity（原理）、scVelo（计算工具）、Vector field analysis（高层次动态建模）。梳理概念、能做什么、能证明什么、与 scVelo 的区别，以及常见方法（CellRank、Dynamo、scTour）。","body":"说明 一句话理解 Vector Field Analysis（向量场分析） 是建立在 RNA velocity / scVelo 之上的 更高层次动态分析 ：把每个细胞\"下一步往哪走\"的离散箭头，拟合成整个细胞群体的 连续流场 ，从而推断分化路径、起点（Root）、终点（Terminal）、命运分支与稳定状态（Attractor）。 一、三个核心概念的关系（先搞清楚层级） # 它们不是互相替代的关系，而是 上下游关系 ： 方法 回答的问题 输入 输出 层级 RNA velocity 细胞下一步往哪走？ spliced + unspliced RNA 每个细胞的速度向量 原理 / 概念 scVelo 如何计算 RNA velocity？ scRNA-seq 数据 velocity、latent time、velocity graph 软件 / 算法 Vector field analysis 整个细胞群体如何流动？ velocity 结果 连续向量场、吸引子、分化流 高层次动态分析 单细胞 RNA 测序 │ ▼ RNA velocity（理论：unspliced/spliced RNA 推方向） │ ▼ scVelo（计算每个细胞的速度） │ ▼ Vector field analysis（离散速度 → 连续流场） │ ▼ Cell fate（命运）、Root（起点）、Terminal（终点）、 Branch（分支）、Attractor（稳定状态） 二、第一层：RNA velocity（概念） # 2018 年提出的概念（La Manno et al.）。 利用 unspliced RNA （刚转录出来，未成熟）与 spliced RNA （成熟 mRNA）的比例关系，推断某个基因 未来会上调还是下调 ： unspliced ↑↑↑ + spliced ↑ → 新 RNA 正在大量产生 → 未来表达继续升高 unspliced ↓ + spliced ↑↑↑ → RNA 已停止产生 → 未来表达下降 把所有基因综合起来，得到 每个细胞未来移动的方向 （一个速度向量）。 三、第二层：scVelo（工具 / 算法） # RNA velocity 只是理论，真正计算由 scVelo 完成。主要输出： Velocity embedding ：UMAP 上的箭头（每细胞一支），大家最熟悉的 → → ↗ ↑ ↓ 。 Velocity graph ：建立\"哪个细胞更可能变成哪个细胞\"的转移图。 Latent time ：比 Monocle 的 Pseudotime 更偏动态的发育进程（0~1）。 Driver genes ：找出真正驱动速度变化的关键基因。 注意：scVelo 默认用的是 动力学模型 （dynamical model），比早期 velocyto 的稳态模型更准确，是目前单细胞速度推断的主流实现。 四、第三层：Vector Field Analysis（向量场分析） # 为什么需要它 # scVelo 得到的是 离散箭头 ，看起来比较乱。向量场分析把这些箭头 拟合成一个连续流场（continuous vector field） ——就像天气预报的风场： →→→→→ ↗→→→ ↑ ↙→→→ 它比 scVelo 多回答的问题是： \"这三个箭头其实属于同一条发育轨迹\" ，甚至能算出 整个系统最终会流向哪里 。 能做什么（核心能力） # 推断分化方向（最重要） 普通聚类只告诉你\"这是 Stem、这是 T、这是 B\"；向量场能告诉你 Stem → Progenitor → T （而不是反过来）。这是 Nature 文章最喜欢展示的内容。 找分化起点（Root） 无需人为指定，通过流场找到真正最原始的细胞（如 HSC、Basal cell、Stem cell）。 找终点（Terminal state） 箭头越短说明细胞已稳定、不再变化，可识别成熟细胞（Mature T、Plasma、Neuron）。 判断两个 cluster 是否构成\"分化关系\" 如果箭头 A →→→→ B ，说明 B 很可能由 A 产生，而不是两个无关细胞。 找关键转折点（Cell fate decision / branch point） 在发育、肿瘤耐药、EMT、免疫激活中，找到真正开始\"分叉\"的位置。 推断未来表达变化 本质上是利用 unspliced/spliced RNA 预测未来哪些基因上升、哪些下降。 能证明什么？（证据边界很重要） # 注意 严格来说：它提供的是 动态证据（evidence / suggests） ，不是严格证明。 可以支持（Support） ✅ Cell A 可能 分化成 Cell B ✅ Cell X 是祖细胞 ✅ Cell Y 正在激活 ✅ Cell Z 趋向耗竭 ✅ 存在一条连续分化轨迹 不能单独证明（Cannot prove） ❌ A 一定 变成 B ❌ Gene X 一定 控制分化 ❌ Knockout 一定影响发育 这些需要 Lineage tracing（谱系追踪）、CRISPR 实验、动物实验、功能验证 才能真正证明。 论文里规范的写法是 \"Vector field analysis suggests...\" ，而不是 \"proves...\" 。 在论文中的常见用途 # 生物学问题 向量场分析提供什么 干细胞怎么分化？ 推断分化方向 哪些细胞最原始？ Root cell 哪些细胞成熟？ Terminal state 肿瘤怎么演化？ Evolution trajectory T 细胞如何耗竭？ Exhaustion direction EMT 怎么发生？ EMT 动态过程 药物是否改变分化？ 比较处理前后向量场变化 五、与 scVelo 的区别（重点） # scVelo Vector Field Analysis 颗粒度 单个细胞的 局部 速度 全局 连续流场 回答 每个细胞 下一步去哪 整个 命运系统怎么演化 额外产出 velocity / latent time 轨迹归属、Fate probability、Attractor 例子 Cell A → 向右 三个向右的箭头属于 同一条发育轨迹 ；系统最终流到哪 Vector field 额外能算的东西： Flow（流） ：整个组织往哪里流，如 CAF： iCAF → myCAF → mCAF Sink（终点） ：所有箭头流向的细胞（Terminal CD8、成熟浆细胞、成熟 CAF） Source（起点） ：不断产生新细胞的细胞（Stem、Basal、HSC） Fate probability ：如一个祖细胞 70% 去 T cell、30% 去 NK——而不是简单画箭头 Attractor（吸引子） ：如癌细胞最后稳定在耐药状态 六、常用工具全景 # 经典路径（scVelo 后处理）： CellRank ：基于 velocity graph 的 Markov 链模型，算命运概率（fate probability）、初始细胞、终态细胞、driver genes，是目前最主流的向量场\"上层分析\"。 独立动态建模（不严格依赖 scVelo 输出）： Dynamo ：基于代谢标记（splicing/metabolic labeling）直接学习连续向量场。 scTour ：深度生成模型，学习潜在动态轨迹。 VIA ：基于向量场的图聚类轨迹推断。 提示 现状 近年 Vector field analysis 已逐渐从\"scVelo 的后处理\"发展为一类 独立的细胞动态建模方法 。Nature/Cell/Cancer Discovery 的论文现在常把 scVelo + CellRank + Vector field + Dynamo/scTour 放在一起做，互为佐证。 七、方法递进关系速记 # 聚类（Cluster） → 细胞有哪些类型？ 拟时序（Pseudotime） → 这些细胞大概按什么顺序变化？ RNA velocity → 每个细胞下一步最可能朝哪个方向变化？ Vector field analysis → 把所有变化方向整合成整个系统的动态流场， 推断分化路径、起点、终点、命运分支、稳定状态 相关笔记 # rapids-singlecell Demo Workflow scSurv 单细胞生存分析 单细胞 RNA 测序分析","tags":["单细胞","scRNA-seq","轨迹推断","拟时序","RNA-velocity","scVelo","向量场分析","动态建模"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"分析流程","updated":"2026-10-25T17:37:28.601Z","url":"bioinfo-tools/notes/ab274040bd672845469a3a99.html"},{"kbId":"KB-000091","title":"单细胞+生存分析怎么做？scSurv：深度学习算法评估每个细胞对患者生存结局影响","subtitle":"","summary":"CNS | 参考文献 scSurv 算法介绍scSurv是一种面向单细胞层面的生存分析方法，其核心目标是","body":"原创 华哥生信 2026年4月12日 22:31 CNS | 参考文献 scSurv 算法介绍 scSurv是一种面向单细胞层面的生存分析方法，其核心目标是解决“细胞异质性如何影响患者预后”的问题。该方法以单细胞RNA测序数据作为参考，通过深度生成模型学习细胞的潜在表达状态，并利用这些信息对具有临床随访数据的bulk RNA-seq样本进行单细胞级别的去卷积，从而推断每个样本中不同细胞状态的组成比例。在此基础上，scSurv将这些“细胞比例”作为协变量，引入扩展的Cox比例风险模型，进一步计算每一类细胞（甚至每一个细胞状态）对患者生存风险的贡献大小。与传统方法只能在“细胞类型”或“整体表达水平”上进行分析不同，scSurv实现了从“样本层→细胞层”的跨越，使研究者可以在单细胞分辨率下直接量化不同细胞对预后的正负影响，并进一步挖掘对应的关键基因和功能通路，为理解疾病机制提供更加精细和可解释的分析框架。 ![图片](data:image/svg+xml,%3C%3Fxml version='1.0' encoding='UTF-8'%3F%3E%3Csvg width='1px' height='1px' viewBox='0 0 1 1' version='1.1' xmlns=' http://www.w3.org/2000/svg ' xmlns:xlink=' http://www.w3.org/1999/xlink'%3E%3Ctitle%3E%3C/title%3E%3Cg stroke='none' stroke-width='1' fill='none' fill-rule='evenodd' fill-opacity='0'%3E%3Cg transform='translate(-249.000000, -126.000000)' fill='%23FFFFFF'%3E%3Crect x='249' y='126' width='1' height='1'%3E%3C/rect%3E%3C/g%3E%3C/g%3E%3C/svg%3E) 能解决的科学问题 scSurv主要解决的是“哪些细胞真正决定患者预后”这一核心问题，并进一步细化为多个层面：不仅可以识别哪些细胞类型与生存相关，还能够在同一细胞类型内部区分不同功能状态对预后的差异影响，从而揭示细胞异质性的真实生物学意义。同时，该方法还能挖掘与这些风险贡献相关的关键基因和通路，帮助理解其背后的分子机制；结合空间转录组数据，还可以进一步定位高风险细胞在组织中的分布位置，解析“危险细胞”在肿瘤微环境中的空间组织方式。整体来看，scSurv把传统“相关性分析”提升为“细胞—状态—空间—预后”的系统性解析框架，使我们能够从单细胞层面系统理解疾病进展与临床结局之间的联系。 生信分析启发 scSurv带来的最大启发是：在生信分析中，不应只停留在“分群+注释+差异分析”这一传统流程，而应进一步思考这些细胞是否真正与临床结局相关，以及它们的作用是正向还是负向。具体来说，一方面需要从“细胞类型”走向“细胞状态”，避免过度依赖聚类标签带来的信息损失；另一方面要主动将单细胞数据与临床数据（如生存、疗效）进行整合，而不是各自独立分析。 代码实操 # 1、创建conda环境并激活 conda create -n scSurv python=3.12conda activate scSurv 2、安装scSurv包 pip install scsurv 3、下载表达矩阵 作者提供的示例数据是 GEO 数据库中的黑色素瘤单细胞表达矩阵文件 GSE115978_counts.csv.gz 。这个文件里存的是基因表达计数，是后面构建单细胞对象的核心数据。 !wget https://ftp.ncbi.nlm.nih.gov/geo/series/GSE115nnn/GSE115978/suppl/GSE115978_counts.csv.gz 4、下载注释文件 下载该数据集对应的细胞注释文件 GSE115978_cell.annotations.csv.gz 。这个文件通常包含每个细胞的类别、样本来源等信息，后面会作为 obs 元数据写入 AnnData 对象中。 !wget https://ftp.ncbi.nlm.nih.gov/geo/series/GSE115nnn/GSE115978/suppl/GSE115978_cell.annotations.csv.gz 5、导入包 import pandas as pdimport scanpy as scfrom scipy.sparse import csr_matriximport scsurv.workflow as workflowimport matplotlib.pyplot as pltimport os 6、读取数据 ## 这一段代码是从 scsurv 包自带的数据目录中读取教程需要的配套文件。from importlib.resources import files, as_filebase = files(\"scsurv\") / \"data\"ref_genes = (base / \"SKCM_ref_5000genes.txt\").read_text(encoding=\"utf-8\").splitlines()with as_file(base / \"SKCM_checkpoint.pt\") as p: saved_pt = str(p)with as_file(base / \"SKCM_umap_coordinates.csv\") as p: umap_df = pd.read_csv(p, index_col=0) SKCM_ref_5000genes.txt：读取黑色素瘤教程预先筛好的 5000 个参考基因 SKCM_checkpoint.pt：读取已经训练好的 scSurv 模型参数文件 SKCM_umap_coordinates.csv：读取已经准备好的 UMAP 坐标，后面直接用于可视化 7、构建单细胞对象 s c_adat a 把原始下载的数据整理成 scSurv 可以直接使用的标准单细胞输入对象 # 读取表达矩阵 counts，并转置，让“行=细胞，列=基因”count_df = pd.read_csv('GSE115978_counts.csv.gz', index_col=0).T # 读取细胞注释表 annotationannotation_df = pd.read_csv('GSE115978_cell.annotations.csv.gz', index_col=0)# 用表达矩阵和注释信息创建 AnnData 对象sc_adata = sc.AnnData(X=csr_matrix(count_df.values), obs=annotation_df)# 设置基因名sc_adata.var_names = count_df.columns# 把细胞注释信息写入 obssc_adata.obs = annotation_df# 把不明确的细胞类型统一处理sc_adata.obs['cell.types'] = sc_adata.obs['cell.types'].replace('?', 'Undifined')# 把官方给好的 UMAP 坐标写入 obsm['X_umap']sc_adata.obsm['X_umap'] = umap_df\u003ca href=\"\u0026#39;UMAP1\u0026#39;%2C\u0026#39;UMAP2\u0026#39;\"\u003e\u0026#39;UMAP1\u0026#39;,\u0026#39;UMAP2\u0026#39;\u003c/a\u003e.to_numpy()# 最后只保留参考基因列表 ref_genes 中的基因sc_adata = sc_adata[:, ref_genes].copy() 8、设置运行参数 8.1这里没有手动传入 bulk 的 AnnData 对象，因为教程会依赖预训练资源或内置流程 bulk_adata = None 8.2 指定单细胞数据里表示批次/样本来源的列名是 batch_key = 'samples' 8.3 没有额外指定实验名称 exp_name = None 8.4 设定训练轮数上限为 10000 epoch = 10000 9、运行 scSurv 这里传了 saved_path=saved_pt ，所以这一步是在 加载官方训练好的模型参数并执行 scSurv 流程 ，而不是从头开始完整训练。 sc_adata, bulk_adata, _, _, scsurv_exp = workflow.run_scSurv( sc_adata, bulk_adata, exp_name, epoch, batch_key, saved_path=saved_pt) 输入： sc_adata 、 batch_key 、训练轮数、预训练 checkpoint 输出：更新后的 sc_adata 、 bulk_adata 、以及 scsurv_exp 这个实验结果对象 10、运行结果做后处理 这一步会把模型输出整理回 AnnData 对象里，比如把低维表示、去卷积结果、风险贡献值等附加到 sc_adata 或 bulk_adata 中，方便后面直接画图和解释结果。 sc_adata, bulk_adata, _ = workflow.post_process(scsurv_exp, sc_adata, bulk_adata) 11、可视化 os.makedirs('fig', exist_ok=True)fig, ax = plt.subplots(figsize=(8, 6))sc.pl.umap(sc_adata, color='cell.types', ax=ax, show=False, colorbar_loc=None, frameon=False, legend_fontsize=11)ax.set_title('', fontsize=20)plt.savefig('fig/SKCM_umap_celltype.png', bbox_inches='tight') ![图片](data:image/svg+xml,%3C%3Fxml version='1.0' encoding='UTF-8'%3F%3E%3Csvg width='1px' height='1px' viewBox='0 0 1 1' version='1.1' xmlns=' http://www.w3.org/2000/svg ' xmlns:xlink=' http://www.w3.org/1999/xlink'%3E%3Ctitle%3E%3C/title%3E%3Cg stroke='none' stroke-width='1' fill='none' fill-rule='evenodd' fill-opacity='0'%3E%3Cg transform='translate(-249.000000, -126.000000)' fill='%23FFFFFF'%3E%3Crect x='249' y='126' width='1' height='1'%3E%3C/rect%3E%3C/g%3E%3C/g%3E%3C/svg%3E) 不同细胞类型在UMAP空间中清晰分离，为后续分析“哪些细胞影响生存”提供基础。 fig, ax = plt.subplots(figsize=(9, 6))sc.pl.umap(sc_adata, color='beta_z', ax=ax, show=False, colorbar_loc='right', frameon=False)ax.set_title('Contribution to hazard', fontsize=20)plt.savefig('fig/SKCM_umap_beta_z.png') ![图片](data:image/svg+xml,%3C%3Fxml version='1.0' encoding='UTF-8'%3F%3E%3Csvg width='1px' height='1px' viewBox='0 0 1 1' version='1.1' xmlns=' http://www.w3.org/2000/svg ' xmlns:xlink=' http://www.w3.org/1999/xlink'%3E%3Ctitle%3E%3C/title%3E%3Cg stroke='none' stroke-width='1' fill='none' fill-rule='evenodd' fill-opacity='0'%3E%3Cg transform='translate(-249.000000, -126.000000)' fill='%23FFFFFF'%3E%3Crect x='249' y='126' width='1' height='1'%3E%3C/rect%3E%3C/g%3E%3C/g%3E%3C/svg%3E) scSurv将生存信息映射到单细胞层面，揭示不同细胞（甚至同一细胞类型内部）对预后的差异性贡献。这一步真正把“谁在影响生存”从样本层面下沉到了单细胞层面。 fig, (ax1, ax2) = plt.subplots(1, 2, figsize=(18, 6))sc.pl.umap(sc_adata, color='SPP1', ax=ax1, show=False, colorbar_loc='right', layer='xld', frameon=False, color_map='magma')ax1.set_title('SPP1 expression', fontsize=20)sc.pl.umap(sc_adata, color='TNFSF10', ax=ax2, show=False, colorbar_loc='right', layer='xld', frameon=False, color_map='magma')ax2.set_title('TNFSF10 expression', fontsize=20)plt.savefig('fig/SKCM_umap_SPP1_TNFSF10.png') ![图片](data:image/svg+xml,%3C%3Fxml version='1.0' encoding='UTF-8'%3F%3E%3Csvg width='1px' height='1px' viewBox='0 0 1 1' version='1.1' xmlns=' http://www.w3.org/2000/svg ' xmlns:xlink=' http://www.w3.org/1999/xlink'%3E%3Ctitle%3E%3C/title%3E%3Cg stroke='none' stroke-width='1' fill='none' fill-rule='evenodd' fill-opacity='0'%3E%3Cg transform='translate(-249.000000, -126.000000)' fill='%23FFFFFF'%3E%3Crect x='249' y='126' width='1' height='1'%3E%3C/rect%3E%3C/g%3E%3C/g%3E%3C/svg%3E) SPP1与差预后相关，而TNFSF10与好预后相关，验证了scSurv识别的风险细胞具有明确的分子基础。这一步把“风险细胞”进一步落实到具体基因，完成了从细胞到分子机制的闭环解释。 欢迎加入CNS生信交流群一起讨论与研究时下热门CNS文章各类生信分析方法（若二维码过期可以添加微信：huagesx） 孟德尔＋单细胞全文复现 孟德尔+单细胞全文复现（纯生信公共数据挖掘） 零基础想学生信，看 👇 这个文章 ： 零基础也能学的AI生信课（AI助力生信入门班即将开始） 想学机器学习，看 👇 这个文章 ： AI助力多组学与机器学习联合分析（机器学习分析代谢组、蛋白组、宏基因组、网络药理学、转录组） 想系统学单细胞，看 👇 这个文章 ： CNS文章单细胞数据分析内容汇总（基础--进阶--python分析） 想系统学空间转录组，看 👇 这个文章 ： Nature单细胞空间组学1:1复现训练营 跟着CNS文章学空间转录组分析线上直播课（Visium HD、Xenium、Stereo-seq） 欢迎关注 | 华哥科研平台 亲，写的这么辛苦，记得关注、点赞、转发哟！ 继续滑动看下一个 Bioinformation 向上滑动看下一个 闪记 复制 LaTeX 公式","tags":["clippings"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"分析流程","updated":"2026-10-25T17:37:28.601Z","url":"bioinfo-tools/notes/f222278a8592e0dd6dca22a7.html"},{"kbId":"KB-000089","title":"Installation","subtitle":"","summary":"Conda: The easiest way to install rapids-singlecell is to use one of the yaml files provided in the conda folder. These yaml files install everything needed to run the example notebooks and get you...","body":"安装＃ # 康达# # 安装 rapids-singlecell 最简单的方法是使用 conda 文件夹中提供的 yaml 文件之一。这些 yaml 文件会安装运行示例 notebook 所需的一切，帮助您快速入门。 conda env create -f conda/rsc_rapids_26.02_cuda13.yml # or mamba env create -f conda/rsc_rapids_26.02_cuda13.yml Python 3.13，CUDA 13.0 conda env create -f conda/rsc_rapids_26.02_cuda12.yml # or mamba env create -f conda/rsc_rapids_26.02_cuda12.yml Python 3.13，CUDA 12.9 笔记 RAPIDS 目前不支持 channel_priority: strict ；请改用 channel_priority: flexible 。 警告 main 分支上的 conda 环境文件引用了新的 rapids-singlecell-cu12 / -cu13 wheel 名称，但这些名称目前仅提供预发布版本。在 0.15.0 版本发布之前，请改用 v0.14.1 标签 中的环境文件，或者手动在 pip 命令中添加 --pre 。 PyPI # 笔记 预发布测试： 版本 0.15.0 目前处于预发布阶段。我们诚邀您参与测试并报告任何问题！请使用以下命令安装最新候选版本： pip install --pre rapids-singlecell-cu13 # or rapids-singlecell-cu12 请在 GitHub Issues 上报告任何问题。 从 0.15.0 版本开始， rapids-singlecell 通过 nanobind 提供预编译的 CUDA 内核。预编译的 wheel 文件适用于 x86_64 和 aarch64 Linux 系统，支持 CUDA 12 和 CUDA 13。 CUDA 版本兼容性# # 预编译的 wheel 文件支持以下 CUDA 运行时版本： 车轮 编译 运行时支持 GPU 架构 rapids-singlecell 来源分发 任何受支持的 CUDA 针对本地 GPU 架构进行编译 rapids-singlecell-cu12 不同 12.2 各种 12.2–12.9+ 图灵通过 Hopper（原生）、Blackwell（通过 PTX JIT） rapids-singlecell-cu13 不同 13.0 CUDA 13.0+ 浏览布莱克威尔（全部为本地语言） CUDA 12 的 wheel 包使用 CUDA 12.2 编译，以匹配 RAPIDS 26.02 支持矩阵 （CUDA 12.2–12.9）。Blackwell GPU（CC 100、120）通过 PTX 即时编译获得支持，该编译基于 wheel 包中包含的 sm_90 PTX 文件。CUDA 13 的 wheel 包包含原生 Blackwell 二进制文件，因此无需即时编译。 预组装轮组（推荐）# # 安装与您的 CUDA 版本相匹配的轮子： pip install rapids-singlecell-cu13 pip install rapids-singlecell-cu12 此操作会安装预编译的 CUDA 内核，但 不会安装 RAPIDS 协议栈（cupy、cuml、cudf 等）。对于已经在环境中安装了 RAPIDS 的 conda/mamba 用户 ，这是推荐的方法。 预构建的 wheel 文件包含 RAPIDS 依赖项# # 要通过 pip 安装 RAPIDS 堆栈，请使用 rapids extra。这需要使用 --extra-index-url 标志来指定 NVIDIA PyPI 索引： pip install 'rapids-singlecell-cu13[rapids]' --extra-index-url=https://pypi.nvidia.com pip install 'rapids-singlecell-cu12[rapids]' --extra-index-url=https://pypi.nvidia.com 源代码分发（自编译）# # PyPI 上的 rapids-singlecell 软件包包含源代码分发包。从源代码构建需要 CUDA 工具包和 C++ 编译器： pip install rapids-singlecell 安装过程中，系统会针对您的本地 GPU 架构编译 CUDA 内核。您可以使用 rapids-cu12 或 rapids-cu13 扩展包选择 RAPIDS 依赖项： pip install 'rapids-singlecell[rapids-cu12]' --extra-index-url=https://pypi.nvidia.com 笔记 从源代码构建需要您的环境中具备 CUDA 工具包 (nvcc) 和 CMake \u003e= 3.24。 从 GitHub 安装# # 要直接从 GitHub 安装最新开发版本： pip install \"rapids-singlecell @ git+https://github.com/scverse/rapids_singlecell.git\" 或者从特定分支或标签来看： pip install \"rapids-singlecell @ git+https://github.com/scverse/rapids_singlecell.git@main\" 此操作会在安装过程中编译 CUDA 内核。默认情况下，内核仅针对本地 GPU 架构（ native ）进行编译。要针对不同或多个架构进行编译，请传递配置设置以覆盖 CUDA 架构： # Compile for a specific architecture (e.g., Ampere) pip install -C cmake.define.CMAKE_CUDA_ARCHITECTURES=\"80-real\" \"rapids-singlecell @ git+https://github.com/scverse/rapids_singlecell.git\" # Compile for multiple architectures pip install -C cmake.define.CMAKE_CUDA_ARCHITECTURES=\"80-real;86-real;89-real;90-real\" \"rapids-singlecell @ git+https://github.com/scverse/rapids_singlecell.git\" 常用架构代码： 代码 GPU 世代 示例 75 图灵 T4，RTX 2080 80 安培 A100、A30 86 安培 A10，RTX 3090 89 艾达·洛夫莱斯 L4、L40、RTX 4090 90 料斗 H100，H200 100 布莱克威尔 B200，GB200 120 布莱克威尔 B300，RTX PRO 6000 提示 如果只需要在本地 GPU 上运行，请使用 native （默认）以获得最快的编译速度。构建可移植二进制文件时（例如，用于具有混合 GPU 类型的共享集群），请使用多种架构。 -real 后缀仅生成设备代码（不回退到 PTX），从而减小二进制文件的大小。 Docker # 我们还提供 rapids-singlecell 的 Docker 容器。这些容器包含所有必要的依赖项，让您更容易上手 rapids-singlecell 。 要使用 Docker 容器，首先请确保您的系统已安装 Docker，并且 Docker 支持 NVIDIA 容器工具包 。然后，拉取与您的 CUDA 版本匹配的 Docker 镜像： docker pull ghcr.io/scverse/rapids-singlecell-cu13:latest docker pull ghcr.io/scverse/rapids-singlecell-cu12:latest 要运行 Docker 容器，请使用以下命令： docker run --rm --gpus all ghcr.io/scverse/rapids-singlecell-cu13:latest docker run --rm --gpus all ghcr.io/scverse/rapids-singlecell-cu12:latest Docker 容器也可以在 HPC 系统上与 Apptainer（或 Singularity）配合使用。 首先拉取容器并将其包装在 .sif 文件中： apptainer pull rsc.sif docker://ghcr.io/scverse/rapids-singlecell-cu13:latest apptainer pull rsc.sif docker://ghcr.io/scverse/rapids-singlecell-cu12:latest 然后运行以下命令来执行容器： apptainer run --nv rsc.sif 系统要求# # 大多数计算都在 GPU 上运行。有关硬件指导、管理内存和已知限制，请参阅内存管理页面： 内存管理","tags":["clippings"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"分析流程","updated":"2026-10-25T17:37:28.600Z","url":"bioinfo-tools/notes/aa00ead1f7501943993a8bcf.html"},{"kbId":"KB-000090","title":"Basic Demo Workflow","subtitle":"","summary":"Author: Severin Dicks Copyright scverse In this notebook, we demonstrate the GPU-acceleration capabilities of rapids-SingleCell for efficient single-cell analysis. This tutorial showcases how to le...","body":"基本演示工作流程 # 作者： Severin Dicks 版权所有 scverse 在本笔记本中，我们展示了 rapids-SingleCell 的 GPU 加速功能， 以实现高效的单细胞分析。 本教程展示了如何利用 GPU 计算 来显著加快分析工作流程。 该方法通过简单的 GPU 集成，实现了 高性能的单细胞分析 ，将传统上耗时的分析转变为快速的工作流程。 import scanpy as sc import cupy as cp import time import rapids_singlecell as rsc import warnings warnings.filterwarnings(\"ignore\") import rmm from rmm.allocators.cupy import rmm_cupy_allocator rmm.reinitialize( managed_memory=False, # Allows oversubscription pool_allocator=False, # default is False devices=0, # GPU device IDs to register. By default registers only GPU 0. ) cp.cuda.set_allocator(rmm_cupy_allocator) 加载和准备数据# # 我们使用 Scanpy 从 h5ad 文件中加载稀疏计数矩阵。然后，该稀疏计数矩阵将被放置在 GPU 上。 data_load_start = time.time() %%time adata = sc.read(\"h5/dli_census.h5ad\") CPU times: user 344 ms, sys: 1.37 s, total: 1.71 s Wall time: 1.71 s %%time rsc.get.anndata_to_GPU(adata) CPU times: user 152 ms, sys: 2.2 s, total: 2.35 s Wall time: 2.35 s data_load_time = time.time() print(\"Total data load and format time: %s\" % (data_load_time - data_load_start)) Total data load and format time: 4.077548503875732 预处理# # preprocess_start = time.time() adata.var_names = adata.var.feature_name 质量控制# # 我们计算质量控制 (QC) 指标来评估细胞和基因质量。这些指标包括： 每个单元格的指标 ： 每个细胞的总计数（文库大小） 每个细胞检测到的基因数量 线粒体（ MT ）和核糖体（ RIBO ）基因计数百分比 每个基因的指标 （基因空间）： 每个基因的总计数 表达每种基因的细胞数量 这些指标有助于识别低质量或受损的细胞，并确保为下游分析提供有意义的特征集。 %%time rsc.pp.flag_gene_family(adata, gene_family_name=\"MT\", gene_family_prefix=\"MT\") CPU times: user 6.75 ms, sys: 0 ns, total: 6.75 ms Wall time: 6.71 ms %%time rsc.pp.flag_gene_family(adata, gene_family_name=\"RIBO\", gene_family_prefix=\"RPS\") CPU times: user 6.3 ms, sys: 0 ns, total: 6.3 ms Wall time: 6.22 ms %%time rsc.pp.calculate_qc_metrics(adata, qc_vars=[\"MT\", \"RIBO\"]) CPU times: user 66.7 ms, sys: 7.9 ms, total: 74.6 ms Wall time: 74.4 ms 为了可视化质量控制（QC）指标，我们生成以下图表： 散点图：总计数与线粒体百分比 该图显示了每个细胞的总 UMI 计数与线粒体 ( MT ) 基因表达百分比之间的关系。 线粒体百分比高的细胞可能表明细胞处于应激状态或濒死状态。 散点图：总计数与检测到的基因数量 该图显示了每个细胞的总 UMI 计数与检测到的基因数量之间的相关性。 预计会存在很强的相关性，但基因计数低的异常值可能表明存在空液滴或死亡细胞。 小提琴图：每个细胞检测到的基因数量 该小提琴图可视化了每个细胞中检测到的基因数量的分布情况。 它有助于识别基因数量异常低或异常高的细胞，从而可以将其过滤掉。 小提琴图：每个单元格的总计数 该图显示了每个细胞的总计数分布，表明文库大小的变化。 极端值可能表明细胞质量低下或细胞数量过多。 小提琴图：每个细胞中线粒体数量的百分比 该图展示了线粒体基因表达在所有细胞中的分布情况。 线粒体含量过高可能是细胞应激或细胞凋亡的迹象。 这些可视化方法有助于评估数据集质量，并指导对低质量细胞进行过滤的决策。 sc.pl.scatter(adata, x=\"total_counts\", y=\"pct_counts_MT\") sc.pl.scatter(adata, x=\"total_counts\", y=\"n_genes_by_counts\") sc.pl.violin(adata, \"n_genes_by_counts\", jitter=0.4, groupby=\"assay\") sc.pl.violin(adata, \"total_counts\", jitter=0.4, groupby=\"assay\") sc.pl.violin(adata, \"pct_counts_MT\", jitter=0.4, groupby=\"assay\") Filter # We filter the count matrix to remove cells with an extreme number of genes expressed. We also filter out cells with a mitchondrial countent of more than 20%. %%time adata = adata[adata.obs[\"n_genes_by_counts\"] \u003c 5000] adata = adata[adata.obs[\"pct_counts_MT\"] \u003c 20] CPU times: user 125 ms, sys: 16.1 ms, total: 141 ms Wall time: 141 ms We also filter out genes that are expressed in less than 3 cells. %%time rsc.pp.filter_genes(adata, min_cells=3) filtered out 33823 genes that are detected in less than 3 cells CPU times: user 411 ms, sys: 108 ms, total: 519 ms Wall time: 749 ms The size of our count matrix is now reduced. adata.shape (213082, 28065) Normalize # We normalize the count matrix so that the total counts in each cell sum to 1e4. %%time rsc.pp.normalize_total(adata, target_sum=1e4) CPU times: user 744 μs, sys: 86 μs, total: 830 μs Wall time: 682 μs Next, we data transform the count matrix. %%time rsc.pp.log1p(adata) CPU times: user 9.37 ms, sys: 20.4 ms, total: 29.7 ms Wall time: 92.2 ms Select Most Variable Genes # We now search for highly variable genes. This function supports the flavors cell_ranger , seurat , seurat_v3 , and pearson_residuals . As in Scanpy, you can either filter based on variance cutoffs or select the n_top_genes . Additionally, you can use a batch_key to correct for batch effects. In this example, we use the cell_ranger method, which selects highly variable genes based on the log-normalized counts stored in .X . %%time rsc.pp.highly_variable_genes(adata, n_top_genes=5000, flavor=\"cell_ranger\") CPU times: user 204 ms, sys: 16.2 ms, total: 220 ms Wall time: 218 ms Now we safe this version of the AnnData as adata.raw. %%time adata.raw = adata CPU times: user 231 ms, sys: 146 ms, total: 377 ms Wall time: 376 ms We now restrict our AnnData object to only the highly variable genes. This step reduces the number of features, focusing the analysis on the most informative genes while improving computational efficiency. %%time rsc.pp.filter_highly_variable(adata) CPU times: user 493 ms, sys: 318 ms, total: 811 ms Wall time: 810 ms Next, we regress out the effects of total counts per cell and mitochondrial content. This helps remove technical variation that could bias downstream analyses. As in Scanpy, you can regress out any numerical column from .obs , allowing for the correction of batch effects, sequencing depth, or other confounding factors. %%time rsc.pp.regress_out(adata, keys=[\"total_counts\", \"pct_counts_MT\"]) CPU times: user 702 ms, sys: 808 ms, total: 1.51 s Wall time: 1.51 s Scale # Finally, we scale the count matrix to obtain a z-score transformation, standardizing gene expression across cells. To prevent extreme values from dominating the analysis, we apply a cutoff of 10 standard deviations. This ensures that highly expressed genes do not disproportionately influence downstream computations. %%time rsc.pp.scale(adata, max_value=10) CPU times: user 58.9 ms, sys: 852 μs, total: 59.8 ms Wall time: 59.1 ms Now we move .X out of the GPU. preprocess_time = time.time() print(\"Total Preprocessing time: %s\" % (preprocess_time - preprocess_start)) Total Preprocessing time: 8.972412824630737 Clustering and Visualization # Principal component analysis # We use Principal Component Analysis (PCA) to reduce the dimensionality of the gene expression matrix to its top 100 principal components. This step captures the most important sources of variation in the data while reducing computational complexity. We use the GPU-accelerated PCA implementation from cuML, which significantly speeds up computation compared to CPU-based methods. %%time rsc.tl.pca(adata, n_comps=100) CPU times: user 1.26 s, sys: 145 ms, total: 1.4 s Wall time: 1.61 s We can use scanpy pca_variance_ratio plot to inspect the contribution of single PCs to the total variance in the data. sc.pl.pca_variance_ratio(adata, log=True, n_pcs=100) Now, we transfer the .X matrix back to host (CPU) memory to free up GPU resources. Since some downstream analyses or visualizations may not require GPU acceleration, this step helps optimize memory usage, preventing unnecessary GPU load while still keeping the processed data accessible for further analysis. rsc.get.anndata_to_CPU(adata) Computing the neighborhood graph and UMAP # Next, we compute the neighborhood graph using rsc . Scanpy’s CPU-based implementation of nearest neighbor search uses an approximation, while the GPU-accelerated RAPIDS implementation computes the exact graph. Both methods are valid, but small differences in results can occur. The following approximate nearest neighbor (ANN) algorithms are also supported: ivfflat : Uses an inverted file index for fast approximate search, suitable for very large datasets. ivfpq : A variant of ivfflat that compresses data for even more efficient memory usage, trading off some accuracy. cagra : A graph-based ANN method optimized for fast, high-accuracy queries on GPUs. nn_descent : A graph-based method that incrementally refines the nearest neighbor search and works well for large, high-dimensional datasets. Since our dataset is relatively small, we use brute-force ( brute ) search to ensure exact results. %%time rsc.pp.neighbors(adata, n_neighbors=15, n_pcs=40) CPU times: user 1.15 s, sys: 148 ms, total: 1.3 s Wall time: 1.29 s Next, we calculate the UMAP embedding using RAPIDS. UMAP (Uniform Manifold Approximation and Projection) is a dimensionality reduction technique that preserves local and global structure in the data. The RAPIDS implementation accelerates UMAP computation on GPUs, making it significantly faster than the standard CPU version. %%time rsc.tl.umap(adata) CPU times: user 287 ms, sys: 77.1 ms, total: 364 ms Wall time: 362 ms Clustering # Next, we use the Louvain and Leiden algorithms for graph-based clustering with RAPIDS. Both methods detect communities (clusters) in the neighborhood graph by optimizing modularity: Louvain : A hierarchical clustering algorithm that iteratively refines clusters for optimal modularity. Leiden : An improved version of Louvain that guarantees well-connected, more stable clusters. Using RAPIDS accelerates the clustering process on GPUs, making it significantly faster than traditional CPU implementations. %%time rsc.tl.louvain(adata, resolution=0.6) CPU times: user 919 ms, sys: 1.24 s, total: 2.16 s Wall time: 2.15 s %%time rsc.tl.leiden(adata, resolution=0.6) CPU times: user 697 ms, sys: 1.13 s, total: 1.83 s Wall time: 1.82 s %%time sc.pl.umap(adata, color=[\"louvain\", \"leiden\"], legend_loc=\"on data\") CPU times: user 1.37 s, sys: 17.7 ms, total: 1.39 s Wall time: 1.38 s sc.pl.umap(adata, color=[\"cell_type\", \"assay\"],ncols=1,) Batch Correction # In the previous UMAP, we observed strong batch effects between assay types. To correct for this, we apply Harmony , a method that aligns different batches while preserving biological variation. After applying Harmony, we will redo: Neighborhood search to recompute the k-nearest neighbor graph UMAP to visualize the corrected embedding Graph-based clustering to identify cell populations without batch-driven artifacts This ensures that batch effects do not drive clustering results while retaining meaningful biological structure. import rmm from rmm.allocators.cupy import rmm_cupy_allocator rmm.reinitialize( managed_memory=False, # Allows oversubscription pool_allocator=True, # default is False devices=0, # GPU device IDs to register. By default registers only GPU 0. ) cp.cuda.set_allocator(rmm_cupy_allocator) %%time rsc.pp.harmony_integrate(adata, key=\"assay\", dtype=cp.float32) CPU times: user 4.41 s, sys: 117 ms, total: 4.53 s Wall time: 4.53 s %%time rsc.pp.neighbors(adata, n_neighbors=15, n_pcs=40,use_rep=\"X_pca_harmony\",key_added=\"harmony\") rsc.tl.umap(adata,neighbors_key=\"harmony\",key_added=\"X_umap_harmony\") rsc.tl.louvain(adata, resolution=0.6,neighbors_key=\"harmony\",key_added=\"louvain_harmony\") rsc.tl.leiden(adata, resolution=0.6,neighbors_key=\"harmony\",key_added=\"leiden_harmony\") CPU times: user 2.12 s, sys: 632 ms, total: 2.75 s Wall time: 2.75 s %%time sc.pl.embedding(adata,basis=\"X_umap_harmony\", color=[\"louvain_harmony\", \"leiden_harmony\"], legend_loc=\"on data\") CPU times: user 1.38 s, sys: 12 ms, total: 1.39 s Wall time: 1.39 s sc.pl.embedding(adata,basis=\"X_umap_harmony\", color=[\"cell_type\", \"assay\"], ncols=1) TSNE # Next, we use t-distributed Stochastic Neighbor Embedding (t-SNE) to visualize cells in two dimensions. t-SNE is a non-linear dimensionality reduction technique that preserves local structure and reveals complex patterns in the data. We leverage the RAPIDS GPU implementation of t-SNE, which is significantly faster than CPU-based methods. This allows us to efficiently process large datasets while maintaining high-quality embeddings. %%time rsc.tl.tsne(adata, n_pcs=40, perplexity=30, early_exaggeration=12, learning_rate=200, use_rep=\"X_pca_harmony\") [W] [16:13:09.501768] # of Nearest Neighbors should be at least 3 * perplexity. Your results might be a bit strange... CPU times: user 2.31 s, sys: 2.29 s, total: 4.6 s Wall time: 4.57 s sc.pl.tsne(adata, color=[\"cell_type\", \"assay\"], ncols=1) Differential expression analysis # To identify key marker genes for each cell type, we use logistic regression to compute a ranking of highly differential genes. Unlike traditional statistical tests, logistic regression models the probability of a gene being highly expressed in a given cluster while accounting for all genes simultaneously, making it more robust for complex datasets. We rank the top 50 genes that best distinguish each cell type , helping to characterize biological differences between clusters. %%time rsc.tl.rank_genes_groups_logreg(adata, groupby=\"cell_type\", use_raw=False) [W] [16:13:33.249025] L-BFGS: max iterations reached [W] [16:13:33.249241] Maximum iterations reached before solver is converged. To increase model accuracy you can increase the number of iterations (max_iter) or improve the scaling of the input data. CPU times: user 11.1 s, sys: 6.64 s, total: 17.7 s Wall time: 17.7 s sc.pl.rank_genes_groups(adata) post_time = time.time() print(\"Total Postprocessing time: %s\" % (post_time - preprocess_time)) Total Postprocessing time: 46.12144637107849 Diffusion Map Embedding # Next, we compute Diffusion Maps , a nonlinear dimensionality reduction method that preserves the continuous structure of the data. Unlike UMAP and t-SNE, Diffusion Maps are well-suited for capturing trajectory-like relationships in single-cell data. We use the batch-corrected neighborhood graph ( neighbors_key=\"harmony\" ) to ensure that the embedding is not influenced by batch effects. %%time rsc.tl.diffmap(adata,neighbors_key=\"harmony\") #Due to an issue with plotting in Scanpy, we need to shift the first component of the diffusion map by removing the first column: adata.obsm[\"X_diffmap\"] = adata.obsm[\"X_diffmap\"][:, 1:] CPU times: user 1.54 s, sys: 261 μs, total: 1.54 s Wall time: 1.54 s sc.pl.diffmap(adata, color=\"cell_type\") print(\"Total Processing time: %s\" % (time.time() - preprocess_start)) Total Processing time: 57.584962129592896 adata.write(\"h5/dli_decoupler.h5ad\")","tags":["clippings"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"分析流程","updated":"2026-10-25T17:37:28.600Z","url":"bioinfo-tools/notes/4a475990112d9760e7c6242d.html"},{"kbId":"KB-000088","title":"Starlitnightly/omicverse: A python library for multi omics included bulk, single cell and spatial RNA-seq analysis.","subtitle":"","summary":"A python library for multi omics included bulk, single cell and spatial RNA-seq analysis. - Starlitnightly/omicverse","body":"English | Español | 日本語 | Deutsch | Français | 한국어 CI/CD Docs Package Meta OmicVerse v2 是一个面向现代转录组学与多组学分析的统一 Python 项目，覆盖 bulk RNA-seq、单细胞、空间转录组、可视化、模型分析与 AI 辅助工作流。了解更多背景，请阅读我们的论文： OmicVerse: a framework for bridging and deepening insights across bulk and single-cell sequencing 重点 Important 给我们点个星 , 您将及时收到GitHub的所有发布通知 ~ ⭐️ 如果您喜欢 OmicVerse 并想支持我们的使命，请考虑 💗捐赠 来支持我们的努力。 说明 Note 为了更好地服务中文用户社区，我们创建了微信群，欢迎在issue中扫描二维码加入： #294 Star历史 1 简介 # OmicVerse v2 是一个面向现代转录组学与多组学分析的统一 Python 项目。它将 bulk RNA-seq、单细胞分析、空间转录组、可视化、基于模型的分析，以及 AI 辅助工作流整合到同一个包和文档体系中。 说明 Note OmicVerse v2 现在更强调一个完整的分析平台，而不再只是单一方法集合。除了核心分析模块之外，它还包含通过 J.A.R.V.I.S. 提供的 agent 式工作流、面向 AI 客户端的 MCP 工具服务，以及持续扩展的 omicverse_guide 教程与文档系统。 2 # . ├── omicverse # 主要Python包 ├── omicverse_guide # 文档文件 ├── omicverse_web # Web分析平台 ├── sample # 一些测试数据 ├── LICENSE └── README.md 3 # OmicVerse可以通过conda或pypi安装，您需要首先安装 pytorch 。请参考 安装教程 了解更详细的安装步骤和不同平台的适配（ Windows 、 Linux 或 Mac OS ）。 您可以使用 conda install omicverse -c conda-forge 或 pip install -U omicverse 进行安装。 请查看 omicverse页面 或 omicverse.readthedocs.io 上的文档和教程。 4 # 4.1 OpenClaw # OmicVerse 现在可以与 OpenClaw 项目配合进行直接交互式分析，例如： omicverse claw 'help me annotate the lung scrna-seq' 这个模块由 ov.Agent 提供支持，适合通过对话方式分析 AnnData 。 完整教程可见 这里 4.2 MCP Server（Model Context Protocol） # OmicVerse 提供了一个 MCP 服务器，可通过标准 Model Context Protocol 将已注册的分析工具暴露给 Claude Code 等 AI 助手。 # 安装 MCP 依赖 pip install -e \"omicverse[mcp]\" # 启动服务器（stdio transport） python -m omicverse.mcp # 或者：omicverse-mcp python -m omicverse.mcp --phase P0 # 仅启用核心流程工具 完整教程可见 这里 4.3 J.A.R.V.I.S 消息系统 # 如果你想通过手机等消息端分析 AnnData ，可以尝试： # 安装 jarvis 依赖 pip install \"omicverse[jarvis]\" # 通过 Telegram 启动 J.A.R.V.I.S omicverse jarvis --channel telegram --token \"$TELEGRAM_BOT_TOKEN\" 完整教程可见 这里 5 # omicverse基于以下四种数据结构实现。 pandas anndata numpy mudata 该表包含已发布的工具 Scanpy 📦 📖 dynamicTreeCut 📦 📖 scDrug 📦 📖 MOFA 📦 📖 COSG 📦 📖 CellphoneDB 📦 📖 AUCell 📦 📖 Bulk2Space 📦 📖 SCSA 📦 📖 WGCNA 📦 📖 StaVIA 📦 📖 pyDEseq2 📦 📖 NOCD 📦 📖 SIMBA 📦 📖 GLUE 📦 📖 MetaTiME 📦 📖 TOSICA 📦 📖 Harmony 📦 📖 Scanorama 📦 📖 Combat 📦 📖 TAPE 📦 📖 SEACells 📦 📖 Palantir 📦 📖 STAGATE 📦 📖 scVI 📦 📖 MIRA 📦 📖 Tangram 📦 📖 STAligner 📦 📖 CEFCON 📦 📖 PyComplexHeatmap 📦 📖 STT 📦 📖 SLAT 📦 📖 GPTCelltype 📦 📖 PROST 📦 📖 CytoTrace2 📦 📖 GraphST 📦 📖 COMPOSITE 📦 📖 mellon 📦 📖 starfysh 📦 📖 COMMOT 📦 📖 flowsig 📦 📖 pyWGCNA 📦 📖 CAST 📦 📖 scMulan 📦 📖 cellANOVA 📦 📖 BINARY 📦 📖 GASTON 📦 📖 pertpy 📦 📖 inmoose 📦 📖 memento 📦 📖 GSEApy 📦 📖 marsilea 📦 📖 scICE 📦 📖 sude 📦 📖 GeneFromer 📦 📖 scGPT 📦 📖 scFoundation 📦 📖 UCE 📦 📖 CellPLM 📦 📖 kb_python 📦 📖 Scaden 📦 📖 BayesPrime 📦 📦 📖 InstaPrime 📦 📖 Cellpytist 📦 📖 latentvelo 📦 📖 graphvelo 📦 📖 scvelo 📦 📖 Dynamo 📦 📖 CONCORD 📦 📖 FlashDeconv 📦 📖 Hospot 📦 📖 Banksy 📦 📖 STAR 📦 📖 fastp 📦 📖 featureCounts 📦 📖 edgeR 📦 📖 包含的包未发布或预印本 [1] Cellula 是用于探索scRNA-seq的工具包。这些工具执行常见的单细胞分析任务 [2] pegasus 是分析数百万个单细胞转录组的工具。它是一个命令行工具、一个python包和基于云的分析工作流的基础。 [3] cNMF 是从单细胞RNA-Seq (scRNA-Seq)数据推断基因表达程序的分析管道。 6 # Zehua Zeng ( starlitnightly@gmail.com 或 zehuazeng@xs.ustb.edu.cn ) Lei Hu ( hulei@westlake.edu.cn ) 7 # 如果您想为omicverse贡献代码，请参考我们的 开发者文档 。 本地运行测试 # 安装测试依赖并使用 pytest 运行测试： pip install -e .[tests] # 或安装最新固定依赖 pip install -r requirements-latest.txt pytest 可选的 tests extra 和 requirements-latest.txt 文件已经包含 pytest-asyncio\u003e=0.23 ，这是 tests/utils/ 目录下异步流式测试所必需的。 重点 Important 我们要感谢以下微信公众号推广Omicverse。 如果您在工作中使用 omicverse ，请按以下方式引用 omicverse 论文： OmicVerse: a framework for bridging and deepening insights across bulk and single-cell sequencing Zeng, Z., Ma, Y., Hu, L. et al. Nature Communication 2024年7月16日. doi: 10.1038/s41467-024-50194-3IF: 15.7 Q1 . 以下是一些其他相关包，如果您使用它们，请随时引用它们！ CellOntologyMapper: Consensus mapping of cell type annotation Zeng, Z., Wang, X., Du, H. et al. imetaomics 2025年11月6日. doi: 10.1002/imo2.70064 . 9 # 如果您想赞助我们项目的开发，可以前往爱发电网站 ( https://ifdian.net/a/starlitnightly ) 赞助我们。 版权所有 © 2024 112 Lab 。 本项目采用 GPL3.0 许可证。","tags":["clippings"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"分析流程","updated":"2026-10-25T17:37:28.599Z","url":"bioinfo-tools/notes/f5b32534172a85c76c5a2a57.html"},{"kbId":"KB-000087","title":"OmicVerse-Notebook｜全方位优化你的分析显示","subtitle":"","summary":"你是否上手Jupyter-Noteboook分析数据的时候感觉到有点困难？","body":"原创 steorra 2026年3月30日 18:28 编者按 你是否上手Jupyter-Noteboook分析数据的时候感觉到有点困难？尤其是对于单细胞而言，为了便利小白和我自己，于是我开发了这一款极其轻便的插件，仅100Kb，只有两个依赖。 Steorra 1. 安装 # 安装非常非常简单，没有OmicVerse的重依赖，仅需使用pip，完全兼容scanpy的生态体系，即使你没有安装omicverse。 pip install omicverse-notebook 2. 设置 # 我们仅需要在我们的Jupyterlab的代码行前加上一句 %load_ext omicverse_notebook 即可，只需要加一次，后续所有代码均生效。 %load_ext omicverse_notebook import pandas as pd 3. 报错显示优化 # 你还在为报错显示而苦恼吗？借助OmicVerse-Notebook，我们可以非常清晰地看见报错信息的全方位定义 3.1 核心报错信息 # 我们将最核心的报错信息放在顶部 3.2 报错内容 # 当你点击 What 按钮，你将看见报错信息的解释（非Agent） 3.3 报错原因 # 当你点击 Why 按钮的时候，你将看见报错信息的原因 3.4 报错位置 # 当你点击 Where 按钮的时候，你可以看见报错信息发生的具体位置。 3.5 原始报错信息 # 当然原始的报错信息你也可以点击 Traceback 查看，然后复制到大语言模型里Debug。 4. AnnData显示优化 # 4.1 AnnData基础显示优化 # 我们全面优化了AnnData的显示效果，将每个变量都做成了可点击的按钮，这样可以非常方便地查看AnnData的具体内容，不需要写额外的代码。 4.2 AnnData可视化优化 # 我们还支持直接查看umap/spatial等一切存放在obsm里的内容 5. DataFrame显示优化 # 我们在优化AnnData的过程，顺带把Pandas库里的DataFrame的显示也进行了优化 6. 双色主题 # 安装完OmicVerse-Notebook后，你还将同时获得双色的Jupyterlab主题 6.1 浅色系 # 点击 Setting -\u003e Theme -\u003e omicverse-light 即可替换 6.1 暗色系 # 点击 Setting -\u003e Theme -\u003e omicverse-dark 即可替换 7.结语 # 本插件的作用仅是优化大家的分析体验，毕竟，我们打算做最好的开源组学分析生态。 如果你觉得本教程对你的分析有作用的话，请你引用 Zeng, Z., Wang, X., Luo, Z., Zheng, Y., Hu, L., Xing, C., \u0026 Du, H. (2026). OmicClaw: executable and reproducible natural-language multi-omics analysis over the unified OmicVerse ecosystem. bioRxiv, 2026-03 Zeng, Z., Ma, Y., Hu, L., Tan, B., Liu, P., Wang, Y.,... \u0026 Du, H. (2024). OmicVerse: a framework for bridging and deepening insights across bulk and single-cell sequencing. Nature Communications, 15(1), 5983. 本文来自OmicVerse开发团队，欢迎转载 如有需要请联系 steorra@stanford.edu ![图片](data:image/svg+xml,%3C%3Fxml version='1.0' encoding='UTF-8'%3F%3E%3Csvg width='1px' height='1px' viewBox='0 0 1 1' version='1.1' xmlns=' http://www.w3.org/2000/svg ' xmlns:xlink=' http://www.w3.org/1999/xlink'%3E%3Ctitle%3E%3C/title%3E%3Cg stroke='none' stroke-width='1' fill='none' fill-rule='evenodd' fill-opacity='0'%3E%3Cg transform='translate(-249.000000, -126.000000)' fill='%23FFFFFF'%3E%3Crect x='249' y='126' width='1' height='1'%3E%3C/rect%3E%3C/g%3E%3C/g%3E%3C/svg%3E) 继续滑动看下一个 OmicAI 向上滑动看下一个 闪记","tags":["clippings"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"分析流程","updated":"2026-10-25T17:37:28.599Z","url":"bioinfo-tools/notes/00624a36486ba90c289ec90d.html"},{"kbId":"KB-000086","title":"aisdk：在 R console 聊天，让 AI 干活","subtitle":"","summary":"关键词：R、RStudio、AI SDK、智能体、API Key、BASE URL、console chat、AI 辅助写代码 aisdk 全称是 The AI SDK for R ，是 YuLab-SMU 开发的 R 包，用于在 R 语言中构建 AI 驱动应用。 GitHub： 官方文档： 一句话理解： aisdk 可以把 AI 助手搬进 R console，让你在 RStudio 里直接聊天、写代码、调试、画图和运行分析任务。 尤其适合： 经常使用 R / RStudio","body":"关键词：R、RStudio、AI SDK、智能体、API Key、BASE URL、console_chat、AI 辅助写代码 1. aisdk 是什么？ # aisdk 全称是 The AI SDK for R ，是 YuLab-SMU 开发的 R 包，用于在 R 语言中构建 AI 驱动应用。 GitHub： https://github.com/YuLab-SMU/aisdk/ 官方文档： https://yulab-smu.top/aisdk/ 一句话理解： aisdk 可以把 AI 助手搬进 R console，让你在 RStudio 里直接聊天、写代码、调试、画图和运行分析任务。 2. 适合谁用？ # 尤其适合： 经常使用 R / RStudio 的生信学习者； 想让 AI 帮忙写 R 代码、解释报错、画图的人； 想在 RMarkdown、Quarto、Shiny 中接入 AI 的用户； 想尝试 Agent，但又不想离开 R 工作环境的人。 3. 核心功能速览 # 功能 说明 统一 API 可用类似方式调用 OpenAI、Anthropic、DeepSeek、Gemini、AiHubMix 等模型 console_chat 在 R console 中和 AI 对话 Agent 框架 支持 Agents、Tasks、Flows 工具调用 可把 R 函数包装成 AI 可调用工具 结构化输出 支持 JSON、data frame 等格式 有状态会话 支持带历史记录的多轮对话 ask_ai R 报错后自动收集上下文并让 AI 分析 R 生态集成 可和 Shiny、RMarkdown、Quarto 结合 对新手来说，先掌握这一条路线就够了： 安装 aisdk → 配置 API_KEY / BASE_URL / MODEL → console_chat() → 让 AI 帮你写 R 代码 4. 安装 aisdk # 建议安装 GitHub 最新版： # 如果没有 devtools，先安装 install.packages(\"devtools\") # 从 GitHub 安装 aisdk devtools::install_github(\"YuLab-SMU/aisdk\") library(aisdk) packageVersion(\"aisdk\") 教程原文中示例版本是 1.1.2 ，GitHub 主页中已经能看到更高版本信息。实际版本以本地安装结果为准。 5. 使用前必须准备的 3 个东西 # 调用 AI 模型通常需要： 项目 作用 API_KEY 模型服务的访问钥匙，相当于密码 BASE_URL 模型服务接口地址 MODEL 要调用的具体模型名 示例： OPENAI_API_KEY=sk-xxxxxxxxxxxxxxxx OPENAI_BASE_URL=https://api.deepseek.com OPENAI_MODEL=deepseek-chat 注意 API Key 不要公开发到微信群、公众号、GitHub、截图或公开 Obsidian 库里。 6. 当前已跑通的中转 API 配置示例 # 这次实际测试中，之前报错的原因是： Sys.getenv(\"OPENAI_BASE_URL\") # [1] \"\" Sys.getenv(\"OPENAI_MODEL\") # [1] \"\" 也就是 API Key 有了，但 BASE_URL 和 MODEL 没有配置 。 后来临时设置后成功跑通： Sys.setenv(OPENAI_BASE_URL = \"https://your-api-host.example/v1\") Sys.setenv(OPENAI_MODEL = \"gpt-5.5\") library(aisdk) set_model(\"openai:gpt-5.5\") response \u003c- generate_text(prompt = \"用中文简单解释 testthat 是干什么的。\") cat(response$text) 成功返回了关于 testthat 的中文解释，说明： aisdk 可以通过 OpenAI-compatible 中转接口正常调用模型；之前的 Network error 主要是因为 OPENAI_BASE_URL 没设。 7. 建议写入 .Renviron，避免每次手动设置 # 临时设置 Sys.setenv() 只对当前 R session 有效。建议写入 .Renviron ： file.edit(\"~/.Renviron\") 加入： OPENAI_API_KEY=你的API_KEY OPENAI_BASE_URL=https://your-api-host.example/v1 OPENAI_MODEL=gpt-5.5 保存后重启 R session，再检查： Sys.getenv(\"OPENAI_API_KEY\") Sys.getenv(\"OPENAI_BASE_URL\") Sys.getenv(\"OPENAI_MODEL\") 如果能看到对应值，之后就可以直接： library(aisdk) set_model(\"openai:gpt-5.5\") response \u003c- generate_text(prompt = \"你好，请用中文介绍 aisdk。\") cat(response$text) 8. 在 RStudio 中进入 AI 对话 # 最适合新手的入口是 console_chat() ： rm(list = ls()) library(aisdk) console_chat() 进入后常用命令： /help # 查看帮助 /model # 配置或切换模型 /quit # 退出会话 可以直接输入自然语言任务，例如： 使用 ggplot2 绘制两个基因表达水平的相关性散点图，数据随机生成，有 60 个样本。 也可以继续让它： 保存使用的代码和图片，最后将图片展示出来。 9. 编程式调用：generate_text() # 如果不想进入聊天，而是在 R 脚本中直接调用模型，可以用： library(aisdk) set_model(\"openai:gpt-5.5\") response \u003c- generate_text(prompt = \"用中文解释 testthat 是干什么的。\") cat(response$text) 这种方式适合： 写自动化脚本； 在 RMarkdown / Quarto 中调用 AI； 在 Shiny 应用中加入 AI 功能。 10. 出错排查清单 # 如果出现： Network error, retrying in 2000 ms... 优先检查： Sys.getenv(\"OPENAI_API_KEY\") Sys.getenv(\"OPENAI_BASE_URL\") Sys.getenv(\"OPENAI_MODEL\") model() 常见原因： 问题 解决 OPENAI_API_KEY 为空 检查 API Key 是否写入 .Renviron 或 .env OPENAI_BASE_URL 为空 写入正确接口地址，例如中转 API 的 /v1 地址 OPENAI_MODEL 为空 写入具体模型名，例如 gpt-5.5 、 deepseek-chat 模型名不对 去服务商后台确认模型名称 修改 .Renviron 后没生效 重启 R session 网络无法访问接口 检查代理、校园网、防火墙、服务器地址 11. ask_ai：R 报错后让 AI 自动看上下文 # ask_ai() 是一个很实用的功能。R 报错后，它可以收集： 最近错误； traceback； warnings； 当前 RStudio 文档； session 信息； workspace 对象摘要。 示例： # 只预览即将发送给 AI 的上下文 ask_ai(show_context = TRUE) # 真正打开 AI 对话 ask_ai() 适合用来让 AI 帮忙解释 R 报错。 12. Agent 和工具调用，先知道即可 # aisdk 还支持构建 Agent，把 R 函数变成 AI 可调用工具。例如： calc_tool \u003c- tool( name = \"add_numbers\", description = \"Adds two numbers together\", execute = function(a, b) a + b ) agent \u003c- create_agent( name = \"Mathematician\", description = \"Solve math problems accurately\", system_prompt = \"You are a helpful mathematician.\", tools = list(calc_tool) ) result \u003c- agent$run(\"What is 1234 + 5678?\", model = model) render_text(result) 新手阶段不用急着掌握，先把 console_chat() 和 generate_text() 跑通即可。 13. 推荐入门流程 # 安装最新版 aisdk ； 准备 API Key； 配置 OPENAI_BASE_URL 和 OPENAI_MODEL ； 用 generate_text() 测试是否能正常返回； 再进入 console_chat() ； 先用模拟数据测试画图、保存文件、解释代码； 遇到 R 报错时尝试 ask_ai() ； 熟悉后再尝试真实生信分析任务。 14. 可以用它做什么？ # 让 AI 写 ggplot2 代码； 让 AI 解释 R 报错； 让 AI 辅助 GEO 数据分析； 让 AI 帮忙整理 RMarkdown / Quarto 报告； 让 AI 辅助 Seurat、DESeq2、limma 等生信包学习； 把常用 R 函数封装成 AI 工具； 进阶后构建面向生信分析的 R Agent。 15. 相关链接 # aisdk GitHub： https://github.com/YuLab-SMU/aisdk/ aisdk 文档： https://yulab-smu.top/aisdk/ DeepSeek 官网： https://www.deepseek.com/ DeepSeek API 文档： https://api-docs.deepseek.com/zh-cn/ 16. 进阶用法：从聊天工具升级为 R 里的 Agent 框架 # 这一节根据 aisdk GitHub README 与官方 vignettes 补充，适合在 console_chat() 和 generate_text() 跑通之后再看。 16.1 console_chat 的高级命令 # 新版 console_chat() 不只是简单聊天窗口，而是基于 ChatSession 的终端 Agent 界面。除了基础的 /help 、 /model 、 /quit ，还可以用这些命令管理会话、检查工具调用和查看用量： /history # 查看当前会话历史 /stats # 查看 token 和工具使用统计 /clear # 清空当前对话历史 /save analysis.rds # 保存当前会话 /load analysis.rds # 恢复之前保存的会话 /stream on # 开启流式输出 /stream off # 关闭流式输出 /inspect on # 进入检查模式 /inspect turn # 查看最近一轮对话细节 /inspect tool \u003cindex\u003e # 查看某个工具调用细节 /debug on # 打开调试模式 /debug off # 关闭调试模式 /local on # 允许本地执行/修改工作区对象，谨慎使用 /local off # 关闭本地执行模式 和前面“如何查看上下文窗口和用量”的问题相关，优先记住： /stats /history /inspect turn /stats ：查看本会话 token / tool usage 统计； /history ：查看当前会话历史，判断上下文里累积了哪些内容； /inspect turn ：检查最近一轮输入、输出、工具调用、警告和耗时。 推荐日常工作流： library(aisdk) set_model(\"openai:gpt-4o-mini\") console_chat() 进入后： /inspect on /stats 平时用 clean 模式聊天，只有在工具调用复杂、出错或想看 token / 工具统计时再切到 inspect/debug。 16.2 ChatSession：有状态多轮对话 # 如果想在 R 脚本、Shiny 或 Quarto 里管理连续对话，不一定要开 console_chat() ，可以直接用 ChatSession ： library(aisdk) model \u003c- create_openai()$language_model(\"gpt-4o\") session \u003c- ChatSession$new( model = model, system_prompt = \"You are a helpful R and bioinformatics assistant.\" ) response1 \u003c- session$send(\"请解释 Seurat 对象里的 assay 是什么。\") cat(response1$text) # 第二轮会自动带上前面的历史 response2 \u003c- session$send(\"那 RNA assay 和 integrated assay 有什么区别？\") cat(response2$text) 中途也可以切换模型，但保留会话历史： session$switch_model(\"anthropic:claude-3-5-sonnet-20241022\") session$send(\"请把上面的解释改成适合新手看的版本。\") 会话可以保存和恢复： session$save(\"my_aisdk_session.json\") new_session \u003c- ChatSession$new(model = model) new_session$restore(\"my_aisdk_session.json\") 16.3 工具调用：把 R 函数变成 AI 可用工具 # aisdk 的核心进阶能力之一，是把 R 函数包装成 tool，让模型在需要时自动调用。 library(aisdk) calc_tool \u003c- tool( name = \"calculate\", description = \"Perform a mathematical calculation on two numbers\", parameters = z_object( a = z_number(\"The first number\"), b = z_number(\"The second number\"), operation = z_enum(c(\"add\", \"subtract\", \"multiply\", \"divide\"), \"The operator\") ), execute = function(args) { switch( args$operation, add = args$a + args$b, subtract = args$a - args$b, multiply = args$a * args$b, divide = if (args$b != 0) args$a / args$b else \"Error: Division by zero\" ) } ) model \u003c- create_openai()$language_model(\"gpt-4o\") result \u003c- generate_text( model = model, prompt = \"What is 123 multiplied by 456?\", tools = list(calc_tool), max_steps = 3 ) cat(result$text) 对生信分析来说，可以把一些高频操作封装成工具，例如： 读取表达矩阵； 检查 Seurat 对象结构； 统计 metadata 分组； 执行差异分析； 生成标准 ggplot2 图； 保存结果表和图片。 注意：会写文件、删文件、运行系统命令的工具要格外谨慎，最好先从只读工具开始。 16.4 Agent：带人设、工具和任务能力的 AI 工作者 # Agent 可以理解为“带专业角色和工具箱的 AI”。 library(aisdk) researcher \u003c- create_agent( name = \"Researcher\", description = \"Finds and summarizes information on specific topics\", system_prompt = \"You are a professional researcher. Provide citations for your findings.\" ) model \u003c- create_openai()$language_model(\"gpt-4o\") result \u003c- researcher$run( task = \"Summarize common QC steps in single-cell RNA-seq analysis.\", model = model ) cat(result$text) aisdk 还提供一些预设 Agent： coder \u003c- create_coder_agent() # 写代码/改代码 visualizer \u003c- create_visualizer_agent()# 偏 ggplot2 可视化 planner \u003c- create_planner_agent() # 拆解复杂任务 Agent 默认偏“能力配置”，如果想让 Agent 记住上下文，可以从 Agent 创建 session： session \u003c- researcher$create_session(model = model) session$send(\"先总结 Seurat 标准流程。\") session$send(\"再把它改成适合口腔鳞癌单细胞项目的流程。\") 16.5 多 Agent 协作：Manager + Worker # 更复杂的任务可以让多个 Agent 分工。例如：Planner 负责拆任务，Coder 负责写 R 代码，Visualizer 负责画图。 coder \u003c- create_coder_agent() visualizer \u003c- create_visualizer_agent() registry \u003c- create_agent_registry(list(coder, visualizer)) session \u003c- ChatSession$new(model = model) flow \u003c- Flow$new(session = session, registry = registry) manager \u003c- create_agent( name = \"Manager\", description = \"Orchestrates data analysis tasks\", system_prompt = \"You are a project manager. Delegate tasks to Coder or Visualizer as needed.\" ) result \u003c- flow$run( agent = manager, task = \"Load the iris dataset, calculate means by species, and plot the result.\" ) 这个模式适合后续扩展成“生信分析助手”： Manager：理解任务和分派 Coder：写 R/Seurat/DESeq2 代码 Visualizer：生成图 Reviewer：检查统计和结果解释 16.6 结构化输出：让 AI 返回 list / data.frame，而不是一段散文 # 如果希望 AI 输出可以直接进入 R 流程，优先使用 generate_object() 加 schema。 library(aisdk) recipe_schema \u003c- z_object( name = z_string(\"Name of the dish\"), ingredients = z_array(z_string(), \"List of ingredients\"), prep_time_mins = z_integer(\"Preparation time in minutes\") ) result \u003c- generate_object( model = model, prompt = \"Give me a simple recipe for a classic Omelette.\", schema = recipe_schema ) str(result$object) 提取表格数据时可以用 z_dataframe() ： gene_schema \u003c- z_dataframe( gene_symbol = z_string(\"Standard gene symbol\"), fold_change = z_number(\"Log2 fold change value\"), p_value = z_number(\"Adjusted p-value\") ) result \u003c- generate_object( model = model, prompt = \"Extract gene expression data: BRCA1 FC=2.5 p=0.01; TP53 FC=-1.2 p=0.04.\", schema = gene_schema ) df \u003c- dplyr::bind_rows(result$object) print(df) 生信场景里特别适合让 AI 返回： 基因列表； marker 表格； 通路富集摘要； 样本分组信息； 文献中提取的细胞类型、疾病、方法、结论字段。 16.7 自定义 Provider：接入 OpenAI-compatible 中转或本地模型 # 如果服务商兼容 OpenAI / Anthropic 格式，但 aisdk 没有内置 provider，可以用 create_custom_provider() 。 library(aisdk) custom_provider \u003c- create_custom_provider( provider_name = \"my_custom_proxy\", base_url = \"https://my-custom-proxy.com/v1\", api_key = Sys.getenv(\"CUSTOM_API_KEY\"), api_format = \"chat_completions\" ) custom_model \u003c- custom_provider$language_model(\"my-custom-model-id\") response \u003c- generate_text( model = custom_model, prompt = \"你好，请用中文介绍一下 aisdk。\" ) cat(response$text) api_format 可根据服务商接口选择，例如： chat_completions # OpenAI chat completions 兼容格式 anthropic_messages # Anthropic messages 兼容格式 responses # OpenAI responses 兼容格式 16.8 AIHubMix 原生接口：Claude 缓存和 Gemini 结构化能力 # README 里提到，AIHubMix 不只是 OpenAI-compatible，还可以通过原生 Anthropic / Gemini 接口释放更多能力，例如 Claude prompt caching 或 Gemini structured outputs： library(aisdk) # Claude / Anthropic 格式，支持扩展缓存能力 aihubmix_claude \u003c- create_aihubmix_anthropic(extended_caching = TRUE) claude_model \u003c- aihubmix_claude$language_model(\"claude-3-5-sonnet-20241022\") # Gemini 原生格式 aihubmix_gemini \u003c- create_aihubmix_gemini() gemini_model \u003c- aihubmix_gemini$language_model(\"gemini-2.5-flash\") 适合场景： 长系统提示词或长背景资料反复复用； 想用 Claude prompt caching 降低重复上下文成本； 想用 Gemini 原生结构化输出或多模态能力。 16.9 多模态：图片理解和结构化提取 # aisdk 也支持图片输入。可以让模型分析截图、图表、实验图片，或者从图片中抽取结构化字段。 典型模式： image_schema \u003c- z_object( title = z_string(\"Figure title or main topic\"), x_axis = z_string(\"X axis label\"), y_axis = z_string(\"Y axis label\"), conclusion = z_string(\"Main conclusion from the figure\") ) result \u003c- extract_from_image( model = create_openai()$language_model(\"gpt-4o\"), image = \"figure.png\", schema = image_schema ) str(result$object) 可用于： 读取论文图； 检查火山图、UMAP、热图； 从截图里提取报错信息； 把图片里的表格或字段转成 R list / data.frame。 16.10 Shiny / RMarkdown / Quarto 集成 # Shiny 聊天界面 aisdk 可以把 ChatSession 接到 Shiny UI 里。推荐先在终端用 console_chat(chat) 验证模型和工具，再接入 Shiny。 library(shiny) library(aisdk) chat \u003c- create_chat_session( model = \"openai:gpt-4o\", tools = list(calc_tool) ) # 可选：先在 R console 里测试 # console_chat(chat) ui \u003c- fluidPage(aiChatUI(\"chat\")) server \u003c- function(input, output, session) { aiChatServer( \"chat\", session = chat, show_thinking = TRUE, debug = FALSE ) } shinyApp(ui, server) RMarkdown / Quarto AI 代码块 在 RMarkdown / Quarto 中可以注册 {ai} engine，让 AI 根据上下文生成并执行 R 代码。 library(aisdk) register_ai_engine() RMarkdown 中： ```{ai} Create a scatter plot of mpg vs wt from the mtcars dataset, colored by the number of cylinders using ggplot2. ``` Quarto 中推荐写法： ```{r} #| engine: ai #| eval: true Create a scatter plot of mpg vs wt from the mtcars dataset, colored by the number of cylinders using ggplot2. ``` 如果前面的代码块里已经有对象，AI engine 可以自动根据 prompt 识别相关对象并发送摘要；也可以手动控制： #| context: my_data 或关闭上下文： #| context: false 16.11 MCP：把外部工具服务器接入 aisdk Agent # aisdk 提供 MCP client，可以把外部 MCP server 暴露的工具转成 aisdk 工具。 library(aisdk) sqlite_client \u003c- create_mcp_client( command = \"npx\", args = c(\"-y\", \"@modelcontextprotocol/server-sqlite\", \"--db\", \"my_data.db\") ) sqlite_client$is_alive() # 查看 MCP server 提供哪些工具 tools \u003c- sqlite_client$list_tools() # 转成 aisdk 可用工具 sdk_tools \u003c- sqlite_client$as_sdk_tools() response \u003c- generate_text( model = model, prompt = \"Query the iris table and tell me the average Sepal.Length.\", tools = sdk_tools ) cat(response$text) # 用完关闭 sqlite_client$close() 可扩展方向： 接数据库 MCP； 接文件系统 MCP； 接文献检索 MCP； 接实验记录或 ELN MCP； 接本地生信 pipeline 工具。 16.12 Telemetry、权限 Hook 和工具缓存 # 生产化或长流程任务中，可以用 telemetry / hooks 追踪调用、控制权限、缓存慢工具。 library(aisdk) telemetry \u003c- create_telemetry(trace_id = \"request-123\") hooks \u003c- telemetry$as_hooks() generate_text( model = \"openai:gpt-4o\", prompt = \"Hello\", hooks = hooks ) 对敏感工具调用加权限控制： perm_hook \u003c- create_permission_hook( mode = \"escalate\", allowlist = c(\"read_file\") ) hooks$hooks$on_tool_approval \u003c- perm_hook$hooks$on_tool_approval 缓存耗时工具： slow_tool \u003c- tool( name = \"slow_tool\", description = \"Sleep 5 seconds and return x\", parameters = z_object(x = z_number(\"Input number\")), execute = function(args) { Sys.sleep(5) args$x } ) fast_tool \u003c- cache_tool(slow_tool) fast_tool$run(list(x = 1)) # 第一次慢 fast_tool$run(list(x = 1)) # 第二次命中缓存 16.13 推荐的进阶学习路线 # 如果只是为了生信日常辅助，建议按这个顺序学习： console_chat() ：熟悉 /stats 、 /history 、 /inspect 、 /save 、 /load ； ChatSession ：掌握可保存、可恢复的多轮对话； tool() ：把自己的 R 函数封装成 AI 工具； create_agent() ：给工具加角色和系统提示词； generate_object() ：让 AI 输出可直接进入 R 的结构化结
