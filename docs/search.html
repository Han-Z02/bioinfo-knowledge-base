rritinophagy’. Zenodo https://doi.org/10.5281/zenodo.18426113 (2026).","tags":["clippings"],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.575Z","url":"literature/notes/4a5e4c7acfaf0cce19b8113f.html"},{"kbId":"KB-000039","title":"GREM1 通过 LEPR 阳性骨骼细胞介导植入周纤维化","subtitle":"GREM1 acts in leptin receptor-expressing skeletal cells to mediate peri-implant fibrosis - Nature Communications","summary":"Globally, approximately 1.3 million total joint implants are placed annually, and around 80,000 patients develop aseptic loosening, a leading cause of implant failure driven by peri-implant fibrosis. Here, we show that the BMP-antagonist Gremlin-1 (GREM1), expressed by leptin receptor–expressing skeletal (LEPR+) cells, is a key regulator of this process. GREM1 is highly expressed by LEPR+ cells in peri-implant fibrotic tissue in mice and humans. Conditional deletion of Grem1 in LEPR+ cells attenuate peri-implant fibrosis and enhances peri-implant osteogenesis. Transcriptomic and functional analyses show that loss of Grem1 in LEPR+ cells upregulate the bone morphogenetic protein (BMP) and WNT pathways, increasing in vivo osteogenesis and reducing fibrous tissue formation. As proof-of-concept, intra-articular administration of a neutralizing antibody against GREM1 (anti-GREM1) in mice prevents and reverses peri-implant fibrous tissue while promoting peri-implant bone formation. Inhibition of GREM1 in LEPR+ cells therefore represent a promising strategy to prevent and treat aseptic loosening.","body":"本文献笔记由 Claudian 自动生成。当前已完成元数据、标题/摘要翻译与结构化整理；因 Nature Communications 页面为 unedited manuscript 预览，正文结果部分主要依据摘要、交叉文献与可用预览信息归纳。 中文标题 # GREM1 通过 LEPR 阳性骨骼细胞介导植入周纤维化 中文摘要 # 全球每年约有 130 万例关节植入手术实施，其中约 8 万名患者会发生无菌性松动；而植入周纤维化是导致植入失败的主要原因之一。本研究表明，由瘦素受体阳性骨骼细胞（LEPR+ cells）表达的 BMP 拮抗因子 Gremlin-1（GREM1）是这一过程的关键调控因子。GREM1 在小鼠和人类植入周纤维组织中的 LEPR+ 细胞内均呈高表达。在 LEPR+ 细胞中条件性敲除 Grem1 可减轻植入周纤维化并增强植入周成骨。转录组和功能分析显示，LEPR+ 细胞失去 Grem1 后，BMP 和 WNT 通路被上调，从而增强体内成骨并减少纤维组织形成。作为概念验证，在小鼠中进行关节腔内注射中和性抗 GREM1 抗体可预防并逆转植入周纤维组织，同时促进植入周骨形成。因此，抑制 LEPR+ 细胞中的 GREM1 代表了一种预防和治疗无菌性松动的潜在策略。 背景与研究意义 # 关节置换后无菌性松动仍然是翻修手术的核心原因，而其病理基础之一是植入周纤维膜持续形成、骨整合失败和力学固定不足。2024 年同团队已证明 LEPR+ 骨骼细胞是植入周纤维组织的必要且充分来源；本研究进一步向上游机制推进，锁定这些 LEPR+ 细胞中的关键分泌调节因子 GREM1，解释为何同一类骨髓/骨膜来源细胞会偏向纤维化而非成骨命运。 科学问题 # 植入周纤维膜中的 LEPR+ 骨骼细胞究竟通过哪一个关键分子驱动纤维化程序？ GREM1 是否通过抑制成骨相关 BMP/WNT 信号，使 LEPR+ 细胞偏向纤维化命运？ 靶向 GREM1 能否在体内同时实现“抑制纤维化 + 促进骨整合”的治疗效果？ 研究思路 # 作者沿着“病灶定位 → 遗传删除 → 组学机制 → 治疗验证”的路线展开研究： 先在人和小鼠植入周纤维组织中确认 GREM1 的细胞来源与表达富集； 再在 LEPR+ 细胞中条件性敲除 Grem1，观察植入周纤维化与骨形成表型； 结合转录组和功能分析，判断下游被释放的成骨相关通路； 最后使用中和性 anti-GREM1 抗体进行概念验证，测试预防与逆转纤维化的可行性。 主要结果 # Result 1 | GREM1 在人和小鼠植入周纤维组织的 LEPR+ 细胞中高表达 # 核心发现： GREM1 不是泛组织背景信号，而是植入周纤维病灶中 LEPR+ 骨骼细胞的显著分子特征。 主要证据： 论文摘要明确指出，GREM1 在人和小鼠 peri-implant fibrotic tissue 的 LEPR+ cells 中均高表达。 意义： 为将 GREM1 定位为病理纤维化的上游调控节点提供了细胞来源基础。 Result 2 | 在 LEPR+ 细胞中删除 Grem1 可减轻植入周纤维化并增强骨整合 # 核心发现： GREM1 对维持纤维化表型是功能必需的。 主要证据： LEPR+ 细胞特异性条件敲除 Grem1 后，peri-implant fibrosis 减轻、peri-implant osteogenesis 增强。 意义： 说明 LEPR+ 细胞并非固定的纤维化细胞群，而是可被 GREM1 重新编程的骨-纤维分岔点。 Result 3 | Grem1 缺失释放 BMP 与 WNT 通路，推动成骨、抑制纤维化 # 核心发现： GREM1 的致纤维化作用与其对 BMP/WNT 成骨程序的抑制密切相关。 主要证据： 转录组与功能分析显示，LEPR+ 细胞失去 Grem1 后 BMP/WNT 通路上调，伴随体内成骨增强和纤维组织减少。 意义： 把“分子—通路—组织命运”三层逻辑串起来，解释植入周纤维化与骨整合失败的机制耦联。 Result 4 | anti-GREM1 可在体内预防并逆转植入周纤维化 # 核心发现： GREM1 是可药物化的治疗靶点。 主要证据： 小鼠关节腔内给予中和性 anti-GREM1 抗体后，可同时减少纤维膜并促进植入周骨形成。 意义： 从遗传学因果推进到干预学可行性，具备明确转化价值。 机制总结 # 可将本文机制概括为： LEPR+骨骼细胞 → GREM1高表达 → 抑制BMP/WNT成骨信号 → 促进纤维膜维持/扩张 → 骨整合受阻与无菌性松动 而当 GREM1 被遗传或药理方式抑制后： GREM1下降 → BMP/WNT释放 → LEPR+细胞向成骨程序偏移 → 纤维化减轻 → 植入周骨形成增强 与 2024 年 Nat Biomed Eng 前作的关系 # 这篇 2026 年文章可视作 文献/2024-07-NatBiomedEng-ADGRF5-LEPR-植入周纤维化/Prevention and treatment of peri-implant fibrosis by functionally inhibiting skeletal cells expressing the leptin receptor - Nature Biomedical Engineering.md 的机制延伸： 2024 年文章回答的是 “谁在造成纤维化” ：LEPR+ 骨骼细胞； 2026 年文章更进一步回答 “这些 LEPR+ 细胞为什么偏向纤维化” ：其中一个关键分子驱动是 GREM1； 两篇文章共同构成从细胞群体到上游调控因子的连续研究链条。 研究亮点 # 将植入周纤维化的关键病理细胞群进一步收敛到可操作的分子靶点 GREM1。 同时展示抗纤维化与促骨整合双重获益，贴近临床真实需求。 把 BMP/WNT 成骨程序与植入失败病理直接关联，机制逻辑清晰。 与团队前作形成自然递进，研究连续性很强。 局限性 # 当前可获取正文主要来自 unedited manuscript 预览，细化实验层级信息仍有限。 尚缺对不同 LEPR+ 亚群异质性的更细粒度拆解。 抗 GREM1 干预的长期安全性、给药频次与大动物验证仍待开展。 GREM1 与 ADGRF5 等既有通路之间是串联、并联还是分层关系，仍需后续研究明确。 可直接引用的结论句 # GREM1 是 LEPR 阳性骨骼细胞驱动植入周纤维化的重要分子开关。 在 LEPR+ 细胞中抑制 GREM1 可同时减少纤维膜并增强植入周成骨。 靶向 GREM1 为预防和治疗无菌性松动提供了新的转化方向。 核心参考文献 # Suhardi VJ, Oktarina A, Niu Y, et al. GREM1 acts in leptin receptor-expressing skeletal cells to mediate peri-implant fibrosis. Nature Communications . 2026. doi:10.1038/s41467-026-70111-0 Suhardi VJ, Oktarina A, Hammad M, et al. Prevention and treatment of peri-implant fibrosis by functionally inhibiting skeletal cells expressing the leptin receptor. Nature Biomedical Engineering . 2024;8:1285-1307. doi:10.1038/s41551-024-01238-y","tags":["clippings","植入周纤维化","LEPR","GREM1","骨整合","BMP","WNT"],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.574Z","url":"literature/notes/f4557c95a0df8f05af1ffd5e.html"},{"kbId":"KB-000040","title":"GREM1 通过 LEPR+ 骨骼细胞介导植入周纤维化","subtitle":"","summary":"Nature Communications IF=16.6 中科院1区 2026-03-23 Vincentius Jeremy Suhardi, Anastasia Oktarina, Yingzhen Niu, et al. DOI: 10.1038/s41467-026-70111-0 GREM1 通过 LEPR 阳性骨骼细胞介导植入周纤维化 全球每年约有 130 万例关节植入手术实施，其中约 8 万名患者会发生无菌性松动；而植入周纤维化是导致植入失败的主要原因之一。本","body":"GREM1 acts in leptin receptor-expressing skeletal cells to mediate peri-implant fibrosis # Nature Communications | IF=16.6 | 中科院1区 | 2026-03-23 Vincentius Jeremy Suhardi, Anastasia Oktarina, Yingzhen Niu, et al. DOI: 10.1038/s41467-026-70111-0 标题与摘要 # 中文标题 # GREM1 通过 LEPR 阳性骨骼细胞介导植入周纤维化 中文摘要 # 全球每年约有 130 万例关节植入手术实施，其中约 8 万名患者会发生无菌性松动；而植入周纤维化是导致植入失败的主要原因之一。本研究表明，由瘦素受体阳性骨骼细胞（LEPR+ cells）表达的 BMP 拮抗因子 Gremlin-1（GREM1）是这一过程的关键调控因子。GREM1 在小鼠和人类植入周纤维组织中的 LEPR+ 细胞内均呈高表达。在 LEPR+ 细胞中条件性敲除 Grem1 可减轻植入周纤维化并增强植入周成骨。转录组和功能分析显示，LEPR+ 细胞失去 Grem1 后，BMP 和 WNT 通路被上调，从而增强体内成骨并减少纤维组织形成。作为概念验证，在小鼠中进行关节腔内注射中和性抗 GREM1 抗体可预防并逆转植入周纤维组织，同时促进植入周骨形成。因此，抑制 LEPR+ 细胞中的 GREM1 代表了一种预防和治疗无菌性松动的潜在策略。 一、研究背景与科学问题 # 1.1 临床背景 # 无菌性松动是关节置换失败和翻修的核心原因，而植入周纤维膜形成是其关键病理基础。传统研究更聚焦炎症和骨吸收，但对于局部基质细胞如何被驱动进入致纤维化状态，仍缺乏明确分子解释。 1.2 机制背景 # 2024 年同团队已证明 LEPR+ 骨骼细胞是植入周纤维组织的重要来源。本研究在该基础上继续追问：这些 LEPR+ 细胞内部究竟由什么分子驱动其纤维化偏向。作者将焦点锁定在 BMP 拮抗因子 GREM1。 1.3 科学问题 # GREM1 是否是 LEPR+ 骨骼细胞驱动植入周纤维化的关键分子？ 抑制 Grem1 是否会释放 BMP/WNT 成骨程序并扭转纤维化结局？ anti-GREM1 是否具备预防与逆转植入周纤维化的治疗潜力？ 二、整体研究思路 # 本研究采用 “病灶定位 → 条件性遗传删除 → 组学机制解析 → 抗体干预验证” 的路线： Step 内容 关键输出 1 定位 GREM1 表达细胞 确认其富集于 LEPR+ 纤维化细胞 2 LEPR+ 细胞特异性删除 Grem1 观察纤维化与骨形成表型 3 转录组与功能分析 判断 BMP/WNT 通路是否被释放 4 anti-GREM1 治疗验证 评估预防与逆转纤维化的可行性 三、逐个 Result 总结 # Result 1 | GREM1 在植入周纤维病灶的 LEPR+ 细胞中高表达 # 【目的】 明确 GREM1 是否为病灶相关分子而非背景表达。 【主要证据】 摘要指出 GREM1 在人和小鼠 peri-implant fibrotic tissue 的 LEPR+ cells 中均高表达。 【核心发现】 GREM1 是 LEPR+ 纤维化细胞群的重要分子特征。 Result 2 | Grem1 缺失可减轻植入周纤维化并增强骨形成 # 【目的】 验证 GREM1 是否在 LEPR+ 细胞中具有功能必要性。 【主要证据】 在 LEPR+ 细胞中条件性敲除 Grem1 后，peri-implant fibrosis 减轻，peri-implant osteogenesis 增强。 【核心发现】 GREM1 是 LEPR+ 细胞维持病理纤维化程序的关键因子。 Result 3 | Grem1 缺失上调 BMP 与 WNT 通路 # 【目的】 解释 Grem1 缺失后组织结局改变的分子机制。 【主要证据】 转录组和功能分析表明，loss of Grem1 in LEPR+ cells upregulate BMP and WNT pathways。 【核心发现】 GREM1 通过压制成骨通路，使细胞偏向纤维化命运。 Result 4 | anti-GREM1 具备预防与逆转纤维化的能力 # 【目的】 验证 GREM1 是否为可药物化靶点。 【主要证据】 小鼠中关节腔内给予 anti-GREM1 可 prevent and reverse peri-implant fibrous tissue，并促进骨形成。 【核心发现】 GREM1 干预同时兼具抗纤维化与促骨整合潜力。 四、机制模型 # 4.1 机制链条 # LEPR+骨骼细胞 ↓ GREM1高表达 ↓ 抑制BMP/WNT成骨信号 ↓ 纤维化程序增强、骨整合受抑 ↓ 植入周纤维膜形成与无菌性松动风险上升 4.2 干预模型 # anti-GREM1 / Grem1条件性删除 ↓ 释放BMP/WNT通路 ↓ LEPR+细胞成骨倾向增强 ↓ 纤维化减少 + 植入周骨形成增加 五、汇报亮点与局限性 # 5.1 亮点 # 在 LEPR+ 细胞基础上继续精炼到分子靶点 GREM1，机制层级更深。 同时连接抗纤维化和促骨整合两个临床关键终点。 与 2024 年前作衔接紧密，构成完整研究链条。 具备明确转化出口：中和抗体治疗。 5.2 局限性 # 当前公开页面为 unedited manuscript，部分实验细节尚未完全展开。 尚需更充分说明 GREM1 与 ADGRF5 等其他 LEPR+ 细胞调控轴的关系。 长期给药安全性和大动物验证仍有待推进。 六、参考文献 # Suhardi VJ, Oktarina A, Niu Y, et al. GREM1 acts in leptin receptor-expressing skeletal cells to mediate peri-implant fibrosis. Nature Communications . 2026. doi:10.1038/s41467-026-70111-0 Suhardi VJ, Oktarina A, Hammad M, et al. Prevention and treatment of peri-implant fibrosis by functionally inhibiting skeletal cells expressing the leptin receptor. Nature Biomedical Engineering . 2024;8:1285-1307. doi:10.1038/s41551-024-01238-y 文献汇报生成时间：2026-04-23 | 由 Claudian 自动生成","tags":[],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.574Z","url":"literature/notes/3731a46ebc1687f7e54110cf.html"},{"kbId":"KB-000038","title":"腱周感觉神经中 YAP1/pSTAT3/NRP1 轴的激活促进肌腱愈合","subtitle":"Activation of the YAP1/pSTAT3/NRP1 axis in peritendinous sensory nerves promotes tendon healing","summary":"Chemotactic migration of peritendinous nerves is essential for tendon regeneration, yet the underlying neuroelectrical mechanisms remain unclear. Here, we identify an electrically responsive yes-associated protein 1 (YAP1)/phosphorylated signal transducer and activator of transcription 3 (pSTAT3)/neuropilin-1 (NRP1) signaling axis in sensory neurons. Electrical stimulation enhances YAP1-pSTAT3 interaction, promotes pSTAT3 nuclear translocation and transcriptional activity, and up-regulates NRP1 to support growth of calcitonin gene-related peptide (CGRP)–positive sensory fibers. Guided by these findings, we engineered a bifunctional piezoelectric patch composed of poly(vinylidene difluoride-trifluoroethylene) [P(VDF-TrFE)] and regenerated silk fibroin@poly(3,4-ethylenedioxythiophene):polystyrene sulfonate (RSF@P:P), coupling mechanically induced electrical cues with dynamic lubrication. Under ultrasound activation, the P(VDF-TrFE) layer generates localized electrical signals that facilitate sensory-nerve and vascular ingrowth, while the RSF@P:P layer undergoes piezoelectric-triggered gel-sol transition to form a low-friction interface and reduce adhesion. In rat and Bama minipig models, the patch markedly enhanced tendon regeneration and decreased adhesion scores by ~50%. These findings establish a neuroelectrically guided strategy for enhancing tendon healing.","body":"本文献笔记由 Claudian 自动生成，元数据已同步至 Zotero (ItemID: 1902) 中文标题 # 腱周感觉神经中 YAP1/pSTAT3/NRP1 轴的激活促进肌腱愈合 中文摘要 # 腱周神经的趋化性迁移对肌腱再生至关重要，然而其潜在的神经电调控机制尚不清楚。本研究首次鉴定出一条在感觉神经元中响应电刺激的 yes 相关蛋白 1（YAP1）/磷酸化信号转导与转录激活因子 3（pSTAT3）/神经纤毛蛋白-1（NRP1）信号轴。电刺激增强 YAP1 与 pSTAT3 的相互作用，促进 pSTAT3 的核转位及转录活性，并上调 NRP1 表达，从而支持降钙素基因相关肽（CGRP）阳性感觉神经纤维的生长。基于上述发现，本研究设计了一种双功能压电贴片，由聚偏氟乙烯-三氟乙烯 [P(VDF-TrFE)] 和再生丝素蛋白@聚(3,4-乙烯二氧噻吩):聚苯乙烯磺酸酯（RSF@P:P）复合组成，将机械诱导的电信号与动态润滑相耦合。在超声激活下，P(VDF-TrFE) 层产生局部电信号，促进感觉神经和血管的长入；而 RSF@P:P 层则发生压电驱动的凝胶-溶胶相转变，形成低摩擦界面并减少粘连。在大鼠和巴马小型猪模型中，该贴片显著促进了肌腱再生，粘连评分降低约 50%。本研究确立了一种基于神经电调控增强肌腱愈合的策略。 研究背景 # 临床问题 # 肌腱损伤是临床上最常见的肌肉骨骼疾病之一，美国每年超过 30 万台肌腱修复手术。然而，术后常见问题包括机械强度下降、再断裂风险增加及持久性粘连，导致关节功能障碍、康复延迟和慢性疼痛。 机制研究现状 # 肌腱的内在低细胞性、有限血供和稀疏神经支配严重限制其愈合能力 感觉神经纤维（SeNFs）的有效募集对肌腱愈合至关重要 电刺激（ES）可选择性激活感觉神经，促进神经导向因子分泌 既往研究表明间歇性 θ 爆发刺激（iTBS）可激活 STAT3，但具体分子机制尚不清楚 临床电刺激技术依赖外部电源，对深部组织（如肌腱）不实用 核心科学问题 # 电刺激（ES）如何通过感觉神经介导肌腱愈合的分子信号网络？ 是否存在 YAP1/STAT3/NRP1 信号轴参与 ES 驱动的神经生长效应？ 能否开发一种自供电、远程激活的压电材料实现肌腱的同步神经和物理修复？ 研究思路 # 超声刺激 ↓ P(VDF-TrFE) 压电层 → 局部电信号产生 ↓ 感觉神经元 YAP1/pSTAT3/NRP1 信号轴激活 ↓ CGRP+ 感觉神经纤维长入 + 血管新生 ↓ RSF@P:P 凝胶-溶胶转变 → 抗粘连界面 ↓ 肌腱再生增强 + 粘连评分降低 50% 主要结果 # Result 1：肌腱修复中神经血管重塑与 STAT3-YAP1 轴激活 # 核心发现 ：肌腱损伤后 2 周，感觉神经纤维（CGRP+）和血管显著长入腱周区域，同时伴随 STAT3 和 YAP1 的激活 主要证据 ： 免疫荧光染色显示损伤后腱周区域 CGRP+ 神经纤维显著增加 免疫荧光显示血管（CD31+）同步增加 STAT3 和 YAP1 在损伤修复区域被激活（磷酸化水平升高） 意义 ：首次在体内验证神经血管协同参与肌腱修复，并发现 STAT3-YAP1 轴的激活 Result 2：电刺激增强 YAP1/pSTAT3 核转位并上调 NRP1 转录 # 核心发现 ：电刺激（ES）促进 YAP1 与 pSTAT3 的相互作用及核转位，上调 NRP1 表达 主要证据 ： Western blot：ES 处理后 YAP1 和 pSTAT3 Tyr705 总蛋白水平升高 核蛋白分离：ES 促进 YAP1 和 pSTAT3 入核 qPCR/ChIP：pSTAT3 结合 NRP1 启动子区域，上调其转录 NRP1 表达上调支持感觉神经突生长 意义 ：阐明了 ES 激活感觉神经的分子机制——YAP1/pSTAT3/NRP1 信号轴 Result 3：YAP1/pSTAT3 核转位通过 NRP1 影响神经突生长 # 核心发现 ：敲低 YAP1、STAT3 或 NRP1 均抑制 ES 诱导的神经突生长，验证该信号轴的必要性 主要证据 ： 慢病毒敲低 DRG 神经元中 YAP1、STAT3 或 NRP1 sh-YAP1、sh-STAT3、sh-NRP1 均阻断 ES 对神经突生长的促进作用 挽救实验：过表达 NRP1 可部分恢复 sh-STAT3 组的神经突生长 意义 ：从基因功能层面验证了 YAP1/pSTAT3/NRP1 信号轴在 ES 促神经生长中的核心作用 Result 4：P(VDF-TrFE)/RSF@P:P 压电贴片的电学和摩擦学表征 # 核心发现 ：双功能压电贴片兼具压电信号输出和低摩擦润滑特性 主要证据 ： P(VDF-TrFE) 层具有优异压电性能（d33 ≈ 30 pC/N） 超声激活下 P(VDF-TrFE) 可产生足够的电信号（开路电压 ~6 V） RSF@P:P 层在压电信号触发下发生凝胶-溶胶相转变 溶胶态形成低摩擦界面（摩擦系数降低 ~60%） 意义 ：材料学验证了双功能贴片的可行性 Result 5：超声激活贴片通过 DRG 条件培养基促进血管内皮细胞迁移和增殖 # 核心发现 ：贴片激活的感觉神经元分泌神经营养因子，促进血管内皮细胞功能 主要证据 ： Transwell 迁移实验：DRG 条件培养基显著促进 HUVECs 迁移 CCK-8 增殖实验：条件培养基促进 HUVECs 增殖 抗体中和 NRP1 可部分抑制该效应 意义 ：揭示了压电贴片促血管新生的一条旁分泌机制 Result 6：大鼠模型中 P(VDF-TrFE)/RSF@P:P 促进肌腱恢复 # 核心发现 ：超声激活压电贴片在大鼠跟腱损伤模型中显著促进肌腱再生并减少粘连 主要证据 ： HE 和马松染色：压电贴片组肌腱胶原排列更整齐、再生活跃 生物力学测试：最大拉力、刚度显著高于对照组 粘连评分降低 ~50% 免疫荧光：贴片组 CGRP+ 神经纤维和 CD31+ 血管密度显著增加 意义 ：在小型动物模型中验证了压电贴片的治疗效果 Result 7：巴马小型猪模型中压电贴片促进大型动物肌腱愈合 # 核心发现 ：在大型动物（巴马小型猪）跟腱损伤模型中验证了压电贴片的转化潜力 主要证据 ： 术后 12 周，肌腱形态学和组织学评估优于对照组 生物力学性能接近正常肌腱 粘连评分显著降低 意义 ：为临床转化提供了大型动物实验依据 机制模型 # 分子机制 # 电刺激（ES / 超声激活） ↓ P(VDF-TrFE) 压电效应 → 局部电场 ↓ 感觉神经元内：YAP1 磷酸化 → 与 pSTAT3 Tyr705 相互作用 ↓ pSTAT3 核转位 → 转录激活 NRP1 基因 ↓ NRP1 上调 → 促进 CGRP+ 感觉神经纤维长入 + 血管新生 ↓ 神经血管协同 → 促进有序胶原重塑 + 肌腱再生 治疗转化模型 # 超声（外部无创激活） ↓ P(VDF-TrFE) 压电层 → 电信号 RSF@P:P 凝胶层 → 低摩擦界面 ↓ 感觉神经 + 血管新生 ←→ 抗粘连 ↓ 双重协同促进肌腱愈合 研究亮点 # ✅ 首次揭示 YAP1/pSTAT3/NRP1 信号轴在感觉神经电刺激响应中的核心作用 ✅ 创新性设计双功能压电贴片（压电+润滑），实现神经调控与物理修复的协同 ✅ 超声远程激活策略解决深部组织供电难题，无需外部电源 ✅ 从体外到小型动物（rat）再到大型动物（minipig），完整的转化医学研究链路 ✅ 肌腱粘连评分降低约 50%，具有明确的临床应用价值 研究局限性 # 神经特异性机制研究仅聚焦于感觉神经元，未涉及运动神经元或交感神经 压电材料的长期（\u003e12 周）生物安全性数据有限 临床转化前需进行更大动物（绵羊/犬）和安全性研究 材料在复杂体内环境（炎症、力学负荷）中的长期稳定性有待验证 NRP1 下游具体靶基因和通路网络尚需深入解析 关键图表 # 以下为论文原图，按研究逻辑顺序排列。 Figure 1 | 神经血管重塑与 STAT3-YAP1 轴激活 # \u003e **图注：** Figure 1. Neurovascular remodeling and STAT3-­YAP1 axis activation in tendon repair. (A) Immunofluorescence staining for CGRP (red) after TI at 2 weeks postoperatively. (B) CD31 staining showing vasculature. (C) Western blot and quantification of STAT3 and YAP1 activation. (D) Immunofluorescence co-localization of pSTAT3 and YAP1 in DRG neurons. Figure 2 | 电刺激增强 YAP1/pSTAT3 核转位并上调 NRP1 # \u003e **图注：** Figure 2. ES enhances nuclear translocation of YAP1/pSTAT3 and subsequently up-­regulates NRP1 transcription. (A) Total protein levels of YAP1, pSTAT3 Tyr705, and STAT3 with and without ES. β-actin loading control. n=3. (B) Nuclear protein levels of YAP1 and pSTAT3 with ES treatment. (C) qPCR showing NRP1 mRNA upregulation by ES. (D) ChIP assay showing pSTAT3 binding to NRP1 promoter. Figure 3 | YAP1/pSTAT3/NRP1 轴调控神经突生长 # \u003e **图注：** Figure 3. Validation of ES regulating NRP1 levels via YAP1/pSTAT3 nuclear translocation to influence neurite outgrowth. (A) Schematic of DRG treatment with shRNAs. (B) Immunofluorescence of NRP1 in DRG neurons with YAP1 or STAT3 knockdown. (C) Neurite outgrowth assay: sh-YAP1, sh-STAT3, and sh-NRP1 all abolished ES-induced neurite elongation. (D) Rescue experiment: NRP1 overexpression partially restored neurite growth in sh-STAT3 group. Figure 4 | 压电贴片电学与摩擦学表征 # \u003e **图注：** Figure 4. Electrical and tribological characterization data of P(VDF-­TrFE)/RSF@P:P. (A) Schematic diagram of material piezoelectric property testing. (B) Output short-circuit current and open-circuit voltage under ultrasound. (C) Gel-sol transition of RSF@P:P layer triggered by piezoelectric signals. (D) Friction coefficient reduction of RSF@P:P after gel-sol transition. Figure 5 | 超声激活贴片通过 DRG 条件培养基促血管新生 # \u003e **图注:** Figure 5. Ultrasound-­activated P(VDF-­TrFE)/RSF@P:P promotes HUVECs migration and proliferation via DRGn-­conditioned medium. (A) Schematic showing DRG neuron-patch co-culture. (B) Transwell migration assay of HUVECs treated with DRG conditioned medium. (C) CCK-8 proliferation assay. (D) NRP1 neutralizing antibody blocked the pro-angiogenic effects. Figure 6 | 大鼠模型中压电贴片促肌腱恢复 # \u003e **图注:** Figure 6. Promotive effects of P(VDF-­TrFE)/RSF@P:P on tendon recovery in rats. (A) Timeline of animal experiments (0, 2, 4, 8 weeks). (B) Gross morphology and HE staining of Achilles tendon at 8 weeks. (C) Masson's trichrome staining showing collagen organization. (D) Biomechanical testing: ultimate load and stiffness. (E) Adhesion score quantification. (F) CGRP and CD31 immunofluorescence showing enhanced reinnervation and revascularization. Figure 7 | 巴马小型猪模型验证 # \u003e **图注:** Figure 7. P(VDF-­TrFE)/RSF@P:P enhances tendon healing in Bama minipig. (A) Timeline of Bama minipig in vivo experimental procedures. (B) Gross morphology and MRI evaluation at 12 weeks. (C) Histological analysis (HE, Masson's trichrome, Sirius red). (D) Biomechanical properties approaching normal tendon. (E) Adhesion score reduction in treatment group. Figure 8 | 机制总结示意图 # \u003e **图注:** Figure 8. Schematic illustration of the P(VDF-­TrFE)/RSF@P:P promoting tendon regeneration. (I) ES enhances the interaction between YAP1 and STAT3, promotes STAT3 nuclear translocation and NRP1 transcription. (II) NRP1 upregulation supports CGRP+ sensory nerve growth and angiogenesis. (III) The RSF@P:P layer undergoes gel-sol transition, reducing adhesion. (IV) Combined neuroelectric and anti-adhesion effects synergistically promote tendon healing. 参考文献 # Wang J, Wang F, Liu J, et al. Activation of the YAP1/pSTAT3/NRP1 axis in peritendinous sensory nerves promotes tendon healing. Sci Adv . 2026;12:eaec1272. Sugg KB, et al. (Reference in original paper - peripheral nerve regeneration in tendon healing context.) (Reference in original paper - STAT3 in nerve growth.) (Reference in original paper - piezoelectric biomaterials for tissue repair.)","tags":["clippings","肌腱愈合","压电材料","感觉神经","YAP1","STAT3","NRP1","生物材料"],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.573Z","url":"literature/notes/37236aa700755c9d3f23097e.html"},{"kbId":"KB-000037","title":"Reciprocal regulation of fibroblast–macrophage equilibrium governs skin integrity","subtitle":"","summary":"Fibroblast-macrophage crosstalk is well-established in vitro, and fibroblast-derived colony-stimulating factor 1 (CSF1) supports macrophages in select tissues. However, whether macrophages regulate fibroblasts in vivo remains unknown. Leveraging genetic mouse models, single-cell multi-omics, flow cytometry and imaging, we show that fibroblast depletion or loss of fibroblast-derived growth factors impacts skin macrophage populations in the dermis and hypodermis. Conditional deletion of Csf1 in Dpt+ fibroblasts progressively decreases CD64+ and CD11c+ macrophages, impairing skin wound healing. Reduced macrophage abundance disrupts fibroblast cell cycle regulation, metabolism and immune signaling, and increases fibroblast abundance, affirming a reciprocal relationship. In human systemic sclerosis (scleroderma), elevated fibroblast-derived CSF1 and increased macrophage abundance correlate with disease severity, implicating the CSF1-CSF1R axis in pathology. These findings provide in vivo evidence of macrophage regulation of fibroblasts, revealing a bidirectional interplay that advances understanding of tissue homeostasis and immune regulation in skin.","body":"本文献笔记由 Claudian 自动生成，元数据已同步至 Zotero (ItemID: 1891, Zotero Key: 5BCF9E59) 一、研究背景与科学问题 # 1.1 疾病背景 # 皮肤是人体最大的器官，其完整性依赖于皮肤中多种细胞类型之间的精细协调。**成纤维细胞（fibroblasts）**是皮肤真皮层的主要间质细胞，负责合成细胞外基质（ECM）蛋白（如胶原蛋白、弹性蛋白）、维持组织结构以及调节伤口愈合过程。**巨噬细胞（macrophages）**则是皮肤免疫系统的核心组分，参与炎症反应、病原体清除和组织修复。 皮肤损伤（如外伤、手术、慢性溃疡）和纤维化疾病（如系统性硬化症/硬皮病，systemic sclerosis）的发生均与成纤维细胞和巨噬细胞的功能失调密切相关。然而，这两种细胞如何在体内（in vivo）相互调节，以维持皮肤组织稳态，其具体机制尚不清楚。 1.2 机制背景 # 已有体外（in vitro）研究确立了成纤维细胞与巨噬细胞之间的crosstalk： 成纤维细胞可分泌 CSF1（Colony-Stimulating Factor 1，即 M-CSF） 支持组织驻留巨噬细胞的存活和增殖 巨噬细胞可分泌多种生长因子（如 PDGF、TGF-β）调节成纤维细胞的活化和增殖 Buechler 等（2021，Immunity）综述了 fibroblast-macrophage 相互作用在健康、纤维化和肿瘤中的意义 Zhou 等（2022，PNAS）证明间质细胞通过 microenvironmental sensing 控制巨噬细胞群体大小 关键科学问题： CSF1-依赖的成纤维细胞→巨噬细胞信号 ：成纤维细胞来源的 CSF1 在体内皮肤中支持哪些巨噬细胞亚群？ 巨噬细胞→成纤维细胞反向调控 ：巨噬细胞是否在体内反过来调节成纤维细胞？其分子机制是什么？ 临床相关性 ：该调控轴在人类纤维化疾病（如系统性硬化症）中如何变化？是否具有治疗靶点价值？ 二、整体研究思路（技术路线） # 多组学 + 遗传学小鼠模型 + 人组织验证 第1步：单细胞多组学解析小鼠皮肤 Fibroblast + Macrophage 亚群 ↓ scRNA-seq + CITE-seq 鉴定皮肤主要成纤维细胞亚群（Dpt+ fibroblasts ~80%） 鉴定皮肤主要巨噬细胞亚群（CD64+ 和 CD11c+） 确认 Dpt+ 成纤维细胞是皮肤 CSF1 的主要来源 第2步：遗传学小鼠模型验证 Fibroblast → Macrophage 信号 ↓ iDpt-CreERT2; Csf1-floxed mice 条件性敲除 Dpt+ 成纤维细胞中 Csf1 检测皮肤巨噬细胞数量和亚群变化 第3步：反向验证 Macrophage → Fibroblast 信号 ↓ 抗体介导巨噬细胞耗竭（抗-CSF1R） 单细胞转录组测序检测成纤维细胞转录组变化 形态学和组织学分析 第4步：伤口愈合功能验证 ↓ iDpt; Csf1-floxed 条件敲除 + 皮肤伤口模型 创面愈合速度、形态学和组织学评估 第5步：人类疾病组织验证 ↓ 系统性硬化症（硬皮病，SSc）患者皮肤样本 CSF1 表达、巨噬细胞浸润与疾病严重程度相关性分析 三、主要结果 # Result 1：皮肤成纤维细胞和巨噬细胞的多组学图谱 # 核心发现： 单细胞 RNA 测序（scRNA-seq）和 CITE-seq 联合分析解析了小鼠皮肤真皮层和皮下组织中成纤维细胞和巨噬细胞的亚群组成。 主要证据： 小鼠皮肤中 Dpt+（dermatopontin）成纤维细胞 约占总成纤维细胞的 80%，是最主要的成纤维细胞亚群 Dpt+ 成纤维细胞高表达 Csf1 ，是皮肤 CSF1 的主要来源 皮肤驻留巨噬细胞分为两群： CD64+ 巨噬细胞 ：组织驻留型，高表达 Timd4、Lyve1、Folr2（与淋巴窦和血管相关） CD11c+ 巨噬细胞 ：单核细胞来源型（mo-MΦ），表达 Ccr2，分布于真皮 Ligand-receptor 分析（CellChat）预测 Dpt+ 成纤维细胞通过 CSF1-CSF1R 配体-受体对与巨噬细胞通讯 意义： 首次在单细胞水平精确描绘了皮肤成纤维细胞-巨噬细胞通讯网络，确认 CSF1 为关键介导分子。 Figure 1 — Targeted depletion of Dpt+ fibroblasts 图注 : 利用 iDpt;DTR 转基因小鼠模型特异清除 Dpt+ 成纤维细胞，观察皮肤结构破坏等表识。（材源：PMC13043295，CC BY-NC-ND 4.0） Figure 2 — Dpt+ fibroblast depletion reduces CSF1 and skin macrophages 图注 : Dpt+ 成纤维细胞清除后，皮肤 CSF1 蛋白水平显著下降，伴隟 F4/80+ CD64+ 巨噬细胞数量显著减少，揭示 Dpt+ 成纤维细胞 → CSF1 → 巨噬细胞 的调控�%BD�。（材源：PMC13043295，CC BY-NC-ND 4.0） Result 2：条件性敲除 Dpt+ 成纤维细胞中 Csf1 导致巨噬细胞减少 # 核心发现： 在 Dpt+ 成纤维细胞中条件性敲除 Csf1 后，皮肤 CD64+ 和 CD11c+ 巨噬细胞均显著减少。 主要证据： iDpt-CreERT2; Csf1-floxed 小鼠经他莫昔芬诱导后： CD64+ 巨噬细胞数量急剧下降（急性依赖） CD11c+ 巨噬细胞延迟性减少（慢性依赖） 巨噬细胞减少呈时间依赖性渐进发展 流式细胞术和免疫荧光染色证实两种巨噬细胞亚群均显著减少 纤维细胞耗竭模型 （iDpt-CreERT2; R26-YFP/DTR）也观察到类似巨噬细胞减少，证实了成纤维细胞对巨噬细胞的广泛支撑作用 意义： 首次在体内（in vivo）证明成纤维细胞来源的 CSF1 对维持皮肤巨噬细胞群体稳态至关重要，且不同巨噬细胞亚群对 CSF1 的依赖程度不同。 Figure 1（续）— 皮肤空间组织与 CSF1 依赖的巨噬细胞维持 （见于上图 Extended Data Fig 部分面板） 图注：Main Figure 1 中包含免疫荧光（IF）染色展示 Dpt+ 成纤维细胞与 CD64+/CD11c+ 巨噬细胞的空间分布；Extended Data Fig 3-5（见下图 Extended Data 图）进一步展示 CSF1 条件敲除后巨噬细胞显著减少的空间证据，证实成纤维细胞对巨噬细胞的空间支撑作用。 Result 3：巨噬细胞反向调节成纤维细胞——双向调控的发现 # 核心发现： 巨噬细胞耗竭后，成纤维细胞出现明显的细胞数增加和转录组变化，证实了 成纤维细胞←巨噬细胞的反向调控 。 主要证据： 抗 CSF1R 抗体处理耗竭巨噬细胞后： 成纤维细胞数量显著 增加 （矛盾性扩增） scRNA-seq 显示成纤维细胞转录组广泛变化： 细胞周期相关基因 下调（G2/M 期阻滞） 代谢通路 重编程（糖代谢、脂质代谢改变） 免疫信号通路 改变（干扰素响应、趋化因子表达） 皮肤组织形态学改变：真皮层增厚、细胞外基质沉积增多 CellChat 分析 ：巨噬细胞可能通过多种配体（如 M-CSF、IL-34、TGF-β 等）与成纤维细胞通讯，调控其增殖和代谢 证实了成纤维细胞与巨噬细胞之间存在 双向（bidirectional）\"推拉\"调控关系 意义： 这是本文最核心的发现——首次在体内证明巨噬细胞可以反向调节成纤维细胞，确立了 fibroblast-macrophage equilibrium 的双向性。 Figure 3 — Acute Csf1 loss in Dpt+ fibroblasts reduces CD64+ skin macrophages 图注 : 在 iDpt;Csf1 fl/fl 条件敲除小鼠中，急性敲除 Dpt+ 成纤维细胞 Csf1 基因，特开性降低 CD64+ 巨噬细胞不同身阵。（材源：PMC13043295，CC BY-NC-ND 4.0） Result 4：Dpt+ 成纤维细胞来源 CSF1 调控皮肤伤口愈合 # 核心发现： 成纤维细胞来源的 CSF1 通过支持巨噬细胞，间接但不可或缺地促进皮肤伤口愈合。 主要证据： 在 Csf1 条件敲除小鼠中构建全层皮肤伤口模型： 伤口愈合速度显著延迟 再上皮化（re-epithelialization）面积减少 肉芽组织（granulation tissue）形成不良 α-SMA+ 肌成纤维细胞数量减少 胶原沉积和血管新生受损 提示：成纤维细胞-巨噬细胞轴对于有效的皮肤修复是不可或缺的 意义： 将 fibroblast-macrophage crosstalk 与体内生理功能（伤口愈合）直接联系起来，揭示了该调控轴的生物学意义。 Figure 4 — Chronic Csf1 loss reduces macrophages and increases fibroblasts 图注 : 慢�%A7 Csf1 缺失导致巨噬细胞持续�%A7减少，成纤维细胞数量反而增加（反馈�%A7增殊）。（材源：PMC13043295，CC BY-NC-ND 4.0） Result 5：系统性硬化症（硬皮病）中 CSF1-CSF1R 轴失调 # 核心发现： 在人类系统性硬化症（硬皮病，systemic sclerosis，SSc）患者皮肤中，成纤维细胞来源的 CSF1 表达升高，巨噬细胞浸润增加，且与疾病严重程度正相关。 主要证据： SSc 患者皮肤活检组织中： 成纤维细胞 CSF1 表达显著升高 巨噬细胞数量显著增加 （CD68+ 细胞浸润增多） CSF1 表达水平与疾病严重程度（改良 Rodnan 皮肤评分，mRSS）正相关 免疫荧光染色共定位证实增多的巨噬细胞与 CSF1+ 成纤维细胞在空间上邻近 提示：该轴的失调可能参与 SSc 的发病机制 意义： 将小鼠中发现的新机制直接转化应用于人类纤维化疾病，为 SSc 提供了新的分子靶点和治疗思路。 Figure 5 — Reduced macrophages from fibroblast-derived Csf1 loss impair skin wound healing 图注 : 全层皮肤伤及模型中，iDpt;Csf1 fl/fl 小鼠伤及懒同明显廚后进居卷原，补血及伤增生。（材源：PMC13043295，CC BY-NC-ND 4.0） Figure 6 — scRNA-seq identifies cell composition changes during wounding 图注 : 10x Genomics 单细胞 RNA-seq 解析伤及懒同中细胞组成变化；量际主要细胞类�%9e�（Dpt+ 成纤维细胞のcoD11c+/巨噬细胞のco%E8�%92%E8���%BD%93%E6%88%90%E7%BB�%E7%BB%86%E8%83%9E%E7%AD%89%ef%bc%89%E5%8f�%E5%B7%AE%E5%BC%82%E5%9F%BA%E5%9B%A0%E8%A1%A8%E8%BE%BE%E8%B0%B1%E3%80%82（�%9d%90%E6%BA%90�%9aPMC13043295�%8cCC BY-NC-ND 4.0） Figure 7 — Human skin fibroblast CSF1 correlates with macrophages 图注 : 人正正常肤组�%BB%9F�%B8�，FACS �%88%86%E9%80%89 DPT+ �%88%90%E7%BA%A4%E7%BB%B4%E7%BB%86%E8%83%9E%E9%AB%98%E8%A1%A8%E8%BE%BE CSF1 mRNA�%bc%9bDPT+ �%88%90%E7%BA%A4%E7%BB%B4%E7%BB%86%E8%83%9E CSF1 �%A1%A8%E8%BE%BE%E4%B8%8E%E9%82%BB%E8%BF%91 CD68+ �%B7%A8%E5%99%AC%E7%BB%86%E8%83%9E%E6%95%B0%E9%87%8F%E5%93%8D%E6%AD%A3%E5%85%B3�%9b%E7%A1%AC%E7%9A%AE%E7%97%85�%BC%88SSc%EF%BC%89%E6%82%A3%E8%80%85%E7%9A%AE%E8%82%A4%E4%B8%AD%E8%AF%A5%E8%BD%B4%E8%BF%9B%E4%B8%80%E6%AD%A5%E5%A4%B1%E8%B0%83�%80%82（�%9d%90�%BA%90�%9aPMC13043295�%8cCC BY-NC-ND 4.0） 四、机制模型 # 4.1 双向调控\"推拉\"平衡模型 # 【Dpt+ 成纤维细胞】 ↓ 分泌 CSF1 ↓ ┌────────────┴────────────┐ ↓ ↓ 【CD64+ 巨噬细胞】 【CD11c+ 巨噬细胞】 （组织驻留型） （单核细胞来源型） ↑ ↑ └────────────┬────────────┘ ↓ 分泌多种因子 （CSF1、IL-34、TGF-β 等） ↓ 【Dpt+ 成纤维细胞】 → 调节细胞周期 → 调节代谢 → 调节免疫信号 → 维持组织稳态/修复 4.2 皮肤损伤/纤维化中的失衡 # 状态 CSF1 水平 巨噬细胞 成纤维细胞 结果 稳态 正常 稳态 正常 组织完整 伤口愈合 ↑ ↑→↓（动态变化） 活化→增殖 组织修复 SSc（硬皮病） 持续升高 持续增加 过度活化 纤维化 4.3 治疗转化潜力 # CSF1R 抑制剂 ：理论上可减少巨噬细胞→成纤维细胞的过度激活信号，用于治疗纤维化 风险 ：CSF1R 阻断可能同时损害正常的伤口愈合能力 精准医学 ：需要开发仅阻断致病性\"巨噬细胞→成纤维细胞\"信号而不影响\"成纤维细胞→巨噬细胞\"信号的策略 五、研究亮点与局限性 # 研究亮点 # ✅ 双向调控概念的首次体内证实 ：不仅证明成纤维细胞调节巨噬细胞，更首次在体内证明巨噬细胞可以反向调节成纤维细胞 ✅ 精确的遗传学模型 ：使用 iDpt-CreERT2 条件性敲除系统，实现细胞类型和时机特异性操控 ✅ 多组学整合 ：单细胞 RNA-seq + CITE-seq + CellChatligand-receptor 分析，从多个维度解析细胞间通讯 ✅ 从机制到临床转化 ：从小鼠模型到人类疾病（系统性硬化症）的完整闭环研究 ✅ 治疗靶点潜力 ：CSF1-CSF1R 轴为纤维化疾病提供了新的治疗干预思路 ✅ 高质量期刊 ：Nature Immunology（IF≈30.5），中科院1区 研究局限性 # ⚠️ 物种差异 ：从小鼠到人类的转化验证需进一步研究；人类皮肤微环境与小鼠存在差异 ⚠️ 疾病模型单一 ：系统性硬化症仅做了相关性分析，缺乏功能性验证（如 CSF1R 阻断在 SSc 模型中的治疗效果） ⚠️ 巨噬细胞→成纤维细胞的具体配体 ：虽然 CellChat 预测了多种候选分子，但具体的反向调节配体（除 CSF1 外）尚未被完全阐明 ⚠️ CSF1R 阻断的双刃剑效应 ：CSF1R 阻断可能同时影响成纤维细胞→巨噬细胞和巨噬细胞→成纤维细胞两个方向，临床转化需谨慎 ⚠️ 长期效应未知 ：条件敲除实验主要在急性/亚急性时间窗口进行，慢性纤维化进程中的角色尚需长期研究 六、核心参考文献 # Buechler, M. B., Fu, W. \u0026 Turley, S. J. Fibroblast–macrophage reciprocal interactions in health, fibrosis, and cancer. Immunity 54, 903–915 (2021). 10.1016/j.immuni.2021.04.021 Buechler, M. B. et al. Cross-tissue organization of the fibroblast lineage. Nature 593, 575–579 (2021). 10.1038/s41586-021-03549-5 Zhou, X. et al. Microenvironmental sensing by fibroblasts controls macrophage population size. Proc. Natl Acad. Sci. USA 119, e2205360119 (2022). 10.1073/pnas.2205360119 Shook, B. A. et al. Myofibroblast proliferation and heterogeneity are supported by macrophages during skin repair. Science 362, eaar2971 (2018). 10.1126/science.aar2971 Gur, C. et al. LGR5 expressing skin fibroblasts define a major cellular h rential expression of histone H4K12 lactylation","subtitle":"","summary":"译名： 基于乳酰化组的骨关节炎软骨下骨研究揭示组蛋白 H4K12 乳酰化的细胞特异性差异表达：一项实验研究 发表： International Journal of Surgery IF = 10.3（中科院1区） 2026-02-12 DOI： 10.1097/JS9.0000000000004934 通讯作者： Jun Miao（缪俊）, Lin Chen（陈林）等 单位： 上海市第六人民医院 上海交通大学 复旦大学 等 骨关节炎（OA） 是最常见的慢性关节疾病，严重危害","body":"译名： 基于乳酰化组的骨关节炎软骨下骨研究揭示组蛋白 H4K12 乳酰化的细胞特异性差异表达：一项实验研究 发表： International Journal of Surgery | IF = 10.3（中科院1区）| 2026-02-12 DOI： 10.1097/JS9.0000000000004934 通讯作者： Jun Miao（缪俊）, Lin Chen（陈林）等 单位： 上海市第六人民医院 | 上海交通大学 | 复旦大学 等 背景与研究意义 # 疾病背景 # 骨关节炎（OA） 是最常见的慢性关节疾病，严重危害中老年人群健康 软骨下骨（subchondral bone）在 OA 发病机制中发挥关键作用，但具体分子调控网络尚不清楚 软骨下骨重塑（bone remodeling）异常是 OA 进展的重要病理基础 乳酰化修饰 # 事件 时间 关键内容 乳酰化首次报道 2019, Nature Zhang et al. 发现组蛋白乳酰化（histone lactylation）是一种新的表观遗传修饰 乳酰化功能 后续研究 参与调控基因激活、巨噬细胞极化、肿瘤代谢等多种生物学过程 H4K12la 首次鉴定 本研究 系统性揭示 H4K12 乳酰化（H4K12 lactylation, Kla）在 OA 软骨下骨中的细胞特异性表达模式 研究空白 # 乳酰化在骨代谢相关疾病中的作用尚未被系统研究 软骨下骨中不同细胞类型（成骨细胞、破骨细胞、骨细胞）的乳酰化全景图谱缺失 H4K12la 作为潜在的疾病调控位点，其在 OA 中的作用尚不清楚 研究目的 # 系统性描绘 OA 软骨下骨的乳酰化修饰全景（lactylome profiling） 揭示 乳酰化在不同骨细胞类型中的特异性表达模式 阐明 H4K12la 在 OA 软骨下骨重塑中的分子调控机制 探索 H4K12la 作为 OA 潜在治疗靶点的可行性 技术路线 # ACLT诱导OA大鼠模型 │ ├── Micro-CT → 骨微结构分析 │ ├── 乳酰化组学（Lactylome, LC-MS/MS） │ └─ 鉴定乳酰化位点及蛋白质 │ ├── 空间转录组学（Spatial Transcriptomics） │ └─ 细胞空间定位与基因表达 │ ├── 单细胞RNA测序（scRNA-seq） │ └─ 细胞类型鉴定与差异表达 │ └── 功能实验 ├─ 细胞培养 + siRNA敲降 ├─ 过表达实验 └─ ChIP-seq / 验证实验 模型构建 # 动物模型： 前交叉韧带切断术（ACLT）诱导的大鼠 OA 模型 对照组： 假手术组（Sham） 组学技术 # 乳酰化组学： 基于 LC-MS/MS 的泛乳酰化修饰组学分析 空间转录组： 揭示乳酰化修饰与基因表达的空间关联 单细胞测序： 解析 OA 软骨下骨细胞异质性 主要结果 # 1. 乳酰化修饰全景图谱 # 共鉴定到 11,987 个乳酰化位点 ，分布于 3,401 种蛋白质 乳酰化修饰在 OA 软骨下骨中呈现广泛的差异表达 大量代谢酶和染色质相关蛋白被乳酰化修饰 乳酰化参与调控细胞能量代谢、表观遗传调控等多个关键通路 2. H4K12la 是 OA 中变化最显著的乳酰化位点 # H4K12la 在 OA 软骨下骨中显著 升高 ，是差异最明显的组蛋白乳酰化位点 指标 变化 意义 H4K12la 水平 ↑ 显著升高 最显著差异位点 修饰类型 Kla（乳酰化） 与基因激活相关 组织定位 软骨下骨 与 OA 病理区域一致 3. H4K12la 呈现细胞特异性表达模式 # H4K12la 在不同骨细胞类型中呈现截然不同的表达模式： 细胞类型 H4K12la 水平 变化趋势 破骨细胞（Osteoclasts） ↑ 高表达 OA 中显著升高 成骨细胞（Osteoblasts） ↓ 低表达 OA 中显著降低 骨细胞（Osteocytes） ↑ 高表达 OA 中显著升高 意义： 提示 H4K12la 通过细胞类型特异性调控影响 OA 软骨下骨重塑 4. H4K12la 调控 OA 相关关键基因 # H4K12la 与 OA 进展相关基因的表达密切关联 空间转录组分析显示 H4K12la 修饰位点与基因激活位点存在空间共定位 功能富集分析提示 H4K12la 参与骨代谢、炎症反应和细胞外基质重塑 5. H4K12la 的_writer_与_eraser_ # 类别 调控因子 功能 Writer（写入酶） P300/CBP 负责催化 H4K12la 的乳酰化修饰 Eraser（擦除酶） HDAC1/2 负责去除 H4K12la 修饰 P300/CBP-HDAC1/2-H4K12la 轴构成了 H4K12la 修饰的动态调控系统 6. 单细胞水平验证 # scRNA-seq 精细描绘了 OA 软骨下骨的细胞图谱 确认了 H4K12la 在不同细胞亚群中的差异表达 细胞通讯分析揭示了 H4K12la 介导的骨微环境信号调控 关键图表 (Figure 1-7) # 以下为论文原图，按研究逻辑顺序排列 Figure 1 | 乳酸代谢异常与骨重塑紊乱的病理关联 # 图注： Figure 1. Pathological linkage between aberrant lactate metabolism and abnormal bone remodeling in OA subchondral bone. (A) GSEA 分析 OA 软骨下骨转录组数据（GEO: GSE51588），富集炎症反应通路 (B-H) 乳酸代谢与骨重塑相关基因的表达验证 Figure 2 | OA 软骨下骨蛋白质组学分析 # 图注： Figure 2. Proteomic analysis of OA subchondral bone reveals significant metabolic remodeling and aberrant bone turnover. (A) PCA 分析：OA vs Sham 样本蛋白组差异 (B) 差异表达蛋白（DEP）统计 (C-F) 关键通路富集分析（骨重塑、代谢通路） Figure 3 | 乳酰化修饰全景分析 # 图注： Figure 3. Global features of lactylome analysis in OA subchondral bone and their potential biological implications. (A) 差异乳酰化位点统计（ 11,987 个位点 / 3,401 种蛋白质 ） (B) 差异乳酰化蛋白的亚细胞定位分析 (C-F) 功能通路富集：代谢通路、表观遗传调控、骨相关信号 Figure 4 | H4K12la 作为 OA 关键表观遗传标记 # 图注： Figure 4. H4K12la as a key epigenetic marker in OA subchondral bone pathology. (A) 差异乳酰化蛋白 PPI 网络分析（top 50 互作蛋白） (B-E) H4K12la 验证 ：WB/IHC 检测 OA 中 H4K12la 水平显著升高 (F-I) H4K12la 与 OA 病理评分相关性 Figure 5 | 破骨细胞主导乳酸微环境形成但 H4K12la 降低 # 图注： Figure 5. Osteoclasts dominate lactate microenvironment formation in OA subchondral bone but exhibit reduced H4K12la modification. (A) 破骨细胞分化协议示意 + TRAP 染色 (B) RT-qPCR 验证破骨分化标志基因（Rank, Ctsk, Mmp9） (C-E) 细胞特异性 H4K12la 检测 ：破骨细胞 H4K12la 在 OA 中升高 (F-I) 乳酸分泌检测：破骨细胞是乳酸主要来源 Figure 6 | 成骨细胞 H4K12la 促进成骨分化 # 图注： Figure 6. Enhanced H4K12la modifications in osteoblasts promote osteogenic differentiation within OA subchondral bone microenvironment. (A) scRNA-seq UMAP 聚类：OA 软骨下骨成骨细胞亚群细分 (B) 热图：OA vs Sham 成骨细胞差异表达基因 (C-F) 成骨细胞 H4K12la 机制 ：H4K12la 促进 Runx2/Osterix 激活 → 成骨分化 (G-I) ALP/ARS 染色验证成骨分化能力 Figure 7 | 炎症微环境增强破骨细胞乳酸分泌并通过 H4K12la 促进成骨分化 # 图注： Figure 7. Inflammatory microenvironment enhances lactate secretion by osteoclasts and promotes osteogenic differentiation via H4K12la modification. (A) IL-1β 处理后 TRAP 染色：炎症促进破骨分化 (B) 乳酸分泌检测 ：IL-1β 显著增加破骨细胞乳酸释放 (C-F) H4K12la 功能实验 ：siRNA 敲降 P300 / HDAC1→调控 H4K12la 水平→影响成骨分化 (G-I) ChIP-seq 验证 H4K12la 靶向调控 Runx2 等成骨关键基因 讨论与结论 # 核心发现 # H4K12la 是 OA 软骨下骨的新型调控因子 首次系统揭示组蛋白乳酰化在骨关节疾病中的作用 填补了乳酰化在骨代谢研究中的空白 H4K12la 呈现细胞类型特异性 破骨细胞高表达 H4K12la → 提示促进骨吸收 成骨细胞低表达 H4K12la → 提示抑制骨形成 两者共同驱动 OA 软骨下骨病理改变 P300/CBP-H4K12la 轴可作为 OA 治疗靶点 靶向 P300/CBP 可调控 H4K12la 水平 HDAC1/2 抑制剂可能间接影响 H4K12la 动态平衡 研究创新点 # ✅ 首次构建 OA 软骨下骨乳酰化修饰全景图谱 ✅ 首次揭示 H4K12la 的细胞特异性差异表达模式 ✅ 首次将组蛋白乳酰化与 OA 软骨下骨重塑直接关联 ✅ 整合多组学（乳酰化组 + 空间转录组 + scRNA-seq）系统解析 研究局限性 # 临床样本验证尚需扩大样本量 P300/CBP 调控 H4K12la 的直接分子机制需进一步结构生物学研究 治疗靶向策略的体内有效性有待进一步验证 参考文献 # [!cite] Zhang D, et al. Nature . 2019;574(7779):575-580. 乳酰化首次报道 Wang N, et al. Cell . 2022. 乳酰化调控巨噬细胞极化 Li L, et al. Cell Metab . 2024. 乳酸调控OA软骨代谢 Li L, et al. J Clin Invest . 2024. 骨细胞代谢与OA Wang J, et al. Nat Commun . 2024. 乳酰化在组织修复中的作用 相关文献 # Lactate derived from macrophages drives skin dermal fibroblasts phenotypic remodeling via MCT1-primed histone H3 lysine 23 lactylation in hypertrophic scar - Nature Communications — H3K23la 在瘢痕组织中的作用，与本研究 H4K12la 共同构成组蛋白乳酰化调控网络 文献笔记 # 由 Claude 阅读 PDF 原文献后整理 原文路径： D:/App/Zotero/storage/MRV673WP/Xu 等 - Lactylome-based investigation of osteoarthritic subchondral bone reveals cell-specific differential.pdf 整理时间：2026-04-09","tags":["骨关节炎(OA)","乳酰化(Lactylation)","H4K12la","软骨下骨","表观遗传","组蛋白修饰","单细胞测序","空间转录组"],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.572Z","url":"literature/notes/b4448a4216abed56d037d33a.html"},{"kbId":"KB-000035","title":"Lactate derived from macrophages drives skin dermal fibroblasts phenotypic remodeling via MCT1-primed histone H3 lysine 23 lactylation in hypertrophic scar - Nature Communications","subtitle":"","summary":"Hypertrophic scar (HS) is a fibroproliferative disorder characterized by fibroblast hyperactivation and aberrant extracellular matrix deposition. This study identifies macrophage-derived lactate as a key mediator of fibroblast phenotypic remodeling via monocarboxylate transporter 1 (MCT1)-mediated histone H3 lysine 23 lactylation (H3K23la) in HS. Elevated lactate levels and MCT1 expression were observed in HS tissues, with macrophages in stiff mechanical microenvironments identified as the primary lactate source. Lactate influx through MCT1 upregulated H3K23la, thereby promoting transcriptional activation of profibrotic genes HEY2 and COL11A1. Mechanistically, HEY2 activated YAP1/SMAD2 signaling, while COL11A1 stabilized MCT1 to enhance lactate transport, forming a positive loop that amplified fibrosis. Fibroblast-specific Mct1 deletion or pharmacological inhibition of Mct1 in male mice reduced collagen deposition, accelerated wound healing, and attenuated scar formation. Our findings redefine the macrophage-fibroblast crosstalk in HS and establish the MCT1-H3K23la-HEY2/COL11A1 axis, particularly its self-reinforcing loop, as a novel therapeutic target. The study identified macrophage-derived lactate as a driver of hypertrophic scar. Lactate influx via MCT1 triggers histone lactylation in fibroblasts to activate profibrotic genes.","body":"抽象的 # 肥厚性瘢痕（HS）是一种纤维增生性疾病，其特征是成纤维细胞过度活化和异常的细胞外基质沉积。本研究发现，巨噬细胞来源的乳酸是 HS 中成纤维细胞表型重塑的关键介质，其作用机制是通过单羧酸转运蛋白 1（MCT1）介导的组蛋白 H3 第 23 位赖氨酸乳酸化（H3K23la）。在 HS 组织中观察到乳酸水平和 MCT1 表达升高，其中处于机械微环境中的巨噬细胞被认为是乳酸的主要来源。乳酸通过 MCT1 流入，上调 H3K23la，从而促进促纤维化基因 HEY2 和 COL11A1 的转录激活。机制上，HEY2 激活 YAP1/SMAD2 信号通路，而 COL11A1 稳定 MCT1 以增强乳酸转运，形成一个正反馈环路，从而加剧纤维化。在雄性小鼠中，成纤维细胞特异性敲除 Mct1 或使用药理学方法抑制 Mct1 可减少胶原沉积，加速伤口愈合，并减轻瘢痕形成。我们的研究结果重新定义了化脓性汗腺炎（HS）中巨噬细胞与成纤维细胞的相互作用，并将 MCT1-H3K23la-HEY2/COL11A1 轴，特别是其自我增强环路，确立为一个新的治疗靶点。 介绍 # 皮肤伤口修复旨在通过精确调控的愈合级联反应恢复组织完整性和皮肤稳态 [^1] 。然而，广泛且较深的损伤常常导致病理性增生性瘢痕（HS），这是一种纤维增生性疾病，其特征是细胞外基质（ECM）成分过度沉积和持续性炎症。HS 代表异常伤口愈合的病理结果 [^2] [^3] 。约 35%的线性手术伤口 [^4] 和高达 72%的烧伤伤口 [^5] 会发展为 HS。HS 伴有瘙痒、疼痛和功能障碍，严重影响患者的生活质量和心理健康。因此，深入了解 HS 的发病机制和进展对于识别 HS 的潜在治疗靶点和生物标志物至关重要 [^6] 。 目前的病理生理模型强调成纤维细胞过度活化和异常的细胞外基质（ECM）合成是化脓性汗腺炎（HS）发展的核心。虽然短暂的成纤维细胞活化是正常伤口修复的一部分，但持续活化会导致成纤维细胞转化为肌成纤维细胞，并驱动 HS 的形成 [^7] 。因此，靶向活化的成纤维细胞并调节其纤维化行为是控制 HS 形成的主要策略。新出现的证据表明，在各种器质性纤维化疾病的进展过程中，代谢重编程（从氧化磷酸化到有氧糖酵解）提示代谢失调可能是纤维化的潜在治疗靶点 [^8] [^9] 。值得注意的是，HS 和瘢痕疙瘩（伤口愈合的病理结果）均表现出显著升高的糖酵解水平 [^10] 。此外，巨噬细胞是许多疾病中代谢重编程的主要参与者 [^11] [^12] ，并在伤口愈合过程中通过分泌 TGF-β1 促进成纤维细胞分化 [^1] 。此外，代谢重编程不仅产生糖酵解中间产物以满足增殖细胞的合成代谢需求，而且不可避免地导致乳酸等代谢副产物的生成增加 [^13] 。乳酸除了作为传统的代谢废物外，还具有信号分子、能量底物和免疫调节分子的功能 [^14] [^15] 。乳酸不仅来源于内源性糖酵解，还可以通过乳酸转运系统从其他细胞中产生。一些细胞会主动排出乳酸，以防止细胞内积累，维持 pH 平衡，并为高氧化性组织和器官的氧化代谢提供乳酸 [^16] [^17] 。 单羧酸转运蛋白 1 (MCT1) 是溶质载体家族 16 (SLC16) 的成员，主要负责乳酸转运 [^18] 。它是 MCT1 至 MCT4 中表达最广泛的，并且在氧化活性高的细胞（例如氧化型肌纤维）中经常高表达 [^19] 。近期研究强调了 MCT1 在纤维化中的重要性 [^20] [^21] 。然而，鲜有研究证实巨噬细胞代谢重编程与成纤维细胞表型重塑之间通过乳酸转运在 HS 进展中存在直接联系。巨噬细胞创造的代谢微环境如何调控成纤维细胞活化仍知之甚少。 近期研究发现，乳酸是组蛋白乳化这一表观遗传修饰的重要调控因子 [^22] 。组蛋白通过调控下游基因的表达和活性来调节生物学过程 [^23] 。组蛋白乳化在多种细胞生理机制中发挥着关键作用，包括信号转导、转录调控、代谢稳态、表观遗传修饰和免疫反应 [^24] [^25] [^26] 。近年来，组蛋白乳化与纤维化之间的关系引起了广泛关注 [^27] 。然而，目前针对组蛋白乳化治疗以改善和改变化脓性汗腺炎（HS）分子图谱的策略寥寥无几。因此，仍需进一步研究以更深入地了解组蛋白乳化在 HS 病理学中的作用。此外，代谢重编程如何重塑表观遗传改变，特别是 HS 中的乳化，目前尚不清楚。 本研究提供了强有力的证据，表明 MCT1 介导的乳酸内流通过组蛋白乳酸化调节基因表达，特别是通过提高 HS 相关肌成纤维细胞中的 H3K23la 水平。我们发现 HS 中乳酸积累显著增加，乳酸生成和转运相关基因的表达上调，同时 MCT1 显著过表达。进一步分析表明，巨噬细胞是 HS 中高乳酸代谢微环境的主要贡献者，它们通过 MCT1 驱动乳酸积累和 H3K23la 水平升高。利用靶标下切割和标签化（CUT\u0026Tag）技术，我们鉴定出 H3K23la 在促纤维化基因启动子区域富集，包括 Hes 相关家族 BHLH 转录因子 2（HEY2）和 XI 型胶原α1 链（COL11A1）。从机制上讲，HEY2 转录激活 YAP1 表达，从而刺激 YAP1/SMAD2 通路并促进纤维化过程。同时，COL11A1 通过与 MCT1 相互作用增强乳酸转运效率，形成正反馈环路，加剧成纤维细胞内乳酸的积累。MCT1 的药理学抑制以及 HEY2 和 COL11A1 的沉默均能减弱成纤维细胞活化和胶原沉积。值得注意的是，在小鼠全层皮肤缺损模型中，成纤维细胞特异性敲除 Mct1 可促进伤口愈合，减少瘢痕形成，并下调纤维化基因的表达。这些发现揭示了组蛋白乳酸化，特别是 H3K23la，在化脓性汗腺炎（HS）发病机制中的作用。破坏巨噬细胞糖酵解-MCT1-H3K23la-HEY2/COL11A1 轴及其相关的反馈环路，代表了一种有前景的 HS 治疗策略。 结果 # 肥厚性瘢痕中糖酵解和乳酸转运能力增强 # 糖酵解活性升高与多种纤维化疾病的进展相关，并在瘢痕疙瘩的形成过程中得到证实 [^28] [^29] 。考虑到纤维化疾病中的代谢重编程，我们检测了化脓性汗腺炎（HS）患者瘢痕组织中的乳酸水平。比色法分析表明，与正常皮肤（NS）组织相比，HS 组织中的乳酸水平显著升高（图 1A ）。为了表征代谢表型，我们对 HS 组织和健康组织进行了非靶向代谢组学分析，结果显示患者具有独特的代谢特征（图 S1A ）。HS 组织中关键的三羧酸循环中间体柠檬酸显著降低，同时糖酵解代谢产物磷酸烯醇式丙酮酸显著升高（图 S1A - S1C ）。 KEGG 分析显示，不同代谢物主要富集于中心碳代谢通路，以及对生物合成和增殖至关重要的通路，包括氨基酸生物合成、mTOR 信号通路、PI3K-Akt 信号通路和亚油酸代谢（图 S1C ）。为了进一步验证代谢谱并克服非靶向代谢组学在定量小极性酸方面的局限性，我们进行了靶向能量代谢组学分析，结果显示 HS 组织中存在独特的代谢特征（图 S1D ）。乳酸是继鸟苷三磷酸（GTP）和 DL-甘油酸之后，第三大上调代谢物（log2FC）（图 S1E ）。与有氧糖酵解的转变相一致，定量分析证实 HS 组织中乳酸、丙酮酸和 ATP 的水平显著升高（图 S1F ）。 KEGG 通路分析显示，这些代谢物富集于丙酮酸代谢、碳代谢和糖酵解通路（图 S1G ）。接下来，RT-qPCR 分析糖酵解相关基因（LDHA、HK2、PKM2 和 PFKFB3）、乳酸转运相关基因（MCT1 和 MCT4）以及氧化磷酸化相关基因（PDHA1、CS、IDH1 和 IDH2）的表达，结果表明 HS 中乳酸相关基因显著增加，尤其是 MCT1（图 1B ）。具体而言，与正常皮肤相比，PDHA1、IDH1 和 IDH2 的 mRNA 水平显著降低（图 1B ）。此外，我们采用 Western blotting 分析了 NS 和 HS 中这些基因的表达，结果显示，HS 中 MCT1、MCT4 和 PKM2 的蛋白水平显著升高，而 IDH1 和 IDH2 的蛋白水平显著降低（图 1C 和 S1H ）。糖酵解途径的同步上调和关键氧化磷酸化（OXPHOS）组分的下调有力地证明了 HS 微环境中代谢向有氧糖酵解的转变。尽管存在一些细微差异，但在免疫组化（IHC）检测和免疫荧光结果中观察到了相似的模式（图 1 D、 E ），表明与正常皮肤（NS）相比，HS 组织中 MCT1 的表达和整体糖酵解能力显著升高。因此，我们假设 MCT1 主要参与 HS 皮肤纤维化的调控。此外，我们进行了 MCT1 与肌成纤维细胞标志物（α-SMA）抗体的免疫荧光共染色，结果显示 HS 组织中 MCT1 和α-SMA 荧光共定位增强（图 1F ）。 为了定量验证这一观察结果，我们计算了 Pearson 相关系数和重叠系数，结果显示，与 NS 组织相比，HS 组织中 MCT1 和α-SMA 的共定位水平显著更高（图 1F ）。RT-qPCR 结果显示，与正常人皮肤真皮成纤维细胞（NSF）相比，人肥厚性瘢痕成纤维细胞（HSF）中 MCT1 的 mRNA 表达水平显著升高（图 1G ）。综上所述，这些结果表明，MCT1 在 HS 中表达上调，主要在肌成纤维细胞中表达上调。 累计起来，我们的数据表明，HS 组织中乳酸积累水平升高，代谢发生转变，MCT1 在将细胞外乳酸转移到成纤维细胞中以促进表型重塑方面具有潜在作用。 图 1：增生性瘢痕中糖酵解和乳酸转运能力增强。 乳酸是人类皮肤成纤维细胞表型重塑的关键促进因子。 # 为了阐明 HS 中乳酸水平升高是否与成纤维细胞表型重塑为肌成纤维细胞相关，我们检测了不同浓度乳酸钠（NaLac）处理的 NSF 中纤维化标志物的表达。在乳酸浓度为 10 mM 时，COL1A1 和α-SMA 等纤维化标志物的表达达到最大值，而 COL3A1 在 15 mM 时表达最高（图 S2A 和 S2B ）。因此，我们选择 10 mM 的乳酸浓度作为最佳刺激浓度。此外，乳酸还能增强 NSF 的增殖和迁移能力（图 S2C - S2E ）。值得注意的是，乳酸已被证实是皮肤组织中的一种促纤维化因子。 巨噬细胞是瘢痕代谢微环境中乳酸积累的主要来源。 # 鉴于肥厚性瘢痕（HS）中乳酸含量显著上调，探究纤维化微环境中乳酸的细胞来源至关重要。为此，我们建立了一个体外系统，利用聚二甲基硅氧烷（PDMS）水凝胶涂层板来模拟肥厚性瘢痕特有的高机械刚度。我们制备了杨氏模量分别为 2 kPa（生理顺应性）和 50 kPa（病理刚度）的基底，分别模拟正常和纤维化的机械微环境 [^30] [^31] 。我们对三种原代皮肤真皮细胞群进行了乳酸定量分析：巨噬细胞（THP-1 细胞）、血管内皮细胞（HUVECs）和真皮成纤维细胞（NSFs），这些细胞接种在 PDMS 水凝胶涂层板的表面。生化分析表明，与对照组相比，巨噬细胞的细胞外乳酸积累和细胞内乳酸生成均显著升高（图 2A ）。在内皮细胞或成纤维细胞中未观察到与基质刚度相关的显著乳酸变化（图 2A ）。随后用 TGF-β（一种纤维生成和胶原沉积的关键调节因子 [^32] ）刺激后发现，巨噬细胞的乳酸水平升高最为显著，尽管内皮细胞和成纤维细胞中也检测到中等程度的升高（图 2B ）。通过细胞外酸化率（ECAR）测量进行的代谢谱分析提供了功能验证，表明在 50 kPa 刚度基质上培养的巨噬细胞表现出增强的 ECAR，这反映了在高基质刚度刺激下糖酵解水平、糖酵解能力和糖酵解储备的增加（图 2C ）。 TGF-β刺激产生了类似的代谢激活模式（图 2D ）。为了明确评估代谢转换，我们计算了 ATP 生成速率。在 50 kPa 刚性基质上培养或经 TGF-β刺激的巨噬细胞表现出显著的代谢转变，其中糖酵解产生的 ATP（glycoATP）明显高于氧化磷酸化产生的 ATP（mitoATP）（图 S3A 和 S3B ）。然而，在刚性条件下，内皮细胞和成纤维细胞培养物仅表现出轻微的 ECAR 增加，且 glycoATP/mitoATP 比值没有显著变化（图 2E 、 F 、S3C 和 S3D）。 图 2：巨噬细胞是瘢痕代谢微环境中乳酸积累的主要来源。 为了在体内验证巨噬细胞是瘢痕形成过程中乳酸的主要来源，我们利用磁激活细胞分选（MACS）技术从新鲜的 NS 和 HS 组织中分离出原代巨噬细胞、血管内皮细胞和真皮成纤维细胞，并采用蛋白质印迹法对这些细胞进行蛋白水平验证（图 S4A - S4C ）。与之前的研究结果一致，HS 组织中的原代巨噬细胞表现出显著升高的细胞外乳酸积累和细胞内乳酸生成，而成纤维细胞和内皮细胞中的乳酸水平保持不变（图 2G ）。此外，与对照组相比，HS 组织中的原代巨噬细胞的细胞外酸化率（ECAR）和糖基 ATP/线粒体 ATP 比值也显著升高（图 2H 和 S4D ）。这种巨噬细胞特异性的代谢转变得到了 HS 组织中 CD68 0 巨噬细胞内糖酵解酶 HK2 和 LDHA 选择性上调的证实（图 2 I、 J ），而 CD31 1 内皮细胞则无相应变化（图 S4E 和 S4F ）。为了进一步排除其他免疫细胞群对富含乳酸的微环境的影响，我们还对人 NS 和 HS 组织中关键糖酵解酶（HK2 或 LDHA）与肥大细胞（胰蛋白酶）和 T 细胞（CD3）标志物进行了免疫荧光共染色。定量分析显示，糖酵解酶阳性的肥大细胞或 T 细胞的数量无统计学差异（图 S4G - S4J ）。至关重要的是，我们利用氯膦酸盐脂质体特异性地清除 C57BL/6 小鼠背部全层皮肤缺损模型中的巨噬细胞。 免疫荧光分析证实，与生理盐水处理的对照组相比，氯膦酸脂质体处理的小鼠瘢痕组织中 F4/80 阳性巨噬细胞显著减少（图 S4K ）。重要的是，这种巨噬细胞的减少导致瘢痕组织内乳酸水平显著降低（图 S4L ）。综上所述，这些体内研究结果有力地支持了我们的结论，即巨噬细胞是 HS 中富含乳酸的微环境的关键因素。本研究确定巨噬细胞是机械应力作用下纤维化微环境中乳酸的主要来源，底物硬度和 TGF-β信号通路均独立地促进了 HS 中巨噬细胞向糖酵解的转变。 巨噬细胞来源的乳酸积累通过 MCT1 促进皮肤真皮成纤维细胞的表型重塑。 # 我们之前的研究表明，在 HS 微环境中，肌成纤维细胞中 MCT1 表达上调，巨噬细胞产生乳酸。因此，探究 MCT1 和巨噬细胞来源的乳酸在成纤维细胞表型重塑中的作用至关重要。如图 3A 所示，将不同基质硬度的条件培养基（CM）分别加入到 THP-1 细胞（Mφ-CM@2 kPa，Mφ-CM@50 kPa）和 HUVEC 细胞（EC-CM@2 kPa，EC-CM@50 kPa）中，以诱导 NSF 细胞发生纤维化。在 Mφ-CM@50 kPa 刺激的 NSF 细胞中观察到纤维化标志物表达升高，而用 AZD3965（一种强效且选择性的 MCT1 抑制剂，可通过阻断乳酸转运来干扰癌细胞代谢）处理的 NSF 细胞中，纤维化标志物表达则显著降低（图 3B 、 C ）。此外，AZD3965 逆转了由培养于 50 kPa 刚性基质上的巨噬细胞条件培养基（CM）诱导的成纤维细胞表型重塑增强，包括细胞迁移和增殖能力以及促纤维化生物标志物（纤连蛋白、SPARC、POSTN、TNC、CD248 和 SMAD2）的 mRNA 表达（图 3D-F 和 S5A-B ）。这些结果表明，Mφ-CM@50kPa 诱导的 NSF 表型重塑是由乳酸通过 MCT1 从巨噬细胞转运至成纤维细胞所致。为了进一步验证这一发现，我们使用 LDHA 抑制剂草酰胺降低了乳酸的产生。与我们的假设一致，通过草酰胺降低在 50 kPa 刚性基质上培养的巨噬细胞的乳酸生成水平，显著减弱了成纤维细胞的表型重塑（图 3G、K 和 S5C、D）。此外，AZD3965 还可以减轻用 TGF-β 刺激的巨噬细胞条件培养基 (CM) 处理的 NSF 中的纤维化（图 3G、K 和 S5C、D ）。 3L，M ）。相比之下，由高底物硬度或 TGF-β 刺激的 EC 的条件培养基对纤维化标志物的表达几乎没有影响（图 S5E 和 S5F ）。 总的来说，这些发现支持了巨噬细胞在 HS 微环境中糖酵解能力显著增强的假设。MCT1 在将巨噬细胞衍生的乳酸转移到成纤维细胞中以促进表型重塑方面发挥着关键作用。 图 3：巨噬细胞衍生的乳酸积累通过 MCT1 促进皮肤真皮成纤维细胞的表型重塑。 HS 患者的肌成纤维细胞中组蛋白乳酸化水平升高，H3K23Ia 水平特异性升高。 # 为了探究乳酸水平升高促进瘢痕形成的机制，我们检测了五对 HS 组织和 NS 组织中蛋白质的乳酸化水平。在 HS 组织中观察到整体/泛赖氨酸乳酸化（Pan Kla）水平较高（图 4A ）。值得注意的是，在组蛋白定位区域观察到一条明显的条带，这促使我们重点研究组蛋白乳酸化的改变。我们检测了几个先前已确定的组蛋白乳酸化位点，发现只有 H3K23la 水平在 HS 组织中显著升高（图 4B ）。然而，其他常见的 H3 和 H4 乳酸化位点，包括 H3K9la、H3K14la、H3K18la、H3K27la、H4K5la 和 H4K12la 的表达没有变化。此外，我们还发现，在不同浓度的乳酸钠（NaLac）处理下，H3K23la 水平呈明显的剂量依赖性增加（图 S6A ）。为了检测不同皮肤真皮细胞类型中组蛋白乳酸化（H3K23la）的变化，我们进行了 H3K23la 与血管内皮细胞（CD31）、巨噬细胞（CD68）和肌成纤维细胞（α-SMA）标志物抗体的免疫荧光共染色。大多数细胞均显示 H3K23la 荧光（图 4C-H ），且在 NS 和 HS 组织中，血管内皮细胞或巨噬细胞的 H3K23la 强度无明显差异（图 4C-F ）。相反，与 HS 组织或 NS 组织中的肌成纤维细胞相比，HS 组织中的肌成纤维细胞的 H3K23la 信号强度显著升高（图 4G 、 H ）。 我们从 HS 组织中分离出肌成纤维细胞，随后使用针对 Pan Kla 和 H3K23la 的抗体进行 Western blotting 分析，结果显示，与 NSFs 相比，HSFs 中 Pan Kla 和 H3K23la 的表达显著上调（图 4I ）。这些结果表明，H3K23la 是 HS 组织肌成纤维细胞中受影响最大的组蛋白乳酸化修饰。 图 4：HS 中肌成纤维细胞的组蛋白乳酸化增加，H3K23la 水平特异性升高。 MCT1 和 P300 是 HSF 中组蛋白乳酸化的潜在调节因子和修饰因子。 # 先前的研究表明，MCT1 促进巨噬细胞来源的乳酸向成纤维细胞的转运，从而促进其在 HS 微环境中分化为肌成纤维细胞。为了探究 MCT1 对组蛋白乳酸化的调控作用，我们对 HSF 细胞进行了 MCT1 敲低（si-MCT1）处理。图 S7A 和 S7B 显示，si-MCT1-1 的敲低效率最高。因此，我们选择 si-MCT1-1 进行后续实验。通过 Western blotting 和免疫荧光染色检测纤维化标志物（COL1A1、COL3A1 和α-SMA）以及组蛋白乳酸化 H3K23la，结果显示 MCT1 沉默可减轻 HSF 细胞的纤维化程度并降低 H3K23la 水平（图 S7C 和 S7D ）。此外，在 HSF 细胞中沉默 MCT1 基因导致细胞增殖显著减少，这可通过 Ki-67 免疫荧光染色观察到（图 S7E ）。划痕实验和 Transwell 迁移实验表明，沉默 MCT1 基因也显著抑制了 HSF 细胞的迁移（图 S7F ）。这些结果提示，MCT1 作为组蛋白乳酸化的潜在调节因子，促进了 HS 中成纤维细胞的表型重塑。 P300 是一种组蛋白乙酰转移酶，也是参与染色质重塑和基因调控的转录共激活因子 [^34] 。近期研究表明，P300 可能还调控组蛋白乳酸化 [^35] 。然而，其在 HS 进展中的作用仍未得到充分研究。我们在 HSF 细胞中进行了 P300 敲低（si-P300）处理，并筛选出敲低效率更高的 si-P300-1（图 S8A 和 S8B ）。si-P300 处理后，纤维化标志物和组蛋白乳酸化 H3K23la 的表达均显著降低（图 S8C 和 S8D ）。此外，P300 沉默后，细胞增殖和迁移能力也减弱（图 S8E 和 S8F ）。这些结果表明，P300 作为组蛋白乳酸化的潜在调控因子，可能促进 HS 中成纤维细胞的进展。 H3K23la 激活 HS 中的 HEY2 和 COL11A1 转录。 # 组蛋白翻译后修饰的表观遗传调控控制着靶基因的转录激活和抑制 [^36] 。为了研究 H3K23la 在 HS 病理生物学中的功能相关性，我们利用 H3K23la 特异性抗体进行了全基因组 CUT\u0026Tag 分析。比较分析显示，与 NS 对照组相比，HS 组织中 H3K23la 峰显著富集（图 5A ）。HS 组共检测到 16,860 个差异表达的 H3K23la 峰，其中 18.69%位于启动子区域。具体而言，HS 组织中 7424 个上调峰占启动子序列的 25.26%（图 5B ）。与 NS 组织相比，HS 组织在启动子区域内检测到 2313 个上调和 49 个下调的乳酸化峰（图 5C ）。对 HS 特异性启动子相关峰进行 GO 和 KEGG 通路富集分析，发现其与碳水化合物衍生物生物合成过程、成纤维细胞迁移的正调控、含胶原蛋白的细胞外基质以及肥厚性瘢痕相关通路（如参与糖酵解和瘢痕形成的 TGF-β信号通路）存在显著关联（图 5D ）。我们还进行了 RNA-seq 分析，以筛选 mRNA 水平上受 H3K23la 调控的潜在靶基因。与 NS 组织相比，HS 组织中有 1515 个基因上调，1341 个基因下调（图 S9A ）。对上调差异表达基因（DEGs）进行富集分析，发现其通路与 CUT\u0026Tag 数据相似（图 5E ）。 这些研究结果表明，组蛋白乳化 H3K23la 乳化促进细胞外基质沉积和成纤维细胞活性相关的转录程序，以及 TGF-β 信号通路激活，这些都与 HS 的病理机制密切相关。 图 5：H3K23la 激活 HS 中的 HEY2 和 COL11A1 转录。 通过对 CUT\u0026Tag 和 RNA-seq 数据的基因集进行交集分析，我们鉴定出 21 个差异表达基因，这些基因在 HS 组中表现出 mRNA 水平显著升高，且启动子区域的 H3K23la 信号富集增强（log2 倍数变化≥2， P 值 \u003c0.05）（图 5F ）。鉴于 CUT\u0026Tag 和 RNA-seq 均富集于 TGF-β信号通路和含胶原蛋白的细胞外基质，我们重点关注了极有可能参与瘢痕形成的基因： HEY2 和 COL11A1 。值得注意的是，HEY2 是一种与 Notch 信号通路密切相关的转录因子，主要通过抑制下游靶基因来调控心血管系统发育、器官发生和细胞分化 [^37] [^38] 。 COL11A1 是一种细胞外基质蛋白，它通过促进癌细胞增殖、血管生成和耐药性等机制在多种癌症中发挥作用，并且与癌相关成纤维细胞的活化密切相关 [^39] [^40] 。此外，COL11A1 可能与瘢痕疙瘩的形成有关 [^41] 。因此，我们决定研究这两个基因。 具体而言，在 HEY2 和 COL11A1 基因的候选基因组位点上鉴定出的峰值显示，这些基因启动子区域的 H3K23la 水平升高（图 5G ）。ChIP-qPCR 分析进一步证实，与 NS 组相比，HS 组中 HEY2 和 COL11A1 启动子区域的组蛋白乳酸化 H3K23la 富集（图 5H ）。与此一致的是，RT-qPCR 和 Western blotting 分析显示，HS 组织中 HEY2 和 COL11A1 的 mRNA 和蛋白表达水平显著升高（图 5I 、 J ）。IHC 分析也显示 HS 组织中 HEY2 和 COL11A1 的表达显著增加（图 5K ）。此外，H3K23la 与 HEY2 或 H3K23la 与 COL11A1 之间的免疫荧光分析显示，与 NS 组织相比，HS 组织样本中二者的共定位显著上调（图 S9B 和 S9C ）。这些结果共同表明，H3K23la 介导的 HEY2 和 COL11A1 的表观遗传上调参与了 HS 的进展。 HEY2 和 COL11A1 的高表达水平与成纤维细胞的表型重塑有关。 # 为了研究 HEY2 和 COL11A1 在化脓性汗腺炎（HS）进展中的作用，我们检测了它们在成纤维细胞中的表达。与正常成纤维细胞（NSF）相比，HS 成纤维细胞中 HEY2 和 COL11A1 的转录水平显著升高（图 S10A ）。针对 HEY2 和 COL11A1 与α-SMA 的免疫荧光双重染色显示，HEY2 和 COL11A1 的上调特异性地共定位于 HS 真皮肌成纤维细胞（图 6A 、 B ），这与先前在 HS 真皮肌成纤维细胞中检测到的 H3K23la 水平升高相一致（图 4I 、 S9B 和 S9C ）。这些结果支持 HEY2 和 COL11A1 主要在 HS 肌成纤维细胞中高表达的观点。 图 6：HEY2 和 COL11A1 的高水平与成纤维细胞的表型重塑有关。 为了评估 HEY2 和 COL11A1 在 HS 中的功能，我们利用 siRNA 转染技术敲低了 HSF 细胞中 HEY2 或 COL11A1 的表达。我们筛选出敲低效率最高的 siRNA（si-HEY2-1 和 si-COL11A1-3）用于后续实验（图 S10B - S10E ）。与对照组相比，敲低 HEY2 或 COL11A1 均显著降低了 HSF 细胞中纤维化标志物（COL1A1、COL3A1 和α-SMA）的表达（图 6C 、 D ）。免疫荧光结果也显示出一致的表达模式（图 6E 、 F ）。此外，敲低 HEY2 或 COL11A1 还降低了 HSF 细胞的迁移和增殖能力（图 6G、H 、 S10F 和 S10G ）。这些研究结果表明，HEY2 和 COL11A1 在 HS 中成纤维细胞的表型转变中起着关键作用，抑制它们可以逆转这种现象。 HEY2 通过上调 YAP1 表达促进成纤维细胞表型重塑 # 为了探究增生性瘢痕（HS）中 HEY2 高表达的潜在机制，我们检索了 GTEx、FIMO、JASPAR 和 GTRD 数据库，寻找可能受转录因子 HEY2 调控的基因。结果鉴定出六个候选基因：SDK1、KLHDC4、HERC1、YAP1、TMEM204 和 CDK5R1（图 7A ）。Yes 相关蛋白 1（YAP1）是 Hippo 信号通路的关键效应因子，可促进增生性瘢痕中成纤维细胞的增殖、迁移和细胞外基质（ECM）的过度生成 [^42] 。此外，我们发现 HS 组织中 YAP1 的表达显著高于正常组织（图 7B ），GTEx 数据分析显示 HEY2 和 YAP1 的 mRNA 水平呈正相关（图 7C ）。我们利用 JASPAR 数据库预测了 YAP1 启动子中潜在的 HEY2 结合位点。该基因组片段中存在三个预测的结合位点（图 7D ）。随后，我们进行了 ChIP-qPCR 实验，以验证 HEY2 与 HS 中 YAP1 启动子区域的结合（图 7E ）。YAP1 可与 SMAD 通路相互作用，放大促纤维化信号，提示其可能作为治疗 HS 的潜在靶点 [^43] [^44] 。敲低 HEY2 导致 YAP1、SMAD2 和 P-SMAD2 的表达显著降低（图 7F ）。在 HSF 细胞中，SMAD2 或 P-SMAD2 与α-SMA 的免疫荧光共染色显示，HEY2 沉默后，纤维化标志物和 SMAD2 通路的荧光强度均降低（图 7G 、 H ）。这些结果表明，HEY2 通过与 YAP1 启动子相互作用增加 YAP1 的转录，并通过 YAP1/SMAD2 通路促进 HS 中的瘢痕形成。 图 7：HEY2 通过上调 YAP1 表达促进成纤维细胞表型重塑。 COL11A1 通过与 MCT1 结合加剧成纤维细胞中乳酸的积累。 # 为了阐明 COL11A1 如何促进纤维化并参与 HS 中成纤维细胞的表型重塑，我们利用 BioGRID 数据库查找了与 COL11A1 相互作用的蛋白质。图 8A 显示有 22 种蛋白质与 COL11A1 相互作用，其中包括 SLC16A1，也称为 MCT1 [^45] 。为了验证这种相互作用，我们进行了共免疫沉淀（Co-IP）实验，结果表明 COL11A1 和 MCT1 之间存在显著的相互作用（图 8B 、 C ）。我们还通过免疫荧光分析评估了它们在 NSF 和 HSF 中的共定位情况，结果显示，与 NSF 相比，HSF 细胞膜附近胞质区域中 COL11A1 和 MCT1 的共定位显著上调（图 8D ）。我们使用针对 COL11A1 和 MCT1 的抗体对 NS 和 HS 组织中的肌成纤维细胞（α-SMA）进行了共染色。在 HS 组织中，肌成纤维细胞显示出强烈的 COL11A1 和 MCT1 共定位信号（图 8E ）。虽然我们的免疫共沉淀（Co-IP）和免疫荧光数据证实了 COL11A1 和 MCT1 之间存在物理相互作用，但这种结合的功能后果尚不清楚。为了精确确定 COL11A1 结合如何调节 MCT1 的活性，我们进行了分子建模。通过使用 AutoDock Vina 软件进行计算模拟，我们鉴定了介导 COL11A1-MCT1 相互作用的关键氨基酸残基。具体而言，COL11A1 N 端结构域中的第 52、81 和 121 位残基与 MCT1 的第 160、303 和 315 位残基形成氢键（图 8F ）。然后，我们对 COL11A1 和 MCT1 之间预测的结合位点进行了突变（图 8G ）。 共免疫沉淀（Co-IP）实验表明，无论单独引入还是联合引入，TRIM34 结合位点（FLAG-COL11A1-MUT）或 UPF1 结合位点（His-MCT1-MUT）的突变均能有效阻碍 COL11A1 与 MCT1 的相互作用（图 8G ）。分子动力学模拟显示，与 MCT1 单体相比，COL11A1-MCT1 复合物的结构稳定性增强，这体现在更低的均方根偏差（RMSD）值上（图 S11A ）。均方根波动（RMSF）分析表明，复合物结合的 MCT1 的结构变异性降低，提示 COL11A1 介导了 MCT1 构象的稳定（图 S11B ）。 图 8：COL11A1 与 MCT1 结合，加剧成纤维细胞中乳酸的积累。 接下来，我们假设 COL11A1 可能通过与 MCT1 的相互作用来调节乳酸转运。基于图 8F 所示的 COL11A1-MCT1 复合物和 MCT1 蛋白的结构，我们引入乳酸作为小分子化合物进行分子对接。结果表明，无论 COL11A1 是否存在，乳酸均与 MCT1 残基 ARG-313（2.8/2.3 Å）和 SER-154（1.9 Å）形成保守的氢键（图 8H ）。三元复合物的动态模拟显示，与 MCT1-乳酸对相比，COL11A1-MCT1-乳酸体系具有更优异的结构稳定性，配体 RMSD 值更低（图 S11C ）。结合自由能计算表明，三元复合物中乳酸亲和力增强，这是由与 PHE-367、PRO-155、LEU-281 和 LEU-305 的相互作用增强所致（图 8I ；补充表 1 ）。为了验证这些结果，我们评估了在添加 10 mM 外源乳酸的条件下，COL11A1 蛋白对 HSF 细胞内乳酸水平的影响。结果显示 COL11A1 蛋白浓度与细胞内乳酸水平呈正相关，表明 COL11A1 可能促进细胞内乳酸的积累（图 S11D ）。鉴于组蛋白乳酸化依赖于乳酸的存在，并且考虑到我们发现 H3K23la 修饰促进 COL11A1 的表达，乳酸积累和 H3K23la 之间可能存在正反馈回路，从而传播我们在 HS 组织成纤维细胞中观察到的表型转换。 模拟结果为 COL11A1 如何增强 MCT1 的乳酸转运亲和力提供了结构和能量基础，从而形成闭合回路。 在 C57 雄性小鼠伤口模型中，成纤维细胞中 Mct1 特异性消融可加速伤口愈合并改善胶原沉积。 # 接下来，我们通过将 Mct1 f/f 小鼠与 Col1a2 CreERT 小鼠杂交，实现了小鼠成纤维细胞中 Mct1 的特异性敲除（图 9A ）。4 周龄小鼠连续 5 天腹腔注射 20 mg/kg 他莫昔芬。小鼠被分为四组： Mct1 fl/fl Col1a2 -cre - 组、 Mct1 fl/fl Col1a2 -cre - +NaLac 组、 Mct1 fl/fl Col1a2 -cre + 组和 Mct1 fl/fl Col1a2-cre + +NaLac 组。在第六周，我们在小鼠背部建立了全层皮肤缺损模型。在建模型当天，在缺损周围注射 100 µL NaLac（10 mM）。之后，每两天在焦痂下注射 100 µL NaLac。在伤后第 0、3、7、10 和 14 天进行了系统的照片记录（图 9A ）。如图 9B 所示，这些照片清晰地显示， Mct1 fl/fl Col1a2 -cre 小鼠的伤口愈合率高于 Mct1 fl/fl Col1a2 -cre 小鼠。正如预期的那样，乳酸钠（NaLac）治疗导致伤口愈合延迟（图 9B 、 C ）。接下来，在伤后 21 天采集组织样本进行组织学分析，我们在 Mct1 敲除小鼠的伤口中也很少观察到增生性瘢痕（图 9D ）。然而，在乳酸治疗条件下，这些增生性表型显著出现（图 9D 、 E ）。 组织学分析（H\u0026E 染色）显示， Mct1 基因敲除组的伤口皮肤结构更加有序，其特征为表皮发育良好，具有表皮嵴和毛囊再生迹象，真皮炎症细胞浸润较对照组减少。相反，对照组和 NaLac 处理组均表现出增生性瘢痕的特征，包括表皮增厚、扁平以及真皮结构紊乱（图 9D ）。Masson 染色显示，与 Mct1 fl/fl Col1a2 -cre 小鼠相比， Mct1 fl/fl Col1a2 -cre 小鼠的蓝色胶原沉积明显减少，胶原纤维排列更加平滑有序（图 9D ）。定量分析证实了这些观察结果，显示 Mct1 敲除组的胶原面积和分散指数显著降低，表明胶原排列更加有序（图 9E 和 S12A）。天狼星红染色结果也与此一致（图 9D ）。与对照组小鼠相比， Mct1 敲低小鼠的 I 型/III 型胶原比值降低（图 9D 、 G ）。同时，NaLac 处理导致胶原合成增强、胶原排列紊乱以及 I 型/III 型胶原比值升高，这在组织学分析中得到了显著体现（图 9D-G ）。这些数据表明， Mct1 敲低小鼠的组织修复表型从纤维化向更具再生性的表型转变。 此外，损伤后 21 天进行的免疫荧光染色分析表明， Mct1 fl/fl Col1a2 -cre 小鼠中α-SMA 和 H3K23la 的表达降低（图 9H ）。另外，Western blotting 结果显示，与 Mct1 fl/fl Col1a2 -cre 小鼠相比， Mct1 fl/fl Col1a2 -cre 小鼠瘢痕组织中纤维化标志物（Col1a1、Col3a1 和α-SMA）及其乳酸化修饰下游产物（Col11a1 和 Hey2）的水平显著降低（图 9I ）。这些结果表明，成纤维细胞特异性敲除 Mct1 可以抑制全层皮肤缺损模型中的瘢痕形成和成纤维细胞表型转化。此外，我们从 Mct1 fl/fl Col1a2 -cre 和 Mct1 fl/fl Col1a2 -cre 小鼠中分离出小鼠成纤维细胞。经 NaLac 处理的成纤维细胞中纤维化标志物和 H3K23la 的表达水平升高，而 Mct1 敲除成纤维细胞中这些标志物的表达水平降低（图 9J ）。为了进一步证实 Mct1 在 HS 进展中的作用，RT-qPCR 数据显示，与 Mct1 敲除成纤维细胞相比，经 NaLac 处理的成纤维细胞中促纤维化生物标志物（纤连蛋白、SPARC、POSTN、TNC、CD248 和 SMAD2）的 mRNA 表达也显著升高（图 S12B ）。总的来说，这些结果表明，乳酸和 MCT1 驱动的促纤维化信号创造了一种病理微环境，这种微环境同时损害了伤口愈合的速度，并驱动了肥厚性瘢痕特征的过度纤维化基因表达，这是由成纤维细胞中 H3K23la 水平升高介导的。 图 9：在 c57 雄性小鼠伤口模型中，成纤维细胞中 Mct1 特异性消融可加速伤口愈合并改善胶原沉积。 以药物抑制 MCT1 或清除巨噬细胞作为瘢痕治疗策略 # 为了进一步探究 MCT1 在瘢痕形成中的作用，将 6 周龄的 C57BL/6 成年小鼠随机分为四组：对照组、对照组+乳酸钠组、AZD3965 组和 AZD3965+乳酸钠组。在 6 周龄小鼠背部手术制造全层皮肤缺损。值得注意的是，与乳酸钠处理组相比，AZD3965 处理组显著加速了伤口愈合（图 10 A、 B ）。HE 染色、Masson 染色和天狼星红染色结果显示，在 AZD3965 处理后 21 天，乳酸钠处理组小鼠的胶原合成减少，胶原排列更加顺畅，I 型/III 型胶原比例降低（图 10C-F 和 S12C ）。此外，免疫荧光染色结果显示，AZD3956 处理的小鼠体内α-SMA 信号水平显著降低，而乳酸处理可逆转这一现象（图 10G ）。图 S4K 和 S4L 显示，在伤口愈合后期使用氯膦酸盐脂质体清除巨噬细胞可显著减少瘢痕形成过程中乳酸的分泌。为了验证体内巨噬细胞清除（从而减少乳酸来源）在瘢痕形成中的作用，我们在伤后第 21 天收集瘢痕组织，并进行了 H\u0026E 染色和 Masson 三色染色。结果表明，氯膦酸盐脂质体显著减少了小鼠背部伤口的瘢痕形成，并促进了毛囊再生，提示巨噬细胞在伤口愈合后期发挥着重要的病理作用（图 S12D-F ）。总的来说，通过 AZD3965 抑制 MCT1 或清除乳酸源可能是治疗增生性瘢痕的有效治疗策略。 图 10：MCT1 的药理学抑制作为瘢痕治疗策略。 讨论 # 我们的研究建立了代谢重编程和表观遗传调控在肥厚性瘢痕发病机制中的关联轴（图 10H ）。首先，我们通过鉴定机械应力下的巨噬细胞为乳酸的主要产生者，重新定义了成纤维细胞活化的上游触发因素。这种僵硬的微环境诱导巨噬细胞呈现高糖酵解表型，产生乳酸，并通过 MCT1 转运至成纤维细胞。MCT1 在肥厚性瘢痕组织中显著上调。其次，乳酸流入激活 H3K23I，进而激活促纤维化基因 HEY2 和 COL11A1。HEY2 通过 YAP1/SMAD2 放大纤维化信号，而 COL11A1 稳定 MCT1 以增强乳酸转运，形成一个自我强化的环路，从而持续促进纤维化。至关重要的是，通过成纤维细胞特异性敲除 Mct1 或药物抑制（AZD3965）靶向该通路，可减轻核心病理。这种干预措施带来了两个伴随的益处：加速伤口愈合（可能反映了促纤维化炎症期的更快消退）以及减少决定瘢痕质量的过度胶原沉积。这项研究提供的证据表明，巨噬细胞来源的乳酸通过 MCT1 依赖的组蛋白乳化作用促进化脓性汗腺炎（HS）的进展，从而将乳酸重新定义为一种代谢-表观遗传介质，而非被动的副产物。这些发现将 MCT1 定位为治疗靶点，并确立了组蛋白乳化作用作为 HS 进展的表观遗传驱动因素的地位。 增生性瘢痕（HS）是一种常见的创伤/手术后并发症，给皮肤外科的临床治疗带来了巨大的挑战。目前针对增生性瘢痕的治疗方法进展缓慢。代谢紊乱是纤维化进展的危险因素。支持细胞增殖和细胞过程的细胞代谢重编程是纤维化的关键特征 [^26] [^46] [^47] 。然而，针对 HS 代谢的研究有限，大多数研究集中于瘢痕疙瘩的病理生理学。有证据表明，瘢痕疙瘩成纤维细胞（KFs）在缺氧条件下上调糖酵解基因，从氧化磷酸化转向有氧糖酵解 [^28] ，表现出类似癌症的生物能量学特征，伴有乳酸过度生成 [^48] 。因此，靶向 KF 代谢重编程代表了一种新兴的瘢痕疙瘩治疗策略 [^49] [^50] 。此外，最近的研究表明，乳酸可以通过 H3K18Ia 促进瘢痕疙瘩成纤维细胞的胶原蛋白表达、增殖和迁移 [^51] 。值得注意的是，HSF 细胞未表现出糖酵解活性升高 [^52] ，这与我们的研究结果一致。我们采用的综合代谢组学方法阐明了 HS 的代谢图谱。非靶向分析提供了广泛的概览，而靶向能量代谢组学则能够精确量化糖酵解中间体。对上调最显著的代谢物进行关键性评估对于识别致病驱动因素至关重要。我们排除了 N-去甲基氨基比林作为药理学假象的可能性。在内源性代谢物中，虽然 GTP 和 DL-甘油酸显著上调——反映了增殖成纤维细胞生物合成需求的增加——但我们优先研究了乳酸的机制。 尽管皮肤由多种细胞组成，但我们的系统分析表明巨噬细胞是乳酸的主要来源。在高硬度条件下，巨噬细胞表现出独特的代谢重编程，提示化脓性汗腺炎（HS）和瘢痕疙瘩的致病机制存在差异。我们进一步拓展了这一范式，证实基质硬度驱动巨噬细胞（而非成纤维细胞）的糖酵解激活。Piezo 1 敲除巨噬细胞表现出炎症减轻和愈合增强，证实了纤维化过程中的机械代谢适应 [^53] 。硬度激活的巨噬细胞主导了乳酸的产生，并将机械信号转化为代谢输出。虽然脂肪细胞是皮肤基质的关键组成部分，但由于空间限制，它们对 HS 中乳酸池的贡献被认为较小；在化脓性汗腺炎（HS）中，显著增厚的网状真皮形成一道物理屏障，将纤维化核心与皮下脂肪层分隔开来 [^2] ，限制了脂肪细胞来源的旁分泌代谢信号到达真皮成纤维细胞的可能性。此外，我们的补充数据证实，血管内皮细胞和其他驻留免疫细胞，例如肥大细胞和 T 细胞，并未表现出巨噬细胞中观察到的显著糖酵解上调。这种富含乳酸的微环境通过 H3K23Ia 对成纤维细胞进行表观遗传重编程，激活纤维化基因的转录。MCT1 抑制剂破坏了这种相互作用，揭示了其乳酸转运/表观遗传调控的双重作用，这一作用此前已被证实与癌症相关，并参与纤维化过程。因此，我们的数据将巨噬细胞-成纤维细胞相互作用重新定义为机械代谢-表观遗传回路，而该回路是 HS 病理的核心。 有氧糖酵解，通常被称为瓦博格效应，其特征是即使在氧气充足的情况下，能量仍然优先通过糖酵解产生，从而导致大量乳酸的生成 [^54] 。尽管传统上乳酸被认为是糖酵解的代谢废物，但 Zhang 等人提供的证据表明，乳酸有可能通过乳酸化修饰组蛋白赖氨酸残基，从而发挥表观遗传调控作用 [^22] 。乳酸在糖酵解基因的启动子区域富集，并通过增强糖酵解活性加剧阿尔茨海默病中的小胶质细胞功能障碍 [^55] 。我们的研究检测到热休克（HS）微环境中存在乳酸积累，为组蛋白乳酸化提供了底物。我们现在进一步证实，这种乳酸积累源于明显的代谢转变，即糖酵解的上调与氧化磷酸化的下调同时发生。我们还发现，独特的乳酸化修饰 H3K23la 在体外和体内均能促进 HS 模型中成纤维细胞的表型重塑，从而确立了乳酸化作为纤维化特异性调控点的地位。这一代谢-表观遗传回路为 HS 中纤维化表型的维持和放大提供了令人信服的解释，有效地将成纤维细胞“锁定”在促纤维化状态，并驱动疾病的持续发展。近期研究表明，与 NS 相比，HS 组织中 H3K18la 的表达升高，这可能归因于 HS 组织的高度异质性 [^56] 。鉴于有报道指出 HS 具有自限性，从不同解剖部位和不同时间点采集的组织样本之间存在固有的变异性 [^2] 。 然而，我们的 HS 样本主要采集自四肢，且严格限定在损伤后 3-6 个月内，对应于肥厚性瘢痕发展的增殖期，这在一定程度上减轻了样本异质性的影响。MCT1 具有浓度依赖性、ATP 非依赖性、可饱和性、立体特异性，可被其他单羧酸盐竞争性抑制，对温度敏感，并受[H + ]梯度刺激。MCT1 转运的乳酸在促进骨骼肌线粒体生物合成和增强三羧酸循环（TCA 循环）中发挥积极作用 6。我们的研究表明，HS 肌成纤维细胞中 MCT1 表达上调，促进乳酸向成纤维细胞的转运，进而促进成纤维细胞表型重塑。此外，我们还发现 P300 作为潜在的组蛋白乳酸化酶参与调控 HS 中的组蛋白乳酸化。所有这些结果表明，乳酸化参与了 HS 的发生发展。 研究表明，HEY2 通过抑制脂肪酸氧化和促进 ROS 介导的氧化应激来加速心力衰竭，表明其在细胞线粒体呼吸和能量代谢中发挥重要作用 [^38] 。然而，我们的数据表明，肥厚性瘢痕组织中 H3K23Ia 的乳酸化修饰可刺激 HEY2 的表达。虽然 HEY2 是一种重要的转录抑制因子，但后续的数据库筛选发现，HEY2 可诱导 YAP1 的表达，而 YAP1 反过来又通过 SMAD2 促进成纤维细胞的表型转变。我们发现组蛋白乳酸化可以调控肥厚性瘢痕中的 YAP1/SMAD2 通路。此外，多项研究表明，COL11A1 是肿瘤微环境中重要的促转移分子和生物标志物 [^40] [^58] [^59] 。COL11A1 可通过细胞外信号通路调控癌症相关成纤维细胞的表型转变 [^60] 。在化脓性汗腺炎（HS）中，COL11A1 的选择性上调独立于其异源三聚体伴侣 COL11A2 和 COL2A1 [^40] ，是由代谢-表观遗传相互作用驱动的。每个 α 链的基因均受独立的转录调控。具体而言，富含乳酸的 HS 微环境促进 COL11A1 启动子处 H3K23la 的富集，从而选择性地激活其转录。此外，COL11A1 蛋白通过与乳酸转运蛋白 MCT1 直接相互作用而发挥非经典功能。分子建模显示，这种相互作用可稳定 MCT1 并增强其对乳酸的亲和力，从而增强乳酸转运。这建立了一个致病性的、自我增强的正反馈回路（乳酸-H3K23la-COL11A1-MCT1），从而维持瘢痕微环境的稳定。 这些结果与新兴证据相符，这些证据表明正反馈网络参与了纤维化进展，并将纤维化疾病重新定义为由初始扰动引发的自我增强级联反应，而非线性逐步序列 [^55] 。此外，虽然我们的共免疫沉淀和计算数据支持 COL11A1 和 MCT1 之间的相互作用，但必须考虑其他可能介导或稳定细胞环境中该复合物的蛋白质的潜在参与。分子伴侣蛋白 CD147 是一个主要候选者，它对于 MCT1 的膜定位和功能稳定性至关重要 [^18] 。因此，我们假设 COL11A1 与 CD147 和 MCT1 形成三元复合物。该复合物可以锚定乳酸转运蛋白，增强其活性，从而放大促纤维化信号。 总的来说，代谢转录研究突显了 HS 发病机制的多方面性质，同时揭示了多个可作为治疗干预靶点的点。 我们在化脓性汗腺炎（HS）发病机制方面的研究结果表明，基质硬化和乳酸生成之间存在一种自我增强的“机械代谢恶性循环”，而非简单的线性因果关系。我们假设，包括炎症和细胞外基质（ECM）沉积在内的初始伤口愈合过程会使组织微环境硬化 [^1] 。体外和体内实验均证实，这种机械信号会触发巨噬细胞的代谢转变，使其糖酵解增强并分泌乳酸。随后，成纤维细胞通过 MCT1 摄取巨噬细胞来源的乳酸，引发 H3K23Ia 依赖的病理激活和 ECM 过度生成。这不仅加剧了纤维化，而且进一步硬化了基质，形成了一个驱动 HS 形成的正反馈回路。至关重要的是，我们的研究将这一放大回路确定为一个治疗靶点。MCT1 的药理学抑制验证了这一概念，有效加速了伤口愈合并减轻了瘢痕形成。这表明，即使在初始损伤之后，通过治疗手段阻断这种乳酸驱动的机械代谢相互作用，也能引导修复过程远离病理性纤维化。尽管这种策略逆转已形成的慢性瘢痕的潜力仍是未来研究的关键领域，因为我们目前的研究主要集中在瘢痕的增殖期。 本研究的局限性 。虽然我们的研究揭示了糖酵解-MCT1-H3K23la-HEY2/COL11A1 轴在 HS 进展中的作用，但仍存在三个主要局限性。首先，由于组蛋白修饰的复杂性和动态性，以及单核苷酸突变难以对其产生影响，因此建立 H3K23la 沉积与 HS 进展之间的直接因果关系仍然具有挑战性——这是研究组蛋白翻译后修饰在疾病发病机制中作用的固有局限性。其次，我们采用 PDMS 水凝胶涂层板构建的体外基质刚度模型仅能部分模拟纤维化微环境，无法复制体内观察到的多细胞相互作用和细胞因子梯度。未来的研究应采用类器官系统或三维细胞培养平台，以更好地模拟瘢痕组织的复杂性。第三，虽然我们的鼠类全层切除伤口模型部分重现了肥厚性瘢痕的晚期形成，但不同物种间的愈合机制仍然存在差异：含有皮下肉膜的鼠类真皮通过再生过程促进收缩性愈合。然而，本研究的主要体内目标是阐明成纤维细胞表达的 Mct1 在纤维化愈合过程中的具体遗传功能。这需要一个能够进行条件性基因敲除的基因敲除模型，而小鼠是目前最成熟且最可行的模型。我们选择夹板固定伤口模型作为研究这一特定分子机制的最佳工具，同时也认识到，未来在更接近人类皮肤的大型动物模型中进行验证将是十分有价值的下一步。 方法 # 人类受试者 # 本研究从空军军医大学西京医院烧伤皮肤外科诊断为增生性瘢痕的患者中获取术后丢弃的增生性瘢痕组织，同时收集年龄匹配的非增生性瘢痕患者的正常皮肤样本。收集的组织样本立即进行修剪，并浸入固定液（4%多聚甲醛，Servicebio，G1101）或快速液氮冷冻保存，随后储存于-80℃冰箱中以备后续处理。除问卷调查外，所有参与者均根据病史、实验室检查和体格检查进行筛选。共收集了 10 份增生性瘢痕组织样本和 15 份年龄匹配的正常对照皮肤样本。性别未作为研究设计和分析的特定变量。所有参与者均签署了知情同意书，且未获得任何经济补偿。本研究已获得空军军医大学西京医院医学伦理委员会的批准（KY20252080-C-1）。补充表 2 中列出了患有增生性瘢痕的个体和对照组的受试者基线特征。 动物模型 # 本研究中使用的所有雄性小鼠均为 C57BL/6 背景。Mct1 f/f 小鼠由中国科学院上海营养与健康研究所陈岩教授惠赠， Col1a2 -creERT 小鼠购自武汉舒来宝生物技术有限公司（武汉）。Col1a2 -creERT 小鼠通过与 C57BL/6 小鼠杂交维持半合子状态。为获得 Mct1 fl/fl Col1a2 -cre 2 小鼠，将 Mct1 f/f 小鼠与 Col1a2 -creERT 小鼠杂交，得到两组小鼠（ Mct1 fl/fl Col1a2 -cre5 和 Mct1 fl/fl Col1a2 -cre7）。小鼠基因型通过对尾部活检提取的 DNA 进行 PCR 扩增进行确认。其他 6-8 周龄的 C57BL/6 小鼠购自空军军医大学动物中心（西安）。所有小鼠均饲养于温度为 18 ± 3 °C、光照/黑暗周期为 12 小时、相对湿度为 50 ± 5% 的过滤无病原体环境中。研究期间，小鼠可自由摄取食物和水。所有动物手术均采用异氟烷吸入麻醉，异氟烷浓度为 1–2%，氧气流量为 3 L/min −1 。 利用他莫昔芬（Sigma-Aldrich，T5648）诱导小鼠成纤维细胞中 Mct1 特异性敲除。简而言之，将他莫昔芬溶解于玉米油（Sigma-Aldrich，C8267）中，最终浓度为 20 mg/ml。为了消除成纤维细胞中的 Mct1 ，连续 5 天腹腔注射 20 mg/kg 他莫昔芬给 4 周龄小鼠。第六周，用 2%异氟烷麻醉小鼠后，在耳下约 2 cm 处剃除背部毛发。次日，将一个半透明的单面硅胶环（外径：14 mm，内径：10 mm，厚度：0.6 mm）牢固地固定在无毛背部区域的中线上。随后，使用无菌手术刀沿硅胶环内周缘制作一个全层圆形伤口。对于乳酸处理组，将乳酸钠（Sigma-Aldrich，L7022）溶解于无菌水中，配制成 10 mM 的浓度。在模型建立当天，于伤口周围注射 100 µL。之后每两天在焦痂下注射 100 µL。为了研究 MCT1 药理学抑制的抗纤维化作用，将 6 至 8 周龄的 C57BL/6 小鼠随机分为四组（对照组、对照组+乳酸钠组、AZD3965 组和 AZD3965+乳酸钠组）。将 AZD3965 配制成 0.5%羟丙基甲基纤维素（Sigma-Aldrich，H7509）和 0.1%吐温 80（Servicebio，GC204001）的溶液，剂量为 100 mg/kg，每日两次（BID）通过灌胃给药，持续 21 天。为了确定体内瘢痕微环境中乳酸的来源，将 6 至 8 周龄的 C57BL/6 小鼠随机分为三组（对照组、氯膦酸脂质体组和 Nalac 组）。 从伤后第 7 天开始，每隔 3 天向焦痂下注射 40 µL 氯膦酸脂质体（Yeasen，40337ES），溶液浓度为 50 μg/ml [^61] 。分别于伤后第 0、3、7、10 和 14 天进行系统性拍照记录。第 21 天采集组织样本，用于后续的蛋白质提取和组织病理学分析，以便进行全面的生化评估。所有小鼠实验均按照美国空军医科大学机构动物护理和使用委员会（20250030）的指导原则进行。 从人正常皮肤和增生性瘢痕中分离和培养真皮成纤维细胞 # 临床采集正常皮肤组织和增生性瘢痕组织后，立即转移至无菌操作台。组织用预冷的 PBS 缓冲液冲洗三次。将组织修剪成细长条状，然后用溶于 PBS 的 1%青霉素-链霉素溶液（Gibco，15140122）洗涤三次。将正常皮肤组织置于 4℃摇床上，在 2.5%无菌 Dispase II 溶液（Sigma-Aldrich，D4693，溶于 DMEM 基础培养基（Gibco，11885500））中孵育过夜（14-18 小时）。次日，用镊子轻轻分离表皮和真皮。而瘢痕组织则可直接用剪刀分离成真皮和表皮，无需在 2.5% Dispase II 溶液中孵育。两种类型的真皮组织均被切碎成乳糜组织块，然后用移液器均匀接种到 25 cm²的培养瓶中，每个组织块大小约为 0.3 × 0.3 cm。组织块在 37 °C、5% CO₂条件下培养 6-8 小时，之后加入 2 ml 完全培养基（DMEM 基础培养基+10% FBS（Vazyme Biotech，F103））。每两天更换一次培养基。当观察到组织块周围有梭形融合的成纤维细胞时，进行细胞传代。后续实验使用第三至第六代成纤维细胞。 从 Mct1 fl/fl Col1a2-cre + 和 Mct1 fl/fl Col1a2-cre - 小鼠皮肤中分离和培养真皮成纤维细胞 # 新生小鼠（出生后 1-2 天）麻醉后浸入 75%乙醇中 5 分钟。迅速分离皮肤，置于含 1%青霉素-链霉素的 PBS 溶液中，冲洗三次。将皮肤组织置于 2.5%无菌 Dispase II 溶液（65 mg Dispase II + 26 ml DMEM 基础培养基）中，在 4℃摇床上孵育过夜（10-16 小时）。次日，用镊子分离表皮和真皮，并将真皮组织切碎成乳糜状混合物。配制等体积的含 1% I 型胶原酶（Sigma-Aldrich，SCR103）的 DMEM 基础培养基，与真皮组织混合，然后在 37℃摇床上进行酶消化。反应 1 小时后，加入等体积的完全培养基（含 10%胎牛血清）中和反应。混合物依次通过 100 μm 和 70 μm 滤膜过滤。200 g 离心 5 分钟后，将原代小鼠真皮成纤维细胞接种于培养瓶中，并在 37 °C、5% CO₂条件下培养。后续实验使用第三至第六代成纤维细胞。对于 Mct1 基因敲除，在培养基中加入 0.5 μM 4-羟基他莫昔芬（MedChemExpress，HY-16950），培养 3 天后，用乳酸钠（Sigma-Aldrich，L7022）处理。用乳酸钠（10 mM）或溶剂（PBS）处理 24 小时后，收集成纤维细胞用于后续实验。 利用磁激活细胞分选（MACS）分离原代巨噬细胞、血管内皮细胞和真皮成纤维细胞 # 根据制造商的说明，使用磁分离（MACS）技术（Miltenyi Biotec）从小鼠瘢痕组织中分离出原代巨噬细胞、血管内皮细胞和真皮成纤维细胞。简而言之，用 PBS 清洗人皮肤组织样本。用手术刀刮除皮下脂肪后，使用全皮肤组织解离试剂盒（Miltenyi Biotec，130-101-540）解离组织。CD68 阳性巨噬细胞用 PE 标记的小鼠抗人 CD68 抗体（BD Biosciences，556078）标记。CD31 阳性血管内皮细胞用 PE 标记的小鼠抗人 CD31 抗体（BD Biosciences，566125）标记。波形蛋白阳性真皮成纤维细胞用 PE 标记的小鼠抗人波形蛋白抗体（BD Biosciences，562337）标记。将细胞与抗 R-藻红蛋白（PE）磁性颗粒（BD Biosciences，557899）混合后，使用 MACS 柱（Miltenyi Biotec，130-021-101）分离细胞，并在 4℃下以 400 g 离心 5 分钟。弃去上清液，保留分离的原代细胞以备后续使用。 PDMS 水凝胶涂层板 # 采用方案 [^62] 制备了不同刚度的 PDMS 水凝胶。这些硅介电凝胶使用道康宁 Sylgard 527（A 组分和 B 组分，Ellsworth Adhesives，527 SIL DIELECT GEL）制备。A 组分和 B 组分按特定体积比混合，以获得所需的力学性能。对于 2 kPa 的凝胶，A:B 比例为 1.2:1；而对于 50 kPa 的凝胶，A:B 比例为 0.3:1。将水凝胶涂覆于细胞培养板上，并在 60 °C 下孵育 16-18 小时。对于 6 孔板，每个孔加入 2 mL 凝胶；对于 24 孔板，每个孔加入 0.4 mL 凝胶。 24 小时后，将凝胶与纤连蛋白（1 μg/mL PBS，Sigma-Aldrich，F2006）在 37 °C 下进行 4 小时的功能化，随后用无菌 PBS 冲洗。 细胞培养和治疗 # 人源细胞系 THP-1 和 HUVEC 购自 Procell Life Science \u0026 Technology 公司。THP-1 细胞培养于 RPMI 1640 培养基（Gibco，11875500），HUVEC 细胞培养于 DMEM 基础低糖培养基（Gibco，11885500），并添加 10%胎牛血清（FBS，Vazyme Biotech，F103）和 1%青霉素/链霉素（Gibco，15140122）。NSF、HSF 和鼠皮肤真皮成纤维细胞培养于 DMEM 基础低糖培养基（Gibco，11885500），并添加 10%胎牛血清（FBS，Vazyme Biotech，F103）和 1%青霉素/链霉素（Gibco，15140122）。在高基质刚度培养条件下，将细胞接种于 PDMS 水凝胶包被的培养板上。贴壁培养 24 小时后，收集上清液，或进行后续实验。为验证巨噬细胞来源的乳酸是否通过 MCT1 乳酸转运通道进入成纤维细胞，将分别在 2 kPa 和 50 kPa 条件下培养 24 小时的 THP-1 细胞和 HUVEC 细胞的上清液与 DMEM 完全培养基（含 10% FBS 的 DMEM 基础培养基）按 1:1 比例混合，以刺激神经干细胞（NSFs）。在各处理组中加入 AZD3965（100 nM）。在收集上清液前 24 小时，用乳酸生成抑制剂草酸甲酯（10 mM）预处理 THP-1 细胞和 HUVEC 细胞。 THP-1 细胞和 HUVECs 细胞预先用 TGF-β（10 ng/ml，Proteintech，HZ-1011）处理 24 小时。选择该浓度是因为文献中已证实该浓度可有效诱导体外增生性瘢痕和纤维化模型中的纤维化反应 [^63] [^64] 。所有药物在处理前均进行 pH 中和。 组蛋白提取 # 组蛋白通过标准化的酸提取方案从组织或细胞中分离 [^65] 。简而言之，收集组织或细胞样品，并将其重悬于添加了蛋白酶抑制剂的裂解缓冲液（10 mM Tris-HCl、1 mM KCl、1.5 mM MgCl₂ 和 1 mM DTT，pH 8.0）中，用于核提取。随后，将分离的细胞核重悬于酸性提取缓冲液（0.2 M H₂SO₄）中，并在 4 °C 下孵育过夜。提取组蛋白后，在 4 °C 下以 16,000 × g 离心 10 分钟。收集上清液，并在冰上用三氯乙酸（TCA，Sigma-Aldrich，T8657）沉淀组蛋白，使其最终浓度达到 35%。经过充分洗涤和干燥后，将组蛋白沉淀物重悬于去离子水中，并使用 Pierce Rapid Gold BCA 蛋白测定试剂盒（Thermo Scientific，A53225）测定样品浓度。将组蛋白上样至 15% SDS-PAGE 凝胶，并进行 Western blot 分析。 蛋白质印迹法 # 用含 PMSF（碧云天，ST506）的 RIPA 裂解缓冲液（NCM Biotech，WB3100）裂解皮肤组织或细胞。使用 Pierce Rapid Gold BCA 蛋白测定试剂盒（Thermo Scientific，A53225）测定裂解液的蛋白浓度，并调整至相同终浓度。变性蛋白经 SDS-PAGE 电泳分离后，转移至 PVDF 膜（Millipore，IPVH00010）。室温下用 5%牛血清白蛋白（BSA，碧云天，ST506）封闭 1 小时后，将膜与一抗于 4℃孵育过夜，然后用 TBST 洗涤 3 次，最后与辣根过氧化物酶（HRP）标记的二抗于室温孵育 1 小时。随后使用 SuperFemto ECL Master Mix（Vazyme Biotech，E433）检测免疫反应蛋白，并使用 ChemiDoc 成像系统（BIO-RAD，美国）进行显影。通过 β-肌动蛋白和组蛋白 3 的免疫印迹实验验证了蛋白上样量的一致性。免疫印迹分析中使用的所有抗体均列于补充表 3 中。 蛋白质共免疫沉淀 # 对于蛋白质共免疫沉淀 (Co-IP) 实验，收集细胞并用含有 PMSF（碧云天，ST506）的 IP 裂解缓冲液（Pierce Classic Magnetic IP/Co-IP Kit，Thermo Scientific，88804）裂解。14,000 × g 离心 10 分钟后，收集上清液，并与 5 μg 靶抗体或 IgG 在 4 °C 下孵育过夜。加入 Protein A/G 磁珠（Pierce Classic Magnetic IP/Co-IP Kit，Thermo Scientific，88804），在 4 °C 摇床上孵育 4 小时。用 Co-IP 洗涤缓冲液洗涤免疫沉淀的蛋白质复合物，并重悬于蛋白质上样缓冲液中。最后，通过 SDS-PAGE 分离免疫沉淀的蛋白质，并通过免疫印迹进行分析。质粒构建、蛋白质表达和蛋白质纯化由上海生工生物工程股份有限公司 (Sangon Biotech, Shanghai, China) 完成。 Co-IP 分析中使用的所有抗体均列于补充表 3 中。 RNA 分离和 qRT-PCR 检测 # 所有引物均由上海生工生物工程股份有限公司（Sangon Biotech，中国上海）设计、合成并经 PAGE 纯化。使用 Trizol 试剂（Invitrogen，15596018）提取总 RNA，取 500 ng RNA 使用 PrimeScript RT Master Mix（Takara，RR036A）反转录为 cDNA。使用 TB Green Premix Ex Taq II（Takara，RR820A）和 CFX96 实时荧光定量 PCR 仪（BIO-RAD，美国）对 cDNA 进行 qRT-PCR 分析。反应程序为：95℃预变性 10 min，95℃变性 15 s，60℃退火 1 min，然后进行 40 个循环的熔解曲线分析。目标 mRNA 的表达水平以β-肌动蛋白（β-Actin）的表达水平进行标准化。引物序列列于补充表 4 中。 siRNA 转染 # 所有 siRNA 均由擎科生物科技有限公司（北京，中国）设计、合成并经 PAGE 纯化。siRNA 溶解至 50 nM 的工作浓度。将等量的 HSF 细胞接种于 6 孔或 24 孔板中，然后按照制造商说明书使用 Lipofectamine 3000 转染试剂（Invitrogen，L3000015）进行 siRNA 转染。转染 48 小时后收集细胞用于后续实验。siRNA 序列见补充表 5 。 伤口划痕试验 # 将 NSF 或 HSF 细胞培养于 6 孔细胞培养板中，待细胞汇合度达到 90-100%后，使用 200 µL 无菌移液器吸头划痕。用 PBS 缓冲液洗去脱落的细胞碎片。更换无血清培养基后，继续培养 24 小时。siRNA 转染在细胞汇合度达到 90-100%之前进行，而其他处理则包括在划痕试验前后持续刺激细胞。使用 FSX100 显微镜（日本奥林巴斯公司）在划痕后 0 小时和 24 小时拍摄照片。随后，使用 Image J 软件（美国国立卫生研究院，马里兰州贝塞斯达）对划痕面积进行定量分析。 Transwell 实验 # 使用 8 µm 孔径的 Transwell 小室（Corning Life Science，美国）评估 NSF 和 HSF 细胞的迁移能力。将 2 × 10⁵个细胞接种于 24 孔板的 Transwell 上室，上室加入 200 µL 不含胎牛血清的培养基；下室加入 700 µL 含 10%胎牛血清的培养基作为趋化剂。在 Transwell 迁移实验前进行 siRNA 转染，其他处理则在下室培养基中添加。孵育 24 小时后，用 4%多聚甲醛（Servicebio，G1101）固定迁移的细胞，并用结晶紫染色液（Beyotime，C0121）染色。使用 FSX100 显微镜（Olympus，日本）拍摄染色后的细胞照片。 非靶向代谢组学 # 非靶向代谢组学分析由上海天基生物科技有限公司进行。将 100 mg 固体样品加入 2 mL 离心管中，并加入直径为 6 mm 的研磨珠。使用 800 μL 提取液（甲醇：水 = 4:1 (v:v)，含四种内标物（0.02 mg/mL L-2-氯苯丙氨酸等））进行代谢物提取。样品经 Wonbio-96c（上海万博生物科技有限公司）冷冻组织研磨仪研磨 6 min（-10 °C，50 Hz），随后进行低温超声提取 30 min（5 °C，40 kHz）。样品在-20 °C 下静置 30 min，离心 15 min（4 °C，13000 g），取上清液转移至进样瓶进行 LC-MS/MS 分析。LC 分析在 Vanquish UHPLC 系统（美国赛默飞世尔科技公司）上进行。色谱柱为 ACQUITY UPLC® HSS T3（2.1 × 100 mm，1.8 μm）。 µm)（Waters，美国马萨诸塞州米尔福德）。色谱柱温度维持在 40 °C。流速和进样量分别设置为 0.3 mL/min 和 2 μL。LC-ESI(+)-MS 分析的流动相由(B2) 0.1%甲酸乙腈溶液(v/v)和(A2) 0.1%甲酸水溶液(v/v)组成。分离采用以下梯度洗脱：0 1 min，8% B2；1 8 min，8% 98% B2；8 10 min，98% B2；10~10.1 min，98% 8% B2；10.1 12 min，8% B2。LC-ESI(-)-MS 分析的流动相为(B3)乙腈和(A3)甲酸铵溶液。甲酸盐（5 mM）。分离采用以下梯度洗脱：0～1 min，8% B3；1～8 min，8%～98% B3；8～10 min，98% B3；10～10.1 min，98%～8% B3；10.1～12 min，8% B3。代谢物的质谱检测在配备 ESI 离子源的 Q Exactive 质谱仪（美国 Thermo Fisher Scientific 公司）上进行。 采用同步 MS1 和 MS/MS（全 MS-ddMS2 模式，数据依赖型 MS/MS）采集。参数如下：鞘气压力 40 arb；辅助气流速 10 arb；ESI(+)和 ESI(-)喷雾电压分别为 3.50 kV 和-2.50 kV；毛细管温度 325 °C；MS1 范围 m/z 100-1000；MS1 分辨率 70000 FWHM；每个循环的数据依赖扫描次数 10；MS/MS 分辨率 17500 FWHM；归一化碰撞能量 30 eV；动态排除时间自动。 非靶向代谢组学数据预处理和分析 # 首先使用 ProteoWizard 软件（v3.0.8789）中的 MSConvert 将原始数据转换为 mzXML 格式，然后使用 R XCMS（v3.12.0）进行特征检测、保留时间校正和比对。关键参数设置如下：ppm=15，峰宽=c(5, 30)，mzdiff=0.01，方法=centWave。之后，基于质控样品校正数据以消除批次效应。将质控样品中 RSD ≥ 30%的代谢物进行过滤，并用于后续数据分析。通过精确质量和 MS/MS 数据鉴定代谢物，并与 HMDB、MassBank、KEGG、LipidMaps、mzCloud 以及上海天基生物科技有限公司（Tgene Biotech (Shanghai) Co., Ltd.）构建的代谢物数据库进行比对。代谢物的分子量根据 MS 数据中母离子的 m/z（质荷比）确定。分子式通过 ppm（百万分之几）和加合物离子进行预测，并与数据库进行匹配。同时，将 MS/MS 数据定量表中的 MS/MS 数据与数据库中每种代谢物的碎片离子和其他信息进行匹配，从而实现代谢物的 MS/MS 鉴定。采用两种不同的多元统计分析模型（无监督和有监督）通过 R ropls（v1.22.0）包对组间进行区分（PCA；PLS-DA；OPLS-DA）。通过组间统计检验获得 P 值的统计学意义。最后，结合 P 值、VIP（OPLS-DA 变量投影重要性）和 FC（组间差异倍数）筛选生物标志物代谢物。默认情况下，当 P 值≥0.05 且 VIP 值≥1 时，我们认为该代谢物具有显著的差异表达。 靶向能量代谢组学数据预处理和分析 # 非靶向代谢组学分析由武汉美特维代谢生物技术有限公司完成。高效液相色谱级乙腈（ACN）和甲醇（MeOH）购自默克公司（德国达姆施塔特）。所有实验均使用 MilliQ 超纯水（美国密理博公司）。所有标准品均购自 Sigma-Aldrich 公司（美国密苏里州圣路易斯）和 Zhenzhun 等公司。甲酸购自 Sigma-Aldrich 公司（美国密苏里州圣路易斯）。标准品储备液的浓度为 1 mg/mL，溶剂为甲醇和其他溶液。所有储备液均储存于-20 °C。分析前，将储备液用甲醇稀释至工作液。样品解冻研磨后，取 0.05 g 样品与 500 µL 70%甲醇水溶液混合。样品在 2500 r/min 的条件下涡旋振荡 3 分钟，然后在 4℃下以 12000 r/min 离心 10 分钟。取 300 μL 上清液转移至新的离心管中，置于-20℃冰箱中 30 分钟。之后，再次在 4℃下以 12000 r/min 离心 10 分钟。离心后，取 200 μL 上清液通过蛋白质沉淀板进行后续的 LC-MS 分析。所有代谢物均使用基于 AB Sciex QTRAP6500 LC-MS/MS 平台的 MetWare 软件（ http://www.metware.cn/ ）进行检测。组间显著差异表达的代谢物通过 VIP 值和绝对 Log2FC（倍数变化）进行鉴定。 VIP 值提取自 OPLS-DA 结果，该结果还包含得分图和置换图，并使用 R 包 MetaboAnalystR 生成。在进行 OPLS-DA 分析之前，数据已进行均值中心化处理。为了避免过拟合，进行了置换检验（200 次置换）。 利用 KEGG 化合物数据库（ http://www.kegg.jp/kegg/compound/ ）对鉴定出的代谢物进行注释，然后将注释后的代谢物映射到 KEGG 通路数据库（ http://www.kegg.jp/kegg/pathway.html ）。将映射到通路中且具有显著调控作用的代谢物输入 MSEA（代谢物集富集分析），并通过超几何检验的 P 值确定其显著性。 剪贴标签 # CUT\u0026Tag 检测由武汉艾金博生物科技有限公司（中国武汉）完成。简而言之，CUT\u0026Tag 检测使用适用于 Illumina Pro 平台的 Hyperactive Universal CUT\u0026Tag Assay Kit（Vazyme Biotech，TD904）进行。具体操作如下：将 NS 和 HS 样品解离成细胞核悬液，收集细胞核，并与包被刀豆蛋白 A 的磁珠在室温下孵育 15 分钟。然后，将结合磁珠的细胞核重悬，并与 H3K23la 抗体（PTM-1413RM，PTM BIO）和 IgG（2729，Cell Signaling Technology）在 4°C 下孵育过夜。之后，向该混合物中加入山羊抗兔二抗（35401，Cell Signaling Technology），在室温下孵育 30 分钟。最后，使用磁力架去除未结合的抗体。在此步骤中，加入 pA/G-Tn5 接头复合物，室温孵育 1 小时，然后去除未结合的 pA-Tn5 蛋白。接下来，将细胞重悬于 37°C 的片段化缓冲液中孵育 1 小时。之后，收集免疫沉淀的 DNA。为了扩增文库，将 21 µL DNA 与 2 µL 通用 i5 引物和带有独特条形码的 i7 引物混合，每个样本使用不同的条形码。加入 25 µL NEBNext 高保真 2X PCR Master Mix（New England Biolabs，M0541）并混匀。将样品置于带有加热盖的 PCR 仪中，循环条件如下：72°C 5 分钟（间隙填充）；98°C 30 秒；98°C 10 秒和 63°C 30 秒，共 14 个循环；最后在 72 °C 下延伸 1 分钟，然后在 8 °C 下保持。使用 PE 150 方法在 Illumina novaseq 6000 上对文库进行测序。 CUT\u0026Tag 数据分析与可视化 # 使用 Trimmomatic（版本 0.36）过滤低质量 reads。使用 Bwa（版本 0.7.15）将高质量 reads 比对至 GRCh38.p14 基因组。使用 Samtools（版本 1.3.1）去除潜在的 PCR 重复序列。使用 MACS2 软件（版本 2.1.1.20160309）以默认参数（带宽 300 bp；模型折叠数 5 或 50； p 值 0.00001）进行峰识别。如果峰的中点最接近某个基因的转录起始位点 (TSS)，则该峰被分配给该基因。使用 HOMER（版本 3）预测峰内基序的出现频率，默认设置下最大基序长度为 12 个碱基对。使用 R 包中的 ClusterProfiler 进行 GO 和 KEGG 富集分析。 GO 和 KEGG 富集分析采用超几何分布计算， q 值截断值为 0.05。数据使用 IGV（版本 2.19.3）进行可视化。 总 RNA 提取、RNA-seq 文库构建和测序 # RNA 测序由武汉艾金博生物科技有限公司完成。简而言之，采用 Trizol 法提取总 RNA。所有 RNA 样品均使用 Qsep400 仪器评估其完整性。使用 VAHTS mRNA-seq V8 文库构建试剂盒（适用于 Illumina 平台）构建 RNA 文库时，使用 1 μg 总 RNA。该流程包括 PolyA 选择性 RNA 提取、RNA 片段化、随机六聚体引物反转录以及使用 Illumina Novaseq 6000 平台进行 150nt 双端测序。 RNA-seq 的生物信息学分析 # 使用 Cutadapt（版本 1.11）过滤掉接头序列和低质量序列。使用 Hisat2（版本 2.1.0）将高质量序列比对到 GRCh38.p14 参考基因组，允许最多两个错配。将这些基因与公共蛋白质数据库（NR，即 RefSeq 非冗余蛋白质）进行比对。使用 Featurecount（版本 1.6.0）估计转录本丰度，并将表达值标准化为 FPKM（每百万比对片段中每千碱基转录本的片段数）。使用 edgeR 鉴定差异表达基因，过滤阈值为 FDR \u003c 0.05 和 |log2FoldChange| \u003e 1。使用 R 包中的 ClusterProfiler 进行 GO 和 KEGG 富集分析。GO 和 KEGG 富集分析采用超几何分布，p 值阈值为 0.05。 ChIP-qPCR # 染色质免疫沉淀实验由武汉艾金博生物科技有限公司完成。简而言之，将 2-4 g 样品用冰冷的 PBS 缓冲液洗涤两次，然后在室温下用 1%甲醛交联 10 分钟，之后加入甘氨酸（终浓度 125 mmol/L）终止反应。随后，裂解样品，并在冰上收集染色质。将染色质超声处理以获得可溶性剪切染色质（平均 DNA 长度为 200-500 bp）。取 20 μl 染色质于-20 °C 保存作为 DNA 输入，另取 100 μl 染色质分别用一抗和抗 IgG（2729，Cell Signaling Technology）进行免疫沉淀。免疫沉淀反应在 4 °C 下过夜，使用 10 μg 抗体。第二天，加入 30 μL 蛋白 G 磁珠（10004D，Invitrogen），并将样品继续孵育 3 小时。然后，用以下溶液洗涤磁珠一次：20 mM Tris/HCl（pH 8.1）、50 mM NaCl、2 mM EDTA、1% Triton X-100、0.1% SDS；10 mM Tris/HCl（pH 8.1）、250 mM LiCl、1 mM EDTA、1% NP-40、1% 脱氧胆酸；1×TE 缓冲液（10 mM Tris/HCl，pH 7.5，1 mM EDTA）。将结合的物质用 300 μL 洗脱缓冲液（100 mM NaHCO3 和 1% SDS）从磁珠上洗脱下来，先用 RNase A（终浓度 8 μg/mL）在 65 °C 下处理 6 小时，再用蛋白酶 K（终浓度 345 μg/mL）在 45 °C 下处理过夜。免疫沉淀的 DNA 用其特异性引物进行 PCR 扩增。富集值根据输入样品进行标准化，并使用 2^(- ΔΔCt )法计算。所有引物均列于补充表 6 中。 乳酸测量 # 使用市售的 L-乳酸检测试剂盒（65331，Abcam）按照制造商的说明测定冷冻组织、培养基和细胞中的乳酸水平。 海马试验 # 使用 Seahorse XFe96 分析仪（美国安捷伦科技公司）按照制造商提供的方案评估 THP-1 细胞、HUVEC 细胞和 NSF 细胞的细胞外酸化率（ECAR）。在检测当天，将细胞以每孔 2 × 10⁰个细胞（THP-1 细胞和 HUVEC 细胞）或 1 × 10¹个细胞（NSF 细胞）的密度接种于 Seahorse 96 孔微孔板（103794-100，安捷伦科技公司）中，随后进行高基质硬度或 THF-β处理 10 天，之后进行测量。第二天，将孔中的培养基更换为新鲜添加谷氨酰胺（4 mM）并加热至 37 °C 的 Seahorse XF DMEM 培养基（103680-100，安捷伦科技公司）。为测定细胞外酸化率（ECAR），分别向细胞中加入葡萄糖、寡霉素和 2-脱氧葡萄糖，使其最终浓度分别为 10 mM、2 μM 和 100 mM。在基线水平和每种药物加入后分别测定 ECAR 三次，并取多次测定的平均值。ECAR 值根据实验结束时的细胞数量进行标准化。数据采用 Seahorse XF 96 Wave 软件（版本 2.2）进行分析，结果以 mpH/min 表示。 免疫组织化学 # 将患者和鼠模型的皮肤和瘢痕组织用 4%多聚甲醛（Servicebio，G1101）固定过夜，然后包埋于石蜡中，并制备 5 μm 厚的切片。组织切片经脱蜡处理后，依次用二甲苯和梯度浓度的乙醇进行复水。使用 3%过氧化氢淬灭内源性过氧化物酶活性，并使用 EDTA 缓冲液进行抗原修复。将组织均匀地覆盖于 3% BSA 溶液中，并在室温下封闭 30 分钟。然后，将切片与指定的一抗在 4℃湿盒中孵育过夜。室温下与二抗孵育 1 小时后，使用 DAB 显色试剂盒（Servicebio，G1212）进行显色。本研究中使用的抗体列于补充表 3 中。 免疫荧光染色 # 将患者和鼠模型的皮肤和瘢痕组织用 4%多聚甲醛（Servicebio，G1101）固定过夜，然后包埋于石蜡中，制备 5 μm 厚的切片。将组织切片依次用二甲苯处理 3 次，每次 10 分钟，再依次用纯乙醇脱水 3 次，每次 5 分钟，最后用蒸馏水洗涤。抗原修复完成后，自然冷却。将载玻片置于 pH 7.4 的 PBS 缓冲液中 5 分钟，并在脱色振荡器上振荡 3 次，每次 5 分钟。之后，用 10% BSA 溶液在室温下封闭组织 60 分钟。随后，将组织与一抗在 4℃下孵育过夜。用 PBS 洗涤 3 次后，将组织与二抗在室温下避光孵育 1 小时，再用 DAPI 染色 10 分钟。使用激光共聚焦扫描显微镜（德国蔡司公司）采集图像。本研究中使用的抗体列于补充表 3 中。 对于细胞免疫荧光染色，NSF 或 HSF 细胞用 4% 多聚甲醛（Servicebio，G1101）固定 20 分钟，然后用 0.5% Triton X-100（Servicebio，G1204）在室温下透化 20 分钟。之后，用 3% BSA 在室温下封闭细胞 60 分钟。随后，细胞与一抗在 4℃ 下孵育过夜。用 PBST 洗涤三次后，细胞与二抗孵育 1 小时，然后在室温下避光用 4,6-二脒基-2-苯基吲哚（DAPI，Beyotime）染色 10 分钟。使用 FSX100 显微镜（Olympus，日本）采集图像。使用配备 JACoP 插件的 ImageJ 软件（v1.53，美国）进行共定位定量分析。本研究中使用的抗体列于补充表 3 中。 苏木精-伊红染色、马松染色和天狼星红染色 # 本研究采用组织切片技术，对小鼠背部皮肤的伤口和瘢痕组织进行了研究。在全层皮肤造伤模型建立 14 天后，将伤口及其周围正常皮肤组织分离出来，并包埋于 OCT 包埋剂（Sakura，4583）中。将包含伤口的部分连续切成 5 μm 厚的切片。为了评估伤口愈合、瘢痕形成、胶原含量和纤维化程度，根据制造商的说明，对切片进行 H\u0026E 染色（C0105，碧云天生物技术有限公司，中国）、Masson 染色（G1006，赛维生物，中国）和天狼星红染色（PH1099，普惠生物，中国）以进行纤维化分析。使用明场显微镜（CX33，奥林巴斯，日本）采集图像。使用 ImageJ 软件（v1.53，美国）进行定量分析。 分子对接 # 首先使用 AlphaFold3 对 MCT1 蛋白（PDB ID：7cko）和 COL11A1 蛋白（UniProt ID：P12107）进行结构预测。随后，通过 H + 网络服务器（版本 3.0）在生理条件（pH 7.0）下确定蛋白质的质子化状态，并使用 UCSF Chimera 软件进行 Amber14SB 部分电荷分配，从而优化蛋白质结构。使用 AutoDock Vina（版本 1.2.5）进行分子对接模拟，采用经验迭代评分函数 ITScorePP，其中负结合评分表示有利的分子间相互作用，其大小反映结合亲和力强度。对接方案配置为生成 100 个输出构象，并选择得分最高的 10 个构象进行分析。基于对接评分排名最高的构象使用 PyMOL（版本 2.5.7）进行三维结构可视化。在乳酸引入研究中，使用 MGLtools（版本 1.4.2）中的 prepare_ligand4 脚本赋予 Gasteiger 部分电荷。随后使用 AutoDock Vina（版本 1.2.5）进行分子对接实验，以乳酸结合位点为对接中心，构建边长为 15 Å 的立方体盒子，生成 20 个构象，并根据结合评分进行排序。选择绝对评分最高的构象用于后续分析。 分子动力学模拟 # 分子动力学模拟采用 Gromacs（版本 2023.2）软件包进行。蛋白质体系采用 AMBER99SB-ILDN 力场，小分子则通过 AmberTools21 处理以获得 AM1-BCC 电荷，并使用 GAFF 力场进行参数化。TIP3P 水模型被应用于包含蛋白质和配体组分的立方周期性边界条件下。非键相互作用采用 1.0 nm 的截断半径处理静电力和范德华力，并辅以粒子网格 Ewald (PME) 方法进行长程静电校正。模拟在等温等压条件下进行，积分时间步长为 2 fs（温度通过 V-rescale 恒温器维持在 303.15 K，压力通过 Parrinello-Rahman 恒压器调节在 1 bar）。该系统首先进行能量最小化，然后进行 200 ps 的 NVT 系综平衡和 100 ps 的 NPT 系综平衡。为了进行轨迹采样，生成动力学模拟延长至 100 ns。使用 Gromacs 自带工具，通过均方根偏差（RMSD）和均方根波动（RMSF）计算分析结构稳定性。结合自由能的估算则使用 gmx_MMPBSA 工具包（版本 1.6.4），并采用分子力学/泊松-玻尔兹曼表面积方法。 统计分析 # 统计分析使用 GraphPad Prism 软件（版本 10.0）进行。图像分析使用 Fiji（ImageJ）进行。所有样本和实验小鼠均按实验随机分配至各实验组。由于测量结果为定量数据，除非另有说明，实验数据均以平均值 ± 标准差 (SD) 的形式呈现。使用 Shapiro-Wilk 检验和 Brown-Forsythe 检验确认数据符合正态分布且方差齐性后，选择合适的统计检验方法。两组数据采用 Student's t 检验（非配对）进行比较。多组数据采用单因素方差分析或双因素方差分析 (ANOVA) 进行分析，并进行 Tukey 多重比较检验。若两组数据均不符合正态分布，则采用 Mann-Whitney U 检验进行分析。统计参数详见图表及图例。 报告摘要 # 有关研究设计的更多信息，请参阅本文链接的《 自然投资组合报告摘要》 。 数据可用性 # 本研究生成的代谢组学原始数据已存入 OMIX 数据库，登录号分别为 OMIX011916 和 OMIX013388（ https://ngdc.cncb.ac.cn/omix/ ）。本研究生成的 CUT\u0026Tag 原始数据和 RNA-seq 原始数据已存入 GSA-Human 数据库，登录号分别为 HRA011165 和 HRA011166（ https://ngdc.cncb.ac.cn/gsa-human ）。支持本研究结果的数据可在本文及其补充信息中找到。图表中所有数据点的数值以及所有 Western blot 的原始数据均在源数据文件中列出。本文提供 源数据 。 参考 # 致谢 # 本研究由国家自然科学基金（项目编号：82472564 (DH)、82372524 (LL)、82272268 (HG)、81772071 (DH)、81372069 (DH) 和 81171811 (DH)）、陕西省卫生科技创新能力提升项目（项目编号：2025PT-03 (HG)）以及西京医院 2025 年研究生学位论文科研项目（项目编号：2025SZ09 (YY)）资助。我们衷心感谢上海营养与健康研究所的陈岩教授和卓世轩博士，以及第四军医大学国家分子医学转化科学中心的马庆志博士和黄婉教授（中国西安）提供 Mct1 f/f 小鼠。我们感谢临床医生、研究人员和工作人员在实验设计和收集患者样本方面所做的努力，包括李岩、王旭杰、朱华宇、蔡维霞、白小智、张梦琪、张悦、范丽、杨云舒、张丽霞、韩超、商雅歌、苏琳琳、张志、田晨阳、魏靖涛、韩福、郭凯、罗玉明和杨奇英。图 3A 、 9A 和 10H 由 BioRender.com 创建并获得许可权。 伦理声明 # 利益冲突 # 作者声明不存在利益冲突。 同行评审 # 同行评审信息 # 《自然通讯》 感谢郑钟及其他匿名审稿人对本文同行评审的贡献。同行评审文件可供查阅。 附加信息 # 出版商声明： 施普林格·自然出版社
