果； Shiny / Quarto 集成：做交互式分析助手或自动报告； MCP / multi-agent / hooks：最后再考虑工程化和自动化流程。 一个面向口腔生信项目的理想形态： console_chat 负责交互入口 ChatSession 负责记忆和状态 Tools 负责执行 R/Seurat/DESeq2/ggplot2 操作 Agent 负责专业角色和任务规划 generate_object 负责结构化提取 marker、通路、文献信息 Shiny/Quarto 负责最终报告和界面 原始教程摘要 # 这篇教程的核心经验是：作者在 YH 大佬指点下，尝试配置 aisdk ，成功在 RStudio 的 R console 里进入 AI 对话，并让 AI 使用 ggplot2 生成基因表达相关性散点图、保存代码和图片。整体体验顺滑，适合作为 R 用户接触 AI Agent 的入门案例。","tags":["生信AI工具","R语言","AI智能体","教程"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"生信 AI 工具","updated":"2026-10-25T17:37:28.599Z","url":"bioinfo-tools/notes/5ec7e681b6988e7f2b6c7453.html"},{"kbId":"KB-000085","title":"高分Panel复现：差异基因热图 + GO 富集放进同一个 Panel","subtitle":"","summary":"把差异基因状态、组织来源、共同变化基因模块和 GO 富集结果放进同一套视觉结构的 Panel 复现教程，含完整 R 代码。","body":"摘要 LLM 归库摘要 核心内容： 复现高分论文中的组合 Panel：把 差异基因热图、组织来源注释条、共同变化基因模块标记、GO 富集条形图 放进同一套视觉结构；GO 条目文字直接叠加在条形区域内部，接近论文原图排版。 适用场景： 展示多个组织中共同变化的基因，并将上调/下调基因对应的功能富集结果同步呈现。 输入： 3 个 csv—— input_cell_annotation.csv （组织/细胞类型/顺序）、 input_deg_heatmap.csv （基因/模块/细胞类型/组织/差异状态）、 input_go_enrichment.csv （模块/GO 条目/-log10P）。 输出： deg_heatmap_go_panel.png / .pdf （7.2×4.35 in, 450 dpi），含组织注释条 + 差异热图 + 模块标记条 + GO 条形图 + 连接带。 关键参数/步骤： ①固定基因/细胞顺序；②热图配色（粉色=上调/白=未变/蓝=下调）+ 组织独立配色；③ geom_tile 热图 + geom_rect 模块条；④GO 条形图用 geom_text 把文字叠进条内；⑤ polygonGrob 连接带衔接左侧热图与右侧 GO。 常见错误： 基因/细胞顺序不固定会导致布局漂移；GO 文字用默认 y 轴标签会多出空白栏；热图与组织注释配色混用会混淆信息。 与口腔生信连接： 牙周炎/OSCC 多组织或分组比较时，可用此模板把差异基因热图与 GO 富集合并成单个发表级 Panel；示例表格需自行换成自己数据。 下一步处理： 暂未试用；R 脚本已同步至远程代码库 02_可视化/02_热图与GO富集/ ，可按需调用。 归库说明： 分类到 03 生信教程与工具库（可视化与配色），置信度 0.9，理由：高分 Panel 复现教程、含完整可复用 R 代码。 高分 Panel 复现：差异基因热图 + GO 富集 来源公众号：Xming同学·多线程核糖体（2026-08-12） 这张图的重点不只是热图本身，而是把 差异基因状态、组织来源、共同变化基因和 GO 富集结果放在同一套视觉结构里 。右侧条形图采用 文字直接叠加在条形区域内 的方式，更接近论文原图的排版效果。 图片来源 # 项目 内容 文章 Single-cell atlas of reproductive endocrine organs reveals transcriptomic responses to type 1 diabetes mellitus in nonhuman primates 期刊/年份 Cell Discovery, 2026 图形内容 差异表达热图与 GO 富集组合图 DOI/链接 Nature 文章链接 这类图用于展示多个组织中共同变化的基因，并将上调或下调基因对应的功能富集结果同步呈现。 左侧负责表达基因状态，右侧负责解释这些基因可能涉及的生物学过程。 原图与复现效果 # 原图（论文 Fig.） # 复现结果 # 图片解读：整张图四个部分 # 顶部组织注释条 —— 不同颜色代表 Hypothalamus、Pituitary、Ovary 和 Uterus 等组织来源。 中间差异基因热图 —— 横轴是细胞类型或组织相关细胞群，颜色表示基因在 T1DM 条件下的变化状态。 左侧共同基因模块标记 —— 粉色代表共同上调基因，蓝色代表共同下调基因，并标注相应基因数量。 右侧 GO 富集条形图 —— 横轴为 -log10(Pvalue) 。上方粉色为共同上调基因富集结果，下方蓝色为共同下调基因富集结果。GO 条目文字直接放在条形图区域内，减少额外标签栏空白。 输入数据（3 个 csv，自行替换） # 1. input_cell_annotation.csv # 列名 含义 tissue 组织或样本来源 cell_type 细胞类型名称 cell_index 细胞类型在图中的排列顺序 2. input_deg_heatmap.csv # 列名 含义 gene 基因名称 module 基因所属模块，如 Common up 、 Common down cell_type 细胞类型 tissue 组织来源 regulation 差异状态：上调、未变化或下调 3. input_go_enrichment.csv # 列名 含义 module 对应基因模块 term GO 富集条目 neg_log10_p -log10(Pvalue) 每一行热图数据代表一个基因在一个细胞类型中的差异状态；每一行 GO 数据代表一个富集条目及其显著性。 示例数据需自行准备（公众号后台可领，或用自己数据替换）。 R 代码要点拆解 # 第一步：固定基因和细胞类型顺序 # 热图顺序需提前固定，否则不同数据集重跑时布局会变化。 cell_order \u003c- cell_anno$cell_type gene_order \u003c- deg |\u003e distinct(gene, module) |\u003e mutate(module = factor(module, levels = c(\"Common up\", \"Common down\", \"Other\"))) |\u003e arrange(module, gene) |\u003e pull(gene) plot_dat \u003c- deg |\u003e mutate( cell_type = factor(cell_type, levels = cell_order), gene = factor(gene, levels = rev(gene_order)), regulation = factor(regulation, levels = c(\"Upregulated in T1DM\", \"Unchanged\", \"Downregulated in T1DM\")) ) 第二步：热图和组织注释配色 # 热图中粉色/蓝色突出差异方向，白色保留未变化区域；顶部组织条用独立配色，避免混淆。 reg_cols \u003c- c( \"Upregulated in T1DM\" = \"#f23aa5\", \"Unchanged\" = \"#ffffff\", \"Downregulated in T1DM\" = \"#85c8e4\" ) tissue_cols \u003c- c( \"Hypothalamus\" = \"#f5cf3d\", \"Pituitary\" = \"#24a8df\", \"Ovary\" = \"#f07557\", \"Uterus\" = \"#70c644\" ) 第三步：热图和模块标记 # p_heat \u003c- ggplot(plot_dat, aes(cell_type, gene, fill = regulation)) + geom_tile(color = \"#f2f2f2\", linewidth = 0.02) + scale_fill_manual(values = reg_cols, guide = \"none\") + scale_x_discrete(expand = c(0, 0)) + scale_y_discrete(expand = c(0, 0)) + labs(x = NULL, y = NULL) + theme_minimal(base_size = 7) + theme( panel.grid = element_blank(), axis.text.y = element_blank(), axis.ticks = element_blank(), axis.text.x = element_text(angle = 90, vjust = 0.5, hjust = 1, size = 4.8, color = \"black\"), plot.margin = margin(0, 0, 0, 0) ) 第四步：GO 条形图（核心） # GO 文字不再用默认 y 轴标签，而是作为独立文字图层直接叠加到条形图内部： go_plot \u003c- function(df, fill_col) { df \u003c- df |\u003e mutate(term = as.character(term), y = rev(seq_along(term))) ggplot(df, aes(y = y)) + geom_rect(aes(xmin = 0, xmax = neg_log10_p, ymin = y - 0.34, ymax = y + 0.34), fill = fill_col, color = NA) + geom_text(aes(x = 0.28, y = y, label = term), hjust = 0, vjust = 0.5, size = 1.62, color = \"black\") + scale_x_continuous(limits = c(0, 25), breaks = seq(0, 25, 5), expand = expansion(mult = c(0, 0.02))) + scale_y_continuous(limits = c(0.45, max(df$y) + 0.55), breaks = NULL, expand = c(0, 0)) + labs(x = \"-log10(Pvalue)\", y = NULL) + theme_classic(base_size = 8) + theme( axis.text.y = element_blank(), axis.text.x = element_text(size = 6.3, color = \"black\"), axis.title.x = element_text(size = 7.2, color = \"black\", margin = margin(t = 1)), axis.line.y = element_blank(), axis.ticks.y = element_blank(), axis.line.x = element_line(linewidth = 0.3), axis.ticks.x = element_line(linewidth = 0.3), plot.margin = margin(0, 0, 0, 0) ) } 第五步：连接带 + 组合 # polygonGrob 绘制上下连接带，衔接左侧热图与右侧 GO 图，最后用 patchwork 组合： connector \u003c- function(fill_col, ytop, ybottom) { polygonGrob( x = unit(c(0, 1, 1, 0), \"npc\"), y = unit(c(ytop, 0.78, 0.52, ybottom), \"npc\"), gp = gpar(fill = alpha(fill_col, 0.24), col = NA) ) } 完整代码见下方\"完整代码\"或远程代码库 02_可视化/02_热图与GO富集/ 。 完整代码 # library(dplyr) library(readr) library(ggplot2) library(patchwork) library(grid) library(scales) deg \u003c- read_csv(\"input_deg_heatmap.csv\", show_col_types = FALSE) cell_anno \u003c- read_csv(\"input_cell_annotation.csv\", show_col_types = FALSE) go \u003c- read_csv(\"input_go_enrichment.csv\", show_col_types = FALSE) cell_order \u003c- cell_anno$cell_type gene_order \u003c- deg |\u003e distinct(gene, module) |\u003e mutate(module = factor(module, levels = c(\"Common up\", \"Common down\", \"Other\"))) |\u003e arrange(module, gene) |\u003e pull(gene) plot_dat \u003c- deg |\u003e mutate( cell_type = factor(cell_type, levels = cell_order), gene = factor(gene, levels = rev(gene_order)), regulation = factor(regulation, levels = c(\"Upregulated in T1DM\", \"Unchanged\", \"Downregulated in T1DM\")) ) module_df \u003c- plot_dat |\u003e distinct(gene, module) |\u003e mutate(y = as.numeric(gene)) |\u003e group_by(module) |\u003e summarise(ymin = min(y) - 0.5, ymax = max(y) + 0.5, .groups = \"drop\") reg_cols \u003c- c( \"Upregulated in T1DM\" = \"#f23aa5\", \"Unchanged\" = \"#ffffff\", \"Downregulated in T1DM\" = \"#85c8e4\" ) tissue_cols \u003c- c( \"Hypothalamus\" = \"#f5cf3d\", \"Pituitary\" = \"#24a8df\", \"Ovary\" = \"#f07557\", \"Uterus\" = \"#70c644\" ) theme_clean \u003c- theme_void(base_size = 8) + theme(plot.margin = margin(0, 0, 0, 0)) legend_dat \u003c- tibble( x = c(0.02, 0.42, 0.68), label = names(reg_cols), fill = unname(reg_cols) ) p_legend \u003c- ggplot(legend_dat, aes(x = x, y = 0.52)) + geom_tile(aes(fill = label), width = 0.034, height = 0.20, color = \"grey40\", linewidth = 0.13) + geom_text(aes(x = x + 0.026, label = label), hjust = 0, size = 1.85, color = \"black\") + scale_fill_manual(values = reg_cols, guide = \"none\") + coord_cartesian(xlim = c(0, 1), ylim = c(0, 1), clip = \"off\") + theme_clean p_tissue \u003c- ggplot(cell_anno, aes(x = factor(cell_type, levels = cell_order), y = 1, fill = tissue)) + geom_tile(color = \"white\", linewidth = 0.22) + geom_text( data = cell_anno |\u003e group_by(tissue) |\u003e summarise(x = mean(as.numeric(factor(cell_type, levels = cell_order))), .groups = \"drop\"), aes(x = x, y = 1, label = tissue), inherit.aes = FALSE, size = 1.75, fontface = \"bold\", color = \"black\" ) + scale_fill_manual(values = tissue_cols, guide = \"none\") + scale_x_discrete(expand = c(0, 0)) + scale_y_continuous(expand = c(0, 0)) + theme_void(base_size = 8) + theme(plot.margin = margin(0, 0, 0, 0)) p_heat \u003c- ggplot(plot_dat, aes(cell_type, gene, fill = regulation)) + geom_tile(color = \"#f2f2f2\", linewidth = 0.02) + geom_hline(yintercept = max(plot_dat |\u003e filter(module == \"Common down\") |\u003e mutate(y = as.numeric(gene)) |\u003e pull(y)) + 0.5, color = \"white\", linewidth = 0.8) + geom_hline(yintercept = min(plot_dat |\u003e filter(module == \"Common up\") |\u003e mutate(y = as.numeric(gene)) |\u003e pull(y)) - 0.5, color = \"white\", linewidth = 0.8) + scale_fill_manual(values = reg_cols, guide = \"none\") + scale_x_discrete(expand = c(0, 0)) + scale_y_discrete(expand = c(0, 0)) + labs(x = NULL, y = NULL) + theme_minimal(base_size = 7) + theme( panel.grid = element_blank(), axis.text.y = element_blank(), axis.ticks = element_blank(), axis.text.x = element_text(angle = 90, vjust = 0.5, hjust = 1, size = 4.8, color = \"black\"), plot.margin = margin(0, 0, 0, 0) ) p_side \u003c- ggplot(module_df) + geom_rect(aes(xmin = 0.28, xmax = 0.42, ymin = ymin, ymax = ymax, fill = module), color = NA) + geom_segment(aes(x = 0.50, xend = 0.50, y = ymin, yend = ymax, color = module), linewidth = 0.65) + annotate(\"text\", x = 0.15, y = mean(c(min(module_df$ymin[module_df$module == \"Common up\"]), max(module_df$ymax[module_df$module == \"Common up\"]))), label = \"438\", color = \"#f23aa5\", size = 2.15, angle = 90) + annotate(\"text\", x = 0.15, y = mean(c(min(module_df$ymin[module_df$module == \"Common down\"]), max(module_df$ymax[module_df$module == \"Common down\"]))), label = \"416\", color = \"#4fa7cc\", size = 2.15, angle = 90) + annotate(\"text\", x = 0.68, y = mean(c(min(module_df$ymin[module_df$module == \"Common up\"]), max(module_df$ymax[module_df$module == \"Common up\"]))), label = \"Common\", color = \"#f23aa5\", size = 2.35, angle = 90) + annotate(\"text\", x = 0.68, y = mean(c(min(module_df$ymin[module_df$module == \"Common down\"]), max(module_df$ymax[module_df$module == \"Common down\"]))), label = \"Common\", color = \"#4fa7cc\", size = 2.35, angle = 90) + scale_fill_manual(values = c(\"Common up\" = \"#f23aa5\", \"Common down\" = \"#85c8e4\", \"Other\" = \"white\"), guide = \"none\") + scale_color_manual(values = c(\"Common up\" = \"#f23aa5\", \"Common down\" = \"#4fa7cc\", \"Other\" = \"white\"), guide = \"none\") + coord_cartesian(xlim = c(0, 1), ylim = range(module_df$ymin, module_df$ymax), expand = FALSE) + theme_void(base_size = 8) go_plot \u003c- function(df, fill_col) { df \u003c- df |\u003e mutate(term = as.character(term), y = rev(seq_along(term))) ggplot(df, aes(y = y)) + geom_rect(aes(xmin = 0, xmax = neg_log10_p, ymin = y - 0.34, ymax = y + 0.34), fill = fill_col, color = NA) + geom_text(aes(x = 0.28, y = y, label = term), hjust = 0, vjust = 0.5, size = 1.62, color = \"black\") + scale_x_continuous(limits = c(0, 25), breaks = seq(0, 25, 5), expand = expansion(mult = c(0, 0.02))) + scale_y_continuous(limits = c(0.45, max(df$y) + 0.55), breaks = NULL, expand = c(0, 0)) + labs(x = \"-log10(Pvalue)\", y = NULL) + theme_classic(base_size = 8) + theme( axis.text.y = element_blank(), axis.text.x = element_text(size = 6.3, color = \"black\"), axis.title.x = element_text(size = 7.2, color = \"black\", margin = margin(t = 1)), axis.line.y = element_blank(), axis.ticks.y = element_blank(), axis.line.x = element_line(linewidth = 0.3), axis.ticks.x = element_line(linewidth = 0.3), plot.margin = margin(0, 0, 0, 0) ) } p_go_up \u003c- go_plot(go |\u003e filter(module == \"Common up\"), \"#f23aa5\") p_go_down \u003c- go_plot(go |\u003e filter(module == \"Common down\"), \"#85c8e4\") p_go \u003c- p_go_up / p_go_down connector \u003c- function(fill_col, ytop, ybottom) { polygonGrob( x = unit(c(0, 1, 1, 0), \"npc\"), y = unit(c(ytop, 0.78, 0.52, ybottom), \"npc\"), gp = gpar(fill = alpha(fill_col, 0.24), col = NA) ) } p_link \u003c- ggplot() + annotation_custom(connector(\"#f23aa5\", 0.93, 0.51), xmin = 0, xmax = 1, ymin = 0, ymax = 1) + annotation_custom(connector(\"#85c8e4\", 0.49, 0.07), xmin = 0, xmax = 1, ymin = 0, ymax = 1) + coord_cartesian(xlim = c(0, 1), ylim = c(0, 1), expand = FALSE) + theme_void() legend_row \u003c- plot_spacer() + p_legend + plot_spacer() + plot_layout(widths = c(0.08, 1, 0.02)) tissue_row \u003c- plot_spacer() + p_tissue + plot_spacer() + plot_layout(widths = c(0.08, 1, 0.02)) heatmap_row \u003c- p_side + p_heat + plot_layout(widths = c(0.10, 1)) left_block \u003c- legend_row / tissue_row / heatmap_row + plot_layout(heights = c(0.10, 0.07, 1)) p \u003c- wrap_plots(left_block, p_link, p_go, ncol = 3, widths = c(1.08, 0.15, 0.78)) ggsave(\"deg_heatmap_go_panel.png\", p, width = 7.2, height = 4.35, dpi = 450, bg = \"white\") ggsave(\"deg_heatmap_go_panel.pdf\", p, width = 7.2, height = 4.35, bg = \"white\") 使用说明（可复用） 准备 3 个 csv （ input_cell_annotation.csv / input_deg_heatmap.csv / input_go_enrichment.csv ），按上文列结构整理自己数据。 直接复制完整代码到 RStudio 运行，或从远程代码库 02_可视化/02_热图与GO富集/ 取 .R 脚本。 若组织种类不同，修改 tissue_cols ；若差异状态标签不同，修改 reg_cols 和 levels 。 基因数量注释（438/416）为示例值，运行前按实际模块大小替换。 参考链接 原文：Cell Discovery, 2026《Single-cell atlas of reproductive endocrine organs...》（Nature 文章链接） 公众号：Xming同学·多线程核糖体 本页 R 代码已同步至远程代码库 hz-bioinfo-codes/02_可视化/02_热图与GO富集/ 。","tags":["clippings","生信教程","可视化","热图","GO富集","Panel复现","R语言","ggplot2","patchwork","暂未试用"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"可视化与配色","updated":"2026-10-25T17:37:28.598Z","url":"bioinfo-tools/notes/9dc5e1a1af74fa465c82a7bd.html"},{"kbId":"KB-000084","title":"让审稿人一眼喜欢的 UMAP 图：单细胞美化全流程","subtitle":"","summary":"UMAP 细胞群外半透明轮廓 + 左下角短箭头坐标轴 + CNS 风格主题，让单细胞 UMAP 图更受审稿人喜欢。","body":"摘要 LLM 归库摘要 核心内容： 让 UMAP 更受审稿人喜欢的美化全流程： stat_unchull() 给细胞群加半透明虚线轮廓 + annotate() 画左下角短箭头坐标轴 + 干净主题。与 Seurat 默认 UMAP 的关键区别是强调\"每一类细胞整体占据什么区域、群间是否混杂、是否连续过渡\"。 适用场景： 单细胞 UMAP/t-SNE 降维图的发表级美化，突出细胞群分布范围、重叠关系与空间边界。 输入： 已完成的 Seurat 对象（含 UMAP 降维 + 细胞注释 celltype.3），或自有 UMAP 坐标。 输出： 带群体轮廓 + 短坐标轴的 UMAP 图（ggplot 对象 plot4），颜色柔和、背景干净。 关键参数/步骤： stat_unchull(alpha=0.22, size=0.35, delta=0.45, linetype=\"dashed\") ；短轴 annotate(\"segment\")+arrow ；配色 mycols ；主题去网格/刻度/坐标轴； guides(override.aes) 优化图例。 常见错误： ggunchull 未安装； levels 与 Seurat 注释不一致致 factor NA； mycols 未覆盖全部细胞类型。 与口腔生信连接： 牙周炎/OSCC 单细胞 UMAP 分群图可直接套用，替换 Seurat 对象与 celltype 注释、按细胞类型改配色即可。 下一步处理： 暂未试用；需自己的 Seurat 单细胞对象试跑。 归库说明： 分类到 03 生信教程与工具库（可视化与配色），置信度 0.9，理由：UMAP 美化教程、含完整可复用 R 代码；代码已同步至远程 hz-bioinfo-codes/02_可视化/04_umap/4.2_单细胞UMAP美化/ 。 让审稿人一眼喜欢的 UMAP 图：单细胞美化全流程 来源公众号：华哥生信 Bioinformation（2026-08-21）｜ 配套 R 代码已同步至代码库 02_可视化/04_umap/4.2_单细胞UMAP美化/ 这类 UMAP 的特点 # 与常规 Seurat 默认 UMAP 最大的区别： 在细胞群外加半透明的群体轮廓/包络区域 ，让读者一眼看出不同细胞群的分布范围、重叠关系和空间边界。这种美化版 UMAP 更强调\"每一类细胞整体占据什么区域、不同群之间是否混杂、哪些亚群可能连续过渡\"。颜色柔和、背景干净、坐标轴简洁，通过 虚线边界 + 透明色块 增强层次感。 复现流程 # 1. 加载包 # library(Seurat) library(ggplot2) library(grid) library(ggunchull) # 绘制每个细胞群的边界轮廓 2. 读取 Seurat 对象并提取坐标 # # 读取已质控/降维/注释的单细胞对象 load(\"scRNA.rdata\") plotData \u003c- as.data.frame(scRNA.sub\u003ca href=\"%22umap%22\"\u003e\u0026quot;umap\u0026quot;\u003c/a\u003e@cell.embeddings) colnames(plotData)[1:2] \u003c- c(\"umap_1\", \"umap_2\") scRNA.sub$celltype \u003c- scRNA.sub$celltype.3 plotData$cluster \u003c- factor(scRNA.sub$celltype, levels = c(\"Tcells\", \"Myeloid\", \"Cancer\", \"Endothelial_cell\", \"Fibroblasts\", \"Neutrophils\", \"Bcells\")) 3. 自定义配色 # mycols \u003c- c( \"Tcells\" = \"#D95F5F\", \"Myeloid\" = \"#C9A227\", \"Cancer\" = \"#5DAE5D\", \"Endothelial_cell\" = \"#4DB6AC\", \"Fibroblasts\" = \"#4C78A8\", \"Neutrophils\" = \"#8E77B8\", \"Bcells\" = \"#D77FB3\" ) 4. 计算短坐标轴位置 # x_range \u003c- range(plotData$umap_1, na.rm = TRUE) y_range \u003c- range(plotData$umap_2, na.rm = TRUE) x_min \u003c- x_range[1] - 2; x_max \u003c- x_range[2] y_min \u003c- y_range[1] - 2; y_max \u003c- y_range[2] x_span \u003c- x_max - x_min; y_span \u003c- y_max - y_min x_axis_len \u003c- x_span * 0.18; y_axis_len \u003c- y_span * 0.18 x_axis_start \u003c- x_min - x_span * 0.03; y_axis_start \u003c- y_min - y_span * 0.03 x_lim \u003c- c(x_min - x_span * 0.08, x_max + x_span * 0.05) y_lim \u003c- c(y_min - y_span * 0.08, y_max + y_span * 0.05) 5. 绘制带群体轮廓的 UMAP（核心） # plot \u003c- ggplot(plotData, aes(x = umap_1, y = umap_2, color = cluster, fill = cluster)) + stat_unchull(alpha = 0.22, size = 0.35, delta = 0.45, linetype = \"dashed\") + geom_point(size = 0.8, alpha = 0.85, stroke = 0) + scale_color_manual(values = mycols, name = NULL) + scale_fill_manual(values = mycols, name = NULL) + coord_fixed(xlim = x_lim, ylim = y_lim, clip = \"off\") + labs(x = NULL, y = NULL) + theme_classic(base_size = 12) 6. 调整主题（CNS 风格） # plot2 \u003c- plot + theme( aspect.ratio = 1, panel.background = element_blank(), panel.grid = element_blank(), axis.line = element_blank(), axis.ticks = element_blank(), axis.text = element_blank(), axis.title = element_blank(), legend.position = \"right\", legend.title = element_blank(), legend.text = element_text(size = 8), legend.key.size = unit(0.35, \"cm\"), legend.background = element_blank(), legend.key = element_blank(), plot.margin = margin(20, 20, 20, 20) ) 7. 添加左下角短箭头坐标轴 # plot3 \u003c- plot2 + annotate(\"segment\", x = x_axis_start, xend = x_axis_start + x_axis_len, y = y_axis_start, yend = y_axis_start, linewidth = 0.45, color = \"black\", arrow = arrow(length = unit(0.12, \"cm\"), type = \"closed\")) + annotate(\"segment\", x = x_axis_start, xend = x_axis_start, y = y_axis_start, yend = y_axis_start + y_axis_len, linewidth = 0.45, color = \"black\", arrow = arrow(length = unit(0.12, \"cm\"), type = \"closed\")) + annotate(\"text\", x = x_axis_start + x_axis_len * 0.55, y = y_axis_start - y_span * 0.035, label = \"umap_1\", size = 3.5, fontface = \"italic\") + annotate(\"text\", x = x_axis_start - x_span * 0.035, y = y_axis_start + y_axis_len * 0.55, label = \"umap_2\", size = 3.5, fontface = \"italic\", angle = 90) 8. 优化图例并输出 # plot4 \u003c- plot3 + guides( color = guide_legend(override.aes = list(size = 2.5, alpha = 1)), fill = guide_legend(override.aes = list(alpha = 0.25)) ) 常见错误 # 问题 原因/解决 stat_unchull 未找到 装 ggunchull 包 factor 出现 NA levels 与注释不一致 配色报错 mycols 未覆盖全部类型 使用说明（可复用） # 准备含 UMAP 降维 + 细胞注释的 Seurat 对象。 替换 scRNA.sub 与 celltype 注释列、按细胞类型改 mycols 和 levels 。 完整 R 脚本见远程代码库 hz-bioinfo-codes/02_可视化/04_umap/4.2_单细胞UMAP美化/01_单细胞UMAP美化全流程.R 。 参考链接 公众号原文： https://mp.weixin.qq.com/s/bgEjYq9z9gih4viiK0COLQ ggunchull 包（CRAN）： https://CRAN.R-project.org/package=ggunchull","tags":["clippings","生信教程","可视化","UMAP","单细胞","ggunchull","群体轮廓","短坐标轴","ggplot2","暂未试用"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"可视化与配色","updated":"2026-10-25T17:37:28.597Z","url":"bioinfo-tools/notes/daf4e78387e87b596c7dd6a0.html"},{"kbId":"KB-000082","title":"三元图（Ternary plot）：组间差异比较的高颜值可视化","subtitle":"","summary":"用三元图展示一群特征（微生物、基因、代谢物、突变）在三组间的相对比例差异，正三角形三点为组，圆点为特征，离角近表示该组比例高。","body":"摘要 LLM 归库摘要 核心内容： 三元图（Ternary plot）用于展示一群特征在三组间的相对比例差异。三角形三个角=三个组别，每个点=一个特征，点离哪个角近=在该组相对比例高。 适用场景： 微生物组（OTU/ASV/属在三种样本/处理）、转录组/蛋白组/基因组特征在三分组间的比例比较；只要数据可归一化为三种变量的比例即可。 输入： 特征×三组比例/丰度数据（每行一个特征，三列=三组），或 phyloseq 对象 + 三组分组变量。 输出： 正三角形散点图（ggtern 绘制），点颜色/大小/标签可映射额外信息。 关键步骤： ① ggtern 包绘图；② microbiomeutilities::prep_ternary() 把 phyloseq 直接转三元图数据；③点大小映射平均丰度；④ geom_text 标注显著富集特征。 常见错误： 组数必须恰好为 3；三元图缺统计检验，应配合箱线图/柱状图 + Kruskal-Wallis；坐标报 \"Negative coordinates\" 需检查数据是否已转比例且非负。 与口腔生信连接： 牙周炎/OSCC 中微生物组三组比较（如健康/龈炎/牙周炎、肿瘤/癌旁/正常）可用此模板；基因表达/通路评分在不同分子亚型间比较也可用。 下一步处理： 暂未试用；R 模板已同步至远程代码库 02_可视化/03_三元图/ 。 归库说明： 分类到 03 生信教程与工具库（可视化与配色），置信度 0.88，理由：三元图可视化教程、含可复用 R 模板。 三元图（Ternary plot）— 组间差异可视化 来源公众号：Easy科研 · 纯肥瘦肉夹馍（2026-08-18）｜ 配套 R 模板已同步至代码库 组间差异可视化是理解不同组别生物学差异的关键步骤。常用箱线图、热图外， 三元图 也能用来展示一群特征在 三组 之间的比较。 原理 # 可视化形式是 正三角形 ，三个角代表三个组别。 三角形内部是一堆 圆点 ，每个点代表一个特征。 点离哪个角近 → 在相应组中 相对比例高 ；离哪个角远 → 相对比例低。 点的大小常映射平均丰度/占比。 三组联合展示示例：正三角形三点为组，圆点位置反映特征在三组的比例分布。 文献应用场景 # 三元图在生信组学中应用广泛，只要数据能归一化为三种变量的比例即可。 # 文献 期刊(IF) 三元图用途 1 Root nodule symbiosis in Lotus japonicus (2016) PNAS (9.4) 微生物 OTUs 在根/根际/根瘤中的分布 2 Core bacterial microbiota in xylem sap (2022) Nat Commun (14.7) 细菌属在三种施肥处理下的相对丰度 3 Microbiota in bladder tumors (2024) Physiol Genomics (2.5) EMT/炎症相关基因表达在三个亚型中差异 4 Microorganisms as bio-filters (2022) iMeta (23.7) 不同海拔样本微生物丰度差异 5 Seed-borne bacteria drive wheat microbiome (2025) Nat Microbiol (20.5) KEGG 功能丰度在群落间比较 6 APOBEC mutagenesis in bladder cancer (2022) Theranostics (12.4) 非沉默突变在三组 AMES 分布 7 Graph pangenome tomato (2022) Nature (50.5) SNPs/indels/SVs 解释的遗传力比例 三元图 + 其他图组合 # 三元图能直观看出分布，但 缺少统计学检验 。可通过组合弥补： 三元图 + 箱线图 ：三元图看分布 + 箱线图突出三组特异特征累计丰度的组间差异（用同一色系横向比较）。 三元图 + 柱状图 ：三元图看群落分布 + 柱状图展示主要门相对丰度并加显著性标记（Kruskal-Wallis）。 三组比较的组合表达示例：三元图展示分布，箱线图/柱状图补充统计检验。 快查数据格式 # 输入方式 说明 数据框 （通用） 每行一个特征，三列 = 三组比例/丰度。 ggtern(data, aes(x=A, y=B, z=C)) + geom_point() phyloseq 对象 （微生物） microbiomeutilities::prep_ternary(x, group=\"分组\", level=\"Genus\") 一键转三元图数据 使用指引 # R 模板位于远程代码库 hz-bioinfo-codes/02_可视化/03_三元图/01_ternary_plot_template.R ，包含： 场景 A：phyloseq 数据 → prep_ternary() 场景 B：数据框直接绘图（推荐，自备数据） 进阶： geom_text 标注显著富集特征 关键提醒（组数、统计检验、数据归一化） 参考链接 公众号原文： https://mp.weixin.qq.com/s/_gHhC6Ct-RLryrAmQ7yoOQ ggtern 包： https://CRAN.R-project.org/package=ggtern microbiomeutilities::prep_ternary： https://microsud.github.io/microbiomeutilities/reference/prep_ternary.html","tags":["clippings","生信教程","可视化","三元图","Ternary","ggtern","组间比较","微生物组","R语言","暂未试用"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"可视化与配色","updated":"2026-10-25T17:37:28.596Z","url":"bioinfo-tools/notes/bef5e3ecf296060a70a2be76.html"},{"kbId":"KB-000083","title":"张泽民院士团队爱用的”云雾感“ UMAP 图","subtitle":"","summary":"那种带有“云里雾里”感的 UMAP 如何实现呢？","body":"摘要 LLM 归库摘要 核心内容： 复现张泽民院士团队风格的\"云雾感\" UMAP 图——通过 geom_point(size=0.03, shape=16, stroke=0) 让点足够小且无描边形成\"云里雾里\"的质感，配合精选柔和配色与干净主题。 适用场景： 单细胞 UMAP/t-SNE 降维图的发表级美化；适合展示大量细胞点的整体分布而不被单点干扰。 输入： UMAP 坐标 + 细胞分群注释（如 B_UMAP.csv + metadata 合并得到 UMAP_1/UMAP_2/Cluster），或自有 Seurat 对象的坐标。 输出： BCells_Umap.png （2×2 in, 300 dpi）+ 单独图例 FigureS1C_legend.pdf ，可多亚群拼装。 关键参数/步骤： geom_point(size=0.03, shape=16, stroke=0) 是核心；配色 color \u003c- c(\"#919ac2\",\"#ffac98\",...) ； theme_classic() + 去网格/去刻度 + 坐标轴箭头； facet_grid(~label) 分面；图例单独绘制用 size=0 点 + override.aes=list(size=2) 。 常见错误： 点太大或带描边会失去\"云雾感\"；图例若随主图绘制会占空间，应单独出图后拼装；多亚群需逐一绘制再 PS 拼装。 与口腔生信连接： 牙周炎/OSCC 单细胞项目 UMAP 分群图可直接套用此风格 + 配色，形成与顶刊一致的发表级降维图。 下一步处理： 暂未试用；需 GSE243013 数据（NCBI GEO）或自有单细胞 UMAP 坐标试跑。 归库说明： 分类到 03 生信教程与工具库（可视化与配色），置信度 0.90，理由：UMAP 可视化复现教程、含完整可复用 R 代码。 新叶910 生信技能树 2025年9月2日 22:29 最近我们生信入门班的学员问起了一个大佬的文章，想知道里面的那种带有“云里雾里”感的 UMAP 如何实现！我看了下这个文献，然后找了找之前收集的张泽民院士团队的单细胞文章，发现里面全是这种风格，配色也好看，现在分享给大家！欢迎大家一键三连~ 图来自国际期刊《cell》上以Resource形式在线发表的题为《A single-cell atlas reveals immune heterogeneity in anti-PD-1-treated non-small cell lung cancer》的研究论文。曾老板在昨天也进行了介绍： 用R绘图之前可以让ai先给出草稿代码 当然是给出来全部的数据和代码啦： https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE243013 GSE243013_NMF_all_group_5.csv.gz 1.1 Kb (ftp)(http) CSV GSE243013_NSCLC_immune_scRNA_counts.mtx.gz 6.6 Gb (ftp)(http) MTX GSE243013_NSCLC_immune_scRNA_metadata.csv.gz 38.8 Mb (ftp)(http) CSV GSE243013_RAW.tar 516.4 Mb (http)(custom) TAR (of TAR) GSE243013_T_with_TCR_annotation.csv.gz 15.2 Mb (ftp)(http) CSV GSE243013_UMAP_info.tar.gz 20.6 Mb (ftp)(http) TAR GSE243013_barcodes.csv.gz 6.4 Mb (ftp)(http) CSV GSE243013_genes.csv.gz 111.5 Kb (ftp)(http) CSV 绘图 # 绘图的代码其实非常简单，先读取数据： ### ### Create: Jianming Zeng ### Date: 2023-12-31 ### Email: jmzeng1314@163.com ### Blog: http://www.bio-info-trainee.com/ ### Forum: http://www.biotrainee.com/thread-1376-1-1.html ### CAFS/SUSTC/Eli Lilly/University of Macau ### Update Log: 2023-12-31 First version ### Update Log: 2024-12-09 by juan zhang (492482942@qq.com) ### rm(list=ls()) options(stringsAsFactors = F) library(ggsci) library(dplyr) library(future) library(Seurat) library(clustree) library(cowplot) library(data.table) library(ggplot2) library(patchwork) library(stringr) library(qs) library(Matrix) # 创建目录 getwd() gse \u003c- \"GSE243013\" dir.create(gse) # 下载raw文件夹 if(F) { # https://mp.weixin.qq.com/s/uEso7yRZB300MnMhSpXH_Q library(GEOquery) # filter_regex: 指定下载的 # fetch_files = F, 返回下载链接 getGEOSuppFiles(gse,fetch_files = F)[,2] } up_pos \u003c- rio::import('GSE243013/B_UMAP.csv' ,data.table = F) head(up_pos) meta \u003c- rio::import('GSE243013/GSE243013_NSCLC_immune_scRNA_metadata.csv.gz') head(meta) df \u003c- merge(up_pos,meta,by='cellID') colnames(df) df \u003c- df[,c(2,3,11)] colnames(df) \u003c- c('UMAP_1','UMAP_2','Cluster') df$label \u003c- \"B cells\" head(df) 使用ggplot2绘图，秘诀在于： geom_point(size = 0.03,shape = 16, stroke = 0) color \u003c- c(\"#919ac2\",\"#ffac98\",\"#70a4c8\",\"#a5a9af\",\"#63917d\",\"#dbd1b4\",\"#6e729a\",\"#9ba4bd\",\"#c5ae5f\",\"#b9b8d6\") library(ggh4x) p \u003c- ggplot(df, aes(x = UMAP_1, y = UMAP_2, color = Cluster)) + geom_point(size = 0.03,shape = 16, stroke = 0) + scale_color_manual(values = color) + facet_grid(~label) + theme_classic() + # 使用简洁主题 theme( plot.background = element_blank(), # 移除背景 panel.grid.major = element_blank(), # 移除主要网格线 panel.grid.minor = element_blank(), # 移除次要网格线 margin = margin(), # 增加顶部边距 axis.title.x = element_blank(), # 移除x轴标题 axis.title.y = element_blank(), # 移除y轴标题 axis.text = element_blank(), # 移除坐标轴刻度标签 axis.ticks = element_blank(), # 移除坐标轴刻度线 axis.line = element_line(colour = \"black\", size = 0.3, arrow = arrow(length = unit(0.1, \"cm\"))), # 加粗坐标轴并添加箭头 strip.background = element_rect(fill = '#e6bac5',color=NA), strip.placement = 'outside', strip.text = element_text(size = 8), legend.position = \"none\", aspect.ratio = 1) + scale_x_continuous(limits = c(min(df$UMAP_1), max(df$UMAP_1)) ) + # 设置x轴范围 scale_y_continuous(limits = c(min(df$UMAP_2), max(df$UMAP_2)) ) # 设置y轴范围 p ggsave(filename = \"BCells_Umap.png\",height = 2,width = 2,plot = p,dpi = 300,bg = \"white\") 图例绘制 # 这里图例单独绘制： ggplot(data = df, aes(x = UMAP_1, y = UMAP_2, color = Cluster)) + geom_point(size = 0, shape = 16,stroke = 0) + theme_void()+ scale_color_manual(values = color, name = '') + theme( aspect.ratio = 1, legend.position = 'bottom', plot.margin = margin(0,0,0,0) ) + guides(color = guide_legend( ncol = 2, override.aes = list(size = 2, alpha = 1) )) + theme(legend.text = element_text(size = 5), legend.spacing.y = unit(0, 'cm'), legend.key.height = unit(0,\"cm\"), legend.box.spacing = unit(0, 'cm')) ggsave( \"FigureS1C_legend.pdf\", width = 3.5, height = 6, dpi = 500 ) 注意上面图片的保存格式，最后将两个图组合在一起就可以啦！ 多个亚群都绘制然后用PS软件拼装在一起！ 此外，我们的生信入门班每月都有一期，最近一期在9月8号开课， 生信入门\u0026数据挖掘线上直播课9月班 报名咨询 # 招生对象 # 「生信入门班：」 生物、医学、农学等方向需要学习生物信息学数据分析的人，本科、硕博、生信相关公司职员、医生等。 「数据挖掘班：」 医学、网络药理学等方向需要利用生物信息学工具挖掘公共数据以及做下游分析的人，往期学员以医学生、医生为主。 「选择困难症患者指南：」 非医学方向直接选择生信入门班（3699元）。 医学相关方向两个课程均适用，按需选择： 如果你只需要挖掘公共数据，或者从公司提供的表达矩阵开始做后续分析，可以选择数据挖掘班（2899元）。 如果你需要自己做上游+下游分析，选择生信入门班。 如果你还是选择困难，两个都要，联合报名优惠价4199元。 「注：」 两个班都有R语言课程，是完全一致的；也都有下游分析内容，数据挖掘班的下游分析有更多的医学方向针对性，比如生存分析，数据挖掘文章图表复现等。 关于答疑 # 答疑我们诚意十足，真心满满，典型的问题我们会给出详细的答疑，之前答疑合集： 生信马拉松答疑专辑 ，获取你的生信专属答疑 马拉松授课互动答疑 ，里面包含了我们整理的每一期超详细的答疑 生信故事会 ，来看看他们的生信入门故事 培训内容 # 快来上车，风里雨里就等你！ # 绘图小技巧2025 · 目录 闪记 复制 LaTeX 公式","tags":["clippings","生信教程","可视化","UMAP","单细胞","云雾感","ggplot2","Seurat","暂未试用"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"可视化与配色","updated":"2026-10-25T17:37:28.596Z","url":"bioinfo-tools/notes/07a2c5f76be66efdc2e96a4a.html"},{"kbId":"KB-000081","title":"CNS 级配色合集｜张泽民团队论文色板拆解（01–02）","subtitle":"","summary":"张泽民团队两篇论文（Pan-cancer B cell subtypes；Liver tumour immune microenvironment）的全场景单细胞色板拆解合集：UMAP/柱状图/热图/气泡图多场景配色 + R 颜色代码 + 连续变量渐变色阶。","body":"摘要 LLM 归库摘要 核心内容： 张泽民团队两篇论文的全场景单细胞配色拆解合集：①Pan-cancer B cell subtypes（多色/四色/三色/双色离散色板）；②Liver tumour immune microenvironment（多色/三色/两色 + Diverging/Sequential 连续变量渐变色阶）。 适用场景： 单细胞 UMAP/t-SNE 亚群配色、组织来源/临床分组柱状图箱线图、Log2FC/表达量热图、细胞通讯气泡图与 FeaturePlot 密度图。 输入： R 环境 + ggplot2； pal_npg() 需 ggpubr 包， brewer.pal() 需 RColorBrewer 包。 输出： 可直接用于 scale_color_manual / scale_fill_manual 的离散色板向量，以及 colorRampPalette 生成的连续色阶。 关键参数： 01 多色 19+9+9 色、四色 16 色、三色 15 色、双色 10 色；02 多色 6 组（5-12 色）、三色 3 组、两色 3 组；连续变量 Diverging（RdYlBu/Spectral/RdBu/navy-white-firebrick）与 Sequential（Reds/Greens/YlOrRd）。 常见错误： 01 的 03/04 组与原代码同名 Subset_color_panel 会互相覆盖，建议改名； pal_npg 依赖 ggpubr； brewer.pal 依赖 RColorBrewer。 与口腔生信连接： 牙周炎/OSCC 单细胞 UMAP 亚群、组间比例图、Marker 热图可直接套用这两套色板，形成与 CNS 文章一致的发表级配色。 下一步处理： 暂未试用；建议下一个单细胞项目作图时套用，对比默认配色效果后沉淀\"使用记录\"。 归库说明： 分类到 03 生信教程与工具库（可视化与配色工具页），置信度 0.9，理由：公众号配色教程合集、含可复用 R 代码，非单篇论文剪藏。 系列说明 来源公众号：R科生。本页为 CNS 级配色系列合集 ，收录两篇张泽民团队论文的色板拆解： 篇 拆解对象 侧重 01 （2026-04-13） 《Pan-cancer single-cell dissection reveals phenotypically distinct B cell subtypes》 离散分组色板（多色/四色/三色/双色） 02 （2026-05-13） 《Liver tumour immune microenvironment subtypes and neutrophil heterogeneity》 多色/三色/两色 + 连续变量渐变色阶 （Log2FC / 表达量 / 百分比） 两篇互补： 01 覆盖离散分组 ， 02 补充连续变量色阶 （正好补上 01 篇付费区缺失的热图渐变色）。 01 · Pan-cancer B cell subtypes 核心色板适用场景 # 场景 图类型 说明 多色离散 UMAP / t-SNE 15-20 种复杂细胞亚群分群 分组对比 柱状图 / 比例图 / 箱线图 / 条形图 / 折线图 Tumor / Blood / Adjacent 组织来源及临床分组对比 连续变量 热图 Log2FC 差异热图、基因表达量热图、RO/E 评分专用色阶 细胞通讯/密度 气泡图 / 密度图 Interaction count 与 FeaturePlot 密度优化 色板速查 # 01 多色 ： Subset_color_panel1 （19 色）、 Subset_color_panel2 （9 色）、 Subset_color_panel3 （pal_npg 9 色）→ UMAP/t-SNE 大群数分群 02 四色 ：16 色，按 4 色为一组 → 分组柱状图/箱线图 03 三色 ：15 色，按 3 色为一组 → 三分组对比 04 双色 ：10 色，按 2 色为一组 → 两两对比 05 连续变量 ：原文付费区未剪到代码；已由本页 02 篇渐变色阶 补充通用方案 R 颜色代码 # # ===== 01 多色（UMAP / t-SNE，15-20 亚群）===== Subset_color_panel1 \u003c- c( \"#e5d25b\", \"#599014\", \"#e78071\", \"#a82d06\", \"#4592bf\", \"#d38219\", \"#74a764\", \"#8ca2b4\", \"#cbb190\", \"#e7ca8d\", \"#9d9ec3\", \"#ebafa4\", \"#5e8a89\", \"#ecd577\", \"#7c606c\", \"#5c6489\", \"#ECE4B7\", \"#D36135\", \"#467599\" ) Subset_color_panel2 \u003c- c( \"#CED6C3\", \"#98C9DD\", \"#207CB5\", \"#A6D38E\", \"#37A849\", \"#F69595\", \"#EB2A2A\", \"#FCBA71\", \"#f78200\" ) Subset_color_panel3 \u003c- pal_npg(\"nrc\")(9) # 需 library(ggpubr) # ===== 02 四色（Tumor / Blood / Adjacent 等分组）===== Subset_color_panel \u003c- c( \"#5BC0EB\", \"#9BC53D\", \"#C3423F\", \"#FDE74C\", \"#E18727\", \"#0072B5\", \"#BC3C29\", \"#20854E\", \"#DEF1F5\", \"#D83215\", \"#FAD9C5\", \"#0F7B9F\", \"#EF7B1B\", \"#643A90\", \"#ADD487\", \"#6BC3D0\" ) # ===== 03 三色 ===== # 注意：原名与 02 相同（Subset_color_panel），直接运行会覆盖，建议改名再使用 Subset_color_panel \u003c- c( \"#78290f\", \"#ff7d00\", \"#ffecd1\", \"#e76f51\", \"#f4a261\", \"#e9c46a\", \"#5BC0EB\", \"#9BC53D\", \"#C3423F\", \"#0F8C43\", \"#D0D72F\", \"#ED8F26\", \"#F4BF70\", \"#548BB1\", \"#C4545F\" ) # ===== 04 双色 ===== # 注意：原名与 02/03 相同，建议改名，如 Subset_color_panel2col Subset_color_panel \u003c- c( \"#CC341B\", \"#187697\", \"#E5B91A\", \"#1068B1\", \"#94BB40\", \"#5CB4DC\", \"#F3A8AA\", \"#9FD8EB\", \"#CC341B\", \"#D3D3D3\" ) 02 · Liver tumour immune microenvironment subtypes and neutrophil heterogeneity 拆解论文：张泽民团队《Liver tumour immune microenvironment subtypes and neutrophil heterogeneity》。色板分多色、三色、两色、连续变量映射四类，颜色代码见下。 R 颜色代码 # # ===== 01 多色（UMAP / t-SNE 亚群）===== my_palette1 \u003c- c( \"#9D2B28\", \"#42A35B\", \"#88CBC0\", \"#BBD984\", \"#9D7BB5\", \"#BBB7D6\", \"#C4D8EB\", \"#91B9D3\", \"#EE7C6F\", \"#F09BB0\", \"#F5B267\" ) my_palette2 \u003c- c( \"#9BC0D4\", \"#256C9F\", \"#A7CB83\", \"#2C8A3A\", \"#E6908F\", \"#C82520\", \"#ECB46A\", \"#E47820\", \"#D0BEDA\", \"#6B4C9C\", \"#F5D73D\", \"#C99577\" ) my_palette3 \u003c- c( \"#8DD3C7\", \"#FFFFB3\", \"#BEBADA\", \"#B3DE69\", \"#FB8072\", \"#80B1D3\", \"#FCCDE5\", \"#FDB462\" ) my_palett4 \u003c- c( # 注意原文即写作 my_palett4（少个 e），建议改名 my_palette4 \"#C2E3DD\", \"#FCFAD7\", \"#DBD8E9\", \"#D5E7B2\", \"#F6BAB4\", \"#BCD5E5\", \"#F8E1ED\", \"#FAD6AD\" ) my_palette5 \u003c- c( \"#62B99D\", \"#F5E66C\", \"#B179B1\", \"#F6CADE\", \"#ACD16C\", \"#D5241F\", \"#A1C9DB\", \"#357DAE\", \"#86A1AD\", \"#F5CA9A\", \"#D1BDD6\" ) my_palette6 \u003c- c( \"#DA4B35\", \"#4DB1C9\", \"#129981\", \"#3A5182\", \"#EA977C\" ) # ===== 02 三色（三分组对比）===== my_palette7 \u003c- c(\"#D95858\", \"#427AAF\", \"#B37652\") my_palette8 \u003c- c(\"#F4B163\", \"#88CBC1\", \"#BCB9D7\") my_palette9 \u003c- c(\"#F08961\", \"#63BA9F\", \"#8B9CC5\") # ===== 03 两色（两两对比）===== my_palette10 \u003c- c(\"#C92521\", \"#3271A2\") my_palette11 \u003c- c(\"#EF8961\", \"#63B99F\") my_palette12 \u003c- c(\"#AA562C\", \"#F5CF1F\") 连续变量渐变色阶（来自 02，补 01 缺失项） 适用于 Log2FC 差异热图、基因表达量热图、UMAP 连续特征、细胞比例/评分。 colorRampPalette 来自 R 自带 grDevices ； brewer.pal 需 RColorBrewer 包。 # ===== Diverging（双向，0 居中性变量）===== # 适合 Z-score、LogFC：高值一色 / 低值另一色，中间白或浅色 my_colors \u003c- colorRampPalette(rev(brewer.pal(11, \"RdYlBu\")))(50) my_colors \u003c- colorRampPalette(rev(brewer.pal(11, \"Spectral\")))(50) my_colors \u003c- colorRampPalette(rev(brewer.pal(11, \"RdBu\")))(50) color \u003c- colorRampPalette(c(\"navy\", \"white\", \"firebrick3\"))(50) # ===== Sequential（单向，从低到高）===== # 适合表达量、百分比：单一色系由浅到深 my_colors \u003c- colorRampPalette(rev(brewer.pal(11, \"Reds\")))(50) my_colors \u003c- colorRampPalette(rev(brewer.pal(11, \"Greens\")))(50) my_colors \u003c- colorRampPalette(rev(brewer.pal(11, \"YlOrRd\")))(50) 选色建议： Z-score / LogFC（有正有负） → 用 Diverging（ RdBu / Spectral / navy-white-firebrick ）。 表达量 / 百分比（≥0） → 用 Sequential（ Reds / Greens / YlOrRd ）。 配合 ggplot： scale_fill_gradientn(colors = my_colors) 或 scale_fill_gradient2(low, mid, high) 。 使用建议 离散配色 ：传给 ggplot 的 scale_color_manual(values=...) / scale_fill_manual(values=...) ，或 Seurat DimPlot(cols=...) 。 连续配色 ： scale_fill_gradientn(colors=my_colors) ，或 scale_fill_gradient2(low, mid, high) 。 避免覆盖 ： 01 篇的 03/04 组与原代码同名（ Subset_color_panel ），复用时建议重命名（如 panel_tricolor 、 panel_duocolor ）； 02 篇 my_palett4 原文少一个 e，建议改名 my_palette4 。 包依赖 ： pal_npg() 来自 ggpubr ； brewer.pal() 来自 RColorBrewer ； colorRampPalette() 为 R 自带。未安装时先 install.packages(c(\"ggpubr\", \"RColorBrewer\")) 。 与口腔生信连接 牙周炎 / OSCC 单细胞项目的 UMAP 细胞亚群配色 （01 篇多色面板，10-20 群；或 02 篇 my_palette1-6 ）。 组织来源分组 （Tumor / Blood / Adjacent）柱状图、比例图可用 01 篇四色面板或 02 篇三色/两色面板。 Marker 表达热图、Log2FC 差异热图 用 02 篇的 Diverging / Sequential 渐变色阶。 套用后建议在本页下方追加\"使用记录\"，沉淀实际效果与微调。 待补充 01 篇原文付费区（可试读 92%）的 RO/E 评分专用色阶 仍缺失——通用 LogFC/表达量色阶已由 02 篇补齐，但 RO/E 评分如属专属配色仍需原文确认。 02 篇原文\"连续变量映射\"配图与说明细节（图中标注）未逐条转录，如需可补。 原始出处 01 ：R科生《【CNS 级配色 01】张泽民：全场景单细胞色板拆解》 — https://mp.weixin.qq.com/s/raaFRAyASUiE8ZKTNlAokw 02 ：R科生《【CNS 级配色 02】》 — https://mp.weixin.qq.com/s/hSNhVvVMBxszEbQKDfL0Sw 声明：本文内容仅供交流学习，禁止用于商业用途，侵权请联系删除。","tags":["clippings","CNS配色","可视化","单细胞","色板","R语言","ggpubr","RColorBrewer","暂未试用"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"可视化与配色","updated":"2026-10-25T17:37:28.595Z","url":"bioinfo-tools/notes/41835dfc3662713555d90021.html"},{"kbId":"KB-000080","title":"academic-research-skills 使用说明","subtitle":"","summary":"这套技能来自 Imbad0202/academic-research-skills ，核心目标是把「选题与研究设计 - 文献调研 - 论文写作 - 完整性核查 - 模拟审稿 - 修改 - 复审 - 定稿」拆成可复用的学术工作流。 当前已安装的 4 个 skill： Skill 版本 用途一句话 : --- deep-research 2.9.4 做深度研究、文献综述、事实核查、系统综述和研究问题澄清 academic-paper 3.1.2 写论文、写摘要、写大纲、改稿、查引","body":"这套技能来自 Imbad0202/academic-research-skills ，核心目标是把「选题与研究设计 -\u003e 文献调研 -\u003e 论文写作 -\u003e 完整性核查 -\u003e 模拟审稿 -\u003e 修改 -\u003e 复审 -\u003e 定稿」拆成可复用的学术工作流。 当前已安装的 4 个 skill： Skill 版本 用途一句话 deep-research 2.9.4 做深度研究、文献综述、事实核查、系统综述和研究问题澄清 academic-paper 3.1.2 写论文、写摘要、写大纲、改稿、查引用、格式转换和 AI 使用声明 academic-paper-reviewer 1.9.1 模拟期刊审稿，输出多视角 review、editorial decision 和 revision roadmap academic-pipeline 3.9.4.2 串联完整研究到发表流程，负责调度前 3 个 skill 和质量关卡 安装位置： 环境 路径 Codex ~/.codex/skills WSL Claude Code ~/.claude/skills 使用前建议重启 Codex / Claude Code，让新安装的 skills 被重新扫描。 1. 最快选择指南 # 不知道该用哪个时，按下面选。 你的任务 推荐 skill 推荐模式 我只有一个模糊研究方向，想先想清楚 deep-research socratic 我有明确研究问题，要做完整调研报告 deep-research full 我只想快速了解一个主题 deep-research quick 我要做文献综述 deep-research 或 academic-paper 调研用 lit-review ；写成论文用 academic-paper lit-review 我要系统综述 / meta-analysis / PRISMA deep-research systematic-review 我要核查某些事实、引用或结论是否可靠 deep-research fact-check 我要从头写一篇论文 academic-paper full 我要先规划论文结构 academic-paper plan 我要写论文大纲 academic-paper outline-only 我要修改已有论文 academic-paper revision 我收到了审稿意见，想整理修改路线 academic-paper revision-coach 我要查引用格式、参考文献、DOI academic-paper citation-check 我要转 LaTeX / DOCX / PDF / 改 citation style academic-paper format-convert 我要生成投稿用 AI disclosure academic-paper disclosure 我要模拟期刊审稿 academic-paper-reviewer full 我要快速看一下稿件质量 academic-paper-reviewer quick 我只关心方法和统计问题 academic-paper-reviewer methodology-focus 我要检查 revision 是否真正回应审稿意见 academic-paper-reviewer re-review 我要从研究选题一直做到定稿 academic-pipeline 自动分阶段 一句话规则： 还没形成论文，只是在查资料、澄清研究问题：用 deep-research 。 已经要写文章、摘要、大纲、回复审稿意见：用 academic-paper 。 已经有 manuscript，需要外部审稿视角：用 academic-paper-reviewer 。 想把整个流程从调研跑到定稿：用 academic-pipeline 。 2. 怎么调用 # 这些 skills 主要靠自然语言触发。你可以直接说任务，也可以显式指定 skill，显式指定通常更稳。 2.1 Codex 中调用 # 示例： 使用 deep-research，帮我调研单细胞转录组中 doublet detection 方法的最新进展，输出文献矩阵和关键争议。 使用 academic-paper，基于我提供的结果写一篇生信方法学论文，先进入 plan 模式，不要直接写全文。 使用 academic-paper-reviewer，按 Nature Methods 风格审稿这篇 manuscript，重点看 novelty、benchmark 和 reproducibility。 2.2 Claude Code 中调用 # WSL 里的 Claude Code 会从 ~/.claude/skills 读取 skills。进入 claude 后直接发： Use academic-pipeline for an end-to-end research-to-paper workflow on this project. 或中文： 请用 academic-pipeline 帮我从研究调研到论文定稿跑完整流程。主题是：空间转录组数据中的细胞类型反卷积方法比较。 2.3 建议的固定开场模板 # 请使用 [skill 名称]。 任务：[你要做什么] 领域：[例如：bioinformatics / single-cell RNA-seq / bulk RNA-seq / spatial transcriptomics] 已有材料：[论文 PDF / 结果表 / 图 / 代码 / 数据链接 / 参考文献] 目标输出：[文献矩阵 / 大纲 / manuscript / review report / revision roadmap / LaTeX] 约束：[语言、字数、期刊、引用格式、是否需要联网核查、是否要保守] 3. deep-research ：深度研究与文献调研 # deep-research 适合在写论文之前使用，也适合做事实核查、系统综述、证据综合和研究方向澄清。 3.1 适用场景 # 你有一个宽泛主题，需要收敛成可研究的问题。 你要做一个领域综述、技术路线调研或政策/方法分析。 你需要比较多个方法、数据库、工具或实验设计。 你要核查论文中的 claim 是否被文献支持。 你要做 PRISMA systematic review 或 meta-analysis。 你要把调研结果交给 academic-paper 写成论文。 3.2 模式表 # Mode 适合任务 主要输出 socratic 研究方向模糊，需要引导式提问 Research Plan Summary、INSIGHT collection、候选 RQ full 有明确 RQ，需要完整研究报告 APA 7.0 research report，通常 3000-8000 words quick 快速了解主题 500-1500 words research brief review 评估一段已有文本或论文 Reviewer report lit-review 文献综述与证据整合 Annotated bibliography、synthesis、gap analysis fact-check 核查具体事实、数据、引用 Verification report systematic-review 系统综述、meta-analysis、PRISMA PRISMA report、RoB、GRADE、forest plot data 3.3 工作流 # deep-research 默认分 6 个阶段： Scoping：把主题变成研究问题，评估 FINER 标准。 Methodology：设计研究范式、方法、数据策略和分析框架。 Investigation：系统检索、筛选文献、建立 annotated bibliography。 Verification：核查来源质量、证据等级、掠夺性期刊风险和利益冲突。 Synthesis：主题综合、矛盾证据处理、gap analysis。 Report：写成 APA 7.0 报告，并经过 editorial / ethics / devil's advocate 检查。 3.4 常用提示词 # 模糊选题澄清 请使用 deep-research 的 socratic 模式。 我对单细胞多组学整合感兴趣，但还没有明确研究问题。 请通过提问帮我收敛到 2-3 个可研究、可发表的方向。 每轮只问最关键的问题，不要直接替我下结论。 生信主题快速调研 请使用 deep-research 的 quick 模式。 主题：bulk RNA-seq 差异表达分析中 DESeq2、edgeR、limma-voom 的适用场景。 输出： 1. 方法差异表 2. 适用/不适用场景 3. 常见误用 4. 5-10 篇关键参考文献 完整文献综述 请使用 deep-research 的 lit-review 模式。 主题：spatial transcriptomics 中 cell type deconvolution 方法。 要求： 1. 按方法类别组织：reference-based、reference-free、probabilistic、deep learning 2. 给出每类代表工具、输入输出、假设和局限 3. 输出 literature matrix 4. 标出尚未解决的问题和潜在研究切入点 事实核查 请使用 deep-research 的 fact-check 模式。 核查以下 claim 是否成立： \"scVI 在所有单细胞批次校正任务中都优于 Harmony 和 Seurat integration。\" 请逐条检查： 1. 是否过度概括 2. 支持和反对证据 3. 适用条件 4. 更准确的表述 5. 可引用文献 系统综述 / Meta-analysis 请使用 deep-research 的 systematic-review 模式。 主题：机器学习模型预测肿瘤免疫治疗响应的外部验证表现。 请先输出 protocol： 1. PICO/PECO 2. 数据库和检索式 3. inclusion / exclusion criteria 4. 主要和次要 outcome 5. RoB 工具 6. 是否适合 meta-analysis 的判断标准 等我确认后再继续。 3.5 输出如何交给 academic-paper # 完成调研后，可以直接说： 基于刚才 deep-research 的 RQ Brief、Methodology Blueprint、Annotated Bibliography 和 Synthesis Report， 请切换到 academic-paper 的 plan 模式，帮我规划一篇 manuscript。 推荐保留的交接材料： Research Question Brief Methodology Blueprint Annotated Bibliography Synthesis Report Evidence / Literature Matrix INSIGHT Collection（如果用了 socratic ） 4. academic-paper ：论文写作、修改和格式化 # academic-paper 是写作主力。它不是单纯续写文本，而是把论文写作拆成配置、文献、结构、论证、正文、引用、摘要、内部审阅、格式化等阶段。 4.1 适用场景 # 从研究问题和结果出发写完整 manuscript。 写论文大纲、章节结构、argument blueprint。 写摘要、关键词、投稿声明。 基于 reviewer comments 修改文章。 把无结构审稿意见整理成 revision roadmap。 查引用、修参考文献、转换 citation style。 生成 LaTeX、DOCX、PDF、Markdown。 4.2 10 个模式 # Mode 触发语义 输出 full Write a paper / 写论文 完整论文 draft，必要时含图表代码 outline-only Paper outline / 论文大纲 详细大纲、evidence map revision Revise paper / 修改论文 修订稿、修改记录、response to reviewers abstract-only Write abstract / 写摘要 中英双语摘要和关键词 lit-review Literature review paper 文献综述型论文材料 format-convert 转 LaTeX / DOCX / citation style 格式化文档和引用格式转换 citation-check Check citations / 查引用 Citation error report plan Guide my paper / 帮我规划论文 Chapter Plan、INSIGHT Collection revision-coach Parse reviews / 收到审稿意见 Revision Roadmap、tracking template、response skeleton disclosure AI disclosure for venue 期刊/会议投稿用 AI 使用声明 4.3 写作流程 # full 模式通常分 8 个 phase： Phase 内容 产物 0 Configuration Paper Configuration Record 1 Literature Search Strategy、Source Corpus 2 Architecture Paper Outline、Evidence Map 3 Argumentation Argument Blueprint 4 Drafting Complete Draft 5a Citations Citation Audit Report 5b Abstract Bilingual Abstract、Keywords 6 Peer Review Internal Review Report 7 Format LaTeX / DOCX / PDF / Markdown 关键规则： Phase 0 的 Paper Configuration Record 需要用户确认。 Phase 2 的 outline 需要用户确认后再继续写正文。 引用必须核查，不能保留无法确认的文献。 revision 最多 2 轮，无法解决的问题进入 Acknowledged Limitations。 每篇论文都应包含 Data Availability、Ethics、Author Contributions、COI、Funding、AI disclosure 等声明。 4.4 写作前最好准备什么 # 最少需要： 论文主题或研究问题 学科领域 目标文章类型：IMRaD、review、case study、theoretical paper、policy brief、conference paper 等 目标期刊或会议 字数范围 引用格式：APA 7、Chicago、MLA、IEEE、Vancouver 输出格式：Markdown、LaTeX、DOCX、PDF 已有材料：结果表、图片、代码、参考文献、实验设计、数据来源 生信 manuscript 推荐额外提供： 数据来源：GEO / SRA / TCGA / ArrayExpress / 自有数据 accession number 样本分组、纳入排除标准 预处理流程 软件版本和参数 统计方法和多重检验校正 图表列表 代码仓库或可复现性说明 4.5 常用提示词 # 先规划，不直接写全文 请使用 academic-paper 的 plan 模式。 主题：基于单细胞 RNA-seq 的肿瘤微环境细胞互作分析。 已有材料：初步 UMAP、marker gene 表、cell-cell communication 分析结果、20 篇参考文献。 目标：规划一篇偏生信应用研究的 manuscript。 要求： 1. 先帮我确认 paper type 和目标期刊层级 2. 输出完整大纲和每节核心论点 3. 标出哪些结果还不足以支撑结论 4. 不要直接写全文 从结果写完整论文 请使用 academic-paper 的 full 模式。 论文类型：bioinformatics application paper，IMRaD 结构。 主题：利用公开 bulk RNA-seq 数据构建肝癌免疫相关 prognostic signature。 已有材料： - 差异基因表 - Cox/LASSO 模型结果 - KM、ROC、nomogram 图 - immune infiltration 分析结果 - validation cohort 结果 目标期刊：BMC Bioinformatics 或 Frontiers in Immunology 风格。 引用格式：Vancouver。 输出：Markdown 初稿，随后再转 LaTeX。 要求：保守表述，避免夸大 biomarker 的临床价值。 写摘要 请使用 academic-paper 的 abstract-only 模式。 根据下面 manuscript 内容写中英双语摘要。 要求： 1. 英文 250 words 左右 2. 中文 400-500 字 3. 结构包含 Background、Methods、Results、Conclusion 4. 给出 5-7 个 keywords 5. 不要添加正文没有支持的结果 处理审稿意见 请使用 academic-paper 的 revision-coach 模式。 下面是 reviewer comments，请先整理成 Revision Roadmap。 要求： 1. 按 reviewer 和 issue 编号 2. 标注 CRITICAL / MAJOR / MINOR 3. 判断每条意见是否合理 4. 给出建议回应策略 5. 输出 response letter skeleton 改稿 请使用 academic-paper 的 revision 模式。 输入材料： 1. 原 manuscript 2. Reviewer comments 3. Revision Roadmap 4. 我已经新增的分析结果 要求： 1. 只修改与审稿意见相关的部分 2. 不要无根据扩展结论 3. 对每条 reviewer comment 生成 response 4. 标出 manuscript 中对应修改位置 查引用 请使用 academic-paper 的 citation-check 模式。 检查这篇 manuscript 的所有引用。 要求： 1. 核查 DOI、标题、作者、年份是否匹配 2. 检查正文引用和 reference list 是否一一对应 3. 标出疑似不存在或信息混合的引用 4. 输出需要替换或删除的参考文献清单 生成 AI disclosure 请使用 academic-paper 的 disclosure 模式。 目标期刊/会议：Nature Methods。 AI 使用情况： - 用 AI 辅助整理文献 - 用 AI 辅助润色英文 - 统计分析和结论由作者完成并人工核查 请生成投稿用 AI usage disclosure，并说明适合放在 manuscript 的哪个位置。 5. academic-paper-reviewer ：模拟审稿 # academic-paper-reviewer 用来模拟完整 peer review。它会配置 5 个角色：Editor-in-Chief、methodology reviewer、domain reviewer、cross-disciplinary perspective reviewer、Devil's Advocate，最后合成 editorial decision 和 revision roadmap。 5.1 适用场景 # 投稿前想知道 manuscript 的主要硬伤。 需要模拟目标期刊审稿风格。 想专门查方法学、统计学或可复现性问题。 收到 revision 后，想检查回复是否真正解决问题。 想把 review 结果交给 academic-paper revision 修改。 5.2 6 个模式 # Mode 适合任务 输出 full 完整预审 5 份 review report、editorial decision、revision roadmap re-review 检查修回稿 traceability matrix、residual issues、新 decision quick 快速质量评估 EIC quick assessment、key issues methodology-focus 方法/统计专项审查 深入 methodology review guided 通过提问理解问题 Socratic guided review calibration 校准审稿器可靠性 FNR/FPR、balanced accuracy、confidence disclosure 5.3 输出内容 # 完整 review 通常包括： Reviewer Configuration Card EIC Review Methodology Review Domain Review Perspective Review Devil's Advocate Report Editorial Decision Letter Revision Roadmap Devil's Advocate 特别重要，它会找： 最强反驳 逻辑链断点 cherry-picking confirmation bias alternative explanations stakeholder blind spots \"So what?\" significance 问题 关键规则： Reviewer 只读稿件，不直接修改 manuscript。 Synthesizer 不能编造 reviewer 没提过的问题。 Devil's Advocate 发现 CRITICAL 问题时，最终 decision 不能是 Accept。 每条 criticism 应该有具体位置、问题说明和修改建议。 5.4 常用提示词 # 投稿前完整审稿 请使用 academic-paper-reviewer 的 full 模式。 目标期刊风格：Genome Biology / Nature Communications 水平。 稿件类型：bioinformatics application paper。 重点审查： 1. novelty 是否足够 2. benchmark 是否公平 3. validation cohort 是否充分 4. 统计方法是否合理 5. 结果是否过度解释 6. 代码和数据可复现性 请输出 editorial decision 和按优先级排序的 revision roadmap。 方法学专项审查 请使用 academic-paper-reviewer 的 methodology-focus 模式。 只审查方法、统计和可复现性。 请重点看： 1. 差异分析设计是否合理 2. batch effect 是否处理得当 3. 多重检验校正是否正确 4. 模型训练/验证是否有 data leakage 5. 图表和统计报告是否符合规范 修回稿复审 请使用 academic-paper-reviewer 的 re-review 模式。 输入： 1. 第一轮 Revision Roadmap 2. 修订稿 3. Response to Reviewers 请逐条判断： 1. 作者声称已解决的问题是否真的解决 2. 是否产生新问题 3. 是否还有 blocking issue 4. 给出新的 editorial decision 快速预审 请使用 academic-paper-reviewer 的 quick 模式。 给这篇 manuscript 做 15 分钟快速预审。 输出： 1. 最可能导致 desk reject 的 5 个问题 2. 最值得保留的 3 个优点 3. 投稿前必须补的分析 4. 是否建议进入完整 review 6. academic-pipeline ：完整研究到论文流程 # academic-pipeline 是调度器，不自己写内容，而是按阶段调用 deep-research 、 academic-paper 、 academic-paper-reviewer 和完整性核查 agent。 6.1 适用场景 # 你想从一个研究主题一路做到投稿前定稿。 你想强制加入引用核查、完整性核查、模拟审稿、复审等质量关卡。 你有已有论文，想从中途进入：review、revision、finalize。 你要保留过程记录，方便复盘人机协作和版本变化。 6.2 10 个阶段 # Stage 名称 调用对象 产物 1 RESEARCH deep-research RQ Brief、Methodology、Bibliography、Synthesis 2 WRITE academic-paper Paper Draft 2.5 INTEGRITY integrity_verification_agent 引用、数据、claim 完整性核查 3 REVIEW academic-paper-reviewer 5 份 review + decision + roadmap 4 REVISE academic-paper revision Revised Draft、Response 3' RE-REVIEW academic-paper-reviewer re-review 修订验证报告 4' RE-REVISE academic-paper revision 第二轮修订稿 4.5 FINAL INTEGRITY integrity_verification_agent 最终完整性核查 5 FINALIZE academic-paper format-convert MD / DOCX / LaTeX / PDF 6 PROCESS SUMMARY orchestrator Paper Creation Process Record 6.3 状态机 # flowchart TD A[\"Stage 1: Research\"] --\u003e B[\"Stage 2: Write\"] B --\u003e C[\"Stage 2.5: Integrity Check\"] C --\u003e|PASS| D[\"Stage 3: Review\"] C --\u003e|FAIL| B D --\u003e|Accept| H[\"Stage 4.5: Final Integrity\"] D --\u003e|Minor/Major Revision| E[\"Stage 4: Revise\"] D --\u003e|Reject| B E --\u003e F[\"Stage 3': Re-review\"] F --\u003e|Accept/Minor| H F --\u003e|Major| G[\"Stage 4': Re-revise\"] G --\u003e H H --\u003e|PASS| I[\"Stage 5: Finalize\"] H --\u003e|FAIL| G I --\u003e J[\"Stage 6: Process Summary\"] 6.4 Checkpoint 规则 # academic-pipeline 的核心特点是不会一路自动冲到底，而是在关键阶段要求确认。 必须确认的点： 每个 stage 完成后都要确认是否进入下一阶段。 Stage 2.5 和 Stage 4.5 的 integrity check 不能跳过。 Review decision 后必须明确选择下一步。 Finalize 前必须确认内容正确。 如果质量下降、引用不可靠或 reviewer concern 没处理完，应该暂停。 6.5 断点恢复 # 高级用法： export ARS_PASSPORT_RESET=1 启用后，pipeline 会把某些完整 checkpoint 记录成可恢复边界。新会话中可用： resume_from_passport=\u003chash\u003e 适合长项目跨会话继续，尤其是完整论文流程很长时。 6.6 常用提示词 # 从零开始 请使用 academic-pipeline，帮我跑完整 research-to-paper 工作流。 主题：空间转录组数据中细胞类型反卷积方法的系统比较。 目标：最终产出一篇 bioinformatics review 或 methods comparison paper。 要求： 1. 先从 deep-research socratic 或 full 进入 2. 每个阶段结束后给我 checkpoint 3. 引用、claim 和数据来源必须核查 4. 最终输出 Markdown + LaTeX 已有论文，从 review 进入 请使用 academic-pipeline。 我已经有一篇 manuscript，不需要从 research 开始。 请从 Stage 2.5 integrity check 或 Stage 3 review 开始。 目标：投稿前预审、修改、复审、最终完整性核查。 收到审稿意见，从 revision 进入 请使用 academic-pipeline。 我已经收到 reviewer comments，请从 Stage 4 revision 开始。 输入材料： 1. 原稿 2. reviewer comments 3. editor letter 4. 新增分析结果 目标：生成 revision roadmap、修订稿、response letter，然后做 re-review。 7. 生信场景实战模板 # 7.1 单细胞论文选题到写作 # 请使用 academic-pipeline。 项目方向：单细胞 RNA-seq 分析肿瘤免疫微环境。 已有材料： - Seurat object - 细胞注释结果 - marker gene 表 - UMAP / violin / dotplot - pathway enrichment - cell-cell communication 结果 目标：形成一篇应用型生信论文。 流程要求： 1. 先用 deep-research 检查该方向 novelty 和可发表切入点 2. 再用 academic-paper plan 模式设计 manuscript 结构 3. 写作时保守表述，不把相关性解释成因果 4. review 阶段重点检查细胞注释、batch effect、样本量和验证不足 7.2 预后模型论文防止过度包装 # 请使用 academic-paper-reviewer 的 methodology-focus 模式。 稿件主题：基于 TCGA + GEO 构建肿瘤预后 signature。 请重点检查： 1. 训练集/验证集是否独立 2. feature selection 是否 data leakage 3. LASSO/Cox 的流程是否规范 4. KM / ROC / C-index 是否充分 5. nomogram 是否有 calibration 6. immune infiltration 结论是否过度解释 7. 是否缺少外部验证或实验验证 输出按 CRITICAL / MAJOR / MINOR 分类。 7.3 RNA-seq 方法比较综述 # 请使用 deep-research 的 lit-review 模式。 主题：bulk RNA-seq 差异表达分析方法比较。 比较对象：DESeq2、edgeR、limma-voom、sleuth。 输出： 1. 方法假设与模型差异 2. 适用样本量和数据分布 3. normalization 策略 4. dispersion estimation 差异 5. 典型 benchmark 文献 6. 实践建议和常见误区 最后给出可转化为 review paper 的大纲。 7.4 工具/算法论文 reviewer 模拟 # 请使用 academic-paper-reviewer 的 full 模式。 稿件是一篇新的 bioinformatics tool paper。 请模拟 Bioinformatics / Genome Biology 风格审稿。 重点： 1. 该工具是否解决真实痛点 2. 与 SOTA 工具比较是否公平 3. benchmark 数据集是否覆盖多场景 4. runtime、memory、robustness 是否报告 5. ablation study 是否足够 6. 代码、文档、安装和示例是否可复现 7. 是否有真实 biological discovery case 7.5 只做 claim 核查 # 请使用 deep-research 的 fact-check 模式。 核查下面这些 manuscript claims： 1. [claim 1] 2. [claim 2] 3. [claim 3] 请对每条输出： - Verdict: Supported / Partially supported / Unsupported / Overstated - 支持证据 - 反证或限制条件 - 更准确的改写 - 可引用文献 8. 推荐 Obsidian 项目结构 # 建议每个论文项目单独建一个文件夹： ProjectName/ 00 Dashboard.md 01 Research Question.md 02 Literature Matrix.md 03 Methodology Blueprint.md 04 Paper Outline.md 05 Argument Blueprint.md 06 Manuscript Draft.md 07 Citation Audit.md 08 Review Report.md 09 Revision Roadmap.md 10 Response to Reviewers.md 11 Final Integrity Check.md 12 Process Record.md refs/ figures/ tables/ data-notes/ 8.1 推荐文件命名 # YYYY-MM-DD Topic - deep-research full.md YYYY-MM-DD Topic - literature matrix.md YYYY-MM-DD Topic - academic-paper plan.md YYYY-MM-DD Topic - manuscript v0.1.md YYYY-MM-DD Topic - reviewer full.md YYYY-MM-DD Topic - revision roadmap.md 8.2 每次运行后建议记录 # ## Run Metadata - Date: - Skill: - Mode: - Input files: - Output files: - Key decisions: - Unverified claims: - Next action: 9. 质量与完整性检查清单 # 9.1 文献和引用 # 每条关键 claim 都有来源。 每条参考文献真实存在。 DOI、标题、作者、年份匹配。 正文 citation 和 reference list 一一对应。 没有把多篇论文信息混成一条引用。 没有只引用支持结论的文献，也报告反向证据。 旧文献被标注为 seminal 或被更新文献补充。 9.2 生信分析 # 数据来源和 accession number 可追溯。 样本纳入排除标准清楚。 软件版本、参数、阈值写明。 normalization、batch correction、QC 标准清楚。 差异分析有多重检验校正。 模型训练和验证没有 data leakage。 外部验证和敏感性分析充分。 结论没有把相关性写成因果。 图表能从数据或代码复现。 9.3 写作 # Introduction 的 gap 明确，不是泛泛背景。 Methods 具体到可复现。 Results 只报告结果，不夹带过度解释。 Discussion 区分发现、解释、局限和展望。 Limitations 明确。 Data Availability、Code Availability、Ethics、COI、Funding、Author Contributions 齐全。 AI disclosure 与目标期刊政策匹配。 9.4 审稿前 # 用 academic-paper citation-check 查一遍引用。 用 academic-paper-reviewer methodology-focus 查方法。 用 academic-paper-reviewer full 做一次完整预审。 把 CRITICAL / MAJOR 问题处理后再投稿。 修订后用 re-review 检查是否真的回应了 roadmap。 10. 常见坑和规避 # 常见坑 后果 推荐处理 直接让 AI 写全文，不先确认 RQ 和 outline 文章结构虚、论点散 先用 deep-research socratic 或 academic-paper plan 引用看起来像真的但没核查 可能出现假引用 必跑 citation-check 或 pipeline integrity 综述只列论文，不综合矛盾证据 像 annotated bibliography 用 deep-research lit-review 要求 synthesis 和 contradiction handling reviewer comment 全盘接受 修改可能偏离论文核心 用 revision-coach 判断合理/不合理 预后模型论文过度宣称临床价值 审稿高风险 明确要求保守表述和外部验证检查 单细胞分析缺少 batch/QC/annotation 说明 方法学硬伤 用 methodology-focus 专审 pipeline 太长导致上下文压力 中途质量下降 使用 checkpoint、保存 Material Passport、必要时新会话 resume 11. 一套推荐的完整用法 # 11.1 从想法到论文 # deep-research socratic ：澄清研究方向。 deep-research full 或 lit-review ：形成研究报告和文献矩阵。 academic-paper plan ：设计论文结构和论证路线。 academic-paper full ：写初稿。 academic-paper citation-check ：查引用。 academic-paper-reviewer methodology-focus ：查方法学硬伤。 academic-paper-reviewer full ：模拟投稿前审稿。 academic-paper revision ：按 revision roadmap 修改。 academic-paper-reviewer re-review ：检查修改是否充分。 academic-paper format-convert ：转目标格式。 academic-paper disclosure ：生成 AI disclosure。 11.2 一句话启动完整流程 # 请使用 academic-pipeline，帮我从研究问题澄清、文献调研、论文规划、初稿、完整性核查、模拟审稿、修改、复审到最终格式化跑完整流程。 主题：[你的主题] 领域：[例如 single-cell RNA-seq / spatial transcriptomics / cancer bioinformatics] 目标期刊：[可选] 输出格式：[Markdown / LaTeX / DOCX / PDF] 每个阶段结束后请给 checkpoint，等我确认再继续。 12. 快速索引 # 需求 直接复制这句 澄清选题 请使用 deep-research 的 socratic 模式，先通过提问帮我收敛研究问题。 快速调研 请使用 deep-research 的 quick 模式，给我主题摘要、关键文献和争议点。 文献综述 请使用 deep-research 的 lit-review 模式，输出 literature matrix、synthesis 和 gap analysis。 系统综述 请使用 deep-research 的 systematic-review 模式，先生成 PRISMA protocol。 论文规划 请使用 academic-paper 的 plan 模式，先规划结构和论证，不要直接写全文。 写全文 请使用 academic-paper 的 full 模式，基于我提供的材料写 manuscript。 写摘要 请使用 academic-paper 的 abstract-only 模式，写中英双语摘要和 keywords。 查引用 请使用 academic-paper 的 citation-check 模式，核查所有引用和 DOI。 审稿意见整理 请使用 academic-paper 的 revision-coach 模式，把 reviewer comments 整理成 revision roadmap。 改稿 请使用 academic-paper 的 revision 模式，按 roadmap 修改并生成 response letter。 模拟审稿 请使用 academic-paper-reviewer 的 full 模式，模拟目标期刊审稿。 查方法 请使用 academic-paper-reviewer 的 methodology-focus 模式，只查方法、统计和可复现性。 修回稿复审 请使用 academic-paper-reviewer 的 re-review 模式，检查 revision 是否逐条回应。 全流程 请使用 academic-pipeline，按 research -\u003e write -\u003e integrity -\u003e review -\u003e revise -\u003e re-review -\u003e finalize 跑完整流程。","tags":["AI/skill","academic-research","paper-writing","ClaudeCode","Codex","生信"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"方法笔记","updated":"2026-10-25T17:37:28.594Z","url":"bioinfo-tools/notes/bdf669fde0a717790a0086ec.html"},{"kbId":"KB-000079","title":"蔡司显微镜免疫荧光图片处理软件下载","subtitle":"","summary":"蔡司 ZEN 免疫荧光图像软件的官网下载与安装教程；文中共享账号凭据已在公开版中脱敏。","body":"摘要 LLM 归库摘要 核心内容： 从蔡司中国官网下载并安装 ZEN 软件，用于处理蔡司显微镜拍摄的免疫荧光图片；文中另附 ZEN2.0 / 3.3 / 3.8 的作者共享安装包链接。 适用场景： 拿到蔡司 .czi 等显微图像后，需要用官方软件打开、检查通道、调显示和导出处理结果。输入是蔡司显微图像或安装包，输出是本机可用的 ZEN 软件环境。官网提供专业版和轻便版，按硬件和需求选择；安装后优先执行更新和登录验证。 关键参数： ZEN 版本（2.0 / 3.3 / 3.8）、专业版或轻便版、安装包保存目录、账号登录状态。 常见错误： 忘记先更新安装组件；官网登录失败时未检查网络或账号状态；网盘链接失效或提取码输入错误；低配电脑安装过重的专业版导致卡顿。 口腔生信连接： 若口腔样本免疫荧光切片由蔡司显微镜采集，可用 ZEN 做图像查看与预处理；后续定量或批处理可再导出到 ImageJ/Fiji、QuPath、CellProfiler 或 Python。 下一步处理： 本机实际安装一个版本，确认 .czi 打开、通道显示和导出流程后把 trial_status 改为已试用。 归库说明： 已迁入 03 生信教程与工具库/02_wiki/methods/ ；用户确认原文中的账号密码为作者提供的公共账号，保留原文信息。 蔡司显微镜免疫荧光图片处理软件下载 原创 药理实验屋 药理实验笔记 | 2025年3月31日 00:00 上海 用蔡司显微镜拍的免疫荧光图片需要用蔡司官方平台的软件处理，官网中提供了免费下载的专业版和轻便版软件，用户可以根据需要自行下载。 1、打开蔡司中国的官网： https://www.zeiss.com.cn/corporate/home.html 2、登录账户：自己注册，也可以使用平台的（账户： [账号已脱敏] ，密码：[密码已脱敏]） 3、选择要下载的软件 4、直接下载，然后打开 5、更新一下 6、登录 7、安装 8、安装包 这里提供三个版本的安装包供大家使用： ZEN2.0 链接: https://pan.baidu.com/s/1VgVXoabR7h1rCqj0uMZ3mQ?pwd=5ax6 提取码: 5ax6 ZEN3.3 链接: https://pan.baidu.com/s/11hqvGXoyXOr7_s0cXf24ww?pwd=5exk 提取码: 5exk ZEN3.8 链接: https://pan.baidu.com/s/1DTQ0zRJIswPxya4ySPCVRQ?pwd=s4ri 提取码: s4ri","tags":["clippings","蔡司显微镜","免疫荧光","ZEN","图像处理","软件下载","生信教程","暂未试用"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"方法笔记","updated":"2026-10-25T17:37:28.594Z","url":"bioinfo-tools/notes/40db10ca537edbd0cffb5a2b.html"},{"kbId":"KB-000076","title":"R语言保存单细胞对象：RData、RDS和qs2怎么选？","subtitle":"","summary":"R语言保存单细胞对象格式对比教程：RData/RDS/qs2","body":"摘要 LLM 归库摘要 核心内容： 对比 R 语言保存单细胞对象的三种序列化格式：.RData/.rda 可一次保存多个带名称对象；.rds 保存单个对象且读取时返回变量；.qs2 是 qs 后继格式，读写更快但需安装 qs2 包。文章逐项列出优缺点和实际选择建议。 适用场景： Seurat、SingleCellExperiment 等复杂 R 对象的保存、加载、分享；频繁读写大型单细胞对象的分析流程。 输入： 内存中的 R 对象（Seurat 对象、列表、矩阵等）。 输出： .RData、.rds 或 .qs2 文件及对应读取方法。 关键参数： save()/load()、saveRDS()/readRDS()、qs_save()/qs_read()；qs2 可通过 qs_to_rds() 转回 RDS。 常见错误： load() 会直接覆盖同名变量；旧 qs 与 qs2 格式不兼容；共享文件给他人前需确认目标环境已安装 qs2。 口腔生信连接： 牙周组织、口腔黏膜免疫细胞等单细胞对象可先以 .rds 保存，若对象很大且频繁读写，再测试 .qs2 的速度和体积收益。 下一步处理： 用自有单细胞对象实测三种格式的读写耗时和文件大小，记录结果后决定项目默认格式。 归库说明： 微信公众号「谢大飞」教程，无 DOI/PMID，含 R 代码，归入生信教程 methods。 写在开头 # 上周末在长沙参与了 暑期特训长沙站：Codex赋能单细胞+空间转录组线下培训班来袭！ ,在单细胞课程中，学习到了同事分享的三种单细胞数据保存方法。 这三种方式本质上都是将 R 内存中的对象序列化后保存到磁盘，以便在之后的分析中重新读取。它们与 CSV、TSV 这类通用表格格式不同，主要面向 R 对象，可以保存矩阵、列表、因子、稀疏矩阵，以及 Seurat、SingleCellExperiment 等结构复杂的对象。 平时做单细胞分析时，我用得最多的是 RDS，另外两种方式接触得相对少一些。正好借着这次课程，把三种格式放在一起梳理一下，看看它们分别适合什么场景。 .RData / .rda格式 # .RData 和 .rda 是同一种格式，只是扩展名习惯不同。它们通过 save() 保存，通过 load() 读取。最大的特点是： 一个文件可以同时保存多个带名称的 R 对象 。 例如： save( sce.all, top5, mycolors, file = \"sce_total.RData\") 这里保存了三个对象： sce.all top5 mycolors 读取时： load(\"sce_total.RData\") 优点 （1）可以一次保存多个对象：例如单细胞分析中，可以把表达对象、分组信息和差异分析结果一起保存； （2）对象名称也会被保存：不需要读取时重新指定名称，原来叫 sce.all 的对象，加载后仍然叫 sce.all 。 （3）不需要安装额外软件包，在绝大多数 R 环境中都可以直接使用。 缺点 （1） load() 会直接向环境中创建对象，如果文件里也有一个 sce.all ，当前对象可能被直接覆盖。 （2）代码的可读性和数据流不够明确，无法立即知道接下来产生了哪些对象。 （3）多个对象保存在同一个文件中时，不方便独立管理。即使只需要其中一个对象，通常也要先加载整个文件。 .rds格式 # RDS 使用 saveRDS() 保存一个对象，使用 readRDS() 读取。 例如： saveRDS( sce.all, file = \"sce.all.rds\") 读取： sce.all \u003c- readRDS(\"sce.all.rds\") RDS 文件一次保存的是 一个 R 对象 。但这个对象本身可以是复杂列表，所以仍然可以间接保存多个内容。 例如： result \u003c- list( sce = sce.all, group = group, dat = dat)saveRDS(result, \"analysis_result.rds\") 读取： result \u003c- readRDS(\"analysis_result.rds\")sce.all \u003c- result$scegroup \u003c- result$groupdat \u003c- result$dat 优点 （1）读取时不会自动污染当前环境，文件内容只会作为函数返回值出现，不会悄悄在工作区生成多个变量。 （2）可以自由决定读取后的对象名称，文件内部不绑定变量名称，更灵活。 （3）无需安装额外软件包， saveRDS() 和 readRDS() 都属于 base R。 （4）通用性和长期可读性通常较好，由于它是 R 官方基础序列化格式，在不同服务器或不同项目之间传递时，通常不需要先安装专门的序列化包。 缺点 （1）一个文件直接保存一个顶层对象，如果要保存多个内容，需要先组织成列表。 （2）对于体积较大的单细胞对象，RDS 的保存和读取可能比较耗时。实际速度与对象结构、压缩方式、CPU 性能和磁盘读写速度有关，因此不能简单地认为 RDS 在所有场景下都更慢。 qs2格式 # 新的 qs2 包 # qs2 是 qs 的后继项目。需要注意的是，旧版 qs 和新版 qs2 使用的文件格式并不兼容，因此建议分别使用 .qs 和 .qs2 扩展名进行区分。本文主要介绍新的 qs2 。 安装： install.packages(\"qs2\") 保存： library(qs2)qs_save(sce.all, \"sce.all.qs2\") 读取： sce.all \u003c- qs_read(\"sce.all.qs2\") 优点 （1）通常面向更快的读写性能设计，对于大型单细胞对象，尤其是大矩阵、列表和复杂对象，通常值得测试。 （2）在部分大型对象上， .qs2 可以在读写速度和文件大小之间取得较好的平衡。不过，文件是否比 RDS 更小取决于对象结构和压缩参数，不能一概而论。 以我这次使用的单细胞对象为例， .qs2 文件比对应的 .rds 文件更小。不过，这只是当前数据上的结果，不同对象的测试结果可能不同。 （3）可以与 RDS 转换，由于 .qs2 使用 R 序列化机制，可以转换成 RDS： qs2::qs_to_rds( input_file = \"sce.all.qs2\", output_file = \"sce.all.rds\") 转换完成后： sce.all \u003c- readRDS(\"sce.all.rds\") 缺点 （1）依赖额外的软件包，读取前必须安装： install.packages(\"qs2\") ，而 .RData 和 .rds 不需要第三方包。 （2）不适合把文件交给没有 qs2 的环境，如果将文件发送给其他人，对方必须知道这是 .qs2 ，并安装匹配的软件包。 （3）旧 qs 和新 qs2 的文件格式不兼容，不能把旧 .qs 文件直接当成 .qs2 文件读取，也不能只修改扩展名完成转换。 实际分析中该怎么选？ # 如果只保存一个 Seurat 或 SingleCellExperiment 对象，我通常还是优先使用 RDS，它的优点是代码清楚、依赖少，文件发给别人后也更容易读取。 如果对象很大，而且分析过程中需要频繁保存和读取，可以测试一下 .qs2。 .RData，它更适合一次保存多个相关对象，或者临时保留某个分析阶段的工作现场。不过，读取时要注意同名对象被覆盖的问题。","tags":["clippings","生信教程","R语言","单细胞","RData","RDS","qs2","Seurat","数据保存","暂未试用"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"方法笔记","updated":"2026-10-25T17:37:28.593Z","url":"bioinfo-tools/notes/03012212b7be3ebae7e1cd4a.html"},{"kbId":"KB-000077","title":"Zenodo 数据快速下载","subtitle":"","summary":"面向 Zenodo 大数据下载的 Python + aria2c 方法教程，含完整可复用代码与 MD5 校验流程","body":"摘要 LLM 归库摘要 核心内容： 用 Zenodo REST API 获取 record 文件列表与 MD5，生成 aria2c 输入清单，断点续传并行下载，最后逐文件校验 MD5。 适用场景： 单细胞或生信数据集存放在 Zenodo，网页下载慢或中断时；输入为 record ID 与目标文件列表，输出为已下载文件与校验报告。关键参数为 RECORD_ID 、 OUT_DIR 、 TARGET_FILES 、 CONNECTIONS_PER_FILE 、 PARALLEL_FILES 。 下一步处理： 安装 requests tqdm PySocks 与 aria2c ；将示例的 RECORD_ID/OUT_DIR/TARGET_FILES 改成实际数据；建议先用小文件试跑，再开全量下载。 归库说明： 归类为 03 生信教程与工具库方法页，远程脚本归档到 hz-bioinfo-codes/04_数据下载与备份/4.1_Zenodo加速下载/ 。 Zenodo 数据快速下载 Zenodo 是 CERN 数据中心支持的科研数据存储库。网页直接点击下载通常只有 100-200 kB/s 且容易中断，改用 Zenodo 官方 REST API + aria2c 断点续传 + MD5 校验会更稳定。 方案 # Python requests 调用 https://zenodo.org/api/records/\u003crecord_id\u003e ，拿到 files[].key 、 files[].checksum 、 files[].size 。 按需过滤 TARGET_FILES ，生成 zenodo_aria2_urls.txt ，每条记录包含下载 URL 和 out= 文件名。 调用 aria2c -i 清单 -c -x 4 -s 4 -j 2 断点续传、分块并发下载。 用 Zenodo 返回的 md5: 校验值逐文件校验，失败文件提示删除重下。 环境准备（Windows PowerShell） # python -m pip install -U pip python -m pip install requests tqdm PySocks python -c \"import requests, tqdm; print('Python packages OK')\" winget install -e --id aria2.aria2 aria2c --version 关键参数 # RECORD_ID = \"14726428\" OUT_DIR = Path(r\"D:\\Zenodo_Download\\CropLayer_2020\") TARGET_FILES = [] # 空列表 = 下载全部；非空 = 只下载指定文件 CONNECTIONS_PER_FILE = 4 # 单文件连接数，不要过大 PARALLEL_FILES = 2 # 同时下载文件数 HEADERS = {\"User-Agent\": \"Zenodo-Downloader/1.0\"} 完整脚本 # from pathlib import Path from urllib.parse import quote import hashlib import subprocess import requests import sys RECORD_ID = \"14726428\" OUT_DIR = Path(r\"D:\\Zenodo_Download\\CropLayer_2020\") TARGET_FILES = [] CONNECTIONS_PER_FILE = 4 PARALLEL_FILES = 2 HEADERS = {\"User-Agent\": \"Zenodo-Downloader/1.0\"} def fetch_record_metadata(record_id: str) -\u003e dict: api_url = f\"https://zenodo.org/api/records/{record_id}\" response = requests.get(api_url, headers=HEADERS, timeout=60) response.raise_for_status() return response.json() def normalize_checksum(checksum: str) -\u003e str | None: if not checksum: return None if checksum.startswith(\"md5:\"): return checksum.split(\"md5:\", 1)[1] return checksum def build_download_url(record_id: str, filename: str) -\u003e str: return f\"https://zenodo.org/records/{record_id}/files/{quote(filename)}?download=1\" def write_aria2_input(files: list[dict], url_file: Path) -\u003e None: with url_file.open(\"w\", encoding=\"utf-8\") as f: for item in files: name = item[\"key\"] f.write(build_download_url(RECORD_ID, name) + \"\\n\") f.write(f\" out={name}\\n\") def run_aria2(url_file: Path, out_dir: Path) -\u003e None: cmd = [ \"aria2c\", \"-i\", str(url_file), \"-d\", str(out_dir), \"-c\", \"-x\", str(CONNECTIONS_PER_FILE), \"-s\", str(CONNECTIONS_PER_FILE), \"-j\", str(PARALLEL_FILES), \"--max-tries=10\", \"--retry-wait=20\", \"--timeout=60\", \"--connect-timeout=30\", \"--continue=true\", \"--auto-file-renaming=false\", \"--allow-overwrite=true\", ] subprocess.run(cmd, check=True) def md5sum(path: Path, block_size: int = 1024 * 1024 * 8) -\u003e str: h = hashlib.md5() with path.open(\"rb\") as f: while True: block = f.read(block_size) if not block: break h.update(block) return h.hexdigest() def check_files(files: list[dict], out_dir: Path) -\u003e None: failed = [] for item in files: name = item[\"key\"] expected_md5 = normalize_checksum(item.get(\"checksum\", \"\")) local_file = out_dir / name if not local_file.exists(): failed.append(name) continue if not expected_md5: continue if md5sum(local_file).lower() != expected_md5.lower(): failed.append(name) if failed: print(\"以下文件校验失败或缺失，建议删除后重新下载：\", *failed, sep=\"\\n - \") else: print(\"全部文件 MD5 校验通过。\") def main(): OUT_DIR.mkdir(parents=True, exist_ok=True) record = fetch_record_metadata(RECORD_ID) all_files = record.get(\"files\", []) if not all_files: sys.exit(\"没有读取到 files 字段，请检查 record ID 或网络连接。\") if TARGET_FILES: target_set = set(TARGET_FILES) files = [f for f in all_files if f[\"key\"] in target_set] missing = target_set - {f[\"key\"] for f in files} if missing: sys.exit(f\"以下 TARGET_FILES 未找到：{missing}\") else: files = all_files url_file = OUT_DIR / \"zenodo_aria2_urls.txt\" write_aria2_input(files, url_file) run_aria2(url_file, OUT_DIR) check_files(files, OUT_DIR) if __name__ == \"__main__\": main() 实测参考 # 网页直连：约 100-200 kB/s，大文件易中断。 学校 WiFi + API/aria2：约 1 MB/s。 示例数据： https://doi.org/10.5281/zenodo.14726428 注意事项 # aria2c 是系统级工具，不要安装在 Python 虚拟环境里。 并发参数过大会触发 Zenodo 限流，先用 4 和 2 起步。 下载完成后必须校验 MD5；Zenodo 未提供 checksum 时单独记录跳过。 大文件下载目录放数据盘，避免 C 盘空间不足。 图片 #","tags":["clippings","Zenodo","aria2","数据下载","断点续传","MD5校验","Python","生信教程","暂未试用"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"方法笔记","updated":"2026-10-25T17:37:28.593Z","url":"bioinfo-tools/notes/024947d3d0bb705ec2bfd55f.html"},{"kbId":"KB-000078","title":"单细胞 Ro/e、Augur、miloR：细胞分布、扰动响应与差异丰度分析","subtitle":"","summary":"单细胞分析教程，系统讲解 Ro/e、Augur 与 miloR 的 R 实战流程，含完整代码与方法参考文献。","body":"摘要 LLM 归库摘要 核心内容： 原文将单细胞中的三个互补问题拆开处理：Ro/e 用观测/期望细胞数判断组织位置的相对富集；Augur 以分类 AUC 排序最受条件扰动影响的细胞类型；miloR 在 KNN 邻域层面检验差异丰度。 适用场景： 已完成 QC、整合、降维和细胞注释的 scRNA-seq 数据，研究疾病/对照、治疗前后、解剖位置或时间状态的细胞组成与连续状态改变。 输入： 带样本 ID、条件/位置与细胞类型 metadata 的 Seurat 对象；miloR 还要求真实生物学重复、PCA 和 UMAP。 输出： Ro/e 热图、Augur AUC 优先级图、miloR 邻域 logFC/SpatialFDR、显著邻域注释与可选 marker。 关键参数/步骤： Ro/e 需检查低细胞数亚群；Augur 的高 AUC 是转录组可分离性；miloR 的 k 、PCA 维度和 prop 决定邻域尺度，设计矩阵必须按样本而非单个细胞构建。 常见错误： 把 Ro/e 当作样本层面的显著性；把 Augur AUC 当成细胞比例或因果结论；没有生物学重复仍对 miloR 输出作强统计解释；沿用原文示例的 SpatialFDR \u003c 0.9 宽松阈值。 与口腔生信连接： 可用于牙周炎或 OSCC 中病灶/邻近组织的免疫-基质分布、治疗扰动敏感细胞类型与内部状态连续变化；对候选状态继续连接 ligand-receptor、ligand-to-target、TF activity/regulon 和外部验证。 归库说明： 已将原文 17 张图本地化；可复用代码整理并同步至私有 hz-bioinfo-codes 的 01_单细胞/1.5_Roe_Augur_miloR细胞分布扰动差异丰度分析/ 。 原文信息 # 标题： 单细胞实战之 Ro/e、Augur、miloR - 入门到进阶（中级篇 4） 作者/公众号： 凑齐六个字吧 / 单细胞天地 发表时间： 2025-04-06 09:34 原文链接： https://mp.weixin.qq.com/s/AVQJEYiF7TApDnRzyYXFWA 文章示例： 结直肠癌 T 细胞数据，使用左右半结肠位置作为比较条件。 方法定位 # 方法 回答的问题 输入核心列 主结果 应如何解释 Ro/e / STARTRAC-distribution 某细胞亚群是否在某个组织/位置相对富集或耗竭？ celltype 、 sample 、 location 观测/期望细胞数比值 \u003e 1 为相对富集， \u003c 1 为相对耗竭；先检查细胞数和样本组成 Augur 哪个细胞类型受疾病、治疗或位置等扰动的转录影响最大？ celltype 、 condition 每种细胞类型的 AUC AUC 越高，条件间表达越可分；不是细胞数量变化 miloR 同一大类细胞内部的连续状态/邻域是否在条件间出现差异丰度？ sample 、 condition 、PCA、UMAP、 celltype 邻域 logFC、SpatialFDR、细胞类型注释 以生物学样本为统计单位；适合传统离散 cluster 比例比较遗漏的连续状态 三者不是替代关系。对同一数据，Ro/e 先给出解剖分布描述，Augur 定位扰动反应最明显的细胞类型，miloR 再在该细胞类型内部检验哪些连续邻域发生丰度变化。 Ro/e：组织分布倾向 # Ro/e 属于 STARTRAC-distribution 框架。它比较某细胞亚群在位置中的实际细胞数与按总体细胞比例推导的期望数： $$ Ro/e = \\frac{\\text{observed cell count}}{\\text{expected cell count}} $$ Ro/e \u003e 1 ：该位置的相对富集。 Ro/e \u003c 1 ：该位置的相对耗竭。 原文示例中，Treg 在左半结肠具有更高细胞数和 Ro/e；Naive T 在右半结肠更高。 这是相对组成指标，若某亚群细胞极少或样本间捕获量差异大，结果会不稳定。不能把单细胞总数当作独立生物学重复。 Augur：扰动响应的细胞类型优先级 # Augur 为每种细胞类型训练分类器，测试该细胞类型的转录组能否预测实验条件。以交叉验证 AUC 排序后，高 AUC 的细胞类型被认为对条件变化更敏感。 可以比较疾病/健康、治疗前后、空间位置、时间点或体外刺激。 原文使用左右半结肠作为条件，Naive T 的 AUC 最高，表示该群体的表达状态最能区分两类位置。 plot_lollipop() 适合比较各群 AUC， plot_umap() 可用 rank/default 模式将优先级映射到 UMAP。 AUC 衡量表达可分离性，不等于细胞比例、细胞活性强弱或因果作用；应结合样本层面 DE、通路、转录因子活性和外部验证。 miloR：KNN 邻域差异丰度 # miloR 将细胞放到 PCA KNN 图中，从图中抽取重叠的邻域。随后按样本统计每个邻域的细胞数，在设计矩阵中检验条件差异，并使用考虑邻域重叠的 Spatial FDR 校正。 标准流程 # 将 Seurat 转为 SingleCellExperiment ，再建立 Milo 对象。 用与已有邻居图一致的 PCA 维度 d 和邻居数 k 构建 KNN 图。 用 makeNhoods() 建立代表性邻域。原文提示 prop 通常从 0.1-0.2 试起，并检查邻域大小直方图是否在约 50-100 个细胞附近形成合理峰值。 用 countCells() 按真实样本 ID 统计邻域细胞数。 建立样本级 design.df ，并使其顺序严格匹配 nhoodCounts() 的列。 用 calcNhoodDistance() 和 testNhoods() 检验条件差异；优先查看 SpatialFDR 。 用 annotateNhoods() 、 buildNhoodGraph() 、 plotNhoodGraphDA() 、 plotDAbeeswarm() 解读显著邻域及其主导细胞类型。 对可信 DA 邻域，可用 groupNhoods() 聚合方向一致的邻域，再用 findNhoodGroupMarkers() 和 testDiffExp() 找 marker。 统计边界 # miloR 的差异丰度测试依赖生物学样本重复。若一组只有一个样本或条件与批次完全混杂，只能作为探索性图形，不能当作可靠的群体统计。 原文示例为演示后续分组使用了 SpatialFDR \u003c 0.9 。正式分析不应直接继承这一阈值；本次整理脚本默认 0.10 ，并应按研究设计预先定义。 k 、 d 、 prop 会改变邻域大小与局部结构。应与 Seurat 的 PCA/FindNeighbors 设置协调，而不是跨数据集原样复用。 可复用代码 # 远程私有代码库已整理为： hz-bioinfo-codes/01_单细胞/1.5_Roe_Augur_miloR细胞分布扰动差异丰度分析/01_Roe组织分布倾向分析.R hz-bioinfo-codes/01_单细胞/1.5_Roe_Augur_miloR细胞分布扰动差异丰度分析/02_Augur扰动响应优先级分析.R hz-bioinfo-codes/01_单细胞/1.5_Roe_Augur_miloR细胞分布扰动差异丰度分析/03_miloR差异丰度分析.R hz-bioinfo-codes/01_单细胞/1.5_Roe_Augur_miloR细胞分布扰动差异丰度分析/04_README.md 这些脚本已移除原文固定 .qs 路径、左右半结肠样本名和未经验证的宽松阈值。运行前只需在脚本顶部替换 Seurat .rds 路径与 metadata 列名。 与口腔单细胞分析的衔接 # 对于牙周炎和 OSCC，可设定病灶/邻近组织、疾病分期或治疗前后为条件： 用 Ro/e 描述髓系、T/NK、B/浆细胞、成纤维细胞和内皮亚群在解剖区域间的相对组成。 在每个大类中运行 Augur，找出受病理条件影响最大的细胞类型。 在 Augur 高优先级的大类中运行 miloR，识别传统 cluster 比例分析可能漏掉的连续状态变化。 对显著 DA 状态，进一步完成 ligand-receptor -\u003e ligand-to-target -\u003e TF activity/regulon ，并结合空间转录组、IHC/IF、bulk 队列或独立 scRNA 队列验证。 参考资料 # STARTRAC GitHub: https://github.com/Japrin/STARTRAC Augur GitHub: https://github.com/neurorestore/Augur miloR 官方文档: https://marionilab.github.io/miloR/ Zhang et al. Lineage tracking reveals dynamic relationships of T cells in colorectal cancer . Nature, 2018. Skinnider et al. Cell type prioritization in single-cell data . Nature Biotechnology, 2021. Dann et al. Differential abundance testing on single-cell data using k-nearest neighbor graphs . Nature Biotechnology, 2022.","tags":["clippings","生信教程","单细胞","Ro/e","STARTRAC","Augur","miloR","差异丰度","Seurat","R语言","暂未试用"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"方法笔记","updated":"2026-10-25T17:37:28.593Z","url":"bioinfo-tools/notes/d752ea5080d12b20b5bd98a2.html"},{"kbId":"KB-000074","title":"Bulk转录组 PCA 美化图：二维、三维与 ggbiplot","subtitle":"","summary":"三篇微信公众号教程均围绕 R 语言 PCA 计算、样本分组椭圆、变量贡献/相关和图形美化，适合作为 Bulk RNA-seq 样本 QC 与结果展示的可复用方法页。","body":"摘要 LLM 归库摘要 核心内容： 三篇教程分别覆盖 FactoMineR/factoextra 的二维 PCA 美化、从表达矩阵到碎石图/样本图/变量贡献图/biplot 的完整 prcomp 流程，以及 ggbiplot 的分组椭圆、相关环和变量向量。第一篇还展示 pca3d 三维 PCA。 适用场景： Bulk RNA-seq 的样本关系检查、批次效应/离群样本初筛、分组可视化和候选高变异基因的解释性展示。PCA 图应作为 QC 和探索性分析，不替代差异检验。 输入： 基因 × 样本的表达矩阵，以及至少包含样本 ID 和分组列的样本信息表。PCA 不建议直接对原始 count 做未经说明的距离计算；优先使用 logCPM、DESeq2 VST/rlog 或其他记录清楚的变换值。 输出： PC1/PC2 样本散点图、可选 95% 分组椭圆、碎石图、样本 scores、变量贡献/ cos2 表、biplot；三维图仅作为可选探索输出。 关键参数： 样本/基因矩阵方向、中心化与 scale. 、高变异基因或 MAD 筛选数、椭圆置信水平、 ggbiplot 的 var.axes / circle 和变量标签数量。 常见错误： 把行列方向弄反；样本信息没有按表达矩阵列名重排；把分组椭圆当作显著性检验；直接用原始 count；复制公众号代码中的未定义变量、排版换行或调色板拼写。 与口腔生信连接： 可用于牙周炎、OSCC 或口腔黏膜 bulk RNA-seq 的样本 QC、病变/对照分组检查和批次效应排查。发现稳定分组差异后，再连接 DEG、通路富集及细胞组成/免疫浸润分析；PCA 本身不能证明机制。 归库说明： 三篇原文证据页位于 03 生信教程与工具库/01_sources/web_clips/ ；可复用脚本已整理到私有 hz-bioinfo-codes 的 04_Bulk转录组/4.2_PCA/ 。 一、三篇教程的互补关系 # 教程 主要工具 适合复用的部分 需要警惕 03 生信教程与工具库/01_sources/web_clips/使用R语言美化PCA图-原文存档 FactoMineR 、 factoextra 、 pca3d 二维样本图、 ggplot2 主题修饰、三维探索 原文存在 iris.pca / res.pca 命名不一致和调色板拼写问题 03 生信教程与工具库/01_sources/web_clips/PCA主成分分析实战和可视化-原文存档 prcomp 、 factoextra 表达矩阵读入、MAD 排序、碎石图、变量贡献、biplot 公众号排版导致代码粘连； scale 不能脱离数据量级和噪声讨论 03 生信教程与工具库/01_sources/web_clips/ggbiplot-最好看的PCA作图-原文存档 prcomp 、 ggbiplot 分组椭圆、变量向量、相关环、OTU/高变异变量展示 ggbiplot 依赖 GitHub；OTU 归一化方式不应直接套到 RNA-seq count 二、推荐的 Bulk RNA-seq PCA 流程 # 表达矩阵（基因 × 样本） + 样本信息 | v 检查样本 ID、数值类型、缺失值、全零基因和零方差基因 | v 选择已标准化/变换的数据：logCPM、DESeq2 VST/rlog 等 | v 按 MAD 或明确的高变异基因规则筛选（记录 top_n） | v prcomp(t(expression), center = TRUE, scale. = TRUE/FALSE) | +--\u003e scree plot：查看解释率 +--\u003e sample plot：检查分组、离群样本和批次 +--\u003e variable plot/biplot：解释高贡献变量 +--\u003e optional 3D：探索，不作为唯一结论 输入方向与样本对齐 # 表达矩阵约定：行名是基因/特征，列名是样本。 PCA 输入给 prcomp() 前需要转置为“行是样本、列是变量”，所以通常使用 prcomp(t(expr), ...) 。 样本信息表必须以样本 ID 为键，按 colnames(expr) 重排后再添加到 PCA scores；禁止只按文件行顺序合并。 先确认表达矩阵是原始 count、TPM/FPKM 还是已变换值。差异分析和 PCA 的输入用途不同，不能为了作图覆盖原始 count 的统计用途。 高变异筛选 # mad() 可作为探索性筛选指标。建议把 top_n 写进脚本和结果文件；如果样本量很小，不要把高 MAD 排名误解成生物学差异基因。正式分析也可使用全基因或预先定义的过滤规则，并进行敏感性比较。 椭圆和解释率 # 分组椭圆只描述所选二维空间中的组内几何范围；它不提供差异显著性。建议显式记录 ellipse.level = 0.95 、样本数和分组定义。坐标轴标签应包含方差解释率，例如 PC1 (32.4%) ，但解释率高不代表轴具有特定生物学机制。 三、脚本与远程代码 # 远程目录： 04_Bulk转录组/4.2_PCA/ 01_factoextra_PCA二维美化.R ：用 prcomp 计算 PCA，再用 factoextra / ggplot2 输出二维分组图。 02_prcomp_factoextra_Bulk_PCA完整流程.R ：从输入检查、MAD 筛选、PCA 到碎石图、样本图、变量贡献表和 biplot 的完整流程。 03_ggbiplot_Bulk_PCA美化.R ：用 ggbiplot 输出带分组椭圆和可选变量向量的 biplot。 README.md ：输入文件格式、运行顺序、包依赖、参数和结果说明。 当前仅完成静态代码审查和参数/API 对照；本机当前没有可执行的 Rscript ，因此尚未运行真实 R 包测试。正式复现前需在安装 ggplot2 、 factoextra 、 FactoMineR 和可选 ggbiplot / pca3d 的 R 环境中运行，并记录版本。 四、进一步连接口腔生信课题 # 先用 PCA 检查样本是否按实验分组、组织来源或批次聚类；若主成分主要被批次解释，应先处理设计和校正问题。 用 PCA 发现的离群样本只能作为复核线索，不能仅凭图删除样本；需要结合测序质量、文库信息和预先设定的排除标准。 在分组结构稳定后，继续使用原始 count 做 DESeq2/edgeR 等差异分析，并将 PCA 的变换方法与差异分析输入清楚分开。 对口腔炎症或 OSCC 样本，PCA 结果可与免疫浸润、细胞组成估计、通路活性和临床变量联合解释，但不能单独推出细胞通讯或因果机制。","tags":["clippings","生信教程","Bulk转录组","RNA-seq","PCA","R语言","ggplot2","factoextra","FactoMineR","ggbiplot","pca3d","MAD","暂未试用"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"方法笔记","updated":"2026-10-25T17:37:28.592Z","url":"bioinfo-tools/notes/b6ee4e718ddbb7edea8dcb34.html"},{"kbId":"KB-000075","title":"OpenMolLab-在线分子对接计算与可视化作图平台","subtitle":"","summary":"OpenMolLab 在线分子对接、结果分析与 PLIP 图形导出流程；官网另含分子模拟、CADD/AIDD、蛋白/多肽设计与生信多组学模块。","body":"摘要 LLM 归库摘要 核心内容： OpenMolLab 是一个面向生命科学研究的在线计算与设计平台。公众号文章演示其分子对接流程：上传受体和配体、设置对接盒、查看任务历史、进入结果分析，并用 PLIP Interaction Studio 生成蛋白-配体的 2D/3D 互作图。官网宣称还覆盖分子模拟、CADD/AIDD、虚拟筛选、蛋白/多肽设计、生信与多组学等模块。 适用场景： 天然产物或候选化合物与靶点的相互作用预测、虚拟筛选、先导化合物优化、分子机制解释，以及需要 2D/3D 互作图的计算化学结果展示。 输入： 受体结构支持 PDBQT/PDB；配体结构支持 MOL、MOL2、SDF、PDBQT 和 SMILES。对接盒来源可选择整蛋白、按残基、共晶配体或手动坐标。 输出： 对接数据表、能量图表、互作分析、3D 视图和运行日志；可跳转到 PLIP Figure Studio，调整互作样式后导出 SVG、PNG 或 PDF。 关键参数/步骤： 上传结构 → 选择配体来源 → 选择共晶配体或其他口袋定位方式 → 核对中心坐标与盒子尺寸 → 确认对接盒 → 提交任务 → 在任务历史查看状态和下载结果 → 在结果页打开 PLIP 作图。 常见错误/注意事项： 不要把单次对接分数直接当作亲和力结论；应结合口袋选择依据、共晶配体、重复对接、构象复核、MM/GBSA 或实验验证。关键结果应保留输入文件、参数、任务日志和输出结构，便于复核和引用底层软件。 与口腔生信连接： 可用于牙周炎、口腔鳞癌或龋病相关靶点与天然产物、抗菌剂、抗炎化合物的分子对接和互作可视化，作为干湿结合课题中的候选机制验证环节。 下一步处理： 用一个已知复合物或自有候选靶点/配体试跑，检查配体识别、对接盒定位、任务队列、结果下载和 PLIP 导出是否稳定；并对照 分子对接结果如何更有说服力？15个影响结果的小技巧 核查结构选择、口袋设置和结果解释。 归库说明： 分类到 03 生信教程与工具库 / 02_wiki / methods，置信度 0.93，理由：内容为在线分子对接与可视化平台流程，工具属性强；未命中敏感信息；正文无 R/Python/Shell 可复用代码块，因此未同步远程代码库。 OpenMolLab 官网入口： https://openmollab.top 。帮助文档： https://www.yuque.com/canyuetian/kb/yp2vlcsn80mfik18?singleDoc# 。公众号文章称“全额免费试用”，官网则区分公益使用、按平台额度的标准计算和项目合作，正式使用前应以平台内额度和当前条款为准。 平台定位 # OpenMolLab 的首页定位是“开放分子实验室”，依托 GPU/CPU 高性能计算集群，提供自主在线计算与定制科研服务。它不是单纯的命令行软件，而是把任务上传、参数设置、队列状态、结果文件和历史记录放在网页工作台里。 官网列出的核心方向包括： 分子与材料模拟 ：GROMACS、Amber、自组装、轨迹分析，正文另提到 MM/GBSA 与自动报告。 CADD/AIDD 药物设计 ：分子对接、虚拟筛选、量子化学、AI 分子设计、ADMET 与先导优化。 蛋白与多肽设计 ：RFdiffusion、结构生成、序列优化，并提及蛋白、多肽、抗体和酶设计。 生信与多组学 ：单细胞、转录组、蛋白组、代谢组与多组学整合。 其他扩展业务 ：中医药与天然产物研究、数据与试剂查询、科研助手等。 文章演示的分子对接流程 # 1. 上传受体与配体 # 文章演示的是 AIDD 药物设计中的“蛋白与化合物对接”。左侧填写受体蛋白结构，截图显示支持 PDBQT 或 PDB 文件；右侧填写配体，来源可选本地文件上传或粘贴 SMILES，页面示例支持 MOL、MOL2、SDF、PDBQT 和 SMILES。平台会渲染配体的 2D 结构，便于快速核对分子是否识别正确。 2. 设置对接盒 # 页面提供“3D 蛋白结构窗口”和“对接盒控制面板”。文章示例优先使用“共晶配体”作为对接盒定位依据：平台识别到 7XO Chain A - Res 1107 - 33 atoms ，点击“使用”后，系统显示已用 7XO A:1107 作为对接位点，并给出中心坐标和盒子尺寸。用户仍需确认口袋是否对应研究问题，再点击“确认对接盒”。 3. 追踪任务历史 # 提交后可以在“我的任务”中查看任务名称、类型、任务 ID、计算队列、创建时间、运行时长、状态和数据下载入口。文章截图显示分子对接任务处于 slurm_pending ，说明平台使用计算队列调度任务。其他截图还包含分子动力学任务及其完成或失败状态，可据此排查失败任务并下载结果。 4. 查看对接结果 # 对接结果页包含数据表格、能量图表、相互作用、3D 视图和运行日志。文章重点演示“相互作用”页中的蛋白-配体互作分析，可通过按钮进入 PLIP Interaction Studio，查看 2D 相互作用图和 3D 复合视角。 5. PLIP 2D/3D 作图 # PLIP Figure Studio 支持按构图类型、氢键、疏水作用、盐桥、π-π 相互作用等调整显示样式。3D 视图可标注关键残基和作用距离；2D 视图可显示残基节点、氢键和疏水作用，并调整背景、残基样式、字体和距离标注，最后导出 SVG、PNG 或 PDF。 使用建议 # 选结构时先确认研究问题对应的蛋白状态、生物学组装体、口袋完整性和共晶配体，不要只看分辨率或最低对接分。 有共晶配体时优先检查它是否与目标配体机制相似；没有共晶配体时，可结合文献位点、口袋预测或残基选择，并保留选择依据。 对接分数应作为排序或筛选线索，不应替代结合能计算、动力学验证、突变实验或活性实验。 结果报告应记录平台模块、底层软件、参数、任务时间、输入文件和日志。官网也建议按实际流程引用 AutoDock Vina、GROMACS 等底层工具。 用于文章图形前，检查 PLIP 图中的残基编号、互作类型和距离标注是否与原始输出一致。 证据边界 # 本笔记基于 2026-09-22 抓取的公众号文章和官网首页快照整理，未实际试跑平台任务。 官网关于模块覆盖、算力、累计用户和任务数量等表述属于平台自我介绍，尚未逐项核验。 文章截图显示企业版剩余额度 1500/1500，但当前额度规则、免费范围和任务限制仍需以登录后的平台页面为准。 相关笔记 # 分子对接结果如何更有说服力？15个影响结果的小技巧","tags":["clippings","生信工具","工具网站","分子对接","CADD","OpenMolLab","PLIP","分子模拟","药物设计","暂未试用"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"方法笔记","updated":"2026-10-25T17:37:28.592Z","url":"bioinfo-tools/notes/88d405d8e08406545c3793e2.html"},{"kbId":"KB-000072","title":"第一作者解读｜OmicOS：突破现有生物学Agent的瓶颈，任何人都能在自己的电脑上完成分析","subtitle":"","summary":"OmicOS，我想可能是现阶段最好用的AI科学家之一","body":"摘要 LLM 归库摘要 核心内容： 这篇微信文章介绍 OmicOS 正式版：一个围绕 OmicVerse 生态构建的本地 AI 科学家/AI4Bio 分析平台，强调自动下载数据、复现论文分析、生成可追溯 notebook，并通过多专科 agent 覆盖组学、病理、ImageJ、Pymol 与分子动力学等场景。 适用场景： 需要低门槛、本地化、可复现地完成组学分析、论文复现、benchmark 评估、单细胞/空间组学/微生物组/病理图像等多模态生物医学分析时，可作为候选工具或方法学参考。 输入： 论文 PDF、公开数据库数据（如 GEO、cellxgene）、用户本地组学数据、notebook、包教程/源码、实验设计与分析问题。 输出： 可复核 notebook、出版级图表、差异基因与富集结果、方法学描述、数据/代码/文献可追溯的分析报告，以及可组合的分析路径与 agent 执行记录。 关键参数/步骤： 重点关注 OmicOS 桌面端/网页版/CLI、 npm install -g @omicverse/omicos 安装方式、OmicVerse 统一 API、RebuildR 将 R 包重构为 Python 包、PortBuild 将教程/源码/notebook 转为 Agent/Skill、BixBench/BiomniBench/OmicBench 三类评测。 常见错误： 可能把产品宣传性 benchmark 直接当作独立验证结论；忽略本地算力、依赖安装、API key/模型费用、HPC/SSH 配置、不同组学任务的可复现性差异；微信图片中的关键结果尚未本地化保存。 与口腔生信连接： 可考虑用于牙周炎、OSCC、口腔微生物、空间转录组或病理切片项目的自动数据下载、单细胞注释、轨迹/富集/空间映射、HE 特征提取和论文复现；但进入正式课题前应先用公开口腔数据集小规模试跑。 关联页面建议： 后续可沉淀到 03 生信教程与工具库/02_wiki/tools/OmicOS 、 03 生信教程与工具库/02_wiki/tools/OmicVerse ，并与已有 03 生信教程与工具库/02_wiki/workflows/单细胞教程/IDE/jupyter/OmicVerse-Notebook｜全方位优化你的分析显示 建立互链。 归库说明： 分类到 03 生信教程与工具库，置信度 0.88；理由是正文以生信工具、组学分析平台、AI4Bio workflow 与安装教程为主，虽涉及 Claude Code/Codex 等 AI agent 对比，但不是通用 AI/API 教程。 steorra 2026年6月19日 22:10 编者按 「 时清日长，帆悬江阔 」 半个月前，OmicVerse在Github上突破1000🌟！ 准备了很久的千🌟的福利，终于要端上来了。 即使在benchmark上全线领先；即使在功能上全面覆盖，即使在价格上全面低于同行 ，但我还是不知道怎么跟大家去介绍OmicOS。 三月份，我撰写了一篇“ 第一作者解读｜OmicClaw下一代组学研究的AI分析系统 ”，收获了6000多个阅读量，但在不断的迭代维护过程我发现，它其实没解决AI4Bio的根本问题。 生物医学需要的不是手机对话，而是可靠好上手的分析，数据本地化隐私化的分析，人人可学的生物学分析。 没有任何门槛，包括安装门槛。 今天，OmicOS 正式版（ https://omicos.cn/ ）发布，我们希望，生物学家从此不再需要到处求人合作分析数据。 Steorra OmicOS在BioRxiv上线了 在2024年底，OmicOS项目立项，但中途一度夭折，因为Claude Code，Codex，opencode等工具的出现，似乎已经将Agent智能体的蓝海填满了。我一直在问自己，如果我继续做AI科学家，那么能做的比御三家的Agent产品要好吗？ 答案是肯定的，我们不仅能做得更好，还要同时奠定AI4Bio时代的基础设施 scverse生态，也曾经希望有一个Agent智能体，能将所有scverse下的包收纳到一个体系下，为此他们找到了Biomni来做这件事。但最后，Biomni给自家的Phylo撰写了一系列的Skill去调用scverse和R语言的包，这事儿似乎也就不了了之了。 但omicverse生态不同，我们真正意义上，将生物学所有的组学相关的算法，纳入了同一个体系下，我们统一了变量，统一了函数，这在无形中，构建出了AI时代Agent真正的数字资产， 一个统一的生物学的基础设施 。 分析能力有多强呢？ 通俗一点来说，给定一篇pdf，OmicOS可以自动下载数据，然后自动复现论文里的所有分析和图表 OmicVerse现在涵盖了 基因组学，转录组学，蛋白组学，代谢组学，微生物组学，表观基因组学，空间转录组，单细胞转录组，分子靶点对接分析，前沿可视化 等所有跟组学相关的内容，你没看错，是所有。并且统一了R下的Bioconductor/CRAN下的算法包，通过RebuildR将其重构成 更快，更准 的Python包。 到此，一个AI时代的基础设施，初步形成。 OmicOS的五层架构 Benchmark测评 # 在OmicClaw这篇论文，我犯了一个错误，没有横向，充分地在生物学benchmark上去对比claude code，codex，biomni等Agent的能力，而是仅对比了OmicVerse+gpt5.5前后的能力差，并且任务也选的只有10个简单任务。 没有人相信你是世界最好，你不是最好谁又会用呢？ 我们首先选取了BixBench-Verified-50，这是FutureHouse提出，Biomni精选的50道生物学分析问题，用于评估AI智能体的数据分析能力。 BixBench测评能力 在50道题中，有45道题被OmicOS完美解决，而剩下的5道题，似乎OmicOS也答对了，但是答案的选取标准可能有一些问题，我们不敢说OmicOS能解决所有的生物学分析问题，但我们证明了一个事儿，那就是 OmicOS+deepseek-v4-pro 的组合，是目前世界上最具有竞争力，最便宜的分析框架体系。 BixBench错题分析 当然，BixBench是面向结果的，而在真实的生物学分析里，是面向过程的，很多时候，我们需要去评估Agent智能体是否正确选择了方法，是否正常处理了数据，是否进行了可靠的生物学解释等，因此Phylo推出了一个新的Benchmark——BiomniBench，这是一个同时面向过程和结果的AI智能体的评估基准测试，过程的评价使用Gemini进行打分。 BiomniBench结果 我们可以看见在BiomniBench的论文里的100道题下，Claude Code+Opus 4.7的得分是72.7，Codex+GPT5.5的得分是67，而Qwen，Kimi仅有60分，看起来都不高对吧。 由于BiomniBench在HuggingFace上开放了其中的50道题，我们也因此能评估OmicOS与不同的大模型基座之间的能力， 很有趣的是，OmicOS+ds4-pro的得分，也来到了72，价格仅是Claude Code+Opus的1/10。而OmicOS+GPT5.5的得分，来到了78.2，排除了BiomniBench上的错题，更是来到了81.2 。 BiomniBench的详细任务 需要承认的是，目前国产大模型与国外前沿模型还是有一定差距，无论是长程能力的执行又或者是响应速度，Prompt的遵从性。 但这也让我们看到了希望，原来做好Harness，是真能在垂类任务上追赶，甚至反超国外前沿大模型（注：GLM5.2没测是因为我抢不到Coding Plan）。 实际上你会发现，到这里， 我们似乎还没介绍OmicOS的架构 。下面要介绍的基础设施，也不是OmicOS架构的设计。 OmicVerse对模型能力的提升 # 作为一个学术研究，我们既然说是 “重构AI4Bio的基础设施” ，那么少不了对模型添加OmicVerse前后的能力变化。为此我们不鼓吹OmicOS有多好，我们采用Mini-SWE-Agent，这是一个仅有100行代码的最简Agent。 由于BixBench和BiomniBench在组学任务上没有覆盖完全，仅有转录组，GWAS等计算友好的类别，为此我们构建了OmicBench，这是一个涵盖了40个任务的基准测试，包含了7大组学的任务，在未来我们会继续扩充更多的内容进入该基准测试。 OmicBench概览 我们发现，在结合了OmicVerse这个AI4Bio的基础设施后， 本地开源小模型Qwen3.6-35b-A3b的能力提升了34.2%，直追大模型如Deepseek-V4-Pro。 一方面，这说明我们实现了模型平权和隐私保护，尤其是生物医学这块，我们可以完全让分析数据不脱离用户自己的电脑，这听起来很疯狂，但我们确实做到了。 模型能力的提升 另一方面，这表明，对于绝大多数生物学分析任务而言，并不需要领域内最好的大模型， 而缺的仅是一个真正意义上的AI4Bio的基础设施 。 模型提升的细则 行文至此，还是很感慨，四年前的满腔热情，竟有希望成为AI4Bio一个重要的基础设施。 重构R语言生态体系 # 记得在两年前还是三年前，与一位Bioconductor的中国区代表交流过，那会儿Bioconductor还是生物信息学分析至关重要的一个社区，靠着庞大的R语言支持构建了坚实的用户壁垒。 而在现在，用户根本不用去学R语言，而是让AI去调用R包去完成分析，那么这就自然而然引出一个问题 R语言的算法包，相比Python/Rust，太慢了 当用户开始关心运行速度的时候，就会自然而然转向更快的Python生态体系，但是用户又不希望丢失R语言生态的算法，这自然而然地引出了一个两难的问题， 如果能在Python里也使用R包就好了 这里指的不是通过Python使用rpy2等wrapper去调用R包，而是真正意义上使用Python的标准库进行重新实现。在Agent时代，这似乎并不是什么难事儿，但是缺乏一个标准， 怎样重构的R包，才是好用的Python包？ 我在两个月前发出了一个倡议，重构R语言生态体系（微信公众号链接），林林总总有十几个小伙伴响应了我的号召，我们在不到一个月的时间内，重构了58个R包，使其变成完全的Python包。 并且我们也归纳总结出了一个通用的Agent转换协议RebuildR，该协议类似强化学习，主要分为三个步骤，（1）提出候选的重构算法设计思路；（2）每一个思路进行运行时间和准确性的评估；（3）迭代继续优化。 RebuildR协议 听起来很简单，实际上这很工程学。对于重构后的算法，其实我并不需要结果完全一致，也可以是精度上的一致，例如小于1e7，还可以是数学上的子集优化，这意味着，我只需要找到数学上的近似优化，就可以不仅利用Python的运行速度优势，还可以利用数学上的计算优势，这才是真正意义上的，重构R/Python社区。 我们进行了7种拟时序算法的R/Python实现的基准测试，发现RebuildR重构后的算法，不仅运行速度可以是原来的几十倍，准确度甚至略有提升。 Benchmark对比拟时序 并且我们还将这些重构算法的进化迭代路径展现出来，发现重构并不是一簇而就的，而是像进化一样，有一个演化过程，这也反证我们RebuildR不是简单的算法重构，而是一个工程上，数学上都有意义的执行体系。 PseudoTimeFate应用 并且OmicVerse可不是仅仅重构算法成Python包这么简单，我们既然构建的是基础设施， 那么必定有一个统一的上层API函数，去容纳不同的算法包。 在这个例子里，我们演示的是 omicverse.single.PseudotimeFate 和 omicverse.single.Traj ，PseudotimeFate支持任何拟时序结果作为输入，可以进行谱系的预测，从而执行时序驱动基因的发现，而Traj支持method=‘任意拟时序算法名’，自动计算出pseudotime。 这对Agent来说，是一个知识体系的基础设施的重构，AI再也不会写出混淆的函数参数代码，还能 一键完成多种拟时序分析对比然后找出最好的一种 。 OmicOS与阿尔茨海默症新机制 # 一个月前的Nature三连发，其中Robin提出了一个科学新发现的探索逻辑，组合不同文献里的知识，找出遗漏的内容，我认为这仅是第一层。 而在OmicOS中，由于都在同一个生态体系内，因此， 我们可以直接组合不同算法，结合不同算法对于数据挖掘的优势，将一个数据所有维度的内容分析出来 ，我认为这是探索新科学发现的第二层。 第一层再怎么组合，也组合不出没进行过数据挖掘和分析的内容 生态模块组合Agent 这其实也是一个可以单独拿出来发顶会的设计，我们将OmicVerse生态抽象成16个套件，然后自由组合不同的套件，我们既可以得到“质控-预处理-细胞注释”这种传统的分析路径，也可以得到“空间单细胞定位-空间性状挖掘”这种需要跨领域知识的分析路径，通过打分Agent，我们找出一条或多条能充分挖掘该数据的分析思路，然后再交给OmicOS执行。 阿尔茨海默症图谱 于是我们看见，OmicOS自动从GEO和cellxgene等数据库来源，跨越5个研究， 下载并构建了一个跨越10个年龄段的小鼠单细胞全器官图谱 ，然后调用CellTrek，CMAP等方法，将单细胞映射到空间位置上，然后使用gsmap将AD性状解析道空间位置上，将gsmap的结果从组织层提升到了细胞类型层。 后续的分析由于我不是GWAS专业的，所以基本上都是Agent自行提出分析思路，我点击同意，然后自动下载数据，自动安装算法包，自动分析进行的，包括AD性状基因跟空间上皮marker的共定位（为了确定真是上皮细胞相关）。 基因共定位 很有趣，我们下一步就会开展相关的小鼠实验验证这一生物学发现的真实性了。 OmicOS可扩展到任意科学发现 # 刚刚提出的很多内容，都是基于OmicVerse生态下的组学分析。实际上，我们的愿景是要打造一个真正的AI科学家，那么由于开发团队的限制，还有很多功能我们没法导入OmicVerse生态，例如HE病理图像处理。 我们构建了PortBuild， 这是一个可以将任意包的教程，源码，Notebook转换成Agent/Skill的工具体系 ，我们利用了SkillOPT的优化思想，将Skill当成一个神经网络去训练，通过迭代优化，自动将包变成了Agent/Skill，然后我们用OmicOS调用LazySlide去看看效果。 PortBuild概览 我们发现，OmicOS因此有了相当完善的HE分析能力，可以做特征提取，找出病理相关的特征，也可以调用OmicVerse本来的HE预测基因表能力去生成空间转录组学数据，还可以同时分析100及以上的HE病理切片大队列，找出生存分析相关的特征因素。 大队列处理 OmicOS 到底是什么？ # 我认为OmicOS是一个可成为任何人助手的AI科学家，并且分析完全在本地，你无需为数据上传而担忧，还可以自定义API来调用不同大模型的能力。 我是希望它成为科学家的Claude Code平替，甚至在未来成为上位替代 你的AI科学家 # 把
