公开数据、实验设计、文献证据和分析代码通通交给 OmicOS。它直接基于真实组学数据展开分析、提出假设，并产出每一步都可复核、可复现的 notebook，让你无需把复杂的科研问题强行压缩成一条提示词。 交付可复现的科研成果 # 产出你可以直接评审、复核并写进论文的分析报告、出版级图表、差异基因与富集结果、方法学描述，以及每一步都能重跑的 notebook——不是一段聊天回答，而是带代码、带证据、可回溯的完整工作成果。 和 AI 共享同一个 notebook # OmicOS 把分析放进一个活的 notebook：你和 AI 共享同一个 Python 内核和同一批变量，AI 能直接读你的 adata、跑下一格、画图，你也能随时改一行代码接着往下走。不是黑箱给答案，而是每一步都是真实、可编辑、可重跑的代码。 每个结论，都能查到它从哪来 # OmicOS 不会凭空给你一个数字。每一条结论都绑定生成它的代码格、用到的数据和引用的文献——点一下就能回溯到那一格重跑、那篇文章。没有跑过的代码，就没有结论；讲不清来源的，它会说\"不确定\"，而不是编一个。完整的轨迹分析可溯源，可追踪。 不仅是一个 AI，更是一支组学团队 # 一个任务进来，编排智能体把它拆给合适的专家智能体：质控、预处理、注释、轨迹、富集、空间、微生物组……40+ 专科 agent、152 个精选分析技能各司其职。不归自己管的活，专家智能体会直接说\"这不是我的范围\"并转交给其他人，而不是硬答，这与真实的科研协作一样。 你的数据，不出你的机器 # OmicOS 运行在你的本地计算机，我并不同意phylo的思想，本地分析完全是可行的，数据上传风险很大，在omicos里，我们起一个 127.0.0.1 上的本地内核，所有计算、变量、图表和 notebook 都留在.omicos/ 工作区里。处理临床或未发表数据时，你不必把它交给任何云端。需要算力时，同一套还能在 HPC 上以终端模式（omicos cli）通过 SSH 直接跑。 持续更新的工具体系 # 我们在OmicOS 1.0引入了单细胞数据查看器，ImageJ，Pymol，HE病理分析， 这些工具体系可以直接通过AI对话使用，你将无需再学习复杂的软件操作过程 。 我是没学过ImageJ的，但在OmicOS，你可以直接通过对话，例如输入“请帮我实现细胞计数并且可视化轮廓”，那么就会自动完成ImageJ的分析 AI对话ImageJ 而对于某平台收费上千元的病理大模型HE分析，在OmicOS，你不需要学任何复杂的使用说明，只需要简单的对话，就能分析出HE特定的特征，例如找出切片上的免疫细胞。 AI对话病理切片 此外，我们也将分子动力学的一些功能做了初步的AI对话实现，例如计算相互作用力以及可视化等，科学家再也不用学习复杂的pymol操作，也能轻松完成分子动力学的一系列分析内容。 AI对话分子动力学 OmicOS移动端 # 对于科学家而言，我们不仅需要的是一个能在自己电脑运行的AI科学家，还需要这个AI科学家能24小时待命。 于是我们构建了OmicOS移动端，只要你在电脑和手机登录了相同的OmicOS账户，那么即使在户外，你也可以随时随地操控OmicOS 并且我们还设计了很多有意思的功能，作为AI科学家，那肯定不能是单打独斗，我们希望能学到其他AI科学家的知识，于是我们构建了AI实验室。 这是一个群组功能，同一个实验室的用户，可以对另一个用户公开的分析过程，进行对话，了解与学习其他人是如何分析数据的。 该功能还在内测中，欢迎大家体验，如有bug也可以在用户群反馈 下载链接 # OmicOS网页版/桌面版 # 我们提供了免安装的桌面版，对于新用户而言，可以在官网 （阅读原文） 直接下载OmicOS客户端体验；对于老用户以及有服务器使用需求的用户而言，可以使用npm进行直接安装： npm install -g @omicverse/omicos OmicOS移动端 # 苹果用户在App Store搜索OmicOS - AI科学家直接下载；安卓和鸿蒙用户请扫二维码获取安装apk。 技术报告 # 这是我第一次主导20个单位，25个作者的课题，作为一个科技导向的产品，我们提供了全文详尽的报告，在附录里还额外包括了：Supplementary Notes 1-8 and Tables 1-36 OmicOS论文： https://www.biorxiv.org/content/10.64898/2026.06.11.731775v1 OmicOS使用教程： https://docs.omicos.cn/zh/ OmicOS-BixBench技术报告： https://github.com/omicverse/OmicOS-BixBench OmicOS-BiomniBench技术报告： https://github.com/omicverse/OmicOS-BiomniBench OmicVerse-OmicBench技术报告： https://github.com/omicverse/OmicVerse-OmicBench OmicBench基准测试开源仓库： https://huggingface.co/datasets/omicverse/OmicBench 结语 # 「未来已来，远山有灯，向难而行，向远而生」 三个月前，我在撰写OmicClaw的结语的时候写到，“未来的生物学分析，应该是AI自主驱动的，自主探索的，自主分析的，自主撰写报告的， 有朝一日可能这个闭环的生态真会出现吧 ”。没想到三个月过去，我们似乎要将这一愿景实现了。 感谢每一位用户的信任和支持，大家的肯定，建议和期许，是我们不断探索，构建未来AI4Bio体系的不竭动力。 为庆祝OmicOS正式发布，我们将为在6.19-6.22注册的用户免费提供7天Plus会员 ，以及公测期间， 我们将为所有用户每天提供两百万的免费token ，谢谢大家一路以来的支持！ OmicOS本地端已同步开放MacOS，Windows下载安装，OmicOS CLI也已同步上线npm，使用 npm install @omicverse/omicos , OmicOS 远程服务端也已同步上线App Store，安卓apk可前往官网下载（ 阅读原文 ）。 交流群 # 如果你对OmicOS有任何问题，欢迎加入用户群与我们讨论！ 合作 # 源境解码成立于2026年5月，团队成员由 清华大学，斯坦福大学，中山大学 等顶尖高校的科学家创立， 我们目前正在寻找下一阶段的同行者，包括投资人、产业伙伴和资源合作方 。 如果你对我们正在做的事情感兴趣，对AI4Sci的项目投资感兴趣，欢迎联系 contact@omicos.cn 。 阅读原文 继续滑动看下一个 OmicAI 向上滑动看下一个 闪记 复制 LaTeX 公式","tags":["clippings","暂未试用","OmicOS","OmicVerse","AI4Bio","生信工具","组学分析","Agent"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"网页教程","updated":"2026-10-25T17:37:28.591Z","url":"bioinfo-tools/notes/9c204b09892f8bfbff2ba4a9.html"},{"kbId":"KB-000073","title":"绝美可解释分析图！|贝叶斯优化+XGBoost+SHAP+PDP绘图可视化|替换数据直接用","subtitle":"","summary":"绝美全套同色系科研绘图来了~","body":"摘要 LLM 归库摘要 核心内容： 这是一篇围绕“贝叶斯优化 + XGBoost + SHAP + PDP”科研可解释性绘图的微信公众号教程型剪藏，主打替换数据集即可套用。 适用场景： 回归/分类模型建模后，需要展示超参数寻优过程、模型预测效果、SHAP 解释图和 PDP 局部依赖图时可参考。 输入： 示例中使用 Excel 表格数据（如 BostonHousing1.xlsx ），经缺失值处理、随机打乱、训练/验证/测试集划分和标准化后进入 XGBoost。 输出： 贝叶斯寻优曲线、预测拟合图、SHAP 相关解释图、PDP 分析图，以及统一色系的可视化结果。 关键参数/步骤： 重点包括训练/验证/测试比例、 max_depth 、 learning_rate 、 reg_lambda 、 subsample 、 n_estimators 、early stopping、RMSE 优化目标与正负 SHAP 配色。 常见错误： 微信剪藏导致代码行被压缩，复现前需重新整理换行；还需确认 split_data 等自定义函数、XGBoost 版本、 early_stopping_rounds 参数兼容性和数据标准化是否泄漏测试集信息。 与口腔生信连接： 可用于口腔鳞癌、牙周炎或微生物组相关机器学习模型的可解释性展示，例如诊断模型、预后模型或关键特征解释图。 关联页面建议： 可后续整合到 03 生信教程与工具库/02_wiki/workflows/机器学习可解释性分析流程 或可视化/机器学习工具页。 归库说明： 分类到 03 生信教程与工具库，置信度 0.88；已标记为“暂未试用”，后续复现时建议先整理 notebook 并替换为自己的生信数据集。 Coco 2026年6月2日 15:18 点击上方 蓝字 eg_color=\"#4f9d94\"cmap = mpl.colors.LinearSegmentedColormap.from_list( \"shap_teal_orange\", [neg_color, \"#f7f2ef\", pos_color]) 然后直接全部运行就能得到以上绘图了~ 【获取方式】以上学习案例都更新在全家桶的日常推文更新里面 可以直接下载到，可以在后台回复【全家桶】或者本推文阅读全文获取 包括历史两百多篇推文内容 这次是合集了下，上面大部分绘图也是做了开源的案例的，是分开的，想要获取开源绘图也可以直接后台回复【绘图开源】，加我们联系方式领取 最近又有小伙伴用公众号工具箱和代码发顶刊了，恭喜恭喜，之后争取更新更多适合发论文的创新算法~时空预测工具箱已经在开发当中了！ 更多算法工具箱介绍 目前5个算法工具箱都已经更新完毕，最新版本可以直接下载使用，视频教程和使用手册也都更新完了 【5个算法工具箱】 神器系列重磅更新|含50%以上创新|一键实现百万算法组合|轻松解决评价、降维、聚类、回归、分类、时序预测、多输出、概率预测问题 【1400页使用手册】 1300页/40万字！「机器学习/深度学习」算法文档大更新|小白也能轻松上手 【绘图工具箱】 Figure_youwant 2.0版本重磅发布！超强开源绘图工具箱，速来领取 【集成工具箱】 彻底爆了！|一键实现上百种创新stacking算法组合+完全可解释分析|RSpredict工具箱正式发布了~ 全家桶计划 ** 一键打包公众号以及B站发布的过去/未来所有资料，包括所有工具箱/代码等，后续持续更新，后台回复关键词【全家桶】或者点击阅读全文~ 【最后一天！】一键打包公众号过去/未来所有资料|全家桶即将涨价 END ** 扫码关注我们 SCAN THE QR CODE TO 点个在看你最好看 往期精彩回顾 推荐 | 神器系列重磅更新|含50%以上创新|一键实现百万算法组合|轻松解决评价、降维、聚类、回归、分类、时序预测、多输出、概率预测问题 推荐 | 1300页/40万字！「机器学习/深度学习」算法文档大更新|小白也能轻松上手 推荐 | Figure_youwant 2.0版本重磅发布！超强开源绘图工具箱，速来领取 推荐 | 45种评价算法一键搞定！|评价工具箱v6版本重磅更新！ 推荐 | 创新点+N~多目标优化聚类来了！|聚类降维工具箱v6版本重磅更新（DrCluster_v6）！ 推荐 | 一键实现百万种回归、分类、概率预测算法！|RCpredict-v7重磅更新！~支持所有算法的可解释分析 工具箱 · 目录 阅读原文 继续滑动看下一个 Lvy的口袋 向上滑动看下一个 闪记 复制 LaTeX 公式","tags":["clippings","暂未试用","机器学习","XGBoost","SHAP","PDP","贝叶斯优化"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"网页教程","updated":"2026-10-25T17:37:28.591Z","url":"bioinfo-tools/notes/73d165b6b4efd8a19da61eb3.html"},{"kbId":"KB-000070","title":"单细胞实战之 Ro/e、Augur、miloR——入门到进阶（中级篇4）","subtitle":"","summary":"[!info] 原文存档说明 本页保留原文的标题、方法顺序、关键段落和示例边界；原文中的 17 张图片已本地化到 02 wiki/methods/attachments/单细胞Ro e Augur miloR/ 。原文示例代码依赖特定 .qs 对象和结直肠癌位置字段，已另行整理为参数化脚本，见 03 生信教程与工具库/02 wiki/methods/单细胞Ro e Augur miloR-细胞分布扰动差异丰度分析 与远程仓库 01 单细胞/1.5 Roe Augur milo","body":"[!info] 原文存档说明 本页保留原文的标题、方法顺序、关键段落和示例边界；原文中的 17 张图片已本地化到 02_wiki/methods/attachments/单细胞Ro_e_Augur_miloR/ 。原文示例代码依赖特定 .qs 对象和结直肠癌位置字段，已另行整理为参数化脚本，见 03 生信教程与工具库/02_wiki/methods/单细胞Ro_e_Augur_miloR-细胞分布扰动差异丰度分析 与远程仓库 01_单细胞/1.5_Roe_Augur_miloR细胞分布扰动差异丰度分析/ 。 单细胞实战之 Ro/e、Augur、miloR——入门到进阶（中级篇4） 开篇 # 在上一讲中完成了 inferCNV 分析流程。本讲回顾单细胞分析中的三个工具：Ro/e、Augur、miloR，分别用于判断细胞簇在组织中的分布倾向、细胞簇受扰动的影响程度以及细胞差异丰度。 原文说明工程文件可通过网盘获得，并提示可向“生信技能树”公众号发送关键词“单细胞”获取 Seurat V5 版本完整代码。网盘示例数据没有复制到本地知识库或远程代码库。 Ro/e——判断细胞簇在组织分布中的倾向 # Ro/e 也称 STARTRAC-distribution，是 STARTRAC 框架中的一个工具。它通过计算组织中的观测细胞数与期望细胞数的比率，判断某个细胞簇在特定组织中是富集还是耗竭。Ro/e 大于 1 表示观测细胞数高于期望值，Ro/e 小于 1 表示低于期望值。 原文给出的评分规则为： +++ 表示 Ro/e \u003e 1； ++ 表示 0.8 \u003c Ro/e \u003c= 1； + 表示 0.2 \u003c= Ro/e \u003c= 0.8； +/- 表示 0 \u003c Ro/e \u003c 0.2； - 表示 Ro/e = 0。原文同时提醒，期望细胞数仍然基于现有数据估计，最后得到的是比率，细胞数过少时容易出现较大偏倚。 原文 Ro/e 流程包括：读取 Seurat 对象；从 metadata 提取 clone.id、patient、majorCluster 和 loc；使用 calTissueDist() 并选择 method = \"chisq\" ；最后用 ComplexHeatmap 画 Ro/e 矩阵热图。示例比较左右半结肠，展示不同 T 细胞簇在组织位置中的相对富集。 Augur——判断扰动影响 # Augur 使用机器学习框架量化扰动和未扰动细胞在高维空间中的可分性。它针对每一种细胞类型训练分类器，通过交叉验证评估分类准确性，并使用 AUC 对细胞类型排序。高 AUC 表示该细胞类型的表达更能区分实验条件。 原文以左右半结肠位置作为实验分组，使用 calculate_auc() 计算 AUC，并用 plot_lollipop() 与 plot_umap() 展示结果。原文示例中 Naive T 的 AUC 较高，说明其表达状态更能区分两类位置；这并不等同于该群体数量更多，也不能单独证明因果关系。 miloR——判断细胞差异丰度 # miloR 在单细胞的 KNN 图上定义重叠邻域，再按照样本统计每个邻域中的细胞数，比较不同条件下的邻域丰度。原文流程包括：Seurat 转为 SingleCellExperiment；构建 Milo 对象；使用 buildGraph() 和 makeNhoods() 构建邻域；使用 countCells() 按样本计数；建立实验设计；使用 calcNhoodDistance() 、 testNhoods() 和 Spatial FDR 完成差异丰度检验；最后用 annotateNhoods() 、 plotNhoodGraphDA() 、 plotDAbeeswarm() 和 marker 分析解释显著邻域。 原文特别强调邻域参数需要和 PCA、KNN 设置一致， prop 可从 0.1-0.2 开始，并通过邻域大小直方图检查结果。原文示例把 location 作为实验条件，比较左右半结肠，并进一步进行 DA 邻域分组、marker 和邻域内差异表达分析。 注意 原文参数边界 原文演示中使用了较宽松的 SpatialFDR \u003c 0.9 和 alpha = 0.9 。正式分析应根据研究设计预先定义显著性阈值，并以真实生物学重复为统计单位。整理后的远程脚本默认使用 fdr_cutoff = 0.10 ，需结合数据调参。 原文结论 # 三个工具各有侧重点，也可以用于同一批数据的不同分析视角：Ro/e 描述组织分布，Augur 筛选扰动敏感的细胞类型，miloR 在连续细胞状态或邻域层面检测差异丰度。结合使用可以得到更全面的单细胞生物学解释。 原文参考资料 # Lineage tracking reveals dynamic relationships of T cells in colorectal cancer . Nature. 2018;564(7735):268-272. A pan-cancer single-cell transcriptional atlas of tumor infiltrating myeloid cells . Cell. 2021;184(3):792-809.e23. Global characterization of T cells in non-small-cell lung cancer by single-cell sequencing . Nature Medicine. 2018;24(7):978-985. Cell type prioritization in single-cell data . Nature Biotechnology. 2021;39(1):30-34. Differential abundance testing on single-cell data using k-nearest neighbor graphs . Nature Biotechnology. 2022;40(2):245-253. STARTRAC: https://github.com/Japrin/STARTRAC Augur: https://github.com/neurorestore/Augur miloR 原文链接： https://rawcdn.githack.com/MarioniLab/miloR/7c7f906b94a73e62e36e095ddb3e3567b414144e/vignettes/milo_gastrulation.html#5_Finding_markers_of_DA_populations 关联整理页 # 03 生信教程与工具库/02_wiki/methods/单细胞Ro_e_Augur_miloR-细胞分布扰动差异丰度分析 远程： hz-bioinfo-codes/01_单细胞/1.5_Roe_Augur_miloR细胞分布扰动差异丰度分析/","tags":["clippings","单细胞","Ro/e","Augur","miloR"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"网页教程","updated":"2026-10-25T17:37:28.590Z","url":"bioinfo-tools/notes/7239435486bc4c763354f9bc.html"},{"kbId":"KB-000071","title":"原理+代码流程，一文学会华大C4平台scRNA-seq定量分析","subtitle":"","summary":"DNBelab C4，上游定量+R语言\\x26amp;Python读取","body":"摘要 LLM 归库摘要 核心内容： 华大 DNBelab C4 平台单细胞转录组定量分析完整教程：平台原理（双磁珠液滴技术）→ DNBseq 测序原理 → DNBC4tools 上游定量流程（下载/安装/参考基因组/建库/fastq 定量）→ 下游结果读取（R Seurat/自定义函数 + Python Scanpy/自定义函数）。 适用场景： 手头有华大 DNBelab C4 / DNBC4tools 产出的单细胞数据（cDNA+oligo fastq 或 MEX 矩阵），需要从上游定量到下游分析。 输入： ①上游：cDNA fastq + oligo fastq + 参考基因组 FASTA + GTF 注释；②下游： output/raw_matrix （MEX）或 filter_feature.h5ad 。 输出： 上游得到 01.data/02.count/03.analysis/04.report；下游得到 Seurat 对象或 AnnData 对象，可继续个性化分析。 关键参数/步骤： tools mkgtf （GTF 校正/过滤）→ rna mkref （建索引，--threads）→ rna run （定量，--cDNAfastq/--oligofastq/--genomeDir）；读取用 Read10X / ReadMatrix_C4 （R）/ read_h5ad / read_anndata_C4 （Python）； min.cells=3, min.features=200 质控。 常见错误： GTF 需含 gene/transcript/exon 且带 gene_id/transcript_id，缺字段需先 mkgtf --action check 校正；ref.json 中 genomeDir 需指向参考路径；GTF 非唯一比对 reads 会被过滤。 与口腔生信连接： 若课题组数据来自华大 DNBelab C4 平台（如牙周组织/口腔样本单细胞），可用此流程完成上游定量并接入 Seurat/Scanpy 下游；微生物组平台可类比。 下一步处理： 暂未试用；需要实际华大 C4 数据/测试文件（教程提供百度网盘提取码 yckd）才能试跑。 归库说明： 分类到 03 生信教程与工具库，置信度 0.92，理由：单细胞上游定量流程教程，含完整可复用代码。 BIOMAMBA Biomamba 生信基地 2025年12月28日 09:05 一、写在前面 单细胞转录组技术 无疑是撬动 细胞异质性研究 、解析生命复杂调控网络的核心工具。单细胞转录组学已深度应用到 肿瘤微环境解析 、 发育生物学谱系追踪 、 免疫细胞亚群鉴定 、 神经细胞分型 等多个前沿领域，为科研工作者揭示生命活动的发生机制提供了前所未有的技术支撑。 作为国产单细胞平台，华大DNBelab C4平台具有捕获效率高、数据分析丰富、平台稳定性优秀等特征。本推送教程采用 “理论介绍 — 软件使用 — 上游定量分析” 的模块，给大家提供一套利用DNBC4tools软件读取上游定量文件分析流程，完成读取之后就可以正常进行下游的个性化分析，我们也给大家准备了更详细的教程： 这可能是全网最全的scRNA-seq分析教程！ 此外，此前我们已陆续分享过多种主流平台的上游分析流程，包括 10X Genomics 平台基于 Cellranger 的上游文件处理方案、Drop-Seq 平台借助 dropseqRunner 的上游分析流程、 BD Rhapsody 平台的单细胞转录组定量流程 ，以及 10X Visium 平台通过 Space Ranger 软件实现的上游定量方法 。本次我们将聚焦 DNBC4tools 软件读取上游定量文件的核心过程，为大家提供针对性的学习指引。 学前Tips：本教程基于Linux环境演示，计算资源不足的同学可参考： 足够支持你完成硕博生涯的生信环境 忘记宣传了，独享用户连技术支持都是独享的 访问链接： https://biomamba.xiyoucloud.net/ 欢迎联系客服微信[Biomamba_zhushou]获取帮助 如果你对下面的教程比较迷茫，那么你可以先行学习编程教程： 生信Linux及服务器使用技巧 如果需要 单细胞数据分析 教学 、生信热点 全文复现 、自测数据 个性化分析 辅导、 常态化实验学习 ，欢迎联系客服微信[ Biomamba_zhushou ] 二、C4 单细胞测序平台 1. C4 单细胞测序平台介绍 C4 平台是由华大智造自主研发的一站式单细胞测序数据分析平台，C系列平台基于液滴微流控策略，可以实现高效细胞捕获，完成高效的mRNA反转录和扩增后，结合华大DNBSEQ™高通量测序平台和Dr.Tom单细胞全交互式数据挖掘交付系统，进行高性价比单细胞转录组文库测序和数据分析挖掘，可广泛应用于研究免疫细胞、肿瘤微环境、神经系统发育及胚胎发育和干细胞分化等。 优势 详细描述 稀有细胞高效捕获 高效捕获稀有类型细胞，实现研究新突破。 多种样本兼容性 除常规活细胞悬液外，珍稀液氮速冻样本也可实现细胞核水平研究。 测序数据高保真 搭配 DNBSEQ™ 测序系统，确保单个细胞数据不会混淆，数据质量更高。 自主数据分析 支持 Dr. Tom 交互式单细胞数据挖掘系统，助力用户轻松自主分析。 一站式服务模式 提供流式分选服务，一站式实现从组织样本到细胞数据获取及细胞群验证。 2. 测序原理 # C4 单细胞测序平台基于微流控液滴技术，但是与传统的微流控液滴技术一个cell只与一个磁珠匹配不同，C4 平台会使用一大一小两个磁珠和捕获单个细胞进行配对，不同磁珠承担不同功能： 大磁珠： 携带细胞条形码（Cell Barcode）和唯一分子标识符（UMI），用于标记每个细胞的转录本来源及去重。 小磁珠：用于标记大磁珠（或者说用于标记液滴），不同的液滴会带有不同的小磁珠标记（Index）,同一个液滴内的所有大磁珠都带有相同的Index标记，数据分析时，可以通过大磁珠上所携带的Index信息将同一液滴内的所有大磁珠数据进行归类，从而实现对单个细胞的转录组数据进行准确归属。 理想情况下微流控液滴技术希望1个液滴内含有1个磁珠1个细胞，实际情况(能产生数据的液滴)中情况可能是1个磁珠1个细胞;1个磁珠多个细胞;多个磁珠1个细胞;多个磁珠多个细胞，而C4平台通过使用两种不同大小的磁珠，可以有效区分这些情况，从而实现对单细胞的高效捕获和准确归属。 3. 应用测序 # 目前,基于华大智造 DNBelabC 系列高通量单细胞RNA文库制备试剂盒开展的研究或应用涵盖的样本类型丰富，包括人、鼠、拟南芥、水稻等超过50个物种的300多个组织类型。 根据已证实的实验经验表明,人的PBMC细胞、脑细胞核、脂肪细胞核、鼠肺癌细胞等样本类型的细胞捕获效率\u003e50%,基因检出中位数2000左右;同时兼容复杂样本，如OCT包埋样本、鸟类、植物细胞核和植物原生质体均可在DNBelabC系列的单细胞平台实现。 截至2025年7月，DNBelab C系列单细胞平台累计发表200+篇SCI文章，包含4篇Nature，4篇Cell，1篇Science，平均影响因子12+，其中IF\u003e10文章数有100+篇。 三、上游定量 1. DNBseq技术 DNBseq（DNA Nanoball Sequencing） 是华大基因自主研发的高通量测序技术，核心基于 DNA纳米球（DNA Nanoball，DNB）和高密度测序芯片。与传统NGS技术（如Illumina的桥式PCR扩增）不同，DNBseq避免了PCR扩增导致的重复误差，通过线性扩增生成单链DNA纳米球，结合联合探针锚定聚合（cPAS）技术进行测序。 DNBseq测序文库构建分为常规建库和DNB制备两大阶段： 常规建库 （与传统NGS相似） 片段化：将DNA打断至200-500bp。 末端修复 \u0026 加接头：修复片段末端，添加与测序芯片匹配的接头序列。 纯化：选择目标片段大小。 DNB制备 （关键技术） 环化：将双链DNA连接成环状单链（ssDNA circle）。 滚环扩增（RCA）：以环状DNA为模板，生成串联重复的线性单链结构。 DNB生成：通过机械或化学断裂，形成包含多拷贝重复序列的纳米球（直径~300nm）。 DNB芯片加载：将DNA纳米球固定到高密度芯片上，形成规则阵列。 优势 ：因无需PCR扩增，避免了GC偏好性和重复序列错误，显著提高数据均一性。 对于采用DNBelab C系列高通量单细胞RNA文库制备试剂盒制备的文库是通常是这样式的： 因此我们需要采用 DNBC4tools 进行上游的定量测序，用于分析高通量 DNBelab C 系列 TM 单细胞数据集的开源且灵活的流程。 2. DNBC4tools 下载与安装 # ## 切换工作目录 cd /home/chenao/workspace/protocol/C4_sc #### 使用 \\`wget\\` 下载 wget-O dnbc4tools2.1.3.tar.gz \"ftp://ftp2.cngb.org/pub/CNSA/data7/CNP0006367/Single_Cell/CSE0000448/dnbc4tools2.1.3.tar.gz\" #### 使用 \\`curl\\` 下载 # curl -o dnbc4tools2.1.3.tar.gz \"ftp://ftp2.cngb.org/pub/CNSA/data7/CNP0006367/Single_Cell/CSE0000448/dnbc4tools2.1.3.tar.gz\" 解压下载好的安装包 ## 执行解压 tar-xzvf dnbc4tools2.1.3.tar.gz 查看生成的文件目录，我们会看到类似的结构 ls dnbc4tools2.1.3 ## dnbc4tools ## external ## lib ## misc ## sourceC4.bash 这就完成了安装。dnbc4tools 现在可以使用了。 3. DNBC4tools 使用示例 # 3.1 下载物种参考基因组文件 # 下载参考基因组和注释文件，根据自己的物种按需选择： 基因组文件：基因组文件应以 FASTA 格式提供，包含特定物种的完整基因组序列，包括染色体、线 粒体及其他遗传信息，通常为主装配版本。这些文件为基因组分析和比对提供基础数据。 注释文件：基因组注释文件应 以 GTF 格式提供，包含基因组中基因、转录本、外显子及其他功能区域的详细信息。该文件标识基因的位置、类型（如“gene”、“transcript”、“exon”）及其相关属性（如“gene_id”、“gene_name”、“transcript_id”、“transcript_name”）。这些信息对理解基因组的功能和结构至关重要。 对于可从 Ensembl 数据库 获取的物种，建议使用该处提供的文件。Ensembl 的 GTF 文件包含可选标签，便于过滤（通过 dnbc4tools tools mkgtf）。如果 Ensembl 无法提供所需物种的文件，则可以使用其他来源的 GTF 和 FASTA 文件。请注意，GTF 文件为必需，不支持 GFF 文件。基因组文件与注释文件需对应，GTF 文件格式要求为：对于单细胞 RNA 分析，GTF 文件至少需包含“gene”或“transcript”类型以及“exon”类型的注释，并且属性中必须包含“gene_id”或“gene_name”以及“transcript_id”或“transcript_name”。 ## 下载参考基因组,这里以小鼠为例 curl-O https://ftp.ensembl.org/pub/release-115/fasta/mus_musculus/dna/Mus_musculus.GRCm39.dna.toplevel.fa.gz ## 下载注释文件 curl-O https://ftp.ensembl.org/pub/release-115/gtf/mus_musculus/Mus_musculus.GRCm39.115.gtf.gz ## 解压 gunzip Mus_musculus.GRCm39.dna.toplevel.fa.gz gunzip Mus_musculus.GRCm39.115.gtf.gz 3.2 过滤GTF文件（可选） # 从 ENSEMBL 和 UCSC 等网站下载的 GTF 文件通常包含多种基因类型的基因。选择您研究中比较感兴趣的基因类型，过滤部分基因类型可以减少重叠的基因注释。与多个基因非唯一比对的 reads 会被过滤。 dnbc4tools 提供了基因类型数量统计、基因类型过滤和校正 GTF 文件的功能。 基因类型数量统计（可选） dnbc4tools2.1.3/dnbc4tools tools mkgtf --action stat --ingtf Mus_musculus.GRCm39.115.gtf --output gtfstat.txt --type gene_biotype 在上面的命令中，需要查看 GTF 文件中的 tag 确定 type 的类型。 cat gtfstat.txt ## Type Count ## lncRNA 35034 ## protein_coding 20121 ## processed_pseudogene 9489 ## misc_RNA 2216 ## unprocessed_pseudogene 1949 ## snRNA 1910 ## miRNA 1879 ## transcribed_unprocessed_pseudogene 1587 ## transcribed_processed_pseudogene 1149 ## TEC 1019 ## snoRNA 942 ## rRNA_pseudogene 497 ## transcribed_unitary_pseudogene 201 ## IG_V_pseudogene 187 ## IG_V_gene 146 ## TR_V_gene 107 ## unitary_pseudogene 89 ## TR_J_gene 79 ## rRNA 53 ## scaRNA 49 ## IG_D_gene 37 ## TR_V_pseudogene 33 ## Mt_tRNA 22 ## artifact 19 ## IG_J_gene 18 ## IG_C_gene 14 ## IG_C_pseudogene 9 ## ribozyme 8 ## TR_C_gene 6 ## sRNA 5 ## TR_D_gene 5 ## vault_RNA 4 ## TR_J_pseudogene 4 ## pseudogene 4 ## IG_J_pseudogene 3 ## translated_processed_pseudogene 2 ## Mt_rRNA 2 ## IG_pseudogene 1 校正 GTF 文件（可选） GTF 文件格式要求为：对于单细胞 RNA 分析，GTF 文件至少需包含“gene”或“transcript”类型以及“exon”类型的注释，并且属性中必须包“gene_id”或“gene_name”以及“transcript_id”或“transcript_name”。存在内容缺失的 GTF 文件会导致主分析流程无法注释而报错。 dnbc4tools2.1.3/dnbc4tools tools mkgtf --action check --ingtf Mus_musculus.GRCm39.115.gtf --output Mus_musculus.GRCm39_corrected.gtf 软件会主动填补 gene 行和 transcript 行缺失的信息，会根据 gene_id 和 gene_name 以及 transcript_id 和 transcript_name 互相填补。 警告信息提示该位置存在多个基因信息，在分析时会导致过滤去重。 # 基因类型过滤 # dnbc4tools tools mkgtf --ingtf Homo_sapiens.GRCh38_corrected.gtf --output Homo_sapiens.GRCh38_filter.gtf --type gene_biotype 命令中我们可以添加参数 include 来获取需要的 gene 类型，默认是下面列出的基因型： - protein_coding - lncRNA/lincRNA - antisense - IG_V_gene - IG_LV_gene - IG_D_gene - IG_J_gene - IG_C_gene - IG_V_pseudogene - IG_J_pseudogene - IG_C_pseudogene - TR_V_gene - TR_D_gene - TR_J_gene - TR_C_gene 例如应用以上筛选来过滤，可以使用默认选项，也可以使用如下命令，类似 Cellranger 过滤步骤： dnbc4tools2.1.3/dnbc4tools tools mkgtf --ingtf Mus_musculus.GRCm39_corrected.gtf --output Mus_musculus.GRCm39_filtered.gtf --type gene_biotype \\ --include protein_coding,lncRNA,lincRNA,antisense,IG_V_gene,IG_LV_gene,IG_J_gene,IG_C_gene,IG_V_pseudogene,IG_J_pseudogene,IG_C_pseudogene,\\ TR_V_gene,TR_D_gene,TR_J_gene,TR_C_gene 这将从原始未过滤的 GTF 文件生成一个过滤的 GTF 文件。在输出文件中，其他基因类型被排除在 GTF 注释之外。 3.3 构建参考数据库 # 在运行单细胞RNA定量之前，需要注释文件 GTF 和参考基因组 FASTA 来构建索引文件，用于测序 reads 的比对和注释。 dnbc4tools2.1.3/dnbc4tools rna mkref --fasta Mus_musculus.GRCm39.dna.toplevel.fa --ingtf Mus_musculus.GRCm39_filtered.gtf --species Mus_musculus --threads 30 看一下输出的参考基因组文件结构 ls GRCm39 ## _bt_log ## chrLength.txt ## chrNameLength.txt ## chrName.txt ## chrStart.txt ## exonGeTrInfo.tab ## exonInfo.tab ## geneInfo.tab ## Genome ## genomeParameters.txt ## Log.out ## mtgene.list ## ref.json ## SA ## SAindex ## sjdbInfo.txt ## sjdbList.fromGTF.out.tab ## sjdbList.out.tab ## transcriptInfo.tab 3.4 准备Fastq文件 # 单样本：直接准备好对应的 cDNAfastq 文件和 oligofastq 文件即可 多样本（可选）：为了简化每个样本单独生成主分析流程，可以使用配置文件来生成一个包含多个样本的主流程 shell 脚本 # dnbc4tools rna multi --list sample.tsv --genomeDir /opt/database/Homo_sapiens --threads 10 其中sample.tsv文件使用制表符 ( 分隔符。第一列包含样本名称，第二列包含 cDNA 文库测序数据，第三列包含寡核苷酸文库测序数据。多个 fastq 文件应以逗号分隔，R1 和 R2 文件应以分号分隔。 # sample1 /data/cDNA1_R1.fq.gz;/data/cDNA1_R2.fq.gz /data/oligo1_R1.fq.gz,/data/oligo4_R1.fq.gz;/data/oligo1_R2.fq.gz,/data/oligo4_R2.fq.gz # sample2 /data/cDNA2_R1.fq.gz;/data/cDNA2_R2.fq.gz /data/oligo2_R1.fq.gz;/data/oligo2_R2.fq.gz # sample3 /data/cDNA3_R1.fq.gz;/data/cDNA3_R2.fq.gz /data/oligo3_R1.fq.gz;/data/oligo3_R2.fq.gz 运行完成后输出： # sample1.sh # sample2.sh # sample3.sh 其中文件 sample1.sh 如下： # cat sample1.sh # dnbc4tools2.1.3/dnbc4tools rna run --name sample1 --cDNAfastq1 /data/cDNA1_R1.fq.gz --cDNAfastq2 /data/cDNA1_R2.fq.gz --oligofastq1 /data/oligo1_R1.fq.gz,/data/oligo4_R1.fq.gz --oligofastq2 /data/oligo1_R2.fq.gz,/data/oligo4_R2.fq.gz --genomeDir /database/scRNA/Mus_musculus/mm10 --threads 10 3.5 定量分析流程 # RNA 主分析流程 :处理单个样本单细胞 RNA 的 cDNA 和 oligo 文库测序数据。该流程包括质量控制、比对和功能区域注释。随后，系统将合并磁珠以识别细胞，并生成原始基因表达矩阵及过滤后的基因表达矩阵。接下来，分析将对该矩阵进行细胞过滤、降维、聚类和注释，最终生成 HTML 格式的报告并输出分析结果。 PS:这一步要注意参考基因组中ref.json文件，其中 genomeDir 指定了参考基因组路径 dnbc4tools2.1.3/dnbc4tools rna run \\ --name test \\ --cDNAfastq1 data/E150004608_L01_21_1.fq.gz \\ --cDNAfastq2 data/E150004608_L01_21_2.fq.gz \\ --oligofastq1 data/E150004608_L01_12_1.fq.gz \\ --oligofastq2 data/E150004608_L01_12_2.fq.gz \\ --genomeDir GRCm39 \\ --threads 30 成功的运行会以Analysis Finished结束。 # 结果文件目录如示 ls test ## 01.data ## 02.count ## 03.analysis ## 04.report ## log ## output 4. 下游文件的读取 # 4.1 R使用Seurat包读取 # ## 直接使用 Read10X 函数读取 library(Seurat) ## Loading required package: SeuratObject ## Loading required package: sp ## 'SeuratObject' was built with package 'Matrix' 1.7.1 but the current ## version is 1.7.2; it is recomended that you reinstall 'SeuratObject' as ## the ABI for 'Matrix' may have changed ## ## Attaching package: 'SeuratObject' ## The following objects are masked from 'package:base': ## ## intersect, t counts.data \u003c-Read10X(data.dir =\"./test/output/filter_matrix\",gene.column =1) counts.data[1:5, 1:5] ## 5 x 5 sparse Matrix of class \"dgCMatrix\" ## CELL1_N3 CELL4_N4 CELL9_N2 CELL11_N2 CELL25_N3 ## Xkr4 1 . 1 5 . ## Gm1992 . . . . . ## Gm71132 . . . . . ## Gm19938 . . . 1 . ## Gm37381 . . . . . # 使用计数矩阵创建 Seurat 对象 # 'counts' 参数接收您的稀疏矩阵 (dgCMatrix) seurat_object \u003c-CreateSeuratObject( counts = counts.data, project =\"SparseMatrixProject\", min.cells =3, # 质量控制：保留至少在 3 个细胞中表达的基因 min.features =200# 质量控制：保留表达至少 200 个基因的细胞 ) # 查看创建的对象摘要 print(seurat_object) ## An object of class Seurat ## 40706 features across 8350 samples within 1 assay ## Active assay: RNA (40706 features, 0 variable features) ## 1 layer present: counts 这样我们就生成了对应的Seurat单细胞转录组对象。 4.2 R自定义函数读取多种类型结果文件 # ## 使用函数进行读取。(适用于 raw_matrix、filter_matrix 和 RNAvelocity_matrix 等) ReadMatrix_C4 \u003c-function(mex_dir=NULL, barcode.path =NULL, feature.path =NULL, matrix.path=NULL, use_10X=FALSE) { # ------------------------------------------------------------------ # 1. 参数检查和路径设置 # ------------------------------------------------------------------ # 检查是否提供了任何矩阵路径或目录 if (is.null(mex_dir) \u0026\u0026is.null(barcode.path) \u0026\u0026is.null(feature.path) \u0026\u0026 is.null(matrix.path)) { stop(\"No matrix set.\") # 如果都没有，停止执行并报错 } # 如果提供了 MEX 目录，检查它是否存在 if (!is.null(mex_dir) \u0026\u0026!file.exists(mex_dir) ) { stop(paste0(mex_dir, \" does not exist.\")) # 如果目录不存在，停止执行并报错 } # 如果没有提供独立的路径（barcode, feature, matrix），则假定它们在 mex_dir 中 # 这是标准的10x Genomics/Cell Ranger MEX 格式的默认文件名 if (is.null(barcode.path) \u0026\u0026is.null(feature.path) \u0026\u0026is.null(matrix.path)) { barcode.path \u003c-paste0(mex_dir, \"/barcodes.tsv.gz\") feature.path \u003c-paste0(mex_dir, \"/features.tsv.gz\") # 10x v3 格式使用 features.tsv.gz matrix.path \u003c-paste0(mex_dir, \"/matrix.mtx.gz\") } # 定义包含 Spliced/Unspliced/Spanning 计数的文件的路径 # 这通常用于 RNA velocity 或更精细的转录本分析 spliced.path \u003c-paste0(mex_dir, \"/spliced.mtx.gz\") unspliced.path \u003c-paste0(mex_dir, \"/unspliced.mtx.gz\") spanning.path \u003c-paste0(mex_dir, \"/spanning.mtx.gz\") # 检查必须存在的条形码和特征文件 if (!file.exists(barcode.path) ||!file.exists(feature.path)) { stop(paste0(\"No expression file found at \", mex_dir)) # 如果缺失，停止执行并报错 } # ------------------------------------------------------------------ # 2. 内部函数：读取单个矩阵（标准 MEX 格式） # ------------------------------------------------------------------ # 定义一个内部函数来读取标准的 .mtx, features.tsv, barcodes.tsv 格式 .ReadPISA0 \u003c-function(barcode.path, feature.path, matrix.path, use_10X) { # 1. 读取稀疏矩阵数据 mat \u003c- Matrix::readMM(file = matrix.path) # 2. 读取特征（基因/转录本）名称 feature.names \u003c-read.delim(feature.path, header =FALSE, stringsAsFactors =FALSE ) # 3. 读取条形码（细胞）名称 barcode.names \u003c-read.delim(barcode.path, header =FALSE, stringsAsFactors =FALSE ) # 4. 设置矩阵的列名（Cell Barcodes） colnames(mat) \u003c- barcode.names$V1 # 5. 设置矩阵的行名（Features/Genes） if (use_10X ==TRUE) { # 10X Genomics V3 格式的特征文件通常 V2 列包含基因符号/名称 rownames(mat) \u003c-make.unique(feature.names$V2) } else { # 其他格式（如 V1 格式或一些预处理后的数据）可能 V1 列包含基因 ID/名称 rownames(mat) \u003c-make.unique(feature.names$V1) } # 返回构建好的矩阵 mat } # ------------------------------------------------------------------ # 3. 矩阵读取逻辑：单矩阵 vs. Spliced/Unspliced/Spanning 矩阵 # ------------------------------------------------------------------ # 优先检查是否为标准单矩阵文件 # 如果 'spliced.path' 不存在，但 'matrix.path' 存在，则读取并返回单个表达矩阵 if (!file.exists(spliced.path) \u0026\u0026file.exists(matrix.path)) { return(.ReadPISA0(barcode.path, feature.path, matrix.path, use_10X)) } # 否则，假设存在 Spliced/Unspliced/Spanning 矩阵，并准备读取它们 mat \u003c-list() # 初始化一个列表来存储多个矩阵 # 读取 Spliced 矩阵 cat(\"Load spliced matrix ...\\n\") mat$spliced \u003c- Matrix::readMM(file = spliced.path) # 读取 Unspliced 矩阵 cat(\"Load unspliced matrix ...\\n\") mat$unspliced \u003c- Matrix::readMM(file = unspliced.path) # 读取 Spanning 矩阵 cat(\"Load spanning matrix ...\\n\") mat$spanning \u003c- Matrix::readMM(file = spanning.path) } # 测试读取文件 test \u003c-ReadMatrix_C4(mex_dir='./test/output/raw_matrix') test[1:5,1:5] ## 5 x 5 sparse Matrix of class \"dgTMatrix\" ## CELL1_N3 CELL2_N1 CELL3_N2 CELL4_N4 CELL5_N2 ## Xkr4 1 . 1 . . ## Gm1992 . . . . . ## Gm71132 . . . . . ## Gm19938 . . . . . ## Gm37381 . . . . . # 使用计数矩阵创建 Seurat 对象 # 'counts' 参数接收您的稀疏矩阵 (dgCMatrix) seurat_object \u003c-CreateSeuratObject( counts = test, project =\"SparseMatrixProject\", min.cells =3, # 质量控制：保留至少在 3 个细胞中表达的基因 min.features =200# 质量控制：保留表达至少 200 个基因的细胞 ) ## Warning: Data is of class dgTMatrix. Coercing to dgCMatrix. # 查看创建的对象摘要 print(seurat_object) ## An object of class Seurat ## 41274 features across 47999 samples within 1 assay ## Active assay: RNA (41274 features, 0 variable features) ## 1 layer present: counts 4.3 Python使用Scanpy读取 # ## 直接使用scanpy提供read_h5ad函数读取 import scanpy as sc adata = sc.read_h5ad('./test/output/filter_feature.h5ad') print(adata) ## AnnData object with n_obs × n_vars = 8350 × 45577 ## var: 'gene_symbols' 这样我们就生成了对应的 Anndata 格式的单细胞转录组对象。 4.4 Python自定义函数读取 # import pandas as pd import scipy.io import anndata from scipy.sparse import csr_matrix import os def read_anndata_C4(path): \"\"\" 读取 10x Genomics MEX (Matrix Exchange) 格式的数据，并将其转换为 AnnData 对象。 该函数假定 'path' 目录下包含三个标准文件： - matrix.mtx.gz (稀疏矩阵数据) - features.tsv.gz (特征/基因信息) - barcodes.tsv.gz (细胞条形码信息) Args: path (str): 包含 MEX 文件的目录路径。 Returns: anndata.AnnData: 包含加载数据的 AnnData 对象。 \"\"\" # 1. 读取稀疏矩阵数据 (matrix.mtx.gz) # scipy.io.mmread 用于读取 Matrix Market 格式的稀疏矩阵文件 (.mtx) # 默认 dtype 是 float64，将其转换为 float32 以节省内存 mat = scipy.io.mmread(os.path.join(path, \"matrix.mtx.gz\")).astype(\"float32\") # 2. 矩阵转置 (Transpose) # Matrix Market 格式的约定是 (Feature x Cell)，但 AnnData 要求 (Cell x Feature) mat = mat.transpose() # 3. 转换为 CSR 稀疏矩阵格式 # CSR (Compressed Sparse Row) 格式是 AnnData 用于高效矩阵操作的首选格式 mat = csr_matrix(mat) # 4. 创建 AnnData 对象 # 使用转置并转换后的稀疏矩阵来初始化 AnnData 对象 # dtype=\"float32\" 再次确保数据类型 adata = anndata.AnnData(mat, dtype=\"float32\") # 5. 读取并设置特征/基因信息 (var) # features.tsv.gz 文件通常包含基因ID和/或基因名称 genes = pd.read_csv(os.path.join(path, \"features.tsv.gz\"), header=None, sep='\\t') # 将第一列（V1/0）的值作为 AnnData 的 var_names (特征名称) var_names = genes[0].values # 确保特征名称是唯一的，这是 AnnData 的最佳实践 var_names = anndata.utils.make_index_unique(pd.Index(var_names)) adata.var_names = var_names # 将基因 ID/符号作为 AnnData.var 的一个新列 'gene_symbols' 存储起来 # 即使 var_names 被唯一化了，原始的 ID 仍然有用 adata.var['gene_symbols'] = genes[0].values # 6. 读取并设置细胞条形码信息 (obs) # barcodes.tsv.gz 文件包含细胞的唯一条形码 # 将第一列（V1/0）的值作为 AnnData 的 obs_names (观测名称，即细胞名称) adata.obs_names = pd.read_csv(os.path.join(path, \"barcodes.tsv.gz\"), header=None)[0].values # 7. 最终检查和确保 var_names 唯一性 (尽管前面已经做过，这是一个安全步骤) adata.var_names_make_unique() # 8. 返回构建好的 AnnData 对象 return adata ## 测试一下 test = read_anndata_C4('./test/output/filter_matrix') ## /home/chenao/miniconda3/envs/cpdb/lib/python3.9/site-packages/anndata/_core/anndata.py:402: FutureWarning: The dtype argument is deprecated and will be removed in late 2024. ## warnings.warn( test ## AnnData object with n_obs × n_vars = 8350 × 45577 ## var: 'gene_symbols' 完成读取之后就可以正常进行下游的个性化分析，我们也给大家准备了详细的教程： 小白级单细胞分析全教程 四、参考 华大官方文档（ https://bgitechsolutions.com/sequencing/244） 华大B站视频介绍 dnbc4tools_github（ https://www.bilibili.com/video/av958683573/?vd\\_source=038c940ddc24688e3c4a0eb678552cc1） 五、演示环境 一切不给测试文件和分析环境版本的教程都是耍流氓，本推送的代码和测试文件可以在以下链接中下载： 通过网盘分享的文件: https://pan.baidu.com/s/1bkf-YB1WCjm6gCRYREKr0w 提取码: yckd R语言演示环境( 趁开学前| 入手足够完成硕博生涯的生信环境 )： sessionInfo() ## R version 4.4.2 (2024-10-31) ## Platform: x86_64-pc-linux-gnu ## Running under: Ubuntu 20.04.4 LTS ## ## Matrix products: default ## BLAS: /usr/lib/x86_64-linux-gnu/openblas-pthread/libblas.so.3 ## LAPACK: /usr/lib/x86_64-linux-gnu/openblas-pthread/liblapack.so.3; LAPACK version 3.9.0 ## ## locale: ## [1] LC_CTYPE=en_US.UTF-8 LC_NUMERIC=C ## [3] LC_TIME=en_US.UTF-8 LC_COLLATE=en_US.UTF-8 ## [5] LC_MONETARY=en_US.UTF-8 LC_MESSAGES=en_US.UTF-8 ## [7] LC_PAPER=en_US.UTF-8 LC_NAME=C ## [9] LC_ADDRESS=C LC_TELEPHONE=C ## [11] LC_MEASUREMENT=en_US.UTF-8 LC_IDENTIFICATION=C ## ## time zone: Asia/Shanghai ## tzcode source: system (glibc) ## ## attached base packages: ## [1] stats graphics grDevices utils datasets methods base ## ## other attached packages: ## [1] sceasy_0.0.7 reticulate_1.43.0.9001 Seurat_5.2.1 ## [4] SeuratObject_5.0.2 sp_2.2-0 ## ## loaded via a namespace (and not attached): ## [1] deldir_2.0-4 pbapply_1.7-2 gridExtra_2.3 ## [4] rlang_1.1.5 magrittr_2.0.3 RcppAnnoy_0.0.22 ## [7] spatstat.geom_3.4-1 matrixStats_1.5.0 ggridges_0.5.6 ## [10] compiler_4.4.2 png_0.1-8 vctrs_0.6.5 ## [13] reshape2_1.4.4 stringr_1.5.1 pkgconfig_2.0.3 ## [16] fastmap_1.2.0 labeling_0.4.3 promises 结构是否合理、这个口袋是否真实、这个姿势是否符合生物学机制。 因此，提高分子对接结果的说服力，并不是不断更换软件，直到得到一个更低的分数，而是尽可能减少建模和分析过程中的任意选择。 下面从蛋白结构选择、结合位点确定、体系预处理、对接验证和结果分析五个方面，梳理15个真正影响对接质量的实用技巧。 技巧一：不要只按分辨率选择PDB结构 # 很多人在PDB数据库中发现同一蛋白有多张结构时，会直接选择分辨率最高的一张。 分辨率当然重要，但它不是唯一标准。一张适合分子对接的蛋白结构，还需要考虑： 是否包含与目标分子相近的共晶配体； 蛋白处于激活态、失活态还是其他功能状态； 目标口袋附近是否存在缺失残基； 关键侧链是否具有合理构象； 是否保留必要的金属、辅因子或结构水； 晶体突变是否改变了活性位点； 当前结构是否属于真实生物学组装体。 例如，一张1.7Å的空载结构虽然整体分辨率很高，但口袋可能处于闭合状态；另一张2.2Å的配体复合物虽然分辨率略低，却完整保留了开放口袋和关键侧链方向。对于配体对接，后者往往更有参考价值。 实际怎么选？建议先列出候选结构，再比较： 结构状态是否符合研究问题； 共晶配体是否与目标分子具有相似骨架或作用机制； 口袋附近是否完整； 关键残基构象是否合理； Biological Assembly是否正确； 是否存在影响活性位点的工程突变。 如果两三张结构各有优势，可以进行集合对接，而不是强行只选择一张。 图1 同一靶点不同实验构象的虚拟筛选表现。同一蛋白的不同晶体结构对已知活性分子的识别能力可能存在明显差异。该研究说明，受体结构的选择不能只看分辨率，还应考虑共晶配体、口袋构象和蛋白功能状态。 案例实操：同一个GPCR应该选哪张结构？ # β₂肾上腺素能受体既有拮抗剂结合的非活化态结构，也有激动剂结合并由纳米抗体稳定的活化态结构。例如，PDB3P0G属于激动剂结合的活化状态，而5JQH对应卡唑洛尔结合状态。 图2 PDB 3P0G属于激动剂结合的活化状态。 如果研究对象是激动剂，却直接采用拮抗剂稳定的非活化构象，对接程序仍然可能给出较低分数，但受体口袋中的侧链取向和整体状态未必与研究问题匹配。 图3 PDB 5JQH对应结合状态。 因此，结构选择的第一原则不是“哪张最清楚”，而是：哪张结构最接近待研究配体可能识别的生物学状态？ 技巧二：优先选择带有相似共晶配体的结构 # 如果数据库中存在多个配体复合物，应优先考虑与目标分子在以下方面相近的共晶配体：核心骨架；分子体积；电荷状态；作用类型；占据的亚口袋；关键官能团方向。 这是因为不同配体可能诱导不同的侧链转动、柔性环闭合或口袋扩张。体积较小的片段配体形成的口袋，不一定能直接容纳一个体积较大的天然产物；反过来，大配体诱导形成的扩张口袋，也可能高估小分子的可结合空间。 实际怎么选？ 如果数据库中有三张结构：A：分辨率1.8Å，但为空载结构；B：分辨率2.2Å，带有与目标分子骨架相近的抑制剂；C：分辨率2.0Å，带有作用于另一亚口袋的片段；多数情况下，B比A和C更适合作为初始对接结构。 如果无法确定，可以对2～3张有代表性的结构进行集合对接，观察结论是否依赖某一张特定结构，而不是武断地只选择其中一张。 图4 单一受体结构与多构象集合对接的基本流程。多个受体构象可以来自不同实验结构、分子动力学轨迹或其他构象采样方法。该图说明，蛋白并不是完全静止的刚性结构，采用哪一种受体构象，会直接影响口袋形状和配体姿势。 技巧三：下载结构后，先确认Biological Assembly # PDB页面展示的Asymmetric Unit是晶体学不对称单元，不一定等于蛋白在生物学环境中的真实组装状态。用于分析的结构可能是：单体；同源二聚体；异源二聚体；三聚体或四聚体；通道蛋白的完整多亚基组装体。 RCSB PDB会分别提供Asymmetric Unit和Biological Assembly。生物学组装体可能由作者指定，也可能结合PISA等方法生成，因此下载后仍需要结合文献和功能信息判断。 以下情况不能随意拆成单链： 口袋位于亚基界面； 邻近链参与形成口袋壁； 配体同时接触两条链； 亚基装配影响活性位点构象； 研究对象是界面抑制剂或分子胶； 通道孔径由多个亚基共同形成。 一个很实用的检查：即使为了节省计算量，最终只对单链进行对接，也应把所得构象重新叠合回完整Biological Assembly，检查： 配体是否与邻近亚基发生空间冲突； 所谓“口袋”是否原本被另一条链占据； 邻近亚基是否贡献了关键残基； 配体是否误入亚基之间不存在的假空腔。 这个操作非常简单，却能排除不少看似漂亮、实际上不可能存在的构象。 技巧四：没有共晶结构时，先找同源蛋白，不要立刻盲对接 # 目标蛋白没有共晶配体，不代表结合位点完全没有参考。可以先寻找： 同一家族蛋白的配体复合物； 相同结构域的共晶结构； 同一蛋白在其他物种中的结构； 同源酶与底物、产物或抑制剂的复合物； 具有相同保守基序的结构。 将目标蛋白与同源复合物进行结构叠合后，可以观察配体所在位置是否对应于目标蛋白中的合理凹槽，并检查关键残基是否保守。 建议按照以下顺序操作： 使用序列或结构搜索寻找同源蛋白； 优先保留带配体的同源结构； 进行结构叠合； 将同源配体的位置映射到目标蛋白； 比较目标位点的残基组成和空间形状； 再决定是否以该区域设置对接网格。 这通常比直接在整个蛋白表面寻找最低分位置更可靠。 技巧五：口袋预测软件给出的最大口袋，不一定是活性位点 # 口袋预测软件主要识别蛋白表面的几何凹槽，并结合体积、深度、疏水性等特征进行排序。 它能回答的是：这里像不像一个可以容纳小分子的凹槽？但它不能单独回答：这个凹槽是不是与当前生物学功能有关？ 一个蛋白上可能同时存在：催化位点；底物结合位点；辅因子结合位点；变构位点；亚基界面空腔；由缺失残基或不完整组装造成的假口袋。 确定口袋时，建议按证据强度排序： 共晶配体、底物或抑制剂的位置； 已知催化残基和突变实验； UniProt和文献功能注释； 同源蛋白的配体结合位点； 保守残基与保守结构域； 口袋预测结果； 全蛋白盲对接结果。 口袋预测更适合补充证据，而不是取代功能证据。 技巧六：盲对接用来找候选区域，局部对接才用来确定姿势 # 全蛋白盲对接的搜索空间很大。为了覆盖整个蛋白，程序必须在有限计算量下减少每个区域的搜索深度。因此，盲对接更适合回答：配体可能优先出现在蛋白的哪些区域？ 它不适合仅凭一个最低分构象，就直接确定最终结合模式。更稳妥的操作是： 使用盲对接获得候选区域； 对所有构象按照空间位置聚类； 找出重复出现的1～3个主要区域； 与功能残基、保守区域和同源结构进行对应； 分别建立局部网格； 提高搜索强度进行局部精细对接； 再比较姿势、关键接触和构象收敛性。 如果已知关键残基或共晶配体位置，则通常没有必要先做全蛋白盲对接，直接围绕已知位点进行局部对接更有效。 技巧七：删除共晶配体前，先保存一份完整结合环境 # 很多人拿到PDB结构后，会直接删除配体、水和其他HETATM记录，然后开始蛋白预处理。 这样做容易丢失最有价值的参照信息。 删除共晶配体之前，建议先记录：配体几何中心；配体周围约4～6Å内的残基；主要氢键和盐桥；芳香堆积与疏水锚点；金属离子及配位残基；桥联水；辅因子；配体与邻近亚基的接触。 最好同时保留两份文件：原始完整复合物：用于后续叠合和对照；处理后的受体结构：用于正式对接。这样做不仅方便设置网格，也能在结果分析时判断新配体是否利用了原有的识别环境。 技巧八：水、金属和辅因子不要机械地全部删除 # “删除水和杂原子”只是一种简化操作，不是一条普遍适用的规则。 通常需要考虑保留的成分包括： 参与催化或结合的金属离子； NAD⁺、NADH、FAD、FMN和血红素等辅因子； 连接蛋白和配体的桥联水； 稳定关键侧链构象的结构水； 直接参与质子转移的催化水； 与配体共同构成活性中心的其他成分。 通常可以删除： 远离口袋的表面结晶水； 缓冲液分子； 与研究体系无关的盐离子； 非功能性结晶添加物。 案例实操：金属酶为什么不能只保留蛋白？ 如果某个酶的活性中心由蛋白残基、Zn²⁺和辅酶共同构成，删除Zn²⁺后，口袋的静电环境和几何限制都会发生变化。 普通对接程序仍可能把配体放进口袋，但它可能：占据原本金属所在的位置；形成不真实的氢键；产生错误的配体方向；因缺少金属配位项而得到误导性评分。 因此，金属酶对接首先要确认金属是不是活性中心的组成部分，然后检查配位残基、配位数、配位距离和配体可能使用的配位原子。此类体系不能只根据总评分选择构象。 图5 分阶段纳入蛋白柔性与活性位点环境的对接流程。研究依次比较刚性受体、侧链柔性、蛋白构象采样和活性位点水分子等因素对对接结果的影响。该研究说明，水分子的保留或删除不能机械处理，而应结合具体口袋及作用网络判断。 技巧九：质子化不是简单地“添加极性氢” # 蛋白中的氢原子通常无法直接从常规X射线结构中完整确定，但氢的位置会直接影响： 氢键供体和受体； 盐桥； 局部电荷； 金属配位； 催化残基状态； 配体在口袋中的朝向。 需要重点检查的残基包括：His；Asp和Glu；Lys和Arg；Cys；Tyr；位于催化中心或金属附近的特殊残基。其中His尤其容易被忽略。中性His可能以HID或HIE形式存在，也可能以带正电的HIP形式存在。不同状态会改变其氢键方向。 案例实操：His状态改变后应该比较什么？ 假设His位于配体3～4Å范围内，而且可能与配体羰基形成氢键，可以分别准备两个合理模型： 模型A：His的质子位于ND1； 模型B：His的质子位于NE2。 使用相同网格和相同对接参数计算后，不要只比较两组最低分，还要检查： 配体是否发生翻转； 原来的氢键能否形成； 其他关键锚点是否仍然保留； 前几名构象是否收敛； 哪一种状态更符合周围氢键网络。 如果结论随His状态完全翻转，就不能把其中一个结果当作确定答案，而应说明模型对质子化状态敏感。 图6 官能团的氢原子取向、质子化状态及互变异构形式。蓝色半圆表示氢键供体作用区域，红色半圆表示氢键受体作用区域。即使重原子坐标没有改变，氢原子的位置和质子化形式不同，也会改变蛋白–配体之间的氢键供受体关系。图A展示羟基旋转形成的不同氢键方向，B展示环状胺的质子化状态，C展示咪唑环的不同互变异构形式。 技巧十：配体不要只准备一个随手画出的结构 # 很多分子在实验条件下并不是唯一状态，可能同时存在： 不同质子化状态； 不同互变异构体； 不同立体异构体； 不同环构象； 不同电荷状态。 尤其需要注意： 羧酸； 胺基； 咪唑； 含氮杂环； 酚羟基； 磷酸基； 多酸、多碱分子。 已有研究系统比较了配体质子化、互变异构和立体化学状态对GOLD和PLANTS对接结果的影响，说明输入微观状态本身就可能改变对接表现。 更合理的处理是根据实验pH生成主要微观状态，然后分别对接。最终应结合：该状态在实验pH下的可能比例；口袋环境是否能稳定该电荷；构象是否合理；关键相互作用能否复现；综合判断，而不是简单选择分数最低的电荷形式。 技巧十一：网格不要刚好卡住已知配体 # 如果网格只比共晶配体大一点，程序可能没有足够空间完成： 配体翻转； 侧链取向搜索； 较大取代基重新定位； 入口区域探索； 相邻亚口袋探索。 网格过小可能人为迫使配体保持某种姿势；网格过大则会降低局部搜索效率。比较实用的做法是： 以共晶配体几何中心或关键残基中心设置网格； 覆盖完整口袋和入口； 为目标配体最长尺寸保留适当余量； 对明显大于共晶配体的分子，向可能延伸的亚口袋扩展； 检查网格是否错误覆盖到邻近无关空腔。 网格大小不是越大越好，而是要让配体能够充分搜索，同时避免把大量计算浪费在无关区域。 技巧十二：先做共晶配体重对接，再对接目标分子 # 重对接不是“把目标分子重复计算几次”，而是：从实验复合物中取出共晶配体，再使用当前对接流程将其放回口袋，检验这套结构处理和参数能否复现实验构象。 基本步骤包括：保存原始复合物；提取共晶配体；分别处理蛋白和配体；以原配体位置设置网格；重新进行对接；将预测姿势与晶体构象叠合；计算RMSD并检查关键相互作用。 通常会将RMSD小于2Å作为较常见的参考标准，但这个数字不能脱离具体情况使用。对接验证研究还会区分“是否采样到接近实验的姿势”和“评分函数能否将正确姿势排在前面”，两者并不是一回事。 重对接不能只看RMSD，还应检查：核心骨架是否叠合；关键官能团方向是否一致；实验氢键或配位是否恢复；正确姿势是否排在前几名；柔性末端是否拉高了整体RMSD；分子对称性是否造成原子映射误判；催化基团是否位于正确位置。 如果整体RMSD为1.8Å，但真正参与反应的基团方向相反，这个验证不能算真正通过。 图7 共晶构象与重对接预测构象的叠合示例。该类图片应同时展示晶体构象、预测构象和关键作用位置。重对接不仅需要计算整体RMSD，还要检查核心骨架、关键官能团以及催化或配位基团的方向是否得到恢复。 技巧十三：重复对接要改变随机种子，并统计重现性 # 对接算法通常包含随机搜索。如果只运行一次，最低分构象可能是稳定结果，也可能只是一次偶然命中。 重复对接的正确思路是：使用不同随机种子独立运行；其他条件保持一致；比较各次结果的口袋位置；对构象进行聚类；统计关键接触是否重复出现；观察分数波动范围。 例如独立运行10次后：8次进入同一个口袋；7次保持相似方向；9次接触同一个关键残基；分数集中在−8.3～−8.9 kcal/mol；这比单次得到−9.4 kcal/mol更能说明结果具有搜索稳定性。 重复计算的目的不是从更多结果里挑一个最低分，而是判断：这个结合模式能不能被独立搜索重复找到？ 技巧十四：不要机械选择评分最低的构象，要看构象簇 # 假设一次计算输出20个构象：第一名为−9.2kcal/mol，但方向与其他构象完全不同；第二至第九名为−8.9～−8.4 kcal/mol，并集中在相似位置；其余构象比较分散。这时，不能只因为第一名分数最低，就直接把它作为最终结果。 更合理的判断包括：前几名构象是否聚集在同一位置；主构象簇占全部构象的比例；不同构象之间是否只是柔性末端不同；核心骨架和关键官能团是否保持一致；主构象簇是否具有明确的功能依据。 评分差异很小时，构象收敛性、关键作用和机制合理性通常比小数点后几位的分数更有意义。 如果两个构象相差只有0.3kcal/mol，这种差别通常不足以支持“前者一定结合更强”的结论。 技巧十五：最后必须回到三维结构，检查这个姿势是否真的合理 # 二维作用图适合展示结果，但不能代替三维判断。 自动生成的二维图可能：把距离较近的接触标成氢键；忽略氢键角度；漏掉水桥和金属配位；把普通疏水接触描述得过于重要；无法显示配体扭曲和空间冲突；无法判断反应基团的朝向。 最终构象至少要检查四个层面。 1. 几何合理性 # 是否存在明显原子冲突； 配体是否出现异常扭曲； 芳环和双键构型是否合理； 疏水基团是否被迫暴露在强极性环境； 带电基团是否处于合理区域。 2. 结合模式合理性 # 是否占据已知功能口袋； 是否利用了共晶配体的关键锚点； 是否接触保守残基； 是否受到入口、膜区或邻近亚基的限制。 3. 机制合理性 # 对于酶底物，不能只看它是否进入口袋，还要看：反应原子之间的距离；亲核进攻角度；反应基团是否朝向催化残基；金属配位数和几何；与辅因子的相对位置。 对于抑制剂，则应检查：是否真正占据底物关键空间；是否阻挡入口或关键构象变化；是否破坏蛋白界面的热点接触； 是否位于能够产生调控作用的位置。 4. 结果稳定性 # 不同随机种子能否复现； 前几名构象是否集中； 换用另一张合理蛋白结构后是否仍然成立； 合理改变质子化状态后是否完全翻转； 放回完整多聚体后是否发生冲突。 并不是每个项目都要把所有验证全部做满 # 提高说服力，不等于每个项目都必须加上MD、MM/PBSA、突变和自由能计算。需要做到什么程度，取决于希望支持什么结论。 希望支持的结论 建议的基础证据 配体可能结合某个口袋 位点依据、合理蛋白结构、局部对接和三维检查 预测具体结合模式 重对接、重复对接、构象聚类和关键作用复核 比较几个配体的结合特点 统一结构、统一参数、相同微观状态处理和合理对照 说明某姿势可以动态维持 分子动力学、配体位置、关键距离和接触占有率 解释突变造成的活性变化 WT/突变体统一建模、对接或MD比较，并对应实验结果 解释酶催化或金属配位 催化距离、角度、配位几何，必要时使用QM/MM 预测相对亲和力差异 需要MM/GBSA、FEP或TI等进一步计算，不能只比较对接分数 尤其要注意，对接分数主要用于当前计算条件下的构象筛选或初步排序。不能看到A为−9.2kcal/mol、B为−8.5 kcal/mol，就直接写成“A的实际结合能力显著强于B”。 最后：真正提高的不是分数，而是结果的可解释性 # 提高分子对接说服力，并不是想办法让软件给出一个更低的分数，而是尽量减少计算过程中的任意选择。 在给出最终结果之前，至少应该能够回答： 为什么选择这张蛋白结构？ 为什么使用单链或完整多聚体？ 为什么把网格设置在这个位置？ 这个口袋有什么结构或功能依据？ 为什么保留或删除这些水、金属和辅因子？ 蛋白和配体采用了什么质子化状态？ 当前流程能否复现共晶配体？ 最终构象是否能在独立计算中重复出现？ 为什么选择这个构象，而不是只因为它排名第一？ 这个姿势是否符合真实的结合或反应机制？ 这些问题能够逐一回答，对接结果才不只是软件自动生成的一张作用图，而是一个可以检查、可以解释，也可以被后续实验验证的结构模型。 小技巧真正解决的，不是“怎样得到想要的结果”，而是“怎样减少不必要的错误，让每一步选择都有依据”。 参考文献 # Amaro RE, Baudry J, Chodera JD, et al. Ensemble Docking in Drug Discovery. Biophysical Journal . 2018;114:2271–2278. Rueda M, Bottegoni G, Abagyan R. Recipes for the Selection of Experimental Protein Conformations for Virtual Screening. Journal of Chemical Information and Modeling . 2010;50:186–193. Elokely KM, Doerksen RJ. Docking Challenge: Protein Sampling and Molecular Docking Performance. Journal of Chemical Information and Modeling . 2013;53:1934–1945. Bietz S, Urbaczek S, Schulz B, Rarey M. Protoss: A Holistic Approach to Predict Tautomers and Protonation States in Protein–Ligand Complexes. Journal of Cheminformatics . 2014;6:12. ten Brink T, Exner TE. Influence of Protonation, Tautomeric, and Stereoisomeric States on Protein–Ligand Docking Results. Journal of Chemical Information and Modeling . 2009;49:1535–1546. Mukherjee S, Balius TE, Rizzo RC. Docking Validation Resources: Protein Family and Ligand Flexibility Experiments. Journal of Chemical Information and Modeling . 2010;50:1986–2000. Trott O, Olson AJ. AutoDock Vina: Improving the Speed and Accuracy of Docking with a New Scoring Function, Efficient Optimization, and Multithreading. Journal of Computational Chemistry . 2010;31:455–461. 更多分子对接 / 分子动力学 / 量子化学计算 / 科研作图 👉 关注「研算录」 📬 内容需求 / 选题建议：欢迎后台留言 （如有疏漏欢迎交流指正。） # docking · 目录 闪记 复制 LaTeX 公式","tags":["clippings","生信教程","分子对接","AutoDock Vina","PDB","结合能","暂未试用"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"网页教程","updated":"2026-10-25T17:37:28.589Z","url":"bioinfo-tools/notes/efe25d26b4a57bbf89261971.html"},{"kbId":"KB-000067","title":"一文帮你搞定转录组联合表观组摆图逻辑1","subtitle":"","summary":"一文帮你搞定转录组联合表观组摆图逻辑1","body":"摘要 LLM 归库摘要 核心内容： 以一篇 Redox Biology（IF 11.9）的 H3K9 乳酸化研究为例，系统拆解 CUT\u0026Tag + RNA-seq 联合分析的七层摆图逻辑，从全局 metagene 分析 → promoter peak 分布 → GO/GSEA 富集 → Venn 交集筛选 → IGV 可视化验证 → qPCR/ChIP-qPCR 湿实验验证 → 双荧光素酶功能验证。 可复用知识： CUT\u0026Tag 的 peak 代表修饰富集区域而非基因表达；\"修饰变化 ∩ 表达变化 = 候选功能靶基因\"是全文最核心的联合分析逻辑；promoter/TSS 区域富集是组蛋白修饰驱动转录激活的关键信号。 适用场景： 需要理解或设计 bulk 层面组蛋白修饰（CUT\u0026Tag/ChIP-seq）与转录组（RNA-seq）联合分析的文章 figure 排布逻辑。 输入： CUT\u0026Tag 差异 peak 列表 + RNA-seq DEG 列表。 输出： 七层证据链（从全局分布到单基因功能验证）的文章 figure。 关键参数/步骤： metagene analysis（TSS±3kb）、genomic feature distribution（promoter 占比）、GO/GSEA、Venn overlap、对角火山图、IGV track、ChIP-qPCR + RT-qPCR + 双荧光素酶。 常见错误： 把 CUT\u0026Tag 的 peak 直接当表达量解读；跳过 Venn 交集直接挑基因；只用生信结果而不做独立湿实验验证。 与口腔生信连接： 若后续涉及口腔炎症微环境中的组蛋白修饰研究（如牙周炎/OSCC 中的乳酸化、乙酰化），可完全复用该七层摆图框架；需确认口腔相关细胞类型中是否有公开 CUT\u0026Tag 数据可用。 关联页面建议： 03 生信教程与工具库/02_wiki/workflows/ （可新建 bulk 多组学联合分析摆图工作流页面）、 02 文献精读与汇报库/00_inbox/ （若后续获取该 Redox Biology 原文可做深度文献笔记） 下一步处理： 可结合 Science同款｜个性化通路富集-GSEA排序气泡图 中的 GSEA 可视化方法，补充联合分析中的富集结果展示方案；批量复现摆图逻辑后可将稳定步骤提炼为 workflow 页面。 归库说明： 分类到 03 生信教程与工具库，置信度 0.85，理由：微信公众号生信教程，无 DOI/PMID，核心价值为方法论教学而非单篇论文证据。 HengQin 2026年5月24日 18:18 一文帮你搞定转录组联合表观组摆图逻辑1 # 不要只会看到别人高分文章中出现过这张组学分析的图，就想着我也要，但是不知道为什么要，知道它很重要，却不能讲清楚缘由，我们应争取理解使用这张图的目的，以及摆图逻辑。 今天的推文，争取通过这篇高分文章，让大家了解并掌握转录组联合Cut\u0026tag的常见摆图逻辑，明白相应的图如何摆，为什么摆，有什么意义。 【论测序费用，这个相较于单转与空转的自测成本相对低很多，测序费用有限的老师其实可以考虑表观角度，当然挖掘公共数据库的单转与空转或者其它组学配合湿实验用也可以重点考虑】 前面的一系列推文中，包含了： 生物医学常见实验如qPCR、WB、CCK8、免疫组化与免疫荧光等的结果在高分文章中的展示 顶刊中常用的统计方法介绍与目前统计方法生物医学论文中的冲突 介绍组学，从转录组开始，转录组白话说争取从白话对话的角度让你基本明白为什么测转录组，对应的实验流程与分析流程概述 以及部分单转空转文章的解读等。 大家感兴趣的可以看看前面，争取做一个系列，彻底搞定常规问题。 一、介绍 # 乳酸化自2019年首次被提出以来，迅速成为表观遗传与代谢调控交叉领域的研究热点，并在近年来持续保持较高关注度。今天我们解析的是一篇发表于2026年1月、刊登于Q1期刊《Redox Biology》（影响因子11.9）的研究——\"Histone H3K9 lactylation activates the TXNIP/NLRP3 pathway to drive macrophage inflammation after spinal cord injury\"（中文：组蛋白H3K9乳酸化激活TXNIP/NLRP3通路，驱动脊髓损伤后巨噬细胞炎症反应）。 该研究的核心技术路线采用了转录组学（RNA-seq）与表观组学（CUT\u0026Tag）联合分析策略。之所以必须进行多组学整合，本质原因在于：当研究对象是 组蛋白修饰 时，其生物学意义并不局限于\" 是否发生变化 \"，而在于其 是否进一步影响下游基因转录网络及功能通路 。因此，单一组学往往只能回答\"发生了什么\"，而无法解释\"为什么发生\"以及\"最终影响了什么\"。 从机制层面来看，组蛋白修饰本身就是典型的转录调控层级信号，其核心生物学功能是调控靶基因的转录激活或抑制状态。因此，一旦锁定某一类组蛋白修饰（例如H3K9乳酸化），研究就必须进一步追问：该修饰究竟作用于哪些基因？影响哪些信号通路？最终是否驱动细胞表型改变乃至组织病理变化？ 在更系统的研究设计中，还可以从\"调控轴\"的角度进一步深化分析，例如关注乳酸化相关的写入酶（Writer）、擦除酶（Eraser）以及潜在上游调控因子（如代谢状态或转录因子），从而构建\"代谢—表观遗传—转录调控—细胞功能\"的完整调控链条。这类多层级机制如果能够在体内外实验中形成闭环验证，很有可能具备冲击子刊的能力。 今天，我们重点给大家介绍作者锁定具体组蛋白具体修饰位点的逻辑，以及作者如何通过两个组学锁定Txnip作为H3K9乳酸化修饰的功能基因的，同时帮助大家梳理相对陌生的Cut\u0026tag摆图逻辑，争取一篇文章让大家对于转录组联合摆图有清晰的理解。 下面我们以提问的方式进行展开： 二、锁定与分析逻辑 # Q1:如何锁定乳酸化修饰的具体组蛋白修饰位点 （如何锁定乳酸化，大家可以看看作者的介绍与前面的对应结果，此处咱们重点讲作者如何挑选出对应组蛋白对应的修饰位点） 作者文献调研了三个已知的巨噬细胞参与H3组蛋白经典赖氨酸乳酸化的位点,从AB图中，我们可以看到三种乳酸化修饰，都有增强的趋势，但是出H3K9la在14dpi的SCI中最显著；C图将各条带强度标准化至上样对照后，仅 H3K9la 显著上调，而 H3K14la 和 H3K18la 的变化较小且不显著，所以作者锁定了H3K9la。 Q2: 组学联合锁定 H3K9la 的关键靶基因（全文核心机制） img 前面的研究已经发现，脊髓损伤（SCI）后乳酸显著积累，同时 H3K9la 水平明显升高。但此时其实只回答了一个现象性问题： SCI 后发生了组蛋白乳酸化。 真正更关键的问题是： H3K9la 究竟修饰了哪些基因？这些修饰是否真的改变了基因表达，并进一步参与 SCI 的炎症损伤过程？ 这是因为，组蛋白修饰本质上 并不是\"单纯的化学标记\" ，而是 能够通过改变染色质状态 ，进一步 影响靶基因的转录激活或抑制 。因此，作者接下来真正想解决的问题是： SCI 后，H3K9la 是通过调控哪些关键基因参与病理过程的。 为了解决这个问题，作者首先进行了 CUT\u0026Tag 测序 ，并使用抗 H3K9la 抗体对发生 H3K9la 修饰的染色质区域进行富集分析。这里一定要理解， CUT\u0026Tag 检测的并不是\"基因表达 \"，而是： H3K9la 在基因组中的分布位置。 换句话说，它回答的是： \"H3K9la 修饰贴在了哪里？\" [其实bulk Cut\u0026tag层面是贴在了多少细胞里，多少细胞发生了修饰，进而比较修饰强弱] 因此，CUT\u0026Tag 得到的 核心结果并不是表达量 ，而是所谓的 peak（富集峰） 。所谓 peak，本质上就是：某一区域出现大量测序 reads 堆积，说明 H3K9la 在该区域高度富集。因此，peak 真正代表的是： \"H3K9la 修饰富集区域\" 而不是基因表达水平。 随后，作者首先进行了经典的 metagene analysis（元基因分析） 。 其本质并不是观察某一个具体基因，而是将全基因组所有基因按照统一结构进行\"对齐\" ，即： upstream → TSS → gene body → TES → downstream 然后统计 H3K9la 在整个基因结构中的平均分布规律。这里作者重点分析了 TSS（转录起始位点）和 TES（转录终止位点）上下游 ±3 kb 区域 的 H3K9la 富集情况。 之所以重点观察 TSS，是因为 TSS 是 RNA polymerase 开始转录的位置，也是转录调控最核心的区域。通常，启动子（promoter）、转录因子（transcription factors）、RNA polymerase II 以及各种激活性组蛋白修饰，都会集中富集在这里。因此，如果某种组蛋白修饰在 TSS 附近明显增加，往往意味着它可能正在参与基因转录激活。而观察 TES，则是为了从整体上分析该修饰在整个基因结构中的分布趋势，例如它更偏向 promoter 区域、gene body 区域，还是转录终止区域。 结果显示，SCI 后 H3K9la 在基因启动子及其上游区域显著富集，尤其是在 TSS 附近最为明显。这一结果非常关键，因为： 启动子 = 基因转录开关 如果 H3K9la 大量集中于 promoter/TSS 区域，通常意味着它正在增强该区域的染色质开放状态，从而促进转录机器结合，最终激活基因表达。 为了进一步验证这一点，作者统计了 H3K9la peak 在不同基因组功能元件中的分布情况。结果发现，在 SCI 小鼠循环单核细胞来源的巨噬细胞中，共鉴定出 18,797 个 H3K9la 差异峰，其中 8.37% 位于 promoter（±3 kb）区域；而假手术组仅检测到 4,740 个差异峰，其中仅有 3.98% 位于 promoter 区域。 这说明，SCI 后不仅 H3K9la 总体水平增加，更重要的是： H3K9la 特异性地集中到了启动子区域。 这一点非常重要，因为启动子区域决定了基因是否能够启动转录。因此，作者提出：SCI 后增加的 H3K9la，很可能通过增强启动子区域活性，进一步促进相关基因的转录激活。 接下来，作者进一步对这些 H3K9la 富集增加的基因进行了 GO 和 GSEA 富集分析，用于回答： \"H3K9la 主要在调控什么生物学过程？\" 结果显示，这些基因主要富集于细胞迁移、细胞黏附、炎症反应、氧化应激以及免疫应答等通路。 说明 H3K9la 并不是随机修饰，而是重点参与 SCI 后的炎症微环境调控 。热图进一步显示，多个关键炎症免疫相关基因（如 TXNIP、IL-1β 和 CD14）均出现明显的 H3K9la 升高。这一步非常重要，因为作者开始 从\"全局通路变化\"逐渐聚焦到\"具体候选基因\" 。 然而，这里存在一个非常关键的问题： \"修饰改变\"并不等于\"表达改变\"。 CUT\u0026Tag 只能说明某个区域 发生了 H3K9la 修饰，但并不能证明该基因真的被激活 。因此，作者进一步进行了 RNA-seq ，用于直接检测哪些基因表达真正发生了变化。 RNA-seq 共鉴定出 591 个差异表达基因（DEGs），而 CUT\u0026Tag 共得到 988 个差异 H3K9la 峰相关基因。随后，作者进行了交集分析（Venn analysis）。这里的逻辑是全文最核心的分析思路之一： CUT\u0026Tag： 谁被H3K9la修饰 RNA-seq： 谁表达发生变化 交集： 谁最可能是H3K9la直接调控的功能靶基因 最终， 共筛选出 28 个共同基因 。这些基因同时满足： H3K9la 修饰改变 RNA 表达改变 因此， 它们成为 H3K9la 最可能的候选功能靶基因。 随后，作者进一步绘制了 RNA-seq 的对角火山图，并重点标注了与 CUT\u0026Tag 重叠的基因。结果发现，TXNIP 是表达上调最显著的基因之一，而 Hmox1 则是表达下调最显著的基因之一。 很多人会疑惑：既然有 28 个候选基因，为什么作者最终重点研究 TXNIP？原因其实是多层筛选的结果 。 首先，TXNIP 同时 满足 CUT\u0026Tag 修饰变化与 RNA-seq 表达变化 ，因此首先进入候选池。其次，它在 统计学上变化最显著 ，具有更高 fold change 和更强显著性。更关键的是，TXNIP 本身就是一个 经典的炎症调控分子 ，与 ROS、氧化应激、NLRP3 inflammasome 以及炎症放大反应密切相关，而 SCI 的核心病理机制之 一正是炎症级联损伤。因此，TXNIP 具有极强的机制合理性。 此外，IGV 峰图进一步显示，SCI 后 TXNIP 启动子区域的 H3K9la 显著升高，而 Hmox1 启动子区域的 H3K9la 则明显降低。这意味着： H3K9la 可能直接增强 TXNIP 的转录 而不仅仅是间接相关 。 更重要的是， TXNIP 的\"修饰变化\"与\"表达变化\"方向完全一致 ，均为上调，即： 修饰增强 → 表达增强 完全符合\"H3K9la 促进转录激活\"这一理论模型 。 为了进一步验证这一机制，作者随后又进行了 RT-qPCR、ChIP-qPCR 以及双荧光素酶实验。RT-qPCR 用于验证 TXNIP 表达确实升高；ChIP-qPCR 用于验证 TXNIP 启动子区域 H3K9la 真的富集；而双荧光素酶实验则 进一步证明 ： H3K9la 能够直接增强 TXNIP 启动子的转录活性 。 Q3: 文章的摆图逻辑，每一幅图对应的含义 第一层：先从全局证明 H3K9la 真的改变了 从全基因组平均分布规律，看的是全局层面，不是挑选个别基因，挑选几个基因肯定会质疑，说明SCI干预后 ，H3K9la 的整体分布模式真的改变了。 第二层：分析 peak 在基因组元件中的分布 统计peak落在什么区域，许多时候会重点观察promoter区域，因为promoter = 基因转录开关，所以promoter 区域 peak 显著增加，可以进一步推断：H3K9la 可能通过调控 promoter 活性影响转录。 第三层：GO/GSEA 功能富集分析 + 热图展示 有大量基因发生H3K9la修饰，但这些基因是干什么的？ 从基因上升到生物学功能，聚焦关注感兴趣的显著差异通路。 为什么作者在此处热图展示了具体感兴趣富集通路基因呢，告诉读者\"到底是通路的哪些具体基因发生变化\"，从通路收缩到具体基因上。 开始联合了： 第四层：RNA-seq 联合分析 谁被修饰且谁的表达发生改变,就最有可能改变之后，发挥作用,也就可能是对应的功能靶基因，所以做完Cut\u0026tag之后，作者进一步进行了RNAseq取交集，找修饰变化与表达变化的关键功能基因。 取交集后，还有28个基因，作者通过对角火山图展示了28个基因的分布，想通过显著性排优以及结合背景的的方式进行选择。其中，最显著上调的是Txnip，最显著下调的是Hnox1。 不仅仅是因为最显著，由于Txnip同时满足： 修饰增强 表达增强 promoter peak增强 炎症相关 fold change显著 因此：成为最合理机制核心基因 第五层： IGV可视化 让读者肉眼看到真的有peak，真正有reads堆积在对应基因上，而不是单纯的统计数字 【同WB图，表观中非常重要，必摆】 第六层：qPCR与ChIP-qPCR 必须湿实验验证，因为前面都属于高通量测序分析，存在算法偏差；算法偏差与peak calling偏差，所以必须独立实验验证。【简单纯生信不好发了，也是这个道理，避免数字错觉】 RT-qPCR 验证TXNIP表达真的升高； ChIP-qPCR 验证TXNIP promoter真的存在H3K9la富集。 第七层： 双荧光素酶实验 前面最多能说明表达与修饰的相关，不能证明H3K9la修饰真的增强启动子活性；双荧光素酶能通过添加启动子接荧光素酶基因的方式，说明H3K9la 能直接增强 TXNIP promoter 转录活性。 Ending与提示： 好了，今天的推文就到这了。 大家好好读读这篇文章，通过这篇文章，相信能帮助大家理解Cut\u0026tag联合转录组的分析角度与基础摆图以及联合分析思路，掌握了，就能大致了解高分文章背后的摆图逻辑了。 微信扫一扫赞赏作者 收录于bulk多组学联合 继续滑动看下一个 不如好好学生信吧 向上滑动看下一个 闪记 复制 LaTeX 公式","tags":["clippings","暂未试用","bulk多组学联合","CUT\u0026Tag","RNA-seq","转录组","表观组","摆图逻辑"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"网页教程","updated":"2026-10-25T17:37:28.588Z","url":"bioinfo-tools/notes/607d1554fb67d1142c61dcf1.html"},{"kbId":"KB-000068","title":"使用R语言美化PCA图","subtitle":"","summary":"[!summary] 原文证据摘要 文章介绍两种 PCA 结果可视化：使用 FactoMineR::PCA() 和 factoextra::fviz pca ind() 美化二维样本图，以及使用 pca3d::pca3d() 绘制三维 PCA。示例数据是 R 自带的 iris 数据集。 标题： 使用R语言美化PCA图 公众号/作者： 医学和生信笔记 / 阿越 发布时间： 2021-12-30 21:51 原文链接： 浏览器核验结果： 页面包含“美化普通的二维PCA图”和“画一","body":"摘要 原文证据摘要 文章介绍两种 PCA 结果可视化：使用 FactoMineR::PCA() 和 factoextra::fviz_pca_ind() 美化二维样本图，以及使用 pca3d::pca3d() 绘制三维 PCA。示例数据是 R 自带的 iris 数据集。 页面核验信息 # 标题： 使用R语言美化PCA图 公众号/作者： 医学和生信笔记 / 阿越 发布时间： 2021-12-30 21:51 原文链接： https://mp.weixin.qq.com/s/LTQIWYW86QCOEu7fctF8xQ 浏览器核验结果： 页面包含“美化普通的二维PCA图”和“画一个三维的PCA图”两节；二维部分明确使用 ggplot2 、 factoextra 、 FactoMineR ，三维部分使用 pca3d 。 原文方法摘录 # 二维 PCA # 原文以 iris 前四列做 PCA，并以 Species 作为分组。核心调用为： library(ggplot2) library(factoextra) library(FactoMineR) df \u003c- iris[c(1:4)] iris.pca \u003c- PCA(df, graph = FALSE) fviz_pca_ind( iris.pca, geom.ind = \"point\", pointsize = 3, pointshape = 21, fill.ind = iris$Species, addEllipses = TRUE, legend.title = \"Groups\", title = \"\" ) + theme_bw() 原文强调 factoextra 返回的图可以继续用 ggplot2::theme() 调整字体、坐标轴、图例位置和背景。迁移到 Bulk RNA-seq 时， iris$Species 应替换为样本信息表中的分组列，输入矩阵应改为“基因 × 样本”。 三维 PCA # 原文使用 pca3d 包的 metabo 数据： library(pca3d) data(\"metabo\") pca \u003c- prcomp(metabo[, -1], scale. = TRUE) gr \u003c- factor(metabo[, 1]) pca3d(pca, group = gr, show.centroids = TRUE, legend = \"topleft\") 复用时需要修正的地方 # 原文二维代码的 PCA 对象命名为 iris.pca ，后续示例中出现过 res.pca ；复用时应统一对象名。 palette = \"lacent\" 看起来是原文示例中的拼写问题，正式分析应使用明确的颜色向量或已确认存在的调色板。 对 shape = 21 一类需要填充色的点，建议先确认当前 factoextra 版本对 fill.ind 的支持；不兼容时改用 col.ind 或提取 PCA scores 后用 ggplot2 自定义绘图。 三维图更适合探索，不应代替二维 PCA 的 QC 记录；正式报告仍应保留 PC1/PC2、解释率和样本分组信息。 与综合方法页的关系 # 本页保留原文方法证据；可复用的 Bulk RNA-seq 参数化脚本见远程仓库 04_Bulk转录组/4.2_PCA/01_factoextra_PCA二维美化.R ，综合说明见 03 生信教程与工具库/02_wiki/methods/Bulk转录组PCA美化图-二维三维与ggbiplot 。","tags":["clippings","生信教程","Bulk转录组","PCA","R语言","factoextra","FactoMineR","pca3d","暂未试用"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"网页教程","updated":"2026-10-25T17:37:28.588Z","url":"bioinfo-tools/notes/5767a0d7a18c5d0425164ffc.html"},{"kbId":"KB-000065","title":"Science同款｜个性化通路富集-GSEA排序气泡图","subtitle":"","summary":"","body":"摘要 LLM 归库摘要 核心内容： 这是一篇复现 Hallmark GSEA 排序气泡图的单细胞生信教程，围绕 treatment vs control 上皮细胞差异分析、GSEA 富集和 ggplot2 气泡图展示展开。 适用场景： 已有 Seurat 对象、细胞注释和分组信息时，用于比较两组目标细胞的通路整体变化，并制作类似 CNS/Science 风格的 NES 排序气泡图。 输入： 质控/注释后的 Seurat 对象、目标细胞类型字段、实验分组字段、Hallmark 基因集。 输出： GSEA 结果表、每个通路的 NES/pvalue/setSize/检出率，以及一张以 NES 为纵轴、通路排序为横轴的气泡图。 关键参数/步骤： FindMarkers() 构建 avg_log2FC 排序向量； msigdbr(category = \"H\") 获取 Hallmark； clusterProfiler::GSEA() 运行富集；点大小映射检出率，透明度映射 -log10(pvalue) 。 常见错误： 原文代码块被微信剪藏压缩，部分 R 语句缺少换行；第 8 步 detect_rate 处疑似代码缺失，实际复现时需补为对通路基因 gene_detect 的均值计算。 与口腔生信连接： 可迁移到牙周炎、OSCC 或口腔免疫单细胞项目中，用于展示上皮细胞、免疫细胞或肿瘤细胞在不同分组间的 Hallmark 通路方向性变化。 关联页面建议： 后续可整合到 03 生信教程与工具库/02_wiki/workflows/单细胞教程 或可视化方法页。 下一步处理： 若准备复现，建议先整理为可运行 R 脚本，修复换行和检出率计算，再保存示例输出图。 归库说明： 分类到 03 生信教程与工具库，置信度 0.88；理由是其核心是单细胞 GSEA 可视化教程，而非单篇论文精读。 整理版可运行 R 代码 # 说明 使用说明 下面代码把原文中被微信压缩到一行的 R 代码重新整理成可读、可改、可运行版本。 你只需要优先修改 用户参数区 ：对象路径、目标细胞类型、分组列名、实验组/对照组名称、输出目录。 第 8 步 detect_rate 已补全：对每个 Hallmark 通路内、在当前 Seurat 对象中存在的基因，计算其在目标细胞中的平均检出率。 若你使用 Seurat v5，代码会优先尝试 layer = \"counts\" ；若是 Seurat v4，则自动回退到 slot = \"counts\" 。 ## ============================================================ ## Hallmark GSEA 排序气泡图｜整理版 ## 目的：基于 Seurat 对象的 treatment vs control 差异分析结果， ## 绘制 Hallmark gene sets 的 NES 排序气泡图。 ## 输入：已经完成质控、降维、聚类、细胞注释和分组标注的 Seurat 对象 ## 输出：marker 表、GSEA 表、绘图数据表、GSEA bubble plot ## ============================================================ ## 0. 加载 R 包 ------------------------------------------------- suppressPackageStartupMessages({ library(Seurat) library(dplyr) library(tibble) library(ggplot2) library(ggrepel) library(clusterProfiler) library(msigdbr) }) ## 1. 用户参数区 ------------------------------------------------ ## 根据自己的数据修改这里即可。 work_dir \u003c- \"E:/xy/2026/five/5.22/\" obj_path \u003c- \"E:/xy/public/scRNA.sub.rdata\" out_dir \u003c- file.path(work_dir, \"gsea_bubble_output\") ## load(obj_path) 后，环境里 Seurat 对象的名字。 ## 原文对象名是 scRNA.sub。 seurat_object_name \u003c- \"scRNA.sub\" ## 元数据列名。 celltype_col \u003c- \"celltype\" group_col \u003c- \"group\" ## 要分析的细胞类型和分组。 target_celltype \u003c- \"Epithelial_cells\" treatment_group \u003c- \"treatment\" control_group \u003c- \"control\" ## 差异分析参数。 min_pct \u003c- 0.5 logfc_cutoff \u003c- 0.5 p_adj_cutoff \u003c- 0.05 ## GSEA 参数。 species_name \u003c- \"Homo sapiens\" min_gs_size \u003c- 10 max_gs_size \u003c- 5000 seed_value \u003c- 123 ## 检出率阈值。 ## 原文思路是“基因是否被检测到”。单细胞常用 counts \u003e 0； ## 如果想更严格，可以改成 1 或 5。 detect_count_threshold \u003c- 0 ## 标签数量：NES 最高和最低各标几个通路。 n_label_each_side \u003c- 3 ## 图形保存参数。 plot_width \u003c- 9 plot_height \u003c- 6 plot_dpi \u003c- 300 set.seed(seed_value) dir.create(out_dir, showWarnings = FALSE, recursive = TRUE) setwd(work_dir) ## 2. 读取 Seurat 对象 ----------------------------------------- load(obj_path) if (!exists(seurat_object_name)) { stop(\"没有在 rdata 中找到对象：\", seurat_object_name) } atlas_obj \u003c- get(seurat_object_name) if (!inherits(atlas_obj, \"Seurat\")) { stop(seurat_object_name, \" 不是 Seurat 对象，请检查 seurat_object_name。\") } ## 检查元数据列是否存在。 meta_cols \u003c- colnames(atlas_obj@meta.data) required_cols \u003c- c(celltype_col, group_col) missing_cols \u003c- setdiff(required_cols, meta_cols) if (length(missing_cols) \u003e 0) { stop(\"Seurat meta.data 缺少这些列：\", paste(missing_cols, collapse = \", \")) } ## 3. 提取目标细胞 --------------------------------------------- focus_obj \u003c- subset( atlas_obj, subset = .data\u003ca href=\"celltype_col\"\u003ecelltype_col\u003c/a\u003e == target_celltype ) message(\"目标细胞数量：\", ncol(focus_obj)) print(table(focus_obj@meta.data\u003ca href=\"group_col\"\u003egroup_col\u003c/a\u003e, useNA = \"ifany\")) if (!all(c(treatment_group, control_group) %in% focus_obj@meta.data\u003ca href=\"group_col\"\u003egroup_col\u003c/a\u003e)) { stop(\"目标细胞中没有同时包含 treatment_group 和 control_group，请检查分组名称。\") } ## 4. 差异分析 -------------------------------------------------- Idents(focus_obj) \u003c- group_col marker_tbl \u003c- FindMarkers( object = focus_obj, ident.1 = treatment_group, ident.2 = control_group, min.pct = min_pct, logfc.threshold = logfc_cutoff ) ## 兼容 Seurat 不同版本的 logFC 列名。 fc_col \u003c- dplyr::case_when( \"avg_log2FC\" %in% colnames(marker_tbl) ~ \"avg_log2FC\", \"avg_logFC\" %in% colnames(marker_tbl) ~ \"avg_logFC\", TRUE ~ NA_character_ ) if (is.na(fc_col)) { stop(\"FindMarkers 结果中没有 avg_log2FC 或 avg_logFC 列。\") } marker_tbl \u003c- marker_tbl %\u003e% rownames_to_column(\"gene\") %\u003e% arrange(desc(.data\u003ca href=\"fc_col\"\u003efc_col\u003c/a\u003e)) %\u003e% mutate( change_type = case_when( .data\u003ca href=\"fc_col\"\u003efc_col\u003c/a\u003e \u003e logfc_cutoff \u0026 p_val_adj \u003c p_adj_cutoff ~ \"up\", .data\u003ca href=\"fc_col\"\u003efc_col\u003c/a\u003e \u003c -logfc_cutoff \u0026 p_val_adj \u003c p_adj_cutoff ~ \"down\", TRUE ~ \"stable\" ) ) write.csv( marker_tbl, file = file.path(out_dir, \"01_FindMarkers_marker_tbl.csv\"), row.names = FALSE ) ## 5. 构建 GSEA 排序向量 --------------------------------------- rank_tbl \u003c- marker_tbl %\u003e% select(gene, rank_score = all_of(fc_col)) %\u003e% filter(!is.na(rank_score), !is.na(gene), gene != \"\") %\u003e% group_by(gene) %\u003e% summarise(rank_score = mean(rank_score), .groups = \"drop\") %\u003e% arrange(desc(rank_score)) rank_vec \u003c- rank_tbl$rank_score names(rank_vec) \u003c- rank_tbl$gene rank_vec \u003c- sort(rank_vec, decreasing = TRUE) if (length(rank_vec) \u003c min_gs_size) { stop(\"排序基因数量过少，无法进行 GSEA。\") } ## 6. 准备 Hallmark 基因集 ------------------------------------- ## msigdbr 不同版本参数可能略有差异：新版推荐 collection = \"H\"，旧版使用 category = \"H\"。 hallmark_raw \u003c- tryCatch( msigdbr(species = species_name, collection = \"H\"), error = function(e) msigdbr(species = species_name, category = \"H\") ) hallmark_map \u003c- hallmark_raw %\u003e% transmute( pathway = gsub(\"^HALLMARK_\", \"\", gs_name), symbol = gene_symbol ) %\u003e% distinct() %\u003e% filter(!is.na(pathway), !is.na(symbol), pathway != \"\", symbol != \"\") write.csv( hallmark_map, file = file.path(out_dir, \"02_Hallmark_TERM2GENE.csv\"), row.names = FALSE ) ## 7. 运行 GSEA ------------------------------------------------- gsea_obj \u003c- GSEA( geneList = rank_vec, TERM2GENE = hallmark_map, pvalueCutoff = 1, minGSSize = min_gs_size, maxGSSize = max_gs_size, verbose = FALSE, seed = TRUE ) gsea_df \u003c- as.data.frame(gsea_obj@result) if (nrow(gsea_df) == 0) { stop(\"GSEA 没有返回结果。请检查基因命名是否与 msigdbr 的 gene_symbol 一致。\") } write.csv( gsea_df, file = file.path(out_dir, \"03_GSEA_result.csv\"), row.names = FALSE ) ## 8. 计算每个通路的平均检出率 -------------------------------- ## 兼容 Seurat v5 layer 和 Seurat v4 slot。 expr_mat \u003c- tryCatch( GetAssayData(focus_obj, layer = \"counts\"), error = function(e) GetAssayData(focus_obj, slot = \"counts\") ) ## 每个基因在目标细胞中的检出比例。 gene_detect \u003c- Matrix::rowSums(expr_mat \u003e detect_count_threshold) / ncol(expr_mat) plot_df \u003c- gsea_df %\u003e% select(ID, Description, NES, setSize, pvalue, p.adjust) %\u003e% rowwise() %\u003e% mutate( detect_rate = { genes_in_pathway \u003c- hallmark_map$symbol[hallmark_map$pathway == ID] genes_in_pathway \u003c- intersect(genes_in_pathway, names(gene_detect)) if (length(genes_in_pathway) == 0) { NA_real_ } else { mean(gene_detect[genes_in_pathway], na.rm = TRUE) } } ) %\u003e% ungroup() %\u003e% arrange(desc(NES)) %\u003e% mutate( pathway_id = factor(ID, levels = ID), x_pos = row_number(), detect_percent = 100 * detect_rate, neg_log10_p = -log10(pmax(pvalue, .Machine$double.xmin)), direction = if_else(NES \u003e= 0, treatment_group, control_group) ) write.csv( plot_df, file = file.path(out_dir, \"04_GSEA_bubble_plot_data.csv\"), row.names = FALSE ) ## 9. 标注 NES 最高和最低的通路 ------------------------------- label_terms \u003c- c( head(plot_df$ID, n_label_each_side), tail(plot_df$ID, n_label_each_side) ) %\u003e% unique() label_palette \u003c- c(\"#D11E00\", \"#9972B2\", \"#A99909\", \"#D39E44\", \"#0072B2\", \"#009E73\") label_df \u003c- plot_df %\u003e% filter(ID %in% label_terms) %\u003e% mutate(label_col = rep(label_palette, length.out = n())) ## 10. 绘制 GSEA 排序气泡图 ----------------------------------- y_low \u003c- floor(min(plot_df$NES, na.rm = TRUE)) y_high \u003c- ceiling(max(plot_df$NES, na.rm = TRUE)) x_break_step \u003c- 10 x_max \u003c- max(plot_df$x_pos, na.rm = TRUE) ## 如果检出率存在 NA，绘图前给出提示。 if (any(is.na(plot_df$detect_percent))) { warning(\"部分通路没有可匹配基因，detect_percent 为 NA；这些点的大小可能无法正常显示。\") } gsea_bubble \u003c- ggplot(plot_df, aes(x = x_pos, y = NES)) + geom_hline(yintercept = 0, linetype = \"dashed\", linewidth = 0.4, color = \"grey50\") + geom_point( aes(size = detect_percent, alpha = neg_log10_p), shape = 21, stroke = 0.7, fill = \"#0000ff80\", colour = \"black\" ) + geom_text_repel( data = label_df, aes(label = ID), size = 3, color = label_df$label_col, force = 20, point.padding = 0.5, min.segment.length = 0, hjust = 1.2, segment.color = \"grey20\", segment.size = 0.3, segment.alpha = 0.8, nudge_y = -0.1, max.overlaps = Inf ) + scale_size_continuous( range = c(0.5, 8), name = \"Detection rate (%)\" ) + scale_alpha_continuous( range = c(0.15, 0.9), name = \"Significance\\n(-log10 p-value)\" ) + scale_x_continuous( breaks = seq(0, ceiling(x_max / x_break_step) * x_break_step, by = x_break_step), labels = seq(0, ceiling(x_max / x_break_step) * x_break_step, by = x_break_step), expand = expansion(mult = c(0.03, 0.05)) ) + scale_y_continuous( breaks = seq(y_low, y_high, by = 1), limits = c(y_low, y_high), expand = expansion(mult = c(0.08, 0.08)) ) + labs( title = \"Epithelial Cell Pathway Enrichment Analysis\", subtitle = paste0(\"Hallmark gene sets based on \", treatment_group, \" versus \", control_group), x = \"Hallmark gene sets ranked by NES\", y = \"Normalized Enrichment Score (NES)\" ) + guides( size = guide_legend(title = \"Detection rate (%)\", order = 1), alpha = guide_legend(title = \"Significance\\n(-log10 p-value)\", order = 2) ) + theme_classic(base_size = 15) + theme( plot.title = element_text(face = \"bold\", size = 16, hjust = 0.5), plot.subtitle = element_text(size = 12, hjust = 0.5, color = \"gray40\"), axis.line = element_line(color = \"black\", linewidth = 0.6), axis.text = element_text(face = \"bold\"), axis.title = element_text(size = 14, face = \"bold\"), legend.title = element_text(face = \"bold\"), legend.position = \"right\", legend.box = \"vertical\", panel.grid = element_blank(), panel.background = element_rect(fill = \"white\", color = NA) ) print(gsea_bubble) ggsave( filename = file.path(out_dir, \"05_GSEA_bubble_plot.pdf\"), plot = gsea_bubble, width = plot_width, height = plot_height ) ggsave( filename = file.path(out_dir, \"05_GSEA_bubble_plot.png\"), plot = gsea_bubble, width = plot_width, height = plot_height, dpi = plot_dpi ) message(\"分析完成。结果已输出到：\", out_dir) 关键修复点 # 加载包部分 ：原文 library(ggrepel) library(clusterProfiler) 中间缺少分隔；整理版已拆成多行。 读取对象部分 ：原文把 work_dir 、 obj_path 、 setwd() 、 load() 、对象赋值压到一行；整理版加入对象名检查。 差异分析部分 ：整理版兼容 avg_log2FC / avg_logFC 两种列名，并保存 marker 表。 GSEA 排序向量 ：整理版去除 NA、处理重复基因名，并保证按 logFC 从高到低排序。 Hallmark 基因集 ：整理版兼容新版 msigdbr(collection = \"H\") 和旧版 msigdbr(category = \"H\") 。 检出率计算 ：补全原文缺失逻辑： mean(gene_detect[genes_in_pathway], na.rm = TRUE) 。 显著性映射 ：使用 -log10(pmax(pvalue, .Machine$double.xmin)) ，避免 p 值为 0 时出现无限大。 输出文件 ：自动保存 marker、Hallmark 映射、GSEA 结果、绘图数据、PDF 和 PNG。 华哥生信 2026年5月23日 20:51 CNS | 参考文献 文章 Fig1 c图 ( C ) GSEA for 50 Hallmark gene sets within DEGs after KRAS siRNA treatment. Detection is based on the presence of a gene in all eight PDAC cell lines at \u003e5 reads. 解读 Hallmark 通路 GSEA 结果气泡图。纵轴是 NES 标准化富集分数 ，NES 越大，说明该通路越偏向上调方向；NES 越小，说明该通路越偏向下调方向。横轴不是连续变量，而是把不同 Hallmark gene sets 按某种顺序排列出来。每一个圆点代表一个 Hallmark 通路；圆点越大，说明这个通路中被检测到的基因比例越高；颜色越深，说明显著性越强，也就是 -log10(p-value) 越大。 图中上方的 KRAS_SIGNALING_DN、INTERFERON_ALPHA_RESPONSE 是正向富集；下方的 E2F_TARGETS、G2M_CHECKPOINT、MYC_TARGETS、KRAS_SIGNALING_UP、EMT、TNFA_SIGNALING_VIA_NFKB 是负向富集，说明这些通路在比较组中整体呈下降趋势，尤其是 E2F、G2M、MYC 这类增殖/细胞周期相关通路，显著性和检测比例都很高。 欢迎加入CNS生信交流群一起讨论与研究时下热门CNS文章各类生信分析方法（若二维码过期可以添加微信：huagesx） 跟着二十篇CNS文章学 虚拟细胞大模型 新课发布：虚拟细胞（跟着二十篇顶刊文章学虚拟细胞） 复现 # 1 加载环境 # suppressPackageStartupMessages({ library(Seurat); library(dplyr); library(ggplot2); library(ggrepel) library(clusterProfiler); library(msigdbr)}) 2 读取对象 # 先设置工作路径，然后读取已经保存好的 Seurat 对象。这里的 scRNA.sub.rdata 是前面完成质控、降维、聚类和细胞注释后的对象。读取完成后，将对象赋值给 atlas_obj ，方便后面继续分析。 work_dir \u003c- \"E:/xy/2026/five/5.22/\"obj_path \u003c- \"E:/xy/public/scRNA.sub.rdata\"setwd(work_dir); load(obj_path)atlas_obj \u003c- scRNA.sub 需要示例数据请联系原作者或查看原文渠道。 3 提取上皮 # 目的是从完整单细胞对象中单独提取上皮细胞。因为后续分析关注的是 treatment 和 control 条件下上皮细胞的通路变化，所以不能把所有细胞类型混在一起做差异分析。 subset() 根据 celltype == \"Epithelial_cells\" 筛选目标细胞。提取后再查看细胞数量和分组情况，确认 treatment 与 control 两组都存在。 focus_obj \u003c- subset(atlas_obj, subset = celltype == \"Epithelial_cells\") 4 差异分析 # 用 treatment 和 control 两组上皮细胞进行差异基因分析。先把 Seurat 对象的身份设置为 group ，这样 FindMarkers() 才能按照分组比较。这里设置 ident.1 = \"treatment\" ，表示正的 log2FC 代表 treatment 组表达更高。分析完成后根据 log2FC 和校正 P 值给基因标记为上调、下调或稳定，方便后面理解整体变化方向。 Idents(focus_obj) \u003c- \"group\"marker_tbl \u003c- FindMarkers( focus_obj, ident.1 = \"treatment\", ident.2 = \"control\", min.pct = 0.5, logfc.threshold = 0.5) marker_tbl \u003c- marker_tbl %\u003e% arrange(desc(avg_log2FC)) %\u003e% mutate(change_type = case_when( avg_log2FC \u003e 0.5 \u0026 p_val_adj \u003c 0.05 ~ \"up\", avg_log2FC \u003c -0.5 \u0026 p_val_adj \u003c 0.05 ~ \"down\", TRUE ~ \"stable\")) ![图片](data:image/svg+xml,%3C%3Fxml version='1.0' encoding='UTF-8'%3F%3E%3Csvg width='1px' height='1px' viewBox='0 0 1 1' version='1.1' xmlns=' http://www.w3.org/2000/svg ' xmlns:xlink=' http://www.w3.org/1999/xlink'%3E%3Ctitle%3E%3C/title%3E%3Cg stroke='none' stroke-width='1' fill='none' fill-rule='evenodd' fill-opacity='0'%3E%3Cg transform='translate(-249.000000, -126.000000)' fill='%23FFFFFF'%3E%3Crect x='249' y='126' width='1' height='1'%3E%3C/rect%3E%3C/g%3E%3C/g%3E%3C/svg%3E) 5 构建排序 # GSEA 不是只看显著差异基因，而是需要把所有参与排序的基因按照某个统计量从高到低排列。这里使用 avg_log2FC 作为排序指标，正值代表 treatment 组更高，负值代表 control 组更高。 rank_vec \u003c- marker_tbl$avg_log2FCnames(rank_vec) \u003c- rownames(marker_tbl)rank_vec \u003c- sort(rank_vec, decreasing = TRUE) 6 准备基因集 # 从 msigdbr 中读取 Hallmark 基因集。Hallmark 是 MSigDB 中比较常用的一套通路集合，数量相对精简，适合做整体生物学过程解释。这里选择人类基因集，所以 species 设置为 Homo sapiens 。随后只保留通路名称和基因符号两列，并去掉 HALLMARK_ 前缀，让后面的图更简洁。 hallmark_raw \u003c- msigdbr(species = \"Homo sapiens\", category = \"H\")hallmark_map \u003c- hallmark_raw %\u003e% transmute(pathway = gsub(\"HALLMARK_\", \"\", gs_name), symbol = gene_symbol) ![图片](data:image/svg+xml,%3C%3Fxml version='1.0' encoding='UTF-8'%3F%3E%3Csvg width='1px' height='1px' viewBox='0 0 1 1' version='1.1' xmlns=' http://www.w3.org/2000/svg ' xmlns:xlink=' http://www.w3.org/1999/xlink'%3E%3Ctitle%3E%3C/title%3E%3Cg stroke='none' stroke-width='1' fill='none' fill-rule='evenodd' fill-opacity='0'%3E%3Cg transform='translate(-249.000000, -126.000000)' fill='%23FFFFFF'%3E%3Crect x='249' y='126' width='1' height='1'%3E%3C/rect%3E%3C/g%3E%3C/g%3E%3C/svg%3E) 7 运行 GSEA # 把前面构建好的排序向量和 Hallmark 基因集放进 GSEA() 。这里 pvalueCutoff = 1 表示先保留全部结果，后面可以根据 NES 和 P 值自己筛选或展示。 minGSSize 和 maxGSSize 设置得比较宽，是为了避免通路因为基因数量限制被提前过滤。运行完成后，将 GSEA 结果转成普通数据框，方便后续整理和画图。 gsea_obj \u003c- GSEA( geneList = rank_vec, TERM2GENE = hallmark_map, pvalueCutoff = 1, minGSSize = 1, maxGSSize = 500000, verbose = FALSE) gsea_df \u003c- as.data.frame(gsea_obj@result) ![图片](data:image/svg+xml,%3C%3Fxml version='1.0' encoding='UTF-8'%3F%3E%3Csvg width='1px' height='1px' viewBox='0 0 1 1' version='1.1' xmlns=' http://www.w3.org/2000/svg ' xmlns:xlink=' http://www.w3.org/1999/xlink'%3E%3Ctitle%3E%3C/title%3E%3Cg stroke='none' stroke-width='1' fill='none' fill-rule='evenodd' fill-opacity='0'%3E%3Cg transform='translate(-249.000000, -126.000000)' fill='%23FFFFFF'%3E%3Crect x='249' y='126' width='1' height='1'%3E%3C/rect%3E%3C/g%3E%3C/g%3E%3C/svg%3E) 需要示例数据请联系原作者或查看原文渠道。 8 计算检出率 # 每个 Hallmark 通路增加一个新的展示维度：平均检出率。代码先从上皮细胞对象中提取 counts 矩阵，然后计算每个基因在多少比例的细胞中被检测到。接着对每个通路内部的基因取平均检出率，得到该通路在目标细胞中的整体表达覆盖程度。最后把 NES、P 值和检出率整理到一个表格中，作为气泡图的输入数据。 expr_mat \u003c- GetAssayData(focus_obj, slot = \"counts\")gene_detect \u003c- rowSums(expr_mat \u003e 1) / ncol(expr_mat) plot_df \u003c- gsea_df %\u003e% select(ID, NES, setSize, pvalue) %\u003e% rowwise() %\u003e% mutate(detect_rate = { gs \u003c- hallmark_map$symbol[hallmark_map$pathway == ID] gs \u003c- intersect(gs, names(gene_detect))0 }) %\u003e% ungroup() %\u003e% arrange(desc(NES)) %\u003e% mutate(pathway_id = factor(ID, levels = ID), x_pos = row_number(), detect_percent = detect_rate * 100) ![图片](data:image/svg+xml,%3C%3Fxml version='1.0' encoding='UTF-8'%3F%3E%3Csvg width='1px' height='1px' viewBox='0 0 1 1' version='1.1' xmlns=' http://www.w3.org/2000/svg ' xmlns:xlink=' http://www.w3.org/1999/xlink'%3E%3Ctitle%3E%3C/title%3E%3Cg stroke='none' stroke-width='1' fill='none' fill-rule='evenodd' fill-opacity='0'%3E%3Cg transform='translate(-249.000000, -126.000000)' fill='%23FFFFFF'%3E%3Crect x='249' y='126' width='1' height='1'%3E%3C/rect%3E%3C/g%3E%3C/g%3E%3C/svg%3E) 9 标注通路 # NES 排名前 3 和排名后 3 的通路作为标注对象。这样图中既能展示 treatment 方向富集的通路，也能展示 control 方向富集的通路。 label_col 给不同标签设置颜色，方便在最终图中区分标注文字。 label_terms \u003c- c(head(as.character(plot_df$ID), 3), tail(as.character(plot_df$ID), 3)) label_df \u003c- plot_df %\u003e% filter(ID %in% label_terms) %\u003e% mutate(label_col = rep(c(\"#D11E00\", \"#9972B2\", \"#A99909\", \"#D39E44\"), length.out = n())) ![图片](data:image/svg+xml,%3C%3Fxml version='1.0' encoding='UTF-8'%3F%3E%3Csvg width='1px' height='1px' viewBox='0 0 1 1' version='1.1' xmlns=' http://www.w3.org/2000/svg ' xmlns:xlink=' http://www.w3.org/1999/xlink'%3E%3Ctitle%3E%3C/title%3E%3Cg stroke='none' stroke-width='1' fill='none' fill-rule='evenodd' fill-opacity='0'%3E%3Cg transform='translate(-249.000000, -126.000000)' fill='%23FFFFFF'%3E%3Crect x='249' y='126' width='1' height='1'%3E%3C/rect%3E%3C/g%3E%3C/g%3E%3C/svg%3E) 10 绘制气泡 # 把 GSEA 结果整合成一张通路气泡图。横坐标表示 Hallmark 通路的排序位置，纵坐标表示 NES，点越靠上说明越偏 treatment 组富集，越靠下说明越偏 control 组富集。气泡大小表示通路基因在上皮细胞中的平均检出率，透明度表示统计显著性。最后通过 geom_text_repel() 标注关键通路，避免标签互相遮挡。 y_low \u003c- floor(min(plot_df$NES, na.rm = TRUE))y_high \u003c- ceiling(max(plot_df$NES, na.rm = TRUE))gsea_bubble \u003c- ggplot(plot_df, aes(x = x_pos, y = NES)) + geom_point(aes(size = detect_percent, alpha = -log10(pvalue)), shape = 21, stroke = 0.7, fill = \"#0000ff80\", colour = \"black\") + geom_text_repel(data = label_df, aes(label = ID), size = 3, color = label_df$label_col, force = 20, point.padding = 0.5, min.segment.length = 0, hjust = 1.2, segment.color = \"grey20\", segment.size = 0.3, segment.alpha = 0.8, nudge_y = -0.1) + scale_size_continuous(range = c(0.2, 8), name = \"Detection rate (%)\") + scale_alpha_continuous(range = c(0.1, 0.9), name = \"Significance\\n(-log10 p-value)\") + scale_x_continuous(breaks = seq(0, 50, by = 10), labels = seq(0, 50, by = 10)) + scale_y_continuous(breaks = seq(y_low, y_high, by = 1), labels = seq(y_low, y_high, by = 1), limits = c(y_low, y_high), expand = c(0.1, 0.1)) + labs(title = \"Epithelial Cell Pathway Enrichment Analysis\", subtitle = \"Hallmark gene sets based on treatment versus control\", x = \"Hallmark gene sets\", y = \"Normalized Enrichment Score (NES)\") + guides(size = guide_legend(title = \"Detection rate (%)\", order = 1), alpha = guide_legend(title = \"Significance\\n(-log10 p-value)\", order = 2)) + theme_classic(base_size = 15) + theme(plot.title = element_text(face = \"bold\", size = 16, hjust = 0.5), plot.subtitle = element_text(size = 12, hjust = 0.5, color = \"gray40\"), axis.line = element_line(color = \"black\", linewidth = 0.6), axis.text = element_text(face = \"bold\"), axis.title = element_text(size = 14, face = \"bold\"), legend.title = element_text(face = \"bold\"), legend.position = \"right\", legend.box = \"vertical\", panel.grid = element_blank(), panel.background = element_rect(fill = \"white\", color = NA))print(gsea_bubble) ![图片](data:image/svg+xml,%3C%3Fxml version='1.0' encoding='UTF-8'%3F%3E%3Csvg width='1px' height='1px' viewBox='0 0 1 1' version='1.1' xmlns=' http://www.w3.org/2000/svg ' xmlns:xlink=' http://www.w3.org/1999/xlink'%3E%3Ctitle%3E%3C/title%3E%3Cg stroke='none' stroke-width='1' fill='none' fill-rule='evenodd' fill-opacity='0'%3E%3Cg transform='translate(-249.000000, -126.000000)' fill='%23FFFFFF'%3E%3Crect x='249' y='126' width='1' height='1'%3E%3C/rect%3E%3C/g%3E%3C/g%3E%3C/svg%3E) 需要示例数据请联系原作者或查看原文渠道。 图形解读 # 这张图的核心是把差异分析、通路富集和表达检出率放在同一个坐标系中。NES 大于 0 的通路更偏 treatment 组，NES 小于 0 的通路更偏 control 组。气泡越大，说明该通路相关基因在上皮细胞中整体检出越充分，结果解释时更有表达基础。透明度越高，代表 P 值越小，也就是该通路的统计信号更强。 ![图片](data:image/svg+xml,%3C%3Fxml version='1.0' encoding='UTF-8'%3F%3E%3Csvg width='1px' height='1px' viewBox='0 0 1 1' version='1.1' xmlns=' http://www.w3.org/2000/svg ' xmlns:xlink=' http://www.w3.org/1999/xlink'%3E%3Ctitle%3E%3C/title%3E%3Cg stroke='none' stroke-width='1' fill='none' fill-rule='evenodd' fill-opacity='0'%3E%3Cg transform='translate(-249.000000, -126.000000)' fill='%23FFFFFF'%3E%3Crect x='249' y='126' width='1' height='1'%3E%3C/rect%3E%3C/g%3E%3C/g%3E%3C/svg%3E) 解读重点： 1. NES \u003e 0：treatment 方向富集 2. NES \u003c 0：control 方向富集 3. 气泡大小：通路基因平均检出率 4. 透明度：-log10(pvalue)，越高越显著 AI大模型：当别人还在使用模型的时候，我们已经开始构建大模型了 AI大模型基于病理切片预测空间蛋白，CELL和NM文章复现及原理全解析 孟德尔＋单细胞全文复现 孟德尔+单细胞全文复现（纯生信公共数据挖掘） 零基础想学生信，看 👇 这个文章 ： 零基础也能学的AI生信课（AI助力生信入门班即将开始） 想学机器学习，看 👇 这个文章 ： AI助力多组学与机器学习联合分析（机器学习分析代谢组、蛋白组、宏基因组、网络药理学、转录组） 想系统学单细胞，看 👇 这个文章 ： CNS文章单细胞数据分析内容汇总（基础--进阶--python分析） 想系统学空间转录组，看 👇 这个文章 ： Nature单细胞空间组学1:1复现训练营 跟着CNS文章学空间转录组分析线上直播课（Visium HD、Xenium、Stereo-seq） 欢迎关注 | 华哥科研平台 亲，写的这么辛苦，记得关注、点赞、转发哟！ 继续滑动看下一个 Bioinformation 向上滑动看下一个 闪记 复制 LaTeX 公式","tags":["clippings","暂未试用"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"网页教程","updated":"2026-10-25T17:37:28.587Z","url":"bioinfo-tools/notes/f50e85198edeff0887d1e48c.html"},{"kbId":"KB-000066","title":"【操作指南】- Zenodo数据快速下载","subtitle":"","summary":"原创 河山 牛瞎哞 2026年5月7日 19:05 上海 ZENODO 是一个由 CERN（欧洲核子研究组织）数据中心所支持的科研数据存储库，使研究人员能够保存和分享他们的研究成果。但是网页直接点击下载数据的速度较慢，并且容易中断。Zenodo 官方 REST API 支持 Records 和 Files 访问，所以网页下载慢时，用 API/命令行更稳定。在此分享更加快速稳定的数据下载方法：Python 获取文件列表 + aria2c 断点续传下载 + MD5 校验。 直接点","body":"原创 河山 牛瞎哞 | 2026年5月7日 19:05 上海 ZENODO 是一个由 CERN（欧洲核子研究组织）数据中心所支持的科研数据存储库，使研究人员能够保存和分享他们的研究成果。但是网页直接点击下载数据的速度较慢，并且容易中断。Zenodo 官方 REST API 支持 Records 和 Files 访问，所以网页下载慢时，用 API/命令行更稳定。在此分享更加快速稳定的数据下载方法：Python 获取文件列表 + aria2c 断点续传下载 + MD5 校验。 1. 网页下载速度 # 直接点击下载大概只有 100-200 kB/s 的下载速度，并且不稳定，经常中断或变为 10-20 kB/s，下载 1GB 的数据需要数小时。 2. API/命令行下载速度 # 用学校 wifi，实测的下载速度大约为 1 MB/s。 3. Python 代码 # Python 获取文件列表 + aria2c 断点续传下载 + MD5 校验。 需要的 Python 包和下载工具 # PowerShell： python -m pip install -U pip python -m pip install requests tqdm PySocks # requests：访问 Zenodo API，获取文件列表和 MD5 # tqdm：进度条，可选，建议装 # PySocks：避免报错 # 安装后检查 python -c \"import requests, tqdm; print('Python packages OK')\" # aria2c.exe 不是 Python 包，不用装在虚拟环境里。 # 它是一个独立下载工具，安装在 Windows 系统层面。 winget install -e --id aria2.aria2 # 安装完成后，关闭当前 PowerShell，重新打开，再检查 aria2c --version 修改目标下载目录 # # 修改为你的目标下载目录 OUT_DIR = Path(r\"D:\\Zenodo_Download\\CropLayer_2020\") 指定想要部分下载的数据 # TARGET_FILES = [] # 是下载所有文件 TARGET_FILES = [ \"cf_county_guangdong.tar.gz\", \"cf_county_hainan.tar.gz\", \"cf_county_yunnan.tar.gz\", ] # 是下载指定文件，例如广东、海南、云南的数据 并发参数不要太大，避免 Zenodo 限流 # # aria2 并发参数：不要开太大，避免触发 Zenodo 限流 CONNECTIONS_PER_FILE = 4 # 单个文件连接数 PARALLEL_FILES = 2 # 同时下载几个文件 完整代码 # 下载 https://doi.org/10.5281/zenodo.14726428 from pathlib import Path from urllib.parse import quote import hashlib import subprocess import requests import sys # ========================= # 基本参数 # ========================= RECORD_ID = \"14726428\" # 修改为你的目标下载目录 OUT_DIR = Path(r\"D:\\Zenodo_Download\\CropLayer_2020\") # 如果为空列表，则下载全部文件 # 如果只想下载部分省份，就写入文件名，例如： # TARGET_FILES = [\"cf_county_hainan.tar.gz\", \"cf_county_guangdong.tar.gz\"] TARGET_FILES = [ \"cf_county_guangdong.tar.gz\", \"cf_county_hainan.tar.gz\", \"cf_county_yunnan.tar.gz\", \"cf_county_jilin.tar.gz\", \"cf_county_anhui.tar.gz\", ] # aria2 并发参数：不要开太大，避免触发 Zenodo 限流 CONNECTIONS_PER_FILE = 4 # 单个文件连接数 PARALLEL_FILES = 2 # 同时下载几个文件 # 给请求加 User-Agent，避免默认 Python requests 被部分站点识别为低优先级请求 HEADERS = { \"User-Agent\": \"Zenodo-CropLayer-Downloader/1.0\" } # ========================= # 工具函数 # ========================= def fetch_record_metadata(record_id: str) -\u003e dict: \"\"\"从 Zenodo API 获取 record 元数据。\"\"\" api_url = f\"https://zenodo.org/api/records/{record_id}\" response = requests.get(api_url, headers=HEADERS, timeout=60) response.raise_for_status() return response.json() def normalize_checksum(checksum: str) -\u003e str | None: \"\"\"提取 md5 值。Zenodo 常见形式为 md5:xxxxxxxx。\"\"\" if not checksum: return None if checksum.startswith(\"md5:\"): return checksum.split(\"md5:\", 1)[1] return checksum def build_download_url(record_id: str, filename: str) -\u003e str: \"\"\"构造 Zenodo 文件下载链接。\"\"\" encoded_name = quote(filename) return f\"https://zenodo.org/records/{record_id}/files/{encoded_name}?download=1\" def write_aria2_input(files: list[dict], url_file: Path) -\u003e None: \"\"\"生成 aria2c 输入文件。\"\"\" with url_file.open(\"w\", encoding=\"utf-8\") as f: for item in files: name = item[\"key\"] url = build_download_url(RECORD_ID, name) f.write(url + \"\\n\") f.write(f\" out={name}\\n\") def run_aria2(url_file: Path, out_dir: Path) -\u003e None: \"\"\"调用 aria2c 进行断点续传下载。\"\"\" cmd = [ \"aria2c\", \"-i\", str(url_file), \"-d\", str(out_dir), \"-c\", # 断点续传 \"-x\", str(CONNECTIONS_PER_FILE), \"-s\", str(CONNECTIONS_PER_FILE), \"-j\", str(PARALLEL_FILES), \"--max-tries=10\", \"--retry-wait=20\", \"--timeout=60\", \"--connect-timeout=30\", \"--continue=true\", \"--auto-file-renaming=false\", \"--allow-overwrite=true\", ] print(\"\\n开始调用 aria2c 下载：\") print(\" \".join(cmd)) subprocess.run(cmd, check=True) def md5sum(path: Path, block_size: int = 1024 * 1024 * 8) -\u003e str: \"\"\"计算本地文件 md5。\"\"\" h = hashlib.md5() with path.open(\"rb\") as f: while True: block = f.read(block_size) if not block: break h.update(block) return h.hexdigest() def check_files(files: list[dict], out_dir: Path) -\u003e None: \"\"\"校验下载文件的 MD5。\"\"\" print(\"\\n开始 MD5 校验：\") failed = [] for item in files: name = item[\"key\"] expected_md5 = normalize_checksum(item.get(\"checksum\", \"\")) local_file = out_dir / name if not local_file.exists(): print(f\"[缺失] {name}\") failed.append(name) continue if not expected_md5: print(f\"[跳过] {name}：Zenodo 未提供 checksum\") continue real_md5 = md5sum(local_file) if real_md5.lower() == expected_md5.lower(): print(f\"[通过] {name}\") else: print(f\"[失败] {name}\") print(f\" 期望: {expected_md5}\") print(f\" 实际: {real_md5}\") failed.append(name) if failed: print(\"\\n以下文件校验失败或缺失，建议删除后重新下载：\") for name in failed: print(\" -\", name) else: print(\"\\n全部文件 MD5 校验通过。\") # ========================= # 主流程 # ========================= def main(): OUT_DIR.mkdir(parents=True, exist_ok=True) print(\"正在读取 Zenodo record 元数据...\") record = fetch_record_metadata(RECORD_ID) all_files = record.get(\"files\", []) if not all_files: print(\"没有读取到 files 字段，请检查 record ID 或网络连接。\") sys.exit(1) print(f\"Zenodo record: {record.get('metadata', {}).get('title', '')}\") print(f\"文件总数: {len(all_files)}\") if TARGET_FILES: target_set = set(TARGET_FILES) files = [f for f in all_files if f[\"key\"] in target_set] missing = target_set - {f[\"key\"] for f in files} if missing: print(\"\\n以下 TARGET_FILES 没有在 Zenodo 记录中找到：\") for name in missing: print(\" -\", name) sys.exit(1) else: files = all_files print(\"\\n本次将下载以下文件：\") for f in files: size_gb = f.get(\"size\", 0) / 1024**3 print(f\" - {f['key']} ({size_gb:.2f} GB)\") url_file = OUT_DIR / \"zenodo_aria2_urls.txt\" write_aria2_input(files, url_file) print(f\"\\n已生成 aria2 下载清单：{url_file}\") run_aria2(url_file, OUT_DIR) check_files(files, OUT_DIR) if __name__ == \"__main__\": main()","tags":["clippings","Zenodo","aria2","数据下载"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"网页教程","updated":"2026-10-25T17:37:28.587Z","url":"bioinfo-tools/notes/40f466ae21d565a550991145.html"},{"kbId":"KB-000063","title":"GPU加速的11种单细胞通路富集活性打分｜全流程Python分析","subtitle":"","summary":"GPU加速后1秒即可完成空转/单细胞的基因集富集打分","body":"摘要 LLM 归库摘要 核心内容： 这是一篇 OmicVerse ov.es 模块教程，用同一份小鼠胰腺发育单细胞数据演示 11 种通路/基因集活性打分方法，并比较 CPU 与 GPU 后端结果。 适用场景： 单细胞或空间转录组中，需要把 GO/MSigDB/regulon 等基因集转换为每个细胞的通路活性分数，再用于 UMAP、分组差异或疾病-正常对比。 输入： AnnData 对象、基因集字典 signatures 、方法名、 engine='cpu'/'gpu' 、最小基因数阈值 tmin 等参数。 输出： 各方法分数写入 adata.obsm['score_方法名'] ，部分方法还会写入 adata.obsm['padj_方法名'] ，并可同步写入 adata.obs 方便可视化。 关键参数/步骤： 推荐先用 AUCell、GSVA、Z-score 快速初筛；带权重或 regulon 分析可用 ULM/MLM/VIPER；GPU 后端适合大规模矩阵化计算。 常见错误： GSEA 的 CPU/GPU 结果可能因 NES 与 raw ES 尺度不同而数值不完全可比；ORA 需要明确显著基因集合，否则单细胞分辨率有限；MDT/UDT 的 CPU 逐细胞拟合成本较高。 与口腔生信连接： 可用于牙周炎、OSCC、口腔免疫微环境或空间转录组项目中，对炎症、免疫浸润、EMT、增殖、缺氧等通路进行细胞级活性评分。 关联页面建议： 后续可整合到 03 生信教程与工具库/02_wiki/workflows/单细胞通路活性打分 或 03 生信教程与工具库/02_wiki/tools/OmicVerse 。 下一步处理： 复现时优先确认 OmicVerse 版本、GPU 环境、基因集文件路径，并把常用方法封装为项目模板函数。 归库说明： 分类到 03 生信教程与工具库，置信度 0.92；已标记为暂未试用，便于后续集中复现。 编者按 我们将推出一个新的栏目，重构算法的介绍，在这个栏目中，我们将介绍omicverse开源重构生态最新的成果以及完整的教程，欢迎关注。 第二期教程里，我们给大家带来的是单细胞通路活性打分算法的实战比较：这是omicverse开源重构生态中 ov.es 模块的内容。 在单细胞分析里，我们经常不会只关心某一个基因的表达，而是更想知道一组基因，也就是某条通路、某个调控子、某个功能模块在每个细胞里的活性。过去这些方法分散在不同包里，参数也不完全一样，所以我一直觉得这块需要一个更统一的入口。 OmicVerse 在 ov.es 中重构了 decoupler 里的 11 种 enrichment score 方法，并且提供了 CPU/GPU 两套计算后端。也就是说，如果你想把 AUCell 换成 GSVA，或者把 CPU 换成 GPU，我们只需要改一个参数。 本文AI率20%，阅读大约需要5min。 OmicVerse团队 1. 引言 # 做单细胞分析时，我们最常见的操作是找 marker 基因。 但 marker 基因有一个问题：它很零散。 比如你看胰腺发育数据，某个细胞群里可能有几十个基因一起变化。你当然可以一个个基因去看，但如果想回答“这个细胞是不是更偏向某个生物学过程”，那么用单个基因就不太够了。 这时候通路活性打分就很有用。 我们先准备一个基因集，比如 response to vitamin (GO:0033273) ，我们知道这个基因集都有哪些基因，然后计算这个基因集在每个细胞里的活性分数。后面就可以像画基因表达一样，把这个分数画到 UMAP 上。 这类分析在很多场景里都能用： 细胞类型注释后，看某类细胞是否激活特定通路。 做疾病和正常对比时，看通路活性是否发生改变。 做转录因子调控分析时，把 regulon 当成基因集去打分。 做空间转录组时，把通路分数投到空间坐标上。 过去大家常用的方法包括 AUCell、GSEA、GSVA、ORA、VIPER 等。它们背后的统计思想不一样，适合的场景也不一样。OmicVerse 现在把这些方法统一到了 ov.es 下面，并且提供了同一个调用方式。 ov.es.decoupler( adata, signatures=signatures, method='aucell', engine='gpu', tmin=3, ) 如果你更习惯直接调用具体函数，也可以这样写： ov.es.aucell(adata, signatures=signatures, engine='gpu', tmin=3) 二者是等价的。 2. 11种方法怎么选 # 在decoupler中，作者的benchmark认为ulm是最优的算法，我分析发现ulm确实有可取之处，比AUCell有时候还要好。 除此之外，如果你只是想快速看某个基因集在单细胞里的分布，我会优先从 AUCell、GSVA、Z-score 这几个方法开始。它们比较直观，也比较适合画图。 如果你手里的基因集带有权重，或者想做调控子活性分析，可以考虑 ULM、MLM 和 VIPER。 如果你只是想做一个最简单的加权平均，WAGGR 就够了。 如果你需要更复杂的非线性打分，可以看 MDT 和 UDT。不过这两个方法如果用传统 CPU 逐细胞拟合树模型，会非常慢，所以这个教程里只展示 GPU 版本。 方法 直观理解 适合场景 AUCell 看基因集成员在每个细胞的表达排序里是否靠前 单细胞通路活性、regulon 活性 GSEA 沿着排序基因列表做累积得分 经典富集分析迁移到单细胞 GSVA GSEA 的单样本版本 样本/细胞级通路打分 ORA 显著基因与通路基因的 2×2 表检验 有明确显著基因集合时 ULM 一个基因集一个线性模型 带权重的 signature MLM 多个基因集一起进入线性模型 基因集之间有重叠时 WAGGR 加权平均或加权求和 想要最直接的分数 Z-score 基因集平均表达相对背景的偏移 快速、稳定、容易解释 VIPER 把 signature 当成 regulon 计算活性 转录因子/调控网络 MDT 多变量决策树打分 GPU 下的非线性 signature 评分 UDT 单变量决策树打分 GPU 下的非线性 signature 评分 我个人的使用习惯是，先用一两个简单方法扫一遍，比如 AUCell 和 Z-score；如果结果很稳定，再根据具体问题补充更复杂的方法。 3. 实战开始 # 这里使用的是小鼠胰腺内分泌发生数据，来自 Bastidas-Ponce et al.，OmicVerse 已经提供了下载接口。这个数据自带 UMAP，所以我们不用重新跑 PCA、邻居图和 UMAP。 import numpy as np import omicverse as ov ov.style() 读取数据： adata = ov.datasets.pancreatic_endocrinogenesis() adata AnnData object with n_obs × n_vars = 3696 × 27998 obs: 'clusters_coarse', 'clusters', 'S_score', 'G2M_score' var: 'highly_variable_genes' uns: 'clusters_coarse_colors', 'clusters_colors', 'day_colors', 'neighbors', 'pca' obsm: 'X_pca', 'X_umap' layers: 'spliced', 'unspliced' obsp: 'distances', 'connectivities' 为了让 CPU 版本的对比跑得更快，这里随机抽取 300 个细胞： rng = np.random.default_rng(0) adata = adata[rng.choice(adata.n_obs, size=300, replace=False)].copy() adata.var['robust'] = True adata = ov.pp.preprocess(adata, target_sum=1e4) 预处理以后保留了 300 个细胞和 14,182 个基因。 然后读取 GO Biological Process 2021 的基因集： pathway_dict = ov.utils.geneset_prepare( 'genesets/GO_Biological_Process_2021.txt', organism='Mouse', ) 这里我们只选一条通路做演示： geneset_name = 'response to vitamin (GO:0033273)' signatures = {geneset_name: pathway_dict[geneset_name]} 注意，这里为了比较 11 种方法，我们只用了一个基因集。实际项目里你当然可以同时传入很多通路，OmicVerse 会给每条通路都写入一个分数。 4. 统一接口 # ov.es 的一个好处是接口比较统一。 ov.es.decoupler( adata, signatures=signatures, method='aucell', engine='gpu', tmin=3, ) 计算完成后，分数会写入： adata.obsm['score_aucell'] 如果这个方法会计算校正后的 P 值，也会写入类似的位置： adata.obsm['padj_aucell'] 所以我们后面切换方法时，只需要把 method='aucell' 改成 method='gsva' 、 method='zscore' 等即可。 5. AUCell # AUCell 的思路很直接：对每个细胞里的基因表达做排序，然后看基因集里的基因是不是更容易出现在排序靠前的位置。 ov.es.aucell(adata, signatures=signatures, tmin=3, engine='cpu') scores_cpu['aucell'] = adata.obsm['score_aucell'][geneset_name].astype(float).values adata.obs['aucell (CPU)'] = scores_cpu['aucell'] ov.es.aucell(adata, signatures=signatures, tmin=3, engine='gpu') scores_gpu['aucell'] = adata.obsm['score_aucell'][geneset_name].astype(float).values adata.obs['aucell (GPU)'] = scores_gpu['aucell'] 可视化： ov.pl.umap( adata, color=['aucell (CPU)', 'aucell (GPU)'], cmap='Reds', frameon=False, ) AUCell CPU 与 GPU 对比 可以看到 CPU 和 GPU 的空间分布基本一致。对于这种基于排序的打分，GPU 的意义主要在于把大规模数据上的等待时间压下来。 6. GSEA、GSVA 和 ORA # GSEA 和 GSVA 是大家很熟悉的富集分析方法。放到单细胞数据里以后，可以理解成对每个细胞都做一次基因集打分。 先跑 GSEA： ov.es.gsea(adata, signatures=signatures, tmin=3, engine='cpu', times=50) scores_cpu['gsea'] = adata.obsm['score_gsea'][geneset_name].astype(float).values adata.obs['gsea (CPU)'] = scores_cpu['gsea'] ov.es.gsea(adata, signatures=signatures, tmin=3, engine='gpu', times=1) scores_gpu['gsea'] = adata.obsm['score_gsea'][geneset_name].astype(float).values adata.obs['gsea (GPU)'] = scores_gpu['gsea'] GSEA CPU 与 GPU 对比 这里要注意一个细节：CPU 版本在 times\u003e1 时返回的是标准化后的 NES，而 GPU 版本在 times=1 时返回的是原始 ES。所以它们的空间模式相近，但数值尺度不完全一样，后面的散点图里也能看到这一点。 GSVA： ov.es.gsva(adata, signatures=signatures, tmin=3, engine='cpu') sc
