ores_cpu['gsva'] = adata.obsm['score_gsva'][geneset_name].astype(float).values adata.obs['gsva (CPU)'] = scores_cpu['gsva'] ov.es.gsva(adata, signatures=signatures, tmin=3, engine='gpu') scores_gpu['gsva'] = adata.obsm['score_gsva'][geneset_name].astype(float).values adata.obs['gsva (GPU)'] = scores_gpu['gsva'] GSVA CPU 与 GPU 对比 GSVA 在这个数据上的 CPU 用时是 5.4377 秒，GPU 用时是 0.1089 秒。这个差距就很明显了。 ORA： ov.es.ora(adata, signatures=signatures, tmin=3, engine='cpu') scores_cpu['ora'] = adata.obsm['score_ora'][geneset_name].astype(float).values adata.obs['ora (CPU)'] = scores_cpu['ora'] ov.es.ora(adata, signatures=signatures, tmin=3, engine='gpu') scores_gpu['ora'] = adata.obsm['score_ora'][geneset_name].astype(float).values adata.obs['ora (GPU)'] = scores_gpu['ora'] ORA CPU 与 GPU 对比 ORA 更依赖“哪些基因被认为显著”这个前提。如果你的输入本身没有一个很明确的显著基因集合，那么它的单细胞分辨率通常不如 AUCell 或 GSVA 那么细。 7. ULM、MLM、WAGGR 和 Z-score # 接下来是几种更适合带权重 signature 的方法。 ULM 是一元线性模型，也就是一个 signature 单独拟合一次： ov.es.ulm(adata, signatures=signatures, tmin=3, engine='cpu') scores_cpu['ulm'] = adata.obsm['score_ulm'][geneset_name].astype(float).values adata.obs['ulm (CPU)'] = scores_cpu['ulm'] ov.es.ulm(adata, signatures=signatures, tmin=3, engine='gpu') scores_gpu['ulm'] = adata.obsm['score_ulm'][geneset_name].astype(float).values adata.obs['ulm (GPU)'] = scores_gpu['ulm'] ULM CPU 与 GPU 对比 MLM 是多元线性模型，也就是把多个 signature 一起放进模型里。如果你的基因集之间重叠很多，MLM 会更适合一点。 ov.es.mlm(adata, signatures=signatures, tmin=3, engine='cpu') scores_cpu['mlm'] = adata.obsm['score_mlm'][geneset_name].astype(float).values adata.obs['mlm (CPU)'] = scores_cpu['mlm'] ov.es.mlm(adata, signatures=signatures, tmin=3, engine='gpu') scores_gpu['mlm'] = adata.obsm['score_mlm'][geneset_name].astype(float).values adata.obs['mlm (GPU)'] = scores_gpu['mlm'] MLM CPU 与 GPU 对比 WAGGR 就更直接了，其实就是基因表达的加权平均或加权求和。 ov.es.waggr(adata, signatures=signatures, tmin=3, engine='cpu', times=1) scores_cpu['waggr'] = adata.obsm['score_waggr'][geneset_name].astype(float).values adata.obs['waggr (CPU)'] = scores_cpu['waggr'] ov.es.waggr(adata, signatures=signatures, tmin=3, engine='gpu', times=1) scores_gpu['waggr'] = adata.obsm['score_waggr'][geneset_name].astype(float).values adata.obs['waggr (GPU)'] = scores_gpu['waggr'] WAGGR CPU 与 GPU 对比 Z-score 是我觉得很适合初筛的方法。它计算的是基因集平均表达相对于每个细胞背景分布的偏移。 ov.es.zscore(adata, signatures=signatures, tmin=3, engine='cpu') scores_cpu['zscore'] = adata.obsm['score_zscore'][geneset_name].astype(float).values adata.obs['zscore (CPU)'] = scores_cpu['zscore'] ov.es.zscore(adata, signatures=signatures, tmin=3, engine='gpu') scores_gpu['zscore'] = adata.obsm['score_zscore'][geneset_name].astype(float).values adata.obs['zscore (GPU)'] = scores_gpu['zscore'] Z-score CPU 与 GPU 对比 这几个方法的 CPU/GPU 结果都几乎完全一致。 8. VIPER、MDT 和 UDT # VIPER 更常用于转录因子活性分析。它会把 signature 当成 regulon，然后计算调控子在每个细胞里的活性。 ov.es.viper(adata, signatures=signatures, tmin=3, engine='cpu') scores_cpu['viper'] = adata.obsm['score_viper'][geneset_name].astype(float).values adata.obs['viper (CPU)'] = scores_cpu['viper'] ov.es.viper(adata, signatures=signatures, tmin=3, engine='gpu') scores_gpu['viper'] = adata.obsm['score_viper'][geneset_name].astype(float).values adata.obs['viper (GPU)'] = scores_gpu['viper'] VIPER CPU 与 GPU 对比 MDT 和 UDT 是基于决策树的打分方法。它们在 CPU 上逐细胞拟合树模型的成本比较高，所以这个教程只跑 GPU。 MDT： ov.es.mdt(adata, signatures=signatures, tmin=3, engine='gpu') scores_gpu['mdt'] = adata.obsm['score_mdt'][geneset_name].astype(float).values adata.obs['mdt (GPU)'] = scores_gpu['mdt'] MDT GPU 结果 UDT： ov.es.udt(adata, signatures=signatures, tmin=3, engine='gpu') scores_gpu['udt'] = adata.obsm['score_udt'][geneset_name].astype(float).values adata.obs['udt (GPU)'] = scores_gpu['udt'] UDT GPU 结果 我觉得这两个方法更适合在你已经有明确需求时使用。对于大多数通路活性可视化，AUCell、GSVA、Z-score 已经足够了。 9. CPU 和 GPU 的一致性 # 这里把所有有 CPU 基线的方法放到一张散点图里。 每个点是一个细胞，横坐标是 CPU 分数，纵坐标是 GPU 分数。为了让不同方法能放到同一张图中，这里对每个方法的分数做了标准化。 import matplotlib.pyplot as plt _methods = [m for m in scores_gpu if m in scores_cpu] _cmap = plt.get_cmap('tab20') fig, ax = plt.subplots(figsize=(5.5, 5.5)) for _i, _m in enumerate(_methods): _x = scores_cpu[_m] _y = scores_gpu[_m] _xz = (_x - _x.mean()) / (_x.std() + 1e-12) _yz = (_y - _y.mean()) / (_y.std() + 1e-12) ax.scatter(_xz, _yz, s=4, alpha=0.4, label=_m, color=_cmap(_i % _cmap.N)) ax.plot([-6, 6], [-6, 6], '--', color='grey', lw=0.8) CPU 与 GPU 分数一致性 从图上看，绝大部分方法都落在对角线附近。GSEA 的点会有一点拉伸，原因前面也说过：CPU 版本这里返回的是 NES，GPU 版本返回的是 raw ES。 再看数值表： 方法 Pearson r Spearman r RMSE / range AUCell 1.0000 1.0000 0.0000 GSEA 0.9747 0.8019 0.2224 GSVA 1.0000 1.0000 0.0001 ORA NaN NaN 0.0000 ULM 1.0000 1.0000 0.0000 MLM 1.0000 1.0000 0.0000 WAGGR 1.0000 1.0000 0.0000 Z-score 1.0000 1.0000 0.0000 VIPER 1.0000 1.0000 0.0000 这里 ORA 的相关性是 NaN。原因很简单：这个例子里 ORA 的分数没有足够的变化，所以相关系数无法计算。 如果只看这个 300 细胞的小例子，各方法的运行时间如下： 方法 CPU GPU AUCell 0.1586s 0.0264s GSEA 0.8218s 0.1066s GSVA 5.4377s 0.1089s ORA 0.6613s 0.0827s ULM 0.1155s 0.0459s MLM 0.1668s 0.0716s WAGGR 1.1193s 0.0299s Z-score 0.0749s 0.0368s VIPER 0.3006s 0.0580s MDT - 1.6364s UDT - 0.1838s 这个表只对应当前教程、当前机器、当前数据规模，不要把它当成正式基准测试。真正的大规模数据里，GPU 的优势会更明显，尤其是 GSVA、WAGGR 这类可以大规模矩阵化的计算。 10. 总结 # 在本期教程中，我们用同一份小鼠胰腺发育单细胞数据，对比了 OmicVerse ov.es 里的 11 种 enrichment score 方法： AUCell、GSEA、GSVA、ORA、ULM、MLM、WAGGR、Z-score、VIPER 都提供 CPU/GPU 两套后端。 MDT 和 UDT 在这个教程里只展示 GPU，因为 CPU 逐细胞拟合树模型的成本不太适合单细胞规模。 除 GSEA 的 NES/raw ES 尺度差异外，绝大多数方法的 CPU/GPU 结果几乎完全一致。 如果只是做通路活性可视化，我会优先用 AUCell、GSVA 或 Z-score；如果做调控子活性，可以考虑 VIPER、ULM 或 MLM。 实际上我觉得 ov.es 这个模块最大的价值在于接口统一。过去分散的 enrichment score 方法，现在可以在同一个对象、同一套参数里完成切换。 你不需要每次换算法就重新学一套输入输出，也不需要在不同包之间来回转换对象。对于一个真实项目来说，这会省掉很多非常无聊但又很容易出错的时间。 作为 omicverse 开源重构生态的一部分，我们会继续把更多常用算法迁移到统一接口里。如果你有想重构的 R 包，或者希望某个算法接入 omicverse，也欢迎联系我们。 11. 交流群 # 如果你也很好奇我们omicverse生态的最新进展，想第一时间体验到新功能，欢迎加入我们的交流群～ OmicVerse相关教程 · 目录 阅读原文 继续滑动看下一个 OmicAI 向上滑动看下一个 闪记 复制 LaTeX 公式 12. 完整代码整理｜下次复用版 # 说明：下面代码根据原文流程整理为一个相对完整的复现模板。第一次运行前需要确认 omicverse 、 numpy 、 pandas 、 matplotlib 等依赖已安装，并且 genesets/GO_Biological_Process_2021.txt 路径存在。若没有 GPU，可把 ENGINE_GPU = \"gpu\" 改为 \"cpu\" 或只运行 CPU 部分。 # ============================================================ # 0. 环境与参数设置 # ============================================================ # 作用：集中管理依赖、随机种子、基因集名称、CPU/GPU 后端等复现参数。 import time import numpy as np import pandas as pd import matplotlib.pyplot as plt import omicverse as ov # 设置 OmicVerse 绘图风格 ov.style() # 固定随机种子，保证抽样结果可复现 RANDOM_SEED = 0 N_CELLS = 300 # 基因集文件路径：需要按本地实际路径修改 GENESET_PATH = \"genesets/GO_Biological_Process_2021.txt\" ORGANISM = \"Mouse\" GENESET_NAME = \"response to vitamin (GO:0033273)\" # 统一控制 CPU/GPU 后端 ENGINE_CPU = \"cpu\" ENGINE_GPU = \"gpu\" # 基因集最少命中基因数阈值；太小容易不稳定，太大可能过滤掉目标通路 TMIN = 3 # ============================================================ # 1. 读取并预处理示例单细胞数据 # ============================================================ # 作用：下载 OmicVerse 内置小鼠胰腺内分泌发生数据，随机抽取细胞并做基础预处理。 adata = ov.datasets.pancreatic_endocrinogenesis() # 为了快速演示，只随机抽取 300 个细胞；正式项目可删除这一步，直接使用全量数据 rng = np.random.default_rng(RANDOM_SEED) adata = adata[rng.choice(adata.n_obs, size=N_CELLS, replace=False)].copy() # 标记全部基因为 robust，随后进行标准化等预处理 adata.var[\"robust\"] = True adata = ov.pp.preprocess(adata, target_sum=1e4) print(adata) # ============================================================ # 2. 准备通路/基因集 signatures # ============================================================ # 作用：读取 GO Biological Process 2021 基因集，并抽取一条通路作为演示。 # 正式分析时，可以把 signatures 设置为多个通路组成的字典。 pathway_dict = ov.utils.geneset_prepare( GENESET_PATH, organism=ORGANISM, ) # 单通路演示：字典格式为 {通路名: 基因列表或带权重 signature} signatures = {GENESET_NAME: pathway_dict[GENESET_NAME]} print(f\"Selected geneset: {GENESET_NAME}\") print(f\"Number of genes in geneset: {len(signatures[GENESET_NAME])}\") # ============================================================ # 3. 定义通用运行函数 # ============================================================ # 作用：减少重复代码；自动运行指定 enrichment score 方法，提取分数、记录耗时。 def run_es_method(adata, method, engine, signatures, geneset_name, tmin=3, **kwargs): \"\"\" 运行 OmicVerse ov.es 中的一种通路活性打分方法。 返回当前 geneset 在每个细胞中的活性分数，以及运行耗时。 \"\"\" func = getattr(ov.es, method) start = time.perf_counter() func( adata, signatures=signatures, tmin=tmin, engine=engine, **kwargs, ) elapsed = time.perf_counter() - start score_key = f\"score_{method}\" score = adata.obsm[score_key][geneset_name].astype(float).values return score, elapsed # ============================================================ # 4. 批量运行 11 种 enrichment score 方法 # ============================================================ # 作用：统一比较 CPU/GPU 的结果与耗时。 # 注意：MDT 和 UDT 在原文中只运行 GPU，因为 CPU 逐细胞拟合树模型成本较高。 scores_cpu = {} scores_gpu = {} runtime_records = [] # 每个方法的额外参数；没有额外参数的留空字典 method_kwargs_cpu = { \"aucell\": {}, \"gsea\": {\"times\": 50}, # CPU times\u003e1 时常返回 NES \"gsva\": {}, \"ora\": {}, \"ulm\": {}, \"mlm\": {}, \"waggr\": {\"times\": 1}, \"zscore\": {}, \"viper\": {}, } method_kwargs_gpu = { \"aucell\": {}, \"gsea\": {\"times\": 1}, # GPU times=1 时通常返回 raw ES，和 CPU NES 尺度可能不同 \"gsva\": {}, \"ora\": {}, \"ulm\": {}, \"mlm\": {}, \"waggr\": {\"times\": 1}, \"zscore\": {}, \"viper\": {}, \"mdt\": {}, # 仅 GPU \"udt\": {}, # 仅 GPU } # 4.1 先运行有 CPU 基线的方法 for method, kwargs in method_kwargs_cpu.items(): score, elapsed = run_es_method( adata, method=method, engine=ENGINE_CPU, signatures=signatures, geneset_name=GENESET_NAME, tmin=TMIN, **kwargs, ) scores_cpu[method] = score adata.obs[f\"{method} (CPU)\"] = score runtime_records.append({\"method\": method, \"engine\": \"CPU\", \"seconds\": elapsed}) # 4.2 再运行 GPU 方法，包括 MDT 和 UDT for method, kwargs in method_kwargs_gpu.items(): score, elapsed = run_es_method( adata, method=method, engine=ENGINE_GPU, signatures=signatures, geneset_name=GENESET_NAME, tmin=TMIN, **kwargs, ) scores_gpu[method] = score adata.obs[f\"{method} (GPU)\"] = score runtime_records.append({\"method\": method, \"engine\": \"GPU\", \"seconds\": elapsed}) runtime_df = pd.DataFrame(runtime_records) print(runtime_df.pivot(index=\"method\", columns=\"engine\", values=\"seconds\")) # ============================================================ # 5. UMAP 可视化：比较每个方法的 CPU/GPU 空间分布 # ============================================================ # 作用：把通路活性分数像基因表达一样投影到 UMAP 上。 # 示例：绘制 AUCell CPU 与 GPU 结果 ov.pl.umap( adata, color=[\"aucell (CPU)\", \"aucell (GPU)\"], cmap=\"Reds\", frameon=False, ) # 示例：绘制所有 GPU 方法；正式项目中可按需拆分，避免图太拥挤 all_gpu_colors = [f\"{m} (GPU)\" for m in scores_gpu.keys()] ov.pl.umap( adata, color=all_gpu_colors, cmap=\"Reds\", frameon=False, ) # ============================================================ # 6. CPU 与 GPU 一致性评估 # ============================================================ # 作用：对同时具有 CPU/GPU 结果的方法计算 Pearson、Spearman 与 RMSE/range。 # 注意：GSEA 可能因为 NES/raw ES 尺度差异导致数值不完全重合。 def rmse_over_range(x, y): \"\"\"计算 RMSE 除以数值范围，避免不同方法尺度不可比。\"\"\" rmse = np.sqrt(np.mean((x - y) ** 2)) value_range = np.max(x) - np.min(x) return rmse / (value_range + 1e-12) comparison_records = [] for method in scores_gpu: if method not in scores_cpu: continue x = np.asarray(scores_cpu[method], dtype=float) y = np.asarray(scores_gpu[method], dtype=float) # 如果分数没有变化，相关系数可能为 NaN，这是 ORA 等方法中可能出现的正常现象 pearson = pd.Series(x).corr(pd.Series(y), method=\"pearson\") spearman = pd.Series(x).corr(pd.Series(y), method=\"spearman\") comparison_records.append({ \"method\": method, \"pearson_r\": pearson, \"spearman_r\": spearman, \"rmse_over_range\": rmse_over_range(x, y), }) comparison_df = pd.DataFrame(comparison_records) print(comparison_df) # ============================================================ # 7. 绘制 CPU/GPU 分数散点一致性图 # ============================================================ # 作用：将不同方法的分数标准化后放到一张图中，直观看是否接近 y=x 对角线。 methods_with_both = [m for m in scores_gpu if m in scores_cpu] cmap = plt.get_cmap(\"tab20\") fig, ax = plt.subplots(figsize=(5.5, 5.5)) for i, method in enumerate(methods_with_both): x = scores_cpu[method] y = scores_gpu[method] # Z-score 标准化，便于不同方法放在同一尺度比较 xz = (x - x.mean()) / (x.std() + 1e-12) yz = (y - y.mean()) / (y.std() + 1e-12) ax.scatter( xz, yz, s=4, alpha=0.4, label=method, color=cmap(i % cmap.N), ) ax.plot([-6, 6], [-6, 6], \"--\", color=\"grey\", lw=0.8) ax.set_xlabel(\"CPU score, z-scaled\") ax.set_ylabel(\"GPU score, z-scaled\") ax.set_title(\"CPU vs GPU enrichment score consistency\") ax.legend(markerscale=3, fontsize=8, frameon=False) plt.tight_layout() plt.show() # ============================================================ # 8. 保存结果，便于后续项目复用 # ============================================================ # 作用：将打分后的 AnnData 和统计表保存到本地。 # 路径可按自己的项目目录修改。 adata.write_h5ad(\"pancreas_ov_es_scores_demo.h5ad\") runtime_df.to_csv(\"ov_es_runtime_records.csv\", index=False) comparison_df.to_csv(\"ov_es_cpu_gpu_consistency.csv\", index=False) 代码使用建议 # 快速看通路空间分布： 优先跑 aucell 、 gsva 、 zscore 。 做 regulon/转录因子活性： 优先考虑 viper 、 ulm 、 mlm ，并确认 signature 是否带权重。 做正式结果： 不要只比较一条通路，建议批量导入 Hallmark、GO BP、KEGG、Reactome 或自定义口腔疾病相关基因集。 做口腔生信项目： 可把 GENESET_NAME 替换为炎症、TNF/NF-κB、IL-17、EMT、hypoxia、angiogenesis、T cell exhaustion、macrophage polarization 等通路。 复现注意： 原文中的 CPU/GPU 耗时只对应作者环境和 300 细胞示例，不应直接作为正式 benchmark 结论。","tags":["clippings","暂未试用"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"网页教程","updated":"2026-10-25T17:37:28.586Z","url":"bioinfo-tools/notes/864c62c90285ead001291c8d.html"},{"kbId":"KB-000064","title":"PCA主成分分析实战和可视化 | 附R代码和测试数据","subtitle":"","summary":"[!summary] 原文证据摘要 文章给出从表达矩阵读入、可选 MAD 过滤、 prcomp() PCA，到碎石图、样本图、分组置信椭圆、变量贡献图和 biplot 的一套完整示例；同时讨论中心化与 scale 的选择。 标题： PCA主成分分析实战和可视化 附R代码和测试数据 公众号/作者： 生信宝典 / 陈同 发布时间： 2018-12-17 08:20 原文链接： 浏览器核验结果： 页面包含“数据初始化”“数据读入”“数据预处理（可选）”“PCA分析”“PCA结果展示","body":"摘要 原文证据摘要 文章给出从表达矩阵读入、可选 MAD 过滤、 prcomp() PCA，到碎石图、样本图、分组置信椭圆、变量贡献图和 biplot 的一套完整示例；同时讨论中心化与 scale 的选择。 页面核验信息 # 标题： PCA主成分分析实战和可视化 | 附R代码和测试数据 公众号/作者： 生信宝典 / 陈同 发布时间： 2018-12-17 08:20 原文链接： https://mp.weixin.qq.com/s/4R14xJkQVPtaufaoXOcPIw 浏览器核验结果： 页面包含“数据初始化”“数据读入”“数据预处理（可选）”“PCA分析”“PCA结果展示”和“PCA分析注意事项”等章节。 原文流程摘录 # 数据预处理与 PCA # 原文表达矩阵约定为“行是基因、列是样本”，先去除全零行和零方差行，再转置为“行是样本、列是变量”： data \u003c- read.table(exprData, header = TRUE, row.names = NULL, sep = \"\\t\") rownames_data \u003c- make.names(data[, 1], unique = TRUE) data \u003c- data[, -1, drop = FALSE] rownames(data) \u003c- rownames_data data \u003c- data[rowSums(data) \u003e 0, ] data \u003c- data[apply(data, 1, var) != 0, ] mads \u003c- apply(data, 1, mad) data \u003c- data[rev(order(mads)), ] data_t \u003c- t(data) pca \u003c- prcomp(data_t[, 1:variableL], scale = TRUE) 原文还提示：PCA 前通常需要中心化；是否 scale 要结合变量单位、量级和噪声判断。对于 RNA-seq，建议先使用合适的库深度校正和 log 变换/方差稳定变换，再进行 PCA。 结果展示 # 原文使用 factoextra 生成以下结果： fviz_eig(pca, addlabels = TRUE) fviz_pca_ind(pca, repel = TRUE) fviz_pca_ind( pca, col.ind = data_t$conditions, mean.point = FALSE, addEllipses = TRUE, legend.title = \"Groups\", ellipse.type = \"confidence\", ellipse.level = 0.95 ) fviz_pca_var(pca, select.var = list(cos2 = 0.99), repel = TRUE, col.var = \"cos2\", geom.var = c(\"arrow\", \"text\")) fviz_pca_biplot( pca, fill.ind = data_t$conditions, addEllipses = TRUE, ellipse.type = \"confidence\", ellipse.level = 0.95, mean.point = FALSE, col.var = \"contrib\", select.var = list(contrib = 10), ggtheme = theme_minimal() ) 关键解释 # 碎石图用于查看每个主成分的方差贡献率。 样本图的点表示样本，点间距离表示在选定 PCA 空间中的相对距离。 分组椭圆是组内分布的可视化辅助，不等于组间显著性检验。 cos2 表示变量在所选坐标轴上的表示质量； contrib 表示变量对主成分的贡献。 scale = TRUE 会让不同量级变量的权重趋于可比，但也可能放大噪声；参数必须写入分析记录。 复用时需要修正的地方 # 原文示例含有公众号排版导致的换行和变量拼接，不能直接当作可运行脚本；应重新整理输入、样本信息合并和输出路径。 variableL 必须在转置后明确计算，不能依赖未定义变量。 分组列应来自样本信息表，并按表达矩阵样本名重新排序，不能假设两个文件顺序天然一致。 正式分析建议把椭圆阈值写成显式参数；本仓库脚本默认 ellipse.level = 0.95 ，不把椭圆当作统计检验。 与综合方法页的关系 # 本页保留原文方法证据；参数化的完整 Bulk RNA-seq PCA 流程见远程仓库 04_Bulk转录组/4.2_PCA/02_prcomp_factoextra_Bulk_PCA完整流程.R 。","tags":["clippings","生信教程","Bulk转录组","PCA","R语言","factoextra","MAD","暂未试用"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"网页教程","updated":"2026-10-25T17:37:28.586Z","url":"bioinfo-tools/notes/7baa5dc38fd7dad270e1d7c6.html"},{"kbId":"KB-000061","title":"Cellpose（MouseLand）细胞分割项目","subtitle":"","summary":"MouseLand 维护的通用细胞/细胞核分割项目，支持 GUI、CLI、API、3D、human-in-the-loop 训练与 Cellpose-SAM / DINOv3 新模型。","body":"摘要 LLM 归库摘要 核心内容： Cellpose 是 MouseLand 维护的通用细胞分割项目，当前主线是 Cellpose-SAM / Cellpose4，强调对不同成像条件、通道顺序、目标尺度和 3D 数据的泛化能力。 适用场景： 荧光/明场显微图像中的细胞、细胞核或类器官区域分割；批量图像处理；需要人工修正后继续训练模型的 human-in-the-loop 标注流程。 输入： 2D/3D 图像（如 tif/png/jpg/gif）、可选多通道与 Z-stack、用户标注数据、模型类型（如 cyto / nuclei / cpsam_v2 / cpdino ）、细胞直径与通道设置。 输出： 分割 masks、GUI 可视化结果、批处理分割结果，以及 Cellpose3/4 流程中常见的 _seg.npy 等结果文件。 关键参数/步骤： python -m cellpose 启动 GUI； python -m pip install cellpose[gui] 安装图形界面；3D 数据用 python -m cellpose --Zstack ；GPU 环境需单独确认 torch/CUDA；新 DINOv3 模型需额外安装 dinov3 。 常见错误： torch 装成 CPU 版导致 GPU 不可用；模型权重下载失败；大图/3D 内存不足；通道和直径设置不合理导致过分割或漏分割；许可证信息在 README 徽章、LICENSE 文件与模型/数据声明之间需分别核对。 与口腔生信连接： 可作为口腔组织切片、免疫荧光、细胞培养、类器官或空间组学配套显微图像的上游分割工具，为后续单细胞/空间分析、细胞计数、形态定量和区域提取提供基础掩膜。 关联页面建议： 后续可整合到 03 生信教程与工具库/02_wiki/tools/显微图像分析/Cellpose 或 03 生信教程与工具库/02_wiki/workflows/显微图像分割/Cellpose 工作流 。 下一步处理： 如果准备真正上手，建议补一条“本地安装 + 示例图像跑通 + 口腔样本参数记录”的试用笔记，并把常用命令整理成 workflow 页面。 归库说明： 分类到 03 生信教程与工具库，置信度 0.93；来源为 GitHub 仓库主页与 README/API 元数据，已标记为暂未试用。 Cellpose（MouseLand）细胞分割项目 项目定位 # 仓库地址： MouseLand/cellpose 官方描述： a generalist algorithm for cellular segmentation with human-in-the-loop capabilities 主要语言：Python GitHub 状态：2026-06-08 查看时约 2231 stars / 626 forks ；默认分支为 main ，当天仍有 push 记录，说明项目仍在活跃维护。 主页入口： https://huggingface.co/spaces/mouseland/cellpose 最近 release： v4.1.1 （2026-03-31）；README 还写了 v4.2+ update (June 2026) ，说明主线功能仍在继续迭代。 我目前抓到的核心能力 # 通用细胞/细胞核分割 ：核心目标是显微图像中的细胞级实例分割，而不是只适配单一组织或单一成像模式。 Cellpose-SAM / Cellpose4 ：README 明确强调最新主线是 Cellpose-SAM，并在 2026 年 6 月加入了基于 DINOv3 的新模型（ cpdino 、 cpdino-vitb ）。 human-in-the-loop 训练 ：不仅能直接跑预训练模型，还支持人工修正后继续训练自己的模型，适合实验室逐步积累特定样本数据。 3D 分割 ：支持 Z-stack / 3D tiff，说明不只适合常规 2D 显微图。 图像恢复能力 ：Cellpose3 起加入 image restoration，可先做图像恢复再改进分割表现。 多入口使用 ：既能在 GUI 手工交互，也能通过 CLI、notebook、Hugging Face Space 和 GitHub 开发版使用。 安装与运行抓手 # 1. 常见安装方式 # Conda：推荐 conda create --name cellpose python=3.12 后再 python -m pip install cellpose[gui] 纯 Python / venv：适合不想装 conda 的情况 GitHub 开发版： pip install git+https://www.github.com/mouseland/cellpose.git 新 DINOv3 模型：需要额外安装 python -m pip install git+https://github.com/facebookresearch/dinov3 2. 常见启动方式 # python -m pip install cellpose[gui] python -m cellpose python -m cellpose --Zstack Windows 可直接用打包的 cellpose.exe 如果要做批处理，可通过 CLI 指定目录、通道、保存格式 预训练模型首次运行时会自动下载权重 3. 官方给出的关键前提 # 支持 Linux / Windows / Mac 至少 8GB RAM；大图和 3D 体数据可能需要 16–32GB 如果走 GPU，必须额外确认 torch 与 CUDA 驱动是否匹配 README 明确提示：若 GPU 不工作，常见原因是误装了 CPU 版 torch 对生信 / 显微分析的实际价值 # 1. 口腔组织与细胞成像上游分割 # 如果你后面要处理： 口腔鳞癌组织切片中的细胞核轮廓 免疫荧光图中的细胞/核分割 类器官或培养细胞图像中的细胞计数与形态测量 空间转录组配套显微图像中的区域提取 那么 Cellpose 可以作为一个比较通用的上游工具。 2. 对后续分析的连接点 # Cellpose 产出的 masks 可以继续用于： 单细胞或空间层面的 ROI 提取 细胞密度、面积、圆度、邻域结构等形态学统计 下游 CellProfiler / napari / 自定义 Python 脚本的定量分析 训练自己的口腔样本专用分割模型 3. 为什么值得单独入库 # 它不是一篇一次性教程，而是一个持续维护的“工具基础设施”型项目： 有论文线（Cellpose 1/2/3 与 Cellpose-SAM） 有代码线（GitHub 仓库） 有文档线（ReadTheDocs） 有在线体验入口（Hugging Face Space） 有 notebook 示例，适合以后直接复现 使用时特别要注意的点 # 模型/代码/数据许可要分开看 GitHub API 与 LICENSE 文件正文显示代码许可证是 BSD-3-Clause ；但 README 徽章仍显示 GPL v3；同时 README 又说明模型训练数据和标注数据为 CC-BY-NC 。如果未来涉及再分发或商业使用，最好分别核对代码、模型权重和训练数据的许可范围。 GPU 环境不一定开箱即用 README 虽然给了安装路线，但真正跑通通常还要看本机 torch 版本、CUDA 版本、驱动与显卡是否匹配。 大图 / 3D 数据要提前考虑内存 项目明确写了大图和 3D 体数据可能需要 16–32GB RAM，因此不适合毫无准备地直接全量批处理。 口腔样本最好记录自己的经验参数 比如不同染色、不同放大倍数下的直径估计、通道选择、是否先做 restoration、是否适合 nuclei 还是 cyto 模型，这些都值得单独记成试用笔记。 相关论文线索 # README 里给出的核心论文包括： Cellpose 1.0：Stringer et al., 2021, Nature Methods Cellpose 2.0：Pachitariu \u0026 Stringer, 2022，强调 human-in-the-loop training Cellpose3：Stringer \u0026 Pachitariu, 2025，强调 image restoration Cellpose-SAM：Pachitariu, Rariden \u0026 Stringer, 2025, bioRxiv 这意味着如果后面要系统比较显微图像分割方法，可以把它同时看作： 一个工具项目 一条持续更新的方法论文谱系 我建议的后续整理方向 # 如果你准备实际安装：新建一条 Cellpose 试用记录 如果你准备沉淀为稳定方法：整理到 显微图像分割 workflow 页面 如果你准备做方法比较：和 StarDist、CellProfiler、napari 插件、SAM 系分割工具做横向对照 参考入口 # GitHub： https://github.com/MouseLand/cellpose 文档： https://cellpose.readthedocs.io/en/latest/ 在线体验： https://huggingface.co/spaces/mouseland/cellpose Cellpose-SAM 论文： https://www.biorxiv.org/content/10.1101/2025.04.28.651001v1","tags":["clippings","暂未试用","cellpose","细胞分割","显微图像分析","Python工具"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"网页教程","updated":"2026-10-25T17:37:28.585Z","url":"bioinfo-tools/notes/29b62198d768fe8c91333aee.html"},{"kbId":"KB-000062","title":"ggbiplot-最好看的PCA作图：样品PCA散点+分组椭圆+变量贡献与相关","subtitle":"","summary":"[!summary] 原文证据摘要 文章介绍 ggbiplot 作为 prcomp() PCA 结果的 ggplot2 可视化工具，可按组着色、添加分组椭圆、绘制变量相关向量和相关环，并以 OTU 表示范从样本 PCA 延伸到高变异 OTU 的贡献解释。 标题： ggbiplot-最好看的PCA作图：样品PCA散点+分组椭圆+变量贡献与相关 公众号/作者： 宏基因组 / 朱微金 发布时间： 2017-12-22 00:00 原文链接： 上游项目： 浏览器核验结果： 页面包含官","body":"摘要 原文证据摘要 文章介绍 ggbiplot 作为 prcomp() PCA 结果的 ggplot2 可视化工具，可按组着色、添加分组椭圆、绘制变量相关向量和相关环，并以 OTU 表示范从样本 PCA 延伸到高变异 OTU 的贡献解释。 页面核验信息 # 标题： ggbiplot-最好看的PCA作图：样品PCA散点+分组椭圆+变量贡献与相关 公众号/作者： 宏基因组 / 朱微金 发布时间： 2017-12-22 00:00 原文链接： https://mp.weixin.qq.com/s/GGCPxQEe_DXefdp-veQtag 上游项目： https://github.com/vqv/ggbiplot 浏览器核验结果： 页面包含官方示例、OTU 表实战和参数说明；核心函数为 ggbiplot() 与 ggscreeplot() 。 原文方法摘录 # 官方示例 # install.packages(\"devtools\", repo = \"http://cran.us.r-project.org\") library(devtools) install_github(\"vqv/ggbiplot\") data(wine) wine.pca \u003c- prcomp(wine, scale. = TRUE) ggbiplot( wine.pca, obs.scale = 1, var.scale = 1, groups = wine.class, ellipse = TRUE, circle = TRUE ) + scale_color_discrete(name = \"\") + theme(legend.direction = \"horizontal\", legend.position = \"top\") 原文解释：坐标轴上的 PC1/PC2 是总体差异的解释率；点代表样品；颜色代表分组；椭圆代表组内核心区域；箭头方向反映变量与主成分的相关性，长度反映变量贡献。 OTU 表实战 # 原文约定实验设计表的行名与 OTU 表的样本列名对应： design \u003c- read.table(\"design.txt\", header = TRUE, row.names = 1, sep = \"\\t\") otu_table \u003c- read.delim(\"otu_table.txt\", row.names = 1, header = TRUE, sep = \"\\t\") idx \u003c- rownames(design) %in% colnames(otu_table) sub_design \u003c- design[idx, ] count \u003c- otu_table[, rownames(sub_design)] otu.pca \u003c- prcomp(t(count), scale. = TRUE) ggbiplot( otu.pca, obs.scale = 1, var.scale = 1, groups = sub_design$genotype, ellipse = TRUE, var.axes = FALSE ) 随后原文将 OTU 表按列和归一化到总和 100，按 MAD 筛选波动较大的 OTU，再把 var.axes = TRUE 用于展示变量向量。 关键参数 # 参数 作用 groups 样本分组，用于点的颜色和分组图层 ellipse 是否添加分组椭圆 ellipse.prob 椭圆覆盖概率；原文默认 0.68，复用脚本显式设为 0.95 var.axes 是否绘制变量向量 circle 是否绘制相关环，要求 PCA 使用 scale 后的变量 varname.adjust 变量标签与箭头的距离 复用时需要修正的地方 # ggbiplot 依赖 GitHub 版本，安装前应确认网络、R 版本和依赖；不能假设所有 CRAN 镜像都有该包。 原文示例的 wine.class 需要先存在；Bulk RNA-seq 中应由样本信息表提供分组向量。 OTU 表流程中的“按列和归一化”适用于丰度表，不应机械套用到原始 RNA-seq count；RNA-seq 应先按实验设计选择 DESeq2/vst、 logCPM 或其他合适变换。 变量向量在高维基因表达矩阵中容易拥挤，建议先按 MAD 或贡献度筛选，并在 README 中记录筛选阈值。 与综合方法页的关系 # 本页保留 ggbiplot 原文证据；面向 Bulk RNA-seq 的输入检查、MAD 筛选和输出脚本见远程仓库 04_Bulk转录组/4.2_PCA/03_ggbiplot_Bulk_PCA美化.R 。","tags":["clippings","生信教程","Bulk转录组","PCA","ggbiplot","ggplot2","OTU","暂未试用"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"网页教程","updated":"2026-10-25T17:37:28.585Z","url":"bioinfo-tools/notes/5d07f74185182d42322201f2.html"},{"kbId":"KB-000059","title":"AI复现顶刊特色同款：山脊图+热图的组合","subtitle":"","summary":"AI绘图复现真的很简单吗？","body":"摘要 LLM 归库摘要 核心内容： 用 R 复现《Nature Cell Biology》2026 灵长类 CS9 胚胎空间转录组论文的 Fig. 2d——HOX 基因沿前后轴（A–P）表达分布的山脊图+热图组合，附完整 ggplot2/ggridges 代码。 适用场景： 展示一组基因沿空间轴/解剖轴的表达梯度；单细胞、空间转录组\"山脊图+热图\"发表级组合排版。 输入： 基因 × 空间层表达矩阵（31 HOX 基因 × 100 A–P 层），源自 Tan_2026_PrimateOrganogenesis_NatCellBiol_source_data_fig2.xlsx 的 Panel d。 输出： Fig2d_xinye_plot.png/pdf——HOXA/B/C/D 四组山脊图 + 右侧 z-score 行标准化热图，A→P 方向，含配色与图例。 关键参数/步骤： 每基因 min-max 归一化定山脊高度；smooth.spline(spar=0.45) 平滑；Cubic Hermite 尾巴延伸；热图 z-score 与蓝-白-红渐变（limits -4~4）；cowplot 拆行对齐山脊与热图。 常见错误： 直接用原始表达量会压扁图形；AP 第 100 层不是右边界需留白；图例/标题不拆行会导致两图错位。 与口腔生信连接： 可套用此模板展示牙周炎/OSCC 关键基因沿空间轴向（上皮-间质、炎症梯度）的表达分布，替换数据与基因列表即可。 下一步处理： 暂未试用；复现需先下载源数据 xlsx，确认 readxl 路径与包版本后试跑。 归库说明： 分类到 03 生信教程与工具库，置信度 0.88，理由：可视化复现教程、含完整 R 代码、非单篇论文剪藏。 新叶 生信技能树 2026年8月5日 19:56 今天学习2026年5月7日发表在《Nature Cell Biology》杂志上的一篇文献，标题为《A three-dimensional spatial transcriptome atlas reconstructs early organogenesis in primate Carnegie stages 9 and 10 embryos》。 使用AI复现这个文献中的Figure2D，是一个山脊图+热图的组合模式！ 山脊图我们前面有过介绍： 顶刊Nature杂志同款配色一流的山峦图 原图如下： example07-Fig2d 图的含义 # Fig. 2d 的核心是：把 HOX 基因表达沿胚胎前后轴（A–P，Anterior→Posterior）展开，观察其空间分布，而不是做 GO 富集。 图怎么读 横轴：胚胎前端 A → 后端 P。 每条 ridge：一个 HOX 基因在 A–P 轴上的表达曲线。 峰的位置：该基因主要在哪个轴向区域表达。 峰越靠右，说明越偏后部；峰越窄，说明空间限制越强。 右侧热图：对应基因在不同 A–P 位置的平均表达，蓝色低、红色高。 四组分别是 HOXA、HOXB、HOXC 和 HOXD 基因簇。 作者图注称其为： “Ridgeline plots showing the distribution of HOX gene expression along the A–P axis…” 主要观察结果 总体呈现典型的 HOX 前后轴分区规律： 较前端的 HOX 基因，例如 HOXA1、HOXB1、HOXB2，表达范围相对更宽，覆盖较长的 A–P 区域。 随着 HOX 基因位置偏向中部和后部，表达峰逐渐向 P 端移动并变窄。 HOXA7、HOXA9、HOXB9、HOXC10 等基因主要集中在胚胎后部。 HOXC10、HOXD13 等后部 HOX 基因的表达峰尤其尖锐，提示其对应的轴向身份已经比较局限。 因此，图 2d 支持一个结论：随着胚胎沿前后轴向后延伸，不同区域逐渐获得更加明确、受限制的 HOX 组合，也就是前后轴区域化正在建立。 生物学意义 HOX 基因并不是简单地“越往后表达越高”，而是形成一种组合式的 positional code： 前部 HOX：表达较早、范围较宽； 中部 HOX：偏向躯干和中后部； 后部 HOX：集中在尾侧、脊髓、脊索、NMP、PSM、后肠等区域。 这说明 CS9 猕猴胚胎已经出现明显的轴向身份划分。作者据此认为，中央和后部 HOX 基因逐渐向后端限制，反映了早期胚胎的 progressive axial regionalization，即“渐进式前后轴区域化”。 此外，正文还指出 HOXA10、HOXA11、HOXA13 在尿囊中也有表达。由于尿囊位于胚胎后部，这提示尿囊在早期仍然具有类似后部中胚层的分子特征。 需要注意的地方 Fig. 2d 展示的是 CS9 胚胎的连续空间分布，不是时间序列，也不能单独证明 HOX 基因直接造成了这些组织命运。 示例数据 # Fig. 2d 的数据来源分为三层： 生物学样本:作者自己的 1 个 CS9 猕猴胚胎： 10 张近中线矢状切片； Stereo-seq 空间转录组； bin50 分辨率，即 50×50 DNBs，约 25 μm； 质控后 CS9 共 35,568 个 spots。 因此，Fig. 2d 不是来自公开 scRNA-seq 数据 GSE193007，也不是外部数据库的 HOX 表达数据。 图中实际使用的处理数据 作者将 CS9 空间转录组矩阵进行 3D 重建，排除非胚胎区域后： 以胚胎前端建立参考点； 计算每个 bin50 到参考点的欧氏距离； 按距离排序，形成 A→P 梯度； 划分为 100 个 AP 层； 计算每层中各 HOX 基因的平均表达； 以这些表达值绘制 Fig. 2d 的 ridgeline 和热图。 对应的作者源数据文件是： Tan_2026_PrimateOrganogenesis_NatCellBiol_source_data_fig2.xlsx 其中 Panel d 工作表包含 31 个 HOX 基因 × 100 个 A–P 空间层（ AP_1 – AP_100 ）。 原始测序数据 该研究原始测序数据存放于 CNGBdb，登录号为 CNP0007017 。 所以最准确地说：Fig. 2d 是基于作者自测的 CS9 猕猴胚胎 Stereo-seq 空间转录组数据，经 3D 重建和 A–P 分层后得到的 HOX 表达空间分布。 解释的非常清楚！！！ 我们去把附表下载下来就好了！ AI复现 # 提示词比较简单：当然一次沟通并不能达到想要的效果，需要多沟通一些，我这里的xinye-plot是使用技能树的两个手搓代码的绘图专辑蒸馏得到的一个专属绘图skill。如果你想进群交流AI绘图和chatgpt的使用，添加新叶微信：jzhang0527。请备注来意~ 根据fig2d的数据绘制一个同款图，图片的输出尺寸使用 $xinye-plot 。 复现结果如下： 本次的绘图代码如下： suppressPackageStartupMessages({ library(readxl) library(ggplot2) library(ggridges) library(patchwork) library(cowplot) library(scales) }) input_xlsx \u003c- file.path( \"references\", \"Tan_2026_PrimateOrganogenesis_NatCellBiol\", \"Tan_2026_PrimateOrganogenesis_NatCellBiol_source_data_fig2.xlsx\" ) output_png \u003c- \"Fig2d_xinye_plot.png\" output_pdf \u003c- \"Fig2d_xinye_plot.pdf\" figure_width_in \u003c- 7.0 figure_height_in \u003c- figure_width_in * 918 / 1410 figure_dpi \u003c- 1410 / figure_width_in ridge_x_max \u003c- 118 ridge_smooth_spar \u003c- 0.45 ridge_tail_end \u003c- 112 panel_d \u003c- as.data.frame(read_excel(input_xlsx, sheet = \"Panel d\")) gene_col \u003c- names(panel_d)[1] genes \u003c- as.character(panel_d\u003ca href=\"gene_col\"\u003egene_col\u003c/a\u003e) ap_names \u003c- names(panel_d)[-1] ap \u003c- seq_along(ap_names) expr \u003c- as.matrix(panel_d[, -1, drop = FALSE]) rownames(expr) \u003c- genes colnames(expr) \u003c- ap_names groups \u003c- list( HOXA = grep(\"^HOXA\", genes), HOXB = grep(\"^HOXB\", genes), HOXC = grep(\"^HOXC\", genes), HOXD = grep(\"^HOXD\", genes) ) ridge_palettes \u003c- list( HOXA = c(\"#c95665\", \"#b18fa6\", \"#c66e60\", \"#d0a16e\", \"#888b90\", \"#7e98bb\", \"#90aaa5\", \"#d09d68\", \"#8fa38d\", \"#eb5d60\"), HOXB = c(\"#af91a9\", \"#b56d60\", \"#d2a570\", \"#888e92\", \"#7895b8\", \"#91a59a\", \"#d19c6c\", \"#8da382\", \"#eb5d60\"), HOXC = c(\"#8b9091\", \"#7894b6\", \"#91aaa3\", \"#d7945d\", \"#8da17e\", \"#ed5b5e\"), HOXD = c(\"#8b9091\", \"#7894b6\", \"#91aaa3\", \"#d7945d\", \"#8da17e\", \"#ed5b5e\") ) # Xinye-plot adaptation: # 2025-065 “顶刊Nature杂志同款配色一流的山峦图” (code-03/04) # supplies the ggridges + manual palette + scale/theme-classic pattern. # Here geom_ridgeline is used because Panel d already contains a continuous # expression profile at 100 AP layers, rather than one observation per cell. row_z \u003c- function(x) { z \u003c- t(apply(x, 1, function(v) { s \u003c- sd(v) if (is.na(s) || s == 0) return(rep(0, length(v))) as.numeric(scale(v)) })) rownames(z) \u003c- rownames(x) colnames(z) \u003c- colnames(x) z } make_panel \u003c- function(group_name, idx) { group_genes \u003c- genes[idx] group_expr \u003c- expr[idx, , drop = FALSE] # Normalize each gene only for ridge height; this preserves the spatial shape # while preventing high-abundance genes from dominating the panel geometry. ridge_height \u003c- t(apply(group_expr, 1, function(v) { v \u003c- v - min(v) if (max(v) == 0) return(rep(0, length(v))) v / max(v) })) rownames(ridge_height) \u003c- group_genes colnames(ridge_height) \u003c- ap_names ridge_df \u003c- do.call(rbind, lapply(seq_along(group_genes), function(i) { # Lightly smooth the 100-layer profile for visual rendering. The post-100 # tail is a continuous display extension, not additional AP measurements. smooth_fit \u003c- smooth.spline( ap, as.numeric(ridge_height[i, ]), spar = ridge_smooth_spar ) smooth_x \u003c- seq(min(ap), ridge_x_max, length.out = 360) smooth_y \u003c- predict(smooth_fit, x = pmin(smooth_x, max(ap)))$y tail_idx \u003c- smooth_x \u003e max(ap) if (any(tail_idx)) { # Cubic Hermite tail: preserve the fitted endpoint slope, then join # smoothly to zero at the end of the visual tail. x0 \u003c- max(ap) x1 \u003c- ridge_tail_end y0 \u003c- predict(smooth_fit, x = x0)$y y1 \u003c- 0 slope0 \u003c- (predict(smooth_fit, x = x0)$y - predict(smooth_fit, x = x0 - 5)$y) / 5 tail_x \u003c- pmin(smooth_x[tail_idx], x1) tail_fraction \u003c- (tail_x - x0) / (x1 - x0) tail_length \u003c- x1 - x0 smooth_y[tail_idx] \u003c- (2 * tail_fraction^3 - 3 * tail_fraction^2 + 1) * y0 + (tail_fraction^3 - 2 * tail_fraction^2 + tail_fraction) * tail_length * slope0 + (-2 * tail_fraction^3 + 3 * tail_fraction^2) * y1 smooth_y[smooth_x \u003e x1] \u003c- 0 } data.frame( AP = smooth_x, gene = factor(group_genes[i], levels = rev(group_genes)), y = length(group_genes) - i + 1, height = pmax(0, smooth_y) ) })) ridge \u003c- ggplot(ridge_df, aes(x = AP, y = y, height = height, fill = gene)) + geom_ridgeline( scale = 1.15, min_height = 0, color = \"#1f1f1f\", linewidth = 0.18, alpha = 1 ) + scale_fill_manual(values = setNames(ridge_palettes\u003ca href=\"group_name\"\u003egroup_name\u003c/a\u003e[seq_along(group_genes)], group_genes)) + # In the reference, 100 is the last tick, not the right panel boundary. # Keep a small post-100 margin so the terminal ridge is not clipped. scale_x_continuous( breaks = c(1, 21, 41, 61, 81, 100), labels = c(\"0\", \"20\", \"40\", \"60\", \"80\", \"100\"), limits = c(0, ridge_x_max), expand = c(0, 0) ) + scale_y_continuous( breaks = seq_along(group_genes), labels = rev(group_genes), expand = expansion(mult = c(0.02, 0.03)) ) + coord_cartesian(xlim = c(0, ridge_x_max), expand = FALSE, clip = \"off\") + labs(x = NULL, y = NULL) + theme_classic(base_size = 6) + theme( legend.position = \"none\", axis.text.y = element_text(face = \"italic\", size = 6.2), axis.text.x = element_text(size = 5.2), axis.title.x = element_blank(), axis.ticks.y = element_blank(), panel.grid.major.x = element_line(color = \"#e5e5e5\", linewidth = 0.15), plot.margin = margin(1.5, 4, 1, 1) ) heat_z \u003c- row_z(group_expr) heat_df \u003c- do.call(rbind, lapply(seq_along(group_genes), function(i) { data.frame( gene = factor(group_genes[i], levels = rev(group_genes)), AP = ap, z = as.numeric(heat_z[i, ]) ) })) heat \u003c- ggplot(heat_df, aes(x = AP, y = gene, fill = z)) + geom_tile(width = 1, height = 1) + scale_x_continuous( breaks = c(1, 100), labels = c(\"A\", \"P\"), expand = expansion(mult = c(0, 0)) ) + scale_y_discrete(position = \"right\", drop = FALSE) + scale_fill_gradient2( low = \"#425794\", mid = \"#f3f3f3\", high = \"#e4515a\", midpoint = 0, limits = c(-4, 4), oob = squish, breaks = c(-4, 0, 4), name = \"Exp.\" ) + labs(x = NULL, y = NULL) + theme_classic(base_size = 6) + theme( axis.text.y = element_text( face = \"italic\", size = 6.2, hjust = 0, margin = margin(l = 2) ), axis.ticks.y = element_blank(), axis.text.x = element_text(size = 5.2), axis.title.x = element_blank(), legend.position = \"bottom\", legend.direction = \"horizontal\", legend.title = element_text(size = 5.2), legend.text = element_text(size = 4.8), legend.key.width = unit(0.35, \"cm\"), legend.key.height = unit(0.10, \"cm\"), legend.box.spacing = unit(0, \"pt\"), plot.margin = margin(1.5, 8, 1, 1) ) + guides(fill = guide_colorbar( title.position = \"top\", title.hjust = 0.5, barwidth = unit(0.85, \"cm\"), barheight = unit(0.10, \"cm\"), ticks = FALSE )) ridge_title \u003c- ggdraw() + draw_label( paste0(group_name, \" clusters\"), x = 0.5, y = 0.5, hjust = 0.5, vjust = 0.5, size = 9 ) heat_title \u003c- ggdraw() + draw_label( \"Average expression level\", x = 0.5, y = 0.5, hjust = 0.5, vjust = 0.5, size = 7 ) # Split titles, equal-height main plots, and the heatmap colorbar into rows. # This keeps the ridge/heatmap bodies aligned and places the colorbar on a # shared horizontal guide row below the two main plots. heat_legend \u003c- get_legend(heat) heat_no_legend \u003c- heat + theme(legend.position = \"none\") # Reference-like balance: narrower ridge plot, wider heatmap + gene labels. panel_widths \u003c- c(1.20, 0.08, 0.92) blank \u003c- ggplot() + theme_void() + theme( plot.background = element_rect(fill = \"white\", colour = NA), panel.background = element_rect(fill = \"white\", colour = NA) ) title_row \u003c- plot_grid( ridge_title, blank, heat_title, ncol = 3, rel_widths = panel_widths ) body_row \u003c- plot_grid( ridge, blank, heat_no_legend, ncol = 3, rel_widths = panel_widths ) ridge_footer \u003c- ggdraw() + draw_label( \"A -\u003e P\", x = 0.5, y = 0.5, hjust = 0.5, vjust = 0.5, size = 6.0 ) heat_ap_footer \u003c- ggdraw() + draw_label( \"A -\u003e P\", x = 0.38, y = 0.5, hjust = 0.5, vjust = 0.5, size = 6.0 ) heat_footer \u003c- plot_grid( heat_ap_footer, heat_legend, ncol = 2, rel_widths = c(0.78, 1.22) ) footer_row \u003c- plot_grid( ridge_footer, blank, heat_footer, ncol = 3, rel_widths = panel_widths ) plot_grid( title_row, body_row, footer_row, ncol = 1, rel_heights = c(0.15, 1, 0.16), align = \"v\" ) } fig \u003c- wrap_plots( make_panel(\"HOXA\", groups$HOXA), make_panel(\"HOXB\", groups$HOXB), make_panel(\"HOXC\", groups$HOXC), make_panel(\"HOXD\", groups$HOXD), ncol = 2 ) + plot_annotation( title = \"d\", theme = theme( plot.title = element_text(hjust = 0, face = \"bold\", size = 11), plot.margin = margin(1, 2, 1, 2) ) ) # Explicit output block following the Xinye-plot recipe convention. # Flexible dimensions: preserve the reference aspect ratio while allowing the # physical export width to be changed without using the Xinye example's fixed # 5.5 x 5 inch output. ggsave(filename = output_png, width = figure_width_in, height = figure_height_in, dpi = figure_dpi, plot = fig, bg = \"white\") ggsave(filename = output_pdf, width = figure_width_in, height = figure_height_in, device = \"pdf\", plot = fig, bg = \"white\") 数据代码都给你了，但是如果是你自己做复现，可能得不到这样的结果，试试看！ 画了这么久了，现在根本就再也不想回去手搓代码了怎么办？ 生信技能树在8月份有一个长沙的线下培训班，感兴趣的瞄一瞄： 暑期特训长沙站：Codex赋能单细胞+空间转录组线下培训班来袭！ 此外，虚拟细胞开了一个复现群，来吧： 2026年最火的双虚拟敲除：CellOracle 虚拟 KO + scTenifoldKnk 验证 → 锁定目标基因 绘图小技巧2026 · 目录 闪记 复制 LaTeX 公式","tags":["clippings","生信教程","可视化","山脊图","热图","R语言","ggridges","空间转录组","Stereo-seq","暂未试用"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"网页教程","updated":"2026-10-25T17:37:28.584Z","url":"bioinfo-tools/notes/8ff1732ce564b08882a3d666.html"},{"kbId":"KB-000060","title":"Bizard/skill-spec.md at main","subtitle":"","summary":"Bizard: A Biomedical Visualization Atlas. https://openbiox.github.io/Bizard/ - Bizard/skill-spec.md at main · openbiox/Bizard","body":"摘要 LLM 归库摘要 核心内容： Bizard（Biomedical Visualization Atlas）是一个社区驱动的生物医学数据可视化平台，整合了R语言可视化代码仓库、进阶教程和协作论坛。项目由openbiox发起，已发表论文于iMetaMed（2026）。提供可下载的AI assistant skill统一技能包，涵盖多种图表类型（变量分布、相关分析、排名图、交互式图表等）及生物医学数据预处理算法。 可复用知识： 平台提供可直接使用的R语言可视化代码，涵盖统计分析与可视化模块集成；AI skill可导入Claude Code等AI助手用于快速生成生物医学可视化图表。 关联页面建议： 若需R语言可视化汇总，可考虑创建 03 生信教程与工具库/02_wiki/tools/R语言可视化工具汇总 下一步处理： 访问在线平台 https://openbiox.github.io/Bizard/ 试用代码库，或将AI skill导入AI工具；Bizard的R代码可直接适配用于口腔生信数据可视化。 归库说明： 分类到 03 生信教程与工具库，置信度 0.78，理由：生物医学R语言可视化工具平台，含代码仓库、教程与AI skill；虽有DOI但主体为工具/平台说明而非单篇论文结构。 适用场景： 需要在R语言中快速制作生物医学发表级图表时，可参考Bizard代码库选择合适图表类型和参数进行适配。 输入： 生物医学数据（R原生数据集或真实生物医学数据示例） 输出： R语言可视化图表代码与示例 关键参数/步骤： 访问在线仓库 → 按图表类型（变量分布、相关分析、排名图、交互图等）浏览代码示例 → 复制并适配到自身数据 → 利用内置统计模块输出严谨结果 常见错误： 未根据自身数据结构调整参数；忽略数据预处理步骤直接套用模板 与口腔生信连接： 口腔生信课题中的差异表达火山图、热图、箱线图、相关性散点图等均可参考Bizard代码库，尤其适合用R语言批量生成发表级图表 Bizard: A Biomedical Visualization Atlas # Welcome 🎉 # Data visualization is a critical tool in biomedical research, enabling intuitive interpretation of complex datasets to advance scientific discovery and inform clinical decisions. The R programming language, with its powerful statistical capabilities and extensive package ecosystem, has become a cornerstone for creating high-quality visualizations. However, the vast and ever-evolving landscape of R plotting packages often poses challenges for researchers, who must select appropriate methods and customize visualizations to meet specific research needs. This process demands advanced coding expertise, interdisciplinary collaboration, and significant time investment, which can hinder progress and impact the accuracy of experimental outcomes. To address these challenges, we developed Bizard , a comprehensive, community-driven platform that integrates a curated repository of visualization codes, advanced tutorials, and collaborative forums. By streamlining access to resources and promoting knowledge exchange, Bizard aims to enhance biomedical researchers' data analysis capabilities and facilitate the clinical translation of research findings. What is Bizard? # Bizard brings together powerful visualization tools, curated code, and collaborative features, enabling researchers to streamline data analysis and present their findings in a clear and impactful way. Comprehensive Visualization Repository : Bizard consolidates visualization codes from diverse sources, including conventional graphgallery charts and innovative contributions from global experts, providing a state-of-the-art toolkit for biomedical research. Versatile Chart Options : The repository features R code implementations for a wide range of visualizations—variable distributions, correlation analyses, ranking plots, and interactive charts—meeting diverse data analysis needs. Real-World Applications : Leveraging both native R datasets and authentic biomedical data examples, Bizard enables intuitive understanding and application of visualization techniques in real-world research contexts, accelerating clinical translation. Tailored for Biomedical Data : Includes preprocessing algorithms, annotated plotting codes, and specialized methodologies to accommodate the complexities of biomedical datasets, making advanced visualization accessible even to users with limited programming expertise. Integrated Statistical Analysis : Combines statistical analysis functions with visualization modules, ensuring rigorous, visually compelling outputs that bolster research reliability and advance evidence-based medicine. Collaborative and Open Innovation : Actively invites contributions from biomedical experts to refine features and addressing evolving data visualization challenges through collective expertise. Multi-Platform Accessibility : Offers resources through an open-source GitHub repository with interactive forums and a WeChat official account for tutorials and updates, fostering knowledge sharing and collaboration. Driving Research Excellence : Empowers researchers to elevate their data visualization skills, improve methodological standards, and advance precision medicine and personalized therapies. Future Vision : Committed to expanding international collaborations and delivering innovative, refined solutions to address the growing complexity of biomedical data visualization and analysis. Bizard AI Skills # Download the Bizard (A Biomedical Visualization Atlas) unified skill for your AI assistant: Download AI Skill zip . Citation # If you use Bizard in your research, please cite our paper: Li, K., Zheng, H., Huang, K., Chai, Y., Peng, Y., Wang, C.,... \u0026 Wang, S. (2026). Bizard: A Community‐Driven Platform for Accelerating and Enhancing Biomedical Data Visualization. iMetaMed, e70038. https://doi.org/10.1002/imm3.70038","tags":["clippings","Bizard","R语言","生物医学数据可视化","暂未试用"],"section":"bioinfo-tools","sectionTitle":"生信教程与工具","category":"网页教程","updated":"2026-10-25T17:37:28.584Z","url":"bioinfo-tools/notes/09d8b99d5e10a38717f0bf25.html"},{"kbId":"KB-000119","title":"知识库入库与发布流程","subtitle":"","summary":"从本地材料收件、精读、正式归库，到全文搜索、构建验收和加密发布的维护流程。","body":"提示 阅读版： 打开 HTML 阅读版 本地 Markdown 是内容源。HTML 和全文索引是可重建的展示层；Zotero 保留条目与引文管理职责。当前检索采用浏览器内全文匹配和相关性排序，云盘自动同步、语义向量检索尚未接入。 每篇笔记必须带有永久 kb_id ，格式为 KB-000001 ，并保存在 frontmatter。移动、改名、编辑和重新发布都保留原编号；不按标题或路径重算，也不回收旧编号。已用编号的最高序号保存在本地 05_logs/kb-id-sequence.json ，删除笔记后也不会发回旧号。 处理路线 # flowchart TB accTitle: 知识库收件 精读 归档 与 加密发布流程 accDescr: 原始材料先进入不发布的收件箱，经过来源核对和精读后归档并更新索引日志，最后验收与加密。只有确认上线后才执行发布。 source[\"原始 PDF 或剪藏\"] --\u003e inbox[\"收件副本与待精读草稿\"] inbox --\u003e review[\"核对来源与精读证据\"] review --\u003e id[\"分配或保留唯一编号\"] id --\u003e archive[\"归档笔记与附件\"] archive --\u003e index[\"更新主题索引与导入日志\"] index --\u003e check[\"检查内容结构与站内目标\"] check --\u003e secure[\"加密页面、搜索索引与附件\"] secure --\u003e preview[\"本机验收阅读效果\"] preview --\u003e publish[\"确认后推送发布\"] 收件 # 直接从外部链接入库 # 发送外部平台链接，或使用 $hz-link-to-wiki \u003cURL\u003e 。该 skill 通过 agent-reach 读取用户提供的页面，按内容选择知识库分类，写中文笔记与来源证据，分配 kb_id 、更新导入日志并生成 HTML。学术论文使用 hz-paper-analysis ；链接内容无法读取时，不生成推测性笔记。知识库写入不自动推送 GitHub，线上发布仍按发布流程执行。 在知识库根目录运行，先预览： npm run kb:intake -- --file \"D:\\材料\\paper.pdf\" --library 2 --title \"论文标题\" 确认计划符合预期后，用同一命令加 --apply 建立草稿。编号 1–4 分别是口腔生信、文献精读、生信教程、AI 与自动化。 收件副本与草稿放入该库 00_inbox/\u003c文件内容摘要\u003e/ ，保留 SHA-256 回执。收件时自动分配永久编号，并写入草稿和回执；重复接收同一文件会返回已有收件记录和编号。原文件保持原位。草稿标记 publish: false ，不进入网站及全文索引。 精读与正式归库 # 论文按 hz-paper-analysis 整理研究问题、数据与样本层级、ROADMAP、逐图分析、证据链、Data Access 和复现路线。只有二手解读时，明确标注来源状态；计算推断与实验验证分开记录。 教程补充用途、输入、操作、输出、版本、代码来源与实际验证范围。将原文证据和可复用方法分开保留，同源链接不意味着应删除其中一份。 精读复核后，将笔记与附件一起放入所属库 01_sources 或 02_wiki ，更新主题索引与 05_logs/ingest_log.md 。如果适合进入加密阅读版，将草稿状态改为完成，并设置 publish: true 。不要直接清除所有历史条目的私密标记。 手动新建笔记后运行 npm run kb:assign-ids -- --file \"笔记相对路径.md\" 预览，再加 --apply 分配编号。整理历史笔记时先用 npm run kb:assign-ids 预览批量编号，再运行 npm run kb:assign-ids -- --apply 。 检查与阅读 # npm run kb:check npm run kb:report 报告位于 04 AI_API与自动化库/05_logs/知识库工作流检查 。检查覆盖待归库、来源、摘要、标签、日期、日志回链、同源候选和编号的缺失、格式与重复；不自动修改笔记，也不代表科研结论已经核实。 报告同时检查全库编号是否缺失、格式错误或重复。发布构建会拒绝缺编号和重复编号的公开笔记。编号显示在站点笔记卡片、文章页和搜索结果中，输入 KB-000123 可直接搜索。 正文更新后，生成单篇阅读版： node tools/kb/render_note_html.mjs \"笔记的相对路径.md\" --force 全站预览： npm run site:preview npm run site:serve 本机打开 http://127.0.0.1:8765/ 。首页和文章工具栏可进入全库搜索，支持多个关键词同时匹配、正文片段、板块筛选、排序与网址还原； / 聚焦搜索， Esc 清空关键词。 加密与发布 # npm run site:build:local npm run site:verify npm run site:serve:secure 本机打开 http://127.0.0.1:8766/ ，使用已有共享密码。构建会先验收明文，再加密并验收，全部通过后才替换输出。构建报告保存在本地 05_logs ，不随阅读页面发布。 搜索索引只内嵌于加密的 search.html ，没有明文检索数据接口。个人事务、待确认归档、收件箱、模板、日志和私密笔记不进入网站。原始 Zotero 数据库不参与静态站点发布。 确认需要上线后，维护者运行 npm run site:sync 。这会提交并推送现有站点仓库；还需核对远端部署结果。当前共享密码提供统一解锁，不提供独立用户账号。 维护说明 # 工具与参数详见本地 tools/kb/README.md 。 npm run kb:test 验证搜索、重复收件、检查与加密边界。 缺失图片和未发布链接见本地 05_logs/site-build-report.json ；应核对原材料后逐条修复。 不要将 .preview-site 明文预览目录、检查报告或密码文件提交到公开仓库。 流程与实现于 2026-10-24 更新；每次对外发布仍以当次验收为准。","tags":["knowledge-base","obsidian","literature","workflow","automation"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"自动化与工作流","updated":"2026-10-25T17:59:31.852Z","url":"ai-automation/notes/d9db5157602118ddab66588c.html"},{"kbId":"KB-000118","title":"clip-to-wiki｜网页剪藏自动归库","subtitle":"","summary":"clip-to-wiki 是用于处理网页剪藏 Markdown 的 Claude Code skill。它的目标不是简单移动文件，而是把网页剪藏作为“证据层资料”读完后，自动判断应该进入哪个 LLM Wiki 主库，并完成基础归库更新。 从外部平台直接提供 URL 时，使用 $hz-link-to-wiki 获取正文并建立笔记；已经保存为 Clippings/ .md 的本地 Markdown 继续使用 /clip-to-wiki Clippings/xxx.md 。 Ski","body":"用途 # clip-to-wiki 是用于处理网页剪藏 Markdown 的 Claude Code skill。它的目标不是简单移动文件，而是把网页剪藏作为“证据层资料”读完后，自动判断应该进入哪个 LLM Wiki 主库，并完成基础归库更新。 从外部平台直接提供 URL 时，使用 $hz-link-to-wiki \u003cURL\u003e 获取正文并建立笔记；已经保存为 Clippings/*.md 的本地 Markdown 继续使用 /clip-to-wiki Clippings/xxx.md 。 Skill 文件位置： .claude/skills/clip-to-wiki/SKILL.md 调用方式 # 常用写法： /clip-to-wiki Clippings/xxx.md 整理这个网页剪藏 把这个 clip 自动归库 识别这个网页剪藏属于哪个知识库并更新 处理刚刚剪藏的 md 如果没有提供路径，skill 会优先检查： Clippings/*.md 中最新修改的 Markdown，排除 README_已迁移.md 。 各库 00_inbox/*.md 中最新修改的 Markdown。 若候选不止一个，会先询问确认，不自动批量处理。 分流规则 # 推荐归属 典型内容 默认位置 01 口腔生信研究库/index 牙周炎、OSCC、口腔微生物、口腔免疫、项目分析计划 00_inbox/ 或项目 sources 02 文献精读与汇报库/index DOI、PMID、Abstract、论文页面、PubMed/PMC、Nature/Cell/Science 00_inbox/ 或 01_sources/papers/web_clips/ 03 生信教程与工具库/index Seurat、Scanpy、GEO/TCGA/SRA、pipeline、conda、Linux、生信教程 01_sources/web_clips/ 04 AI_API与自动化库/index Claude Code、MCP、API、LLM、agent、skill、自动化脚本 01_sources/web_clips/ 05 个人事务与系统库/index 报销、行政、Windows、代理、个人任务、系统安装 02_wiki/事务/ 或 02_wiki/电脑与系统/ 99 待确认归档/index 来源不明、内容太短、主题混杂、敏感信息、无法判断 00_未判定文件/ 置信度规则 # confidence \u003e= 0.75 ：直接归入推荐库并更新日志。 0.45 \u003c= confidence \u003c 0.75 ：进入推荐库 00_inbox/ ，标注待复核。 \u003c 0.45 ：进入 99 待确认归档/index 。 命中 API key、token、cookie、password、证件号等敏感信息时，不做详细摘要扩散，优先待确认或脱敏后处理。 每次会做什么 # 读取原始剪藏全文。 解析 frontmatter、标题、链接、论文 ID、关键词和敏感信息。 输出“分类判断”：推荐归属、置信度、证据、目标路径、后续更新。 检查 kb_id ：保留来源笔记已有编号；若缺失，先用 npm run kb:assign-ids -- --file \"源文件相对路径.md\" --apply 分配永久编号，再移动并保留在目标笔记 frontmatter。绝不按标题或路径自行造号。 补充或创建 frontmatter： type: web_clip 、 kb_id 、 source_url 、 classified_to 、 classification_reason 、 classification_confidence 、 processed 、 processed_at 。 添加 5-10 行 LLM 归库摘要块。 移动到目标库证据层或 inbox。 更新目标库 05_logs/ingest_log.md ；日志记录同一 kb_id ；低置信度则更新 99 待确认归档/05_logs/clip_triage_log.md 。 安全边界 # 不处理 .obsidian/ 、 .claude/ 、配置文件或依赖目录中的文件。 不批量处理多个未知剪藏，除非明确要求。 不默认下载外部图片；需要“本地化图片”时才下载到同目录 attachments/ 。 不大规模改写旧链接。 论文类剪藏只做初步归库；深度文献整理继续使用 paper-import-workflow 。 后续可扩展 # 第一版是“手动调用、半自动执行”。如果以后需要每次网页剪藏后自动触发，可以再配置 hook 或外部文件监听脚本，例如 .claude/scripts/clip_to_wiki_scan.py ，由脚本负责扫描候选，最终分类与写入仍交给 Claude 执行。","tags":["claude-code","skill","web-clip","llm-wiki","automation"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"Skills","updated":"2026-10-25T17:59:31.850Z","url":"ai-automation/notes/f0c3a2f799f779874c25991b.html"},{"kbId":"KB-000137","title":"04 AI_API与自动化库","subtitle":"","summary":"定位：管理 Claude Code、MCP、API 中转、skills、连接同步、自动化工具、AI 编程助手和相关网页剪藏。 API 原目录：04 AI API与自动化库/02 wiki/API Claude Code：04 AI API与自动化库/02 wiki/claude code AI API与自动化库/02 wiki/claude code/终端中的 AI 编程工作流 MCP：04 AI API与自动化库/02 wiki/mcp API：04 AI API与自动化库","body":"定位：管理 Claude Code、MCP、API 中转、skills、连接同步、自动化工具、AI 编程助手和相关网页剪藏。 快速入口 # API 原目录： 04 AI_API与自动化库/02_wiki/API Claude Code： 04 AI_API与自动化库/02_wiki/claude_code 04 AI_API与自动化库/02_wiki/claude_code/终端中的 AI 编程工作流 MCP： 04 AI_API与自动化库/02_wiki/mcp API： 04 AI_API与自动化库/02_wiki/api Skills： 04 AI_API与自动化库/02_wiki/skills CLI-Anything： 04 AI_API与自动化库/02_wiki/CLI-Anything 网页剪藏： 04 AI_API与自动化库/01_sources/web_clips 自动化项目： 04 AI_API与自动化库/03_projects/automation_projects 日志： 04 AI_API与自动化库/05_logs/ingest_log 本轮迁移说明 # 原 API/ 已整体迁入 02_wiki/API/ ； Clippings/ 中明确属于 AI/工具的文件已迁入 01_sources/web_clips/ 。","tags":["ai","api","automation","claude-code","llm-wiki"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"其他资料","updated":"2026-10-25T17:41:01.068Z","url":"ai-automation/notes/b8d322cca13b7303167b216a.html"},{"kbId":"KB-000116","title":"CLI-Anything：让所有软件都能被 Agent 驱动","subtitle":"","summary":"项目： HKUDS/CLI-Anything （43.5k Stars, Apache 2.0） 📄 arXiv: 2606.03854 🌐 CLI-Hub: https://clianything.cc/ 今天的软件为人而生，明天的用户是 Agent。CLI-Anything 通过 自动生成结构化 CLI ，让任意软件（GIMP、Blender、LibreOffice 等）直接能被 AI Agent 调用——无需 GUI 自动化、无需专用 API、无需重构代码。 结构化","body":"项目： HKUDS/CLI-Anything （43.5k Stars, Apache 2.0） 📄 arXiv: 2606.03854 🌐 CLI-Hub: https://clianything.cc/ 核心理念 # 今天的软件为人而生，明天的用户是 Agent。CLI-Anything 通过 自动生成结构化 CLI ，让任意软件（GIMP、Blender、LibreOffice 等）直接能被 AI Agent 调用——无需 GUI 自动化、无需专用 API、无需重构代码。 为什么是 CLI？ # 结构化可组合 - 文本命令天然匹配 LLM 格式 轻量通用 - 零开销，跨平台 自描述 - --help 即可让 Agent 发现所有功能 Agent 原生 - JSON 输出消除解析复杂度 确定可靠 - 输出一致，行为可预测 CLI-Hub 包管理器 # pip install cli-anything-hub 后可使用： 命令 功能 cli-hub list 浏览注册表 cli-hub search \u003cquery\u003e 搜索 cli-hub info \u003cname\u003e 查看详情 cli-hub install \u003cname\u003e 安装 CLI cli-hub launch \u003cname\u003e 运行 CLI 开源社区已贡献 30+ 软件 CLI（GIMP、Blender、OBS、Zotero、Joplin、FreeCAD 等）。 支持的 AI 平台 # Claude Code - /plugin marketplace add HKUDS/CLI-Anything + /plugin install cli-anything OpenCode - 复制 opencode-commands/ 到命令目录 Codex - bash codex-skill/scripts/install.sh OpenClaw - 安装 SKILL.md GitHub Copilot CLI - copilot plugin install ./cli-anything-plugin Qodercli - 社区贡献插件 自动生成流程（7 阶段） # 🔍 分析 - 扫描源码，GUI 操作映射到 API 📐 设计 - 命令分组、状态模型、输出格式 🔨 实现 - Click CLI + REPL + JSON 输出 + 撤销/重做 📋 规划测试 - 生成 TEST.md 🧪 编写测试 - 完整测试套件 📝 文档 - 更新 TEST.md 📦 发布 - setup.py ，安装到 PATH 核心命令 # 命令 功能 /cli-anything \u003c路径\u003e 完整构建 /cli-anything:refine \u003c路径\u003e [方向] 优化扩展 /cli-anything:test \u003c路径\u003e 运行测试 /cli-anything:validate \u003c路径\u003e 标准验证 /cli-anything:list 列出已安装 CLI 架构特点 # 真实软件集成 - 直接调用 GEGL、bpy、sox、melt 等真实后端 双模式交互 - REPL（有状态）+ 子命令（脚本/流水线） 统一体验 - 共享 repl_skin.py 界面 JSON 输出 - Agent 原生设计 可嵌入 Skill - 每个 CLI 附带 SKILL.md 已知局限 # 依赖前沿模型（Claude Opus/Sonnet、GPT-5.4）才能可靠生成 需要可用的源代码（编译后二进制效果差） 通常需要多次 /refine 迭代才能达到生产级 与已有工具的关系 # 工具 定位差异 MCP 通过 JSON-RPC 提供服务端能力；CLI-Anything 通过 CLI 接口，更轻量、更通用 Claude Code 插件 CLI-Anything 本身可作为 Claude Code 插件市场安装 Skills 每个生成的 CLI 都自动生成 SKILL.md，可被 OpenClaw/Codex 等使用 相关链接 # GitHub: https://github.com/HKUDS/CLI-Anything CLI-Hub: https://clianything.cc/ arXiv: https://arxiv.org/abs/2606.03854","tags":["AI-agent","CLI","automation","open-source","LLM","agent-native"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"其他资料","updated":"2026-10-25T17:37:28.612Z","url":"ai-automation/notes/b765dbd313f03fecb5d6bbfb.html"},{"kbId":"KB-000117","title":"mcp-zenodo 配置（Codex）","subtitle":"","summary":"mcp-zenodo 是 Zenodo 的 MCP 服务器，用于让 LLM 直接搜索 Zenodo record、读取元数据、获取引用和列出/下载文件。项目主页为 Cloud Native Build： ，PyPI 包名 mcp-zenodo 。 在 ~/.codex/config.toml 追加： 检查： zenodo 状态应为 enabled 。 mcp-zenodo ：查询、元数据、引用、列文件、按需调用。 /hz-zenodo-download ：大规模文件落地，Py","body":"mcp-zenodo 是 Zenodo 的 MCP 服务器，用于让 LLM 直接搜索 Zenodo record、读取元数据、获取引用和列出/下载文件。项目主页为 Cloud Native Build： https://cnb.cool/xiaosicau/mcp-zenodo ，PyPI 包名 mcp-zenodo 。 安装 # uvx mcp-zenodo # 或 python -m pip install mcp-zenodo Codex 配置 # 在 ~/.codex/config.toml 追加： [mcp_servers.zenodo] type = \"stdio\" command = \"uvx\" args = [\"mcp-zenodo\"] startup_timeout_sec = 30 tool_timeout_sec = 120 检查： codex mcp list zenodo 状态应为 enabled 。 与 /hz-zenodo-download 的分工 # mcp-zenodo ：查询、元数据、引用、列文件、按需调用。 /hz-zenodo-download ：大规模文件落地，Python + aria2c 断点续传 + MD5 校验。 实测记录 # 2026-08-27： uvx mcp-zenodo 可启动 stdio 服务； codex mcp list 中 zenodo 为 enabled 。 官方文档： https://learn.chatgpt.com/docs/extend/mcp 。","tags":["MCP","Zenodo","Codex","uvx","自动化"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"MCP","updated":"2026-10-25T17:37:28.612Z","url":"ai-automation/notes/6892cd886ad127c1f944dbf5.html"},{"kbId":"KB-000115","title":"终端中的 AI 编程工作流","subtitle":"","summary":"这页用于沉淀「终端如何更适合 Claude Code / Codex / 远程开发 / 生信服务器分析」的长期经验。当前内容主要来自 Phantty 剪藏，后续需要结合实际试用继续补充。 AI 编程工具如果运行在终端里，终端就不只是命令输入器，而是 AI 获取工作现场上下文的入口。一个适合 AI 工作流的终端，应该重点减少以下摩擦： 本地与远程之间传文件的摩擦。 截图、图片、报错界面传给 AI 的摩擦。 Markdown 说明、日志、报告预览的摩擦。 Windows 本地、W","body":"这页用于沉淀「终端如何更适合 Claude Code / Codex / 远程开发 / 生信服务器分析」的长期经验。当前内容主要来自 Phantty 剪藏，后续需要结合实际试用继续补充。 核心判断 # AI 编程工具如果运行在终端里，终端就不只是命令输入器，而是 AI 获取工作现场上下文的入口。一个适合 AI 工作流的终端，应该重点减少以下摩擦： 本地与远程之间传文件的摩擦。 截图、图片、报错界面传给 AI 的摩擦。 Markdown 说明、日志、报告预览的摩擦。 Windows 本地、WSL、SSH 远程服务器之间环境割裂的摩擦。 AI 工具与真实项目文件、运行结果、脚本、数据之间的上下文断裂。 相关证据剪藏： 04 AI_API与自动化库/01_sources/web_clips/可能是我在windows里用过的最好的终端 典型场景 # 1. Claude Code / Codex 在远程服务器中运行 # 常见于生信分析或较重的计算任务： 代码和数据在 Linux 服务器上。 Claude Code / Codex 通过 SSH 进入项目目录。 结果文件可能是 .html 、 .png 、 .pdf 、 .md 、 .log 。 用户需要频繁把服务器结果下载到本地查看，或把本地截图/脚本/配置上传给远程 AI。 此时终端的关键能力不是“能不能 SSH”，而是： 看到远程路径后能否快速下载？ 截图能否直接进入远程 AI 上下文？ 本地文件能否直接拖入当前远程目录？ Markdown 结果能否不离开终端快速预览？ 2. Windows + WSL + Obsidian 的本地知识工作流 # 适合把 Claude Code、Obsidian vault 和本地脚本串起来： Windows 端维护 Obsidian vault。 WSL 端跑 Python、Node、Git、Claude Code 等命令行工具。 需要在终端中快速查看 Markdown 笔记、日志和生成报告。 有时需要把浏览器截图、错误弹窗、图表传给 AI。 一个好终端应当让 Windows 文件路径、WSL 路径、SSH 路径之间的转换尽量自然。 3. 生信分析结果复核 # 生信项目中常见需要让 AI 判断的对象： 富集分析气泡图、火山图、热图、UMAP、轨迹图。 report.html 、 multiqc_report.html 、R Markdown/Quarto 输出。 README.md 、 analysis.md 、 log.txt 、 stderr.log 。 Snakemake / Nextflow / conda / pip 报错截图。 如果终端支持图片粘贴、路径点击下载和 Markdown 预览，AI 复核链路会明显短一些。 工具对比：Windows Terminal / Xshell / MobaXterm / Phantty # 工具 更适合的场景 优点 对 AI 编程工作流的不足/待验证点 Windows Terminal 本地 PowerShell、CMD、WSL 日常使用 系统集成好，轻量，适合本地开发 远程文件传输、截图传给远程 AI、Markdown 预览等能力需要额外工具配合 Xshell 正式 SSH 会话管理、传统远程运维 会话管理成熟，适合多服务器连接 设计重点偏“连接和管理会话”，不是为 Codex/Claude Code 这种上下文密集型工作流设计 MobaXterm SSH + SFTP + X server + 远程文件管理一体化 功能很全，适合综合远程运维 较重；对“终端内 AI 获得截图/文件/Markdown 上下文”的体验仍需验证 Phantty Windows 下 AI 时代的远程开发终端 强调路径点击下载、拖拽上传、截图粘贴给 Codex/Claude Code、Markdown 快速预览 需要实际试用验证稳定性、安全性、SSH 兼容性、中文路径与大文件行为 Phantty 值得重点测试的功能 # 来自剪藏中的功能点： Ctrl + Shift + Click 下载远程文件 测试对象： report.html 、 .png 图、 .md 报告、 .log 文件。 生信价值：快速把服务器生成结果拉回本地查看。 拖动文件到终端上传到远程服务器 测试对象：脚本、配置文件、图片、CSV、小型测试数据。 生信价值：临时补脚本、传配置、上传截图给远程项目。 直接粘贴图片到 Codex / Claude Code 测试对象：网页报错截图、图表异常、UMAP/热图/火山图。 生信价值：减少“截图→保存→上传→复制路径→粘贴”的链路。 Ctrl + Click 预览 Markdown 文件 测试对象： README.md 、 analysis.md 、 result.md 、 CLAUDE.md 。 生信价值：快速查看项目说明、分析记录和 AI 生成报告。 WSL / SSH / 远程开发一致体验 测试重点：Windows 本地、WSL、远程 Linux 之间路径处理是否自然。 试用检查清单 # 后续实际试用 Phantty 时，可以按下面记录： 安装是否顺利？是否需要管理员权限？ 中文路径、空格路径是否正常？ SSH 登录是否稳定？密钥、跳板机、端口转发是否支持？ WSL 启动是否自然？默认目录能否配置？ 远程文件点击下载是否可控？下载目录在哪里？ 拖拽上传到远程目录是否可靠？大文件行为如何？ 图片粘贴给 Claude Code / Codex 后，AI 是否真的能读取？ Markdown 预览是否支持 Obsidian 风格链接、图片、代码块？ 与 Windows Terminal / Xshell / MobaXterm 相比，是否真正减少操作步骤？ 是否有潜在安全问题：误上传、误下载、剪贴板泄露、远程路径泄露？ 对当前工作流的可能价值 # 对 Claude Code # 更容易把截图、错误界面、图表传给终端内的 Claude Code。 更容易让 Claude Code 处理远程服务器中的项目文件和日志。 如果 Markdown 预览流畅，可减少来回打开编辑器的次数。 对 Codex # Codex 常在终端上下文中工作，图片和文件路径传递能力会影响调试效率。 对远程服务器项目，如果 Phantty 能简化上传下载，会适合长时间代码迭代。 对生信服务器分析 # 适合查看和下载分析结果：HTML 报告、图表、日志。 适合在远程环境中快速给 AI 提供上下文。 对 Nextflow/Snakemake/R/Python pipeline 调试可能有帮助。 待补充：实际试用记录 # 下面等实际安装使用后再补，不要只根据宣传材料下结论。 试用环境 # Windows 版本： 是否使用 WSL： 远程服务器系统： Claude Code / Codex 运行位置：本地 / WSL / SSH 远程 实测结论 # 稳定性： 文件传输体验： 图片传递体验： Markdown 预览体验： 与现有工具相比是否值得替换： 结论（当前暂定） # Phantty 的核心启发不是“又一个终端工具”，而是提出了一个判断标准： AI 时代的终端应该围绕上下文流动设计 。如果一个终端能让文件、图片、Markdown、日志、远程路径更自然地进入 Claude Code / Codex 的工作上下文，它就可能比传统 SSH 管理器更适合 AI 编程和远程生信分析。 当前仍需实际试用验证，尤其是安全性、稳定性、SSH 兼容性和远程图片传递是否真的顺手。","tags":["claude_code","codex","terminal","windows","ssh","workflow","暂未试用"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"Claude Code","updated":"2026-10-25T17:37:28.612Z","url":"ai-automation/notes/74cd557612c4f24e266b48fd.html"},{"kbId":"KB-000109","title":"openags/paper-search-mcp: MCP, CLI, Skills for searching and downloading academic papers from multiple sources like arXiv, PubMed, bioRxiv, etc.","subtitle":"","summary":"MCP, CLI, Skills for searching and downloading academic papers from multiple sources like arXiv, PubMed, bioRxiv, etc. - openags/paper-search-mcp","body":"论文检索 MCP # 这是一个基于模型上下文协议 (MCP) 的服务器，用于搜索和下载来自多个来源的学术论文。该项目遵循“免费优先”策略：优先使用开放和公共数据源，在可选 API 密钥能够提升稳定性或覆盖范围时予以支持，并保持特定数据源连接器的可扩展性，以满足高级用户的需求。 目录 # 概述 项目原则 特征 采购策略 科学中心公告 安装 克劳德代码（技能） 方法一——铁匠铺 方法二——uvx 方法三——紫外线 方法四——管道 方法五——npx 方法六——Docker 方法 7 — 从源代码克隆并运行 环境变量 贡献 演示 星际历史 执照 全部 概述 # paper-search-mcp 是一个基于 Python 的工具，用于从各种平台搜索和下载学术论文。它提供论文搜索、PDF 下载和文本提取等功能，非常适合研究人员和 AI 驱动的工作流程。它可以作为 MCP 服务器（适用于 Claude Desktop 和其他 MCP 客户端）使用，也可以作为带有命令行界面的 Claude Code 技能使用。 项目原则 # 免费优先 ：公共和开源是默认的发展路线图。付费或受限资源并非本项目的核心方向。 可选 API 密钥 ：仅当 API 密钥能够提升稳定性、限制速率或提高元数据质量时才予以支持。在条件允许的情况下，MCP 仍应尽可能在不使用 API 密钥的情况下正常运行。 LLM 友好型检索 ：搜索结果应标准化、去重，并尽可能完整，以适应下游 LLM 工作流程。 来源透明度 ：不同的来源各有优势。MCP 应该明确指出这些权衡取舍，而不是假装每个来源都支持全文检索。 特征 # 双层架构 ： 第 1 层（统一工具） ：高级 search_papers 用于多源并发搜索和去重， download_with_fallback 依赖于出版商开放获取链接，并提供顺序回退。 第 2 层（平台连接器） ：针对特定学术平台（arXiv、PubMed、bioRxiv、Semantic Scholar 等）的模块化连接器，配备有通过正则表达式文本分析或 API 字段进行智能 DOI 提取的功能。 多源支持 ：可从 arXiv、PubMed、bioRxiv、medRxiv、Google Scholar、IACR ePrint Archive、Semantic Scholar、Crossref、OpenAlex、PubMed Central (PMC)、CORE、Europe PMC、dblp、OpenAIRE、CiteSeerX、DOAJ、BASE、Zenodo、HAL、SSRN、Unpaywall（DOI 查找）以及可选的 Sci-Hub 工作流程中搜索和下载论文。 标准化输出 ：论文通过 Paper 类以一致的字典格式返回。 免费优先设计 ：开放和公共资源优先于任何可选的商业或受限集成。 可选的 API 密钥增强功能 ：像 Semantic Scholar 这样的资源可以通过用户提供的 API 密钥更好地工作，但并不旨在强制付费使用。 发现 + 检索工作流程 ：可以使用 Google Scholar 和 Crossref 进行发现和 DOI 回填，而开放存储库和出版商链接则用于在可用时进行合法的全文解析。 OA-First Fallback Chain : download_with_fallback 现在遵循源原生下载 → OpenAIRE/CORE/Europe PMC/PMC 发现 → Unpaywall DOI 解析 → 可选的 Sci-Hub。 MCP 集成 ：与 MCP 客户端兼容，用于 LLM 上下文增强。 可扩展设计 ：通过扩展 academic_platforms 模块，轻松添加新的学术平台。 采购策略 # 长远目标不是依赖单一搜索引擎，而是将多个免费公共资源结合起来，并明确它们各自的角色： 开放元数据骨干网 ：Crossref、OpenAlex、Semantic Scholar、dblp、CiteSeerX、SSRN、Unpaywall（以 DOI 为中心的 OA 元数据）。 学科特定来源 ：arXiv、PubMed、PubMed Central、Europe PMC、IACR。 开放获取全文来源 ：arXiv、PMC、CORE、OpenAIRE、DOAJ、BASE、Zenodo、HAL、出版商开放获取链接。 发现和 DOI 恢复 ：当其他公共元数据来源不完整时，Google Scholar 可用于查找标题、版本和 DOI 线索。 推荐的优先免费路线图： 保持现有公共资源的稳定。 添加 OpenAlex 作为广泛的免费元数据源。 添加 PubMed Central 和 Europe PMC，以增强生物医学全文访问能力。 添加 CORE 和 OpenAIRE，实现基于存储库的开放获取检索。 主要将 Google Scholar 用作发现资料的备用途径，而不是作为主要权威来源。 平台能力矩阵 # 此矩阵反映了本代码库中 经过验证的实时集成结果，这些结果 来自功能测试和端到端回归测试。各列显示了在正常条件下观察到的最高能力级别。 平台 搜索 下载 读 笔记 arXiv ✅ ✅ ✅ 开放 API；可靠 PubMed ✅ ❌ ⚠️ 仅供参考 开放 API；可靠 bioRxiv ✅ ✅ ✅ 开放 API；可靠 medRxiv ✅ ✅ ✅ 开放 API；可靠 谷歌学术 ⚠️ ❌ ❌ 启用机器人检测；设置 PAPER_SEARCH_MCP_GOOGLE_SCHOLAR_PROXY_URL IACR ✅ ✅ ✅ 开放 API；可靠 语义学者 ✅ ✅（OA） ✅（OA） 无需密钥即可工作（受速率限制）；密钥可提高限制；密钥被拒绝（403）后，无需密钥即可自动重试。 交叉引用 ✅ ❌ ⚠️ 仅供参考 开放 API；可靠 OpenAlex ✅ ❌ ⚠️ 仅供参考 开放 API；可靠 PMC ✅ ✅（仅限 OA） ✅（仅限 OA） 仅提供开放获取的 PDF 文件；某些代理环境可能会阻止直接下载。 CORE ✅ ✅（取决于记录） ✅（取决于记录） 建议使用无钥匙连接；连接器会尝试回退连接，并在 401/403 端口回退到无钥匙连接。 欧洲 PMC ✅ ✅（OA） ✅（OA） 仅提供开放获取的 PDF 文件；某些代理环境可能会阻止直接下载。 dblp ✅ ❌ ⚠️ 仅供参考 开放 API；可靠 OpenAIRE ✅ ❌ ❌ 开放 API；对瞬态 403 错误进行 3 次重试，并逐步升级请求配置文件 CiteSeerX ⚠️ ✅（取决于记录） ⚠️ API 端点间歇性不可用/重定向到 Web 存档 DOAJ ✅ ⚠️ （与 URL 相关） ⚠️ （与 URL 相关） PDF 文件的可用性因文章而异；免费密钥可提高下载速度限制 BASE ⚠️ ✅（取决于记录） ✅（取决于记录） OAI-PMH 端点需要机构 IP 地址注册；否则将返回空值。 泽诺布斯 ✅ ✅（取决于记录） ✅（取决于记录） 开放 API；可靠 HAL ✅ ✅（取决于记录） ✅（取决于记录） 开放 API；可靠 SSRN ⚠️ ⚠️ 尽力而为 ⚠️ 尽力而为 403 机器人检测已启用；仅公开 PDF 支付墙 ✅（DOI 查询） ❌ ❌ 需要 PAPER_SEARCH_MCP_UNPAYWALL_EMAIL 科学中心（可选） ⚠️ 仅备用 ✅ ❌ 可选；镜像不稳定；用户责任 IEEE Xplore 🔑 🚧 骨架 🚧 骨架 🚧 骨架 需要 PAPER_SEARCH_MCP_IEEE_API_KEY 才能激活 ACM DL 🔑 🚧 骨架 🚧 骨架 🚧 骨架 需要 PAPER_SEARCH_MCP_ACM_API_KEY 才能激活 ✅ = 实际测试可靠。 ⚠️ = 可用，但受上游不稳定或访问限制影响。❌ = 不支持。🔑 = 需要密钥。🚧 = 仅提供框架。 凭证和 API 密钥要求 # 除非另有说明，所有键均为 可选 。请在 .env 中配置（推荐），或将其作为 shell 导出项进行配置。 环境变量 提供者 必需的？ 如何获得 PAPER_SEARCH_MCP_UNPAYWALL_EMAIL 支付墙 是的 （没有它，Unpaywall 功能将无法使用） 任何有效的电子邮件地址；请在 unpaywall.org 注册。 PAPER_SEARCH_MCP_CORE_API_KEY CORE 受到推崇的 免费访问 core.ac.uk/services/api PAPER_SEARCH_MCP_SEMANTIC_SCHOLAR_API_KEY 语义学者 选修的 免费访问 semanticscholar.org — 改进速率限制 PAPER_SEARCH_MCP_GOOGLE_SCHOLAR_PROXY_URL 谷歌学术 选修的 您的 HTTP/HTTPS 代理 URL — 可绕过机器人检测 PAPER_SEARCH_MCP_DOAJ_API_KEY DOAJ 选修的 免费访问 doaj.org — 提高每小时费率上限 PAPER_SEARCH_MCP_ZENODO_ACCESS_TOKEN 泽诺布斯 选修的 免费，可在 zenodo.org 获取——私人记录需要此信息 PAPER_SEARCH_MCP_IEEE_API_KEY IEEE Xplore 激活所需 免费，可在 developer.ieee.org 获取 PAPER_SEARCH_MCP_ACM_API_KEY ACM DL 激活所需 请参阅 libraries.acm.org/digital-library/acm-open 所有变量均遵循 PAPER_SEARCH_MCP_\u003cNAME\u003e 前缀方案。为保持向后兼容性，仍支持不带前缀的旧名称（例如 CORE_API_KEY 、 UNPAYWALL_EMAIL ）。 已知的上游限制 # 部分搜索失败是由外部服务提供商不稳定造成的，并非本项目本身存在漏洞： 来源 症状 原因 变通方法 谷歌学术 返回 0 个结果/空 HTML 机器人检测（验证码） 将 PAPER_SEARCH_MCP_GOOGLE_SCHOLAR_PROXY_URL 设置为代理 语义学者 429 速率限制反应 匿名访问速率限制 设置 PAPER_SEARCH_MCP_SEMANTIC_SCHOLAR_API_KEY ；如果密钥被拒绝（403），连接器将自动重试，不使用密钥。 CORE 500 / 超时错误 未经认证的限速 设置 PAPER_SEARCH_MCP_CORE_API_KEY （免费）；连接器将使用指数退避算法重试，并在出现 401/403 错误时回退到无密钥模式。 OpenAIRE 瞬态 403 响应 基于 IP 的会话速率限制 连接器对每个配置文件重试 3 次，依次升级：普通会话 → XML Accept 标头 → 使用 Mozilla UA 的原始 requests.get CiteSeerX 通过网页存档重定向到 404 页面 PSU 端点间歇性重定向到存档 没有变通办法；连接器会优雅地返回空值。 BASE 搜索结果为 0 OAI-PMH 终点需要机构 IP 注册 请登录 base-search.net 注册以获取 API 访问权限；否则，连接器将优雅地返回空值。 SSRN HTTP 403 机器人检测（Cloudflare） 没有变通办法；连接器会尝试两个端点，并在失败时返回清晰的消息。 PMC / 欧洲 PMC PDF 下载代理错误 本地代理阻止了直接的 HTTPS PDF 下载 禁用代理或改用 download_with_fallback 支付墙 完全跳过 UNPAYWALL_EMAIL 环境变量未设置 在 .env 中设置 PAPER_SEARCH_MCP_UNPAYWALL_EMAIL 可选付费平台连接器（第三阶段） # IEEE Xplore 和 ACM 数字图书馆连接器以 可选框架的 形式提供。 默认情况下，它们处于禁用状态 ——除非您显式配置相应的密钥，否则不会进行任何 API 调用。 平台 环境是 地位 IEEE Xplore PAPER_SEARCH_MCP_IEEE_API_KEY 🚧 骨架 — 搜索已注册、下载/读取引发 NotImplementedError ACM 数字图书馆 PAPER_SEARCH_MCP_ACM_API_KEY 🚧 骨架 — 搜索已注册、下载/读取引发 NotImplementedError 如何启用： export PAPER_SEARCH_MCP_IEEE_API_KEY=\u003cyour_ieee_key\u003e # free key at https://developer.ieee.org/ export PAPER_SEARCH_MCP_ACM_API_KEY=\u003cyour_acm_key\u003e # see https://libraries.acm.org/digital-library 一旦设置了密钥，相应的源就会自动添加到 ALL_SOURCES 中，并且其 MCP 工具（ search_ieee / search_acm 、 download_ieee / download_acm 、 read_ieee_paper / read_acm_paper ）会在服务器启动时注册。 如果没有密钥，连接器只会记录启动警告——服务器的其余部分不受影响。 免费源代码扩展（第四阶段） # MCP 服务器现在集成了三个额外的开源连接器： zenodo ：官方 Zenodo REST API 连接器（搜索 + 记录相关的 PDF/读取支持）。 hal ：HAL 公共 API 连接器（搜索 + 记录相关的 PDF/读取支持）。 ssrn ：当有直接的公共 PDF 链接可用时，具有强化解析器和尽力下载/读取的发现优先连接器。 unpaywall ：以 DOI 为中心的 OA 元数据源，用于独立查找 ( search_unpaywall ) 和备用 URL 解析。 SSRN 集成始终以合规性为先：它仅尝试使用 SSRN 页面上公开的直接 PDF 链接。如果需要登录或受限访问，连接器会返回明确的错误信息，而不是绕过访问控制。 科学中心公告 # Sci-Hub 支持可以作为可选连接器继续供明确选择启用它的用户使用，但不应将其视为默认或推荐的全文路径。 可用性不稳定，镜像经常变化。 法律和政策风险因司法管辖区而异。 README 文件和工具说明应明确指出，用户有责任启用和使用该工具。 应尽可能优先尝试开放获取和出版商允许的资源。 安装 # 选择最适合您工作流程的方法。所有方法都支持相同的 可选 API 密钥 。 克劳德代码（技能）——推荐给克劳德代码用户 # 安装方式为 Claude Code 技能，而非 MCP 服务器。这样，当您提及查找论文、学术文献等时，Claude 即可自动访问论文搜索功能——无需进行 MCP 配置。 先决条件 ： uv 和 Claude Code 。 第一步——克隆仓库： git clone https://github.com/openags/paper-search-mcp.git ~/paper-search-mcp 步骤 2 — 安装技能： mkdir -p ~/.claude/skills/paper-search cp ~/paper-search-mcp/claude-code/SKILL.md ~/.claude/skills/paper-search/SKILL.md 步骤 3 — 更新技能中的存储库路径： 编辑 ~/.claude/skills/paper-search/SKILL.md 并将每个 \u003cREPO_PATH\u003e 替换为克隆的绝对路径（例如 /Users/yourname/paper-search-mcp ）。 步骤 4（可选）— 配置 API 密钥： 在仓库根目录下创建一个 .env 文件，用于存放可选的 API 密钥（请参阅 环境变量 ）。 就是这样。 下次启动克劳德代码时，只需让它查找文件——该技能会自动激活。例如： 请帮我查找关于 CRISPR 基因编辑的最新论文。 “在 arXiv 和语义学者中搜索 Transformer 注意力机制” “下载 arXiv 论文 2106.12345 的 PDF 文件” 该技能使用 CLI（ paper-search ），它封装了与 MCP 服务器相同的库，输出 JSON 用于搜索/下载，输出纯文本用于读取。 MCP 服务器配置文件位置 （适用于以下方法） macOS ： ~/Library/Application Support/Claude/claude_desktop_config.json Windows ： %APPDATA%\\Claude\\claude_desktop_config.json Linux ： ~/.config/Claude/claude_desktop_config.json 方法一 — Smithery（单命令，推荐用于 Claude Desktop） # npx -y @smithery/cli install @openags/paper-search-mcp --client claude Smithery 会自动为您写入正确的配置块，无需手动编辑 JSON。 方法二 uvx （无需安装，始终为最新版本） # uvx 直接从 PyPI 运行软件包，无需永久安装。需要 uv 。 # Install uv (skip if already installed) curl -LsSf https://astral.sh/uv/install.sh | sh ⚠️ macOS 注意 ： uvx 生成的包装脚本依赖于 realpath ，而 macOS 默认情况下并未包含该工具。如果您看到 realpath: command not found ”错误，请安装 GNU coreutils（ brew install coreutils ）或改用 方法 3（ uv run ） ——该方法没有此限制。 Claude 桌面配置： { \"mcpServers\": { \"paper-search-mcp\": { \"command\": \"uvx\", \"args\": [\"paper-search-mcp\"], \"env\": { \"PAPER_SEARCH_MCP_UNPAYWALL_EMAIL\": \"your@email.com\", \"PAPER_SEARCH_MCP_CORE_API_KEY\": \"\", \"PAPER_SEARCH_MCP_SEMANTIC_SCHOLAR_API_KEY\": \"\", \"PAPER_SEARCH_MCP_ZENODO_ACCESS_TOKEN\": \"\", \"PAPER_SEARCH_MCP_GOOGLE_SCHOLAR_PROXY_URL\": \"\", \"PAPER_SEARCH_MCP_IEEE_API_KEY\": \"\", \"PAPER_SEARCH_MCP_ACM_API_KEY\": \"\" } } } } 方法 3 — uv （持久安装） # uv tool install paper-search-mcp Claude 桌面配置： { \"mcpServers\": { \"paper-search-mcp\": { \"command\": \"uv\", \"args\": [\"tool\", \"run\", \"paper-search-mcp\"], \"env\": { \"PAPER_SEARCH_MCP_UNPAYWALL_EMAIL\": \"your@email.com\", \"PAPER_SEARCH_MCP_CORE_API_KEY\": \"\", \"PAPER_SEARCH_MCP_SEMANTIC_SCHOLAR_API_KEY\": \"\", \"PAPER_SEARCH_MCP_ZENODO_ACCESS_TOKEN\": \"\", \"PAPER_SEARCH_MCP_GOOGLE_SCHOLAR_PROXY_URL\": \"\", \"PAPER_SEARCH_MCP_IEEE_API_KEY\": \"\", \"PAPER_SEARCH_MCP_ACM_API_KEY\": \"\" } } } } 方法四 pip （标准 Python 安装） # pip install paper-search-mcp Claude 桌面配置： { \"mcpServers\": { \"paper-search-mcp\": { \"command\": \"python\", \"args\": [\"-m\", \"paper_search_mcp.server\"], \"env\": { \"PAPER_SEARCH_MCP_UNPAYWALL_EMAIL\": \"your@email.com\", \"PAPER_SEARCH_MCP_CORE_API_KEY\": \"\", \"PAPER_SEARCH_MCP_SEMANTIC_SCHOLAR_API_KEY\": \"\", \"PAPER_SEARCH_MCP_ZENODO_ACCESS_TOKEN\": \"\", \"PAPER_SEARCH_MCP_GOOGLE_SCHOLAR_PROXY_URL\": \"\", \"PAPER_SEARCH_MCP_IEEE_API_KEY\": \"\", \"PAPER_SEARCH_MCP_ACM_API_KEY\": \"\" } } } } If python is not on your PATH, replace it with the full path (e.g. /usr/bin/python3 or C:\\Python311\\python.exe ). Run which python3 / where python to find it. Method 5 — npx (via Smithery CLI, no local Python needed) # npx -y @smithery/cli run @openags/paper-search-mcp Claude Desktop config: { \"mcpServers\": { \"paper-search-mcp\": { \"command\": \"npx\", \"args\": [\"-y\", \"@smithery/cli\", \"run\", \"@openags/paper-search-mcp\"], \"env\": { \"PAPER_SEARCH_MCP_UNPAYWALL_EMAIL\": \"your@email.com\", \"PAPER_SEARCH_MCP_CORE_API_KEY\": \"\", \"PAPER_SEARCH_MCP_SEMANTIC_SCHOLAR_API_KEY\": \"\" } } } } Method 6 — Docker # docker build -t paper-search-mcp . docker run --rm -i \\ -e PAPER_SEARCH_MCP_UNPAYWALL_EMAIL=your@email.com \\ -e PAPER_SEARCH_MCP_CORE_API_KEY=your_core_key \\ paper-search-mcp Claude Desktop config: { \"mcpServers\": { \"paper-search-mcp\": { \"command\": \"docker\", \"args\": [\"run\", \"--rm\", \"-i\", \"paper-search-mcp\"], \"env\": { \"PAPER_SEARCH_MCP_UNPAYWALL_EMAIL\": \"your@email.com\", \"PAPER_SEARCH_MCP_CORE_API_KEY\": \"\", \"PAPER_SEARCH_MCP_SEMANTIC_SCHOLAR_API_KEY\": \"\", \"PAPER_SEARCH_MCP_ZENODO_ACCESS_TOKEN\": \"\", \"PAPER_SEARCH_MCP_GOOGLE_SCHOLAR_PROXY_URL\": \"\", \"PAPER_SEARCH_MCP_IEEE_API_KEY\": \"\", \"PAPER_SEARCH_MCP_ACM_API_KEY\": \"\" } } } } This is the most reliable method on macOS — no wrapper scripts, no realpath issues. # 1. Install uv (skip if already installed) curl -LsSf https://astral.sh/uv/install.sh | sh # 2. Clone repo git clone https://github.com/openags/paper-search-mcp.git cd paper-search-mcp # 3. Verify it runs (uv auto-resolves dependencies, no manual install needed) uv run -m paper_search_mcp.server Claude Desktop config (replace the directory path with your actual clone location): { \"mcpServers\": { \"paper-search-mcp\": { \"command\": \"uv\", \"args\": [ \"run\", \"--directory\", \"/path/to/paper-search-mcp\", \"-m\", \"paper_search_mcp.server\" ], \"env\": { \"PAPER_SEARCH_MCP_UNPAYWALL_EMAIL\": \"your@email.com\", \"PAPER_SEARCH_MCP_CORE_API_KEY\": \"\", \"PAPER_SEARCH_MCP_SEMANTIC_SCHOLAR_API_KEY\": \"\", \"PAPER_SEARCH_MCP_ZENODO_ACCESS_TOKEN\": \"\", \"PAPER_SEARCH_MCP_GOOGLE_SCHOLAR_PROXY_URL\": \"\", \"PAPER_SEARCH_MCP_IEEE_API_KEY\": \"\", \"PAPER_SEARCH_MCP_ACM_API_KEY\": \"\" } } } } For example, if you cloned to /Users/mac/Pengsong/paper-search-mcp : \"args\": [\"run\", \"--directory\", \"/Users/mac/Pengsong/paper-search-mcp\", \"-m\", \"paper_search_mcp.server\"] uv run automatically installs dependencies into an isolated environment on first run — no pip install or venv needed. For active development, optionally install an editable copy: uv venv \u0026\u0026 source .venv/bin/activate # Windows: .venv\\Scripts\\activate uv pip install -e \".[dev]\" Environment Variables (.env file) # Instead of putting keys directly in the JSON config you can store them in a .env file in the project root (auto-loaded on startup): cp .env.example .env # if running from source # or create ~/.paper-search-mcp.env for global use PAPER_SEARCH_MCP_UNPAYWALL_EMAIL=your@email.com PAPER_SEARCH_MCP_CORE_API_KEY= PAPER_SEARCH_MCP_SEMANTIC_SCHOLAR_API_KEY= PAPER_SEARCH_MCP_ZENODO_ACCESS_TOKEN= PAPER_SEARCH_MCP_GOOGLE_SCHOLAR_PROXY_URL= PAPER_SEARCH_MCP_IEEE_API_KEY= PAPER_SEARCH_MCP_ACM_API_KEY= To use a custom path: export PAPER_SEARCH_MCP_ENV_FILE=/absolute/path/to/.env Legacy variable names without the PAPER_SEARCH_MCP_ prefix (e.g. CORE_API_KEY , UNPAYWALL_EMAIL ) are still supported for backward compatibility. Contributing # We welcome contributions! Here's how to get started: Fork the Repository : Click \"Fork\" on GitHub. Clone and Set Up : git clone https://github.com/yourusername/paper-search-mcp.git cd paper-search-mcp uv venv \u0026\u0026 source .venv/bin/activate uv pip install -e \".[dev]\" Make Changes : Add new platforms in academic_platforms/ . Update tests in tests/ . Submit a Pull Request : Push changes and create a PR on GitHub. Demo # TODO # Planned Academic Platforms # [√] arXiv [√] PubMed [√] bioRxiv [√] medRxiv [√] Google Scholar [√] IACR ePrint Archive [√] Semantic Scholar [√] Crossref [√] PubMed Central (PMC) [√] CORE [√] Europe PMC [√] Sci-Hub warning and enablement docs Development Tasks # [√] Fix Async search bugs and ensure reliable fast MCP events [√] End-to-End full pipeline testing script (search, parse, download) [√] Establish two-layer federated architecture (Layer 1 tool: search_papers ) [√] Ensure pervasive DOI extraction across metadata fields \u0026 abstract fallbacks Citation graph \u0026 Paper relation context feature [√] Expand full-stack OpenAlex provider Priority Free and Open Sources # [√] PubMed Central (PMC) [√] CORE [√] OpenAlex [√] Europe PMC [√] OpenAIRE [√] dblp [√] CiteSeerX [√] DOAJ [√] BASE [√] Zenodo [√] HAL [√] SSRN (discovery + best-effort full-text) [√] Unpaywall (standalone DOI search source) Optional and Non-Core Integrations # ResearchGate JSTOR ScienceDirect Springer Link [√] IEEE Xplore (optional skeleton — activate with IEEE_API_KEY ) [√] ACM Digital Library (optional skeleton — activate with ACM_API_KEY ) Web of Science Scopus Star History # License # This project is licensed under the MIT License. See the LICENSE file for details. Happy researching with paper-search-mcp ! If you encounter issues, open a GitHub issue.","tags":["clippings"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"Skills","updated":"2026-10-25T17:37:28.609Z","url":"ai-automation/notes/5c23acb7b691451284c7a247.html"},{"kbId":"KB-000107","title":"JackKuo666/Google-Scholar-MCP-Server: A MCP Server for Google Scholar: 🔍 Enable AI assistants to search and access Google Scholar papers through a simple MCP interface.","subtitle":"","summary":"A MCP Server for Google Scholar: 🔍 Enable AI assistants to search and access Google Scholar papers through a simple MCP interface. - JackKuo666/Google-Scholar-MCP-Server","body":"Google Scholar MCP 服务器 # 🔍 通过简单的 MCP 界面，使 AI 助手能够搜索和访问 Google Scholar 论文。 Google Scholar MCP 服务器通过模型上下文协议 (MCP) 在 AI 助手和 Google Scholar 之间架起桥梁。它允许 AI 模型以编程方式搜索学术论文并访问其内容。 ✨ 核心功能 # 🔎 论文搜索：使用自定义搜索字符串或高级搜索参数查询 Google 学术论文 ✅ 🚀 高效检索：快速访问论文元数据 ✅ 👤 作者信息：获取作者详细信息 ✅ 📊 研究支持：促进学术研究和分析 ✅ 🚀 快速入门 # 手动安装 # 通过 Smithery 安装 # 通过 Smithery 自动为 Claude Desktop 安装 google-scholar Server： 克劳德 npx -y @smithery/cli@latest install @JackKuo666/google-scholar-mcp-server --client claude --config \"{}\" 光标 将以下内容粘贴到“设置”→“光标设置”→“MCP”→“添加新服务器”中： Mac/Linux npx -y @smithery/cli@latest run @JackKuo666/google-scholar-mcp-server --client cursor --config \"{}\" 风帆冲浪 npx -y @smithery/cli@latest install @JackKuo666/google-scholar-mcp-server --client windsurf --config \"{}\" C 线 # npx -y @smithery/cli@latest install @JackKuo666/google-scholar-mcp-server --client cline --config \"{}\" 克隆仓库： git clone https://github.com/JackKuo666/google-scholar-MCP-Server.git cd google-scholar-MCP-Server 安装所需的依赖项： pip install -r requirements.txt 用于开发： # Clone and set up development environment git clone https://github.com/JackKuo666/Google-Scholar-MCP-Server.git cd Google-Scholar-MCP-Server # Create and activate virtual environment python -m venv venv source venv/bin/activate # On Windows use \\`venv\\Scripts\\activate\\` # Install dependencies pip install -r requirements.txt 📊 Usage # Start the MCP server: python google_scholar_server.py Once the server is running, you can use the provided MCP tools in your AI assistant or application. Here are some examples of how to use the tools: Example 1: Search for papers using keywords # result = await mcp.use_tool(\"search_google_scholar_key_words\", { \"query\": \"artificial intelligence ethics\", \"num_results\": 5 }) print(result) Example 2: Perform an advanced search # result = await mcp.use_tool(\"search_google_scholar_advanced\", { \"query\": \"machine learning\", \"author\": \"Hinton\", \"year_range\": [2020, 2023], \"num_results\": 3 }) print(result) Example 3: Get author information # result = await mcp.use_tool(\"get_author_info\", { \"author_name\": \"Geoffrey Hinton\" }) print(result) These examples demonstrate how to use the three main tools provided by the Google Scholar MCP Server. Adjust the parameters as needed for your specific use case. Usage with Claude Desktop # Add this configuration to your claude_desktop_config.json : (Mac OS) { \"mcpServers\": { \"google-scholar\": { \"command\": \"python\", \"args\": [\"-m\", \"google_scholar_mcp_server\"] } } } (Windows version): { \"mcpServers\": { \"google-scholar\": { \"command\": \"C:\\\\Users\\\\YOUR\\\\PATH\\\\miniconda3\\\\envs\\\\mcp_server\\\\python.exe\", \"args\": [ \"D:\\\\code\\\\YOUR\\\\PATH\\\\Google-Scholar-MCP-Server\\\\google_scholar_server.py\" ], \"env\": {}, \"disabled\": false, \"autoApprove\": [] } } } Using with Cline { \"mcpServers\": { \"google-scholar\": { \"command\": \"bash\", \"args\": [ \"-c\", \"source /home/YOUR/PATH/.venv/bin/activate \u0026\u0026 python /home/YOUR/PATH/google_scholar_mcp_server.py\" ], \"env\": {}, \"disabled\": false, \"autoApprove\": [] } } } 🛠 MCP Tools # The Google Scholar MCP Server provides the following tools: search_google_scholar_key_words # Search for articles on Google Scholar using key words. Parameters: query (str): Search query string num_results (int, optional): Number of results to return (default: 5) Returns: List of dictionaries containing article information search_google_scholar_advanced # Perform an advanced search for articles on Google Scholar. Parameters: query (str): General search query author (str, optional): Author name year_range (tuple, optional): Tuple containing (start_year, end_year) num_results (int, optional): Number of results to return (default: 5) Returns: List of dictionaries containing article information get_author_info # Get detailed information about an author from Google Scholar. Parameters: author_name (str): Name of the author to search for Returns: Dictionary containing author information 📁 Project Structure # google_scholar_server.py : The main MCP server implementation using FastMCP google_scholar_web_search.py : Contains the web scraping logic for searching Google Scholar 🔧 Dependencies # Python 3.10+ mcp[cli]\u003e=1.4.1 scholarly\u003e=1.7.0 asyncio\u003e=3.4.3 You can install the required dependencies using: pip install -r requirements.txt 🤝 Contributing # Contributions are welcome! Please feel free to submit a Pull Request. 📄 License # This project is licensed under the MIT License. ⚠️ Disclaimer # This tool is for research purposes only. Please respect Google Scholar's terms of service and use this tool responsibly.","tags":["clippings"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"MCP","updated":"2026-10-25T17:37:28.608Z","url":"ai-automation/notes/30c441c0aaf6bf110d018df2.html"},{"kbId":"KB-000108","title":"Semantic Scholar Academic Graph API","subtitle":"","summary":"Quick guide to get started with Semantic Scholar Academic Graph API.","body":"Semantic Scholar API - 教程 # 开始使用 Semantic Scholar API 学习如何搜索论文和作者、下载数据集等等。 介绍 # Semantic Scholar REST API 使用标准的 HTTP 动词、响应代码和身份验证。本教程将教您如何通过发送请求和分析响应来与 API 进行交互。所有代码示例均使用 Python 编写。如果您更喜欢无需编写代码的体验，可以使用 Semantic Scholar Postman Collection ，它允许您在 Postman（一个流行的免费 API 测试平台）上测试 API。 什么是应用程序编程接口（API）？ # API 是一种用于应用程序之间相互通信的结构化方式。应用程序可以相互发送 API 请求，例如检索数据。 每个 API 请求包含： API 端点，即请求发送到的 URL。该 URL 由 API 的基本 URL 和特定端点的资源路径组成（参见图 1）。 请求方法，例如 GET 或 POST。它会在 HTTP 请求中发送，并告诉 API 要执行哪种类型的操作。 图 1. Semantic Scholar 论文相关性搜索端点 的端点。 每个 API 请求可能还包含： 查询参数，附加在 URL 的末尾，位于资源路径之后。 请求头，其中可能包含有关正在使用的 API 密钥的信息。 请求正文，其中包含要发送到 API 的数据。 请求发送后，API 将返回响应。响应包含一个状态码，指示请求是否成功以及任何请求的数据。响应也可能包含请求的数据。 常见的状态码有： 200，OK 。请求成功。 400，错误请求 。服务器无法理解您的请求。请检查您的参数。 401，未授权 。您未通过身份验证或您的凭据无效。 403，禁止访问。 服务器已理解请求，但拒绝了该请求。您没有访问所请求资源的权限。 404，未找到。 请求的资源或端点不存在。 错误代码 429，请求过多。 您已达到速率限制，请降低请求速度。 500，内部服务器错误。 服务器端出现故障。 Semantic Scholar API # Semantic Scholar 包含三个 API，每个 API 都有其唯一的基本 URL： Academic Graph API 返回论文、论文作者、论文引用和参考文献的详细信息。基本 URL： https://api.semanticscholar.org/graph/v1 Recommendations API 会根据您提供的其他论文推荐论文。基本 URL： https://api.semanticscholar.org/recommendations/v1 数据集 API 允许您将 Semantic Scholar 的数据集下载到本地计算机，以便您可以自行托管数据并执行自定义查询。基本 URL： https://api.semanticscholar.org/datasets/v1 请参阅 Semantic Scholar API 文档， 了解有关每个 API 及其端点的更多信息。该文档描述了如何正确格式化每个端点的请求以及如何解析响应。 如何更快更高效地发出请求 # 频繁使用 API 可能会导致所有用户的速度变慢。以下是一些避免达到速率限制和请求速度变慢的技巧： 使用 API 密钥。 没有 API 密钥的用户会受到所有其他未认证用户流量的影响，因为这些用户共享同一个 API 密钥。但使用独立的 API 密钥会自动为用户在所有端点上提供每秒 1 次的请求速率。在某些情况下，审核后用户可能会获得略高的速率。点击 此处 了解更多关于 API 密钥以及如何申请的信息。 使用批量端点。 某些端点有对应的批量或批量查询端点，可以在单个响应中返回更多结果。例如 ，论文相关性搜索 （批量版本： 论文批量搜索 ）和 论文详情端点 （批量版本： 论文批量查询端点 ）。请求大量数据时，请尽可能使用批量或批量查询版本。 限制“fields”参数的数量。API 中的大多数端点都包含“fields”查询参数，允许用户指定要在响应中返回哪些数据。避免包含过多的字段，因为这会降低响应速度。 下载 Semantic Scholar 数据集。 当您需要的请求速率高于 API 密钥提供的速率时，您可以下载 Semantic Scholar 的数据集并在本地运行查询。 数据集 API 提供了便于下载和维护 Semantic Scholar 数据集的端点。更多详情，请参阅教程“其他资源”下的“ 如何下载完整数据 集”部分。 示例：请求论文详情（使用 Python） # 现在我们将运行 Python 代码，向 论文详情端点 发送请求。请先完成下方“前提条件”部分列出的步骤。如果您更喜欢在 Postman 中操作，可以点击 此处 查看 Postman 中的相同请求。有关使用 Python 发送 API 请求的更多示例，请参阅 “调用 Semantic Scholar API” 部分。 先决条件： 如果您的计算机上尚未安装 Python，请安装它。 如果您的计算机上还没有安装 pip（Python 的包管理器），请安装它。 根据 Academic Graph API 文档，论文详情端点是一个 GET 方法，其资源路径为 /paper/{paper_id} 。 图 2. 每个端点的资源路径都列在 API 文档中。 与 Academic Graph 基本 URL 结合使用时，该端点的 URL 为： https://api.semanticscholar.org/graph/v1/paper/{paper\\_id} 资源路径中的花括号表示 paper_id 是一个路径参数，它会在发送请求时被替换为一个值。文档的“路径参数”部分详细说明了 paper_id 值可接受的格式。 Figure 3. Accepted formats are listed in the Path Parameters section. The Query Parameters section of the documentation only lists a single optional parameter: fields . The fields parameter takes a string of comma-separated field names, which tell the API what information to return in the response. Figure 4. Fields that can be returned in the response are listed in the Response Schema section of Responses. For our Python request, we'll query the same paper ID given in the documentation’s example. We'll request the paper’s title , the year of publication, the abstract , and the citationCount fields: import requests paperId = \"649def34f8be52c8b66281af98ae884c09aef38b\" # Define the API endpoint URL url = f\"http://api.semanticscholar.org/graph/v1/paper/{paperId}\" # Define the query parameters query_params = {\"fields\": \"title,year,abstract,citationCount\"} # Directly define the API key (Reminder: Securely handle API keys in production environments) api_key = \"your api key goes here\" # Replace with the actual API key # Define headers with API key headers = {\"x-api-key\": api_key} # Send the API request response = requests.get(url, params=query_params, headers=headers) # Check response status if response.status_code == 200: response_data = response.json() # Process and print the response data as needed print(response_data) else: print(f\"Request failed with status code {response.status_code}: {response.text}\") Note that this request is using an API key. The use of API keys is optional but recommended. Learn more about API keys and how to get one here . We are using the Python Requests library to send the request. So we know the response has a property named status_code that returns the response status. We check the status_code and either print the successfully returned data or the error message. See the API documentation for how the response is formatted. Each Status Code section expands with further details about the response data that is returned. Figure 5. The Responses section describes how responses are formatted. When the request is successful, the JSON object returned in the response is: { \"paperId\": \"649def34f8be52c8b66281af98ae884c09aef38b\", \"title\": \"Construction of the Literature Graph in Semantic Scholar\", \"abstract\": \"We describe a deployed scalable system for organizing published ...\", \"year\": 2018, \"citationCount\": 365 } See
