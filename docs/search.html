"Single-cell transcriptomics and spatial validation reveal dysfunction of keratinocytes and NK cells driving acne development","subtitle":"","summary":"本文献笔记由 Codex 根据 Zotero 条目、期刊页面和公共数据库核验结果整理。2026-05-11 已通过 Zotero local API 核验条目；PDF 原文来自重复条目 YYVJEWVU 的附件 3U8HNECV ，已同步到本文件夹：Wang 2026 SciRep 角质形成细胞-NK细胞-痤疮.pdf。 这篇文章提出痤疮进展中的 “免疫-屏障双重失衡” 模型：轻度阶段角质形成细胞偏向抗菌和屏障防御，重度阶段出现异常分化和病理性角化；NK 细胞早期参与炎症放大","body":"本文献笔记由 Codex 根据 Zotero 条目、期刊页面和公共数据库核验结果整理。2026-05-11 已通过 Zotero local API 核验条目；PDF 原文来自重复条目 YYVJEWVU 的附件 3U8HNECV ，已同步到本文件夹： Wang_2026_SciRep_角质形成细胞-NK细胞-痤疮.pdf 。 一句话结论 # 这篇文章提出痤疮进展中的 “免疫-屏障双重失衡” 模型：轻度阶段角质形成细胞偏向抗菌和屏障防御，重度阶段出现异常分化和病理性角化；NK 细胞早期参与炎症放大，后期呈耗竭和凋亡趋势。 研究背景与科学问题 # 痤疮是高发慢性炎症性皮肤病，但其细胞生态位如何从轻度炎症发展到重度皮损仍不清楚。传统机制多强调皮脂、毛囊角化、 Cutibacterium acnes 和炎症因子，但缺少对不同严重程度下细胞状态迁移的系统解析。 本文要回答的问题是： 健康皮肤、轻度痤疮、重度痤疮之间的细胞组成和状态有什么变化？ 角质形成细胞在轻度和重度阶段是否承担不同功能？ NK 细胞在痤疮进展中是持续激活，还是经历功能衰竭和凋亡？ 单细胞发现能否通过空间免疫荧光得到组织层面的验证？ 样本与实验设计 # 数据来源 # 作者自建 raw sequence data 存入 GSA-Human HRA008189 。 HRA008189 关联 BioProject PRJCA028559 。 文章使用 scRNA-seq 分析健康皮肤、轻度痤疮和重度痤疮组织，并用空间免疫荧光进行验证。 技术路线 # 健康皮肤 / 轻度痤疮 / 重度痤疮样本 ↓ scRNA-seq 细胞图谱构建 ↓ 角质形成细胞状态分析 ↓ NK 细胞功能状态与凋亡/耗竭分析 ↓ 功能富集、伪时序和通路分析 ↓ 空间免疫荧光验证 ↓ 提出“免疫-屏障双重失衡”模型 数据集与可重复性核验 # 核验日期：2026-05-12。文章数据可用性语句倾向写作“publicly accessible”，但当前 NGDC/GSA-Human 官方页面标注为 Controlled access 。因此本文数据应归类为“公共元数据可查，但原始数据需申请”，不能写成直接公开可下载。 Accession / 资源 仓库 数据类型 样本与分组信息 当前访问状态 下载/申请入口 复用备注 HRA008189 NGDC GSA-Human 人痤疮组织 scRNA-seq raw sequence data 页面标题为“Research on the Microenvironment of Acne Tissue Based on Single-Cell Transcriptomics”。描述为 6 份皮肤组织样本，4-5 mm punch 取样，用于比较轻度与重度痤疮微环境差异。 受控访问 。页面显示 Data Accessibility: Controlled access ，Release date 为 2025-12-21，并提供 Request Data 按钮。 HRA008189 页面 ； HRA008189 申请入口 。 需要通过 GSA-Human 申请后才能获取实际数据文件。可用于追踪数据状态，但当前不能作为无需申请的公开下载数据集。 HRA008189 run/file metadata NGDC GSA-Human AJAX run table FASTQ 文件级元数据 接口返回 68 条文件记录、34 个 unique runs、6 个 samples、6 个 BioSamples、6 个 experiments；平台为 Illumina NovaSeq X Plus。样本 accession 为 HRS1331418 、 HRS1331419 、 HRS1331420 、 HRS1331421 、 HRS1331422 、 HRS1331423 。示例文件包括 HRR1867960_f1.fastq.gz 、 HRR1867960_r2.fastq.gz 、 HRR1867961_f1.fastq.gz 、 HRR1867961_r2.fastq.gz 、 HRR1867962_f1.fastq.gz 、 HRR1867962_r2.fastq.gz 。 元数据可见，文件受控访问 。接口列出文件名和大小，但下载仍受 Controlled access 限制。 Run table AJAX endpoint 页面字段列出的文件大小合计约 552.73，按 NGDC 字段原样记录；受控访问下不能据此直接下载 FASTQ。 PRJCA028559 NGDC BioProject HRA008189 关联 BioProject；Medical field，single-cell sequencing / single cell 项目描述明确为 6 份背部皮肤样本：2 份 healthy skin；2 份 mild acne lesions（\u003c24h，papules）；2 份 severe acne lesions（\u003e72h，pustules、nodules、cysts）。 项目元数据公开；数据访问跟随 HRA008189 受控访问 。 NGDC BioProject PRJCA028559 用于确认样本设计和研究背景。真正的 FASTQ/原始数据入口仍是 HRA008189 ，并需申请访问。 Data Access Committee NGDC GSA-Human DAC 受控访问审批信息 DAC NO. HDAC004477 ；DAC name: Jiang's Lab；contact person: Jiang Rihua；email: jiangrh@jlu.edu.cn ；submitter: Jiang Rihua / jiangrh@jlu.edu.cn ；organization: Jilin University；submission date: 2024-08-03。 申请制 。GSA-Human 页面说明受控数据权限由对应 DAC 决定，实际数据文件访问不由 NGDC 直接管理。 HRA008189 申请入口 ； HRA008189 页面 。 若后续要做再分析，需要准备研究用途说明并向 DAC 申请；记录邮箱便于人工联系。 可用链接与访问结论 # HRA008189 GSA-Human landing page: https://ngdc.cncb.ac.cn/gsa-human/browse/HRA008189 HRA008189 request data page: https://ngdc.cncb.ac.cn/gsa-human/request/HRA008189 HRA008189 run/file metadata endpoint: https://ngdc.cncb.ac.cn/gsa-human/ajaxb/runinstudy?accession=HRA008189\u0026pageSize=100\u0026pageNo=1 PRJCA028559 BioProject page: https://ngdc.cncb.ac.cn/bioproject/browse/PRJCA028559 结论：这篇文章的数据“能查到 accession 和文件级元数据”，但 目前不能直接下载 。在公共数据集汇总表里应标为 controlled access / 需申请 ，而不是 public downloadable 。 主要结果精读 # Result 1 | 角质形成细胞在轻度与重度阶段出现功能转换 # 文章认为轻度痤疮中的角质形成细胞更偏向抗菌肽分泌和屏障防御，这可能代表皮肤对微生物刺激和局部炎症的保护性反应。 进入重度痤疮后，角质形成细胞状态转向异常分化和病理性角化。这个变化与临床上毛囊角化异常、粉刺形成和炎症持续化相吻合。 Result 2 | NK 细胞从炎症放大转向耗竭/凋亡 # 作者将 NK 细胞作为免疫侧的重要驱动因素。早期 NK 细胞可能通过细胞毒性、炎症因子和趋化信号放大局部免疫反应；但在疾病进展中，NK 细胞出现耗竭和凋亡特征。 这个结果提示痤疮免疫反应不是简单“越重越激活”，而可能经历从激活到功能失衡的动态过程。 Result 3 | 通路富集支持 TNF、趋化因子、NK 细胞毒性和 Wnt/p53 轴参与进展 # 功能富集和伪时序分析显示，疾病严重程度与 TNF 信号、趋化因子信号、NK cell-mediated cytotoxicity 以及 Wnt/p53-apoptosis 相关。 从机制上看，这些通路把炎症放大、免疫细胞募集、细胞毒性和上皮细胞异常分化连接在一起，是“免疫-屏障双重失衡”模型的分子基础。 Result 4 | 空间免疫荧光为单细胞结论提供组织层面验证 # 文章用空间免疫荧光验证单细胞发现，强调细胞状态不仅存在于聚类和差异表达结果中，也能在组织空间中被观察到。 这对于痤疮研究很重要，因为痤疮发生在毛囊皮脂腺单位和周围免疫微环境中，空间位置会影响对机制的解释。 Claim # 痤疮进展由角质形成细胞屏障/分化异常和 NK 细胞免疫功能失衡共同驱动，可概括为“免疫-屏障双重失衡”。 Method # scRNA-seq 细胞类型注释与亚群分析 角质形成细胞状态分析 NK 细胞功能和凋亡/耗竭分析 功能富集分析 伪时序分析 空间免疫荧光验证 ImageJ / QuPath 图像量化 Evidence # 单细胞图谱显示不同严重程度痤疮中的细胞组成和状态差异。 角质形成细胞在轻度阶段偏抗菌/屏障防御，重度阶段偏异常分化和病理性角化。 NK 细胞相关通路和状态随疾病进展发生改变。 空间免疫荧光验证关键细胞和通路变化。 Limitation # HRA008189 当前是 controlled access，不能直接下载复现。 文章摘要和数据可用性声明中的“publicly accessible”与数据库页面当前状态不完全一致，需要在引用数据时明确说明“受控访问”。 样本量、分组细节和原始矩阵需要在获得数据后进一步核验。 NK 细胞耗竭/凋亡机制需要功能实验进一步验证，单细胞状态推断不能完全替代干预实验。 Direct relevance to repo # 这篇适合放入“痤疮单细胞机制”和“皮肤免疫-屏障互作”主题： 作为痤疮进展模型参考，尤其适合连接角质形成细胞异常分化、TNF/趋化因子通路和 NK 细胞免疫状态。 数据本身目前需要申请，不能马上作为公开数据再分析入口。 如果后续能申请到 HRA008189 ，它可以与 GSE175817 联合比较轻度/重度/皮损/非皮损状态。 Relation to other papers # 与 Chen_2025_TIM3-重度痤疮 互补：Chen 2025 关注 TIM3 介导的髓系细胞和角质形成细胞免疫调节；本篇关注角质形成细胞屏障状态与 NK 细胞功能失衡。 两篇共同支持痤疮进展的多细胞模型：角质形成细胞不只是被动屏障，免疫细胞也不是单纯炎症背景，而是共同塑造病理状态。 下一步 # 申请 HRA008189 数据，确认是否包含表达矩阵、FASTQ 和完整样本分组。 若获得数据，将其与 GSE175817 做批次整合，重点比较 keratinocyte differentiation、NK cytotoxicity、TNF/chemokine signaling。 在 Obsidian 中与 TIM3 文章建立痤疮单细胞主题索引，后续可整理成“痤疮公开/受控单细胞数据集表”。","tags":["痤疮","单细胞转录组","空间验证","角质形成细胞","NK细胞","免疫屏障失衡","ScientificReports"],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.570Z","url":"literature/notes/18276c7b3db06390c3d53980.html"},{"kbId":"KB-000032","title":"代谢支持保护放射性黏膜炎中的黏膜免受铁死亡","subtitle":"","summary":"Metabolic support protects mucosa from ferroptosis in radiation-induced mucositis 代谢支持可保护黏膜免受放射性黏膜炎中的铁死亡 Metabolic support protects mucosa from ferroptosis in radiation-induced mucositis 字段 内容 期刊 Nature Communications 发表时间 2025-12-08 IF（5年I","body":"代谢支持可保护黏膜免受放射性黏膜炎中的铁死亡 # Metabolic support protects mucosa from ferroptosis in radiation-induced mucositis 一、标题与摘要 # 中文标题 # 代谢支持可保护黏膜免受放射性黏膜炎中的铁死亡 英文标题 # Metabolic support protects mucosa from ferroptosis in radiation-induced mucositis 元数据 # 字段 内容 期刊 Nature Communications 发表时间 2025-12-08 IF（5年IF） 15.7（17.2） JCR / 中科院分区 JCR Q1 / 综合性期刊 1区 第一作者 Weiwei Yu 通讯作者 Lina Niu DOI 10.1038/s41467-025-67214-5 Zotero ItemID 1751 核心关键词 铁死亡 | 成纤维细胞 | 多胺 | SAT1-ACSL4 | scRNA-seq | RIOM 中文摘要 # 电离辐射虽然是有效的癌症治疗手段，但会对黏膜造成严重损伤，从而增加患者不适、延迟治疗并提高死亡率。黏膜损伤的潜在机制目前仍知之甚少，且现有治疗大多仅为姑息性治疗。本研究首次证实， 铁死亡（ferroptosis） 是辐射导致口腔黏膜上皮细胞耗竭的主要细胞死亡形式。值得注意的是，在辐射暴露后的早期阶段还存在一个 代偿期 ，在此期间成纤维细胞提供关键的代谢支持。具体而言，成纤维细胞供给 多胺（polyamines） ，这些多胺可被基底上皮细胞直接吸收，从而保护其免于铁死亡。补充多胺被发现能有效预防黏膜损伤。这些发现凸显了成纤维细胞介导的代谢支持在保护口腔黏膜免受辐射损伤中的关键作用，并为增强机体对辐射相关疾病的内在保护机制提供了新的思路。 二、研究背景与科学问题 # 2.1 疾病背景 # RIOM（放射性口腔黏膜炎） ：头颈部肿瘤放疗最常见并发症，表现为黏膜萎缩或溃疡，伴随严重疼痛和屏障功能受损 临床困境 ：现有治疗以姑息性为主（镇痛、抗炎），缺乏针对核心病理机制的靶向干预 临床意义 ：黏膜损伤导致治疗中断，影响放疗疗效，增加感染和死亡风险 2.2 机制背景 # 已知电离辐射直接导致 DNA 双链断裂和 ROS 积累，引发细胞损伤 既往研究聚焦于凋亡通路，但抗凋亡药物在 RIOM 临床试验中效果有限 → 提示其他细胞死亡形式参与 铁死亡（Ferroptosis） ：一种铁依赖的脂质过氧化驱动的细胞死亡形式，以往未被系统研究于 RIOM 2.3 三个核心科学问题 # 编号 科学问题 Q1 电离辐射通过何种细胞死亡机制导致口腔黏膜上皮细胞耗竭？ Q2 辐射后是否存在内在保护机制？其细胞和分子基础是什么？ Q3 如何通过增强内源性保护或外源补充来预防 RIOM？ 三、整体研究思路 # 【临床问题】RIOM 缺乏靶向治疗 ↓ 【单细胞图谱】scRNA-seq 揭示辐射后细胞组成变化（9种细胞类型 / 28,189 cells） ↓ 【核心发现1】铁死亡是上皮细胞主要死亡形式 → Q1 ↓ +【早期代偿现象】辐射后早期黏膜反而增厚 【细胞通讯】CellChat 分析发现成纤维细胞-上皮细胞代谢互作 ↓ 【核心发现2】成纤维细胞分泌多胺保护基底细胞 → Q2 ↓ 【分子机制】HIF-1α→ODC1↑ → 多胺↑ → JunD↓ → SAT1↓ → ACSL4↓ → 抑制铁死亡 ↓ 【治疗转化】补充生理浓度多胺预防/治疗 RIOM（口腔、结肠、肝脏、肺）→ Q3 四、主要结果（逐图总结） # Result 1 | Figure 1 — 辐射导致上皮内环境稳态失衡 # 项目 内容 Fig Fig. 1 标题 Radiation-induced epithelial thinning and basal cell depletion in human and mouse oral mucosa 目的 揭示辐射对口腔黏膜上皮内环境稳态的影响，建立 RIOM 小鼠模型和单细胞参考图谱 主要证据 • 人舌 RIOM 活检：上皮显著变薄、连续性中断，基底细胞增殖减少 • 小鼠 18 Gy 照射：照后第9天出现黏膜损伤，与人类高度相似 • scRNA-seq（28,189 cells）：鉴定9种主要细胞类型；辐射后上皮细胞数量急剧下降 • 基底细胞（KRT14/KRT5/KRT15）是主要受累亚群 • 组织学成像：口腔黏膜含上皮基底细胞、成纤维细胞、内皮细胞、免疫细胞四大区室 核心发现 电离辐射导致口腔黏膜显著上皮变薄，主要由基底细胞的严重耗竭所致；首次构建 RIOM 单细胞参考图谱 Result 2 | Figure 2 — 辐射在基底上皮细胞中诱导铁死亡 # 项目 内容 Fig Fig. 2 标题 Ionizing radiation induces ferroptosis in basal epithelial cells 目的 鉴定辐射诱导基底上皮细胞死亡的核心细胞死亡形式 主要证据 • AddModuleScore：辐射后铁死亡评分显著升高 • ACSL4（铁死亡诱导酶）在人 RIOM 基底细胞中表达升高 • Liproxstatin-1（LIP-1）抑制 ACSL4，恢复黏膜厚度 • 体外实验：Fer-1 比凋亡抑制剂 Z-VAD-fmk 保护效果更强 • 辐射增加 ROS 和不稳定铁池，Fer-1 可逆转 • PTGS2 时间动态：早期无显著变化，晚期显著升高；早期黏膜代偿性增厚 核心发现 铁死亡是辐射诱导基底上皮细胞死亡的主要形式；早期存在代偿性保护期 Result 3 | Figure 3 — 成纤维细胞在辐射早期保护基底细胞 # 项目 内容 Fig Fig. 3 标题 Fibroblasts protect basal cells in the early stage of radiation-induced mucositis 目的 发现辐射早期代偿保护的关键细胞和信号来源 主要证据 • scRNA-seq CellChat 分析：辐射后早期成纤维细胞与上皮细胞间通讯显著增强 • 成纤维细胞分泌多种代谢因子（多胺、色氨酸代谢物等） • 体外共培养：成纤维细胞条件培养基（CM）保护基底细胞免于辐射诱导的铁死亡 • 早期（3天）：黏膜增厚，基底细胞增殖活跃；晚期（9天）：代偿减弱，损伤加剧 核心发现 成纤维细胞在辐射早期提供代偿性代谢保护，其分泌的多胺是关键保护因子 Result 4 | Figure 4 — 成纤维细胞通过抑制 SAT1-ACSL4 轴抑制铁死亡 # 项目 内容 Fig Fig. 4 标题 Fibroblasts inhibit ferroptosis in basal cells through suppression of the SAT1-ACSL4 axis 目的 阐明成纤维细胞保护作用的分子下游机制 主要证据 • 成纤维细胞 CM 降低基底细胞中 SAT1 和 ACSL4 表达 • SAT1 通过激活多不饱和脂肪酸参与铁死亡 • ACSL4 蛋白水平与 SAT1 变化一致 • 体内：LIP-1 处理抑制 ACSL4，恢复黏膜厚度 • 时间依赖性：SAT1/ACSL4 在早期受抑制，晚期反弹（保护减弱） 核心发现 成纤维细胞通过抑制 SAT1-ACSL4 信号轴缓解辐射诱导的铁死亡 Result 5 | Figure 5 — 成纤维细胞产生多胺抑制铁死亡 # 项目 内容 Fig Fig. 5 标题 Fibroblasts produce polyamines that inhibit ferroptosis in basal cells 目的 鉴定保护性代谢因子的细胞来源和合成调控机制 主要证据 • scRNA-seq + GSVA：辐射后成纤维细胞多胺代谢通路活性显著升高（早期），随时间下降 • 免疫荧光：亚精胺/精胺在基底细胞中维持早期稳态 • LC-MS：舌组织成纤维细胞多胺水平在早期有效维持，晚期耗竭 • ODC1（多胺合成限速酶）在成纤维细胞中表达升高，受 HIF-1α 转录调控 • ChIP-qPCR：HIF-1α 在 ODC1 启动子区显著富集，辐射后进一步增强 核心发现 成纤维细胞在辐射后早期通过 HIF-1α→ODC1 轴增强多胺合成，是保护因子的细胞来源 Result 6 | Figure 6 — 多胺抑制铁死亡并逆转黏膜损伤 # 项目 内容 Fig Fig. 6 标题 Polyamines inhibit ferroptosis and reverse mucosal damage in radiation-induced mucositis 目的 验证多胺的治疗转化潜力，阐明上游调控机制 主要证据 • 低浓度多胺：抑制 SAT1 表达，减少脂质过氧化，抑制铁死亡 • 高浓度多胺：促进脂质过氧化，诱导铁死亡（双向浓度效应） • 辐射前预加低浓度亚精胺/精胺：显著抑制铁死亡，保护黏膜完整 • 体内给药：多胺改善口腔、结肠、肝脏和肺部辐射损伤 • JunD 直接调控 SAT1 表达；多胺补充抑制 JunD；DFMO 增加 JunD 水平 • ACSL4 蛋白与 JunD 变化一致，证实 JunD→SAT1→ACSL4 上游调控关系 核心发现 补充生理浓度多胺可逆转黏膜损伤；JunD 是多胺调控 SAT1 的关键上游转录因子 五、机制模型 # 5.1 分子机制流程图 # 辐射暴露 ↓ 成纤维细胞（早期代偿）：HIF-1α → ODC1↑ → 多胺（spermidine/spermine）↑ ↓（旁分泌）多胺被基底细胞吸收 基底上皮细胞：多胺 → JunD↓ → SAT1↓ → ACSL4↓ → 铁死亡抑制 ↕（晚期：多胺耗竭，保护减弱） ROS↑ + 不稳定铁池↑ + 脂质过氧化↑ → 铁死亡 → 黏膜损伤 5.2 时间演进模型 # 阶段 时间 成纤维细胞 基底细胞 黏膜状态 早期代偿 照后 0-3 天 HIF-1α↑ → ODC1↑ → 多胺↑ JunD↓ → SAT1↓ → ACSL4↓ → 铁死亡抑制 增厚，保护性增殖 过渡期 照后 5-7 天 多胺代谢活性下降 铁死亡开始加重 临界状态 晚期损伤 照后 9+ 天 多胺耗竭 SAT1/ACSL4 反弹 → 铁死亡加剧 变薄，溃疡 5.3 治疗转化模型 # 【预防策略】 辐射前预服低剂量多胺 → 抑制 JunD → 下调 SAT1/ACSL4 → 预防黏膜损伤 【治疗策略】 已知 RIOM 患者补充多胺 → 多部位保护（口腔、结肠、肝、肺）→ 改善生活质量 【靶点优势】 vs 直接抑制铁死亡（LIP-1/Fer-1）：更安全，适合长期使用，调动内源性保护机制 六、汇报亮点与局限性 # 6.1 研究亮点 # ✅ 首次构建 RIOM 单细胞图谱（28,189 cells / 9种细胞类型），发现成纤维细胞保护性代谢 ✅ 首次系统证实铁死亡是 RIOM 的核心细胞死亡机制，填补领域空白 ✅ 揭示成纤维细胞-基底细胞代谢互作网络（HIF-1α→ODC1→多胺→JunD→SAT1→ACSL4） ✅ 多胺双向浓度效应（生理浓度保护，高浓度促死亡）→ 治疗窗口明确 ✅ 多部位验证：口腔、结肠、肝脏和肺部，具有广泛临床转化潜力 ✅ 多胺为小分子化合物，安全性已有大量基础，临床转化优势明显 6.2 研究局限性 # ⚠️ 种属差异：小鼠模型与人类 RIOM 在辐射剂量和黏膜结构上存在差异 ⚠️ 多胺剂量精准性：双向浓度效应要求精准剂量控制，临床需严格优化 ⚠️ 长期安全性：多胺长期补充的安全性数据尚不充分 ⚠️ 机制深度：JunD 对 SAT1 的直接转录调控尚需 ChIP-seq 进一步验证 ⚠️ 临床样本量有限，人类 RIOM 组织样本量较小 七、核心参考文献 # Yu W, Jiao K, Wang K, et al. Metabolic support protects mucosa from ferroptosis in radiation-induced mucositis . Nat Commun . 2026;17:520. doi:10.1038/s41467-025-67214-5 Dixon SJ, et al. Ferroptosis: an iron-dependent form of nonapoptotic cell death. Cell . 2012;149(5):1060-1072. Stockwell BR, et al. Ferroptosis: A regulated cell death nexus linking metabolism, redox biology, and disease. Cell . 2017;171(2):273-285. Sonis ST. The pathobiology of mucositis. Nat Rev Cancer . 2004;4(4):277-284. Li Q, et al. ACSL4 is a key regulator of ferroptosis in cancer cells. Cancer Cell . 2022. Doll S, et al. FSP1 is a glutathione-independent ferroptosis suppressor. Nature . 2019;575(7784):693-698. Zhang Y, et al. eIF2α/ATF4 pathway as a therapeutic target in radiation-induced mucosal injury. Radiat Res . 2021.","tags":[],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.569Z","url":"literature/notes/174dbdb5483c7b00db208737.html"},{"kbId":"KB-000033","title":"代谢支持可保护黏膜免受放射性黏膜炎中的铁死亡","subtitle":"Metabolic support protects mucosa from ferroptosis in radiation-induced mucositis","summary":"Ionizing radiation is effective in treating cancer but causes significant damage to the mucosa, thereby increasing patient discomfort, delaying therapy, and raising the risk of mortality. The underlying mechanisms of this damage remain poorly understood, and current treatments are largely palliative. In this study, ferroptosis was identified as the primary mode of cell death responsible for the radiation-induced depletion of oral mucosal epithelial cells. Notably, a compensatory phase was also discovered in the early stages following radiation exposure, during which fibroblasts provide crucial metabolic support. Specifically, fibroblasts supply polyamines that are readily absorbed by basal epithelial cells, protecting them from ferroptosis. Supplementation with polyamines was found to effectively prevent mucosal injury. These findings highlight the critical role of fibroblast-mediated metabolic support in protecting the oral mucosa from radiation-induced damage and offer insights into enhancing the body's intrinsic protective mechanisms against radiation-related diseases.","body":"本文献笔记由 Claudian 自动生成，元数据已同步至 Zotero (ItemID: 1751) 中文标题 # 代谢支持可保护黏膜免受放射性黏膜炎中的铁死亡 中文摘要 # 电离辐射虽然是有效的癌症治疗手段，但会对黏膜造成严重损伤，从而增加患者不适、延迟治疗并提高死亡率。黏膜损伤的潜在机制目前仍知之甚少，且现有治疗大多仅为姑息性治疗。本研究首次证实， 铁死亡 是辐射导致口腔黏膜上皮细胞耗竭的主要细胞死亡形式。值得注意的是，在辐射暴露后的早期阶段还存在一个 代偿期 ，在此期间 成纤维细胞 提供关键的代谢支持。具体而言，成纤维细胞供给 多胺（polyamines） ，这些多胺可被基底上皮细胞直接吸收，从而保护其免于铁死亡。补充多胺被发现能有效预防黏膜损伤。这些发现凸显了成纤维细胞介导的代谢支持在保护口腔黏膜免受辐射损伤中的关键作用，并为增强机体对辐射相关疾病的内在保护机制提供了新的思路。 一、研究背景与科学问题 # 1.1 疾病背景 # RIOM（放射性口腔黏膜炎） ：头颈部肿瘤放疗最常见的并发症之一，表现为黏膜萎缩或溃疡，伴随严重疼痛和屏障功能受损 临床困境 ：现有治疗以姑息性为主（如镇痛、抗炎），缺乏针对核心病理机制的靶向干预 临床意义 ：黏膜损伤导致治疗中断，影响放疗疗效，增加感染和死亡风险 1.2 机制背景 # 已知电离辐射直接导致 DNA 双链断裂和 ROS 积累，引发细胞损伤 既往研究聚焦于 凋亡 通路，但抗凋亡药物在 RIOM 临床试验中效果有限 → 提示其他细胞死亡形式参与 铁死亡（Ferroptosis） ：一种铁依赖的脂质过氧化驱动的细胞死亡形式，以往未被系统研究于 RIOM 1.3 三个核心科学问题 # 编号 科学问题 Q1 电离辐射通过何种细胞死亡机制导致口腔黏膜上皮细胞耗竭？ Q2 辐射后是否存在内在保护机制？其细胞和分子基础是什么？ Q3 如何通过增强内源性保护或外源补充来预防 RIOM？ 二、整体研究思路 # 【临床问题】RIOM 缺乏靶向治疗 ↓ 【单细胞图谱】scRNA-seq 揭示辐射后细胞组成变化 ↓ 【核心发现1】铁死亡是上皮细胞主要死亡形式 → Q1 ↓ +【早期代偿现象】辐射后早期黏膜反而增厚 ↓ 【细胞通讯】CellChat 分析发现成纤维细胞-上皮细胞代谢互作 ↓ 【核心发现2】成纤维细胞分泌多胺保护基底细胞 → Q2 ↓ 【分子机制】HIF-1α→ODC1↑ → 多胺↑ → JunD↓ → SAT1↓ → ACSL4↓ → 抑制铁死亡 ↓ 【治疗转化】补充生理浓度多胺预防/治疗 RIOM（口腔、结肠、肝脏、肺）→ Q3 数据来源： PRJNA1221123：小鼠舌/口腔黏膜，18 Gy，3个时间点（对照/照后3天/照后9天），41,810 cells 患者样本：人舌 RIOM 活检组织 三、主要结果（逐图总结） # Result 1 | Figure 1 — 辐射导致上皮内环境稳态失衡 # 核心发现 ：辐射引起人和小鼠口腔黏膜显著上皮变薄和基底细胞耗竭 主要证据 ： 人舌 RIOM 活检：上皮显著变薄、连续性中断，基底细胞增殖减少 小鼠 18 Gy 照射：照后第9天出现黏膜损伤，组织病理学与人类高度相似 scRNA-seq（28,189 cells）：鉴定9种主要细胞类型；辐射后上皮细胞数量急剧下降 基底细胞（KRT14/KRT5/KRT15 markers）是主要受累亚群 意义 ：建立了 RIOM 的小鼠模型和单细胞参考图谱 图注： Fig. 1 | Radiation-induced epithelial thinning and basal cell depletion in human and mouse oral mucosa. (a) Clinical appearance of human RIOM tongue tissue. (b-d) Epithelial thinning and discontinuity with reduced basal cell proliferation in human biopsies. (e-h) Murine 18 Gy cranial radiation model recapitulates human RIOM pathology. (i) scRNA-seq UMAP of 9 major cell types. (j) Sharp reduction in epithelial cell numbers post-radiation. (k-l) Epithelial subpopulations: basal, spinous, granular, corneocytes. (m) Four major cellular compartments in oral mucosa. Result 2 | Figure 2 — 辐射在基底上皮细胞中诱导铁死亡 # 核心发现 ：铁死亡是辐射诱导基底上皮细胞死亡的主要形式 主要证据 ： AddModuleScore：辐射后铁死亡评分显著升高 ACSL4（铁死亡诱导酶）在人 RIOM 基底细胞中表达升高 Liproxstatin-1（LIP-1，铁死亡抑制剂）处理：抑制 ACSL4 表达，恢复黏膜厚度 体外实验：辐射降低基底细胞增殖，增加死亡率；Fer-1 比 Z-VAD-fmk（凋亡抑制剂）保护效果更强 辐射增加细胞内 ROS 和不稳定铁池（labile iron pool），Fer-1 可逆转 脂质过氧化蓄积（铁死亡标志物） 早期阶段特性 ：PTGS2（铁死亡标志物）在早期无显著升高，到晚期才显著升高 意义 ：首次确认铁死亡是 RIOM 的核心细胞死亡机制 图注： Fig. 2 | Ionizing radiation induces ferroptosis in basal epithelial cells. (a) Ferroptosis gene set scores elevated post-radiation. (b) ACSL4 expression in human RIOM basal cells. (c-e) LIP-1 suppresses ACSL4 and restores mucosal thickness. (f) PTGS2 dynamics: early phase no change, late phase elevated. (g) Early phase: mucosal thickening and basal cell proliferation without significant DNA damage. Result 3 | Figure 3 — 成纤维细胞在辐射早期保护基底细胞 # 核心发现 ：辐射早期成纤维细胞与基底细胞间存在代谢互作网络，提供代偿性保护 主要证据 ： scRNA-seq CellChat 分析：辐射后早期成纤维细胞与上皮细胞间通讯显著增强 成纤维细胞分泌多种代谢因子（多胺、色氨酸代谢物等） 体外共培养：成纤维细胞条件培养基（CM）保护基底细胞免于辐射诱导的铁死亡 早期（3天）：黏膜增厚，基底细胞增殖活跃；晚期（9天）：代偿减弱，损伤加剧 意义 ：揭示了机体对辐射应激的内源性保护机制 图注： Fig. 3 | Fibroblasts protect basal cells in the early stage of radiation-induced mucositis. (a-b) CellChat analysis showing enhanced fibroblast-epithelial communication in early phase. (c) Fibroblast secretome includes polyamines and metabolites. (d-e) Fibroblast conditioned medium (CM) protects basal cells from radiation-induced ferroptosis in co-culture. (f) Early phase (day 3): mucosal thickening; late phase (day 9): compensatory decline. Result 4 | Figure 4 — 成纤维细胞通过抑制 SAT1-ACSL4 轴抑制铁死亡 # 核心发现 ：成纤维细胞通过抑制 SAT1-ACSL4 信号轴缓解辐射诱导的铁死亡 主要证据 ： 成纤维细胞 CM 降低基底细胞中 SAT1 和 ACSL4 表达 SAT1（SPT7L/anthrasilb）通过激活多不饱和脂肪酸参与铁死亡 ACSL4 蛋白水平与 SAT1 变化一致 体内：LIP-1 处理后 ACSL4 表达被抑制，黏膜厚度恢复 时间依赖性：SAT1/ACSL4 在早期受抑制（成纤维细胞保护），晚期反弹（保护减弱） 意义 ：阐明了成纤维细胞保护作用的分子下游 图注： Fig. 4 | Fibroblasts inhibit ferroptosis in basal cells through suppression of the SAT1-ACSL4 axis. (a) Fibroblast CM reduces SAT1 and ACSL4 in basal cells. (b-c) SAT1 activates polyunsaturated fatty acids for ferroptosis. (d-e) ACSL4 protein mirrors SAT1 dynamics. (f) LIP-1 suppresses ACSL4 and restores mucosal thickness in vivo. (g) Temporal pattern: SAT1/ACSL4 suppressed early, rebounded late. Result 5 | Figure 5 — 成纤维细胞产生多胺抑制铁死亡 # 核心发现 ：成纤维细胞在辐射后早期阶段代谢活性增强，产生多胺（精胺、亚精胺）保护基底细胞 主要证据 ： scRNA-seq + GSVA：辐射后成纤维细胞多胺代谢通路活性显著升高（早期），随时间下降 免疫荧光：亚精胺/精胺在基底细胞中维持早期稳态 LC-MS：舌组织成纤维细胞多胺水平在早期有效维持，晚期耗竭 ODC1（鸟氨酸脱羧酶，多胺合成限速酶）在成纤维细胞中表达升高，受 HIF-1α 转录调控 ChIP-qPCR：HIF-1α 在 ODC1 启动子区显著富集，辐射后进一步增强 意义 ：鉴定出保护性代谢因子的细胞来源和合成调控机制 图注： Fig. 5 | Fibroblasts produce polyamines that inhibit ferroptosis in basal cells. (a) GSVA: polyamine metabolic pathway elevated in fibroblasts early post-radiation. (b) Immunofluorescence for spermidine/spermine in basal cells. (c) LC-MS analysis of tongue fibroblasts. (d) ODC1 (ornithine decarboxylase, rate-limiting for polyamine synthesis) elevated in fibroblasts. (e) HIF-1α transcriptionally activates ODC1. (f) ChIP-qPCR: HIF-1α enrichment at ODC1 promoter, enhanced post-irradiation. Result 6 | Figure 6 — 多胺抑制铁死亡并逆转黏膜损伤 # 核心发现 ：补充生理浓度（低浓度）多胺可抑制 SAT1 表达，减少脂质过氧化，逆转黏膜损伤；高浓度多胺反而促铁死亡；JunD 介导多胺对 SAT1 的调控 主要证据 ： 低浓度多胺：抑制 SAT1 表达，减少脂质过氧化，抑制铁死亡 高浓度多胺：促进脂质过氧化，诱导铁死亡（双向浓度效应） 辐射前预加低浓度亚精胺/精胺：显著抑制铁死亡，保护黏膜完整 体内给药：多胺补充显著改善小鼠口腔、结肠、肝脏和肺部的辐射损伤 JunD（转录因子）直接调控 SAT1 表达；多胺补充抑制 JunD；DFMO（多胺合成抑制剂）增加 JunD 水平 ACSL4 蛋白水平与 JunD 变化一致，证实 JunD→SAT1→ACSL4 上游调控关系 意义 ：提出了多胺靶向治疗 RIOM 的转化策略 图注： Fig. 6 | Polyamines inhibit ferroptosis and reverse mucosal damage in radiation-induced mucositis. (a-b) Low-dose polyamines: suppress SAT1, reduce lipid peroxidation, inhibit ferroptosis. (c) High-dose polyamines: enhance lipid peroxidation, promote ferroptosis (biphasic dose response). (d-e) Pre-treatment with low-dose spermidine/spermine before radiation: suppresses ferroptosis, protects mucosal integrity. (f) In vivo: polyamine supplementation improves mucosal damage in oral cavity, colon, liver, and lungs. (g) JunD directly modulates SAT1 expression; polyamine supplementation suppresses JunD. (h-i) DFMO (polyamine synthesis inhibitor) increases JunD and ACSL4 levels. 四、机制模型 # 4.1 分子机制全图 # 辐射暴露 ↓ ┌─────────────────────────────────────────────┐ │ 成纤维细胞（早期代偿） │ │ HIF-1α → ODC1↑ → 多胺（spermidine/spermine）↑ │ └─────────────────────────────────────────────┘ ↓（旁分泌）多胺被基底细胞吸收 ┌─────────────────────────────────────────────┐ │ 基底上皮细胞 │ │ 多胺 → JunD↓ → SAT1↓ → ACSL4↓ → 铁死亡抑制 │ │ ↕（晚期：多胺耗竭，保护减弱） │ │ ROS↑ + 不稳定铁池↑ + 脂质过氧化↑ │ │ → 铁死亡 → 黏膜损伤 │ └─────────────────────────────────────────────┘ 4.2 时间演进模型 # 阶段 时间 成纤维细胞 基底细胞 黏膜状态 早期代偿 照后 0-3 天 HIF-1α↑ → ODC1↑ → 多胺↑ JunD↓ → SAT1↓ → ACSL4↓ 增厚，保护性增殖 过渡期 照后 5-7 天 多胺代谢活性下降 铁死亡开始加重 临界状态 晚期损伤 照后 9+ 天 多胺耗竭 SAT1/ACSL4 反弹 → 铁死亡加剧 变薄，溃疡 4.3 治疗转化模型 # 【预防策略】 辐射前预服低剂量多胺（亚精胺/精胺） → 抑制 JunD → 下调 SAT1/ACSL4 → 预防黏膜损伤 【治疗策略】 已知 RIOM 患者补充多胺 → 多部位保护（口腔、结肠、肝、肺） → 改善生活质量，减少治疗中断 【靶点优势】 vs 直接抑制铁死亡（LIP-1/Fer-1）：更安全，适合长期使用 调动内源性保护机制，符合生理性治疗理念 五、讨论与结论 # 5.1 核心发现 # 铁死亡是 RIOM 的核心细胞死亡机制 ：首次系统证实，填补了领域空白 成纤维细胞-基底细胞代谢互作网络 ：早期代偿期成纤维细胞供给多胺，关键保护作用 HIF-1α→ODC1→多胺→JunD→SAT1→ACSL4 完整信号通路 ：机制链条清晰完整 多胺的双向浓度效应 ：生理浓度保护，高浓度促死亡 → 治疗窗口明确 5.2 研究亮点 # ✅ scRNA-seq 引领发现 ：首次构建 RIOM 单细胞图谱，发现成纤维细胞保护性代谢 ✅ 首次确认铁死亡在 RIOM 中的核心地位 ：改变了对 RIOM 细胞死亡机制的传统认知 ✅ 临床转化潜力强 ：多胺为小分子化合物，安全性和药代动力学已有大量基础 ✅ 多部位验证 ：不仅是口腔黏膜，还验证了结肠、肝脏和肺部，具有广泛适用性 5.3 研究局限性 # 种属差异 ：小鼠模型与人类 RIOM 存在一定差异（如辐射剂量、黏膜结构） 多胺剂量精准性 ：双向浓度效应要求精准剂量控制，临床转化需严格剂量优化 长期安全性 ：多胺长期补充的安全性数据尚不充分 机制深度 ：JunD 对 SAT1 的直接转录调控尚需 ChIP-seq 数据进一步验证 临床样本量 ：人类 RIOM 组织样本量有限 5.4 未来方向 # 多胺作为 RIOM 预防性或治疗性补充剂的临床试验设计 其他黏膜损伤（如放射性肠炎）的类似机制探索 多胺代谢通路中其他代谢物（如犬尿氨酸、色氨酸代谢物）的独立作用研究 六、参考文献 # Yu W, Jiao K, Wang K, et al. Metabolic support protects mucosa from ferroptosis in radiation-induced mucositis . Nat Commun . 2026;17:520. doi:10.1038/s41467-025-67214-5 Dixon SJ, et al. Ferroptosis: an iron-dependent form of nonapoptotic cell death. Cell . 2012;149(5):1060-1072. PMID: 22632975 Koppenol WH, Bounds PL, Dang CV. Otto Warburg's contributions to current concepts of cancer metabolism. Nat Rev Cancer . 2011;11(5):325-337. Stockwell BR, et al. Ferroptosis: A regulated cell death nexus linking metabolism, redox biology, and disease. Cell . 2017;171(2):273-285. Zhang Y, et al. elF2α/ATF4 pathway as a therapeutic target in radiation-induced mucosal injury . Radiat Res . 2021. Sonis ST. The pathobiology of mucositis. Nat Rev Cancer . 2004;4(4):277-284. PMID: 15089453 Li Q, et al. ACSL4 is a key regulator of ferroptosis in cancer cells. Cancer Cell . 2022. Doll S, et al. FSP1 is a glutathione-independent ferroptosis suppressor. Nature . 2019;575(7784):693-698. 关键图表 (Figure 1-6) # 以下为论文原图，按研究逻辑顺序排列。 Figure 1 | Radiation-induced epithelial thinning and basal cell depletion # 图注： Fig. 1 | Radiation-induced epithelial thinning and basal cell depletion in human and mouse oral mucosa. (a) Clinical appearance of human RIOM tongue tissue (b-d) Epithelial thinning and discontinuity with reduced basal cell proliferation (e-h) Murine 18 Gy cranial radiation model recapitulates human RIOM (i) scRNA-seq UMAP: 9 major cell types 5 Dec, 54:1-33 作者 Xiaokun Yang, Mingshu Huang, Huan Chen,","body":"基本信息 # 项目 内容 原文题名 Biomaterial-mediated Cell Atlas: an insight from single-cell and spatial transcriptomics 中文题名 生物材料介导的细胞图谱：来自单细胞和空间转录组学的启示 期刊 Bioactive Materials 发表信息 2025-08-08 online；2025 Dec, 54:1-33 作者 Xiaokun Yang, Mingshu Huang, Huan Chen, Jingtao Dai, Jiahao Chen, Kai Chen, Jiannan Zhou, An Li, Ping Li DOI 10.1016/j.bioactmat.2025.07.047 PubMed / PMC PMID:40821937 ； PMCID:PMC12356410 ScienceDirect S2452199X25003470 Zotero Item key: KWQJCUND ；PDF attachment: LGLUYJSV ；ScienceDirect snapshot: YSPDCINJ 文献类型 Review article；开放获取，CC BY-NC-ND 一句话结论 # 这篇综述提出了 Biomaterial-mediated Cell Atlas, BCA 的概念：把植入物、支架、涂层、纳米材料等生物材料视为一种会重塑组织细胞生态的刺激源，用 scRNA-seq 和空间转录组描绘材料周围的细胞组成、状态转换、免疫通讯和空间分布，再把这些机制反馈到材料设计中。 研究问题与创新点 # 核心问题 # 传统生物材料研究常用 bulk transcriptomics、蛋白组、代谢组、组织学和免疫染色来评价材料效果，但这些方法容易把不同细胞群的信号平均掉。材料植入后的真实反应往往发生在局部微环境里：巨噬细胞、成纤维细胞、内皮细胞、MSC/骨祖细胞、T/B 细胞等群体同时变化，而且每个群体内部还有功能亚群。作者试图回答的是：如何用单细胞和空间组学把“材料-细胞-组织反应”系统化成可复用的图谱。 主要创新 # 创新点 具体含义 提出 BCA 概念 不是简单复述 Human Cell Atlas，而是把生物材料的物理、化学、生物学线索纳入细胞图谱框架 把材料评价分成三个 biological effect 维度 Biological safety、bioactivity、immune microenvironment，分别对应安全性、促再生活性和免疫微环境 强调 scRNA-seq 与空间转录组互补 scRNA-seq 解析细胞类型和状态，空间技术定位材料界面附近的细胞生态位 把图谱转化为设计闭环 先用图谱找关键细胞/通路，再用涂层、支架、药物释放、纳米酶、因子递送等手段定向调控 对 biomaterial single-cell 文献做范围综述 文章说明从 PubMed、Web of Science、Embase 选取 48 篇相关研究，补充表整理了研究空白、方法和材料类型 样本与实验设计 # 这篇文章是综述，不是原始实验研究。其证据基础来自已发表的 biomaterial single-cell/spatial transcriptomics 研究，覆盖纳米材料安全性、骨/皮肤/牙髓/心肌/椎间盘再生、植入物异物反应、感染/炎症相关材料反应、糖尿病骨缺损和骨关节炎等场景。 综述模块 主要材料/模型类型 单细胞或空间问题 Biological safety 银纳米颗粒、TiO2 纳米颗粒、SiO2/介孔硅纳米颗粒 免疫毒性、DNA repair/cell cycle、ROS、肺/肝免疫扰动 Bioactivity 胶原/纳米羟基磷灰石、水凝胶、镁基材料、智能绷带、牙髓/心肌/椎间盘工程材料 骨再生、皮肤愈合、牙髓再生、心肌组织工程、椎间盘修复 Immune microenvironment ECM scaffold、植入界面、骨-植入感染、种植体周围炎/牙周炎 巨噬细胞、成纤维细胞、单核细胞、Notch/配体受体通讯和炎症生态位 Design guidance Spp1/Cxcl12 scaffold、Ru nanozyme hydrogel、verteporfin-loaded PLGA NPs 等 从单细胞机制反推材料递送、免疫调节和代谢重编程策略 数据集/代码可用性核验表 # 核验日期：2026-05-19。状态以 Zotero 本地附件、Crossref、PubMed/PMC E-utilities、PMC OA service、ScienceDirect/Elsevier CDN 和本地全文检索为准。 paper accession/resource repository data type sample/group design current access status direct page link direct download/request link verification date notes Yang 2025 Bioactive Materials DOI: 10.1016/j.bioactmat.2025.07.047 DOI/Crossref/ScienceDirect Article metadata Review article 已核验，可访问 DOI ； ScienceDirect Crossref API 2026-05-19 Crossref、Zotero 和 ScienceDirect 的题名、卷、页、DOI一致 Yang 2025 Bioactive Materials PMID 40821937 / PMCID PMC12356410 PubMed / PMC Article record and OA full text Review article 公开，可读取元数据和 XML/PDF 记录 PubMed ； PMC PMC OA service 2026-05-19 PubMed 标记为 Review；PMC OA service 显示有 PDF 和 OA package Yang 2025 Bioactive Materials mmc1.docx Elsevier supplementary data / PMC supplement Supplementary Fig. 1 and Supplementary Table 1 文献筛选流程和 48 篇 biomaterial single-cell 应用研究概览 公开，可直接下载；已保存到本地 attachments/ DOI landing Elsevier supplement 2026-05-19 补充表整理研究问题、方法、材料和引用，不是原始测序矩阵 Yang 2025 Bioactive Materials 本篇原始测序 accession GEO/SRA/ENA/ArrayExpress/BioProject/GitHub 等 scRNA-seq/ST raw data 不适用 未发现本篇产生新原始测序数据 不适用 不适用 2026-05-19 全文检索未命中 GSE/PRJ/SRP/E-MTAB/CRA/HRA 等 accession；再分析需回溯被综述的各原始研究 Yang 2025 Bioactive Materials Zotero local PDF Zotero local library PDF full text 33 页全文 本地可读，已用于精读 Zotero item KWQJCUND PDF attachment LGLUYJSV 2026-05-19 Zotero full-text index 显示 33/33 页，约 185,939 字符 方法路线 # 传统材料评价问题 -\u003e bulk/组织层面平均信号难以解析细胞异质性 -\u003e 引入 scRNA-seq -\u003e cell type/subtype annotation -\u003e DEG + GO/KEGG/GSEA/GSVA -\u003e pseudotime / RNA velocity -\u003e ligand-receptor communication -\u003e PPI/network analysis -\u003e 引入 spatial transcriptomics -\u003e 10x Visium / Slide-seq / MERFISH / seqFISH / Xenium 等 -\u003e 把 scRNA-seq 细胞类型映射回材料-组织界面 -\u003e 建立 BCA -\u003e biological safety -\u003e bioactivity -\u003e immune microenvironment -\u003e 反推材料设计 -\u003e direct tissue activation -\u003e immune regulation -\u003e AI/multi-omics/digital twin 方向 主要结果精读 # Result 1：BCA 将 Human Cell Atlas 扩展到材料诱导的细胞响应 # 图 1 对应结果： 这张图把 BCA 分成生物安全性、生物活性和免疫微环境三类响应，强调生物材料进入组织后并非静态支架，而是会持续与宿主细胞发生相互作用。图源：PMC12356410 / ScienceDirect 官方图像。 作者把 BCA 定义为一种连接材料科学和细胞生物学的框架：材料的表面形貌、硬度、降解产物、离子释放、药物/因子递送和生物活性涂层都会塑造局部细胞状态。BCA 的关键不是“多做一套单细胞图”，而是把材料线索和细胞图谱绑定起来，解释为什么同一种材料在不同组织、疾病状态或免疫环境中会产生不同效果。 这对你的生信/材料交叉方向很有用：如果研究对象是口腔种植体、骨再生支架、软组织封闭或异物反应，BCA 可以作为“实验设计和数据解释框架”。它要求至少同时回答三件事：材料改变了哪些细胞、这些细胞位于哪里、这些变化能否反推材料优化。 Result 2：scRNA-seq 是解析材料周围细胞异质性的基础工具 # 图 2 对应结果： 图中概括了 bulk sequencing 与 single-cell sequencing 的差异，并把单细胞流程拆成细胞悬液、GEM/library、测序和分析，后续再接 DEG、拟时序和细胞通讯。图源：PMC12356410 / ScienceDirect 官方图像。 文章强调，bulk 数据会把材料周围不同细胞群的信号平均掉，尤其容易漏掉稀有亚群、过渡状态和材料界面特异反应。scRNA-seq 的价值在于把“材料有效/无效”的终点判断拆解为细胞层面的变化：哪些细胞增加，哪些细胞转为促炎/抗炎/成骨/成纤维状态，哪些配体-受体关系被材料改变。 在分析流程上，作者把常用任务整理为：细胞注释、差异基因、富集分析、拟时序、RNA velocity、CellPhoneDB/CellChat/NicheNet、STRING/PPI、Seurat/Scanpy/SingleR 等。对实际再分析而言，这篇可以当作 biomaterial scRNA-seq 的方法清单，但不能替代每个原始研究的数据质控和统计设计。 Result 3：单细胞结果需要从“细胞类型”推进到“状态、通路和通讯” # 图 3 对应结果： 图中用 GelMA wound model 和 Ti-DOPA-CO implant coating 两类案例说明，材料硬度、交联程度或功能涂层可以重塑巨噬细胞、成纤维细胞和细胞因子表达谱。图源：PMC12356410 / ScienceDirect 官方图像。 作者用多个案例说明，BCA 的分析不能停留在“UMAP 上有几个 cluster”。例如不同交联程度的 GelMA 会改变伤口巨噬细胞亚群比例；Ti-DOPA-CO 涂层会改变软组织界面的细胞因子谱，并与巨噬细胞 M2 极化、PI3K-Akt、ECM 组织和胶原合成相关。 我的理解是：这类结果的真正价值在于把材料参数和细胞功能状态联系起来。对于口腔种植或骨再生方向，类似逻辑可以转化成问题：不同表面处理是否改变 SPP1+ macrophage 、 MGP+ MSC/OP 、 CXCL/CCL chemokine fibroblast 或 endothelial angiogenic program；这种变化是否能解释软组织封闭、骨结合或炎症持续。 Result 4：空间转录组把材料界面中的关键细胞放回组织位置 # 图 6 对应结果： 该图展示了空间转录组在骨缺损修复中的应用：先做组织空间聚类，再把 scRNA-seq 定义的 MSC/osteoprogenitor 亚群映射回缺损区域，识别具有空间偏好的 Mgp high MSC/OPs2。图源：PMC12356410 / ScienceDirect 官方图像。 scRNA-seq 的主要短板是组织解离会丢失空间位置，还可能引入应激基因表达和细胞损失。空间转录组可以弥补这一点：材料-组织界面最关心的是细胞在材料表面、纤维囊、骨缺损边缘、血管周围还是炎症灶中出现。作者以 collagen/nano-hydroxyapatite hydrogel 相关骨再生研究为例，说明空间数据能够定位 MSC 亚群和 Mgp 表达热点。 这对再分析特别重要。仅有单细胞数据时，我们可以说某个细胞群存在；加入空间数据后，才能说该群是否真正位于材料作用区域，是否靠近血管、免疫细胞、骨祖细胞或纤维化区域。对于种植体周围炎或植入周纤维化，空间定位往往比单纯 marker 更能说明机制。 Result 5：BCA 的目标是形成“机制发现 -\u003e 材料优化”的反馈闭环 # 图 7 对应结果： 图中把 BCA 连接到材料-细胞相互作用和下一代材料优化，强调生物学机制研究与材料设计之间应形成反馈，而不是两个割裂步骤。图源：PMC12356410 / ScienceDirect 官方图像。 文章把 BCA 的意义分成两层。第一层是解释生物响应：材料是否安全、是否促再生、是否造成异常免疫或纤维化。第二层是指导材料设计：识别关键细胞、关键通路和关键空间生态位后，通过材料成分、力学、表面形貌、涂层或递送系统定向调控。 这个框架比“材料 A 优于材料 B”的比较更强，因为它要求提出可验证机制。例如，如果单细胞发现材料诱导的骨修复依赖 Spp1/Cxcl12 或 Mdk-Lrp1/SPP1-integrin 轴，那么下一步材料设计就不应只调整形貌，而应测试能否局部递送或增强这些通路。 Result 6：单细胞机制可以直接转化为免疫调节型材料设计 # 图 14 对应结果： 该案例用 scRNA-seq 发现糖尿病下颌骨缺损中 NO/ROS 阻碍巨噬细胞代谢转换和再极化，据此设计含 ruthenium nanozyme 的多酶水凝胶支架，清除 NO/ROS 并改善成骨、血管生成和巨噬细胞状态。图源：PMC12356410 / ScienceDirect 官方图像。 这部分是全篇最接近“从图谱到材料设计”的例子。糖尿病骨缺损中，过量 NO 和 ROS 使巨噬细胞难以从促炎状态转向修复状态，阻断糖酵解到氧化磷酸化的代谢转换。研究者据此设计 MEBTHS，用 Ru nanozyme 同时清除 NO/ROS，从而促进 CD206 上升、CD86 下降，并保护 BMSC 和 endothelial cell 的再生功能。 对你的方向可借鉴的不是这个材料本身，而是逻辑：先用单细胞找疾病/材料界面的“卡点”，再设计材料去解除卡点。对于种植体周围炎、骨结合失败或软组织封闭不佳，类似卡点可能是持续 M1-like macrophage、CXCL13+ inflammatory fibroblast、S100A8/A9 neutrophil、SPP1+ osteoclast/macrophage 或 angiogenesis failure。 Result 7：BCA 未来会走向多组学、AI 和个体化材料 # 图 15 对应结果： 作者把未来分成四步：扩展 cell-material interaction data，整合成多组学 life atlas，用 AI 建立 intelligent life atlas，最后走向临床转化和个体化生物材料。图源：PMC12356410 / ScienceDirect 官方图像。 作者对未来的设想比较宏观：从单一 scRNA-seq 扩展到基因组、表观组、转录组、蛋白组、代谢组，再用 AI 预测材料植入后的细胞响应，最终发展为 patient-specific digital twin 或 virtual implantation。这个愿景目前还偏概念化，真正落地需要高质量、多中心、跨材料类型的数据标准和可复用 benchmark。 实际风险是：如果没有标准化 metadata，BCA 会变成一堆不可比较的单细胞项目。材料参数、动物模型、组织部位、取样时间、消化条件、测序平台、空间分辨率和下游算法都可能造成强批次效应。未来最需要的是标准化的 biomaterial perturbation atlas，而不仅是更多单篇研究。 机制模型 # 材料输入层 surface topography / stiffness / porosity / degradation ions coating / drug release / cytokine delivery / nanozyme / electrical stimulation 细胞响应层 immune cells: macrophage, neutrophil, T cell, dendritic cell stromal cells: fibroblast, MSC, osteoprogenitor, BMSC vascular cells: endothelial cell, pericyte 单细胞解析层 cell type composition activation or polarization state DEG and pathway activity trajectory and RNA velocity ligand-receptor communication 空间定位层 material interface fibrotic capsule vascular niche bone defect edge inflammatory lesion 材料反馈层 improve biocompatibility promote angiog Qing, Tang Bing 单位 ：中山大学附属第一医院整形外科、中山大学肿瘤防治中心 核心发现摘要 # 本研究揭示了一个全新的MAT2A代谢\"兼职（moonlighting）\"功能——通过调控HMGCS1的稳定性而非其经典代谢酶活性——介导细胞衰老与伤口微环境慢性炎症，为糖尿病等慢性难愈合伤口提供了全新的治疗靶点和仿生策略。 研究逻辑线： 糖尿病伤口 → 周细胞MAT2A下调 → OTUB1↓ → HMGCS1不稳定 → CoQ↓ → 线粒体功能障碍 → 细胞衰老 ↓ SASP分泌 + 线粒体转移 ↓ 巨噬细胞炎症训练免疫 → 慢性炎症 → 伤口不愈合 ↓ 周细胞膜包被MAT2A-saRNA纳米颗粒 → MAT2A恢复 → 伤口再生 1. 背景与科学问题 # 1.1 糖尿病伤口的临床挑战 # 糖尿病伤口是全球重大医疗问题， 5年生存率高于许多常见恶性肿瘤 是非外伤性下肢截肢的主要原因 关键病理特征：炎症性巨噬细胞（Pro-inflammatory M1 macrophage）持续浸润，替代性活化M2巨噬细胞周转受阻 1.2 研究切入点 # 糖尿病伤口中甲硫氨酸（methionine）积累，但甲硫氨酸循环中 只有MAT2A显著下调 代谢酶的\"兼职功能\"（moonlighting function）日益受到关注——代谢酶可独立于其催化活性发挥信号调控作用 1.3 核心假设 # MAT2A在周细胞（pericyte）中的下调，通过非经典途径驱动细胞衰老和巨噬细胞炎症化，最终导致糖尿病伤口慢性炎症和愈合障碍。 2. 主要结果 # Fig. 1 | 候选代谢酶筛选与MAT2A的发现 # Figure : 从GSE154556Bulk转录组数据（GSE165816 scRNA-seq交叉验证）： 糖尿病伤口vs非糖尿病伤口： 501个代谢基因下调 ，56个上调 代谢通路富集：嘌呤代谢、TRP通道炎症调节、甘油磷脂代谢等 25个候选代谢基因 在组织和单细胞层面同时下调 相关性分析锁定 MAT2A ：在周细胞中下调最显著，且与M1巨噬细胞浸润评分 负相关性最强 甲硫氨酸循环： 甲硫氨酸 → [MAT2A] → SAM → SAH → 同型半胱氨酸 ↓（下调） 糖尿病伤口中MAT2A↓，甲硫氨酸↑ 关键图注 ：MAT2A^low周细胞富集的通路包括：内皮细胞迁移负调控（NES=-2.02）、伤口愈合调控（NES=-1.96）、细胞因子响应（NES=-1.93） Fig. 2 | Mat2a条件性敲除损害伤口愈合并改变巨噬细胞表型 # Figure : 动物模型 ：Cspg4-CreERT2 × Mat2a^fl/fl（C57背景，tamoxifen诱导周细胞特异敲除） 表型验证 ： 伤口愈合速率显著减慢（Day 4/8/12/16） 血流灌注减少 表皮变薄、Ki-67↓、α-SMA↓、IL6↑ scRNA-seq分析 （MAT2A LOF vs Ctrl, 各n=3）： 67,945个细胞，27,106个表达基因 12种主要细胞类型：周细胞、角质形成细胞、T细胞、B细胞、内皮细胞、巨噬细胞、中性粒细胞、成纤维细胞等 LOF组周细胞比例下降 周细胞下调通路： 免疫细胞趋化↑，血管生成↓ 巨噬细胞重聚类：7个亚群 M1促炎亚群（Macro 1/3/5）增加 ：Ccl3↑、Il1b↑、Nlrp3↑ M2抗炎亚群（Macro 0/2/4）减少 ：C1qa↓、C1qb↓、Selenop↓ 轨迹分析确认：Il1a^hi Il1b^hi促炎巨噬细胞增多，抗炎巨噬细胞减少 Fig. 3 | MAT2A下调诱导周细胞衰老 # Figure : Mat2a敲除后周细胞的转录组变化 ： 上调通路：细胞因子/趋化因子相关 下调通路：细胞外基质重塑 GSVA分析 ：细胞衰老相关基因集显著↑，细胞凋亡通路被抑制 SenCID算法 （ senescence cell identification）：SID3最适合评估周细胞衰老 LOF组SID3评分显著高于对照组 体外实验 （siMat2a转染小鼠皮肤周细胞）： CCK-8、EdU、细胞周期：增殖↓，周期阻滞 SA-β-gal染色↑ （衰老标志） H3K9me3/SAHF染色↑ （衰老相关异染色质灶） P21↑，LaminB1↓（核形态标志） 线粒体呼吸↓，ATP↓ 数据库验证 （Aging Atlas）：MAT2A在多种衰老细胞中下调，在抗衰老处理（uridine）后上调 Fig. 4 | 衰老周细胞通过双重机制激活炎症巨噬细胞 # Figure : 旁分泌途径（SASP因子） ： Mat2a缺失→周细胞SASP因子↑（Saa3, Cxcl5, Cxcl3, MmP3, Il1b, Ccl4, Cxcl1等） 共培养实验证实：仅非接触共培养条件下，巨噬细胞促炎基因也上调 线粒体转移途径 （接触共培养效应更强）： MERCI算法检测线粒体转移信号：Control组A1(40-60%)和A3(50-60%)显著高于LOF组 衰老周细胞将受损线粒体转移给巨噬细胞 巨噬细胞获得受损线粒体→代谢重编程→炎症训练免疫（Trained Immunity） 配体-受体互作分析 ： Ccl4-Ccr5, Csf1-Csf1r, Il6-(Il6r+Il6st), C3-C3ar1, Angptl4-Sdc4 Fig. 5–6 | MAT2A通过OTUB1介导HMGCS1去泛素化稳定HMGCS1 # Figures : 机制核心 ： MAT2A与HMGCS1的直接结合 ：aa 121-250为MAT2A主要结合域，HMGCS1的N端（aa 1-186）为结合区 结合位点突变（MUT2） ：MAT2A K134/K141/K147/K149/K169位点突变→与HMGCS1互作消失 HMGCS1稳定性调控 ：WT MAT2A可在CHX处理下维持HMGCS1稳定；MUT2不能 泛素化调控 ：Mat2a敲低→HMGCS1泛素化↑；MG132（蛋白酶体抑制剂）处理可逆转 OTUB1（去泛素化酶） ： MAT2A通过招募去泛素化酶OTUB1稳定HMGCS1 Mat2a敲低→OTUB1对HMGCS1的招募↓→HMGCS1泛素化增强→蛋白酶体降解 下游效应（HMGCS1→CoQ合成） ： HMGCS1下调→ 辅酶Q（Coenzyme Q, CoQ）合成↓ →线粒体功能障碍→细胞衰老 Fig. 7–8 | 仿生纳米颗粒治疗 # Figure : 治疗策略 ： MAT2A自扩增RNA (saRNA) + 脂质纳米颗粒 (LNP) ↓ 表面包被：周细胞膜（Pericyte Membrane） ↓ 实现：精准靶向衰老周细胞 + 稳定高效表达MAT2A 结果 ： 恢复衰老周细胞中MAT2A表达 降低HMGCS1泛素化，恢复HMGCS1蛋白水平 恢复CoQ合成和线粒体功能 减轻慢性炎症巨噬细胞浸润 促进伤口再生 Fig. 9 | 机制模型 # Figure : 整体机制模型 ： 糖尿病环境 → 周细胞MAT2A表达↓ → ① OTUB1对HMGCS1的招募↓ → HMGCS1不稳定 → CoQ↓ → 线粒体功能障碍 → 细胞衰老 ② 衰老周细胞释放SASP因子 + 转移受损线粒体给巨噬细胞 → 巨噬细胞炎症训练免疫 → 慢性炎症 → 伤口不愈合 治疗 ：周细胞膜包被MAT2A-saRNA纳米颗粒 → 恢复MAT2A → 阻断上述链条 → 伤口再生 3. 实验方法 # 3.1 动物模型 # 周细胞特异性Mat2a敲除 ：Cspg4-CreERT2; Mat2a^fl/fl（tamoxifen诱导） 伤口模型：手术切除皮肤 3.2 细胞实验 # 小鼠皮肤周细胞分离（免疫磁珠+流式） Mat2a siRNA敲低 周细胞-巨噬细胞共培养（接触/非接触） 3.3 组学分析 # Bulk RNA-seq（GSE154556） scRNA-seq（GSE165816 + 自身数据） 代谢组学 3.4 关键检测 # SA-β-gal染色 SAHF（H3K9me3）染色 Seahorse线粒体呼吸检测 线粒体转移检测（MERCI算法） Co-IP、CHX、MG132实验 蛋白泛素化检测 3.5 治疗验证 # 周细胞膜包被MAT2A-saRNA LNP纳米颗粒 体内伤口愈合评估 4. 创新点与意义 # 4.1 科学发现 # 首次揭示MAT2A的代谢兼职功能 ：不依赖其经典催化活性（甲硫氨酸→SAM），而是通过结合HMGCS1招募OTUB1，稳定HMGCS1，调控CoQ合成 周细胞衰老→巨噬细胞炎症训练免疫 的跨细胞病理链条 双重机制 （SASP + 线粒体转移）介导细胞间通讯 4.2 临床转化 # 靶点新颖 ：MAT2A作为慢性炎症伤口的治疗靶点此前未被报道 仿生策略 ：周细胞膜包被纳米颗粒，实现精准靶向，避免全身副作用 自扩增RNA ：相比传统mRNA，表达更持久，剂量更低 4.3 代谢新视角 # 代谢酶的\"兼职功能\"在组织再生中的重要作用 代谢-衰老-免疫的交叉调控网络 5. 局限性 # 主要数据来自小鼠模型，临床转化仍需进一步验证 MAT2A的HMGCS1结合口袋的药物设计仍需探索 周细胞膜来源的规模化制备存在挑战 长期安全性数据尚不充分 6. 关键文献 # 方向 关键文献 糖尿病伤口巨噬细胞 主流研究（Ref 13, 20） 代谢酶兼职功能 Ref 16, 17 线粒体转移 Ref 30, 31 衰老细胞与SASP Ref 26-29 OTUB1去泛素化 - HMGCS1与CoQ Ref 48, 49（MVA通路） 抗衰老（uridine） Ref 25 SenCID衰老评分 Ref 22 MERCI线粒体转移 Ref 32 7. 附件说明 # PDF全文：Zotero ItemID 1897 所有Figure页面截图：attachments/Page_01.png ~ Page_16.png Extracted全文文本：extracted_text.txt 文献添加时间：2026-04-13 笔记整理：Claude Code","tags":["衰老/senescence","慢性炎症/chronic-inflammation","代谢酶/mat2a","伤口愈合/wound-healing","糖尿病伤口/diabetic-wound","衰老相关分泌表型/sasp","细胞衰老/senotherapy","HMGCS1","OTUB1","泛素化/ubiquitination","线粒体转移/mitochondrial-transfer","仿生纳米颗粒/biomimetic-nanoparticle","自扩增RNA/self-amplifying-RNA","代谢-moonlighting功能","单细胞测序/scRNA-seq","周细胞/pericyte","辅酶Q/CoQ","巨噬细胞极化/macrophage-polarization","蛋白去泛素化/deubiquitination","MVA通路/MVA-pathway","生物信息学分析/bioinformatics"],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.568Z","url":"literature/notes/9b11b0b07e30f7241fdb99ef.html"},{"kbId":"KB-000029","title":"T-cell immunoglobulin and mucin domain-containing protein 3-mediated immunomodulation in myeloid cells and keratinocytes in the development of severe acne","subtitle":"","summary":"本文献笔记由 Codex 根据 Zotero 条目、期刊页面和公共数据库核验结果整理。2026-05-11 已通过 Zotero local API 核验条目；PDF 原文来自重复条目 MMW5YS9F 的附件 MM6VWFLP ，已同步到本文件夹：Chen 2025 MolBiomed TIM3-重度痤疮.pdf。 这篇文章把 TIM3 从传统的 T 细胞耗竭/免疫检查点语境，转移到重度痤疮的 髓系细胞-角质形成细胞免疫调控轴 中：作者认为 TIM3 参与限制痤疮炎症，尤其","body":"本文献笔记由 Codex 根据 Zotero 条目、期刊页面和公共数据库核验结果整理。2026-05-11 已通过 Zotero local API 核验条目；PDF 原文来自重复条目 MMW5YS9F 的附件 MM6VWFLP ，已同步到本文件夹： Chen_2025_MolBiomed_TIM3-重度痤疮.pdf 。 一句话结论 # 这篇文章把 TIM3 从传统的 T 细胞耗竭/免疫检查点语境，转移到重度痤疮的 髓系细胞-角质形成细胞免疫调控轴 中：作者认为 TIM3 参与限制痤疮炎症，尤其与 TIM3+ 巨噬细胞、TIM3+ 角质形成细胞和 P. acnes 诱导炎症反应相关。 研究背景与科学问题 # 痤疮不仅是毛囊皮脂腺单位疾病，也包含明显的先天免疫和皮肤屏障异常。重度痤疮会导致瘢痕、畸形和心理负担，但其从普通炎症性痤疮发展到重度病变的免疫机制仍不清楚。 这篇文章要回答的问题是： 重度痤疮皮损中哪些细胞群体和基因模块最值得关注？ 髓系细胞，尤其巨噬细胞，是否存在能解释重度痤疮进展的关键免疫检查点？ TIM3 在重度痤疮中是促炎还是抑炎？它在角质形成细胞和髓系细胞中的作用是否一致？ 单细胞发现能否通过组织空间验证、体外细胞模型和小鼠模型形成闭环？ 样本与实验设计 # 数据来源 # 自建 scRNA-seq：West China Hospital 采集的重度痤疮和正常皮肤样本，文章数据可用性中指向 PRJCA051568 。 外部 scRNA-seq：GEO GSE175817 ，用于痤疮与正常/非皮损相关比较。 验证实验：多重免疫组化、HaCaT 角质形成细胞 TIM3 knockdown、 P. acnes 诱导的小鼠痤疮样炎症模型。 技术路线 # 重度痤疮 / 痤疮 / 正常皮肤 scRNA-seq ↓ 细胞注释与差异分析 ↓ scRNA-WGCNA 锁定巨噬细胞相关模块 ↓ 巨噬细胞特异 DEGs + MR 分析筛选候选因子 ↓ TIM3 被识别为关键免疫检查点候选 ↓ mIHC 验证 TIM3+ 髓系细胞和角质形成细胞 ↓ HaCaT knockdown 与小鼠抗 Tim3 阻断验证功能 数据集与可重复性核验 # 核验日期：2026-05-12。这里把“真正可直接下载的数据”和“只有元数据或暂未释放的数据”分开记录，避免后续再分析时误把受限/未释放数据当作公开数据。 Accession / 资源 仓库 数据类型 样本与分组信息 当前访问状态 下载/申请入口 复用备注 GSE175817 GEO / SRA / ENA 人痤疮皮损与非皮损皮肤 scRNA-seq，10X Genomics GEO 记录标题为“Single cell RNA-seq data comparing lesional (papules) and non-lesional skin biopsies of acne patients”。6 名痤疮患者，32,966 个 lesional cells 和 29,202 个 non-lesional cells；GSM 样本为 GSM5348398 到 GSM5348403 。主要细胞类型包括 lymphocytes、myeloid cells、keratinocytes、fibroblasts、endothelial cells、smooth muscle cells、melanocytes。 公开可直接下载 。GEO 显示 Public on May 31 2021；最后更新记录为 Sep 19 2024；关联 PubMed ID 35171653 、BioProject PRJNA733809 、SRA SRP321949 。 GEO 页面 ； GEO supplement 目录 ； GSE175817_RAW.tar ； BioProject PRJNA733809 ； SRA SRP321949 ； ENA file report 。 最适合立即复用。可直接做 Seurat/Scanpy 再分析，重点看 HAVCR2/TIM3、LGALS9、髓系细胞亚群和角质形成细胞炎症状态。 GSE175817 processed files GEO FTP 处理后矩阵/元数据 GSE175817_meta_donorlesional.csv.gz 、 GSE175817_meta_endothelial.csv.gz 、 GSE175817_meta_fibroblast.csv.gz 、 GSE175817_meta_keratinocyte.csv.gz 、 GSE175817_meta_lymphocyte.csv.gz 、 GSE175817_meta_myeloid.csv.gz 。 公开可直接下载 。 GEO supplement 目录 适合快速按 donor、lesionality 和主要细胞类型复查作者结论；不需要从 FASTQ 重新比对即可开始探索。 GSE175817 raw FASTQ ENA / SRA 原始测序数据 ENA file report 返回 17 个 run 条目，6 个 sample accession 和 6 个 experiment accession；总 FASTQ 大小约 335.79 GiB。示例 run 包括 SRR14691811 、 SRR14691813 、 SRR14691817 、 SRR14691823 、 SRR14691824 。 公开可直接下载 。 ENA file report TSV ；示例 FASTQ FTP： ftp.sra.ebi.ac.uk/vol1/fastq/SRR146/011/SRR14691811/SRR14691811_1.fastq.gz 和 ftp.sra.ebi.ac.uk/vol1/fastq/SRR146/011/SRR14691811/SRR14691811_2.fastq.gz 。 若要完全复现上游流程，可从 ENA/SRA 下载 FASTQ；但体量较大，通常先用 GEO processed files 更现实。 PRJCA051568 NGDC BioProject 本文作者自建的重度痤疮/正常皮肤 scRNA-seq 项目元数据入口 文章 Data availability 指向该 accession，用于本文自建数据。 当前未释放 。NGDC 页面显示“The data you are retrieving is not released in BioProject: PRJCA051568”。 NGDC BioProject PRJCA051568 这是复现本文核心发现的关键限制。后续需要定期复查释放状态，当前不能作为可下载公共数据集使用。 可直接用于再分析的下载入口 # GSE175817 GEO landing page: https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE175817 GSE175817 GEO supplement directory: https://ftp.ncbi.nlm.nih.gov/geo/series/GSE175nnn/GSE175817/suppl/ GSE175817_RAW.tar : https://ftp.ncbi.nlm.nih.gov/geo/series/GSE175nnn/GSE175817/suppl/GSE175817_RAW.tar ENA/SRA FASTQ file report for PRJNA733809 : https://www.ebi.ac.uk/ena/portal/api/filereport?accession=PRJNA733809\u0026result=read_run\u0026fields=run_accession,sample_accession,experiment_accession,fastq_ftp,fastq_bytes,fastq_md5\u0026format=tsv\u0026download=true PRJCA051568 当前仅能作为未释放状态追踪页： https://ngdc.cncb.ac.cn/bioproject/browse/PRJCA051568 主要结果精读 # Result 1 | 单细胞分析提示巨噬细胞是重度痤疮的重要免疫节点 # 作者对重度痤疮、痤疮和正常皮肤样本进行整合分析后识别出多个主要细胞群。虽然痤疮是一种涉及角质形成细胞、免疫细胞、皮脂腺环境和微生物刺激的复杂疾病，但在本研究中，巨噬细胞相关模块在 scRNA-WGCNA 中表现突出。 这一点很关键：作者不是单纯从全部细胞中找差异基因，而是先通过模块和细胞群体层面判断“哪个细胞群最可能解释疾病严重程度”，再聚焦巨噬细胞特异差异基因。 Result 2 | TIM3 被筛选为重度痤疮相关免疫检查点 # 作者将巨噬细胞特异 DEGs 与孟德尔随机化分析结合，筛选出 TIM3 作为潜在关键基因。这个设计的优势是试图把表达差异与因果推断联系起来，避免只停留在相关性层面。 需要注意的是，MR 结果对工具变量、暴露数据和表型定义非常敏感，因此 TIM3 的“因果”定位仍需要谨慎理解。本文后续通过组织染色、细胞敲低和小鼠阻断来补强机制链条。 Result 3 | TIM3 在不同细胞中的变化不一致 # mIHC 结果显示重度痤疮组织中： TIM3+ 中性粒细胞有下降趋势； TIM3+ 巨噬细胞增加，尤其 TIM3+ M2 巨噬细胞增加； TIM3+ 角质形成细胞减少。 这提示 TIM3 不是一个简单的“高表达等于抑炎”或“低表达等于促炎”的单向指标，而可能代表不同细胞类型中的免疫制动状态重排。 Result 4 | TIM3 对角质形成细胞炎症反应具有抑制作用 # 在 HaCaT 细胞中敲低 TIM3 后， P. acnes 诱导的促炎因子分泌上升。这个结果支持 TIM3 在角质形成细胞中具有抑制炎症放大的作用。 从皮肤病机制角度看，这一点有价值：角质形成细胞不只是屏障细胞，也参与炎症识别、趋化因子分泌和免疫细胞招募。 Result 5 | 阻断 Tim3 会加重小鼠痤疮样炎症 # 作者在 P. acnes 诱导的小鼠模型中使用 anti-Tim3 抗体阻断 Tim3 信号，结果炎症加重。这个动物实验与 HaCaT knockdown 方向一致，支持 TIM3 在该模型中偏保护/免疫抑制。 Claim # TIM3 是重度痤疮中值得关注的免疫调控节点，可能通过巨噬细胞极化、角质形成细胞炎症反应和 GAL9-TIM3 相关细胞互作共同影响疾病严重程度。 Method # scRNA-seq 整合分析 scRNA-WGCNA 巨噬细胞特异 DEGs Mendelian randomization CellChat 细胞通讯分析 多重免疫组化 HaCaT siRNA knockdown P. acnes 诱导小鼠炎症模型 Evidence # 单细胞层面识别巨噬细胞相关模块。 MR 与巨噬细胞 DEGs 交集筛到 TIM3。 mIHC 显示 TIM3+ 巨噬细胞、TIM3+ M2 巨噬细胞和 TIM3+ 角质形成细胞在重度痤疮中发生重排。 HaCaT 中 TIM3 knockdown 增强 P. acnes 诱导炎症。 小鼠中 anti-Tim3 阻断加重痤疮样炎症。 Limitation # 关键自建重度痤疮 scRNA-seq 数据 PRJCA051568 当前未释放，独立复现受限。 MR 部分需要进一步核查工具变量和暴露-结局数据来源，不能把筛选结果直接等同于强因果证据。 HaCaT 细胞和小鼠 P. acnes 模型只能模拟部分痤疮炎症环境，与人类皮脂腺毛囊微环境仍有差距。 TIM3 在巨噬细胞、角质形成细胞和中性粒细胞中的方向性不同，后续需要细胞类型特异的功能实验。 Direct relevance to repo # 这篇适合用于“痤疮/皮肤炎症单细胞公开数据”方向： 可直接复用 GSE175817 分析髓系细胞、角质形成细胞、淋巴细胞和皮损状态差异。 可把 TIM3、LGALS9/GAL9、M2 macrophage、keratinocyte inflammatory response 作为候选机制轴。 若做公共数据检索表，应把 GSE175817 标为公开可下载，把 PRJCA051568 标为未释放/不可直接下载。 Relation to other papers # 与 Wang_2026_角质形成细胞-NK细胞-痤疮单细胞 互补：本篇强调 TIM3-髓系细胞-角质形成细胞免疫制动；Wang 2026 强调角质形成细胞屏障异常和 NK 细胞耗竭/凋亡。 两篇共同支持“痤疮进展不是单一细菌刺激，而是免疫-屏障-细胞互作失衡”的框架。 下一步 # 用 GSE175817 做一次可复现的 Scanpy/Seurat 再分析，重点看 HAVCR2/TIM3、LGALS9、巨噬细胞亚群和角质形成细胞炎症因子。 定期复查 PRJCA051568 是否释放。 与 HRA008189 申请状态一起整理成痤疮单细胞数据集可用性表。","tags":["痤疮","重度痤疮","TIM3","巨噬细胞","角质形成细胞","单细胞转录组","免疫检查点"],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.566Z","url":"literature/notes/7bb1e3039d7442ee3dc126cf.html"},{"kbId":"KB-000028","title":"人类皮肤成纤维细胞的单细胞与空间基因组学图谱:跨组织共享的疾病相关成纤维细胞亚型","subtitle":"A single-cell and spatial genomics atlas of human skin fibroblasts reveals shared disease-related fibroblast subtypes across tissues","summary":"Fibroblasts sculpt the architecture and cellular microenvironments of various tissues. Here we constructed a spatially resolved atlas of human skin fibroblasts from healthy skin and 23 skin diseases, with comparison to 14 cross-tissue diseases. We define six major skin fibroblast subtypes in health and three that are disease-specific. We characterize two fibroblast subtypes further as they are conserved across tissues and are immune-related. The first, F3: fibroblastic reticular cell-like fibroblast (CCL19+CD74+HLA-DRA+), is a fibroblastic reticular cell-like subtype that is predicted to maintain the superficial perivascular immune niche. The second, F6: inflammatory myofibroblasts (IL11+MMP1+CXCL8+IL7R+), characterizes early human skin wounds, inflammatory diseases with scarring risk and cancer. F6: inflammatory myofibroblasts were predicted to recruit neutrophils, monocytes and B cells across multiple human tissues. Our study provides a harmonized nomenclature for skin fibroblasts in health and disease, contextualized with cross-tissue findings and clinical skin disease profiles.","body":"英文标题 : A single-cell and spatial genomics atlas of human skin fibroblasts reveals shared disease-related fibroblast subtypes across tissues 期刊 : Nature Immunology, 2025, Volume 26, pages 1807–1820 通讯作者 : Mohammad Lotfollahi, Muzlifah Haniffa (Wellcome Sanger Institute / Cambridge Stem Cell Institute) 数据资源 : https://cellatlas.io/studies/skin-fibroblast 一、背景与研究意义 # 1.1 疾病背景 # 成纤维细胞在塑造组织结构和免疫细胞微环境中起关键作用,是皮肤真皮层的主要间质细胞,负责合成细胞外基质(ECM)蛋白、维持组织结构以及调节伤口愈合过程。 然而,由于以下原因,解析成纤维细胞亚型异质性一直具有挑战性: 缺乏 独特的表面标志物 体外培养时倾向于获得 活化表型 既往研究 未在空间上解析 组织微解剖位置 很少有研究 同时在皮肤和跨人体组织的多种疾病条件下 研究成纤维细胞 1.2 科学问题 # 皮肤中成纤维细胞的组成和功能是什么? 它如何在一系列疾病(炎症、癌症和纤维化/瘢痕)中发生变化? 这些群体与其他人体组织的成纤维细胞有什么关系? 1.3 研究意义 # 本研究: 整合已发表的大规模 scRNA-seq 数据集(健康人类皮肤和23种皮肤疾病) 利用两种不同模态生成空间转录组学数据(10x Visium + 10x Xenium) 构建高分辨率、空间解析的图谱,包含 超过35万个成年人皮肤成纤维细胞 基于基因表达谱和空间位置提供皮肤成纤维细胞的 共识注释 与其他健康和疾病人体组织中的成纤维细胞数据相关联 二、整体研究思路(技术路线) # 2.1 数据规模 # 项目 数值 整合数据集 32个scRNA-seq数据集 捐献者 251位 总细胞 210万 最终成纤维细胞 357,276 (质控后) 皮肤疾病 23种 跨组织疾病 14种 跨组织整合总细胞 ~580万(→ ~100万成纤维细胞) 2.2 技术栈 # 步骤 方法/工具 比对 STARsolo (GRCh38-2020-A) 环境RNA校正 CellBender v.0.3 双细胞去除 scrublet (\u003e0.3阈值) 整合 scVI (零膨胀负二项,2层,30维潜空间) 聚类 Leiden (resolution 0.1), k-NN (k=30) 可视化 UMAP (PAGA初始化) 转录因子活性 decoupler (get_collectri + run_ulm) 通路富集 GSEAPY + GO_Biological_Process_2023 空间反卷积 cell2location (v.0.1.3) 空间单细胞 10x Xenium 5000-基因 + scVI 疾病映射 scPoli (深度学习模型) 轨迹分析 PAGA + CellRank2 速度核 龛位识别 NicheCompass 配体-受体分析 receptor-ligand数据库 2.3 命名框架 # 本研究的核心贡献是建立了皮肤成纤维细胞的共识命名法(F1-F8) ,整合了既往文献中分散的多种描述。 三、健康皮肤的六大亚型(F1-F6) # 3.1 命名与空间位置总览 # 亚型 全称 空间位置 关键标志基因 核心功能 F1 Superficial (papillary) 浅层(乳头层) 上皮附近乳头层 COL13A1, COL18A1, COL23A1, APCDD1, WIF1, NKD2 与表皮通过Wnt互作维持身份 F2 Universal (reticular) 普遍(网状层) 网状真皮深层 PI16, CD34, MFAP5 ( KLF5 ) 推测为前体细胞;含F_Fascia亚组 F2/3 Perivascular 血管周围 浅层与深层血管周围 PPARG (部分) 与脂肪细胞分化相关 F3 Fibroblastic reticular cell (FRC)-like 浅层血管周围,临近免疫细胞 CCL19, CD74, HLA-DRA, CXCL12, CH25H, IL33, IL15, TNFSF13B, VCAM1 跨组织保守的免疫调节型 F4 Hair follicle-associated 毛囊相关 毛囊周围 ASPN, COL11A1 三个亚簇(DS / TNN+COCH+ / DP_HHIP+) F5 Schwann-like 施万样 神经结构周围 SCN7A, FMO2, FGFBP2, OLFML2A NGFR +(神经)与 RAMP1 +(汗腺) 3.2 关键发现 # 整合32个数据集、251位捐献者,鉴定出 六种主要成纤维细胞亚型 通过 Visium + Xenium 双重空间方法验证亚型存在 每个亚型占据 独特的微解剖生态位 区域性成纤维细胞支持 不同生态位功能 四、疾病适应性和疾病特异性亚型(F6-F8 + 适应性) # 4.1 三大疾病特异性亚型 # 亚型 全称 关键标志基因 临床分布 F6 Inflammatory myofibroblasts 炎症性肌成纤维细胞 IL11+ MMP1+ CXCL8+ IL7R+ 早期伤口、瘢痕风险炎症病、癌症中富集; 跨组织保守 F7 Myofibroblasts 肌成纤维细胞 ACTA2, COL3A1, POSTN, LRRC15, ADAM12 瘢痕风险 + 已形成纤维化中持续存在; 终末分化态 F8 Fascia-like myofibroblasts 筋膜样肌成纤维细胞 F_Fascia 相关基因 + ACTA2+COL8A1+SFRP4+ 主要富集于 Dupuytren挛缩 4.2 两大疾病适应性亚型 # 亚型 基础亚型 特征标志基因 功能意义 F1-like (再生型) F1: superficial CRABP1, CYP26B1, WNT5A 上调与再生相关基因;伤口诱导毛囊新生的来源 F3-like (免疫调节型) F3: FRC-like CXCL9 和/或 ADAMDEC1 FRC激活态标志; CXCL9-CXCR3 招募T细胞 4.3 PROGENy通路差异 # 亚型 显著上调通路 F6 JAK-STAT信号 (高)、 缺氧信号Hypoxia (高) F7/F8 TGFβ信号 (高)、 ECM相关 (高), PIEZO2 表达(机械转导感受器) 五、主要结果(Result 1-7) # Result 1: 健康皮肤6亚型的鉴定与空间验证 # 核心发现 : 基于scVI整合35.7万成纤维细胞,鉴定出F1-F6六亚型 10x Visium + 10x Xenium双重空间验证 每个亚型占据独特微解剖生态位 关键图表 : Fig. 1 : UMAP + 标志基因Dotplot + 命名框架总结 Fig. 2 : Visium + Xenium空间定位 + 微环境注释 Result 2: 疾病适应性和疾病特异性亚型 # 核心发现 : scPoli映射出3个疾病特异性(F6/F7/F8)+ 2个疾病适应性(F1-like、F3-like)亚型 F6代表更具炎症性的中间状态(JAK-STAT + 缺氧) F7/F8是终末分化的纤维化状态(TGFβ + ECM) 关键图表 : Fig. 3 : scPoli嵌入UMAP + 标志基因Dotplot + PROGENy通路评分 Result 3: 成纤维细胞组成特征区分瘢痕风险 # 核心发现 : 23种皮肤病按瘢痕风险分为三组: 低风险 / 中等风险 / 已形成纤维化 F6是瘢痕风险组独有 ,低风险和已形成纤维化组中均不存在 F7是已形成纤维化持续存在 随机森林分类器: F6和F7是预测瘢痕风险类别最重要的两个亚型 免疫荧光验证: LRRC15仅在伴瘢痕风险的炎症(化脓性汗腺炎)中表达 ,不在AD中 关键图表 : Fig. 4 : 各疾病亚型比例 + LRRC15/ADAM12 IF验证 + Xenium 5k空间验证 Result 4: 肌成纤维细胞的起源 # 核心发现 : F6是 F1 → F7终末肌成纤维细胞分化的中间状态 F7可由两条轨迹产生:①F2直接;②F1 → F6 → F7 伤口数据集(58,823细胞)时序验证:Day 0(无) → Day 1(少量F6) → Day 7(F6主导) → Day 30(F7主导) 与小鼠体内谱系追踪一致(Correa-Gallegos 2023 Nature;Driskell 2013 Nature) 关键图表 : Fig. 5 : 速度伪时间 + 有向PAGA + CellRank2 + 伤口数据集时序 Result 5: 跨组织疾病成纤维细胞群体 # 核心发现 : ~580万细胞跨组织整合(皮肤、肺、肠、滑膜、心脏、鼻黏膜、子宫内膜) ~100万成纤维细胞进行下游分析 F3 FRC-like跨组织保守 :在肺(COVID-19、ILD)、肠道(IBD的T区网状细胞)中均发现 F6 inflammatory myofibroblasts跨组织保守 :在IBD、肺癌、皮肤伤口/瘢痕风险炎症、皮肤癌中均发现 统一了皮肤与跨组织成纤维细胞命名 关键图表 : Fig. 6 : 既往跨组织研究对应热图 + 跨组织UMAP + Dotplot Result 6: 跨组织成纤维细胞调节皮肤免疫生态位 # 核心发现 : F3 通过CCL19-CCR7 / CXCL12-CXCR4维持T细胞龛位(CCR7+ MigDCs + CXCR4+ T cells) F6 通过多组趋化因子广谱招募免疫细胞: 中性粒细胞:CXCL5/6/8-CXCR2, CSF3-CSF3R 单核/巨噬细胞:CCL5/26-CCR1, CSF3-CSF3R B细胞:CXCL13-CXCR5 F6在IBD中与临床炎症评分线性相关 (95% CI) F6可作为跨组织疾病活动度生物标志物 关键图表 : Fig. 7 : 跨组织比例 + 标志基因Dotplot + 龛位识别 + 细胞通讯分析 + IBD线性回归 Result 7: 成年F3 FRC-like的发育起源 # 核心发现 : 成年皮肤F3 FRC-like可能 起源于产前 CCL19 + LTo(淋巴组织组织者)样细胞 产前皮肤 CCL19 +细胞与产前肠道mLTo细胞 共聚类 F3在 人类皮肤中独特富集 (小鼠皮肤中相对罕见)——解释了为何人类皮肤具有更复杂的血管周围免疫龛位 LTo程序在 化脓性汗腺炎 中显著激活( CXCL13, FDCSP )→ 与该病中TLS形成相关 CXCL9/ADAMDEC1+ F3-like代表 活化的FRC状态 ,通过 CXCL9-CXCR3 招募T细胞 关键图表 : Fig. 8 : 产前+成年皮肤整合 + 产前皮肤+肠道整合 + 物种对比 六、机制模型: F3 与 F6 的免疫调节功能对比 # F3: FRC-like (跨组织保守) ├── CCL19 → CCR7 → 迁移性树突状细胞 ├── CXCL12 → CXCR4 → T细胞亚群 ├── IL33/IL15/TNFSF13B/VCAM1 → 维持免疫细胞存活 └── CD74 + MHC-II → 抗原呈递 功能:维持浅层血管周围免疫龛位(T细胞-DC互作) F6: Inflammatory Myofibroblasts (跨组织保守) ├── CXCL5/6/8 → CXCR2 → 中性粒细胞 ├── CSF3 → CSF3R → 中性粒细胞 ├── CCL5/26 → CCR1 → 单核/巨噬细胞 ├── CXCL13 → CXCR5 → B细胞 └── MMP1/MMP3 → 组织重塑以促进免疫细胞浸润 功能:广谱招募免疫细胞跨组织 中间分化轨迹(F1 → F6 → F7)是瘢痕形成核心路径 七、与课题方向的相关性分析 # 7.1 对瘢痕疙瘩/硬皮病研究的启示 # F6 → F7轨迹可作为治疗靶点 :如果在瘢痕疙瘩或硬皮病中 阻断F6 → F7转化 ,可能预防瘢痕形成 F1 → F6 → F7是核心瘢痕形成路径 :F1浅层成纤维细胞是F6的前体 → 浅层成纤维细胞活化可能是关键早期事件 HS(化脓性汗腺炎)是高瘢痕风险模型 :F6签名最高,可作为研究瘢痕疙瘩前期状态的参考模型 Wnt通路在F1/F2中起关键作用 :APCDD1、WIF1、NKD2等Wnt抑制剂 → 调控表皮-真皮互作 → 影响瘢痕形成 7.2 与课题组现有课题方向的对接 # 课题方向 可借鉴方法/内容 HS找靶点通路+皮肤单细胞marker F6趋化因子网络(JAK-STAT、缺氧)和免疫招募机制是核心 PMT周细胞+FB 本研究已将周细胞和施万样F5区分;周细胞与F2/3的关系值得深入 瘢痕共病-多组学-MR-GWAS F6/F7的核心基因(IL11, CXCL8, MMP1, POSTN, LRRC15, ADAM12)是潜在GWAS富集基因 皮肤cGVHD HIF1a-PI3Kd-IL13轴 F6中缺氧信号显著上调 → HIF通路与F6功能可能直接关联 皮肤纤维化MD模拟 F1 → F6 → F7轨迹可作为MD模拟的分化路径 CAR-TREM2巨噬细胞治疗瘢痕 F6招募单核/巨噬细胞机制可能与TREM2+巨噬细胞表型相关 7.3 核心可借鉴资源 # 数据资源 : https://cellatlas.io/studies/skin-fibroblast(交互式数据探索) 共识命名法 :F1-F8框架可直接应用于自己的研究 关键标志基因清单 : F3 :CCL19/CD74/HLA-DRA/IL33/IL15/TNFSF13B/VCAM1 F6 :IL11/MMP1/CXCL8/IL7R/CXCL5/CXCL13 F7 :LRRC15/ADAM12/POSTN/COL3A1/ACTA2 八、讨论与结论 # 8.1 核心发现 # 共识命名框架 :首次定义皮肤成纤维细胞的F1-F8分类,统一既往分散描述 跨疾病 × 跨组织整合 :23种皮肤病 + 14种跨组织疾病,~580万细胞 空间分辨验证 :Visium + Xenium双重验证 轨迹分析确定起源 :F1 → F6 → F7是瘢痕形成核心路径 发育起源追溯 :成年F3可能源自产前LTo样细胞 临床转化价值 :F6与IBD临床评分线性相关,可作为跨组织生物标志物 物种差异揭示 :F3在人类皮肤独特富集,解释人类皮肤复杂免疫结构 8.2 研究亮点 # 数据规模前所未有(35.7万成纤维细胞,\u003e210万原始细胞) 多模态整合(scRNA-seq + 空间转录组学 + 跨组织) 命名学共识贡献 临床-基础紧密联系(瘢痕风险分层、IBD生物标志物) 8.3 研究局限性(基于原文推断) # 部分空间数据样本量较小(Visium: n=1 皮损型AD + n=2 非皮损型AD) 缺乏直接的谱系追踪(仅基于计算推断 + 伤口时序验证) 跨组织比较的细胞类型分辨率受限(部分组织数据基因数\u003c20k) 九、关键图表概览 # 9.1 论文Figure对应主题 # Figure 主题 关键方法/发现 Fig. 1 健康6亚型鉴定 UMAP + 标志基因Dotplot Fig. 2 空间定位与生态位 Visium + Xenium双重验证 Fig. 3 疾病适应/特异性 scPoli + PROGENy通路 Fig. 4 瘢痕风险分层 比例分析 + LRRC15 IF + Xenium Fig. 5 肌成纤维细胞起源 PAGA + CellRank2 + 伤口时序 Fig. 6 跨组织成纤维细胞 整合UMAP + Dotplot Fig. 7 免疫生态位调控 NicheCompass + 细胞通讯 + IBD回归 Fig. 8 F3发育起源 产前整合 + 物种对比 9.2 适合深度阅读的图表 # Fig. 5e :F1 → F6 → F7分化轨迹示意(瘢痕形成机制) Fig. 7f :F3/F6免疫调节机制示意图(细胞-细胞通讯) Extended Data Fig. 1a :全部标志基因 Extended Data Fig. 6b :随机森林分类器特征重要性 十、参考文献(主要) # 10.1 论文中引用的核心文献 # Correa-Gallegos et al. Nature 623, 792–802 (2023) — CD201+筋膜前体细胞 Driskell et al. Nature 504, 277–281 (2013) — 皮肤发育修复中成纤维细胞谱系 Tsukui, Wolters \u0026 Sheppard Nature 631, 627–634 (2024) — 肺泡成纤维细胞谱系 Liu et al. Cell Stem Cell 32, 479–498.e8 (2024) — 人类皮肤伤口愈合时空路线图 Gopee et al. Nature 635, 679–689 (2024) — 产前皮肤图谱 Elmentaite et al. Nature 597, 250–255 (2021) — 肠道发育图谱 Buechler et al. Nature 593, 575–579 (2021) — 小鼠跨组织成纤维细胞图谱 Birk et al. Nature (2025) — NicheCompass Dominguez et al. Cancer Discov. (2020) — LRRC15作为肌成纤维细胞标志 10.2 与本笔记相关的课题文献 # Vollmers 2026 NI 皮肤纤维化-成纤维细胞-巨噬细胞 Buechler 2021 Nature 跨组织成纤维细胞图谱 Gao 2024 Cancer Cell 跨组织成纤维细胞图谱 Korsunsky 2022 Med 跨组织病理FB 附录: 主要缩略语表 # 缩写 全称 中文 scRNA-seq Single-cell RNA sequencing 单细胞RNA测序 scVI Single-cell Variational Inference 单细胞变分推断 scPoli Prototype meta-learning scRNA-seq model 原型元学习模型 UMAP Uniform Manifold Approximation and Projection 统一流形近似与投影 PAGA Partition-based Graph Abstraction 基于分区的图抽象 FRC Fibroblastic Reticular Cell 成纤维网状细胞 LTo Lymphoid Tissue organizer 淋巴组织组织者 mLTo mesenchymal LTo 间充质LTo TLS Tertiary Lymphoid Structures 三级淋巴结构 iCAF inflammatory Cancer-Associated Fibroblasts 炎症性癌症相关成纤维细胞 myoCAF myofibroblastic Cancer-Associated Fibroblasts 肌成纤维细胞性癌症相关成纤维细胞 HS Hidradenitis Suppurativa 化脓性汗腺炎 AD Atopic Dermatitis 特应性皮炎 IBD Inflammatory Bowel Disease 炎症性肠病 ILD Interstitial Lung Disease 间质性肺病 DS Dermal Sheath 真皮鞘 DP Dermal Papilla 真皮乳头 HVG Highly Variable Gene 高变基因 DEGs Differentially Expressed Genes 差异表达基因 UMI Unique Molecular Identifier 唯一分子标识符 CGRP Calcitonin Gene-Related Peptide 降钙素基因相关肽 MHC Major Histocompatibility Complex 主要组织相容性复合体 DRESS Drug Reaction with Eosinophilia and Systemic Symptoms 伴嗜酸性粒细胞增多和全身症状的药物反应 SCLE Subacute Cutaneous Lupus Erythematosus 亚急性皮肤型红斑狼疮 DLE Discoid Lupus Erythematosus 盘状红斑狼疮 VE Vascular Endothelium 血管内皮 本笔记由 WorkBuddy 基于 Nature Immunology 2025 论文逐Result精读生成,2026-08-04 同步至工作目录和 Obsidian vault。","tags":["fibroblast","scRNA-seq","spatial transcriptomics","skin atlas","FRC-like","inflammatory myofibroblast","scarring risk","cross-tissue","single-cell","skin disease","wound healing","immune niche","myofibroblast","CCL19","IL11","hidradenitis suppurativa"],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.565Z","url":"literature/notes/5f208a97d7bba36e0fe1c140.html"},{"kbId":"KB-000027","title":"骨桥蛋白减轻硅胶植入物的异物反应","subtitle":"Osteopontin attenuates the foreign-body response to silicone implants","summary":"Silicone implants are widely used in plastic and reconstructive surgery, but their efficacy is limited by the foreign-body response (FBR), which causes capsular contracture, implant failure, and secondary surgeries. Acellular dermal matrices (ADMs) reduce the FBR clinically, but the molecular mechanism is unclear. Here we show that osteopontin (SPP1) secreted by monocyte/macrophage clusters adjacent to the ADM is both necessary and sufficient to attenuate the FBR to silicone implants, and that SPP1 acts via CD44 receptor signalling and upregulation of matrix metalloproteinase 9. Sustained local delivery of SPP1 via injectable, self-healing polymer-nanoparticle hydrogels phenocopies the protective effect of ADMs in both immunocompetent and SPP1-knockout mice, suggesting a potential strategy to mitigate the FBR without the need for ADMs.","body":"英文标题 : Osteopontin attenuates the foreign-body response to silicone implants 期刊 : Nature Biomedical Engineering, 2025, Volume 9, Issue 8, Pages 1254–1275 (Epub 2025-03-24) DOI : 10.1038/s41551-025-01361-4 共同第一作者 : Michelle F. Griffin, Jennifer B. Parker 通讯作者 : Arash Momeni, Derrick C. Wan, Michael T. Longaker 所属机构 : Stanford University School of Medicine(整形与重建外科 / 干细胞生物学与再生医学研究所) PMID : 40128393 | PMCID : PMC12768301 一、研究背景与问题 # 1.1 植入物异物反应(FBR)问题 # 植入式医疗器械市场2021年约 $1200亿 ,预计4年内增至 $1683亿 所有生物植入物都受 异物反应(FBR) 限制: 慢性炎症 → 异物巨细胞形成 → 纤维包囊 病理性FBR可导致:植入物失效、继发感染、软组织畸形、需再次手术取出 1.2 ADM在乳房重建中的应用 # 脱细胞真皮基质(ADM) 在乳房重建中广泛使用,临床显示可降低包膜挛缩率 但ADM如何减轻FBR的 分子机制 一直未知 现有研究主要集中在TGF-β、TRPV4-Rac1等机械传导通路 1.3 研究问题 # ADM是如何在分子水平上减弱硅胶植入物异物反应的?能否找到可替代ADM的分子治疗策略? 二、研究设计与方法 # 2.1 独特的临床样本模型(配对设计) # 特征 描述 患者来源 接受 两期组织扩张器乳房重建 的患者 样本类型 同一患者 、 同一扩张器 上获取的配对标本 Native capsule 与硅胶扩张器直接接触形成的包膜 ADM capsule 与ADM包裹区域接触形成的包膜 采样距离 距ADM边界≥2cm,避免组织重叠 采样位置 胸大肌后侧(保证灌注一致性) 配对样本设计的优势 : 完美消除个体差异混杂变量 2.2 技术路线 # Human patient-matched capsule (n=10) ├── 组织学:H\u0026E、Masson三色、弹性纤维染色、天狼星红 ├── 蛋白质组学:Luminex多重免疫分析(42个细胞因子) ├── scRNA-seq(10x Genomics) └── CODEX空间蛋白组学(31个标记物) ↓ 发现SPP1/Osteopontin Mouse dorsal implant model ├── WT C57BL/6J: mNative vs mADM ├── Spp1 KO mouse: 验证SPP1必要性 ├── SPP1-loaded PNP hydrogel: 验证SPP1充分性 └── scRNA-seq, 组织学, IHC 2.3 PNP水凝胶系统 # 聚合物-纳米颗粒(PNP)水凝胶 可注射、自愈合、持续释放 SPP1半衰期约 16天 (体外37°C) 剂量: 15μg SPP1/100μl 三、核心发现 # Finding 1: ADM改变FBR包囊表型 # 指标 Native capsule ADM capsule 统计 胶原密度 更高(致密) 更低(疏松多孔) *P=0.0122 弹性纤维密度 0.10 2.0 ****P\u003c0.0001 ECM超微结构(294个参数) 致密纤维化 更具弹性 UMAP显著分离 关键解读 : ADM包膜不仅是胶原少,更是ECM成分和结构的整体性改变——弹性纤维增多使组织更具弹性,可能解释ADM降低包膜挛缩率的临床现象。 Finding 2: ADM改变免疫微环境 # Luminex多重免疫分析显著升高的因子 : SDF-1α/β (mean diff 137.5, **P\u003c0.0096) CXCL10 (mean diff 3,114, **P\u003c0.0066) IL-1α (mean diff 15, *P\u003c0.0426) Finding 3: SPP1是ADM capsule中最高表达的基因之一 # scRNA-seq : ADM capsule的monocyte/macrophage cluster中SPP1显著上调 CellChat分析 : ADM中SPP1信号通路在monocyte/macrophage→fibroblast→endothelial间增强 免疫染色验证 : ADM capsule中CD11c+细胞共表达SPP1显著增多(***P\u003c0.001) COL1与SPP1负相关 : SPP1高表达区域COL1表达低 Finding 4: CODEX空间蛋白组学揭示不同髓系亚群 # ADM包裹中Myeloid 1和Myeloid 3增多 (均高表达SPP1) Native capsule中Myeloid 2增多 (高表达YAP,促纤维化) Myeloid 2与平滑肌细胞在Native中强互作(与挛缩相关) 空间互作网络:ADM中Myeloid 1/3倾向于与CD4 T细胞和成纤维细胞互作 Finding 5: 小鼠模型验证——结论成立 # 小鼠模型完全复现人类发现 : mADM capsule厚度显著小于mNative(****P\u003c0.0001) mADM胶原密度显著降低(****P\u003c0.0001) 小鼠scRNA-seq也显示SPP1在ADM monocyte中上调 CellChat揭示mADM中SPP1信号通路增强(含巨噬细胞) Finding 6: SPP1 Knockout完全消除ADM保护效应 # Spp1 KO小鼠实验 : 组别 包膜厚度(μm) 胶原密度(%) KO mNative 47.5 ± 7.9 98.0 ± 1.4 KO mADM 48.9 ± 12.9 (NS) 96.8 ± 3.3 (NS) KO +SPP1水凝胶 20.4 ± 4.3 (****P\u003c0.0001) 54.2 ± 28.5 (***P\u003c0.001) 结论 : ADM的保护效应在SPP1敲除鼠中完全消失 → SPP1是ADM减弱FBR的必要因子 Finding 7: SPP1单独给药即足以模拟ADM效应 # WT小鼠SPP1补充实验 : 组别 包膜厚度(μm) 胶原密度(%) α-SMA mNative -SPP1(对照) 高 高 高 mADM 显著降低 显著降低 降低 mNative +SPP1(水凝胶) 与ADM相当 与ADM相当 降低 结论 : SPP1持续释放可完全替代ADM → SPP1单独足以上调以减弱FBR Finding 8: 潜在机制——SPP1-CD44-MMP9轴 # SPP1有两种已知受体:整合素αvβ3 和 CD44 整合素αvβ3 : 两个亚基在human monocyte/macrophage中仅部分表达(ITGAV低,ITGB3仅cluster 2) CD44 : 在所有monocyte/macrophage亚群中广泛表达(RNA + 蛋白水平验证) MMP9 (SPP1-CD44下游靶点): ADM capsule monocyte/macrophage中显著高表达(logFC 1.57, adj P=6×10⁻¹⁰) 免疫荧光验证MMP9蛋白水平升高(*P\u003c0.0287) 推测机制通路 : ADM → ↑SPP1(osteopontin) from monocytes/macrophages → binds CD44 → ↑MMP9 → ECM remodeling, ↓ fibrosis → ↓ collagen deposition, ↑ elasticity 四、研究局限 # 材料限制 : 仅使用硅胶(PDMS)植入物,不清楚对陶瓷、钛、聚乙烯等其他生物材料是否有效 物种差异 : ADM为人尸体来源,在小鼠中存在物种特异性糖基化修饰的可能影响 样本设计 : 所有患者均接受ADM包裹,无法获取真正\"无ADM对照\"的同一患者标本 信号串扰 : Native与ADM包膜在同一个扩张器上,可能存在信号相互干扰 CODEX局限 : 仅31个marker,髓系细胞区分不够精细(CD45/CD68/CD11c对巨噬细胞/单核细胞/树突状细胞特异性不足) 小动物模型 : 安全性和剂量优化需进一步转化研究 SPP1双面性 : SPP1在肿瘤中与不良预后相关,在特定器官纤维化中也表现为促纤维化作用,存在context-dependent效应 五、临床意义与展望 # 潜在治疗策略 : SPP1重组蛋白缓释水凝胶可替代ADM,为不适用ADM的患者提供新选择 超越乳房重建 : 可扩展到起搏器、骨科植入物、人工关节等其他植入器械的FBR防治 关键待解决问题 : SPP1上调的 上游驱动因素 是什么?(ECM stiffness? 特定细胞因子?) SPP1对其他材料(金属、陶瓷、聚氨酯)是否同样有效? 如何实现植入物表面直接释放SPP1(而非水凝胶注射)? SPP1在不同组织和器官中促再生vs促纤维化的边界在哪里? 六、方法论亮点 # 配对样本设计 : 同一患者、同一扩张器、不同区域 → 完美消除个体差异混杂变量 多模态验证 : 从人类组织学→蛋白组→单细胞转录组→空间蛋白组→小鼠KO验证→回补实验,形成完整证据链 Cross-species验证 : 人→鼠,再从小鼠scRNA-seq反向验证人数据 两个独立KO实验 : SPP1 KO鼠+ADM消除效应,SPP1补充恢复效应 → 严格的因果验证 七、关键图表总结 # 图号 内容 Fig 1 人类ADM vs Native包囊组织学(H\u0026E/三色/弹性纤维/ECM超微结构) + Luminex细胞因子 Fig 2 人类scRNA-seq显示SPP1在ADM单核/巨噬中上调,CellChat增强SPP1信号 Fig 3 CODEX空间蛋白组:3种髓系亚群、SPP1+ Myeloid 1/3在ADM中增多 Fig 4 小鼠模型复现:ADM减少包膜厚度和胶原密度 Fig 5 小鼠scRNA-seq:SPP1在ADM单核/巨噬中上调,CellChat增强 Fig 6 核心功能实验 :Spp1 KO → ADM保护消失;SPP1水凝胶 → 恢复保护 Extended Data 额外细胞因子、CD44表达、MMP9验证、毒性分析等 八、延伸思考(与课题相关性) # 对于课题:异物反应/纤维化调控 → SPP1通路 SPP1作为FBR负调控因子 : 本研究首次在人体配对样本中证明SPP1是FBR的attenuator,而非promoter 区别于传统认知 : 以往文献多认为SPP1促纤维化(肝、肺、肾),本研究提示其作用具有组织/情境依赖性 Myeloid cell分群的价值 : CD11c+CD44+SPP1+ vs CD11c+YAP+的髓系亚群对FBR结局的不同贡献 可探索的方向 : 在 其他纤维化模型 (如皮肤瘢痕、增生性瘢痕)中验证SPP1-CD44-MMP9通路 探索SPP1上游的机械力/ECM stiffness调控机制 SPP1是否通过调控单核细胞募集/极化来影响FBR? 与YAP信号的交叉对话:YAP在Myeloid 2中高表达,与SPP1+亚群互斥,是否存在直接拮抗? 九、关键缩略语与标志基因 # 项目 详情 SPP1/OPN Osteopontin,骨桥蛋白 ADM Acellular dermal matrix,脱细胞真皮基质 FBR Foreign-body response,异物反应 CD44 SPP1受体(本研究确认的主要信号受体) MMP9 SPP1-CD44下游靶点,介导ECM重塑 αvβ3 SPP1另一受体(在本研究中表达有限) α-SMA ACTA2,肌成纤维细胞标志 COL1 1型胶原,纤维化标志(与SPP1负相关) CD11c 髓系亚群标志(SPP1+ Myeloid 1/3 vs YAP+ Myeloid 2) YAP Yes-associated protein,机械传导,促纤维化(Myeloid 2) CXCL10 ADM capsule中显著升高的趋化因子 SDF-1α/β (CXCL12) ADM capsule中显著升高的趋化因子 附录: 主要参考资源 # PDF : attachments/Griffin_2025_SPP1-OPN-ADM-FBR-silicone-implant.pdf 数据资源 : PMID 40128393 / PMC12768301(开放获取) 本笔记由 WorkBuddy 基于 Nature Biomedical Engineering 2025 论文精读生成,2026-08-04 同步至 Obsidian vault。","tags":["SPP1","osteopontin","foreign-body response","FBR","acellular dermal matrix","ADM","silicone implant","breast reconstruction","capsular contracture","macrophage","monocyte","CD44","MMP9","hydrogel","single-cell RNA-seq","CODEX","spatial proteomics","scRNA-seq"],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.565Z","url":"literature/notes/18975cea89cb3d68c54c3eac.html"},{"kbId":"KB-000026","title":"EGFR-STAT1 pathway drives fibrosis initiation in fibroinflammatory skin diseases","subtitle":"","summary":"Odell et al., 2025, Nature Medicine The EGFR-STAT1 axis drives fibrosis across fibroinflammatory skin diseases including systemic sclerosis (SSc), hidradenitis suppurativa (HS), and lupus. Epidermal keratinocytes in these diseases upregulat","body":"Odell et al., 2025, Nature Medicine Abstract | 摘要 # The EGFR-STAT1 axis drives fibrosis across fibroinflammatory skin diseases including systemic sclerosis (SSc), hidradenitis suppurativa (HS), and lupus. Epidermal keratinocytes in these diseases upregulate high-affinity EGFR ligand TGFA, which directly phosphorylates STAT1 in dermal fibroblasts via EGFR, inducing a distinct pro-fibrotic transcriptional program (EGR1, FOS, CTGF, CCL2, IL6) that is independent of classical JAK-STAT/IFN signaling . ERK signaling via EGR1/FOS acts as the initiating step. TGFA is thus a keratinocyte-derived damage signal and therapeutic target; fludarabine blocks EGFR-STAT1 fibrosis in vivo . Key Findings | 核心发现 # EGFR-STAT1 是核心纤维化驱动轴 ：在硬皮病 (SSc)、化脓性汗腺炎 (HS)、红斑狼疮 (lupus) 等 fibroinflammatory 皮肤病中，EGFR-STAT1 信号是共同的纤维化驱动通路 STAT1 是成纤维细胞的 master regulon ：scRNA-seq + SCENIC 分析发现 SFRP2+ 成纤维细胞簇中 STAT1 是核心转录调控因子，而非经典的 IFN 应激通路 EGFR 直接磷酸化 STAT1 ：EGFR 不通过 JAK 激酶，直接磷酸化 STAT1 (Y701)，诱导独特的纤维化转录组 ERK-EGR1/FOS 启动通路 ：EGFR → ERK → EGR1/FOS 是启动步骤，随后激活 STAT1 依赖性纤维化基因 角质形成细胞是 TGFA 来源 ：活化的角质形成细胞大量表达 TGFA（高亲和力 EGFR 配体），是皮肤纤维化的上游损伤信号 潜在治疗靶点 ：Fludarabine（STAT1 磷酸化抑制剂）和 EGFR 抑制剂在体内模型中均显示抗纤维化效果 Background | 背景 # fibroinflammatory 皮肤病包括： 疾病 特征 系统性硬化症 (SSc) 皮肤和内脏器官纤维化，缺乏有效皮肤治疗 化脓性汗腺炎 (HS) 慢性炎症性皮肤结节，纤维化 红斑狼疮 (lupus) 自身免疫性皮肤损伤 既往问题： 各疾病 scRNA-seq 数据各自独立， 未整合分析 EGFR 激活已知可促纤维化，但 EGFR 与 STAT1 的分子连接不清 STAT1 传统上与 JAK-STAT/IFN 信号相关， 其在纤维化中的非经典作用未被系统研究 Methods | 方法 # 整合单细胞 atlas ：整合 SSc (n=5) + HS (n=?) + lupus (n=?) 患者皮肤 scRNA-seq，与健康对照 (HC n=6) 比较，共 21,910 个细胞 SCENIC 分析 ：转录因子 regulon 富集分析，识别 SFRP2+ 成纤维细胞中的 master regulator 体内小鼠模型 ： Stat1 floxed × Pdgfrα-Cre → 成纤维细胞条件性敲除 Stat1 Bleomycin 诱导皮肤纤维化 AZD8330 (MEK 抑制剂)、erlotinib (EGFR 抑制剂)、fludarabine (STAT1 磷酸化抑制剂) 处理 体外细胞实验 ：人皮肤成纤维细胞 (HFF)、TGFA/IFNA2 刺激 免疫共沉淀、磷酸化 Western blot ：验证 EGFR-STAT1 直接相互作用 TGFA 免疫荧光 ：患者皮肤活检 KRT16 + TGFA 共染色 Results | 主要结果 # Fig. 1 | 整合 fibroinflammatory 皮肤疾病 atlas # 整合 SSc + HS + lupus 三个疾病的 scRNA-seq（对比健康对照） 鉴定 8 种主要细胞类型（ keratinocytes, fibroblasts, T cells, myeloid cells 等） 成纤维细胞在疾病组织中比例改变； myofibroblasts (TAGLN+) 显著增加 上皮损伤特征基因 （KRT6A, KRT16）在角质形成细胞中共享性上调 Fig. 1 | Integrated inflammatory skin disease atlas shows upregulated STAT1 signaling in fibroblasts Fig. 2 | STAT1 是 SFRP2+ 成纤维细胞的核心 regulon # SCENIC 分析 ：识别 SFRP2+ 成纤维细胞 cluster 中的核心转录因子 regulon STAT1 regulon 活性 在 SSc 中显著升高（p=2.13E-105 vs HC） 其他活化 TF regulons： TWIST1, FOS, EGR1, RUNX1, HIF1A, IRF7 （与 EGFR 激活一致） Ingenuity pathway 分析 ：富集 collagen formation, ECM organization, EMT, wound healing pathways EGFR 活化 TF（FOS, EGR1）与 STAT1 regulon 共激活 Fig. 2 | SCENIC analysis of fibroblasts identifies STAT1 as a central regulon in fibrotic skin. UMAP embedding of SSc scRNA-seq (n=5 SSc, n=6 HC) Fig. 3 | 成纤维细胞 STAT1 + EGFR 是纤维化发生的必要条件 # Stat1 条件性敲除（Pdgfra-Cre） ：完全阻止 bleomycin 诱导的皮肤纤维化（COL1A1, FN-EDA 表达下降） AZD8330 (MEK i) + erlotinib (EGFR i) ：同样阻止纤维化 免疫细胞比例在 STAT1 敲除后 不受影响 （排除免疫间接效应） 证明： 成纤维细胞自身的 STAT1 + EGFR 活性是纤维化发生的细胞自主性必要条件 Fig. 3 | Fibroblast STAT1 and EGFR activity are required for fibrosis development in vivo Fig. 4 | EGFR 直接磷酸化 STAT1（非 JAK 依赖） # Co-IP 实验 ：EGFR 与 STAT1 直接相互作用 TGFA 刺激 ：在 30 min 达到 STAT1 Y701 磷酸化峰值（早于 IFN 诱导的延迟 STAT1 磷酸化） IFN 诱导的 STAT1 磷酸化 ：由 JAK1/JAK2 介导，peak 在 2-6 h EGFR 磷酸化 STAT1 不依赖 JAK 激酶 ：磷酸化谱与 IFN 刺激不同 EGFR-STAT1 诱导的纤维化基因 （CTGF, CCL2, IL6, CYR61）与 IFN 诱导的 ISG（BST2, IFIH1）转录组谱显著不同 Fig. 4 | EGFR can directly phosphorylate STAT1 in human dermal fibroblasts in a JAK-independent manner Fig. 5 | TGFA 诱导 STAT1 依赖性纤维化转录组 # TGFA 处理 HFF ：EGR1, FOS 在 1 h 内快速上调（STAT1 非依赖），随后 STAT1 依赖性纤维化基因 CTGF, CCL2, IL6, CYR61, WISP1, WISP2 在 4 h 达峰 IFNα2 诱导 ISG（BST2, IFIH1） ：在 24 h 持续升高，STAT1 依赖但 不诱导纤维化基因 STAT1 结合位点 ：EGR1, FOS 启动子含 EGFR/ERK/ELK4 结合位点（不依赖 STAT1）；CTGF, CCL2 含 STAT1 结合位点 关键区别 ：TGFA-EGFR-STAT1 与 IFN-JAK-STAT1 产生 功能不同的转录组 Fig. 5 | EGFR activation by TGFA leads to a fibrotic STAT1-dependent transcriptional profile distinct from IFN signaling Fig. 6 | ERK-EGR1/FOS 启动通路 # MEK 抑制剂 AZD8330 ：阻断 ERK 磷酸化后，TGFA 仍可磷酸化 EGFR 和 STAT1，但 EGR1, CTGF, CCL2 表达下降 EGR1, FOS 启动子 ：含 ELK4（ERK 下游 TF）结合位点 ERK 抑制剂（temuterkib, AZD8330） ：阻断 EGR1/CTGF/CCL2 诱导，但不阻断 STAT1 磷酸化 通路顺序 ：TGFA → EGFR → ERK → ELK4 → EGR1/FOS → (启动) → STAT1 → 纤维化基因 Fig. 6 | EGFR initiates fibrotic gene expression through ERK-dependent EGR1/FOS activation (initiation step), then STAT1 drives the fibrotic gene program Fig. 7 | 角质形成细胞是 TGFA 的主要来源 # TGFA 免疫荧光 ：疾病皮肤表皮中 KRT16+ 角质形成细胞强共表达 TGFA，健康皮肤无 KRT6A/KRT16 ：表皮各层均有，在 fibroinflammatory 疾病中共享性上调 TGFA 是最早上调的 EGFR 配体 ：在小鼠 bleomycin 模型中， Tgfa 在纤维化早期（day 3）即上调 ，而 Ereg 在维持期上调 角质形成细胞 shared stress response ：SSc + HS + lupus 角质形成细胞共有 100 个上调基因（stress keratins + 损伤信号） FnEDA, Tnc （纤维化 ECM marker）与 Tgfa 表达时间一致 Fig. 7 | Activated keratinocytes are the main source of TGFA in fibrotic skin. KRT16+ keratinocytes co-express TGFA in diseased skin; Tgfa upregulation early in mouse fibrosis corresponds with ECM gene expression Fig. 8 | 机制模型 # Fig. 8 | Model: Keratinocyte-derived high-affinity EGFR ligand (TGFA) activates EGFR-STAT1 signaling in dermal fibroblasts, driving a pro-fibrotic transcriptional program. TGFA is a keratinocyte damage signal; fludarabine blocks EGFR-STAT1-driven fibrosis Signaling Pathway Model | 信号通路模型 # 角质形成细胞（损伤/应激） ↓ TGFA（高亲和力 EGFR 配体，上调） EGFR（成纤维细胞膜） ├─→ ERK ─→ ELK4 ─→ EGR1/FOS ←── STAT1 非依赖（启动步骤） │ └─→ (直接) STAT1 Y701 磷酸化 ←── JAK 非依赖 ↓ STAT1 二聚体 → 核转位 ↓ 纤维化基因转录：CTGF, CCL2, IL6, CYR61, WISP1, WISP2 ↓ 细胞外基质沉积 → 皮肤纤维化 注意 ：IFN-JAK-STAT1 通路（STAT1 磷酸化由 JAK1/JAK2 介导）→ ISG 表达（BST2, IFIH1）≠ 纤维化 Therapeutic Implications | 治疗启示 # 药物 靶点 效果 Fludarabine (STAT1 磷酸化抑制剂) STAT1 阻断 TGFA 诱导的纤维化基因，体内抗纤维化 Erlotinib (EGFR 抑制剂) EGFR 阻断纤维化发展 AZD8330 (MEK 抑制剂) MEK/ERK 阻断 EGR1/FOS 启动步骤 Fludarabine 目前用于血液肿瘤（STAT1 在肿瘤免疫逃逸中的作用），有潜在皮肤纤维化治疗价值 EGFR 抑制剂 （已在肝纤维化、移植物抗宿主病中证实抗纤维化）可能对 SSc 皮肤有效 Limitations | 局限性 # Fibroinflammatory 皮肤疾病具有 阶段性和内型异质性 （SSc 分为水肿期/纤维化期/萎缩期），现有 atlas 缺乏详细的患者分期 metadata 轻症与重症疾病亚群的信号机制差异尚不清楚 临床转化仍需人体试验验证 References | 核心参考文献 # Fuchs, B. C. et al. EGFR inhibition attenuates liver fibrosis. Hepatology 59, 1577–1590 (2014) Morin, F. et al. EGFR inhibition prevents sclerodermatous GVHD. J Invest Dermatol 135, 2385–2393 (2015) Cao, S. et al. EGFR activation is essential for kidney fibrosis. Nat Commun 14, 7357 (2023) [Ereg 在皮肤纤维化维持期上调的既往研究] ORegAnno database（STAT1 promoter binding sites） Maul, J. T. et al. Skin disease treatment response data SSc 疾病分期 72-74. HS 疾病表型分类 Related Notes | 相关笔记 # EGFR signaling pathway — EGFR 信号通路的经典与新兴功能 STAT1 signaling — STAT1 在免疫与纤维化中的双重角色 Systemic sclerosis pathogenesis — 系统性硬化症发病机制 Fibroblast scRNA-seq — 成纤维细胞单细胞分析综述 Hidradenitis suppurativa — 化脓性汗腺炎研究进展 文献导入时间：2026-04-14 | Zotero ItemID: 1747 | PDF: 2025_Odell_EGFR-STAT1_fibrosis.pdf","tags":["EGFR","STAT1","fibrosis","fibroinflammatory","systemic_sclerosis","scRNA-seq","SSc","hidradenitis_suppurativa","lupus","skin","keratinocyte","fibroblast","signaling_pathway"],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.564Z","url":"literature/notes/a9ab76cf1880c66cdb2532b2.html"},{"kbId":"KB-000024","title":"通过功能性抑制瘦素受体阳性骨骼细胞预防和治疗植入周纤维化","subtitle":"Prevention and treatment of peri-implant fibrosis by functionally inhibiting skeletal cells expressing the leptin receptor - Nature Biomedical Engineering","summary":"The cellular and molecular mediators of peri-implant fibrosis—a most common reason for implant failure and for surgical revision after the replacement of a prosthetic joint—remain unclear. Here we show that peri-implant fibrotic tissue in mice and humans is largely composed of a specific population of skeletal cells expressing the leptin receptor (LEPR) and that these cells are necessary and sufficient to generate and maintain peri-implant fibrotic tissue. In a mouse model of tibial implantation and osseointegration that mimics partial knee arthroplasty, genetic ablation of LEPR+ cells prevented peri-implant fibrosis and the implantation of LEPR+ cells from peri-implant fibrotic tissue was sufficient to induce fibrosis in secondary hosts. Conditional deletion of the adhesion G-protein-coupled receptor F5 (ADGRF5) in LEPR+ cells attenuated peri-implant fibrosis while augmenting peri-implant bone formation, and ADGRF5 inhibition by the intra-articular or systemic administration of neutralizing anti-ADGRF5 in the mice prevented and reversed peri-implant fibrosis. Pharmaceutical agents that inhibit the ADGRF5 pathway in LEPR+ cells may be used to prevent and treat peri-implant fibrosis.","body":"本文献笔记由 Claudian 自动生成，基于 Crossref、Nature 页面预览与 PDF 提取结果整理。 中文标题 # 通过功能性抑制瘦素受体阳性骨骼细胞预防和治疗植入周纤维化 中文摘要 # 植入周纤维化是人工关节置换后植入失败及翻修手术最常见的原因之一，但其细胞与分子介质尚不清楚。本研究表明，小鼠和人类植入周纤维组织主要由一类表达瘦素受体（LEPR）的特定骨骼细胞组成，而且这些细胞对植入周纤维组织的生成与维持既是必需的也是充分的。在模拟部分膝关节置换术的胫骨植入/骨整合小鼠模型中，遗传性清除 LEPR+ 细胞可阻止植入周纤维化，而将来源于植入周纤维组织的 LEPR+ 细胞植入继发宿主体内，则足以诱导纤维化发生。在 LEPR+ 细胞中条件性敲除黏附型 G 蛋白偶联受体 F5（ADGRF5）可减轻植入周纤维化并增强植入周骨形成；在小鼠中通过关节腔内或全身给予中和性 anti-ADGRF5 抗体，同样能够预防并逆转植入周纤维化。说明抑制 LEPR+ 细胞中的 ADGRF5 通路有望成为预防和治疗植入周纤维化的药物策略。 背景与研究意义 # 在关节置换或其他骨植入场景中，理想结局应是骨整合（osseointegration）；而一旦在植入周形成富含细胞和基质的纤维膜，就容易导致力学固定不足、持续炎症和最终无菌性松动。过去相关研究更关注磨损颗粒、炎症细胞与骨吸收，但对“究竟哪类局部基质细胞在持续生成纤维膜”缺乏清晰答案。 这篇文章的重要贡献在于，把植入周纤维化的关键执行细胞明确锁定为 LEPR+ 骨骼细胞，并进一步提出 ADGRF5 作为该细胞群可干预的分子节点，为该领域从描述性病理走向靶向治疗提供了基础。 科学问题 # 植入周纤维膜的主要细胞来源是否为特定的骨骼基质细胞群？ LEPR+ 细胞在植入周纤维化中究竟是相关、必需，还是足以独立驱动病变？ 若锁定 LEPR+ 细胞内的关键分子通路，能否实现同时抑制纤维化并促进骨整合？ 整体研究思路 # 文章采用“细胞来源鉴定 → 因果验证 → 机制筛选 → 治疗验证”的经典路径： 在人和小鼠标本中鉴定植入周纤维组织的 LEPR+ 细胞丰度； 通过 LEPR+ 细胞清除与移植实验，证明其对纤维化的必要性和充分性； 从 LEPR+ 细胞中筛选候选致纤维化受体 ADGRF5，并做条件性删除； 进一步使用中和抗体验证 ADGRF5 的可药物化价值。 主要结果 # Result 1 | LEPR+ 骨骼细胞是植入周纤维组织的主要组成成分 # 核心发现： 无论在人还是小鼠中，peri-implant fibrotic tissue 都富集 LEPR+ skeletal cells。 主要证据： Figure 1 显示 LEPR-expressing cells 在人和小鼠植入周纤维组织中均大量存在。 意义： 说明植入周纤维膜并非仅由炎症后继发反应产生，而是由特定骨骼基质细胞群积极构建。 Result 2 | 清除 LEPR+ 细胞可显著减少植入周纤维化 # 核心发现： LEPR+ 细胞对纤维化发生是必需的。 主要证据： Figure 2 显示，在小鼠植入模型中，ablation of LEPR+ cells 可显著减少 peri-implant fibrosis。 意义： 把 LEPR+ 细胞从“相关细胞群”提升为“病理必要细胞群”。 Result 3 | 纤维化型供体来源 LEPR+ 细胞足以在继发宿主中诱导纤维化 # 核心发现： LEPR+ 细胞不仅必要，而且具备可转移的致纤维化能力。 主要证据： Figure 4 提示，来源于 fibrous-integrated donor 的 LEPR+ cells 比来源于 osseointegrated donor 的同类细胞更倾向形成纤维组织。 意义： 证明 LEPR+ 细胞具备稳定的病理命运偏向，而非完全由外部环境短暂诱导。 Result 4 | ADGRF5 在 LEPR+ 细胞中高表达，是关键治疗靶点 # 核心发现： ADGRF5 是 LEPR+ 纤维化细胞群中的候选驱动分子。 主要证据： Figure 5 显示 ADGRF5 在人和小鼠植入周纤维组织的 LEPR+ cells 中丰富表达。 意义： 为针对 LEPR+ 细胞的精准干预提供了分子抓手。 Result 5 | 在 LEPR+ 细胞中敲除 Adgrf5 可抑制纤维化并增强骨形成 # 核心发现： ADGRF5 对 LEPR+ 细胞维持纤维化程序具有功能性作用。 主要证据： Figure 6 显示，LEPR+ 细胞特异性 ablation of Adgrf5 会 inhibit peri-implant fibrosis，同时 enhance peri-implant bone formation。 意义： 这不是单纯抗纤维化，而是推动组织结局从“纤维整合”转向“骨整合”。 Result 6 | Adgrf5 缺失降低 LEPR+ 细胞增殖并提升成骨分化潜能 # 核心发现： ADGRF5 影响的不只是组织学终点，也重塑了 LEPR+ 细胞的增殖/分化状态。 主要证据： Figure 7 显示，LEPR+ 细胞中 Adgrf5 ablation 会降低细胞增殖，并提高 osteogenic differentiation capability。 意义： 从细胞行为层面解释了 ADGRF5 为什么会决定纤维化结局。 Result 7 | anti-ADGRF5 能够预防并逆转植入周纤维化 # 核心发现： ADGRF5 具有明确的转化潜力。 主要证据： Figure 8 表明，无论关节腔内还是系统给药，中和性 anti-ADGRF5 均可 prevent and reverse peri-implant fibrosis。 意义： 该研究从病理发现直接推进到药理干预，具有很强的临床想象空间。 机制模型 # 本文可概括为如下逻辑： LEPR+骨骼细胞富集于植入周病灶 → 部分细胞偏向致纤维化程序 → ADGRF5维持其增殖/纤维化特征 → 纤维膜形成并抑制骨整合 当 LEPR+ 细胞或其 ADGRF5 通路被抑制时： 致纤维化细胞池缩小 → 纤维膜减少 → 成骨程序恢复/增强 → 植入周骨形成增加 研究亮点 # 首次较系统地把 LEPR+ 骨骼细胞确立为植入周纤维化的关键病理细胞来源。 同时证明了必要性和充分性，因果链条完整。 ADGRF5 作为黏附型 GPCR，具有较高药物开发吸引力。 预防与逆转两种治疗场景都进行了验证，转化意义强。 局限性 # 小鼠模型虽模拟部分关节置换，但与长期临床植入环境仍存在差距。 LEPR+ 细胞内部仍可能存在更细的功能亚群，文章未完全展开。 anti-ADGRF5 的长期毒理、最佳给药方案与大动物验证尚缺。 LEPR+ 细胞与炎症细胞、机械应力、磨损颗粒之间的互作仍需整合。 与 2026 年 GREM1 文章的联系 # 文献/2026-03-NatCommun-GREM1-LEPR-植入周纤维化/GREM1 acts in leptin receptor-expressing skeletal cells to mediate peri-implant fibrosis - Nature Communications.md 可以视作本研究的后续深化： 本文先明确 LEPR+ 细胞是谁 ； 后续文章再继续追问 LEPR+ 细胞内部的上游调控因子是什么 ，从而锁定 GREM1； 因此两文共同构成“细胞群体鉴定 → 分子靶点精炼”的连续研究线。 核心参考文献 # Suhardi VJ, Oktarina A, Hammad M, et al. Prevention and treatment of peri-implant fibrosis by functionally inhibiting skeletal cells expressing the leptin receptor. Nature Biomedical Engineering . 2024;8:1285-1307. doi:10.1038/s41551-024-01238-y Suhardi VJ, Oktarina A, Niu Y, et al. GREM1 acts in leptin receptor-expressing skeletal cells to mediate peri-implant fibrosis. Nature Communications . 2026. doi:10.1038/s41467-026-70111-0","tags":["clippings","植入周纤维化","LEPR","ADGRF5","骨整合","无菌性松动"],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.564Z","url":"literature/notes/b37e3ec5fe1d4f34cb665df4.html"},{"kbId":"KB-000025","title":"功能性抑制 LEPR+ 骨骼细胞防治植入周纤维化","subtitle":"","summary":"Nature Biomedical Engineering IF=24.6 中科院1区 2024-07-31 Vincentius Jeremy Suhardi, Anastasia Oktarina, Mohammed Hammad, et al. DOI: 10.1038/s41551-024-01238-y 通过功能性抑制瘦素受体阳性骨骼细胞预防和治疗植入周纤维化 植入周纤维化是人工关节置换后植入失败及翻修手术最常见的原因之一，但其细胞与分子介质尚不清楚。本研究表明，小","body":"Prevention and treatment of peri-implant fibrosis by functionally inhibiting skeletal cells expressing the leptin receptor # Nature Biomedical Engineering | IF=24.6 | 中科院1区 | 2024-07-31 Vincentius Jeremy Suhardi, Anastasia Oktarina, Mohammed Hammad, et al. DOI: 10.1038/s41551-024-01238-y 标题与摘要 # 中文标题 # 通过功能性抑制瘦素受体阳性骨骼细胞预防和治疗植入周纤维化 中文摘要 # 植入周纤维化是人工关节置换后植入失败及翻修手术最常见的原因之一，但其细胞与分子介质尚不清楚。本研究表明，小鼠和人类植入周纤维组织主要由一类表达瘦素受体（LEPR）的特定骨骼细胞组成，而且这些细胞对植入周纤维组织的生成与维持既是必需的也是充分的。在模拟部分膝关节置换术的胫骨植入/骨整合小鼠模型中，遗传性清除 LEPR+ 细胞可阻止植入周纤维化，而将来源于植入周纤维组织的 LEPR+ 细胞植入继发宿主体内，则足以诱导纤维化发生。在 LEPR+ 细胞中条件性敲除黏附型 G 蛋白偶联受体 F5（ADGRF5）可减轻植入周纤维化并增强植入周骨形成；在小鼠中通过关节腔内或全身给予中和性 anti-ADGRF5 抗体，同样能够预防并逆转植入周纤维化。说明抑制 LEPR+ 细胞中的 ADGRF5 通路有望成为预防和治疗植入周纤维化的药物策略。 一、研究背景与科学问题 # 1.1 临床背景 # 无菌性松动是人工关节翻修最常见原因之一，而植入周纤维膜形成会显著阻碍长期稳定骨整合。虽然临床上广泛认识到该病理重要性，但长期缺乏对核心致病细胞群的准确界定。 1.2 机制背景 # 已有研究提示局部骨髓/骨膜来源细胞会参与修复与纤维化，但究竟是哪一类细胞主导植入周纤维膜形成仍不清楚。作者聚焦于 LEPR+ skeletal cells，并进一步寻找其可干预分子节点 ADGRF5。 1.3 科学问题 # 植入周纤维组织的主要细胞来源是谁？ LEPR+ 骨骼细胞是否对纤维化的形成与维持具有必要性和充分性？ 抑制 ADGRF5 能否把组织结局从纤维化转向骨整合？ 二、整体研究思路 # 本研究采用 “细胞来源鉴定 → 遗传学因果验证 → 分子靶点识别 → 抗体治疗验证” 的路径： Step 内容 关键技术/输出 1 组织定位 人/鼠纤维病灶中 LEPR+ 细胞定位 2 LEPR+ 细胞清除 判断该细胞群是否必要 3 供体 LEPR+ 细胞移植 判断该细胞群是否充分 4 ADGRF5 条件敲除 评估关键分子作用 5 anti-ADGRF5 治疗 验证预防与逆转能力 三、逐个 Result 总结 # Result 1 | LEPR+ 细胞在植入周纤维组织中高度富集 # 【目的】 明确植入周纤维化的核心病理细胞群。 【主要证据】 Figure 1 显示 LEPR-expressing cells 在小鼠和人类 peri-implant fibrotic tissue 中大量存在。 【核心发现】 LEPR+ 细胞是植入周纤维病灶的主要组成成分。 Result 2 | 清除 LEPR+ 细胞可显著抑制植入周纤维化 # 【目的】 验证 LEPR+ 细胞对纤维化是否必需。 【主要证据】 Figure 2 显示 ablation of LEPR+ cells 会明显减少 peri-implant fibrosis。 【核心发现】 LEPR+ 细胞是纤维化形成的必要细胞群。 Result 3 | 纤维化供体来源 LEPR+ 细胞足以在继发宿主中诱导纤维化 # 【目的】 判断 LEPR+ 细胞是否足以独立驱动病理。 【主要证据】 Figure 4 表明 fibrous-integrated donor 来源 LEPR+ cells 更易在受体中形成纤维组织。 【核心发现】 LEPR+ 细胞具有可转移、可维持的致纤维化能力。 Result 4 | ADGRF5 在植入周 LEPR+ 细胞中高表达 # 【目的】 寻找 LEPR+ 细胞内可干预分子靶点。 【主要证据】 Figure 5 显示 ADGRF5 在人和小鼠纤维病灶中的 LEPR+ 细胞内富集。 【核心发现】 ADGRF5 是 LEPR+ 纤维化细胞的关键候选受体。 Result 5 | LEPR+ 细胞中敲除 Adgrf5 抑制纤维化并促进骨形成 # 【目的】 验证 ADGRF5 的功能性作用。 【主要证据】 Figure 6 显示 ablation of Adgrf5 in LEPR+ cells inhibits peri-implant fibrosis and enhances peri-implant bone formation。 【核心发现】 ADGRF5 决定 LEPR+ 细胞偏向纤维化而非成骨的组织结局。 Result 6 | anti-ADGRF5 可预防并逆转植入周纤维化 # 【目的】 评估该靶点的药物转化潜力。 【主要证据】 Figure 8 显示中和性 anti-ADGRF5 的关节腔内或系统给药均可 prevent and reverse peri-implant fibrosis。 【核心发现】 ADGRF5 是具备临床转化价值的抗纤维化靶点。 四、机制模型 # 4.1 细胞与分子机制 # LEPR+骨骼细胞富集于植入周病灶 ↓ ADGRF5维持其增殖与致纤维化状态 ↓ 纤维膜形成增强、骨整合受阻 ↓ 植入失败/无菌性松动风险升高 4.2 治疗转化模型 # 清除LEPR+细胞 或 抑制ADGRF5 ↓ 致纤维化程序下降 ↓ 纤维膜减少 ↓ 植入周骨形成增强 五、汇报亮点与局限性 # 5.1 研究亮点 # 明确提出 LEPR+ 骨骼细胞是植入周纤维化的关键细胞来源。 通过“必要性 + 充分性”双重证据完成因果论证。 识别并验证 ADGRF5 这一可药物化 GPCR 靶点。 展示预防与逆转两种治疗场景，临床转化价值高。 5.2 研究局限性 # 以小鼠模型为主，仍需更贴近临床长期植入环境的验证。 LEPR+ 细胞内部异质性尚未完全拆解。 anti-ADGRF5 的长期安全性和大动物研究尚待推进。 六、参考文献 # Suhardi VJ, Oktarina A, Hammad M, et al. Prevention and treatment of peri-implant fibrosis by functionally inhibiting skeletal cells expressing the leptin receptor. Nature Biomedical Engineering . 2024;8:1285-1307. doi:10.1038/s41551-024-01238-y Suhardi VJ, Oktarina A, Niu Y, et al. GREM1 acts in leptin receptor-expressing skeletal cells to mediate peri-implant fibrosis. Nature Communications . 2026. doi:10.1038/s41467-026-70111-0 文献汇报生成时间：2026-04-23 | 由 Claudian 自动生成","tags":[],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.564Z","url":"literature/notes/b2ae10c63bedb9c060ac5d70.html"},{"kbId":"KB-000023","title":"基于图关联统一嵌入的单细胞多组学整合与调控推断","subtitle":"","summary":"基于图关联统一嵌入的单细胞多组学数据整合与调控推断 Multi-omics single-cell data integration and regulatory inference with graph-linked embedding Nature Biotechnology IF=41.7 中科院1区 2022-05-02 Zhi-Jie Cao, Ge Gao DOI: 10.1038/s41587-022-01284-4 尽管单细胞中同步测量多种组学模态的实验方法已","body":"中文标题 # 基于图关联统一嵌入的单细胞多组学数据整合与调控推断 英文标题 # Multi-omics single-cell data integration and regulatory inference with graph-linked embedding Nature Biotechnology | IF=41.7 | 中科院1区 | 2022-05-02 Zhi-Jie Cao, Ge Gao DOI: 10.1038/s41587-022-01284-4 中文摘要 # 尽管单细胞中同步测量多种组学模态的实验方法已经出现，但大多数单细胞数据集仍仅包含单一模态。整合多模态组学数据的主要障碍在于，不同组学层通常具有不同的特征空间。本文提出计算框架 GLUE（graph-linked unified embedding，图关联统一嵌入），通过显式建模跨组学层的调控相互作用来弥合这一差距。系统基准测试表明，在异构单细胞多组学数据整合方面，GLUE 比现有最先进方法更准确、更稳健且更具可扩展性。作者将 GLUE 应用于三组学整合、整合式调控推断以及数百万细胞规模的多组学人类细胞图谱构建等多种挑战性任务，并显示其能够纠正既有注释。GLUE 采用模块化设计，可灵活扩展和增强以适应新的分析任务。完整软件包已公开发布于 https://github.com/gao-lab/GLUE。该工作表明，通过建模调控相互作用，可以在图谱级尺度上实现不同单细胞数据模态的整合。 一、研究背景与科学问题 # 1.1 研究背景 # 单细胞组学技术已经从单一转录组测量，扩展到染色质可及性、DNA 甲基化以及多模态联合测量。现实问题在于：绝大多数公开数据仍是 非配对 的单模态数据，不同模态之间既没有一一对应的细胞，也缺乏统一的特征空间。比如 scRNA-seq 的特征是基因表达，而 scATAC-seq 的特征是开放染色质区域，直接对齐难度很高。 已有方法通常走两条路线：一是把不同模态强行转换到同一特征空间，再做整合；二是用流形对齐或矩阵分解实现间接匹配。但前者容易损失信息，后者往往难以扩展到三种及以上组学层，或难以处理百万细胞级别的数据。 1.2 科学问题 # 如何在不同组学层特征空间不一致的前提下，稳定整合非配对单细胞多组学数据？ 如何把先验调控知识真正纳入整合过程，而不仅仅作为预处理映射规则？ 如何在完成跨模态整合的同时，进一步做调控关系推断与 atlas 级别扩展？ 二、整体研究思路 # 本文提出 GLUE（graph-linked unified embedding）框架，核心思想是把“ 指导图 ”作为跨组学桥梁，把不同模态的特征连接到同一个图结构中，再联合学习特征嵌入和细胞嵌入。 研究流程可以概括为： 为每一种组学分别建立一个自编码器，保留各自数据分布特性； 构建指导图，把基因、ATAC peak、DNA 甲基化特征等通过先验调控关系连接起来； 通过图自编码器学习特征嵌入，再通过对抗对齐让不同组学中的细胞嵌入进入同一潜在空间； 在统一嵌入空间中做跨模态对齐、标签转移、调控评分估计与 atlas 级分析。 三、逐个 Result 总结 # Result 1：框架设计——用指导图桥接不同组学特征空间 # 【目的】 解决不同组学之间特征空间完全不同，无法直接对齐的问题。 【主要证据】 每个组学层使用独立的变分自编码器，适配各自特征空间和数据分布。 指导图节点对应不同组学特征，边表示跨层调控关系，如“ATAC peak—gene”或“甲基化—gene”。 通过对抗判别器，使不同组学的细胞嵌入进入同一潜在空间。 【核心发现】 GLUE 不是先强行做特征转换，而是通过“图 + 嵌入”的方式，在模型内部完成跨模态桥接。 Result 2：系统基准测试显示 GLUE 在整合精度和鲁棒性上领先 # 【目的】 评估 GLUE 相比现有方法的整合表现。 【主要证据】 在 SNARE-seq、SHARE-seq、10X Multiome、Nephron、MOp 等数据集上，总体整合得分持续排名第一。 FOSCTTM 指标显示，GLUE 在单细胞精细对齐上误差最低。 即使指导图中的相互作用被大比例破坏，GLUE 仍保持较稳定性能。 在细胞数较少时性能会下降，但在中大规模数据集上优势明显。 【核心发现】 GLUE 同时实现了较好的生物学保留、组学混合和单细胞对齐精度。 Result 3：GLUE 成功扩展到三组学整合 # 【目的】 验证 GLUE 能否整合超过两个组学层。 【主要证据】 在小鼠皮层数据中整合了 RNA、ATAC 与 DNA 甲基化三层数据。 指导图允许正负符号边，从而表达“ATAC 与表达正相关、甲基化与表达负相关”等关系。 统一嵌入支持标签转移，修正并细化了神经元亚群注释。 联合建模还量化了不同表观遗传层对表达预测的非冗余贡献。 【核心发现】 GLUE 不仅适合双组学，也适合三组学甚至更多层的整合任务。 Result 4：GLUE 的统一嵌入支持整合式调控推断 # 【目的】 验证统一嵌入能否进一步用于 peak-gene 调控关系识别。 【主要证据】 在 PBMC 多组学数据中，将特征嵌入余弦相似度定义为调控评分。 调控评分与基因组距离呈负相关、与经验峰—基因相关性呈正相关。 在 pcHi-C 和 eQTL 外部证据验证下，GLUE 比 Cicero、LASSO 和简单相关性表现更好。 进一步推导出的 TF—靶基因网络与 TRRUST v2 数据库一致性更高。 【核心发现】 GLUE 从“整合算法”进一步升级为“整合 + 调控推断”框架。 Result 5：GLUE 支持百万细胞级 atlas 整合 # 【目的】 检验 GLUE 在大规模细胞图谱中的可扩展性。 【主要证据】 成功整合了人类胎儿基因表达图谱与染色质可及性图谱。 借助小批量优化、分阶段训练和元细胞预训练策略，实现 atlas 级扩展。 整合后可修正部分原始注释偏差，识别更合理的细胞谱系关系。 对照方法中，online iNMF 质量较差，Seurat v3 在完整规模上难以有效运行。 【核心发现】 GLUE 具备从方法开发走向 atlas 级应用的潜力。 四、机制模型 / 方法模型 # 可以把 GLUE 总结为一句话： 先用指导图把不同组学的特征连接起来，再用图嵌入和对抗学习把不同组学的细胞放进同一个潜在空间，最后在这个统一空间中做标签转移和调控推断。 文字流程图： 不同组学数据（scRNA / scATAC / methylation） ↓ 各自自编码器学习组学层内部表示 ↓ 指导图编码跨组学调控关系 ↓ 图自编码器学习特征嵌入 ↓ 对抗对齐学习统一细胞嵌入 ↓ 跨模态整合 / 标签转移 / 调控推断 / atlas 构建 五、汇报亮点与局限性 # 5.1 研究亮点 # 方法创新明确 ：把先验调控图纳入主体模型，而不是只用于预处理。 验证链完整 ：从双组学、三组学到调控推断和 atlas 级整合，层层递进。 兼顾算法与生物学 ：不仅看 benchmark 指标，也有真实生物学场景和外部证据支持。 实用性强 ：scglue 工具开源，易于后续复现与方法对比。 5.2 研究局限性 # 在极小样本数据中，神经网络方法可能欠训练。 尽管对错误先验有鲁棒性，但指导图质量仍会影响最终上限。 当前调控推断更偏全局平均效应，时空特异性调控仍需进一步细化。 atlas 级训练仍需要较高计算资源和工程实现能力。 六、参考文献 # Cao Z-J, Gao G. Multi-omics single-cell data integration and regulatory inference with graph-linked embedding. Nature Biotechnology . 2022;40(10):1458-1466. doi:10.1038/s41587-022-01284-4. Stuart T, Satija R. Integrative single-cell analysis. Nature Reviews Genetics . 2019;20:257-272. Argelaguet R, Cuomo ASE, Stegle O, Marioni JC. Computational principles and challenges in single-cell data integration. Nature Biotechnology . 2021;39:1202-1215. Pliner HA, Packer JS, McFaline-Figueroa JL, et al. Cicero predicts cis-regulatory DNA interactions from single-cell chromatin accessibility data. Molecular Cell . 2018;71:858-871. Aibar S, González-Blas CB, Moerman T, et al. SCENIC: single-cell regulatory network inference and clustering. Nature Methods . 2017;14:1083-1086. 生成时间：2026-06-08 | 由 Claudian 基于网页剪藏扩展整理生成","tags":[],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.563Z","url":"literature/notes/7fdc9e098e82df552994ad97.html"},{"kbId":"KB-000022","title":"基于图关联统一嵌入的单细胞多组学数据整合与调控推断","subtitle":"Multi-omics single-cell data integration and regulatory inference with graph-linked embedding","summary":"Despite the emergence of experimental methods for simultaneous measurement of multiple omics modalities in single cells, most single-cell datasets include only one modality. A major obstacle in integrating omics data from multiple modalities is that different omics layers typically have distinct feature spaces. Here, we propose a computational framework called GLUE (graph-linked unified embedding), which bridges the gap by modeling regulatory interactions across omics layers explicitly. S
