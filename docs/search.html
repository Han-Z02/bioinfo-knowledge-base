 the Make Calls to the Semantic Scholar API section for more Python examples using the paper search, paper recommendations, and authors endpoints. Make Calls to the Semantic Scholar API # Use Case: Let's suppose you are an early-career academic researcher interested in doing research in generative AI. You would like to learn about recent research developments in the generative AI field and discover what areas are most exciting for future research. How to use Semantic Scholar: You can do a keyword search for relevant papers on generative AI.You can pick out a few papers that seem the most interesting, then recommend more papers that are similar to them. You can examine the list of recommended papers to see which are the most cited and which authors worked on them, then look up other research by those same authors. Let’s walk through those scenarios together. We’re going to use Python, but you can follow along using the Postman collection . Step 1: Keyword search for relevant papers # Use Case: We want to learn more about generative AI, so we’ll start by searching for recent generative AI research papers. Two Academic Graph API endpoints use Semantic Scholar’s custom-trained ranker to perform keyword searches: the paper relevance search endpoint and the paper bulk search endpoint. Paper bulk search should be used in most cases because paper relevance search is more resource intensive. The paper relevance search endpoint is able to return more detailed information about each paper’s authors, its referenced papers, and the papers that cite it. The paper bulk search supports sorting and special syntax in the query parameter. In this scenario, we will use the paper bulk search endpoint. Get the Endpoint URL The Academic Graph API endpoint’s base URL is: http://api.semanticscholar.org/graph/v1/ Whenever we want to retrieve data from or send data to an endpoint in the Academic Graph, that’s how the URL starts. The API documentation for paper bulk search endpoint lists its resource path as /paper/search/bulk , so the endpoint’s full URL is: http://api.semanticscholar.org/graph/v1/paper/search/bulk Set the Query Parameters The paper bulk search API documentation lists the following query parameters: query sets the search term token automatically handles pagination fields determines what data the API endpoint will return to you sort allows users to sort the results by the paperId, publicationDate, or citationCount fields publicationTypes filters results by paper publication type (e.g. journal articles) openAccessPdf filters results by whether they contain public PDFs of papers minCitationCount filters results by whether they have at least a given number of citations publicationDateOrYear filters results by a date range year filters results by a year range venue filters results by publication venue fieldsOfStudy filters results by the paper’s field of study Only the first query parameter, query , is required in every request. The token query parameter isn’t included in the original request. Instead, it is returned in the response to the original request, then included in subsequent requests to automatically handle pagination . In our request, we will include 3 query parameters: query , fields , and year : Use quotation marks in the query to search for the phrase “generative AI”. See the Additional Help section for more examples of using search query syntax . In fields , include the title, url, type of publication, date of publication, and link to the pdf of the paper. Separate field names with commas, without spaces. See the API documentation for all available field names. Filter for papers published during or after the year 2023 by using the “2023–” syntax. These query parameters are appended to the end of the URL, so the complete URL looks like this: http://api.semanticscholar.org/graph/v1/paper/search/bulk?query=\"generative ai\"\u0026fields=title,url,publicationTypes,publicationDate,openAccessPdf\u0026year=2023- Send the Request The URL is long and hard to read, so in our code we’ll break it up a bit: import requests import json # Specify the search term query = '\"generative ai\"' # Define the API endpoint URL url = \"http://api.semanticscholar.org/graph/v1/paper/search/bulk\" # Define the query parameters query_params = { \"query\": '\"generative ai\"', \"fields\": \"title,url,publicationTypes,publicationDate,openAccessPdf\", \"year\": \"2023-\" } # Directly define the API key (Reminder: Securely handle API keys in production environments) api_key = \"your api key goes here\" # Replace with the actual API key # Define headers with API key headers = {\"x-api-key\": api_key} # Send the API request response = requests.get(url, params=query_params, headers=headers).json() The request is formatted and sent to the API endpoint, and the response is captured in the variable response . According to the API documentation, if the request was successful, with status code 200, the response variable contains three fields: Figure 6. The API documentation lists the data format of the response schema. The total parameter is an estimate of how many papers were found that matched the search request, the token parameter is used for pagination , and the data parameter contains the data returned from the endpoint. Note that the paper bulk search endpoint’s use of tokens to handle pagination is unlike the paper relevance search endpoint’s use of the offset and limit query parameters for pagination . The next part of our code saves the data returned from the endpoint to a json file titled papers.json and prints the code’s progress to the console. If the token parameter is present, fetch the next batch of responses. print(f\"Will retrieve an estimated {response['total']} documents\") retrieved = 0 # Write results to json file and get next batch of results with open(f\"papers.json\", \"a\") as file: while True: if \"data\" in response: retrieved += len(response[\"data\"]) print(f\"Retrieved {retrieved} papers...\") for paper in response[\"data\"]: print(json.dumps(paper), file=file) # checks for continuation token to get next batch of results if \"token\" not in response: break response = requests.get(f\"{url}\u0026token={response['token']}\").json() print(f\"Done! Retrieved {retrieved} papers total\") Each data object in the papers.json file contains the fields we requested, as well as the paperId. { \"paperId\": \"001720a782840652b573bb4794774aee826510ca\", \"url\": \"https://www.semanticscholar.org/paper/001720a782840652b573bb4794774aee826510ca\", \"title\": \"Developing Design Features to Facilitate AI-Assisted User Interactions\", \"openAccessPdf\": null, \"publicationTypes\": null, \"publicationDate\": \"2024-05-03\" } { \"paperId\": \"0019e876188f781fdca0c0ed3bca39d0c70c2ad2\", \"url\": \"https://www.semanticscholar.org/paper/0019e876188f781fdca0c0ed3bca39d0c70c2ad2\", \"title\": \"Artificial intelligence prompt engineering as a new digital competence: Analysis of generative AI technologies such as ChatGPT\", \"openAccessPdf\": { \"url\": \"https://eber.uek.krakow.pl/index.php/eber/article/view/2142/863\", \"status\": \"GOLD\" }, \"publicationTypes\": [ \"JournalArticle\", \"Review\" ], \"publicationDate\": null } See the S2folks GitHub code examples for another version of this call . Step 2: Get recommended papers # Use Case: In this section, we want to get a list of recommended papers based on a few interesting seed papers. We’re interested in the most cited papers, so we’ll request information about the recommended papers’ citation counts. Two Recommendations API endpoints can recommend papers: one gives recommendations based on a single seed paper from the user, while the other takes a list of positive seed papers and a list of negative seed papers from the user. Both endpoints return an array of papers in descending order of relevance. We will use the endpoint that takes two lists of positive and negative seed papers, with the URL: http://api.semanticscholar.org/recommendations/v1/papers This is a POST request, so we need to check the endpoint’s Request Body Schema section in the API documentation, to see the format in which the data must be sent in the body of the request. Figure 7. The Request Body Schema section describes how to format the data in a POST request. The positive and negative seed paperIds need to be sent as two arrays, positivePaperIds and negativePaperIds . For positivePaperIds , we’ll use two positive seed papers: Human-Centred AI in Education in the Age of Generative AI Tools , paperId 02138d6d094d1e7511c157f0b1a3dd4e5b20ebee Responsible Adoption of Generative AI in Higher Education: Developing a \"Points to Consider” Approach Based on Faculty Perspectives , paperId 018f58247a20ec6b3256fd3119f57980a6f37748 For negativePaperIds , we’ll use one negative seed paper: A Novel Generative AI-Based Framework for Anomaly Detection in Multicast Messages in Smart Grid Communications, paperId 0045ad0c1e14a4d1f4b011c92eb36b8df63d65bc In our request to this API endpoint, we provide the following query parameters: The fields query parameter, with the citationCount field, which returns how much that particular paper is cited by other papers. We won’t include the influentialCitationCount field here, but that field keeps track of how often the paper has a big influence on other papers. The limit query parameter, which limits the number of recommended papers returned. We’ll set this to the max value of 500. In a new Python script, the request is formatted and sent to the API endpoint. import requests import json # Define the API endpoint URL url = \"https://api.semanticscholar.org/recommendations/v1/papers\" # Define the query parameters query_params = { \"fields\": \"title,url,citationCount,authors\", \"limit\": \"500\" } # Define the request data data = { \"positivePaperIds\": [ \"02138d6d094d1e7511c157f0b1a3dd4e5b20ebee\", \"018f58247a20ec6b3256fd3119f57980a6f37748\" ], \"negativePaperIds\": [ \"0045ad0c1e14a4d1f4b011c92eb36b8df63d65bc\" ] } # Directly define the API key (Reminder: Securely handle API keys in production environments) api_key = \"your api key goes here\" # Replace with the actual API key # Define headers with API key headers = {\"x-api-key\": api_key} # Send the API request response = requests.post(url, params=query_params, json=data, headers=headers).json() # Sort the recommended papers by citation count papers = response[\"recommendedPapers\"] papers.sort(key=lambda paper: paper[\"citationCount\"], reverse=True) with open('recommended_papers_sorted.json', 'w') as output: json.dump(papers, output) A successful request returns a response with the recommendedPapers parameter. Since we want to see the most cited papers, the papers are sorted by the citationCount parameter, then the results are written to a JSON file, recommended_papers_sorted.json: [ { \"paperId\": \"833ff07d2d1be9be7b12e88487d5631c141a2e95\", \"url\": \"https://www.semanticscholar.org/paper/833ff07d2d1be9be7b12e88487d5631c141a2e95\", \"title\": \"Teacher Professional Development on Self-Determination Theory\\u2013Based Design Thinking in STEM Education\", \"citationCount\": 24, \"authors\": [ { \"authorId\": \"2281351310\", \"name\": \"Thomas K. F. Chiu\" }, { \"authorId\": \"2281342663\", \"name\": \"C. Chai\" }, { \"authorId\": \"2300302076\", \"name\": \"P. J. Williams\" }, { \"authorId\": \"2300141520\", \"name\": \"Tzung-Jin Lin\" } ] }, { \"paperId\": \"144b8d9c10ea111598aa239100cd6ed5c6137b1c\", \"url\": \"https://www.semanticscholar.org/paper/144b8d9c10ea111598aa239100cd6ed5c6137b1c\", \"title\": \"Artificial intelligence as part of future practices in the architect\\u2019s work: MidJourney generative tool as part of a process of creating an architectural form\", \"citationCount\": 19, \"authors\": [ { \"authorId\": \"2300748516\", \"name\": \"Anna Jaruga-Rozdolska\" } ] }, The recommended papers are now sorted in descending order of citation count, with a paper with 24 citations at the top of the list. See the S2folks GitHub for an example of using the recommendations endpoint that takes a single seed paper. Step 3: Look up authors # Use Case: We want to get more information about the authors of the highest cited paper. The batch authors endpoint in Academic Graph API can return information about multiple authors: https://api.semanticscholar.org/graph/v1/author/batch . This endpoint is a POST, and it accepts an array of authorId s called ids in the request body. The array includes authorId s of the four authors of the most cited paper: 2281351310 2281342663 2300302076 2300141520 The only query parameter accepted by the endpoint is fields , where we can request more detailed information about the authors, including: The author name The url of the author’s page on Semantic Scholar Their number of papers in Semantic Scholar, called paperCount The author’s hIndex , a measure of their research impact An array of all papers by the author in Semantic Scholar In a new Python script, the request is sent to the API endpoint. import requests import json # Define the API endpoint URL url = \"https://api.semanticscholar.org/graph/v1/author/batch\" # Define the query parameters query_params = { \"fields\": \"name,url,paperCount,hIndex,papers\" } # Define the request data data = { \"ids\": [\"2281351310\",\"2281342663\",\"2300302076\",\"2300141520\"] } # Directly define the API key (Reminder: Securely handle API keys in production environments) api_key = \"your api key goes here\" # Replace with the actual API key # Define headers with API key headers = {\"x-api-key\": api_key} # Send the API request response = requests.post(url, params=query_params, json=data, headers=headers).json() # Save the results to json file with open('author_information.json', 'w') as output: json.dump(response, output) The successful request returns an array of objects that contain author information. [ { \"authorId\": \"2281351310\", \"url\": \"https://www.semanticscholar.org/author/2281351310\", \"name\": \"Thomas K. F. Chiu\", \"paperCount\": 2, \"hIndex\": 1, \"papers\": [ { \"paperId\": \"630642b7040a0c396967e4dab93cf73094fa4f8f\", \"title\": \"An experiential learning approach to learn AI in an online workshop\" }, { \"paperId\": \"833ff07d2d1be9be7b12e88487d5631c141a2e95\", \"title\": \"Teacher Professional Development on Self-Determination Theory\\u2013Based Design Thinking in STEM Education\" } ] }, See the S2folks GitHub for other interesting examples of using the author endpoints. Additional Resources # Pagination # Pagination is a technique used in APIs to manage and retrieve large sets of data in smaller, manageable chunks. This is particularly useful when dealing with extensive datasets to improve efficiency and reduce the load on both the client and server. Some Semantic Scholar endpoints, like paper relevance search , require the use of the limit and offset parameters to handle pagination: Limit: Specifies the maximum number of items (e.g., papers) to be returned in a single API response. For example, in the request https://api.semanticscholar.org/graph/v1/paper/search?query=halloween\u0026limit=3 , the limit=3 indicates that the response should include a maximum of 3 papers. Offset: Represents the starting point from which the API should begin fetching items. It helps skip a certain number of items. For example, if offset=10 , the API will start retrieving items from the 11th item onward. Other endpoints, like paper bulk search , require the use of the token parameter to handle pagination: Token: A “next” token or identifier provided in the response, pointing to the next set of items. It allows fetching the next page of results. In either case, the client requests the API for the first page of results. The API responds with a limited number of items. If there are more items to retrieve, the client can use the offset parameter or the next token in subsequent requests to get the next page of results until all items are fetched. This way, pagination allows clients to retrieve large datasets efficiently, page by page, based on their needs. Examples using search query parameters # Semantic Scholar’s paper bulk search supports a variety of operators that enable advanced filtering and precise specifications in search queries. All keywords in the search query are matched against words in the paper’s title and abstract . Refer to the API Documentation for all supported operators. Below are examples of varying complexity to help you get started. Example 1. ((cloud computing) | virtualization) +security -privacy Matches papers containing the words \"cloud” and “computing\", OR the word \"virtualization\" in their title or abstract. The paper title or abstract must also include the term \"security\" but should exclude the word \"privacy\". For example, a paper with the title \"Ensuring Security in Cloud Computing Environments\" could be included, unless its abstract contains the word “privacy”. Example 2. \"red blood cell\" + artificial intelligence Matches papers where the title or abstract contains the exact phrase “red blood cell” along with the words “artificial” and “intelligence”. For example, a paper with the title \"Applications of Artificial Intelligence in Healthcare\" would be included if it also contained the phrase “red blood cell” in its abstract. Example 3. fish* Matches papers where the title or abstract contains words with “fish” in their prefix, such as “fishtank”, “fishes”, or “fishy”. For example a paper with the title \"Ecology of Deep-Sea Fishes\" would be included. Example 4. bugs~3 Matchespapers where the title or abstract contains words with an edit distance of 3 from the word “bugs”, such as “buggy”, “but”, \"buns\", “busg”, etc. An edit is the addition, removal, or change of a single character. Example 5. “blue lake” ~3 Matches paperswhere the title or abstract contains phrases with up to 3 terms between the words specified in the phrase. For example, a paper titled “Preserving blue lakes during the winter” or with an abstract containing a phrase such as “ blue fishes in the lake” would be included. How to download full datasets # Semantic Scholar datasets contain data on papers, authors, abstracts, embeddings, and more. Datasets are grouped by releases, and each release is a snapshot of the datasets at the time of that release date. Make requests to the Datasets API to see the list of available release dates, to list the datasets contained in a given release, and to download links to datasets. All Semantic Scholar datasets are delivered in JSON format. Step 1: See all release dates Use the list of available releases endpoint to see all dataset release dates. import requests # Define base URL for datasets API base_url = \"https://api.semanticscholar.org/datasets/v1/release/\" # To get the list of available releases make a request to the base url. No additional parameters needed. response = requests.get(base_url) # Print the response data print(response.json()) The response is a list of release dates, which contain all releases through the date the request was made: Step 2: See all datasets for a given release date Use the list of datasets in a release endpoint to see all datasets contained in a given release. The endpoint takes the release_id , which is simply the release date, as a query parameter. The release_id can also be set to “latest” instead of the actual date value to retrieve datasets from the latest release. import requests base_url = \"https://api.semanticscholar.org/datasets/v1/release/\" # Set the release id release_id = \"2023-10-31\" # Make a request to get datasets available the latest release response = requests.get(base_url + release_id) # Print the response data print(response.json()) Step 3: Get download links for datasets Use the download links for a dataset endpoint to get download links for a specific dataset at a specific release date. This step requires the use of a Semantic Scholar API key. import requests base_url = \"https://api.semanticscholar.org/datasets/v1/release/\" # This endpoint requires authentication via api key api_key = \"your api key goes here\" headers = {\"x-api-key\": api_key} # Set the release id release_id = \"2023-10-31\" # Define dataset name you want to download dataset_name = 'papers' # Send the GET request and store the response in a variable response = requests.get(base_url + release_id + '/dataset/' + dataset_name, headers=headers) # Process and print the response data print(response.json()) The response contains the dataset name, description, a README with license and usage information, and temporary, pre-signed download links for the dataset files: How to update datasets with incremental diffs # The incremental diffs endpoint in the Datasets API allows users to get a comprehensive list of changes—or “diffs”—between any two releases. Full datasets can be updated from one release to another to avoid downloading and processing data that hasn't changed. This endpoint requires the use of a Semantic Scholar API key. This endpoint returns a list of all the \"diffs\" required to catch a given dataset up from the start release date to the end release date, with each “diff” object containing only the changes from one release to the next sequential release. Each \"diff\" object itself contains two lists of files: an \"update files\" list and a \"delete files\" list. Records in the \"update files\" list need to be inserted or replaced by their primary key. Records in the \"delete files\" list should be removed from your dataset. import requests # Set the path parameters start_release_id = \"2023-10-31\" end_release_id = \"2023-11-14\" dataset_name = \"authors\" # Set the API key. For best practice, store and retrieve API keys via environment variables api_key = \"your api key goes here\" headers = {\"x-api-key\": api_key} # Construct the complete endpoint URL with the path parameters url = f\"https://api.semanticscholar.org/datasets/v1/diffs/{start_release_id}/to/{end_release_id}/{dataset_name}\" # Make the API request response = requests.get(url, headers=headers) # Extract the diffs from the response diffs = response.json()['diffs'] print(diffs) Tips for working with downloaded datasets # Explore the following sections for inspiration on leveraging your downloaded data. Please be aware that the tools, libraries, and frameworks mentioned below are not a comprehensive list and their performance will vary based on the size of your data and machine’s capabilities. They are all external tools with no affiliation to Semantic Scholar, and are simply offered as suggestions to facilitate your initial exploration of our data. Command line tools Perhaps the simplest way to view your downloaded data is via the command line through commands like more and tools like jq . 1. The more command You can use the more command without installing any external tool or library. This command is used to display the contents of a file in a paginated manner and lets you page through the contents of your downloaded file in chunks without loading up the entire dataset. It shows one screen of text at a time and allows you to navigate through the file using the spacebar (move forward one screen) and Enter (move forward one line) commands. Example : You downloaded the papers dataset, and renamed the file to “papersDataset”. Use the “more papersDataset” command to view the file: 2. The jq tool jq is a lightweight and flexible command-line tool for exploring and manipulating JSON data. With jq , you can easily view formatted json output, select and view specific fields, filter data based on conditions, and more. Example : You downloaded the papers dataset, and renamed the file to “papersDataset”. The jq command to format output is jq ‘.’ , so use the jq. papersDataset command to view the formatted file: Example: You want to filter publication venues that are only journals. You can use jq to filter json objects by a condition with the command jq ‘. | select(has(“type”) and.type == “journal”)’ publicationVenues Python Pandas library Pandas is a powerful and easy-to-use data analysis and manipulation library available in Python. Using Pandas, you can effortlessly import, clean, and explore your data. One of the key structures in Pandas is a DataFrame , which can be thought of as a table of information, akin to a spreadsheet with rows and columns. Each column has a name, similar to a header in Excel, and each row represents a set of related data. With a DataFrame, tasks like sorting, filtering, and analyzing your data are straightforward. Now we will see how to leverage basic Pandas functions to view and explore our Semantic Scholar data in a DataFrame. Example : The head function. In Pandas you can use the head( ) function to view the initial few rows of your dataframe. import pandas as pd # Read JSON file into Pandas DataFrame. The ‘lines’ parameter indicates that our file contains one json object per line df = pd.read_json('publication venues dataset', lines=True) # Print the first few rows of the DataFrame print(df.head()) The output is below. You will notice that this is a very wide dataframe, where each column represents a field in our json object (e.g. id, name, issn, url, etc.). By default pandas only shows the first and last columns. To view all the columns, you can configure the pandas display settings before printing your output, with pd.set_option('display.max_columns', None) Example : The count function. We can use the count( ) function to count the number of rows that have data in them (e.g. not null). This can be useful to test the quality of your dataset. # Display count of non-null values for each column print(df.count()) Output: Example: Filtering. We can filter our data by specifying conditions. For example, let’s assume we have loaded our authors' dataset into a dataframe, and want to filter by authors who have written at least 5 papers and been cited at least 10 times. After applying this filter, let's select and display only the authorid , name , papercount , and citationcount fields. #filter dataframe by authors who have more than 5 publications and have been cited at least 10 times df = df[(df.papercount \u003e= 5) \u0026 (df.citationcount \u003e= 10)] # Select and print a subset of the columns in our filtered dataframe print(df\u003ca href=\"\u0026#39;authorid\u0026#39;%2C%20\u0026#39;name\u0026#39;%2C%20\u0026#39;papercount\u0026#39;%2C%20\u0026#39;citationcount\u0026#39;\"\u003e\u0026#39;authorid\u0026#39;, \u0026#39;name\u0026#39;, \u0026#39;papercount\u0026#39;, \u0026#39;citationcount\u0026#39;\u003c/a\u003e) Output: Example: Sorting. Pandas offers a variety of sorting functions to organize our data. In the example below, we use the sort_values( ) function to sort the dataframe by the “name” column and only display the authorid and name columns. The default is ascending order, so in this case our output will list authors in alphabetical order. e can filter our data by specifying conditions. For example, let’s assume we have loaded our authors' dataset into a dataframe, and want to filter by authors who have written at least 5 papers and been cited at least 10 times. After applying this filter, let's select and display only the authorid , name , papercount , and citationcount fields. #Let's sort our authors in alphabetical order df = df.sort_values(by='name') Output: Example: Check for missing values. Let’s say we want to assess the quality of our data by checking for missing (null) values. We can count how many missing values we have by using the isnull() and sum() functions. # Count and print the number of missing values for each author attribute print(df.isnull().sum()) Output: Apache Spark (Python examples) Apache Spark is a fast and powerful processing engine that can analyze large-scale data faster than traditional methods via in-memory caching and optimized query execution. Spark offers APIs for a variety of programming languages, so you can utilize its capabilities regardless of the language you are coding in. In our examples we will showcase the Spark Python API , commonly known as PySpark . Example: The show function. PySpark’s show( ) function is similar to print( ) or head( ) in pandas and will display the first few rows of data. Let’s load up our publication venues data into a PySpark DataFrame and see how it looks: from pyspark.sql import SparkSession # Create a Spark session spark = SparkSession.builder.appName(\"dataset_exploration\").getOrCreate() # Read the dataset file named 'publication venues dataset' into a PySpark DataFrame. Depending on the directory you are working from you may need to include the complete file path. df = spark.read.json(\"publication venues dataset\") # Display the first few rows df.show() Output: Example: The printSchema function. PySpark offers a handy printSchema( ) function if you want to explore the structure of your data # Display the object schema df.printSchema() Output: Example: Summary statistics. PySpark offers a handy describe( ) function to delve into and display summary statistics for the specified columns in our dataset. In this example we describe the papercount, citationcount , and orderBy attributes of our author data. In the results we can see the average papercount of authors in this dataset, along with their average citationcount , hindex , and other common statistical measures. df.describe([\"papercount\", \"citationcount\", \"hindex\"]).show() Output: Example: Sorting. We can call the orderBy( ) function and specify the column we want to sort by, in this case papercount. We also call the desc() function to sort in descending order (from highest to lowest papercount). We also only want to display the authorid, name, and papercount fields, and display the top 3 records. df = df.orderBy(col(\"papercount\").desc()) df.select(\"authorid\", \"name\", \"papercount\").show(3) Output: MongoDB MongoDB is a fast and flexible database tool built for exploring and analyzing large scale datasets. Think of it as a robust digital warehouse where you can efficiently organize, store, and retrieve large volumes of data. In addition, MongoDB is a NoSQL database that stores data in a flexible schema-less format, scales horizontally, supports various data models, and is optimized for performance. MongoDB offers both on-premise and fully managed cloud options ( Atlas ) and can be accessed via the Mongo shell or a GUI (known as Mongo Compass ). You can check out our guide on setting up Mongo if you need help getting started. In the example below, we have imported a papers dataset into a Mongo Atlas cluster and show you how to leverage the Mongo Compass GUI to view and explore your data. Once you have imported your data, you can view it via Compass as shown in the example below. You can leverage the Compass documentation to discover all its capabilities. We have listed some key items on the user interface to get you acquainted: Data can be viewed in the default list view (shown below), object view, or table view by toggling the button on the upper right hand corner. In the list view, each ‘card’ displays a single record, or in this case a paper object. Notice that MongoDB appends its own ID, known as ObjectId to each record. You can filter and analyze your data using the filter pane at the top of the screen, and click on the Explain button to see how your filters were applied to obtain your result set. Note that since Mongo is a NoSQL database, it has a slightly different query language from SQL to use for filtering and manipulation. The default tab is the Documents tab where you can view and scroll through your data. You can also switch to the Aggregations tab to transform, filter, group, and perform aggregate operations on your dataset. In the Schema tab, Mongo provides an analysis of the schema of your dataset. When you click on the Indexes tab, you will find that the default index for searches is Mongo’s ObjectId . If you believe you will perform frequent searches using another attribute (e.g. corpusid) , you can add an additional index to optimize performance. You can always add more data to your dataset via the green Add Data button right under the filter query bar Setting Up MongoDB You have the option of installing MongoDB onto your machine, or using their managed database-as-a-service option on the cloud, otherwise known as Atlas . Once you set up your database, you can download the GUI tool ( Mongo Compass ) and connect it to your database to visually interact with your data. If you are new to mongo and want to just explore, you can setup a free cluster on Atlas with just a few easy steps: Set Up a Free Cluster on MongoDB Atlas: Sign Up/Login: 1.1. Visit the MongoDB Atlas website. 1.2. Sign up for a new account or log in if you already have one. Create a New Cluster: 2.1. After logging in, click on \"Build a Cluster.\" 2.2. Choose the free tier (M0) or another desired plan. 2.3. Select your preferred cloud provider and region. Configure Cluster: 3.1. Set up additional configurations, such as cluster name and cluster tier. 3.2. Click \"Create Cluster\" to initiate the cluster deployment. It may take a few minutes. Connect to MongoDB Compass: Download and Install MongoDB Compass: 1.1. Download MongoDB Compass from the official website. 1.2. Install the Compass application on your computer. Retrieve Connection String: 2.1. In MongoDB Atlas, go to the \"Clusters\" section. 2.2. Click on \"Connect\" for your cluster. 2.3. Choose \"Connect Your Application.\" 2.4. Copy the connection string. Connect Compass to Atlas: 3.1. Open MongoDB Compass. 3.2. Paste the connection string in the connection dialog. 3.3. Modify the username, password, and database name if needed. 3.4. Click \"Connect.\" Import Data: Create a Database and Collection: 1.1. In MongoDB Compass, navigate to the \"Database\" tab. 1.2. Create a new database and collection by clicking \"Create Database\" and \"Add My Own Data.\" Import Data: 2.1. In the new collection, click \"Add Data\" and choose \"Import File.\" 2.2. Select your JSON or CSV file containing the data. 2.3. Map fields if necessary and click \"Import.\" Verify Data: 3.1. Explore the imported data in MongoDB Compass to ensure it's displayed correctly. Now, you have successfully set up a free cluster on MongoDB Atlas, connected MongoDB Compass to the cluster, and imported data into your MongoDB database. This process allows you to start working with your data using MongoDB's powerful tools. TIP: We recommend checking the Mongo website for the latest installation instructions and FAQ in case you run into any issues. Example: Querying, Filtering, and Sorting . Using the Mongo Compass GUI we can filter and sort our dataset per our needs. For example, let's see which papers in Medicine were cited the most in the last 5 years, and exclude any papers with under 50 citations. In the project field we choose which fields we would like to display in the output, and we sort in descending order by citationcount { 's2fieldsofstudy.category': 'Medicine', 'citationcount': { '$gte': 50 }, 'year': { '$gte': 2019, '$lte': 2023 } } Output: Working with Multiple Datasets # Oftentimes we may want to combine information from multiple datasets to gather insights. Consider the following example: Use case: Let’s delve into a publication venue, such as the “Journal of the Geological Society”, and learn more about the papers that have been published in it. Perhaps we would like to gather the names of authors who have published a paper in this journal, but only those whose papers have been cited at least 15 times. We can combine information from the publication venues dataset and the papers dataset to find the authors that meet this criteria. To do this, we can load our datasets into pandas dataframes and retrieve the publication venue ID associated with the “Journal of the Geological Society” from the publication venues dataset. Then we can search the papers dataset for papers that have a citationcount of at least 15 and are tagged to that venue ID. Finally we can collect the names of authors associated with each of those papers that met our criteria. From this point you can explore other possibilities, such as viewing other papers published by those authors, checking out their homepage on the Semantic Scholar website, and more. Python Example: import pandas as pd # Create Pandas DataFrames papers_df = pd.read_json('papersDataset', lines=True) venues_df = pd.read_json('publicationVenuesDataset', lines=True) # Find the venue id for our publication venue of interest - \"Journal of the Geological Society\" publication_venue_id = venues_df.loc[venues_df[\"name\"] == \"Journal of the Geological Society\", \"id\"].values[0] # Filter papers based on the venue id with a citation count of at least 15 filtered_geology_papers = papers_df.loc[ (papers_df[\"publicationvenueid\"] == publication_venue_id) \u0026 (papers_df[\"citationcount\"] \u003e= 15) ] # Traverse the list of authors for each paper that met our filter criteria and collect their names into a list author_names = [] for authors_list in filtered_geology_papers[\"authors\"]: # Print the resulting author names, with each name on a new line print(\"Authors associated with papers from the Journal of the Geological Society:\") print(*author_names, sep=\"\\n\") Output:","tags":["clippings"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"Skills","updated":"2026-10-25T17:37:28.608Z","url":"ai-automation/notes/7cd0e880b23dd8d22b319d34.html"},{"kbId":"KB-000106","title":"Han-Z02/caveman: 🪨 why use many token when few token do trick — Claude Code skill that cuts 65% of tokens by talking like caveman","subtitle":"","summary":"🪨 why use many token when few token do trick — Claude Code skill that cuts 65% of tokens by talking like caveman - Han-Z02/caveman","body":"穴居人 # 为什么用那么多代币，几个就能搞定的事儿呢？ 前后对比 • 安装 • 级别 • 技能 • 基准 • 评价 Claude Code 的 一项技能/插件和 Codex 插件，让智能体像原始人一样说话——在保持技术准确性的同时，减少 约 75% 的输出标记 。现在新增了 文言文模式 、 简洁的提交 、 单行代码审查 ，以及一个 压缩工具 ，每次会话可减少 约 45% 的输入标记 。 基于一项广为流传的观察：使用原始语言能显著降低 LLM 代币的使用量，同时又不损失技术实质。因此，我们将其简化为一行安装命令。 之前/之后 # ### 🗣️普通克劳德（69代币） \u003e “你的 React 组件重新渲染的原因很可能是因为你在每次渲染周期都创建了一个新的对象引用。当你将一个内联对象作为 prop 传递时，React 的浅比较机制每次都会将其视为不同的对象，从而触发重新渲染。我建议使用 useMemo 来缓存该对象。” ### 🪨 穴居人克劳德（19 个代币） \u003e “每次渲染都使用新的对象引用。内联对象属性 = 新的引用 = 重新渲染。用 useMemo 包裹。” ### 🗣️ 普通克劳德 \u003e “当然可以！我很乐意帮忙。您遇到的问题很可能是由于您的身份验证中间件没有正确验证令牌过期造成的。让我看看并提出解决方案。” ### 🪨穴居人克劳德 \u003e “身份验证中间件存在错误。令牌过期检查使用的是 \u003c 而不是 \u003c= 。修复方法：” 同样的解决方法。字数减少了75%。大脑依然强大。 选择你的哼哼声级别： #### 🪶 一点点 \u003e \"Your component re-renders because you create a new object reference each render. Inline object props fail shallow comparison every time. Wrap it in useMemo .\" #### 🪨 Full \u003e \"New object ref each render. Inline object prop = new ref = re-render. Wrap in useMemo .\" #### 🔥 Ultra \u003e \"Inline obj prop → new ref → re-render. useMemo .\" #### 📜 文言文 \u003e \"物出新參照，致重繪。useMemo Wrap之。\" Same answer. You pick how many word. ┌─────────────────────────────────────┐ │ TOKENS SAVED ████████ 75% │ │ TECHNICAL ACCURACY ████████ 100%│ │ SPEED INCREASE ████████ ~3x │ │ VIBES ████████ OOG │ └─────────────────────────────────────┘ Faster response — less token to generate = speed go brrr Easier to read — no wall of text, just the answer Same accuracy — all technical info kept, only fluff removed ( science say so ) Save money — ~71% less output token = less cost Fun — every code review become comedy Install # npx skills add JuliusBrussee/caveman npx skills supports 40+ agents — Claude Code, GitHub Copilot, Cursor, Windsurf, Cline, and more. To install for a specific agent: npx skills add JuliusBrussee/caveman -a cursor npx skills add JuliusBrussee/caveman -a github-copilot npx skills add JuliusBrussee/caveman -a cline npx skills add JuliusBrussee/caveman -a windsurf npx skills add JuliusBrussee/caveman -a codex Or with Claude Code plugin system: claude plugin marketplace add JuliusBrussee/caveman claude plugin install caveman@caveman Codex: Clone repo Open Codex in repo Run /plugins Search Caveman Install plugin 说明 Note Windows Codex users: Clone repo → VS Code → Codex Settings → Plugins → find Caveman under local marketplace → Install → Reload Window. Also enable git config core.symlinks true before cloning (requires developer mode or admin). Install once. Use in all sessions after that. One rock. That it. Usage # Trigger with: /caveman or Codex $caveman \"talk like caveman\" \"caveman mode\" \"less tokens please\" Stop with: \"stop caveman\" or \"normal mode\" Intensity Levels # Level Trigger What it do Lite /caveman lite Drop filler, keep grammar. Professional but no fluff Full /caveman full Default caveman. Drop articles, fragments, full grunt Ultra /caveman ultra Maximum compression. Telegraphic. Abbreviate everything 文言文 (Wenyan) Mode # Classical Chinese literary compression — same technical accuracy, but in the most token-efficient written language humans ever invented. Level Trigger What it do Wenyan-Lite /caveman wenyan-lite Semi-classical. Grammar intact, filler gone Wenyan-Full /caveman wenyan Full 文言文. Maximum classical terseness Wenyan-Ultra /caveman wenyan-ultra Extreme. Ancient scholar on a budget Level stick until you change it or session end. Caveman Skills # Skill What it do Trigger caveman-commit Terse commit messages. Conventional Commits. ≤50 char subject. Why over what. /caveman-commit caveman-review One-line PR comments: L42: 🔴 bug: user null. Add guard. No throat-clearing. /caveman-review caveman-compress # Caveman make Claude speak with fewer tokens. Compress make Claude read fewer tokens. Your CLAUDE.md loads on every session start . Caveman Compress rewrites memory files into caveman-speak so Claude reads less — without you losing the human-readable original. /caveman:compress CLAUDE.md CLAUDE.md ← compressed (Claude reads this every session — fewer tokens) CLAUDE.original.md ← human-readable backup (you read and edit this) File Original Compressed Saved claude-md-preferences.md 706 285 59.6% project-notes.md 1145 535 53.3% claude-md-project.md 1122 687 38.8% todo-list.md 627 388 38.1% mixed-with-code.md 888 574 35.4% Average 898 494 45% Code blocks, URLs, file paths, commands, headings, dates, version numbers — anything technical passes through untouched. Only prose gets compressed. See the full caveman-compress README for details. Security note : Snyk flags this as High Risk due to subprocess/file patterns — it's a false positive. Benchmarks # Real token counts from the Claude API ( reproduce it yourself ): Task Normal (tokens) Caveman (tokens) Saved Explain React re-render bug 1180 159 87% Fix auth middleware token expiry 704 121 83% Set up PostgreSQL connection pool 2347 380 84% Explain git rebase vs merge 702 292 58% Refactor callback to async/await 387 301 22% Architecture: microservices vs monolith 446 310 30% Review PR for security issues 678 398 41% Docker multi-stage build 1042 290 72% Debug PostgreSQL race condition 1200 232 81% Implement React error boundary 3454 456 87% Average 1214 294 65% Range: 22%–87% savings across prompts. 重点 Important Caveman only affects output tokens — thinking/reasoning tokens are untouched. Caveman no make brain smaller. Caveman make mouth smaller. Biggest win is readability and speed , cost savings are a bonus. A March 2026 paper \"Brevity Constraints Reverse Performance Hierarchies in Language Models\" found that constraining large models to brief responses improved accuracy by 26 percentage points on certain benchmarks and completely reversed performance hierarchies. Verbose not always better. Sometimes less word = more correct. Evals # Caveman not just claim 75%. Caveman prove it. The evals/ directory has a three-arm eval harness that measures real token compression against a proper control — not just \"verbose vs skill\" but \"terse vs skill\". Because comparing caveman to verbose Claude conflate the skill with generic terseness. That cheating. Caveman not cheat. # Run the eval (needs claude CLI) uv run python evals/llm_run.py # Read results (no API key, runs offline) uv run --with tiktoken python evals/measure.py Snapshots committed to git. CI runs free. Every number change reviewable as diff. Add a skill, add a prompt — harness pick it up automatically. Star This Repo # If caveman save you mass token, mass money — leave mass star. ⭐ Also by Julius Brussee # Blueprint — specification-driven development for Claude Code. Natural language → blueprints → parallel builds → working software. Revu — local-first macOS study app with FSRS spaced repetition, decks, exams, and study guides. revu.cards","tags":["clippings"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"Claude Code","updated":"2026-10-25T17:37:28.608Z","url":"ai-automation/notes/a48da22faa99356dfbf28cb6.html"},{"kbId":"KB-000105","title":"简单将任意模型接入Claude Code","subtitle":"","summary":"今天，和大家分享下如何简单的让Claude Code接入任意的大模型，不管是Gemini、GPT、Qwen、三方中转等API都支持。 一、先搞明白，Claude Code是个啥？ Claude Code 是由 Anthropic 开发的一款智能编程工具（也称为…","body":"今天，和大家分享下如何简单的让 Claude Code 接入任意的大模型，不管是Gemini、GPT、Qwen、三方中转等API都支持。 一、先搞明白，Claude Code是个啥？ Claude Code 是由 Anthropic 开发的一款智能编程工具（也称为编程助手或AI代理）。 它直接在开发者的终端环境中运行，能够理解整个代码库，并通过自然语言指令帮助开发者更高效地编写、理解和修改代码。 对于开发工作相关的同学来说，它能干嘛？ 项目冷启动？ 搭框架。（“用Next.js + TypeScript给我搭个项目框架，带上 ESLint 和 Prettier 配置。”） 祖传代码看不懂？ 扔给它，帮你梳理逻辑，加注释。（“@legacy_api.py 这个文件是干嘛的？给我解释一下核心逻辑，并加上中文注释。”） 屎山想重构？ 它就是你的铲屎官。（“重构这个Java类，把回调地狱改成响应式编程风格，用 Project Reactor 实现。”） 排查BUG？ 把错误日志甩给它，秒定位问题，然后直接帮你修复。 想学门新语言？ 让它把你的Python项目翻译成Go，边看边学，事半功倍。 对于想要给工作提效的同学来说，它又能干嘛？ 自动化日常任务： 用一句话让它批量整理文件、重命名照片，或从文档中提取信息（如邮箱、电话）并存入表格，告别手动复制粘贴。 成为你的数据分析师： 无需复杂的软件，直接向它提问，就能快速分析表格数据，找出关键信息，比如哪个产品卖得最好？。 做你的编程与学习导师： 想学做网页或写个小脚本？它能手把手教你，为你生成代码、解释原理。 帮你实现创意想法： 你可以通过与它对话，一步步将自己的小工具或个人网站的想法变为现实。 总之一句话： 你负责想，Claude Code负责实现。 二、简单搞定安装： 废话不多说，直接上干货。想用上这么好用的工具，马上开始实操 第一步：安装 NodeJS Claude Code 需要NodeJs才可以运行 首先访问： nodejs.org ，下载最新LTS版本的NodeJs 根据你使用的系统，选择对应的版本，下载好之后一直下一步安装即可 第二步：安装Claude Code和Claude Code Router Claude Code 是我们今天的主角， Claude Code Router 则是一个非常优秀的开源项目，可以让我们简单的几步操作就可以将任意的大模型接入 Claude Code 。 打开你的终端（命令行工具），执行以下的命令 首先安装claude-code；输入以下命令，回车执行 npm install -g @anthropic-ai/claude-code 上一个执行完成之后，安装 Claude Code Router；；输入以下命令，回车执行 npm install -g @musistudio/claude-code-router 第三步：配置接入大模型 打开终端，输入 ccr ui 如果你已经成功安装好了 Claude Code和Claude Code Router， 这个时候应该会自动在浏览器弹出一个可视化配置的页面 点击添加供应商 Claude Code Router 预置了许多模板，如果你要使用的服务商在里面，直接选择即可，然后填写APIKey就可以完成配置了 如果你是用三方服务商的API，可以参考我这里的配置 名称：任意填写 API完整地址：一定要填写API服务商的完整URL API密钥：填入API服务商提供的密钥 想使用国外的顶级大模型，但是又没有渠道可以尝试下： 即用API ： jy.ai-wx.cn 这个API是我经常使用的，模型数量多，按量按次的都有，新用户有一定的免费额度 模型配置完成后，在右侧的路由选择下刚刚配置好的模型作为默认模型，下面的选项根据实际需求来配置 最后一定要点击保存并重启，否则配置不会生效 第四步：万事俱备，启动！ 在你想要使用Claude Code的文件目录打开终端，输入： ccr code 就可以启动 Claude Code 启动之后就可以指挥 Claude Code 干活啦 有一些同学可能会不习惯使用命令行的方式编程，觉得使用VS Code会方便些，这也非常简单，只需要在VS Code的终端中输入 ccr code 它会自动帮你安装配套的VS Code扩展 这有啥好处？ 代码看得见摸得着： 你在编辑器里选中一段代码，Claude那边立刻就能知道你在说啥。 一键修改，告别复制粘贴： 它提的代码修改建议，会直接以Diff（差异对比）的形式出现在你面前，你只需要点一下“接受”，代码就自动改好了，方便优雅！ 三、如何让Claude指哪打哪？ 工具是好工具，但很多人用不好，问题出在“不会提问”。 不要废话文学、表达不清楚的提问： “写个排序。”（写啥排序？啥语言？升序降序？） “我代码崩了，救命！”（哪段代码？报了什么错？） “优化一下。”（从哪方面优化？性能？可读性？还是代码结构？） 要高效指令式提问： 任务清晰： “用Python写一个 快速排序 函数，函数名叫 quick_sort ，它应该接受一个 整数列表 ，返回一个 新的排好序的列表 ，并为关键步骤 添加注释 。” 上下文拉满： “我正在运行这段JavaScript代码（ @app.js ），浏览器控制台报了这个错： TypeError: Cannot read properties of undefined ，错误发生在第25行。 我怀疑是API返回的数据结构变了 。你帮我分析下原因，并给出修复建议。” 目标明确： “请重构 fetchData 这个函数（ @api/service.js ）。目标是 提高可读性和错误处理能力 ，请将 .then() 链式调用改为 async/await 语法，并添加一个 try...catch 块来捕获API请求失败的异常。” 看到没？ 上下文、意图、细节 ，这三样给足了，AI给你的反馈质量才会指数级上升。 四、进阶篇：选对模型 掌握了基础对话，你已经能超过80%的用户了。 1. 模型怎么选？ 简单说，这就是 Claude Code 的大脑，模型选的好效果好，模型要选对而不是选贵，合适的才是最好的，不然钱包遭不住。 我来分享些我的小经验： Gemini 2.5 Pro：一 百万超长下文，编程能力相对不错、文本生成能力出色，写出的文章是情商拉满，适合日常对话聊天、编程、工作提效；性价比均衡，不知道怎么选就选2.5Pro一般不会错 Cladue Opus 4.1 ： 编程能力很强大，是其一大特色；价格比较贵，适合经常编程且经济实力不错的同学选择 GPT-5 ： 相比上一代，医疗知识水平提高很大，适合平时聊天和做一些咨询，写文能力相对较弱 国内模型（如 通义千问 、 DeepSeek 等） : 国内的大模型也在快速进步，例如阿里的通义千问（Qwen）和深度求索（DeepSeek）都在各大编程能力评测榜单上取得了不错的成绩。 它们对中文编程场景和文档的理解可能更具优势，并且价格实惠，大家根据需求灵活使用 2. 给你的AI上个“项目Buff”： CLAUDE.md 想让 Claude Code 更懂你的项目？使用 /init 指令， Cladue Code 会自动分析项目的情况然后在项目根目录创建一个叫 CLAUDE.md 的文件。 这个文件就是给AI准备的项目说明书。每次启动， Claude Code 都会先读一遍。有了它， Claude Code 运行时只需要读取一次这个文件，就对项目了如指掌。 写在最后：拥抱新范式，而非新工具 归根结底，我们必须跳出一个狭隘的认知：AI不是一个被动响应的工具箱，而是一个主动赋能的新范式。 拥抱 Claude Code 这样的新一代AI伙伴，正是拥抱这种新范式的开始。 对开发者而言 ，这意味着将繁琐重复的“编码体力活”彻底外包给AI，从而将100%的精力聚焦于架构设计、复杂逻辑和产品创新——这些真正铸就顶尖工程师价值的核心领域。 而这种变革，并不局限于开发者。 无论你从事任何岗位，都可以利用它的能力为自己赋能。比如，让它为你编写一个自动化脚本，将每周数小时的报表整理工作压缩到一键完成。 最终，无论是编写代码还是处理日常事务，目标都是一致的： 将我们从重复、繁琐、无趣的“执行”中解放出来，去思考真正重要的问题，去规划下一步的走向。 这不仅是一次效率的飞跃，更是一次价值的重估。它迫使我们去回答一个根本性的问题： 当执行的成本变得极低时，我们作为人类的独特价值究竟是什么？ 你的答案，将决定你在这个时代的最终位置。 编辑于 2025-08-29 08:00・广东","tags":["clippings"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"Claude Code","updated":"2026-10-25T17:37:28.608Z","url":"ai-automation/notes/9d6f6291fc00b6a241dd546a.html"},{"kbId":"KB-000104","title":"Claude Desktop Windows 安装失败解决","subtitle":"","summary":"来源：Claude Desktop app安装错误解决，Windows下安装Claude Cowork、Claude Codex 相关官方文档：Claude Code Desktop app 在 Windows 上安装 Claude Desktop，用于配合 Claude Cowork / Claude Code 时，官方安装程序可能报错： Claude Desktop 的 Windows 安装程序采用的是： 也就是说，官网下载到的小体积 .exe 本身并不包含完整应用。运行","body":"来源： Claude Desktop app安装错误解决，Windows下安装Claude Cowork、Claude Codex 相关官方文档： Claude Code Desktop app 问题现象 # 在 Windows 上安装 Claude Desktop，用于配合 Claude Cowork / Claude Code 时，官方安装程序可能报错： Download failed. Check your internet connection and try again. Diagnostic log saved to: C:\\Users\\winston\\AppData\\Local\\Temp\\ClaudeSetup.log 原因理解 # Claude Desktop 的 Windows 安装程序采用的是： 引导程序 + 在线下载 也就是说，官网下载到的小体积 .exe 本身并不包含完整应用。运行时它会联网去服务器拉取完整安装包。 因此，如果当前网络环境存在以下情况，就可能导致安装失败： 代理或 VPN 配置不稳定； 防火墙或杀毒软件拦截； 无法访问安装包所在 CDN； storage.googleapis.com 访问异常； 引导程序本身没有正确走系统代理。 解决方案 # 方案一：基础排查 # 先尝试以下简单处理： 关闭 VPN / 代理后重新安装； 如果在国内环境，反过来尝试开启代理； 暂时关闭杀毒软件和防火墙； 右键安装程序，选择「以管理员身份运行」。 如果仍然失败，建议直接使用方案二。 推荐方案：直接下载 MSIX 手动安装 # 这是原教程中推荐、也更稳定的方式：绕过有问题的 .exe 引导安装程序，直接下载完整的 MSIX 安装包。 步骤 1：下载 MSIX 安装包 # 用浏览器访问： https://claude.ai/api/desktop/win32/x64/msix/latest/redirect 浏览器会自动跳转并下载最新版 Claude Desktop 的 Windows MSIX 包。 注意：下载完成后， 不要直接双击打开 。 步骤 2：用管理员 PowerShell 安装 # 在 Windows 搜索栏输入 PowerShell ，右键选择： 以管理员身份运行 然后执行： Add-AppxPackage -Path \"C:\\Users\\你的用户名\\Downloads\\Claude.msix\" 需要把路径替换成你实际下载的 MSIX 文件路径。 例如，如果文件在下载目录，且用户名是 Han ，可能是： Add-AppxPackage -Path \"C:\\Users\\Han\\Downloads\\Claude.msix\" 如果命令执行后没有报错，只是光标回到新行，通常说明安装成功。 如果提示需要开发者模式 # 安装 MSIX 时如果遇到权限错误，可以打开 Windows 开发者模式： Windows 设置 → 系统 → 开发者选项 → 开发人员模式 打开后，重新执行： Add-AppxPackage -Path \"C:\\Users\\你的用户名\\Downloads\\Claude.msix\" 关键结论 # 官方 .exe 安装失败，不一定是 Claude Desktop 不能安装； 常见原因是引导程序联网下载完整包失败； 直接下载 MSIX 并用 PowerShell 安装，通常更可靠； 国内网络环境下，浏览器下载往往比安装器更容易正确处理代理。 相关链接 # Claude Code Desktop app 官方文档 MSIX 最新版下载入口 原始 CSDN 教程 关联笔记 # API/Claudecode/简单将任意模型接入Claude Code.md","tags":["Claude","Claude-Desktop","Claude-Code","Windows","安装问题","troubleshooting"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"Claude Code","updated":"2026-10-25T17:37:28.607Z","url":"ai-automation/notes/cd389e1b5b6e41a4f5894d5c.html"},{"kbId":"KB-000103","title":"让你的 Claude Code 满血复活，Anthropic 在 GitHub 上开源了个插件。","subtitle":"","summary":"","body":"摘要 LLM 归库摘要 核心内容： 这篇剪藏介绍 Anthropic 在 GitHub 开源的 claude-plugins-official 插件目录，以及 Claude Code 中通过 /plugin 安装官方插件的方式。 可复用知识： Claude Code 插件可以包含 Slash Commands、Subagents、Skills、Hooks、MCP Servers 等能力模块；插件安装命令统一为 /plugin install 插件名@claude-plugins-official 。 重点插件： claude-code-setup 用于只读扫描项目并推荐 MCP/Skills/Hooks/Subagents； feature-dev 把功能开发拆成结构化流程； hookify 用自然语言生成 hooks 规则； code-modernization 面向遗留代码迁移。 关联页面建议： 后续可整合到 04 AI_API与自动化库/02_wiki/claude_code/终端中的 AI 编程工作流 ，并可另建 Claude Code 插件与 Hooks 主题页。 下一步处理： 建议在非关键项目中先试用 claude-code-setup 与 hookify ，验证插件安装、权限提示、配置文件变化与实际推荐质量。 归库说明： 分类到 04 AI_API与自动化库，置信度 0.94；依据是标题、正文和命令均围绕 Claude Code、Anthropic 官方插件、Hooks、MCP 与自动化工作流。 逛逛 2026年5月25日 13:02 最近刷 X 的时候，发现一条推文被疯狂转发： Anthropic 悄悄发布了一个官方插件，叫 claude-code-setup，装上后你的 Claude Code 的体验会完全不一样。 然后顺藤摸瓜，发现 Anthropic 其实已经把整个官方插件开源在 GitHub 上了，叫 claude-plugins-official。 现在都 2 万多 Star 了，今天就来聊聊这个开源项目。 01 开源项目简介 claude-plugins-official 是 Anthropic 官方在 GitHub 上维护的 Claude Code 插件目录。 这是一个官方认证的插件市场。 你装了 Claude Code 之后，可以一键从这里面安装各种插件，给你的 Claude Code 加各种能力。 目前仓库里有 30 多个内部插件和 10 多个外部插件，包含了 Code Review、功能开发、遗留代码迁移、Hook 管理、多语言 LSP 支持等场景。 每个插件可以包含： 斜杠命令，快速触发某个工作流 专门的子智能体，干特定的事情 Skills 文件，教 Claude 怎么做某类任务 Hooks，自动触发的钩子，比如保存时自动格式化 MCP Servers，外部工具集成 插件安装只需要一行命令： /plugin install {插件名}@claude-plugins-official 或者直接在 Claude Code 里输入 /plugin ，进图形化界面浏览安装。 开源地址：https://github.com/anthropics/claude-plugins-official 02 必装插件推荐 仓库里插件不少，但不是每个都适合所有人。挑几个我觉得最值得装的聊聊。 claude-code-setup # 这个就是在 X 上被疯狂安利的那个插件。 它的作用很简单但很实用，扫描你的代码库，然后推荐最适合你项目的自动化配置。 你只需要对 Claude 说一句： 帮我 set up 一下当前这个项目 它就会分析你的项目结构、技术栈、依赖关系，然后告诉你： 推荐装哪些 MCP Servers，比如前端项目推荐 Playwright，文档类推荐 context7 推荐用哪些 Skills，比如 Plan agent、frontend-design 推荐配哪些 Hooks，比如自动格式化、自动 lint、敏感文件保护 推荐用哪些 Subagents，安全审查、性能优化、无障碍检测 推荐哪些 Slash Commands，比如 /test、/pr-review 关键是这个插件是只读的，它只分析不修改，不会动你的任何文件。 除非你授权他去修改。 安装命令： /plugin install claude-code-setup@claude-plugins-official feature-dev # 这个插件是我个人觉得也挺惊艳的，日常开发一直在用这个。 它把功能开发变成了一套 7 阶段的结构化流程：发现需求 → 探索代码库 → 澄清问题 → 架构设计 → 编码实现 → 质量审查 → 总结。 这个插件强制你在写代码之前，先把需求搞清楚、把代码库摸透、把架构想明白。 特别是第 4 阶段，它会同时启动 2-3 个架构师 Agent，分别从最小改动、干净架构、务实平衡三个角度设计方案，然后给你对比推荐。 第 6 阶段的质量审查也很硬核，3 个独立的审查 Agent 并行跑：一个看代码质量，一个找 Bug，一个检查是否符合项目规范。 安装命令： /plugin install feature-dev@claude-plugins-official 使用方式： /feature-dev 基于 OAuth 增加用户授权流程 hookify # 这个插件解决了一个痛点：Claude Code 的 Hooks 功能很强大，但配置 hooks.json 文件太繁琐。 hookify 让你用自然语言描述规则就行了： /hookify 当我执行 rm -rf 命令的时候警告我 它会自动帮你生成对应的 markdown 配置文件，立即生效，不用重启。 支持的动作类型也全： bash：监控终端命令 file：监控文件编辑 stop：在 Claude 想要停止时触发 prompt：在用户提交 prompt 时触发 可以设置 warn 警告但允许 或 block 直接拦截。 比如防止误删文件、阻止在 TypeScript 文件里写 console.log、要求提交前必须跑测试，这些场景都能覆盖。 安装命令： /plugin install hookify@claude-plugins-official code-modernization # 这个插件专门做遗留代码现代化。 如果你的项目里有老旧的 COBOL、遗留 Java/C++、单体 Web 应用，这个插件能帮你把它们迁移到现代技术栈，同时保证行为不变。 它有一套很严谨的流程： /modernize-assess billing # 评估遗留代码/modernize-map billing # 构建依赖拓扑图/modernize-extract-rules billing # 提取业务规则/modernize-brief billing java-spring # 生成迁移方案/modernize-transform billing interest-calc java-spring # 逐模块迁移/modernize-reimagine billing \"event-driven services\" # 从业务规则推倒重建/modernize-harden billing # 安全加固遗留系统 整个过程不会直接改你的遗留代码，所有改动都输出到 modernized/ 目录，你自己决定什么时候用。 03 如何使用 整套流程很简单： 第一步，确保你已经安装了 Claude Code。 第二步，在 Claude Code 里输入： /plugin 进入插件管理界面，可以直接浏览和安装所有官方插件。 或者用命令行直接安装指定插件： /plugin install claude-code-setup@claude-plugins-official/plugin install feature-dev@claude-plugins-official/plugin install hookify@claude-plugins-official 第三步，安装完就能用了。 每个插件都有自己的命令或者触发方式，看各插件的 README 就行。 如果你是第一次用，建议先装 claude-code-setup，让它帮你一键分析项目，推荐最适合你的插件组合。 门槛太低了。 04 点击下方卡片，关注逛逛 GitHub 这个公众号历史发布过很多有趣的开源项目，如果你懒得翻文章一个个找，你直接关注微信公众号：逛逛 GitHub ，后台对话聊天就行了： Claude Code · 目录 继续滑动看下一个 逛逛GitHub 向上滑动看下一个 闪记 复制 LaTeX 公式 简洁安装教程 # 先确保已安装 Claude Code ，并在一个普通项目目录中打开 Claude Code。 **打开插件管理界面：**在 Claude Code 里输入： /plugin 然后在界面中搜索、浏览并安装官方插件。 命令行安装单个插件： /plugin install claude-code-setup@claude-plugins-official 按需安装其他推荐插件： /plugin install feature-dev@claude-plugins-official /plugin install hookify@claude-plugins-official **首次建议：**先装 claude-code-setup ，让它只读扫描当前项目并给出 MCP、Skills、Hooks、Subagents、Slash Commands 的推荐；确认建议可靠后，再逐项授权启用或安装。 **安全提醒：**安装和启用 Hooks/MCP 前，先看插件 README 与权限提示；不要把 API key、token、cookie、密码等敏感信息写进公开笔记或插件配置。","tags":["clippings","claude-code","claude-plugins","Anthropic","暂未试用"],"section":"ai-automation","sectionTitle":"AI 与自动化","category":"网页剪藏","updated":"2026-10-25T17:37:28.607Z","url":"ai-automation/notes/020d34344111c05cae9e8414.html"},{"kbId":"KB-000102","title":"如何使用GPT-Image生成可编辑的科研示意图？","subtitle":"","summary":"如何使用GPT-Image生成可编辑的科研示意图？","body":"摘要 LLM 归库摘要 核心内容： 这篇剪藏记录了作者为“生成可编辑科研示意图”测试 GPT-Image、Claude Code、Codex 桌面版、ChatGPT 网页版输出 SVG 等方案的过程。 主要结论： 直接让 AI 从 PNG 反推或生成精确 SVG 往往成本高、token 消耗大且失真明显；相对可行的是 ChatGPT 网页版生成 PNG 后再输出 SVG，并用 Adobe Illustrator 等矢量编辑器继续人工修。 可复用知识： AI 适合作为科研绘图辅助，但最终可编辑性、准确性和发表级美观仍依赖 SVG/AI 等矢量流程与人工校正。 工具边界： Claude Code / Codex 直接写复杂 SVG 容易超过输出上限或误解图像结构；AI 生图存在随机性和潜在“AI 数字签名/水印”问题。 关联页面建议： 可后续整合到 04 AI_API与自动化库/02_wiki/claude_code/科研绘图与可编辑 SVG 工作流 或 04 AI_API与自动化库/02_wiki/skills/AI 科研绘图工具评测 。 下一步处理： 若要沉淀为稳定 workflow，建议实测 ChatGPT→SVG→Illustrator/Inkscape、Open Design、Vectorizer 等路径，并记录输入提示词、输出格式、编辑成本与失败案例。 归库说明： 分类到 04 AI_API与自动化库，置信度 0.88；理由是正文高度集中于 GPT-Image、Claude Code、Codex、SVG 输出和 AI 科研绘图自动化经验。 口天三木 2026年5月23日 19:36 今天受师兄委托，看看有没有法子可以让AI进行科研绘图，要求可编辑的格式 我纳闷了，GPT-image2.0和nano banana都只能做成png静态图片，虽然官网有圈选指定位置修改的功能 但是这功能特别鸡肋啊，反反复复修改甚至没有第一版的要好 后来我问了Claude ，他跟我说： 最好的办法就是使用svg代码绘制图像，然后到svg编辑器（比如开源的inkspace和破解版的Adobe illustrator） 只有这样子出来的图片后期才可以手动编辑 GPT给的建议也是这样： 然后吧，我自己把上面几种方式都试了个遍，其实效果也没有那么好，而且这些付费工具贵得离谱 ![图片](data:image/svg+xml,%3C%3Fxml version='1.0' encoding='UTF-8'%3F%3E%3Csvg width='1px' height='1px' viewBox='0 0 1 1' version='1.1' xmlns=' http://www.w3.org/2000/svg ' xmlns:xlink=' http://www.w3.org/1999/xlink'%3E%3Ctitle%3E%3C/title%3E%3Cg stroke='none' stroke-width='1' fill='none' fill-rule='evenodd' fill-opacity='0'%3E%3Cg transform='translate(-249.000000, -126.000000)' fill='%23FFFFFF'%3E%3Crect x='249' y='126' width='1' height='1'%3E%3C/rect%3E%3C/g%3E%3C/g%3E%3C/svg%3E) ![图片](data:image/svg+xml,%3C%3Fxml version='1.0' encoding='UTF-8'%3F%3E%3Csvg width='1px' height='1px' viewBox='0 0 1 1' version='1.1' xmlns=' http://www.w3.org/2000/svg ' xmlns:xlink=' http://www.w3.org/1999/xlink'%3E%3Ctitle%3E%3C/title%3E%3Cg stroke='none' stroke-width='1' fill='none' fill-rule='evenodd' fill-opacity='0'%3E%3Cg transform='translate(-249.000000, -126.000000)' fill='%23FFFFFF'%3E%3Crect x='249' y='126' width='1' height='1'%3E%3C/rect%3E%3C/g%3E%3C/g%3E%3C/svg%3E) 还有个工具叫vectorizer，好像要魔法才能进去，这个效果挺好的，png转成svg基本无损，但是也要收费 下面是我自己随便测试的图片 ![图片](data:image/svg+xml,%3C%3Fxml version='1.0' encoding='UTF-8'%3F%3E%3Csvg width='1px' height='1px' viewBox='0 0 1 1' version='1.1' xmlns=' http://www.w3.org/2000/svg ' xmlns:xlink=' http://www.w3.org/1999/xlink'%3E%3Ctitle%3E%3C/title%3E%3Cg stroke='none' stroke-width='1
