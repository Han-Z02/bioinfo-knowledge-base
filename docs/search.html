巴细胞募集和肿瘤控制；肿瘤区域的 Ccl2 阳性 IM 则招募 Ly6c2+Fn1+Vcan+ recMacs，形成促肿瘤髓系网络；CCR5 阻断剂 maraviroc 可在癌症疫苗场景下限制免疫抑制性 moDC 迁移。 研究问题与创新点 # 核心问题 # 实体瘤中巨噬细胞数量多，但传统的 TAM 标记往往混合了组织驻留巨噬细胞、单核细胞来源巨噬细胞和 moDC。作者要解决的问题不是\"巨噬细胞是否重要\"，而是： 哪些肺间质巨噬细胞亚群支持抗肿瘤免疫？ 哪些巨噬细胞/单核来源细胞促肿瘤？ 这些功能差异是否由空间生态位和趋化因子程序决定？ 是否可以在不破坏保护性 IM 的情况下，选择性干预促肿瘤髓系迁移？ 主要创新 # 创新点 具体含义 不再把 CD206 直接等同于 M2/促肿瘤 CD206hi IM 在本研究肺肿瘤模型中反而具有保护性，支持 TLS 和淋巴细胞聚集 把 IM 细分为趋化因子生态位 Cxcl13/Cxcl9/Cxcl10 阳性 IM 与 Ccl2 阳性 IM 具有相反免疫后果 单细胞和空间转录组配套验证 scRNA-seq 解析细胞状态，10x Xenium 验证不同巨噬细胞群在支气管血管区和肿瘤核心/边缘的空间分布 把治疗方向从\"清除所有 TAM\"转为\"保留保护性 IM、阻断促肿瘤迁移\" CCR5 blockade + cancer vaccine 是概念验证，靶向迁移而非粗暴清除巨噬细胞 样本与实验设计 # 模块 设计 关键用途 scRNA-seq 小鼠 B16F10 肺转移模型，day 16 分选肺 extravascular CD64+CD11b+ mononuclear phagocytes 区分 AM、CD206hi IM、CD206lo IM、Ly6c2+Fn1+Vcan+ recMacs、DC/moDC 等 CD206hi IM 耗竭 Pf4Cre Cx3cr1DTR 系统，DT 注射后优先耗竭 CD206hi/FOLR2+ IM 验证 Cxcl13/Cxcl9/Cxcl10 阳性 CD206hi IM 对肿瘤控制和 TLS 的必要性 肿瘤模型 B16F10 melanoma lung metastasis；KPAR1.3 lung adenocarcinoma transfer；AgerCreERT2KP 自发肺腺癌 避免只在单一模型中得出结论 空间转录组 10x Xenium，4 个肿瘤肺样本：2 个 B16F10，2 个 KPAR1.3 定位 recMac、CD206hi IM、CD206lo IM 与趋化因子分子 Ccl2 功能验证 WT 或 Ccl2-/- BM 嵌合；busulfan 与放射照射条件对照 判断 Ccl2 来源和 IM/recMac 招募关系 CCR5 / maraviroc Ccr2-/-:WT 与 Ccr2-/-:Ccr5-/- 混合 BM、maraviroc、B16 peptides + poly(I:C) cancer vaccine 验证阻断 antigen-bearing moDC 迁移是否增强疫苗抗肿瘤效果 数据集/代码可用性核验表 # 核验日期：2026-05-12。状态以 Nature/PMC 数据可用性声明、GEO 页面和 GitHub 页面为准。 paper accession/resource repository data type sample/group design current access status direct page link direct download/request link notes Ghosh 2026 Nat Immunol GSE313081 GEO 10x Xenium spatial transcriptomics 4 个小鼠肿瘤肺：B16F10 x2，KPAR1.3 x2 公开，可直接下载；GEO 页面显示 citation missing，但论文已正式发表并引用该 accession GSE313081 GEO download RAW tar 约 70.3 GB，含 JSON/MTX/PARQUET/TIFF/TSV/XENIUM Ghosh 2026 Nat Immunol GSE225667 GEO/SRA 10x scRNA-seq, mTumor 8 个 B16F10 肺肿瘤样本，Mouse Tumor rep1-8 公开，可直接下载 processed matrix/RDS；raw data in SRA GSE225667 SRA/BioProject PRJNA936908 GEO 页面列出 MTX/TSV、combined RDS 及 metadata RDS Ghosh 2026 Nat Immunol GSE313092 GEO/SRA 10x scRNA-seq B16F10 肺肿瘤，3 个样本，每个样本含 3 个 pooled lungs 公开，可直接下载；GEO 页面显示 citation missing GSE313092 GEO download ； PRJNA1378253 RAW tar 约 1.2 GB；RDS 约 765 MB；metadata RDS 约 2.1 MB Ghosh 2026 Nat Immunol GSE225664 GEO/SRA 10x scRNA-seq, mouse lung MNPs Naive、LPS、aGr1-LPS，每组 2 个样本 公开；本研究作为肺 IM 参考/关联数据使用 GSE225664 PRJNA936904 来自相关 macrophage chemokine atlas；GEO 页面显示 6 个样本 Ghosh 2026 Nat Immunol MacrophagesTumorDichotomy GitHub R analysis/code QC、analysis、figure production 公开仓库，可访问 GitHub repo README raw README 描述为文章代码；需进一步 clone 后检查脚本完整性 Ghosh 2026 Nat Immunol UCSC Cell Browser UCSC/author-hosted online visualization GSE225667 和 GSE313092 的可视化 公开可视化入口 mTumor browser ； mouse-lung-b16 页面交互查看 适合快速看 marker，不替代原始数据下载 方法路线 # 肺肿瘤模型建立 -\u003e 分选 extravascular CD64+CD11b+ myeloid cells -\u003e scRNA-seq 区分 IM、recMacs、DC/moDC -\u003e 鉴定趋化因子表达程序 Cxcl13/Cxcl9/Cxcl10: CD206hi IM Ccl2: IM/recMac-rich tumor regions Ly6c2/Fn1/Vcan/Spp1/Vegfa/Arg1/Cd274: recMac protumor signature -\u003e CD206hi IM 耗竭验证保护性功能 -\u003e Xenium 空间定位验证不同生态位 -\u003e Ccl2/Ccr2/Ccr5/maraviroc 功能实验验证可干预节点 主要结果精读 # Result 1：scRNA-seq 区分 CD206hi IM、CD206lo IM 与 recMacs # 图 1 对应结果： B16F10 肺转移模型中，scRNA-seq 将肺髓系细胞分解为 AM、IM、recMacs、DC 等群体，并用 Pf4/C5ar1/Mafb 、 Ly6c2/Fn1/Vcan 、 Cxcl13/Cxcl9/Cxcl10 等标记区分保护性 IM 与促肿瘤 recMac 程序。图源：PMC13043291。 作者从 B16F10 肺转移模型中分选 extravascular CD64+CD11b+ 单核吞噬细胞，单细胞聚类后识别出 AM、IM、recMacs、DC 等群体。IM 以 Pf4+C5ar1+Mafb+ 为特征，recMacs 以 Ly6c2+Fn1+Vcan+ 为特征。 关键点不是简单找到\"巨噬细胞很多\"，而是发现三个功能方向： 细胞群 主要标记/特征 功能倾向 CD206hi IM Folr2、Cd163、Mmp9、部分 Lyve1；表达 Cxcl13、Cxcl9、Cxcl10 可能招募 B/T 细胞、支持 TLS、抗肿瘤 CD206lo IM Tmem119、Mmp12、Mmp13、Ccr2；部分 Ccl2 更接近肿瘤区域，与 recMac 招募相关 recMacs Ly6c2、Fn1、Vcan、Thbs1；Spp1、Vegfa、Arg1、Cd274 促肿瘤、免疫抑制、血管/基质重塑倾向 我的理解： 这直接挑战了\"CD206 = M2 = 促肿瘤\"的套话。CD206hi 在这里不是粗糙的 M2 标记，而是肺组织驻留 IM 中带有保护性趋化因子程序的细胞群。 Result 2：耗竭 CD206hi IM 会增加肿瘤负荷并破坏 TLS/淋巴细胞聚集 # 图 2 对应结果： Pf4Cre Cx3cr1DTR 耗竭 CD206hi/FOLR2+ IM 后，B16F10、KPAR1.3 和 AgerCreERT2KP 模型的肿瘤负荷增加，B/T 细胞聚集或 TLS 结构下降，CXCL9/CXCL10/CXCL13 蛋白水平降低。图源：PMC13043291。 作者用 Pf4Cre Cx3cr1DTR 小鼠选择性耗竭高表达 Pf4 和 Cx3cr1 的 CD206hi/FOLR2+ IM。耗竭后，在 B16F10、KPAR1.3 和 AgerCreERT2KP 三套模型中，肿瘤负荷都增加。 同时，B220+ B 细胞和 CD3+ T 细胞聚集显著减少；在 KPAR1.3 与 AgerCreERT2KP 肺腺癌模型中，结构化 TLS 丢失。肺组织 CXCL9、CXCL10、CXCL13 蛋白水平也下降。 核心解释： CD206hi IM 不是单纯旁观者，而是支撑局部淋巴结构和抗肿瘤免疫组织化的必要细胞群。 Result 3：Xenium 显示巨噬细胞按空间生态位分工 # 图 3 对应结果： Xenium 将结构细胞、AM、recMacs、IM 与趋化因子转录本投回组织空间，显示 CD206hi IM 与支气管血管区域、Cxcl13/Cxcl9/Cxcl10 生态位相连，而 recMacs 更接近肿瘤区域。图源：PMC13043291。 10x Xenium 将单细胞发现放回组织位置。作者在 KPAR1.3 和 B16F10 肿瘤肺中观察到： CD206hi IM 更靠近支气管血管区域，表达 Folr2/Cd163/Pf4，并与 Cxcl13、Cxcl9、Cxcl10 保护性趋化因子相关； recMacs 和 CD206lo IM 更常进入肿瘤核心和边缘； Ccl2 分布在肿瘤相关区域，与 recMac 招募生态位相连； 淋巴结内 Cxcl13 与 B cell zone、Cxcl16/Ccl17/Ccl22 与 T cell zone 的定位作为内部空间定位对照。 意义： 这使文章的概念从\"细胞亚群差异\"升级为\"空间生态位差异\"。同样是 macrophage lineage，靠近支气管血管结构还是肿瘤核心，会对应完全不同的免疫结果。 Result 4：Ccl2 轴连接 IM 生态位与 recMac 招募 # 图 4 对应结果： Ccl2 的空间表达、单细胞表达和 BM 嵌合实验共同支持 Ccl2 阳性 IM/髓系生态位参与 Ly6c2+Fn1+Vcan+ recMac 招募，并影响 B16F10 肺转移负荷。图源：PMC13043291。 Fig. 4 的重点是 Ccl2。空间和单细胞数据提示 Ccl2 表达集中于肿瘤区域的 IM/recMac 相关生态位。通过 WT 与 Ccl2-/- BM 嵌合，以及 busulfan/irradiation 对组织驻留细胞替换程度的影响，作者试图区分 Ccl2 来源对 recMac 招募和肿瘤生长的贡献。 结论应保守理解为： Ccl2 阳性 IM/髓系生态位对 Ly6c2+Fn1+Vcan+ recMac 招募和肿瘤促进有关键作用 ，而不是所有 Ccl2 都只来自一个单一、完全纯化的 IM 亚群。论文自身也提示 endothelial cells、CD206hi IMs 和 DCs 也可表达 Ccl2。 Result 5：CCR5 阻断可限制免疫抑制性 moDC 迁移并增强癌症疫苗效果 # 图 5 对应结果： CCR5 相关实验与 maraviroc 处理显示，阻断 antigen-bearing Ly6C+ moDC 向引流淋巴结迁移，可在 B16 peptides + poly(I:C) cancer vaccine 场景下增强抗肿瘤免疫。根据作者更正，本图应按 cancer vaccine/B16 peptides 而非泛化 neoantigen vaccine 解读。图源：PMC13043291。 作者进一步把 recMac/moDC 迁移作为治疗节点。Ccr5 在相关髓系细胞中表达；Ccl5 在 draining lymph node 的 T cell 区附近出现。遗传和药物实验提示 CCR5 参与 antigen-bearing Ly6C+CD11b+ moDC 向 tumor-draining lymph node 的迁移。 Maraviroc 在 B16 peptides + poly(I:C) cancer vaccine 场景下，选择性抑制 antigen-bearing moDC 迁移，而不是同等抑制 classical DC，从而提高 DC-mediated antitumor immunity。 关键边界： 这是一项小鼠癌症疫苗场景下的概念验证，不能直接外推为 maraviroc 单药抗癌，也不能外推为所有肿瘤疫苗通用增强剂。 机制模型 # 保护性轴： bronchovascular niche -\u003e CD206hi/FOLR2+ IM -\u003e Cxcl13/Cxcl9/Cxcl10 -\u003e B/T cell recruitment + TLS formation -\u003e tumor control 促肿瘤轴： tumor core/margin niche -\u003e Ccl2+ IM / myeloid niche -\u003e Ly6c2+ monocyte recruitment -\u003e Fn1+Vcan+ recMacs and moDCs -\u003e immunosuppression, tumor progression 干预轴： cancer vaccine + poly(I:C) -\u003e antigen-bearing moDC migration via CCR5 -\u003e maraviroc blocks moDC migration -\u003e preserve DC-mediated antitumor response 可复用数据与再分析价值 # 适合直接复用的问题 # 肺肿瘤 macrophage subset marker 复核 ：可用 GSE225667/GSE313092 做 CD206hi IM、CD206lo IM、recMac marker 重算。 空间距离分析 ：GSE313081 的 Xenium 原始文件适合重新计算 macrophage subset 到 tumor、airway、vessel、TLS-like lymphoid aggregate 的距离。 配体受体互作 ：可围绕 Cxcl13-Cxcr5、Cxcl9/10-Cxcr3、Ccl2-Ccr2、Ccl5-Ccr5 做 CellChat/NicheNet 类分析。 与其他肿瘤单细胞数据映射 ：可以把 Folr2/Cd163/Pf4/Cxcl13 保护性 IM signature 和 Ly6c2/Fn1/Vcan/Spp1/Arg1/Cd274 recMac signature 投射到公开 NSCLC 或 melanoma 数据中。 TLS 相关研究 ：这篇提供了 macrophage-derived chemokine 与 TLS 形成之间较清楚的功能证据链。 再分析注意事项 # Xenium RAW tar 约 70.3 GB，下载和解压成本较高。 小鼠肺肿瘤模型为主，不能直接代表人类 NSCLC 的全部 TAM 生态。 GSE225664/GSE225667 来自同团队 2024 macrophage chemokine atlas 相关数据，复用时要区分\"本研究新数据\"与\"前期 atlas/相关数据\"。 GEO 页面中 GSE313081/GSE313092 尚显示 citation missing，这属于 GEO 记录未更新问题；论文和 PMC 数据可用性声明已经明确引用。 局限性与风险 # 风险 具体说明 物种限制 主要为小鼠模型，缺少人类肿瘤组织空间验证 肿瘤模型限制 B16F10 和 KPAR1.3 不能覆盖所有肺癌免疫生态 遗传耗竭非单亚群绝对特异 Pf4Cre Cx3cr1DTR 主要耗竭 CD206hi IM，但不是一个只作用于单一趋化因子亚群的模型 Ccl2 来源复杂 Ccl2 可能来自多种细胞，不能简单写成\"只有某一类 IM 分泌 CCL2\" 治疗转化仍早期 Maraviroc 证据依赖 cancer vaccine 场景，尚非临床肿瘤治疗证据 作者更正影响解读 Fig. 5 相关表述已从 neoantigen 修订为 cancer/B16 peptide，应使用更正后语言 可引用观点 # 巨噬细胞在肿瘤中的功能不能仅由 CD206、Trem2 或 TAM 总量判断，必须结合组织来源、空间位置和趋化因子程序。 CD206hi/FOLR2+ 肺间质巨噬细胞可通过 Cxcl13、Cxcl9、Cxcl10 组织 TLS 和淋巴细胞募集，从而支持抗肿瘤免疫。 Ccl2 阳性髓系生态位与 Ly6c2+Fn1+Vcan+ recMac 招募相连，构成促肿瘤 macrophage circuit。 靶向 TAM 的策略应避免无差别清除巨噬细胞，较合理方向是保留保护性组织驻留 IM，同时阻断促肿瘤 recMac/moDC 迁移。 CCR5 blockade with maraviroc 在癌症疫苗场景中可限制免疫抑制性 antigen-bearing moDC 迁移，是可再验证的转化切入点。 与其他文献的关系 # 与 Li et al. 2024 Nature Immunology 的关系：本研究延续\"coordinated chemokine expression defines macrophage subsets across tissues\"的 IMck 亚群框架，把它放进肺肿瘤免疫场景，并增加空间转录组和肿瘤功能实验。 与 TLS 肿瘤免疫文献的关系：本研究提供 macrophage-derived Cxcl13/Cxcl9/Cxcl10 与 TLS/淋巴细胞聚集之间的细胞来源证据。 与 TAM 靶向治疗文献的关系：支持从 CSF1R/CCR2 等广谱 TAM 干预转向更精细的 migratory recMac/moDC 阻断策略。 与空间组学研究的关系：这篇是较好的例子，展示 scRNA-seq 发现如果没有空间定位，会很难解释保护性和促肿瘤髓系细胞为何共存。 下一步建议 # 下载或在线查看 GSE225667/GSE313092，先复核 Folr2/Cd163/Pf4/Cxcl13/Cxcl9/Cxcl10 与 Ly6c2/Fn1/Vcan/Spp1/Arg1/Cd274 两组 signature。 若做肿瘤免疫综述，可把本文作为\"macrophage spatial niche and TLS\"的核心机制文献。 若做公共数据再分析，优先从 scRNA-seq RDS 入手；Xenium RAW 体量大，适合后续专门做空间距离和 niche 分析。 若关注药物转化，maraviroc 应写作\"cancer vaccine adjuvant context 中阻断 CCR5+ moDC migration 的候选策略\"，不要写成已证实的泛癌抗肿瘤药。 核验来源 # Nature 原文： Chemokine-defined macrophage niches establish spatial organization of tumor immunity PubMed： PMID 41872505 PMC 全文： PMC13043291 作者更正： Author Correction, DOI 10.1038/s41590-026-02525-3 GEO: GSE313081 , GSE225667 , GSE313092 , GSE225664 GitHub 代码仓库： XinLi-0419/MacrophagesTumorDichotomy","tags":["macrophage","tumor-immunity","chemokine","spatial-transcriptomics","scRNA-seq","lung-cancer","tertiary-lymphoid-structure","CCR5"],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.579Z","url":"literature/notes/1dd0bad6c48b040f824815cb.html"},{"kbId":"KB-000048","title":"CAR-M2免疫治疗通过促进再血管化并诱导促纤维化Cxcr2+内皮细胞凋亡缓解肾纤维化","subtitle":"CAR-M2 immunotherapy resolves renal fibrosis via revascularization and apoptosis of profibrotic Cxcr2+ endothelial cells","summary":"Renal fibrosis is a common outcome of chronic kidney disease (CKD), forming a fibrotic niche characterized by fibroblast activation and vascular rarefaction. Currently, there are no effective treatment strategies targeting fibrotic niche. Here, we show that chimeric antigen receptor-modified M2 macrophages (CAR-M2) targeting FAP and secreting interleukin (IL)-4 are delivered via an injectable HAMA-CS hydrogel beneath the renal subcapsule and attenuate renal fibrosis while promoting renal revascularization. The single-cell RNA sequencing reveals the heterogeneity and interaction of stroma and endothelial cells (ECs). A fibrosis-related Cxcr2+ EC subset is identified, and its specific depletion effectively mitigates renal fibrosis. Further results reveal that CAR-M2 can release matrix metalloproteinase 2 (MMP2) in close proximity to activate retinoid X receptor alpha (Rxra) in the Cxcr2+ ECs and further triggers its mitochondrial autophagy, leading to apoptosis. Our research provides innovative strategies and proof of principle for the immunotherapy of organ fibrosis.","body":"英文标题：CAR-M2 immunotherapy resolves renal fibrosis via revascularization and apoptosis of profibrotic Cxcr2+ endothelial cells 中文摘要 # 肾纤维化是慢性肾病（CKD）的常见结局，会形成以成纤维细胞激活和血管稀疏为特征的纤维化生态位。目前尚缺乏有效靶向该纤维化生态位的治疗策略。本文显示，靶向FAP并分泌白细胞介素4（IL-4）的嵌合抗原受体修饰M2巨噬细胞（CAR-M2）可通过可注射HAMA-CS水凝胶递送至肾包膜下，从而减轻肾纤维化并促进肾脏再血管化。单细胞RNA测序揭示了基质细胞和内皮细胞（EC）的异质性及其相互作用。研究鉴定出一个与纤维化相关的Cxcr2+内皮细胞亚群，特异性清除该亚群能够有效缓解肾纤维化。进一步结果表明，CAR-M2可在近距离释放基质金属蛋白酶2（MMP2），激活Cxcr2+内皮细胞中的维甲酸X受体α（Rxra），进而触发其线粒体自噬并导致凋亡。本研究为器官纤维化的免疫治疗提供了创新策略和概念验证。 背景与研究意义 # 肾纤维化是慢性肾脏病进展中的共同病理终点，典型微环境包括成纤维细胞活化、细胞外基质沉积以及血管稀疏。传统抗纤维化策略多聚焦单一通路或单类细胞，难以同时解决纤维化细胞清除、炎症/免疫微环境调节和血管修复问题。 本研究的意义在于把CAR免疫细胞疗法从肿瘤治疗场景拓展到器官纤维化治疗：通过工程化M2巨噬细胞靶向FAP+成纤维细胞，同时借助水凝胶实现肾包膜下局部递送，从而增强局部治疗效果并降低系统性暴露风险。 科学问题 # 能否构建靶向纤维化生态位的CAR-M2巨噬细胞，以清除FAP+促纤维化成纤维细胞？ CAR-M2局部递送是否能在减轻肾纤维化的同时促进肾脏再血管化？ 肾纤维化中是否存在特定促纤维化内皮细胞亚群，以及CAR-M2如何影响该亚群？ 研究思路 # 构建靶向FAP的CAR-M2巨噬细胞，并使其具备IL-4相关促修复特征。 使用HAMA-CS可注射水凝胶进行肾包膜下递送，提高局部滞留与治疗效率。 在肾纤维化模型中评估纤维化程度、血管重建和肾组织损伤改善情况。 通过单细胞RNA测序解析基质细胞与内皮细胞异质性，识别促纤维化Cxcr2+内皮细胞亚群。 进一步验证CAR-M2分泌MMP2激活Cxcr2+内皮细胞中RXRA、诱导线粒体自噬和凋亡的机制。 主要结果 # Result 1: HAMA-CS水凝胶递送CAR-M2可缓解肾纤维化 # 核心发现：CAR-M2经肾包膜下局部递送后可减轻肾纤维化表型。 主要证据：研究摘要和Highlights显示，HAMA-CS水凝胶封装CAR-M2可通过肾包膜下递送缓解肾纤维化。 意义：提示局部工程化免疫细胞疗法可作为器官纤维化治疗的新策略。 Result 2: CAR-M2靶向FAP+成纤维细胞并促进肾脏再血管化 # 核心发现：CAR-M2不仅清除FAP+成纤维细胞，还改善纤维化肾脏中的血管稀疏。 主要证据：论文摘要指出CAR-M2可靶向FAP并减轻纤维化，同时促进renal revascularization。 意义：该治疗策略同时覆盖“抗纤维化”和“促血管修复”两个关键环节。 Result 3: 单细胞测序发现促纤维化Cxcr2+内皮细胞亚群 # 核心发现：纤维化肾脏中存在与疾病相关的Cxcr2+内皮细胞亚群。 主要证据：单细胞RNA测序揭示基质和内皮细胞异质性，并鉴定出fibrosis-related Cxcr2+ EC subset。 意义：将内皮细胞从“血管结构受损的旁观者”推进为可能主动参与纤维化进展的细胞群。 Result 4: CAR-M2通过MMP2-RXRA轴诱导Cxcr2+内皮细胞凋亡 # 核心发现：CAR-M2释放MMP2，激活Cxcr2+内皮细胞中的RXRA，触发线粒体自噬并导致凋亡。 主要证据：摘要显示CAR-M2可近距离释放MMP2，激活Cxcr2+ ECs中的Rxra，并进一步触发mitochondrial autophagy leading to apoptosis。 意义：该机制解释了CAR-M2为何能削弱促纤维化内皮细胞，并为Cxcr2+ EC作为干预靶点提供依据。 机制模型 # flowchart LR A[肾纤维化生态位] --\u003e B[FAP+成纤维细胞活化] A --\u003e C[血管稀疏与Cxcr2+促纤维化内皮细胞] D[HAMA-CS水凝胶局部递送CAR-M2] --\u003e E[吞噬/清除FAP+成纤维细胞] D --\u003e F[促进肾脏再血管化] D --\u003e G[CAR-M2分泌MMP2] G --\u003e H[激活Cxcr2+ EC中的RXRA] H --\u003e I[线粒体自噬] I --\u003e J[Cxcr2+ EC凋亡] E --\u003e K[纤维化缓解] F --\u003e K J --\u003e K 讨论与结论 # 这篇论文提出了一个针对肾纤维化微环境的复合型治疗框架：一方面利用CAR-M2识别并处理FAP+成纤维细胞，另一方面通过M2巨噬细胞和局部递送体系促进血管修复，并通过MMP2-RXRA相关机制清除促纤维化Cxcr2+内皮细胞。其创新点在于将工程化免疫细胞疗法、水凝胶局部递送、单细胞图谱解析和血管生态位干预连接在同一条治疗逻辑中。 潜在局限包括：该策略仍处于概念验证阶段，CAR-M2在不同器官纤维化、不同病程阶段及长期安全性中的表现仍需进一步验证；此外，MMP2-RXRA-线粒体自噬轴在不同细胞环境中的特异性和可控性也值得后续研究。 关键图表 # Graphical abstract：概括CAR-M2通过水凝胶局部递送、靶向FAP+成纤维细胞、促进再血管化并诱导Cxcr2+内皮细胞凋亡的总体模型。 单细胞RNA测序相关图：用于识别基质细胞和内皮细胞异质性，重点关注Cxcr2+ EC亚群。 机制验证图：关注MMP2、RXRA、线粒体自噬和Cxcr2+ EC凋亡之间的因果链条。 参考文献 # Zhao W, Zhou X, Zhao X, et al. CAR-M2 immunotherapy resolves renal fibrosis via revascularization and apoptosis of profibrotic Cxcr2+ endothelial cells. Cell Reports Medicine. 2026;7(4). doi:10.1016/j.xcrm.2026.102698 关键图表补充：文本版图解清单 # 图像提取状态：本次尝试从PDF提取关键Figure截图失败，报错为“[WinError 2] 系统找不到指定的文件”。因此当前未嵌入原图或截图；以下内容基于论文图注、摘要和正文片段整理，后续若PDF图像提取恢复，可再补入原图。 建议优先补图 # Graphical abstract：作为汇报首页或导读图，展示“CAR-M2局部递送 → 靶向FAP+成纤维细胞 → 促进再血管化 → MMP2-RXRA轴诱导Cxcr2+ EC凋亡 → 肾纤维化缓解”的整体逻辑。 Figure 1 / Figure S1-S2：CAR-M2构建与靶点验证。重点看FAP在UUO/CKD肾纤维化中的高表达、CAR表达、M2极化标志以及对FAP+成纤维细胞的吞噬能力。 Figure 2 / Figure S3：HAMA-CS水凝胶递送系统。重点看水凝胶构建、肾包膜下递送流程、局部滞留/缓释、生物安全性，以及CAR-M2与FAP+成纤维细胞共定位。 Figure 4 / Figure S5：CAR-M2促进血管生成与内皮-基质互作改变。重点看VEGF互作信号、体外管腔形成、CD31/Ki67提示的内皮增殖，以及TGF-β信号网络改变。 Figure 5 / Figure S6：促纤维化Cxcr2+内皮细胞群。重点看内皮细胞亚群UMAP、EC6/Cxcr2+ EC比例变化、纤维化相关基因评分、Cxcl2-Cxcr2轴和Lcn2相关证据。 Figure 7 / Figure S7：MMP2-RXRA机制验证。重点看CXCR2+ EC与FAP+成纤维细胞的空间邻近，CAR-M2与FAP+成纤维细胞共培养后MMP2上调，MMP2抑制削弱抗纤维化效果，RXRA激活诱导Cxcr2+ EC线粒体自噬和凋亡。 汇报时的图表叙事顺序 # 先用Graphical abstract建立治疗闭环：工程化M2巨噬细胞不是单纯“抗炎”，而是同时承担靶向吞噬、微环境重塑和血管修复功能。 接Figure 1说明为什么选FAP作为CAR靶点，以及CAR-M2确实具备对FAP+纤维化细胞的特异性吞噬能力。 接Figure 2说明为什么需要HAMA-CS水凝胶：肾包膜下局部递送提高肾脏滞留、持续释放和局部作用。 接Figure 4-5把故事从“成纤维细胞清除”推进到“血管生态位重塑”：CAR-M2促进再血管化，并通过单细胞测序发现促纤维化Cxcr2+ EC亚群。 最后用Figure 7收束机制：CAR-M2在FAP+成纤维细胞附近释放MMP2，激活Cxcr2+ EC中的RXRA，引发线粒体自噬和凋亡，从而去除促纤维化内皮细胞并缓解纤维化。 一句话图表主线 # CAR-M2通过HAMA-CS水凝胶被局部递送到肾纤维化生态位，一方面吞噬FAP+成纤维细胞，另一方面促进血管重建，并通过MMP2-RXRA轴清除促纤维化Cxcr2+内皮细胞，最终实现对肾纤维化微环境的多靶点重塑。","tags":["clippings","paper","renal-fibrosis","immunotherapy","macrophage","endothelial-cell","single-cell"],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.578Z","url":"literature/notes/ec46e7f684d093645a4ea60b.html"},{"kbId":"KB-000046","title":"The skin microbiota drives cutaneous immune checkpoint inhibitor toxicity in genetically susceptible mice","subtitle":"","summary":"Immune checkpoint inhibitors (ICIs) show increasing promise for cancer therapy. However, patients can experience adverse events, particularly those with pre-existing autoimmune disease. We determined that the microbiome can drive ICI-induced systemic toxicity in a mouse model of autoimmune susceptibility. Specifically, ICI treatment of specific pathogen-free (SPF) Act1-/- mice, which develop spontaneous autoimmunity due to a deficiency in an immune adaptor, resulted in systemic adverse events that were ameliorated by topical antibiotics. Moreover, germ-free (GF) Act1-/- mice failed to develop ICI toxicity. Transfer of gut or skin microbiota from SPF Act1-/- mice to GF Act1-/- mice showed that only the skin microbiota rendered exGF mice sensitive to ICI toxicity. Notably, therapeutic application of topical antibiotics decoupled ICI-induced toxicity from anti-tumor efficacy in SPF Act1-/- mice. This model provides a paradigm for future translational studies in cancer patients to mitigate adverse effects of ICIs and maximize their efficacy by targeting skin microbes.","body":"本文献笔记由 Claudian 自动生成，元数据已同步至 Zotero (ItemID: 1886) Salazar et al., 2026 | 皮肤微生物组驱动免疫检查点抑制剂皮肤毒性 论文概览 # 字段 内容 标题 The skin microbiota drives cutaneous immune checkpoint inhibitor toxicity in genetically susceptible mice 作者 Salazar V, Espenschied ST, Fernandez AP, Karell PE, Sangwan N, Stappenbeck TS 单位 Cleveland Clinic Research (炎症与免疫科、皮肤科、心血管与代谢科) 发表 Cell Host \u0026 Microbe, 2026 Apr 8;34(4):588-599.e6 PMID 41903527 DOI 10.1016/j.chom.2026.03.008 Zotero ItemID: 1886 | Key: KI5DVSP8 研究背景与科学问题 # 临床背景 # 免疫检查点抑制剂（ICIs）在肿瘤治疗中展现出良好前景，显著提高患者应答率和生存率 然而，ICI 治疗会引发免疫相关不良事件（irAEs），在合并自身免疫病的患者中尤为突出 皮肤毒性是 ICI 最常见的不良反应之一，严重影响患者生活质量甚至治疗依从性 机制背景 # irAEs 的发生机制尚不完全清楚，目前认为与 CD8+ 细胞毒性 T 细胞活化及自身抗体产生有关 微生物组在自身免疫病和 irAEs 发生中的作用日益受到关注 Act1 是免疫系统中的关键接头分子，其缺陷小鼠自发形成自身免疫表型 核心科学问题 # 微生物组是否驱动 ICI 诱导的全身毒性？ 皮肤微生物组 vs. 肠道微生物组——谁是 ICI 皮肤毒性的主导者？ 靶向皮肤微生物组能否在不影响抗肿瘤疗效的前提下减轻 ICI 毒性？ 整体研究思路（技术路线） # SPF Act1-/- 小鼠（自发性自身免疫） │ ├─── ICI 治疗 ──→ 全身毒性（皮肤炎症等） │ ↑ │ 局部抗生素（ topical antibiotics）──┘ 毒性可被逆转 │ ├─── 无菌（GF）Act1-/- 小鼠 ── ICI 治疗 ──→ 无毒性 │ └─── 微生物组转移实验 │ ├─ 肠道微生物组转移 ──→ exGF Act1-/- ── ICI ──→ 无毒性 │ └─ 皮肤微生物组转移 ──→ exGF Act1-/- ── ICI ──→ 出现毒性 ✓ 核心发现 ： 仅皮肤微生物组 （而非肠道微生物组）赋予 GF 小鼠对 ICI 毒性的敏感性 主要结果（Results） # Result 1：SPF Act1-/- 小鼠 ICI 处理诱导全身毒性 # 核心发现 ：SPF Act1-/- 小鼠接受 ICI 治疗后出现显著的全身性不良事件（皮肤炎症等），而野生型小鼠未出现类似毒性 关键实验 ：Act1-/- 小鼠 vs. 野生型对照，接受抗 PD-1/PD-L1 或 CTLA-4 阻断 机制提示 ：Act1 缺陷导致的免疫失调使小鼠对 ICI 毒性高度敏感 Result 2：局部抗生素逆转 ICI 诱导的毒性 # 核心发现 ：外用局部抗生素（topical antibiotics）可显著改善 SPF Act1-/- 小鼠的 ICI 诱导毒性 关键实验 ：ICI + 局部抗生素 vs. ICI + 溶剂对照 意义 ：提示 微生物依赖 的毒性机制 Result 3：无菌（GF）Act1-/- 小鼠对 ICI 毒性具有抵抗 # 核心发现 ：完全无菌环境饲养的 GF Act1-/- 小鼠在接受 ICI 后 不发生 毒性反应 关键实验 ：SPF Act1-/- vs. GF Act1-/-，相同 ICI 方案 核心结论 ： 微生物组的定植 是 ICI 毒性发生的必要条件 Result 4：仅皮肤微生物组（而非肠道微生物组）驱动 ICI 毒性 # 核心发现 ：将 SPF Act1-/- 小鼠的皮肤或肠道微生物组分别转移至 GF Act1-/- 小鼠 肠道微生物组转移 → exGF 小鼠 ICI 后 无毒性 皮肤微生物组转移 → exGF 小鼠 ICI 后 出现毒性 ✓ 关键实验 ：无菌小鼠定植实验 + ICI 挑战 核心结论 ： 皮肤微生物组 （而非肠道微生物组）是驱动 ICI 皮肤毒性的关键 Result 5：局部抗生素可解耦 ICI 毒性与其抗肿瘤疗效 # 核心发现 ：在 SPF Act1-/- 小鼠肿瘤模型中，局部抗生素治疗可 减轻 ICI 诱导的毒性 的同时 保留抗肿瘤疗效 意义 ：为临床转化提供了重要依据——靶向皮肤微生物可改善 ICI 治疗窗口 讨论与结论 # 核心发现 # 皮肤微生物组是 ICI 诱导皮肤毒性的驱动因素 ——这一发现颠覆了既往\"肠道微生物组主导\"的研究范式 微生物组是 ICI 毒性的必要条件 ——GF 小鼠完全不发生毒性 局部抗生素可实现安全性与有效性的解耦 ——为临床干预提供了新策略 研究亮点 # ✅ 范式创新 ：首次明确皮肤微生物组（而非肠道微生物组）在 ICI 皮肤毒性中的主导作用 ✅ 模型优势 ：Act1-/- 小鼠自发自身免疫模型较好地模拟了合并自身免疫病患者的临床场景 ✅ 转化潜力 ：局部抗生素策略在保留抗肿瘤疗效的同时减轻毒性，具有直接临床转化价值 ✅ 机制清晰 ：通过 GF 小鼠定植实验有力证明了因果关系 研究局限性 # Act1-/- 小鼠为基因敲除模型，与人类自身免疫病患者的遗传背景存在差异 皮肤微生物组中具体驱动 ICI 毒性的细菌种类尚未鉴定 局部抗生素在人体中的安全性与长期效果尚需验证 该研究仅在单一基因背景小鼠中进行，推广性有待进一步验证 参考文献（核心文献） # Salazar V et al. The skin microbiota drives cutaneous immune checkpoint inhibitor toxicity in genetically susceptible mice. Cell Host Microbe . 2026. (本文献) Zuo T, et al. Gut microbiota, immunotherapy, and immune checkpoint inhibitors in cancer treatment. Nat Rev Cancer . (相关机制) Dubin K, et al. Intestinal microbiome analyses identify potential mechanisms of irAEs. J Clin Invest . (irAE 机制) Chaput N, et al. Baseline gut microbiota predicts clinical response to anti-PD-1 therapy. Ann Oncol . (微生物组-ICI 关联) Stappenbeck TS, et al. Role of Act1 in mucosal immunity and autoimmunity. Nat Rev Immunol . (Act1 机制) Costello CM, et al. Skin microbiome in health and disease. Trends Immunol . (皮肤微生物组综述) 关联文献 # 2022-01-GutMicrobes-肠道皮肤轴-综述 — 皮肤-肠道微生物组相互作用综述 2026-04-Cell-OXGR1-玫瑰痤疮-激动剂 — 皮肤代谢物-免疫互作机制（Cell 2026）","tags":["microbiota","ICI toxicity","Act1"],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.578Z","url":"literature/notes/3a92d0a53d0b5459e4ee3612.html"},{"kbId":"KB-000047","title":"文献汇报 | Cell Host \u0026 Microbe (2026)","subtitle":"","summary":"The skin microbiota drives cutaneous immune checkpoint inhibitor toxicity in genetically susceptible mice Salazar V, Espenschied ST, Fernandez AP, Karell PE, Sangwan N, Stappenbeck TS 期刊 ：Cell Host \u0026 Microbe 2026 Apr 8;34(4):588-599.e6 PMID","body":"皮肤微生物组驱动免疫检查点抑制剂皮肤毒性 # The skin microbiota drives cutaneous immune checkpoint inhibitor toxicity in genetically susceptible mice Salazar V, Espenschied ST, Fernandez AP, Karell PE, Sangwan N, Stappenbeck TS 期刊 ：Cell Host \u0026 Microbe | 2026 Apr 8;34(4):588-599.e6 PMID ：41903527 | DOI ：10.1016/j.chom.2026.03.008 Zotero ：ItemID 1886 | Key KI5DVSP8 单位 ：Cleveland Clinic Research（炎症与免疫科、皮肤科、心血管与代谢科） 一、研究背景与科学问题 # 【临床背景】 # 免疫检查点抑制剂（ICIs）在肿瘤治疗中显著提高患者应答率和生存率，但会引发免疫相关不良事件（irAEs），在合并自身免疫病的患者中尤为突出。皮肤毒性是 ICI 最常见的不良反应之一，严重影响患者生活质量甚至治疗依从性。 【机制背景】 # irAEs 的发生机制尚不完全清楚，目前认为与 CD8+ 细胞毒性 T 细胞活化及自身抗体产生有关。微生物组在自身免疫病和 irAEs 中的作用日益受到关注，但既往研究多聚焦于 肠道微生物组 。皮肤微生物组在 ICI 毒性中的作用尚不明确。Act1 是免疫系统中的关键接头分子，其缺陷小鼠（Act1-/-）自发形成自身免疫表型，是研究 ICI 毒性的理想模型。 【科学问题】 # 微生物组是否驱动 ICI 诱导的全身毒性？ 皮肤 vs. 肠道微生物组——谁是 ICI 皮肤毒性的主导者？ 靶向皮肤微生物能否在不影响抗肿瘤疗效的前提下减轻 ICI 毒性？ 二、整体研究思路 # 研究采用 Act1-/- 小鼠自发自身免疫模型，结合无菌（GF）小鼠定植实验，系统验证微生物组在 ICI 毒性中的因果作用： Step 1: SPF Act1-/- 小鼠 ICI 诱导全身毒性，局部抗生素可逆转 ↓ Step 2: GF Act1-/- 小鼠 ICI 后无毒性（微生物是必要条件） ↓ Step 3: 仅皮肤微生物组转移（而非肠道）使 GF 小鼠获得 ICI 敏感性 ↓ Step 4: 局部抗生素在肿瘤模型中解耦 ICI 毒性与其抗肿瘤疗效 三、主要结果（Results） # Result 1：SPF Act1-/- 小鼠 ICI 处理诱导全身毒性 # 【目的】 验证 Act1-/- 小鼠自发自身免疫模型是否对 ICI 毒性敏感 【主要证据】 SPF Act1-/- 小鼠接受 ICI（抗 PD-1/PD-L1 或 CTLA-4 阻断）后出现显著全身性不良事件（皮肤炎症等），野生型小鼠未出现类似毒性 【核心发现】 Act1 缺陷导致的免疫失调使小鼠对 ICI 毒性高度敏感 Result 2：局部抗生素逆转 ICI 诱导的毒性 # 【目的】 探究微生物组是否参与 ICI 毒性的发生 【主要证据】 外用局部抗生素可显著改善 SPF Act1-/- 小鼠的 ICI 诱导毒性 【核心发现】 微生物组的存在是 ICI 皮肤毒性发生的必要条件 Result 3：无菌（GF）Act1-/- 小鼠对 ICI 毒性具有抵抗 # 【目的】 直接验证微生物组在 ICI 毒性中的因果作用 【主要证据】 完全无菌环境饲养的 GF Act1-/- 小鼠在接受 ICI 后完全不发生毒性反应 【核心发现】 微生物组定植是 ICI 毒性发生的必要条件，有力证明了因果关系 Result 4：仅皮肤微生物组驱动 ICI 毒性 ⚡【核心发现】 # 【目的】 区分皮肤 vs. 肠道微生物组在 ICI 毒性中的相对贡献 【主要证据】 将 SPF Act1-/- 小鼠的皮肤或肠道微生物组分别转移至 GF Act1-/- 小鼠： 转移类型 ICI 毒性 肠道微生物组转移 ❌ 无毒性 皮肤微生物组转移 ✅ 出现毒性 【核心发现】 皮肤微生物组（而非肠道微生物组）是驱动 ICI 皮肤毒性的关键，这一发现颠覆了既往研究范式 Result 5：局部抗生素可解耦 ICI 毒性与其抗肿瘤疗效 🏥【转化价值】 # 【目的】 验证靶向皮肤微生物组策略的临床转化潜力 【主要证据】 在 SPF Act1-/- 小鼠肿瘤模型中，局部抗生素可在减轻 ICI 诱导毒性的同时保留抗肿瘤疗效 【核心发现】 局部抗生素策略可实现 ICI 安全性与有效性的解耦，具有重要临床转化价值 四、机制模型 # 【机制流程图】 # 遗传易感性（Act1 缺陷） ↓ 皮肤微生物组定植（含特定致病菌） ↓ ICI 治疗激活免疫系统（PD-1/CTLA-4 阻断） ↓ 过度免疫激活 → 皮肤毒性/irAEs（不影响抗肿瘤疗效） 【治疗转化模型】 # 方案 效果 传统方案 ：ICI 治疗 → 皮肤毒性 减量/停药，影响疗效 新方案 ：ICI + 局部抗生素 → 减轻皮肤毒性 + 保留抗肿瘤效果 五、汇报亮点与局限性 # 【研究亮点】 # ✅ 范式创新 ：首次明确皮肤微生物组（而非肠道微生物组）在 ICI 皮肤毒性中的主导作用，颠覆既往认知 ✅ 模型创新 ：Act1-/- 小鼠自发自身免疫模型较好地模拟了合并自身免疫病患者的临床场景 ✅ 逻辑严密 ：无菌小鼠定植实验直接证明了皮肤微生物组的因果作用，证据链完整 ✅ 转化潜力 ：局部抗生素策略为改善 ICI 治疗窗口提供了可快速转化的临床干预方案 【研究局限性】 # Act1-/- 小鼠为基因敲除模型，与人类自身免疫病的遗传背景存在差异，直接推广性有待验证 皮肤微生物组中具体驱动 ICI 毒性的细菌种类尚未鉴定，关键菌种有待进一步研究 局部抗生素策略在人体中的长期安全性、耐药风险及与 ICI 疗效的相互作用尚需临床研究验证 研究仅在单一基因背景小鼠中进行，多基因背景或不同肿瘤类型中的适用性有待扩展 六、核心参考文献 # Salazar V , Espenschied ST, Fernandez AP, Karell PE, Sangwan N, Stappenbeck TS. The skin microbiota drives cutaneous immune checkpoint inhibitor toxicity in genetically susceptible mice. Cell Host Microbe . 2026;34(4):588-599.e6. PMID: 41903527. (本文献) Dubin K, et al. Intestinal microbiome analyses identify potential mechanisms of irAEs. J Clin Invest . (irAE 机制) Chaput N, et al. Baseline gut microbiota predicts clinical response to anti-PD-1 therapy. Ann Oncol . (微生物组预测 ICI 疗效) Zuo T, et al. Gut microbiota, immunotherapy, and immune checkpoint inhibitors in cancer treatment. Nat Rev Cancer . (微生物组-ICI 机制) Stappenbeck TS, et al. Role of Act1 in mucosal immunity and autoimmunity. Nat Rev Immunol . (Act1 机制) 汇报完毕，感谢聆听！ Zotero ItemID: 1886 | Key: KI5DVSP8 | Cell Host \u0026 Microbe 2026","tags":[],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.578Z","url":"literature/notes/f663860a7228f9dd221237e3.html"},{"kbId":"KB-000044","title":"Metabolite-gated vascular contractility switch: OXGR1 activation mechanism enables agonist therapy for rosacea erythema","subtitle":"","summary":"Xiao et al. identify α-KG as a rosacea-associated metabolite that activates the OXGR1-Gq-MYL9 axis in the vascular smooth muscle cells to boost contractility and suppress pathological vasodilation underlying erythema. Cryo-EM reveals a bipartite-acid pocket of OXGR1 that enables structure-guided development of A-1, a selective agonist that alleviates erythema in rosacea-like models.","body":"本文献笔记由 Claudian 自动生成，元数据已同步至 Zotero (ItemID: 1872, Key: 9TPCVSE5) 背景与研究意义 # 疾病背景 # 玫瑰痤疮（酒渣鼻）是一种慢性炎症性皮肤病，全球患病率约 5.5% ，主要表现为面部中央潮红、持续性红斑、丘疹、脓疱和鼻赘，严重损害患者身心健康。 持续性红斑 被广泛认为是玫瑰痤疮的主要特征之一。 目前推荐的治疗方法大多在控制丘疹和脓疱方面显示疗效，但 红斑的完全缓解仍然具有挑战性，复发率很高 。FDA 批准的全身药物多西环素仅适用于丘疹脓疱型。两种选择性α-肾上腺素受体激动剂—— 溴莫尼定 和 羟甲唑啉 是 FDA 批准的仅有的局部用红斑治疗药物，但临床经验表明疗效有限，且可能引起停药反弹、红斑加重和接触性皮炎等不良反应。 因此， 红斑治疗的持续挑战凸显了开发创新治疗药物的迫切需要 。 科学问题 # 玫瑰痤疮红斑患者的血液代谢谱发生了怎样的改变？哪些关键代谢物参与其发病机制？ 代谢物如何通过膜受体影响血管功能，其下游信号通路是什么？ 能否基于结构生物学合理设计高选择性激动剂，实现比现有药物更安全有效的治疗？ 研究思路（技术路线） # [临床样本] 63名健康 vs 57名玫瑰痤疮患者血清代谢组学 ↓ 代谢组学发现：α-KG ↑ 与红斑严重程度正相关 ↓ ① 功能验证 LL37诱导玫瑰痤疮样小鼠模型 α-KG全身/局部给药 → 红斑↓ 血管收缩↑ ↓ ② 机制解析 OXGR1受体定位（VSMC特异性）→ Gq信号 → MLCK/MYL9磷酸化 → VSMC收缩 ↓ ③ 结构生物学 冷冻电镜解析OXGR1-Gq复合物结构 双酸结合口袋 → 配体识别机制 ↓ ④ 药物设计 基于结构虚拟筛选 → 合成激动剂A-1 ↓ ⑤ 疗效比较 A-1 vs α-KG vs 溴莫尼定（头对头） 主要结果 # Result 1 | α-酮戊二酸是玫瑰痤疮的保护性代谢物 # 核心发现： 玫瑰痤疮患者血清中 α-酮戊二酸（α-KG）水平显著升高，且与红斑严重程度（CEA评分）呈正相关；外源性 α-KG 全身或局部给药均能以剂量依赖性方式改善 LL37 诱导的小鼠玫瑰痤疮样症状。 主要证据： 对 63 名健康志愿者 vs 57 名玫瑰痤疮患者的血清代谢组学分析（SMPDB/KEGG 通路富集），前十个富集通路中有九个与 α-KG 相关 α-KG 水平与 CEA 评分正相关（R² \u003e 0.5），但与 IGA 评分无关，提示 α-KG 与红斑而非丘疹脓疱更相关 连续 14 天 α-KG 口服 + LL37 诱导模型：红斑面积和评分以剂量依赖性方式降低；CD31 免疫组化证实血管收缩效应 局部 α-KG 凝胶同样减轻血管扩张和炎症浸润（避免了全身性影响） 意义： 首次鉴定 α-KG 为玫瑰痤疮的保护性代谢物，具有治疗转化潜力。 Result 2 | α-KG 通过血管平滑肌细胞上的 OXGR1 受体发挥作用 # 核心发现： OXGR1 特异性定位于血管平滑肌细胞（VSMC），而非内皮细胞；VSMC 特异性敲除 OXGR1 完全消除了 α-KG 对玫瑰痤疮样症状的保护作用。 主要证据： OXGR1 与 α-SMA 共免疫染色呈血管样模式，定位于 VSMC（非内皮细胞） 构建 Myh11-CreER;Oxgr1^fl/fl VSMC 特异性条件性敲除（cKO）小鼠 LL37 诱导后，Oxgr1 cKO 小鼠中 α-KG 的红斑减轻作用 完全消失 （图 2C-2E），血管直径增大，炎症浸润增加 另一种 OXGR1 内源性激动剂衣康酸（ITA）同样改善玫瑰痤疮样症状，证实信号通路的特异性 意义： 确立 OXGR1 为 α-KG 改善玫瑰痤疮的 必要受体 ，作用细胞为 VSMC。 Result 3 | α-KG-OXGR1-Gq-MYL9 轴抑制异常血管舒张 # 核心发现： α-KG 通过激活 Gq 信号通路，上调 MLCK 表达和 MYL9 磷酸化，促进 VSMC 收缩，从而抑制病理性血管舒张；这是 α-KG 发挥保护作用的核心信号轴。 主要证据： 玫瑰痤疮样小鼠和患者皮肤中，VSMC 内 p-MYL9 水平均降低；α-KG 或 ITA 治疗可逆转 OXGR1 缺失 → p-MYL9 水平显著降低 siRNA 敲低 Mlck 或 Oxgr1 → α-KG 对 VSMC 收缩的保护作用消失 Gq 抑制剂 YM-254890 处理 → 抑制 α-KG 诱导的 p-MYL9 上调和 VSMC 收缩 VSMC 特异性 Gq cKO 小鼠 → α-KG 的保护作用消失 胶原凝胶收缩实验证实：α-KG 诱导 VSMC 收缩，Oxgr1/Mlck 敲低或 Gq 抑制阻断该效应 机制链：α-KG → OXGR1 → Gq → PLC → IP₃↑ + DAG↑ → [Ca²⁺]ᵢ↑ → Ca²⁺/CaM → MLCK → MYL9磷酸化 → VSMC收缩 意义： 从分子到细胞水平完整阐明了 α-KG-OXGR1 轴的信号传导机制。 Result 4 | OXGR1-Gq 复合物的冷冻电镜结构解析 # 核心发现： 解析了 4 种 OXGR1-Gq 复合物结构（分辨率 2.4-2.7 Å），揭示了 OXGR1 识别双酸配体的独特结构基础和非典型 GPCR 激活机制。 主要证据： 解析了 4 种复合物：OXGR1^CA^-Gq（组成性激活）、α-KG-OXGR1-Gq（2.6 Å）、ITA-OXGR1-Gq（2.4 Å）、A-1-OXGR1-Gq（2.6 Å） α-KG 和 ITA 深埋于 OXGR1 的 7 个跨膜结构域内，配体到 ECL2 上缘距离约 22 Å OXGR1 缺乏经典 W^6.48^ 开关（被 F254^6.48^ 取代），提示非典型激活机制 与 β2AR（典型 A 类 GPCR，TM6-TM3 距离 15 Å）相比，活性 OXGR1 的 TM6-TM3 距离仅 3 Å 意义： 从原子水平揭示了 OXGR1 的独特结构特征，为基于结构药物设计奠定了基础。 Result 5 | OXGR1 具有独特的双酸结合口袋（bipartite-acid pocket） # 核心发现： OXGR1 的配体结合口袋由两个协同子口袋组成——简单酸性口袋（SAP）和复杂酸性口袋（CAP），分别识别配体的两个羧酸基团，这解释了 OXGR1 对 α-KG 和 ITA（均为双酸分子）的选择性。 主要证据： SAP（简单酸性口袋）： 识别配体末端单个羧酸，被 R110³·²⁹、H114³·³³、Y284⁷·³⁵ 包围，提供极性和正电荷环境 CAP（复杂酸性口袋）： 识别另一个羧酸，被 Y40¹·³⁹、Y93²·⁶⁴、R288⁷·³⁹ 包围 关键基序： Y40¹·³⁹ Y93²·⁶⁴ R288⁷·³⁹ 基序编码 CAP； R110³·²⁹ H114³·³³ Y284⁷·³⁵ 基序编码 SAP 突变实验：R110A、H114A、Y284F、Y40A、Y93F、R288A 均显著损害配体诱导的 OXGR1 激活 α-KG 比 ITA 效力强 5 倍以上 （EC₅₀：41.0 vs 220.4 μM）：α-KG 与 L186 主链胺基形成额外极性相互作用，L186A 突变对 α-KG 影响更大 意义： 首次阐明双酸代谢物的受体识别模式，为设计双酸类激动剂提供了结构模板。 Result 6 | 基于结构合理设计选择性 OXGR1 激动剂 A-1 # 核心发现： 基于 α-KG 结合口袋结构，合理设计并筛选出 A-1——一种高效（EC₅₀ = 626.5 nM，比 α-KG 强约 60 倍）且对同源受体 GPR91 具有高选择性的合成 OXGR1 激动剂。 主要证据： 虚拟筛选策略：靶向 OXGR1 相比 GPR91 的两个非保守残基 L186^ECL2^ 和 F113³·³²^ 从 100 万个化合物库 → 1000 个初筛 → 200 个聚类分析 → 63 个化合物购买 → BRET 功能验证 鉴定 3 个先导化合物（A-1、B-2、C-8），A-1 效力最强 A-1 的 EC₅₀ = 626.5 nM（vs α-KG 39.5 μM，强约 60 倍 ）；对 GPR91 无明显活性 结构基础： A-1 的二氢噻吩部分与 F113 形成关键 π-π 堆积和阳离子-π 相互作用；F113L 突变使 A-1 效力降低 \u003e10,000 倍 ，证实 F113 是选择性的分子基础 A-1 不激活 P2X4 嘌呤受体（α-KG 的潜在脱靶受体） 意义： 展示了从结构到药物的完整合理设计流程，A-1 作为临床前候选药物具有极大潜力。 Result 7 | A-1 与溴莫尼定头对头比较：疗效相当，安全性更优 # 核心发现： 在 LL37 诱导的玫瑰痤疮样小鼠模型中，A-1 局部给药展现出与溴莫尼定相当的治疗效果，且停药后无反弹现象，长期用药安全性更佳。 主要证据： A-1 促进 VSMC 中 MYL9 磷酸化和 MLCK 表达，效果与 α-KG 相当，但 有效浓度低 500 倍 （200 nM vs 80 μM） 局部应用 A-1 显著改善玫瑰痤疮相关红斑、血管扩张和炎症（与 α-KG 效果相当） 头对头比较（0.33% 溴莫尼定 vs A-1凝胶）： 即时疗效：A-1 与溴莫尼定相当 长期用药后：溴莫尼定出现接触性皮炎样特征 停药 4 天后再诱导（模拟复发）： A-1 和 α-KG 均保持强效持久治疗效果；溴莫尼定 加重红斑 （与临床停药反弹现象一致） 意义： A-1 作为新一代 OXGR1 激动剂，有望克服现有红斑治疗药物的瓶颈问题。 关键图表 (Figure 1-7) # 以下为论文原图，按研究逻辑顺序排列。PDF 源文件： D:/App/Zotero/storage/WKKSZCY2/Xiao 等 - 2026 - Metabolite-gated vascular contractility switch OXGR1 activation mechanism enables agonist therapy for rosacea erythema.pdf Figure 1 | α-酮戊二酸被确定为玫瑰痤疮的保护性代谢物 # 图注： Figure 1. α-KG 被确定为玫瑰痤疮的保护性代谢物 (A) 研究设计和参与者特征（63名健康 vs 57名玫瑰痤疮患者） (B) SMPDB 通路富集分析，显示 α-KG 相关通路显著富集 (C-D) α-KG 水平与 CEA 评分正相关，与 IGA 无关 (E-H) α-KG 口服给药减轻 LL37 诱导的玫瑰痤疮样红斑（剂量依赖性） (I-J) CD31 免疫组化证实 α-KG 的血管收缩作用 (K-N) 局部 α-KG 凝胶同样减轻玫瑰痤疮样症状 Figure 2 | α-酮戊二酸通过其膜受体 OXGR1 改善玫瑰痤疮样症状 # 图注： Figure 2. α-KG 通过其特异性受体 OXGR1 改善玫瑰痤疮样症状 (A-M) OXGR1 与 α-SMA 共定位，定位于 VSMC（非内皮细胞） (B-P) VSMC 特异性 Oxgr1 条件性敲除（cKO）小鼠构建 (C-E) Oxgr1 cKO 小鼠中，α-KG 的红斑减轻作用消失 (F-G) α-KG 治疗后，cKO 小鼠血管直径增大、炎症浸润增加 Figure 3 | α-KG-OXGR1 轴可预防玫瑰痤疮中的异常血管舒张 # 图注： Figure 3. α-KG-OXGR1-MYL9 轴可预防玫瑰痤疮中的异常血管舒张 (A-E) 玫瑰痤疮样小鼠 VSMC 中 p-MYL9 水平降低，α-KG 治疗逆转；OXGR1 缺失抑制 MYL9 磷酸化 (F-L) siRNA 敲低 Mlck 逆转 α-KG 对红斑和 p-MYL9 的改善作用 (M-O) ML-7（MLCK 抑制剂）加剧玫瑰痤疮样症状 (K-R) 原代 VSMC 胶原凝胶收缩实验：α-KG 诱导 VSMC 收缩，Oxgr1/Mlck 敲低阻断该效应 Figure 4 | OXGR1-Gq 复合物的冷冻电镜结构 # 图注： Figure 4. OXGR1-Gq 复合物的冷冻电镜结构 (A-I) 三种复合物的 cryo-EM密度图（OXGR1^CA^-Gq: 2.7 Å；α-KG: 2.6 Å；ITA: 2.4 Å） (J) OXGR1 激活机制与其他 GPCR 的比较（缺乏 W^6.48^ 开关） (K) 全局分辨率和各亚基分辨率图 Figure 5 | α-KG 和 ITA 结合口袋的冷冻电镜结构 # 图注： Figure 5. α-KG 和 ITA 结合口袋的冷冻电镜结构 (A-B) 双酸结合口袋（SAP + CAP）的结构细节 (C) 关键残基突变对配体诱导激活的影响 (D-E) α-KG 比 ITA 效力更强的结构基础（L186^ECL2^ 额外极性相互作用） Figure 6 | 选择性 OXGR1 激动剂的鉴定 # 图注： Figure 6. 基于结构虚拟筛选鉴定选择性 OXGR1 激动剂 (A-C) 虚拟筛选流程（100万化合物 → 1000 → 200 → 63 → 3个先导化合物） (D-E) A-1 的 EC₅₀ = 626.5 nM（比 α-KG 强约 60 倍），对 GPR91 无活性 (F-N) A-1 与 OXGR1 结合口袋的关键相互作用（F113 的 π-π 堆积是选择性关键） Figure 7 | OXGR1 激动剂与溴莫尼定头对头比较 # 图注： Figure 7. OXGR1 激动剂通过收缩血管平滑肌细胞来缓解酒渣鼻 (A-D) A-1 促进 VSMC 中 MYL9 磷酸化和 MLCK 表达，效果与 α-KG 相当 (E-L) A-1 局部应用改善玫瑰痤疮样红斑和血管扩张 (K-P) 头对头比较：A-1 vs 溴莫尼定疗效相当；复发模型中，溴莫尼定加重红斑（停药反弹），A-1 和 α-KG 保持疗效 讨论与结论 # 核心发现 # 首次建立代谢物-血管功能障碍-玫瑰痤疮红斑的机制联系： α-KG 通过激活 VSMC 中的 OXGR1-Gq-MYL9 信号轴，增强血管收缩力，抑制病理性血管舒张，从而改善玫瑰痤疮红斑。 揭示了 OXGR1 的独特结构基础： 双酸结合口袋（SAP + CAP）和非典型 GPCR 激活机制（F254^6.48^ 替代 W^6.48^），解释了为何 OXGR1 选择性识别 α-KG 和 ITA 等双酸代谢物。 合理设计的新一代红斑治疗药物 A-1： 基于结构生物学的药物设计，效力比 α-KG 强 60 倍，且避免了溴莫尼定的停药反弹问题。 研究亮点 # ✅ 临床意义： 将 α-KG-OXGR1 轴确立为玫瑰痤疮红斑的全新治疗靶点，填补了现有疗法的关键空白 ✅ 机制创新： 首次阐明代谢物通过 GPCR 调节血管平滑肌收缩的具体信号通路（α-KG-OXGR1-Gq-MYL9） ✅ 结构突破： 利用 cryo-EM 解析了 OXGR1 的独特双酸结合口袋和非典型激活机制 ✅ 药物创新： 基于结构合理设计合成激动剂 A-1，展示了从基础研究到药物发现的完整转化链条 ✅ 临床价值： A-1 在玫瑰痤疮样模型中疗效与溴莫尼定相当，但避免了停药反弹，有望成为更安全的替代药物 研究局限性 # 模型局限： LL37 诱导的小鼠玫瑰痤疮样模型无法完全模拟人类玫瑰痤疮的慢性复发病程和表型异质性 临床转化： α-KG 和 A-1 在小鼠模型中显示出显著疗效，但仍需临床试验验证其在患者中的治疗效果和长期安全性 上游机制： 患者体内 α-KG 水平升高的上游驱动因素和组织来源尚未明确，有待进一步研究 其他效应： α-KG 作为三羧酸循环中间体和表观遗传调节因子，在玫瑰痤疮中可能存在其他非 OXGR1 依赖的机制 核心参考文献 # Xiao WQ et al. (2026) . Metabolite-gated vascular contractility switch: OXGR1 activation mechanism enables agonist therapy for rosacea erythema. Cell , 189, 1990-2006.e30. DOI: 10.1016/j.cell.2026.01.036 Liu T et al. (2022) . Aberrant amino acid metabolism promotes neurovascular reactivity in rosacea. JCI Insight , 7, e161870. （玫瑰痤疮代谢组学数据集来源） Tokonami N et al. (2013) . α-Ketoglutarate regulates acid-base balance through an intrarenal paracrine mechanism. J. Clin. Investig. , 123, 3166-3171. （α-KG-OXGR1 在肾脏中的经典功能） Zeng YR et al. (2023) . The immunometabolite itaconate stimulates OXGR1 to promote mucociliary clearance during the pulmonary innate immune response. J. Clin. Investig. , 133, e160463. （ITA 作为 OXGR1 激动剂的免疫功能） Yang J et al. (2022) . AKG/OXGR1 promotes skeletal muscle blood flow and metabolism by relaxing vascular smooth muscle. Life Metab. , 1, 285-297. （α-KG/OXGR1 对血管平滑肌的双向调节） Olsen RHJ et al. (2020) . TRUPATH, an open-source biosensor platform for interrogating the GPCR transducerome. Nat. Chem. Biol. , 16, 841-849. （G 蛋白解离实验方法） Thiboutot D et al. (2020) . Standard management options for rosacea: The 2019 update by the National Rosacea Society Expert Committee. J. Am. Acad. Dermatol. , 82, 1501-1510. （玫瑰痤疮治疗指南） Asadi Shahmirzadi A et al. (2020) . Alpha-Ketoglutarate, an Endogenous Metabolite, Extends Lifespan and Compresses Morbidity in Aging Mice. Cell Metab. , 32, 447-456.e6. （α-KG 的系统生物学效应） 精彩片段（Highlights） # α-酮戊二酸（α-KG）是玫瑰痤疮患者体内升高的保护性代谢物，其水平与红斑严重程度相关 OXGR1 通过 Gq-MYL9 信号通路成为治疗玫瑰痤疮红斑的全新靶点 冷冻电镜揭示了 OXGR1 的双酸结合口袋识别其内源性激动剂（α-KG 和 ITA）的分子机制 α-酮戊二酸和结构导向激动剂 A-1 可改善玫瑰痤疮，疗效与溴莫尼定类似，且无停药反弹 文献汇报生成时间：2026-04-10 | Zotero ItemID: 1872","tags":["玫瑰痤疮","OXGR1","GPCR","血管平滑肌","alpha-KG","cryo-EM","激动剂"],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.577Z","url":"literature/notes/fa7c927dd4584e4d65267926.html"},{"kbId":"KB-000045","title":"OXGR1 激活机制与玫瑰痤疮红斑治疗","subtitle":"","summary":"Cell IF=45.5 中科院1区 2025-07-11 Xiao WQ, Zhu Y, Tang XJ, Zhu KK, et al. Zotero ItemID: 1872 DOI: 10.1016/j.cell.2026.01.036 玫瑰痤疮（酒渣鼻）是一种慢性炎症性皮肤病，全球患病率约 5.5% ，主要表现为面部中央潮红、持续性红斑、丘疹、脓疱和鼻赘，严重损害患者身心健康。持续性红斑被广泛认为是玫瑰痤疮的主要特征之一。 目前 FDA 批准的红斑治疗药物仅有溴莫尼定","body":"Metabolite-gated vascular contractility switch: OXGR1 activation mechanism enables agonist therapy for rosacea erythema # Cell | IF=45.5 | 中科院1区 | 2025-07-11 Xiao WQ, Zhu Y, Tang XJ, Zhu KK, et al. Zotero ItemID: 1872 | DOI: 10.1016/j.cell.2026.01.036 一、研究背景与科学问题 # 1.1 临床背景 # 玫瑰痤疮（酒渣鼻）是一种慢性炎症性皮肤病，全球患病率约 5.5% ，主要表现为面部中央潮红、持续性红斑、丘疹、脓疱和鼻赘，严重损害患者身心健康。持续性红斑被广泛认为是玫瑰痤疮的主要特征之一。 目前 FDA 批准的红斑治疗药物仅有溴莫尼定和羟甲唑啉两种 α-肾上腺素受体激动剂，但临床实践表明这些药物疗效有限，且存在 停药反弹（rebound erythema） 、红斑加重和接触性皮炎等不良反应。红斑的完全缓解仍是未被满足的临床需求。 1.2 机制背景 # 玫瑰痤疮的发病机制主要归因于血管功能障碍，包括血管炎症和病理性血管扩张。血液代谢物被认为是维持血管稳态的重要介质，但具体哪些代谢物参与以及如何发挥作用尚不清楚。该团队前期研究发现玫瑰痤疮患者存在显著的代谢重编程，提示代谢紊乱可能是神经血管过度活跃的潜在机制。 1.3 科学问题 # 玫瑰痤疮患者血液中哪些关键代谢物与红斑发病相关？其水平变化是致病因素还是反馈保护？ 代谢物通过何种膜受体和信号通路调节血管功能，从而影响红斑？ 能否基于结构生物学合理设计高选择性激动剂，实现比现有药物更安全有效的红斑治疗？ 二、整体研究思路（技术路线） # 本研究采用 \"临床代谢组学 → 功能验证 → 机制解析 → 结构生物学 → 药物设计\" 的递进式研究策略： Step 内容 关键技术 1 代谢组学发现 靶向代谢组学（63 vs 57 样本，SMPDB/KEGG 富集） 2 功能验证 LL37 诱导小鼠玫瑰痤疮样模型 3 受体和通路鉴定 Oxgr1/Gq VSMC 特异性 cKO 小鼠 4 结构生物学 Cryo-EM（4 种复合物，2.4-2.7 Å） 5 药物设计 基于结构的虚拟筛选（100 万化合物库） 6 疗效比较 头对头比较（A-1 vs 溴莫尼定） 三、主要结果 # Result 1 | α-酮戊二酸（α-KG）是玫瑰痤疮的保护性代谢物 # 【目的】 鉴定玫瑰痤疮红斑发病相关的关键代谢物，验证其因果关系。 【主要证据】 (1) 代谢组学发现 ：63 名健康 vs 57 名玫瑰痤疮患者血清（SMPDB/KEGG 富集分析），前 10 个富集通路中 9 个与 α-KG 相关，α-KG 水平与 CEA 评分（红斑严重程度）正相关，与 IGA 评分无关 (2) α-KG 口服给药 （连续 14 天）+ LL37 诱导模型：以剂量依赖性方式减轻红斑面积和评分，降低 CD31 阳性血管密度（血管收缩效应） (3) α-KG 凝胶局部应用 ：同样减轻血管扩张和炎症浸润（排除全身性影响） 【核心发现】 α-KG 是玫瑰痤疮的保护性代谢物，具有治疗转化潜力，其水平升高可能是机体对病理性血管舒张的自我保护反馈。 Result 2 | α-KG 通过血管平滑肌细胞上的 OXGR1 受体发挥保护作用 # 【目的】 鉴定 α-KG 的特异性膜受体及其细胞定位。 【主要证据】 (1) OXGR1（GPR99）是 α-KG 的特异性膜受体，与 α-SMA 共免疫染色显示其定位于血管平滑肌细胞（VSMC），而非内皮细胞 (2) 构建 Myh11-CreER;Oxgr1^fl/fl 条件性敲除（cKO）小鼠 ，VSMC 特异性缺失 OXGR1 后，α-KG 的抗红斑效应 完全消失 （血管舒张加剧，炎症浸润增加） (3) 另一种 OXGR1 内源性激动剂**衣康酸（ITA）**同样改善玫瑰痤疮样症状，进一步证实信号通路的特异性 【核心发现】 OXGR1 是 α-KG 改善玫瑰痤疮的 必要受体 ，主要作用细胞为 VSMC。 Result 3 | α-KG-OXGR1-Gq-MYL9 轴抑制异常血管舒张 # 【目的】 阐明 α-KG-OXGR1 调节血管收缩的信号转导机制。 【主要证据】 (1) 玫瑰痤疮样小鼠和患者皮肤中，VSMC 内 p-MYL9 水平均降低；α-KG 或 ITA 治疗可逆转；OXGR1 缺失抑制 MYL9 磷酸化 (2) siRNA 敲低 Mlck 或 Oxgr1 ，或 Gq 抑制剂 YM-254890 处理，或 VSMC 特异性 Gq cKO ，均消除 α-KG 的保护效应（胶原凝胶收缩实验验证） (3) 机制链 ：α-KG → OXGR1 → Gq → PLC → IP₃↑ + DAG↑ → [Ca²⁺]ᵢ↑ → Ca²⁺/CaM → MLCK → MYL9 磷酸化 → VSMC 收缩 → 抑制血管舒张 【核心发现】 首次从分子到细胞水平完整阐明 α-KG-OXGR1 轴通过 Gq-MLCK-MYL9 信号通路促进 VSMC 收缩，从而抑制病理性血管舒张的机制。 Result 4 | OXGR1-Gq 复合物的冷冻电镜结构 # 【目的】 从原子水平阐明 OXGR1 识别配体和激活 Gq 蛋白的分子机制。 【主要证据】 (1) 解析了 4 种复合物结构 （分辨率 2.4-2.7 Å）：OXGR1^CA^-Gq（组成性激活）、α-KG-OXGR1-Gq（2.6 Å）、ITA-OXGR1-Gq（2.4 Å）、A-1-OXGR1-Gq（2.6 Å） (2) OXGR1 缺乏经典 W^6.48^ 开关（被 F254^6.48^ 取代）， TM6-TM3 距离仅 3 Å （vs β2AR 的 15 Å），表现出 非典型 GPCR 激活机制 【核心发现】 OXGR1 具有独特的非典型 GPCR 结构基础，为基于结构的药物设计提供了原子分辨率模板。 Result 5 | OXGR1 的双酸结合口袋（bipartite-acid pocket） # 【目的】 阐明 OXGR1 选择性识别 α-KG 和 ITA（均为双酸分子）的结构基础，并解释两者效力差异。 【主要证据】 (1) SAP（简单酸性口袋） ：识别配体末端单个羧酸，被 R110³·²⁹、H114³·³³、Y284⁷·³⁵ 包围（提供极性和正电荷环境） (2) CAP（复杂酸性口袋） ：识别另一个羧酸，被 Y40¹·³⁹、Y93²·⁶⁴、R288⁷·³⁹ 包围 (3) α-KG 比 ITA 效力强约 5 倍 （EC₅₀：41.0 vs 220.4 μM）：α-KG 的 α-羧基与 L186^ECL2^ 主链胺基形成额外极性相互作用 【核心发现】 首次阐明双酸代谢物的受体识别模式，为设计双酸类选择性激动剂提供了结构模板。 Result 6 | 基于结构合理设计选择性 OXGR1 激动剂 A-1 # 【目的】 克服 α-KG 体内半衰期短、选择性低的缺点，设计高效选择性合成激动剂。 【主要证据】 (1) 虚拟筛选策略 ：靶向 OXGR1 相比同源受体 GPR91 的两个非保守残基（L186^ECL2^ 和 F113³·³²^），从 100 万化合物库逐步筛选至 3 个先导化合物 (2) A-1 的 EC₅₀ = 626.5 nM （比 α-KG 强约 60 倍 ）；对 GPR91 无明显活性（选择性极高）；不激活 P2X4 嘌呤受体 (3) F113³·³²^ 是决定 A-1 选择性的关键残基 ：F113L 突变使 A-1 效力降低 \u003e10,000 倍 【核心发现】 展示了从结构生物学到合理药物设计的完整转化链条，A-1 作为临床前候选药物具有极大潜力。 Result 7 | A-1 与溴莫尼定头对头比较：疗效相当，安全性更优 # 【目的】 在临床前模型中验证 A-1 相比一线药物溴莫尼定的疗效和安全性优势。 【主要证据】 (1) A-1 在 200 nM 浓度下即可诱导与 α-KG（80 μM）相当的 VSMC 收缩效应（相差约 500 倍 ） (2) 停药 4 天后再诱导 （模拟复发）：A-1 和 α-KG 保持强效持久疗效； 溴莫尼定加重红斑 （与临床停药反弹现象一致） (3) 长期用药后溴莫尼定出现接触性皮炎样特征，A-1 安全性更优 【核心发现】 A-1 作为新一代 OXGR1 选择性激动剂，有望克服现有红斑治疗药物的瓶颈问题。 四、机制模型 # 4.1 信号传导机制模型 # α-KG / ITA（玫瑰痤疮患者体内升高的内源性代谢物） ↓ OXGR1（GPR99）——定位于血管平滑肌细胞（VSMC） ↓ Gq 蛋白偶联 → 激活磷脂酶 C（PLC） ↓ DAG + IP₃ 生成 → [Ca²⁺]ᵢ ↑（细胞内钙离子升高） ↓ Ca²⁺/钙调蛋白复合物 → MLCK 激活 → MYL9 磷酸化（p-MYL9 ↑） ↓ 肌动蛋白-肌球蛋白相互作用增强 → VSMC 收缩增强 ↓ 抑制病理性血管舒张 → 红斑减轻 4.2 治疗转化模型 # 治疗药物 靶点 EC₅₀ 优势 劣势 α-KG（内源性） OXGR1 41 μM 内源性、安全性好 半衰期短、效力低 ITA（内源性） OXGR1 220 μM 内源性 效力低 A-1（合成） OXGR1 626.5 nM 效力高60倍、高选择性、不激活P2X4 需临床验证 溴莫尼定（对照） α2-AR — 即时有效 停药反弹、接触性皮炎 五、汇报亮点与局限性 # 5.1 研究亮点 # 临床转化价值突出 ：首次将 α-KG-OXGR1 轴确立为玫瑰痤疮红斑的全新治疗靶点，填补了现有疗法的关键空白。α-KG 是内源性代谢物，安全性和耐受性已有大量研究支持；A-1 作为合成化合物，效力高、选择性佳、不激活 P2X4，安全性更优。 机制创新性强 ：首次从分子、细胞、动物和临床样本多个层面完整阐明代谢物（α-KG）通过 GPCR（OXGR1）调节血管平滑肌收缩的具体信号通路（α-KG-OXGR1-Gq-MYL9 轴），将代谢组学、血管生物学和皮肤科学深度交叉融合。 结构生物学突破 ：利用 cryo-EM 解析了 OXGR1 的独特双酸结合口袋（SAP+CAP）和非典型 GPCR 激活机制（F254^6.48^ 替代 W^6.48^），为理解代谢物-GPCR 相互作用提供了全新视角。 药物设计范式 ：展示了从\"代谢组学发现 → 功能验证 → 结构生物学 → 基于结构的虚拟筛选 → 合理药物设计\"的完整转化链条，为皮肤科药物开发提供了可复制的范例。 5.2 研究局限性 # 模型局限性 ：LL37 诱导的小鼠玫瑰痤疮样模型无法完全模拟人类玫瑰痤疮的慢性复发病程、表型异质性和神经血管交互作用。 临床转化尚需验证 ：α-KG 和 A-1 在动物模型中显示出显著疗效，但仍需在患者中开展随机对照临床试验以验证其治疗效果和长期安全性。 上游机制未明 ：患者体内 α-KG 水平升高的驱动因素（代谢来源组织、上游调控因子）尚未明确。 α-KG 的多效性 ：α-KG 作为三羧酸循环中间体和表观遗传调节因子，在其他疾病状态下可能通过非 OXGR1 依赖途径发挥作用。 六、核心参考文献 # Xiao WQ, Zhu Y, Tang XJ, et al. Metabolite-gated vascular contractility switch: OXGR1 activation mechanism enables agonist therapy for rosacea erythema. Cell . 2026;189:1990-2006.e30. doi:10.1016/j.cell.2026.01.036 Liu T, Xiao W, Chen M, et al. Aberrant amino acid metabolism promotes neurovascular reactivity in rosacea. JCI Insight . 2022;7:e161870. Tokonami N, Morla L, Centeno G, et a  # 基准测试 领域 特点 Lab-Bench 生物学研究 侧重 QA 和代码生成 BioML-Bench 生物 ML 端到端生物 ML 流程 Single-Cell Agent 单细胞组学 单细胞分析 Agent BixBench 计算生物学 数据分析场景探索 BioAgent Bench 的独特之处： 强调跨不同生物信息学领域的端到端多步骤流程 （而非单一问答） 2. 关键概念定义 # 术语 定义 Pipeline（流程） 将原始生物数据（DNA/RNA 测序 reads）转化为分析输出（比对、定量、变异检测等）的工作流 Input Data（输入数据） 待处理的样本材料（如某实验/个体的 reads） Reference Data（参考数据） 跨样本共享的基线数据（参考基因组、基因注释、已知变异数据库等） Task（任务） 定义了明确输入和成功标准的单个实例 Trial（试验） 任务的一次执行 Grader（评分器） 评估试验得分的逻辑 Transcript（轨迹） 完整执行日志，含消息、工具调用和中间步骤 Evaluation Harness 执行任务→捕获轨迹→应用评分器→聚合结果 Agent Harness（Scaffold） 使模型能执行操作和使用工具的系统 3. Benchmark 设计 # 3.1 任务概览 # BioAgent Bench 包含 10 个端到端任务 ，覆盖常见生物信息学模态和工作流： 3.2 评估框架流程 # 任务提示词 (Task Prompt) ↓ 输入数据 + 参考数据 ↓ LLM Agent ←→ 通用工具（Python/R/Shell）+ 专业生物信息学工具（STAR/DESeq2/GATK/Kraken2） ↓ 生成中间输出文件 + 最终结果文件 ↓ LLM Judge (GPT-5.1) 比较输出 vs Ground Truth → 评估结果 3.3 系统提示词设计 # 关键要点： 指定执行环境（mamba 环境） 要求使用绝对路径 要求分阶段输出到 outputs/ 目录（如 0_trimming/ 、 1_alignment/ ） 最终结果输出到 results/ 目录 遇到错误用 try/except 包裹子进程调用 3.4 评分器（Grader）设计 # 为什么用 LLM 作为评分器？ 生物信息学任务常有 多条有效解决路径 （如 HaplotypeCaller vs DeepVariant vs 其他 pipeline） 避免硬编码单一标准答案 允许评估不同步骤数量的试验 评分指标 ： steps_completed — 完成的步骤数 steps_to_completion — 预期完成的步骤数 final_result_reached — 是否到达最终结果 notes — 总结停在何处及剩余步骤 results_match — 结果是否匹配 4. 实验设置 # 4.1 模型 # 闭源模型 ： Claude Opus 4.5 Claude Sonnet 4.5 GPT-5.2 GPT-5.1 (Codex Max) Gemini 3 Pro Preview 开放权重模型 ： GLM-4.7 Qwen 3 Coder Kimi K2 Thinking MiniMax M2.1 DevStral 25 4.2 Agent 框架（Harness） # 三个主流 Agent 框架： Claude Code (Anthropic) Codex CLI (OpenAI) OpenCode (AnomalyInnovations) 4.3 扰动测试（鲁棒性评估） # 扰动类型 描述 Decoy（诱饵） 注入不相关的诱饵输入（如来自无关生物的序列），测试 Agent 能否正确排除无关文件 Corrupted Inputs（损坏输入） 人工损坏部分输入文件，测试 Agent 能否检测并避免使用无效数据 Prompt Bloat（提示膨胀） 在任务提示前追加大量主题相关但非必要的文本，测试抗干扰能力 5. 主要结果 # 5.1 完成率（Completion Rate） # 按 Harness 分组（Codex CLI） ： 模型 完成率 Claude Opus 4.5 100% Gemini 3 Pro 96.6% GPT-5.2 92.5% Claude Sonnet 4.5 92.5% GLM-4.7 82.5% Kimi K2 Thinking 80.5% GPT-5.1 (Codex Max) 81.7% DevStral 25 65.0% MiniMax M2.1 73.6% Qwen 3 Coder 62.9% 关键结论：前沿闭源模型可以端到端执行多步骤生物信息学流程并可靠生成最终产物， 无需额外定制脚手架 。 5.2 规划质量与执行能力的关系 # 让模型只生成高层计划（不执行），由 GPT-5.1 打分（1-5 分） Pearson 相关系数 r = 0.61 ：规划质量与整体 Agent 表现正相关 但关系并非决定性：Gemini-Pro-3 规划分数较低，仍能达到高完成率 5.3 重复试验的变异性 # 总体 Jaccard = 0.43，Pearson = 0.73 ：多次试验间存在相当大的变异性，主要来源为工具执行的非确定性和中间决策差异。 5.4 扰动分析结果 # 失败模式分析 ： Decoy 失败 （comparative-genomics, metagenomics）： Agent 依赖浅层文件名启发式（如 .genomic.fna 后缀匹配所有文件） 或使用表面级默认配置（可用工具列表中的第一个） 失败根因：未能在生物背景下校准工具配置 Prompt Bloat 失败 （deseq, metagenomics, single-cell）： Agent 反复重述任务、循环执行表面层指令重写 表现出与弱开放权重模型相同的症状：无法通过工具使用和状态执行取得增量进展 6. 讨论与启示 # 6.1 核心洞察 # 高层流程构建 ≠ 步骤级推理 ：正确的高层 pipeline 构造不能保证在扰动下的正确行为 鲁棒性是关键瓶颈 ：临床诊断等敏感场景的相关问题不是\"它是否产生了结果\"，而是\"它能否可靠地检测到不应该继续的情况，并能用数据和上下文中的证据证明其选择\" 开放权重模型的不可替代性 ：涉及敏感患者数据、专有参考集或未发布 IP 的场景下，本地部署的开放权重 Agent 虽表现略低，但可实现更强的数据治理 6.2 开放权重模型的重要性 # 隐私约束场景： 患者来源测序数据（癌症筛查） 专有参考集合 未发布 IP → 路由数据到模型提供商不可接受 → 本地部署 Agent 虽 benchmark 表现略低 → 但实现更强的治理和降低组织风险 7. 局限性 # LLM 评分的主观性 ：评分依赖 rubric 措辞、轨迹详细程度和中间产物呈现方式；试验间可能存在评分不一致 Benchmark 约束限制真实世界保真度 ： 资源限制（\u003c 4 小时运行时，≤ 48GB RAM）缩小了任务和数据空间 偏向小基因组和良好打包的输入 排除了大型基因组、异构队列、长运行 pipeline 等常见失败模式 鲁棒性测试范围有限 ：每个任务和条件仅运行单次试验，结果应视为 探索性 而非确定性结论 扰动构建存在局限 ：部分扰动使文件完全不可读（触发硬错误），而更现实且安全性相关的情况是语法有效但生物学上难以置信 8. 代码与资源 # 主页 ： https://github.com/bioagent-bench/bioagent-bench 实验代码 ： https://github.com/bioagent-bench/bioagent-experiments 附录：补充图表 # A.1 各 Harness 模型完成率对比（Table 4） # A.2 Prompt Bloat 扰动示例 # 在 metagenomics 任务中，追加了 871 个无关词后，Agent 完全失败（-100%）。提示膨胀导致 Agent 陷入\"指令重述循环\"，无法执行有效的工具调用。 A.3 各 Harness 详细完成率（Table A.5） # A.4 鲁棒性度量列说明（Table A.6） # 9. 个人笔记 / 思考 # 待补充 ：阅读本文后的思考、与自身研究的相关性、可能的应用场景 可能的应用方向 # 将 BioAgent Bench 框架适配到特定生物信息学子领域评测 结合本地部署的生物信息学 Agent（如使用 GLM-4 等开放权重模型）进行隐私保护场景探索 针对扰动测试设计更贴近实际临床数据的鲁棒性评测方案 与现有工作的关系 # 相比 Lab-Bench 更强调 端到端 pipeline 而非单一问答 扰动测试设计值得借鉴，可作为 Agent 部署前的安全检查框架","tags":["AI-Agent","LLM","bioinformatics","benchmark","evaluation","RNA-seq","variant-calling","metagenomics"],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.576Z","url":"literature/notes/f50d878be1153a86032d4510.html"},{"kbId":"KB-000042","title":"文献汇报 | Zhang et al. 2026 | PAT–KYN–铁蛋白自噬轴介导铁死亡抵抗","subtitle":"","summary":"Peritumoural adipose tissue promotes ferroptosis resistance by 3-hydroxykynurenine-mediated suppression of ferritinophagy 期刊 ：Nature Cell Biology（NCB） 发表日期 ：2026年3月11日 DOI ：10.1038/s41556-026-01907-x 通讯作者 ：Huai-Qiang Ju（aju-HQ）、Rui-Hua Xu 第","body":"标题 # Peritumoural adipose tissue promotes ferroptosis resistance by 3-hydroxykynurenine-mediated suppression of ferritinophagy 期刊 ：Nature Cell Biology（NCB） 发表日期 ：2026年3月11日 DOI ：10.1038/s41556-026-01907-x 通讯作者 ：Huai-Qiang Ju（aju-HQ）、Rui-Hua Xu 第一作者 ：Yan-Yu Zhang、Yi Han、Yue-Tao Tan 机构 ：中山大学肿瘤防治中心、华南肿瘤学国家重点实验室 Zotero ItemID ：1868 一、研究背景与科学问题 # 1.1 临床背景 # 肿瘤周围脂肪组织（Peritumoural Adipose Tissue，PAT）是多种腹部恶性肿瘤（结直肠癌CRC、胃癌GC、卵巢癌等）的邻近组织成分，与肿瘤直接接触。临床研究显示，PAT 与多种癌症的不良预后密切相关，是CRC无复发生存期的独立预测因子。然而，PAT 驱动肿瘤进展和治疗耐药的具体分子机制尚不完全清楚。 1.2 铁死亡概述 # 铁死亡（Ferroptosis）是一种由铁依赖性脂质过氧化驱动的调控性细胞死亡形式。细胞内游离铁（Fe²⁺）水平是铁死亡敏感性的关键决定因素： 铁蛋白（Ferritin） ：由FTH1（重链）和FTL（轻链）组成，通过螯合 Fe²⁺ 维持细胞铁稳态 铁蛋白自噬（Ferritinophagy） ：NCOA4识别并结合铁蛋白，将其递送至溶酶体降解，从而释放储存的铁，促进脂质过氧化和铁死亡 GPX4 ：谷胱甘肽过氧化物酶4，是铁死亡的核心抑制因子 1.3 已有研究基础 # 先前研究已表明： 铁死亡是一种具有免疫原性的细胞死亡形式，CD8⁺ T细胞来源的IFN-γ可在免疫检查点阻断治疗（ICB）期间增强肿瘤对铁死亡的敏感性 肿瘤微环境中的IL-1β可通过维持铁稳态保护肿瘤细胞免受铁死亡 脂肪细胞可保护三阴性乳腺癌细胞免受铁死亡，但具体机制未明 1.4 关键科学问题 # PAT是否调控肿瘤细胞的铁死亡敏感性？ PAT通过何种分子机制赋予肿瘤细胞铁死亡抵抗？ 靶向PAT驱动的铁死亡抵抗能否增强免疫治疗疗效？ 二、整体研究思路 # 本研究采用\"临床发现 → 体外验证 → 机制解析 → 动物模型 → 治疗转化\"的递进式研究策略： 临床问题（PAT与不良预后） ↓ 建立肿瘤模型（皮下 vs iWAT脂肪组织部位） ↓ 代谢组学筛选 → 锁定KYN通路 ↓ 代谢物功能验证 → 鉴定3-HK为核心分子 ↓ 分子机制解析 → NCOA4-铁蛋白自噬抑制 ↓ 药理学干预 → IDO1/TDO2抑制 + 抗PD-1联合治疗 ↓ 临床样本验证 技术路线亮点 # 技术 应用 代谢组学（LC-MS/MS） 鉴定脂肪-CM中的差异代谢物 定量蛋白质组学（DIA-MS） 分析脂肪-CM处理的肿瘤细胞蛋白质组变化 snRNA-seq PAT组织单核测序，鉴定KYN来源细胞 SPR/BLI 验证3-HK与NCOA4的直接结合 免疫共沉淀（Co-IP） 验证FTH1-NCOA4相互作用 多种小鼠肿瘤模型 皮下、iWAT、腹膜转移模型 三、逐个 Result 总结 # Result 1：PAT赋予肿瘤细胞铁死亡抵抗力，并降低免疫疗法疗效 # 【目的】 建立模型验证PAT是否影响肿瘤细胞对铁死亡的敏感性，并探究其对免疫治疗的影响。 【主要证据】 模型构建 ： 将CRC肿瘤分别植入小鼠背部皮下（非脂肪组织部位）或腹股沟白色脂肪组织（iWAT，脂肪组织相关部位） 使用GPX4-iKD（强力霉素诱导性敲低）和SLC7A11-iKD系统调控铁死亡 铁死亡敏感性差异 ： iWAT植入的DLD1异种移植瘤比皮下肿瘤更耐受铁死亡（GPX4敲低后） IHC证实：iWAT肿瘤中脂质过氧化标志物（4-HNE、MDA）水平显著降低 MC38肿瘤中SLC7A11诱导性敲低也观察到了类似的耐药性 药理学验证 ： iWAT植入的MC38肿瘤对铁死亡诱导剂IKE的敏感性显著降低 肿瘤生长抑制率从皮下植入的82.5%下降到PAT相关肿瘤的0.24% Lip-1可逆转IKE效应（证实为铁死亡依赖性） 免疫依赖性 ： PAT仅在免疫功能正常的小鼠中促进肿瘤生长，在免疫缺陷裸鼠中无此作用 CD8⁺ T细胞耗竭后，促肿瘤作用消失 Rag1⁻/⁻小鼠过继转移CD8⁺ T细胞后，非脂肪组织部位肿瘤被选择性抑制 免疫治疗影响 ： iWAT植入的CRC肿瘤对抗PD-1治疗的反应显著降低 III-IV期肿瘤（脂肪组织嵌入状态）的脂质过氧化信号显著弱于I期肿瘤 【核心发现】 PAT通过保护肿瘤细胞免受铁死亡应激来促进肿瘤生长，且这种保护作用依赖于CD8⁺ T细胞介导的免疫监视。PAT还降低了免疫检查点阻断治疗（ICB）的疗效。 Result 2：PAT通过铁蛋白介导的铁螯合赋予肿瘤细胞铁死亡抵抗 # 【目的】 阐明PAT分泌何种因子来介导铁死亡抵抗，并鉴定其下游靶标。 【主要证据】 体外模型建立 ： 建立脂肪来源条件培养基（adipose-CM）检测系统 adipose-CM显著减弱RSL-3诱导的人CRC细胞（DLD1、HCT116）和小鼠MC38细胞中的脂质过氧化和铁死亡 抗氧化剂非依赖性 ： 维生素E和辅酶Q10（CoQ10）等抗氧化剂水平在脂肪相关肿瘤中并未改变 排除已报道的RTA（自由基捕获抗氧化剂）机制 蛋白质组学筛选 ： DIA-MS分析：脂肪-CM处理的MC38细胞表现出独特的蛋白质组学特征 关键发现 ：FTH1和FTL（铁蛋白亚基）显著上调，而其他核心铁死亡调节因子保持不变 免疫印迹验证：FTH1/FTL的选择性诱导 GSH非依赖性机制 ： adipose-CM处理的细胞内GSH水平未改变 表明这是一种以铁蛋白上调为中心的GSH非依赖性机制 Fe²⁺水平降低 ： FerroOrange染色：脂肪-CM处理的细胞内Fe²⁺水平降低 提示铁蛋白增加并非由于铁积累，而是主动螯合铁 功能验证 ： FTH1/FTL双重敲低： 消除adipose-CM对Fe²⁺的消耗 消除adipose-CM对RSL-3诱导铁死亡的保护作用 结论 ：铁蛋白对脂肪-CM介导的细胞保护作用至关重要 体内验证 ： 来自iWAT部位的MC38肿瘤细胞表现出更高FTH1/FTL表达、更低细胞内Fe²⁺和脂质过氧化水平 腹膜肿瘤（脂肪丰富微环境）的FTH1/FTL表达也高于皮下肿瘤 FTH1/FTL基因敲低抑制腹膜肿瘤进展 【核心发现】 PAT通过分泌某种因子，上调肿瘤细胞中的铁蛋白（FTH1/FTL）水平，螯合细胞内铁，从而赋予铁死亡抵抗力。这是一种完全独立于GSH系统的新机制。 Result 3：PAT建立富含犬尿氨酸（KYN）的肿瘤微环境，上调铁蛋白 # 【目的】 鉴定脂肪-CM中赋予铁死亡抵抗性的具体活性因子。 【主要证据】 活性因子性质 ： 活性具有热稳定性，且在3 kDa滤膜过滤后仍然存在 表明低分子量代谢物是活性因子 代谢组学筛选 ： LC-MS/MS分析：脂肪-CM和iWAT移植MC38肿瘤中， 犬尿氨酸（KYN）是唯一持续升高的代谢物 CRC患者和荷MC38肿瘤小鼠的PAT条件培养基中KYN浓度：分别为124 μM和97 μM KYN功能验证 ： KYN剂量依赖性增加FTH1/FTL表达 KYN降低细胞内Fe²⁺水平 KYN抑制RSL-3诱导的脂质过氧化和铁死亡 KYN代谢通路 ： KYN是色氨酸（TRP）经IDO1/TDO2代谢的产物 CRC肿瘤中IDO1/TDO2表达上调 → KYN积累 snRNA-seq：Ido1在脂肪细胞中高表达，Tdo2在脂肪前体细胞（pACs）和脂肪来源干细胞（ASCs）中高表达 脂肪细胞、pACs和ASCs共占PAT细胞总量的54.8% PAT特异性 ： PAT及其条件培养基中的KYN水平显著高于对侧iWAT（正常白色脂肪组织） 证实肿瘤邻近微环境中KYN产生的特异性增强 【核心发现】 PAT通过上调IDO1/TDO2表达，建立富含KYN的肿瘤微环境。KYN被癌细胞摄取后，上调铁蛋白水平，螯合细胞内铁，赋予铁死亡抵抗力。 Result 4：KYN衍生的3-HK是PAT介导的铁死亡抵抗的关键代谢物 # 【目的】 确定KYN的哪种下游代谢物是驱动铁蛋白积累和铁死亡抵抗的关键分子。 【主要证据】 代谢物筛选 ： 系统检测TRP-KYN通路中间体对铁死亡敏感性的影响 KYN、3-HK和3-HAA均能赋予癌细胞铁死亡抵抗力 3-HK和3-HAA是两个酶促步骤的连续产物 基因操作验证 ： 敲低KMO（KYN→3-HK的限速酶） ： 降低FTH1/FTL比值 增加Fe²⁺水平 增强脂质过氧化 使细胞对铁死亡更敏感 敲低KYNU（KYN→3-HAA的酶） ： 增强KYN的作用 进一步提高FTH1/FTL比值 进一步降低Fe²⁺和脂质过氧化水平 保护细胞免于铁死亡 3-HK直接功能 ： 持续补充3-HK剂量依赖性： 上调FTH1/FTL表达 降低活性铁水平 抑制脂质过氧化 增强铁死亡抵抗力 机制解析（翻译后调控） ： 3-HK不影响FTH1/FTL mRNA表达 脉冲追踪实验：3-HK延缓FTH1的降解 提示 ：3-HK通过抑制铁蛋白降解（而非促进合成）来稳定铁蛋白 NCOA4依赖性 ： 3-HK降低溶酶体Fe²⁺含量 在NCOA4敲除（KO）细胞中 ：3-HK和KYN均无法上调铁蛋白或降低Fe²⁺ NCOA4 KO细胞中，3-HK对RSL-3的保护作用显著减弱 证实 ：3-HK的作用完全依赖于NCOA4 通路特异性排除 ： AHR KO不影响3-HK介导的FTH1/FTL上调（排除AHR通路） NRF2/SLC7A11 KO中，3-HK仍能诱导FTH1/FTL（排除NRF2通路） CD44 KO中，3-HK仍能上调FTH1（排除铁摄取CD44通路） 【核心发现】 3-HK是驱动铁蛋白积累的关键代谢物。3-HK通过NCOA4依赖的方式抑制铁蛋白自噬，稳定铁蛋白，从而螯合铁并赋予铁死亡抵抗——这一过程完全独立于经典的抗氧化通路（NRF2/AHR/CD44）。 Result 5：3-HK直接结合NCOA4并阻断铁蛋白自噬的启动 # 【目的】 在分子层面阐明3-HK如何抑制NCOA4介导的铁蛋白自噬。 【主要证据】 FTH1-NCOA4相互作用受损 ： 免疫荧光：3-HK或KYN处理显著降低FTH1和NCOA4的共定位 Co-IP：3-HK减弱FTH1和NCOA4之间的直接结合 代谢酶调控验证 ： KYNU敲低：降低FTH1-NCOA4结合 KMO敲低：增强FTH1-NCOA4结合 与功能实验结果完全一致 体外结合实验 ： 纯化了全长NCOA4（NCOA4-fl）和铁蛋白结合域（NCOA4³⁸³⁻⁵²²） 3-HK特异性 抑制FTH1与NCOA4的直接结合 KYN和3-HAA均无此作用 热稳定性实验 ： 3-HK以剂量依赖的方式稳定NCOA4，使其免受热变性 直接物理相互作用的证据 细胞内共定位 ： 生物素标记3-HK与NCOA4在肿瘤细胞中共定位 直接相互作用验证 ： 链霉亲和素下拉和Duolink PLA：证实3-HK和NCOA4之间的相互作用 结合亲和力测定（SPR和BLI） ： SPR ： NCOA4³⁸³⁻⁵²² 与 3-HK：KD ≈ 0.8 μM NCOA4-fl 与 3-HK：KD ≈ 0.5 μM KYN和3-HAA均未检测到与NCOA4的结合 【核心发现】 3-HK以高亲和力（KD ~0.5-0.8 μM）直接结合NCOA4的铁蛋白结合域（383-522位氨基酸），破坏NCOA4与FTH1的相互作用，从而抑制铁蛋白自噬的启动。这是首次发现3-HK作为铁蛋白自噬的内源性调节因子。 Result 6：靶向KYN生物合成可增强PAT相关肿瘤对铁死亡和免疫疗法的敏感性 # 【目的】 验证药理学抑制KYN通路能否克服铁死亡抵抗，并增强免疫治疗疗效。 【主要证据】 药理学模型 ： IDO1抑制剂（epacadostat）+ TDO2抑制剂（LM10）联合使用 显著降低PAT中KYN水平和肿瘤内3-HK水平 FTH1、FTL和NCOA4表达相应下调 → 铁蛋白自噬增强 铁死亡增敏 ： 在多种模型中验证（CT26 iWAT、DLD1异种移植、CRC PDX、MC38免疫健全小鼠） IDO1/TDO2抑制显著增强肿瘤对铁死亡诱导剂（GPX4敲低/IKE）的敏感性 免疫治疗协同 ： IDO1/TDO2抑制 + 抗PD-1抗体：显著增强肿瘤抑制 Lip-1可逆转此增强效应 → 证实铁死亡的参与 在腹膜转移模型中得到进一步验证 临床相关性 ： 腹膜转移的胃癌患者对新辅助化疗-免疫疗法反应较差 配对组织IHC：腹膜转移灶中FTH1/FTL表达显著升高，4-HNE水平降低 KMO^高^/KYNU^低表达 特征（反映3-HK升高）与CRC和GC晚期及不良预后相关 【核心发现】 双重抑制IDO1/TDO2可破坏KYN-3-HK-铁蛋白轴，恢复PAT相关肿瘤的铁死亡敏感性。IDO1/TDO2抑制与抗PD-1治疗具有协同作用，为富含PAT肿瘤的免疫治疗提供了新的联合策略。 四、机制模型 # 4.1 整体机制图 # 肿瘤周围脂肪组织 (PAT) │ IDO1/TDO2 ↑表达 ↓ 大量分泌 KYN (124 μM) │ 癌细胞摄取 KYN │ KYN ──  the potential of targeting adipose–tumour cross-talk to enhance immunotherapy in PAT-associated tumours. Zhang, Han, Tan, Lu, Ma et al. report that kynurenine derived from peritumoural adipose tissue is hijacked by cancer cells to mediate ferroptosis resistance, a process that could potentially be targeted with immunotherapy to inhibit tumour growth.","body":"抽象的 # 肿瘤周围脂肪组织（PAT）是癌症治疗耐药的关键因素，但其在调控铁死亡中的作用尚不明确。本研究表明，PAT 通过上调铁蛋白（FTH1/FTL）并螯合细胞内铁，赋予癌细胞铁死亡抵抗力。PAT 衍生的犬尿氨酸（KYN）被鉴定为主要介质。KYN 被癌细胞摄取并代谢为 3-羟基犬尿氨酸，后者直接与核受体共激活因子 4（NCOA4）结合。这种相互作用抑制了 NCOA4 介导的铁蛋白自噬，从而阻止铁蛋白降解并限制铁死亡所需的游离铁池。在小鼠模型中，KYN 通路药物抑制与 PD-1 阻断剂协同作用，克服了铁死亡抵抗并抑制了肿瘤进展。这些发现揭示了 PAT–KYN–铁蛋白自噬轴促进铁死亡抵抗，突显了靶向脂肪-肿瘤交叉对话以增强 PAT 相关肿瘤免疫疗法的潜力。 主要的 # 肿瘤微环境（TME）受邻近基质成分的动态调控 1 。其中，肿瘤周围脂肪组织（PAT）在解剖学上与多种恶性肿瘤相关，包括乳腺癌、肾细胞癌以及胃癌（GC）、结直肠癌（CRC）和卵巢癌等腹部肿瘤 [^2] 。临床上，PAT 与多种癌症的不良预后相关 3 ，并且是 CRC 无复发生存期的独立预测因子 4 。脂肪细胞通过代谢偶联促进肿瘤增殖，主要通过提供游离脂肪酸和乳酸来为肿瘤细胞代谢提供能量 5,6,7 。同时，脂肪细胞还会上调癌细胞中的 CD36 以增强游离脂肪酸的摄取，并分泌脂肪因子以促进侵袭和迁移 8,9 。尽管取得了这些进展，但 PAT 驱动肿瘤进展和治疗耐药的确切机制仍未完全阐明。 铁死亡是一种受调控的细胞死亡，由铁依赖性脂质过氧化驱动，细胞内铁对其敏感性至关重要 [^10] 。铁蛋白由铁蛋白重链（FTH1）和铁蛋白轻链（FTL）亚基组成，通过螯合或释放 Fe 2+ 来维持铁稳态（参考文献 [^11] ）。这一过程通过铁蛋白自噬与铁死亡相关，在铁蛋白自噬过程中，核受体共激活因子 4（NCOA4）结合铁蛋白并将其降解，从而释放储存的铁，促进脂质过氧化 [^12] 。先前的研究表明，溶酶体铁的激活和扩散会启动膜脂氧化和铁死亡 13,14 ，并且有证据表明铁蛋白自噬与辐射诱导的铁死亡相关 15 ，从而凸显了其在调控铁死亡中的关键作用。相反，抑制铁蛋白自噬会损害铁的释放并赋予细胞铁死亡抵抗力 16,17 。药理学上破坏 NCOA4-FTH1 相互作用会降低亚铁离子水平和铁死亡敏感性 18 。越来越多的证据表明，铁死亡是一种独特的免疫原性细胞死亡形式，它在 CD8 + T 细胞介导的抗肿瘤免疫和免疫疗法中起着至关重要的调控作用 19,20 。我们之前的研究也表明，肿瘤微环境（TME）中的白细胞介素-1β通过维持铁稳态来保护肿瘤细胞免受铁死亡的影响 21 。然而，PAT 在调节铁死亡中的作用仍不清楚。 本研究旨在阐明 PAT 在调控癌细胞铁死亡敏感性中的作用。我们发现 PAT 可提高癌细胞中 3-羟基犬尿氨酸（3-HK）的水平，3-HK 可直接结合 NCOA4，抑制铁蛋白自噬，从而赋予癌细胞铁死亡抵抗力。此外，抑制犬尿氨酸（KYN）通路与抗 PD-1 疗法协同作用，可在富含脂肪组织的肿瘤模型中实现显著的肿瘤清除。本研究揭示了 PAT 驱动的铁死亡抵抗代谢机制，并提出了一种双靶点策略，即抑制 KYN 通路与免疫检查点阻断（ICB）相结合，以增强 PAT 相关肿瘤的免疫治疗效果。 结果 # PAT 赋予肿瘤细胞铁死亡抵抗力，并降低免疫疗法的疗效。 # 在晚期结直肠癌（CRC）和胃癌（GC）中，肿瘤常侵入浆膜层并直接接触内脏脂肪组织（图 1a ）。为了研究腹腔脂肪组织（PAT）是否影响铁死亡，我们建立了两种体内模型，将 CRC 肿瘤分别植入背部中段皮下区域（非脂肪组织部位）或腹股沟白色脂肪组织（iWAT，脂肪组织相关部位），如先前报道 [^22] 所述（图 1b ）。首先，我们利用强力霉素诱导的关键铁死亡抑制因子谷胱甘肽过氧化物酶 4（GPX4-iKD） [^23] 敲低方法，发现植入 iWAT 的 DLD1 异种移植瘤比皮下肿瘤更耐受铁死亡（图 1c、d 和扩展数据图 1a-c ）。免疫组织化学 (IHC) 证实，GPX4 沉默后，iWAT 相关肿瘤中的脂质过氧化（4-羟基壬烯醛 (4-HNE) 和丙二醛 (MDA)）水平降低（图 1e 和扩展数据图 1d ）。在 MC38 肿瘤中，胱氨酸转运蛋白 SLC7A11 的诱导性敲低也观察到了类似的耐药性 [^24] （扩展数据图 1e–g ）。 图 1：PAT 赋予肿瘤铁死亡抵抗力并降低免疫疗法疗效。 为了验证 PAT 介导的铁死亡抵抗的普遍性，我们随后评估了肿瘤在药理学和免疫学应激下的反应。在携带 MC38 肿瘤的 C57BL/6J 小鼠中，iWAT 植入的肿瘤对铁死亡诱导剂咪唑酮 erastin (IKE) 的敏感性显著降低，肿瘤生长抑制率从皮下植入的 82.5%下降到 PAT 相关肿瘤的 0.24%（图 1f、g 和扩展数据图 1i ）。这种 IKE 效应被证实为铁死亡依赖性的，因为在皮下肿瘤中，Liproxstatin-1 (Lip-1) 可以逆转这种效应（扩展数据图 1h ）。相应地，免疫组化结果显示，IKE 处理的 iWAT 肿瘤中脂质过氧化作用减弱（图 1h 和扩展数据图 1j ）。有趣的是，PAT 仅在免疫功能正常的 C57BL/6J 小鼠中促进肿瘤生长，而在免疫缺陷的 BALB/c 裸鼠中则无此作用（图 1c,f ）。CD8 + T 细胞耗竭后，这种促肿瘤作用消失（扩展数据图 2a,b ）。与此一致的是，在 Rag1 - / - 小鼠中，非脂肪组织和 iWAT 部位的肿瘤生长相似，但过继转移 CD8 + T 细胞可选择性地抑制非脂肪组织部位的肿瘤生长（扩展数据图 2c,d ）。因此，PAT 可保护肿瘤免受外源性铁死亡诱导剂和内源性 CD8 + T 细胞介导的铁死亡应激的影响。 鉴于 CD8 + T 细胞来源的干扰素-γ在免疫检查点阻断治疗（ICB）期间可增强肿瘤细胞对铁死亡的敏感性，我们还比较了不同植入部位的抗 PD-1 疗法的疗效。与我们之前的观察结果一致，与皮下肿瘤相比，iWAT 植入的 CRC 肿瘤对抗 PD-1 治疗的反应降低（图 1i、j 和扩展数据图 2e ），同时伴有脂质过氧化作用减弱（图 1k 和扩展数据图 2f ）。与浆膜浸润性肿瘤的脂肪组织嵌入状态一致，与解剖学上与脂肪组织隔室分离的 I 期肿瘤相比，III-IV 期肿瘤中的脂质过氧化信号（4-HNE/MDA）显著减弱（图 1l、m 和扩展数据图 2g、h ）。总的来说，这些结果表明 PAT 赋予癌细胞对铁死亡的抵抗力，从而损害抗肿瘤免疫并降低免疫检查点疗法的疗效。 PAT 通过铁蛋白介导的铁螯合赋予肿瘤细胞铁死亡抵抗力 # 由于 PAT 介导肿瘤细胞的铁死亡抵抗，我们推测 PAT 分泌保护因子。为了验证这一假设，我们建立了脂肪来源条件培养基（脂肪-CM）检测方法进行体外验证（图 2a ）。脂肪-CM 显著减弱了 RAS 选择性致死因子 3（RSL-3）诱导的人 CRC 细胞（图 2b、c 和扩展数据图 3a ）和小鼠 MC38 细胞（扩展数据图 3b、c ）中的脂质过氧化和铁死亡。尽管维生素 E 和线粒体外辅酶 Q10（CoQ10）等抗氧化剂可以抑制铁死亡 25,26 ，但它们在脂肪相关肿瘤中的水平并未改变（扩展数据图 3d、e ）。为了系统地阐明 PAT 促进铁死亡抵抗的机制，我们进行了定量蛋白质组学分析，发现与对照组相比，用脂肪条件培养基（adipose-CM）培养的肿瘤细胞表现出独特的蛋白质组学特征（图 2d 和补充表 1 ）。值得注意的是，在脂肪条件培养基处理的细胞中，FTH1 和 FTL 均显著上调（图 2e ），而其他核心铁死亡调节因子保持不变（扩展数据图 3f ）。免疫印迹实验证实了 FTH1/FTL 的选择性诱导，而其他铁相关蛋白（图 2f ）或细胞内谷胱甘肽（GSH）水平（扩展数据图 3g ）并未发生改变，表明这是一种以铁蛋白上调为中心的 GSH 非依赖性机制。 图 2：PAT 通过铁蛋白介导的铁螯合赋予肿瘤细胞铁死亡抵抗力。 铁蛋白通常会因补铁而上调。然而，FerroOrange 染色显示，脂肪条件培养基（faipose-CM）处理的细胞内 Fe²⁺ 水平降低（图 2g 和扩展数据图 3h ），表明铁蛋白的增加并非由于铁的积累。FTH1 和 FTL 的双重敲低减弱了这种 Fe²⁺的 消耗，并消除了脂肪条件培养基对 DLD1 和 HCT116 细胞中 RSL-3 诱导的铁死亡的保护作用（图 2h-j 和扩展数据图 3i-l ），表明铁蛋白对于脂肪条件培养基介导的细胞保护作用至关重要。 为了在体内验证这一结果，我们建立了 mCherry 标记的 MC38 肿瘤模型，并进行了后续分析（扩展数据图 3m ）。与皮下肿瘤相比，来自脂肪丰富的腹股沟部位的 MC38 肿瘤细胞表现出更高的 FTH1/FTL 表达、更低的细胞内 Fe²⁺ 水平、更低的脂质过氧化水平和更强的铁死亡抵抗力（图 2k-n ）。腹膜是脂肪丰富的微环境，也是胃肠道转移的常见部位 27,28 。因此，我们通过将 MC38 细胞腹腔注射到 C57BL/6J 小鼠体内，建立了腹膜肿瘤模型。这些肿瘤的 FTH1/FTL 表达高于皮下肿瘤（图 2o ）。值得注意的是，FTH1/FTL 基因敲低抑制了腹膜肿瘤的进展，表现为肿瘤体积和负荷的降低（图 2p，q ），证实了该通路在促进腹膜转移中的病理生理学意义。综上所述，这些结果表明 PAT 通过上调铁蛋白螯合细胞内铁来赋予细胞铁死亡抵抗力。 PAT 建立富含犬尿氨酸的肿瘤微环境，从而提高癌细胞中的铁蛋白水平。 # 基于 PAT 来源因子诱导铁蛋白介导的铁螯合的证据，我们进一步鉴定了导致此效应的成分。脂肪条件培养基（adipose-CM）上调 FTH1/FTL 的活性具有热稳定性，且在 3 kDa 滤膜过滤后仍然存在（图 3a ），表明低分子量代谢物是活性因子。铁蛋白亚基随脂肪条件培养基稀释而减少，证实了浓缩代谢物的诱导作用（扩展数据图 3n ）。代谢组学分析发现，在脂肪条件培养基和 iWAT 移植的 MC38 肿瘤中，KYN 是唯一持续升高的代谢物（图 3b 和补充表 2 ）。值得注意的是，CRC 患者和荷 MC38 肿瘤小鼠的 PAT 条件培养基中分别含有 124 μM 和 97 μM 的 KYN（补充表 3 ）。正如预期的那样，KYN 剂量依赖性地增加了 FTH1/FTL，降低了细胞内 Fe 2+ ，并抑制了 RSL-3 诱导的癌细胞脂质过氧化和铁死亡（图 3c–f ）。 图 3：PAT 建立富含 KYN 的 TME 以提高癌细胞中的铁蛋白。 犬尿氨酸 (KYN) 是色氨酸 (TRP) 的一种代谢产物，其生成受吲哚胺 2,3-双加氧酶 1 (IDO1)/色氨酸 2,3-双加氧酶 2 (TDO2) 的限制 [^29] 为了确定犬尿氨酸（KYN）的分泌是 PAT 特有的还是所有脂肪组织特有的，我们比较了 MC38 荷瘤小鼠的 PAT 与对侧 iWAT（正常白色脂肪组织，WAT），并分析了两种组织样本及其相应的条件培养基。结果显示，PAT 组织及其条件培养基中的 KYN 水平显著升高（图 3n,o ），证实了肿瘤邻近微环境中 KYN 的特异性产生增强。为了鉴定 KYN 的细胞来源，我们对 MC38 iWAT 肿瘤的 PAT 进行了单核 RNA 测序（snRNA-seq）。结果显示，Ido1 在脂肪细胞中高表达，而 Tdo2 在脂肪前体细胞（pACs）和脂肪来源干细胞（ASCs）中高表达（图 3p,q 和补充表 4 ）。由于脂肪细胞、pACs 和 ASCs 共占 PAT 细胞总量的 54.8%（分别为 36%、14.8% 和 4%），我们得出结论，它们是 KYN 产生的主要贡献者。这些发现表明，PAT 建立了一个富含 KYN 的肿瘤微环境 (TME)，从而驱动铁蛋白上调、铁螯合和铁死亡抵抗。总而言之，这些发现表明，PAT 通过建立富含 KYN 的 TME 赋予肿瘤细胞铁死亡抵抗力，该 TME 通过促进铁螯合和上调铁蛋白来抑制铁死亡。 KYN 衍生的 3-HK 是 PAT 介导的肿瘤铁死亡抵抗的原因。 # KYN 会被癌细胞吸收并代谢为下游产物 [^33] （扩展数据图 4a ）。为了确定 KYN 或其代谢产物是否直接调控铁蛋白，我们系统地检测了 TRP-KYN 通路的中间体。其中，KYN、3-HK 和 3-羟基邻氨基苯甲酸 (3-HAA) 被发现能够赋予癌细胞铁死亡抵抗力（扩展数据图 4b ），值得注意的是，它们是两个酶促步骤的连续产物。为了进一步揭示它们的作用，我们通过基因手段抑制了这些代谢步骤。在添加 KYN 的培养基中，敲低将 KYN 转化为 3-HK 的 KYN 单加氧酶 (KMO) 会降低 FTH1/FTL 比值，增加 Fe 2+ 水平，增强脂质过氧化作用，并使细胞对铁死亡更加敏感（图 4a-d 和扩展数据图 4c-f ）。相反，抑制犬尿氨酸酶（KYNU，可将 3-HK 转化为 3-HAA）会增强 KYN 的作用，进一步提高 FTH1/FTL 比值，降低 Fe²⁺ 和脂质过氧化水平，并保护细胞免于死亡（图 4e-h 和扩展数据图 4g-j ）。这些相反的结果强烈表明，3-HK 是驱动铁蛋白积累的关键代谢物。 图 4：KYN 衍生的 3-HK 是 PAT 介导的肿瘤铁死亡抵抗的原因。 持续补充 3-HK 可剂量依赖性地上调 FTH1/FTL 的表达，降低活性铁水平，抑制脂质过氧化，并增强铁死亡抵抗力（图 4i-l 和扩展数据图 4k-n ）。接下来，我们探究 3-HK 调控铁蛋白的机制。由于 3-HK 和 KYN 均不影响 FTH1/FTL mRNA 的表达（扩展数据图 5a ），我们研究了其是否受翻译后调控。脉冲追踪实验表明，3-HK 延缓了 FTH1 的降解，提示其通过抑制铁蛋白的分解来稳定铁蛋白（扩展数据图 5b ）。由于铁蛋白是通过 NCOA4 介导的铁蛋白自噬作用降解的 [^34] ，我们推测 3-HK 通过抑制该过程来稳定铁蛋白。事实上，3-HK 处理降低了癌细胞中溶酶体 Fe²⁺ 的含量（图 4m ）。此外，在 NCOA4 敲除 (KO) 细胞中，3-HK 和 KYN 均未能上调铁蛋白并降低细胞内 Fe²⁺ 含量（图 4n、o 和扩展数据图 5c、d ）。与对照组相比，3-HK 对 RSL-3 的保护作用在 NCOA4 KO 细胞中也减弱（图 4p、q ），证实 NCOA4 对 3-HK 的功能至关重要。值得注意的是，低剂量 3-HK (2.5 μM) 预处理可显著保护 MC38 和 DLD1 对照细胞免于铁死亡。相比之下，在 NCOA4-KO MC38 细胞和 FTH1-KO DLD1 细胞中，低浓度的 3-HK 未能提供保护作用，仅在高浓度（≥20 μM）下观察到部分恢复作用（扩展数据图 5e,f ）。这种高浓度下的部分恢复作用可能归因于 3-HK 的自由基清除抗氧化（RTA）活性。 值得注意的是，即使在高浓度下，3-HK 对铁死亡的保护作用在对照细胞中仍然强于在 NCOA4-KO 或 FTH1-KO 细胞中（扩展数据图 5e,f ）。与此一致的是，KYN 和 3-HK 在低浓度下均仅表现出轻微的 RTA 活性（扩展数据图 5h ）。这些结果表明，在低浓度下，3-HK 的抗铁死亡作用主要依赖于铁蛋白介导的铁代谢调节；而在高浓度下，3-HK 的抗铁死亡作用则源于铁蛋白自噬抑制和 RTA 活性的共同作用。 我们进一步研究了芳烃受体 (AHR) 的参与情况，AHR 是色氨酸 (TRP) 代谢物的主要靶点。结果发现，AHR 敲除 (KO) 并未影响 3-己糖胺 (3-HK) 介导的 FTH1/FTL 上调（扩展数据图 5i ），从而排除了 AHR 的参与。既往研究报道，犬尿氨酸 (KYN) 通路的代谢物可通过激活 NRF2/SLC7A11 抗氧化轴或在高浓度 (50–200 μM) 下直接清除自由基来抵抗铁死亡 [^31] [^35] 。然而，我们发现低剂量 3-HK (5 μM) 可在不改变 SLC7A11 表达的情况下上调 FTH1/FTL 蛋白水平，并且即使在 NRF2 和 SLC7A11 敲除细胞中，其诱导 FTH1/FTL 的能力依然存在（扩展数据图 5j–l ），这表明其作用机制独立于经典的抗氧化通路。此外，3-HK 介导的 FTH1/FTL 上调与 CD44 介导的铁摄取无关（扩展数据图 5m,n ）。综上所述，这些发现揭示了一条代谢物驱动的通路，其中 PAT 衍生的 KYN 在肿瘤细胞内转化为 3-HK，导致 NCOA4 介导的铁蛋白降解受到抑制，铁生物利用度降低，并增强了铁死亡抵抗力。 3-HK 直接结合 NCOA4 并阻断铁蛋白自噬的启动 # 为了进一步阐明 3-HK 如何调控铁蛋白自噬，我们研究了其对 NCOA4 和 FTH1 相互作用的影响，这是启动铁蛋白自噬的关键步骤 12 。免疫荧光（IF）分析显示，3-HK 或 KYN 处理显著降低了肿瘤细胞中 FTH1 和 NCOA4 的共定位（图 5a 和扩展数据图 6a ）。与此一致，免疫沉淀（IP）实验表明，3-HK 减弱了 FTH1 和 NCOA4 之间的结合（图 5b 和扩展数据图 6b ）。值得注意的是，KYNU 敲低同样降低了 FTH1 和 NCOA4 之间的结合，而 KMO 敲低则产生了相反的效果（图 5c ）。此外，我们纯化了全长 NCOA4（NCOA4-fl）和铁蛋白结合域（命名为 NCOA4 383–522 ），并进行了体外下拉实验 36 。结果表明，3-HK 特异性抑制了 FTH1 与 NCOA4 的直接结合，而 KYN 及其下游代谢物 3-HAA 均未表现出此作用（图 5d,e ）。此外，热变性实验表明，3-HK 以剂量依赖的方式稳定 NCOA4，使其免受热变性（图 5f ），提示 3-HK 与 NCOA4 之间存在直接的物理相互作用。正如预期，免疫荧光分析显示，生物素标记的 3-HK 与 NCOA4 在肿瘤细胞中存在共定位（扩展数据图 6c ）。此外，我们的链霉亲和素下拉和 Duolink 邻近连接分析 (PLA) 揭示了 3-HK 和 NCOA4 之间的相互作用（图 5g–i ）。 我们利用表面等离子共振（SPR）和生物层干涉（BLI）技术，进一步表征了 3-HK 与 NCOA4 的直接相互作用，所用样品包括 NCOA4-fl 和 NCOA4 383–522 。结果表明，3-HK 可直接结合 NCOA4 383–522 和 NCOA4-fl，其解离常数分别约为 0.8 μM 和 0.5 μM（图 5j 和扩展数据图 6d–f ）。相比之下，KYN 和 3-HAA 均未检测到与 NCOA4 的结合（图 5k,l ）。综上所述，这些结果表明 3-HK 可直接结合 NCOA4，破坏其与 FTH1 的相互作用，从而抑制铁蛋白自噬。 图 5：3-HK 直接结合 NCOA4 并阻断铁蛋白自噬的启动。 靶向犬尿氨酸（KYN）生物合成可增强 PAT 相关肿瘤对铁死亡和免疫疗法的敏感性。 # 基于我们观察到的 PAT 中 IDO1/TDO2 表达上调，我们假设药理学抑制 IDO1/TDO2 可降低局部 KYN 水平，进而降低肿瘤内 3-HK 和铁蛋白水平。相应地，使用 IDO/TDO 抑制剂（epacadostat 和 LM10）治疗显著降低了 PAT 中的 KYN 水平和肿瘤中的 3-HK 水平（扩展数据图 7a、b ）。免疫印迹实验证实 FTH1、FTL 和 NCOA4 的表达相应下调，这与铁蛋白自噬增强相一致（扩展数据图 7c ）。因此，体内抑制 KYN 通路可有效破坏肿瘤中的铁蛋白积累轴。 接下来，我们评估了靶向 IDO1/TDO2 克服铁死亡抵抗的治疗潜力。在植入 iWAT 的 CT26 肿瘤的 BALB/c 小鼠中，IDO1/TDO2 抑制剂增强了 GPX4 敲低诱导的铁死亡（图 6a、b 和扩展数据图 7d ）。在裸鼠的 DLD1 异种移植瘤中也观察到了类似的增敏作用（图 6c、d 和扩展数据图 7e ）。在邻近 iWAT 的 CRC 患者来源异种移植 (PDX) 模型中，IDO1/TDO2 抑制也使肿瘤对铁死亡诱导剂 IKE 敏感（图 6e、f 和扩展数据图 7f ），这种协同效应在携带 MC38 肿瘤的免疫功能正常的 C57BL/6J 小鼠中得到了进一步证实（图 6g、h 和扩展数据图 7g ）。 图 6：靶向 KYN 生物合成可使 PAT 相关肿瘤对铁死亡和免疫疗法敏感。 由于抗 PD-1 疗法可促进 CD8 + T 细胞介导的铁死亡 [^37] ，我们假设 IDO1/TDO2 抑制剂可增强 PAT 相关肿瘤对抗 PD-1 治疗的敏感性。事实上，虽然抗 PD-1 单药治疗对 iWAT 移植瘤的疗效有限，但 IDO1/TDO2 抑制剂与抗 PD-1 抗体的联合应用可进一步增强肿瘤抑制作用。值得注意的是，Lip-1 可逆转这种增强的抑制作用，证实了铁死亡的参与（图 6i、j 和扩展数据图 7h ）。该联合疗法的益处也在腹膜转移模型中得到验证（图 6k-m 和扩展数据图 7i、j ）。因此，靶向 IDO1/TDO2 有望成为克服铁死亡耐药性并增强富含 PAT 肿瘤免疫疗法疗效的有效策略。 PAT 相关的铁蛋白调节轴与恶性肿瘤和免疫检查点抑制剂（ICB）疗效相关。 # 为了从临床上验证 PAT-铁蛋白轴，我们分析了伴有腹膜转移的胃癌患者的横断面影像数据。与原发肿瘤相比，腹膜病灶对新辅助化疗-免疫疗法的反应较差（图 7a,b ）。在另一队列中，对配对组织标本进行免疫组化分析显示，与原发肿瘤部位相比，腹膜转移灶中 FTH1 和 FTL 的表达显著升高，而脂质过氧化标志物 4-HNE 的水平降低（图 7c,d ）。此外，KMO 高表达 /KYNU 低 表达的特征（反映 3-HK 升高）与结直肠癌和胃癌的晚期和较差的生存率相关（图 7e,f ）。这些结果表明，该轴的激活（图 7g ）会导致富含 PAT 的癌症产生治疗耐药性，并可能作为免疫治疗疗效的预测性生物标志物。 图 7：PAT 相关铁蛋白调节轴与恶性肿瘤和 ICB 反应相关。 讨论 # 脂肪组织在人体内含量丰富，分布于多个部位 [^38] 。临床上，在包括结直肠癌（CRC）、胃癌（GC）、肾细胞癌和腹腔内转移瘤在内的多种恶性肿瘤周围，常观察到周围脂肪组织增生（PAT） 22, 27, 39 ，且与肥胖无关。肥胖目前被认为是一种与代谢紊乱相关的低度慢性炎症状态。已知脂肪细胞通过提供脂肪酸、代谢偶联和分泌脂肪因子来支持肿瘤生长 22, 40, 41 。本研究表明，PAT 通过抑制铁蛋白自噬来抑制肿瘤铁死亡并赋予其免疫抵抗力。我们发现 3-己糖胺（3-HK）是连接犬尿氨酸（KYN）代谢和铁稳态的代谢物，并证实同时抑制 IDO1 和 TDO2 可恢复 PAT 相关肿瘤的铁死亡敏感性，并提高免疫检查点阻断疗法的疗效。 PAT 调控铁死亡的机制尚不明确，既往研究显示其对脂肪细胞的影响存在矛盾 28,42 。本研究发现，PAT 可提高肿瘤微环境（TME）中 L-犬尿氨酸（L-KYN）的水平，进而导致其下游代谢产物 3-己糖胺（3-HK）的细胞内浓度升高。除已知的抗氧化作用外，我们还证实 3-HK 可直接抑制铁蛋白自噬。它能上调铁蛋白水平并消耗活性铁，且该过程独立于 NRF2 或 AHR 31 。尽管 3-HK 在浓度高达 50 μM 时仅表现出微弱的 RTA 活性（参考文献 35 ），但我们发现，低至 5 μM 的 3-HK 即可上调铁蛋白水平并抑制铁死亡。这种保护作用在 FTH1 或 NCOA4 缺陷细胞中消失，证实了抑制铁蛋白自噬是其核心机制。鉴于铁蛋白自噬在释放溶酶体铁以触发铁死亡方面所起的作用 13 ，3-HK 介导的该过程抑制代表了 PAT 赋予铁死亡抵抗力的关键机制。 新出现的证据表明，代谢物不仅作为生物底物发挥作用，而且还作为关键的信号分子，调节细胞过程 [^43] 。例如，果糖-1,6-二磷酸和亮氨酸通过直接结合其调节因子来调节 AMPK 和 mTORC1 信号通路，这两个通路是控制代谢稳态的核心通路 44,45 。最近，有报道称ω-6 亚油酸可以调节 mTORC1 活性 [^46] 。类似地，一些色氨酸代谢物被认为是芳烃受体（AHR）的配体 47,48 。作为延伸，我们的研究表明，3-己糖胺（3-HK）作为铁蛋白自噬和铁稳态的内源性调节因子发挥作用。值得注意的是，细胞铁的可用性通过血红素生物合成影响色氨酸和犬尿氨酸的代谢，因为血红素是 IDO1 和 TDO2 的必需辅因子 49 。这表明铁稳态和 TRP 代谢之间存在双向调节回路，可能由 3-HK 介导。 癌症免疫疗法彻底改变了癌症治疗。然而，相当一部分患者，尤其是患有结直肠癌（CRC）和伴有腹膜转移的胃癌（GC）的患者，对免疫检查点抑制剂（ICB）的反应不佳 50, 51 。我们之前的研究表明，调节肿瘤微环境（TME）可以增强免疫疗法的疗效 52 , 53, 54 。IDO1 曾是一个很有前景的靶点 55 ，但其抑制联合抗 PD-1 疗法在 III 期临床试验中失败 56 ，表明存在其他耐药机制。在本研究中，我们发现 IDO1 和 TDO2 在腹膜转移瘤（PAT）中均高表达，驱动犬尿氨酸（KYN）积累并赋予铁死亡抵抗力。由于铁死亡具有免疫原性，我们的研究结果提示，同时抑制 IDO1 和 TDO2 可能与免疫疗法产生协同作用，从而改善治疗效果。 总之，我们的研究揭示了 PAT 通过上调 3-HK 和抑制铁蛋白自噬来保护肿瘤细胞免于铁死亡并削弱免疫疗法的机制。这些发现加深了我们对 PAT 与抗肿瘤免疫之间机制联系的理解，并凸显了靶向 3-HK 介导的铁调控的治疗潜力。 方法 # 伦理审批 # 患者样本取自中山大学肿瘤防治中心（SYSUCC）。所有样本的采集均获得患者书面知情同意，并符合中山大学肿瘤防治中心医学伦理委员会制定的相关规定。本研究方案已获得中山大学肿瘤防治中心伦理委员会批准（B2024-759-01）。实验参与者的特征详见补充表 5。 所有动物实验均已获得中山大学实验动物伦理委员会批准（编号：L025504202205013），并符合《赫尔辛基宣言》的规定。肿瘤体积上限为 2000 mm³ 或体重的 20%，以先达到者为准。所有肿瘤均低于此上限。达到人道终点的动物立即实施安乐死，所有存活动物在研究结束后均实施安乐死。 细胞培养 # 包括 293T、DLD1、HCT116、A549 和 CT26 在内的细胞系购自美国典型培养物保藏中心（ATCC）。MC38（小鼠结肠腺癌）细胞系购自 iCell Bioscience 公司。代谢物处理实验中使用透析胎牛血清（FBS；Thermo Fisher Scientific 公司）。常规培养中，细胞培养于添加 10% FBS（Wisent 公司）和 1%青霉素-链霉素（Gibco 公司）的 RPMI-1640 培养基或 Dulbecco 改良 Eagle 培养基（DMEM；Gibco 公司），并在 37℃、5% CO₂ 条件下培养。所有细胞在使用前均经支原体检测呈阴性，并通过短串联重复序列聚合酶链式反应（PCR）DNA 分型进行鉴定。 siRNA 转染和稳定细胞系构建 # 寡核苷酸序列，包括引物、RNA 干扰和 CRISPR，详见补充表 7。 靶向人源和鼠源 KMO 和 KYNU 的 siRNA 由擎科生物（北京，中国）合成。siRNA 转染实验采用 Lipofectamine RNAiMAX 转染试剂（Invitrogen），并按照制造商的说明书进行操作。慢病毒颗粒的制备方法为：将 HEK293T 细胞（培养于 T25 培养瓶中）与包装质粒 psPAX2（2.8 μg）、包膜载体 pMD2.G（1.56 μg）和靶质粒（2 μg，包含小向导序列(sg) NCOA4、shSLC7A11、shGPX4 和 sgAHR）共转染，转染试剂为 X-tremeGENE HP（Roche），并按照制造商的说明书进行操作。 60 小时后，收集含有慢病毒的上清液，在 4℃下以 1800 g 离心 10 分钟，并用 0.45 µm 滤膜过滤。将六孔板中汇合度约为 70%的靶细胞用病毒上清液在聚凝胺（8 µg ml⁻¹ ）存在下进行转导。24 小时后，更换病毒培养基，并开始嘌呤霉素筛选。为了进行克隆筛选，将细胞以每孔一个细胞的密度接种于 96 孔板中，并在含有 20% FBS 的培养基中培养 10 天。扩增源自单个细胞的克隆，并通过免疫印迹法进行验证。 脂肪基质制备 # 为了制备人结直肠癌（CRC）肿瘤周围脂肪条件培养基（adipose-CM），将新鲜切除的包含邻近脂肪组织的标本立即转移至含有 5 ml 无血清 RPMI 1640 培养基的无菌试管中。用磷酸盐缓冲液（PBS）洗涤组织 5 次以去除残留血液。使用无菌手术刀片小心分离脂肪组织，随后再用 PBS 洗涤 3 次。将分离的脂肪组织样本置于含有添加 1%（v/v）青霉素-链霉素的无血清 RPMI 1640 培养基的 T25 培养瓶中，在 37℃、5% CO₂ 的加湿培养箱中培养 24 小时。孵育结束后，收集上清液，在 4℃下以 400 g 离心 10 分钟，然后用 0.22 μm 滤膜过滤，以去除细胞碎片和潜在的微生物污染物。对照培养基在相同条件下制备，但不添加脂肪组织，作为基线参考。 对于小鼠肿瘤周围脂肪条件培养基（PAT），从携带皮下 MC38 肿瘤的 C57BL/6J 小鼠的腹股沟白色脂肪组织（iWAT）区域收集 PAT。组织解剖、培养条件以及后续用于细胞实验的稀释步骤均与人脂肪组织的方法相同。在进行后续细胞处理之前，将脂肪条件培养基或对照培养基以 1:3 的比例用常规培养基（1640 或 DMEM，均含 10%胎牛血清）稀释。 对于经 IDO1/TDO 抑制剂处理的脂肪条件培养基（dipose-CM），将皮下接种 MC38 肿瘤的 C57BL/6J 小鼠用 epacadostat 和 LM10 治疗 7 天。从相应小鼠的腹股沟白色脂肪组织（iWAT）区域收集腹膜后脂肪组织（PAT）。组织解剖和后续稀释用于细胞实验的步骤与人脂肪组织的步骤相同，只是在培养条件下添加了 epacadostat 和 LM10。 DPPH 测定 # 按照制造商的说明进行 1,1-二苯基-2-三硝基苯肼自由基（DPPH）测定。简而言之，将 DPPH 溶解于无水乙醇中，配制成 0.1 mM 的溶液。然后向 DPPH 溶液中加入不同浓度的犬尿氨酸（KYN）或 3-己基氨基己酸（3-HK），混合物在室温下孵育 30 分钟。计算 517 nm 处吸光度的降低值，该降低值是自由基清除作用的相对值，并以 PBS 对照组为基准。Trolox（20 μg ml⁻¹ ）作为阳性对照。 胞质辅酶 Q10 测定 # 使用线粒体分离试剂盒（Thermo 89874）获取细胞胞质组分。简而言之，将 3 × 10⁷个 细胞悬浮于线粒体分离试剂中，并在冰上用 Dounce 组织研磨器匀浆，然后在 4℃下以 700 g 离心 10 分钟。将上清液转移至新的离心管中，并在 4℃下以 12,000 g 离心 15 分钟分离胞质组分。使用 BCA 蛋白测定试剂盒测定蛋白浓度。根据制造商的说明，使用 CoQ10 ELISA 试剂盒（Cusabio，CSB E14081h）检测 CoQ10。 定量蛋白质组学分析 # 定量蛋白质组学分析由武汉美特维生物科技有限公司完成。简而言之，用对照培养基或脂肪条件培养基（adipose-CM）处理的 MC38 细胞，使用由 8 M 尿素、1 mM 苯甲基磺酰氟和 2 mM EDTA 组成的裂解缓冲液进行裂解。细胞裂解液在冰上进行超声破碎 5 分钟，然后在 4℃下以 15,000 g 离心 10 分钟以去除不溶性碎片。收集上清液，并使用 BCA 蛋白定量试剂盒（Thermo Fisher Scientific）测定蛋白浓度。随后，将收集的蛋白样品用于蛋白水解脱盐和液相色谱-串联质谱（LC-MS/MS）分析。使用 DIA-NN（版本 1.8.1）在无谱库模式下处理原始数据非依赖性采集（DIA）-MS 数据。利用集成于 DIA-NN 中的深度学习算法进行光谱库构建和肽段鉴定。目标匹配采用包含 54,910 条序列的 UniProtKB 小鼠蛋白质组数据库（uniprotkb_proteome_UP000000589_mouse_54910_20240528.fasta）。启用运行间匹配（MBR）功能，直接从 DIA 数据构建光谱库，提高不同运行间的鉴定一致性。蛋白质和前体水平鉴定的错误发现率均控制在 3%~1%。定量分析基于剩余的高置信度鉴定结果。 脂质过氧化、亚铁离子和谷胱甘肽的测定 # 为进行脂质过氧化分析，在处理前一天将细胞接种于六孔板中。在用指定化合物处理指定时间后，用胰蛋白酶消化收集细胞，并重悬于 200 μl 含有 5 μM C11-BODIPY 581/591（Invitrogen）的 PBS 缓冲液中。在 37 °C 孵育 30 分钟后，使用 Beckman 流式细胞仪在 488/510 nm 激发波长下检测脂质过氧化水平，并使用 FITC 通道检测荧光信号。数据采用 CytExpert 2.4 软件进行分析。 采用铁离子检测试剂盒（Invitrogen）并按照制造商说明书定量测定亚铁离子（ Fe²⁺ ）水平。或者，使用 FerroOrange 染料（Dojindo）评估细胞内 Fe²⁺ 水平，并通过共聚焦显微镜（LSM880，配备 Fast Airyscan，Carl Zeiss）进行观察，或使用 Beckman 流式细胞仪进行分析。此外，采用 GSH-Glo 谷胱甘肽检测试剂盒（Promega）并按照制造商说明书测定细胞内 GSH 含量。 细胞活力检测 # 采用 CellTiter 96 AQueous One Solution 细胞增殖检测试剂盒 (MTS; Promega) 评估细胞活力。将细胞以每孔 2000 个细胞的密度接种于 96 孔透明底板中，培养基中添加或不添加指定代谢物。次日，用铁死亡诱导剂（包括 RSL-3 和 erastin）以及细胞死亡抑制剂（例如 liproxstatin）处理细胞。处理 48 小时后，向每孔（含 200 μl 培养基）中加入 20 μl MTS 试剂，并在 37 °C、5% CO₂ 气氛下孵育 1 小时。使用 Synergy 多功能酶标仪 (BioTek) 测量 490 nm 处的吸光度，并将细胞活力表示为相对于未处理对照组的相对值。 免疫印迹、免疫沉淀、免疫组化和免疫荧光分析 # 按照先前报道的标准程序进行免疫印迹和 IP 分析 [^21] [^52] [^53] 。使用 RIPA 或 NP-40 裂解缓冲液从培养细胞或组织中提取蛋白质，并使用 BCA 蛋白质测定试剂盒（Thermo Fisher Scientific）定量蛋白质浓度。等量的蛋白质样品经十二烷基硫酸钠-聚丙烯酰胺凝胶电泳 (SDS-PAGE) 分离后，使用相应的抗体进行免疫印迹分析，这些抗体包括：GPX4 (1:1000, ab125066, Abcam)、FTH1 (1:1000, 4393S, Cell Signaling Technology)、FTL (1:1000, ab109373, Abcam)、SLC7A11 (1:1000, 12691S, Cell Signaling Technology)、TFRC (1:1000, ab214039, Abcam)、FPN (1:1000, 26601-1-AP, Proteintech)、IRP2 (1:1000, 29916-1-AP, Proteintech)、微管蛋白 (1:1000, 2125S, Cell Signaling Technology) 和 NCOA4。 （1:1,000，ab314553，Abcam），KYNU（1:1,000，ab320833，Abcam），KMO（1:500，MAB8050，R\u0026D Systems），AHR（1:1,000，ab309491，Abcam），NRF2（1:2,500，ab137550，Abcam）和β-肌动蛋白（1:1,000，4970S，Cell Signaling Technology）。 对于免疫沉淀分析，将细胞置于冰上，用含有蛋白酶抑制剂的裂解缓冲液（20 mM Tris，pH 7.5，150 mM NaCl 和 1% Triton X-100）裂解 10 分钟，然后在 4 °C 下以 12,000 g 离心 15 分钟。将上清液转移至新的离心管中，并与一抗（NCOA4，1:100，ab314553，Abcam）在 4 °C 下孵育过夜，随后在相同温度下与 Protein A/G 磁珠孵育 4 小时。之后使用磁力架收集磁珠，并弃去上清液。加入 1 ml 洗涤缓冲液（25 mM Tris，pH 7.5，150 mM NaCl 和 0.05% Tween-20）后，将磁珠充分重悬，然后用磁力架再次收集磁珠，并弃去上清液。重复此洗涤步骤两次。最后，将磁珠在 SDS-PAGE 上样缓冲液（50 mM Tris，pH 6.8，20 mM 二硫苏糖醇，1% SDS，10%甘油和 0.1%溴酚蓝）中煮沸。 免疫组化（IHC）按先前描述的方法进行 [^21] [^53] 。石蜡包埋的组织切片经二甲苯脱蜡，并用梯度乙醇溶液复水。在柠檬酸缓冲液（pH 6）中，于 121℃下进行 10 分钟的热介导抗原修复。修复后，切片在室温下冷却 1 小时，然后用 3% H 2 O 2 处理 10 分钟以阻断内源性过氧化物酶活性。随后，切片在室温下用 QuickBlock 封闭缓冲液（碧云天）封闭 30 分钟。之后，切片与抗 4-HNE 抗体（Abcam，货号 ab46545）以 1:100 的比例用抗体稀释液（Dako）稀释，并在 4℃下孵育过夜。用 PBS 洗涤 5 次后，将切片与 Dako REAL EnVision/HRP（兔/鼠）抗体在室温下孵育 45 分钟，最后用 Dako REAL DAB 显色。其他使用的主要抗体包括 FTH1（4393S，Cell Signaling Technology）、FTL（ab109373，Abcam）和 MDA（1:100，JAIMMD030，AdipoGen Life Sciences）。两位独立的病理学家对染色切片进行评估。通过将阳性染色肿瘤细胞的百分比（0-100%）乘以染色强度（0-3 级）计算综合组织学评分。免疫荧光染色按先前报道的方法进行 21 。 对于免疫荧光分析，MC38 和 DLD1 细胞按照标准流程进行固定和染色，使用针对 KYN（IS003，ImmuSmol）、NCOA4（ab314553，Abcam）和 FTH1（ab75973，Abcam）的一抗，随后与荧光染料标记的二抗孵育，并用 4′,6-二脒基-2-苯基吲哚 (DAPI) 进行复染。使用配备 Fast Airyscan（Carl Zeiss）的 LSM880 显微镜采集图像。 Duolink 原位 PLA # 采用 Duolink 原位 PLA 试剂盒（Sigma-Aldrich）进行 PLA 检测。简而言之，将 DLD1 和 MC38 细胞固定后，按照制造商的建议，与一抗（1:100 稀释）、二抗和 DAPI 孵育。使用 594 nm 荧光标记检测试剂盒检测阳性反应。只有当两个抗原之间的距离小于 40 nm 时，PLA+ 和 PLA- 探针之间的杂交才会产生荧光信号。使用配备 Fast Airyscan 的 LSM880（ZEISS）扫描电子显微镜获取细胞图像。 RNA 分离和定量 PCR 分析 # 根据制造商说明，使用 TRIzol 试剂（Invitrogen）提取总 RNA。使用 PrimeScript RT Master Mix Kit（Takara）以 1 μg RNA 为模板合成互补 DNA (cDNA)。使用 GoTaq qPCR Master Mix（Promega）进行定量实时 PCR。基因表达水平以 β-actin 为内参进行标准化，并使用 2 -ΔΔCt 法计算相对定量值。 基于液相色谱-质谱联用技术的代谢组学分析 # 根据先前描述的方法，并稍作修改 [^52] [^57] ，对全面的非靶向代谢物进行了分析。简而言之，将储存在−80 °C 的样品置于冰上解冻，并涡旋振荡 10 秒。亲水性和疏水性化合物的提取分别使用提取溶剂 A（乙腈：甲醇 = 1:4，v/v）或提取溶剂 B（甲基叔丁基醚：甲醇 = 3:1，v/v），每种溶剂均含有内标（IS）。样品提取物采用液相色谱-电喷雾电离（ESI）-串联质谱（LC-MS/MS）系统（UPLC，ExionLC AD；MS，QTRAP6500+系统）进行分析。使用配备 ESI Turbo IonSpray 接口的 QQQ-LIT 质谱仪 (QTRAP) 和 QTRAP LC-MS/MS 系统，在正负离子模式下运行，并由 Analyst 1.6.3 软件 (Sciex) 控制，采集线性离子阱 (LIT) 和三重四极杆 (QQQ) 扫描数据。根据每个时间段内洗脱的代谢物，监测一组特定的多反应监测 (MRM) 转换。 按照先前研究 58 所述的方法，通过离心法获得肿瘤间质液（TIF）。简而言之，将荷瘤小鼠安乐死，并在 2 分钟内迅速解剖肿瘤。切除的肿瘤称重，用生理盐水快速冲洗，并用滤纸吸干水分。整个预处理过程大约在 2 分钟内完成。然后将肿瘤置于装有 20 mm 尼龙网（Merck Millipore）的 50 ml 锥形管中，并在 4 °C 下以 106 g 离心 10 分钟。收集在锥形管中的 TIF 立即用液氮速冻，并储存在−80 °C 直至进一步分析。然后，取 50 μl 样品用 250 μl 甲醇提取，并向提取液中加入 10 μl 内标混合溶液（250 ng ml −1 ）作为定量分析的内标。将提取物涡旋振荡 3 分钟，然后在−20 °C 下保存 30 分钟，于 4 °C 下以 12,000 转/分钟离心 10 分钟，收集 150 μl 上清液。将上清液再次于 4 °C 下以 12,000 转 / 分钟离心 5 分钟，取 100 μl 上清液，使用 LC-ESI-MS/MS 系统（UPLC，ExionLC AD；MS，QTRAP 6500+系统）进行分析。使用配备 ESI Turbo IonSpray 接口的 QTRAP 6500+ LC-MS/MS 系统（QTRAP 6500+ LC-MS/MS 系统）采集 LIT 和 QQQ 扫描数据，该系统可在正负离子模式下运行，并由 Analyst 1.6.3 软件（Sciex）控制。采用预设多反应监测（MRM）方法分析色氨酸（TRP）及其代谢物。数据采集使用 Analyst 1.6.3 软件（Sciex 公司）完成。所有代谢物的定量分析均使用 Multiquant 3.0.3 软件（Sciex 公司）进行。 在进一步优化去簇电压 (DP) 和碰撞能量 (CE) 后，设定了质谱仪参数，包括各个 MRM 转换的去簇电压 (DP) 和碰撞能量 (CE)。根据每个时间段内洗脱的代谢物，监测一组特定的 MRM 转换。所有代谢组学分析均由武汉美特维生物科技有限公司完成。 使用 HPG 的脉冲追踪分析 # HEK293T 和 MC38 细胞汇合度达到 80% 时，用预热的 PBS 洗涤两次，然后在添加 10% 透析 FBS 的 DMEM 培养基中进行甲硫氨酸饥饿处理 1 小时。饥饿处理后，向培养基中加入 2 mM L- 高丙炔基甘氨酸 (L-HPG) 进行 4 小时的脉冲标记。随后，细胞再次用预热的 PBS 洗涤两次，并更换为含 10% FBS 的 DMEM 培养基。在指定时间点（0、2、4、6、12 和 24 小时）收集细胞，并在冰上用含有蛋白酶抑制剂的裂解缓冲液（20 mM Tris，pH 7.5，150 mM NaCl 和 1% Triton X-100）裂解 10 分钟，然后在 4°C 下以 12,000 g 离心 15 分钟。将上清液转移至新的离心管中，并使用与 Protein A/G 磁珠偶联的抗 FTH1 抗体进行免疫沉淀（IP）。然后，根据制造商的方案（Click-\u0026-Go Click Chemistry Reaction Buffer Kit），通过铜催化的点击反应，用生物素炔烃对 HPG 标记的 FTH1 蛋白进行生物素化。磁珠用洗涤缓冲液（25 mM Tris，pH 7.5，150 mM NaCl 和 0.05% Tween-20）洗涤三次，并在 SDS-PAGE 上样缓冲液中煮沸。使用 HRP 标记的抗生物素抗体，通过 Western blot 分析检测生物素化的 FTH1 蛋白。 体外下拉实验 # 纯化的 Flag-NCOA4-fl 或 His-NCOA4 383–522 蛋白与指定代谢物（10 μM）预孵育，随后在 4 °C 下与纯化的铁蛋白在抗 Flag 磁珠或 Ni-NTA 琼脂糖珠存在下孵育过夜。磁珠用洗涤缓冲液洗涤六次，结合的蛋白用 SDS 上样缓冲液洗脱。洗脱的样品通过免疫印迹法进行分析。 SPR 检测 # 使用配备 CM7 传感器芯片（GE Healthcare）的 Biacore T200 系统，在 25 °C 下评估 NCOA4 蛋白与代谢物（3-HK、 L -KYN 或 3-HAA）之间的结合亲和力。所有测量均重复三次。数据分析采用 Biacore T200 评估软件（版本 2.0），并按照制造商的说明进行操作。CM7 传感器芯片用 200 µM 1-乙基-3-(3-二甲氨基丙基)碳二亚胺和 50 µM N- 羟基琥珀酰亚胺 (NHS) 的混合溶液以 10 µl min⁻¹ 的流速激活 10 分钟。随后，将 30 µl 纯化的 NCOA4 蛋白（如上所述）预先用 150 µl 10 mM 乙酸钠缓冲液（pH 4.5）调节至 pH 4.5，并以 10 µl min⁻¹ 的流速注入流动池，持续 5 分钟，重复 3 个循环。封闭步骤使用 1 M 乙醇胺，流速为 10 µl min⁻¹， 持续 10 分钟。参考通道的制备方法与激活和封闭步骤相同，只是用 PBS 缓冲液（pH 4.0）代替蛋白溶液。两个流动池均用 PBS 缓冲液平衡。将 3-HK、L-KYN 和 3-HAA（浓度均为 1 mM）的储备液用 PBS 缓冲液进行系列稀释，浓度范围为 0 至 20 µM，并以 30 µl min⁻¹的 流速注入流动池，持续 180 秒。使用 Biacore T200 控制软件（版本 2.0）记录传感图，并从实验通道中减去参考池的响应值。通过将数据全局拟合到 1:1 Langmuir 结合模型，得出结合动力学和亲和力参数（缔合常数和解离常数）。 变得 # 使用 EZ-Link Sulfo-NHS-LC-Biotinylation Kit（Thermo）对全长 NCOA4 (NCOA4-fl) 蛋白进行生物素化，随后使用 Zeba Spin 脱盐柱将其置换为 PBS 缓冲液。在 Octet Red 96 系统（ForteBio）上，于标准条件下（30 °C，1000 rpm 振荡）以 2.0 Hz 的信号采集频率进行生物发光成像 (BLI)。平衡 10 分钟后，分别使用 Ni-NTA 和 Super Streptavidin 生物传感器（Sartorius）将 His-NCOA 4383–522 或生物素化的 NCOA4-fl 蛋白固定在传感器尖端。然后引入一系列用 PBS 稀释的 3-HK 浓度，使其与固定化的蛋白结合。所有原始传感器图均进行基线校准，并通过将数据拟合到 1:1 结合模型来计算动力学参数。使用 Octet Analysis Studio 11.0 软件处理数据并生成曲线。 蛋白质表达、纯化和验证 # 将编码 His 标签 NCOA4 的质粒 (pET28a-His-NCOA4 383–522 ) 转化至 大肠杆菌 BL21 (DE3) 感受态细胞中。在 30 °C 下用 0.5 mM 异丙基-β- D- 硫代半乳糖苷 (IPTG) 诱导蛋白表达 24 小时。收集细胞并超声破碎，然后用 Ni-NTA 树脂 (GenScript) 在 4 °C 下纯化 His 标签蛋白 4 小时。用含有 50 mM Tris-HCl (pH 8.0)、300 mM NaCl 和 20 mM 咪唑的缓冲液洗涤树脂，直至吸光度恢复至基线水平。最后，用相同缓冲液中的咪唑梯度 (0–250 mM) 进行洗脱。蛋白质经ÄKTA FPLC 系统（Cytiva）上的 Superdex 200 Increase 10/300 GL 柱进一步纯化，随后使用 Amicon Ultra-4 超滤离心管（Millipore）在 PBS 缓冲液中进行浓缩和脱盐。蛋白质浓度采用 BCA 蛋白定量试剂盒（Thermo Fisher Scientific）测定。 为了表达 Flag 标签蛋白，将 pcDNA3.1-Flag-NCOA4 质粒转染至 HEK293F 细胞。48 小时后，裂解细胞，并使用抗 Flag 磁珠对 Flag-NCOA4 蛋白进行免疫沉淀。磁珠用含有 136.89 mM NaCl、2.67 mM KCl、8.1 mM Na₂HPO₄ 、1.76 mM KH₂PO₄ 和 0.5% Tween- 20 的 洗涤缓冲液洗涤 6 次。结合的蛋白用含有 50 mM Tris-HCl（pH 7.4）、150 mM NaCl 和 300 μg / ml Flag 肽的洗脱缓冲液洗脱。随后去除 Flag 肽，并使用 Amicon Ultra-0.5 超滤离心管（Millipore）浓缩蛋白。使用 BCA 蛋白测定试剂盒再次测定蛋白浓度。 热位移分析 # 收集细胞，并用液氮和室温水进行三次冻融循环裂解细胞。裂解液以 15,000 g 离心 15 分钟，取上清液。将所得裂解液分别与 PBS 或 3-HK（5 µM）在室温下孵育 60 分钟。通过将样品暴露于一系列递增的温度下 5 分钟来评估蛋白质的热稳定性。冷却至室温后，进行 Western blot 分析，以评估配体结合后蛋白质稳定性的变化。 抗体介导的 CD8 + T 细胞清除 # 在 iWAT 模型中，为了清除 CD8 + T 细胞，对 C57BL/6J 小鼠进行六次腹腔注射，注射物为抗 CD8a 抗体（BioXCell）或同型对照抗体（BioXCell）。治疗方案包括：第 1 天注射 300 μg 初始剂量，随后在肿瘤植入后的第 4、8、12 和 16 天分别注射 200 μg，共注射五次。为了评估 CD8 + T 细胞清除的有效性，分别在第 3、10 和 18 天通过眼眶后静脉丛取血，并使用针对非重叠 CD8 表位的抗体（BioLegend）进行流式细胞术分析。 OT-1 CD8 + T 细胞的获取和过继转移模型 # 将 OT-1 小鼠脾脏中的 OT-1 CD8 + T 细胞通过机械分离法分离，分离方法为：使用 40 μm 细胞筛在 6 cm 培养皿中进行细胞分离，然后用磁激活细胞分选缓冲液洗涤两次。离心后，将细胞沉淀重悬于红细胞裂解缓冲液（Sigma-Aldrich）中，孵育 5 分钟以裂解红细胞。纯化的 OT-1 CD8 + T 细胞随后在添加了 IL-2（10 ng ml -1 ，212-12，PeproTech）、T-Select H-2KαOVA 四聚体（Medical \u0026 Biological Laboratories）和β-巯基乙醇（100 mM，M3148，Sigma-Aldrich）的 DMEM 培养基中培养 3-5 天。在 iWAT 肿瘤模型的过继转移实验中，将 1 × 10⁶ 个 MC38-OVA 肿瘤细胞接种到 Rag2 −/− 小鼠体内。肿瘤移植 7 天后，通过尾静脉注射向这些小鼠全身性输注 1 × 10⁶个 OT-1 CD8 + T 细胞。 小鼠 PAT 样品制备和铬单细胞基因表达 Flex # 将 MC38 肿瘤细胞植入 C57BL/6 小鼠的腹股沟白色脂肪组织（iWAT）附近，使其生长至约 300–400 mm³ 。随后从四只小鼠中采集腹股沟脂肪组织（PAT）样本，并按照制造商的说明，使用 Chromium 单细胞基因表达 Flex 平台（10x Genomics）进行处理。该服务由广州源鑫生物科技有限公司提供。简而言之，在组织解离和细胞核分离后，按照 10x Genomics 细胞和细胞核固定方案（ CG000478 ）固定细胞核。使用 LUNA 双荧光细胞计数器（Logos Biosystems）间歇性地评估细胞核浓度和完整性。探针杂交后，根据 10x Genomics Chromium 固定 RNA 分析多重样本混合工作手册（修订版 B， CG000565 ），对带有唯一条形码的样本进行定量，并按等量细胞核进行混合。将混合的细胞核洗涤后，每个样本选取约 20,000 个细胞核，使用 Chip Q 将其分离到凝胶珠乳液 (GEM) 中。后续步骤包括 GEM 条形码标记、GEM 回收、cDNA 预扩增和文库构建，具体步骤参见用户指南 ( CG000527 )。文库在 Illumina NovaSeqX 平台上进行测序，采用双端双索引测序，每个样本的测序深度约为 3 亿条 reads，读长为 2 × 150 bp。使用 bcl2fastq (Illumina) 对测序文库进行解复用，并将 FASTQ 文件使用 Cell Ranger v7.1.0 多流程 (10x Genomics) 进行处理，比对至 GRCh38-2020-A 参考基因组。 PDX 型号 # PDX 模型的建立方法与之前描述的方法略有不同 [^59] 。新鲜切除的人类结直肠癌（CRC）标本在无菌条件下被解剖成 1-2 mm 3 的肿瘤碎片。每个 PDX 肿瘤碎片均通过手术植入 NOD-scid IL2rgamma (NSG)小鼠的腹腔白色脂肪组织（iWAT）中。当肿瘤体积达到 50-100 mm 3 时，将小鼠随机分配到四个治疗组之一：载体组、IKE 组（30 mg kg -1 ，腹腔注射，每日一次）、LM10 组（200 mg kg -1 ，口服，每日一次）、epacadostat 组（300 mg kg -1 ，口服，每日一次）或上述治疗的组合组。使用数字游标卡尺持续监测肿瘤生长，并追踪肿瘤体积随时间的变化。 实验动物 # 雌性 OT-1、C57BL/6J 和 BALB/c 小鼠（6-8 周龄）、NSG 小鼠和 Rag1 -/- 小鼠（5-6 周龄）均购自吉姆制药科技公司（GemPharmaTech）。BALB/c 裸鼠购自北京维通利华实验动物技术有限公司。所有动物实验均经中山大学肿瘤防治中心实验动物伦理委员会批准。小鼠饲养于温度控制的 SPF 级动物房内，光照/黑暗周期为 12 小时。所有实验操作均按照中山大学肿瘤防治中心实验动物伦理委员会批准的研究方案（L025504202205013）进行。 小鼠肿瘤模型 # 对于非脂肪组织和腹股沟白色脂肪组织（iWAT）肿瘤模型，将 MC38 细胞（2 × 10⁶ ）、 DLD1 细胞（2 × 10⁶）或 CT26 细胞（1 × 10⁶ ）悬浮于 100 μl PBS 中，皮下注射至 C57BL/6J、BALB/c 裸鼠或 BALB/c 小鼠的背部，以构建第一代细胞来源的异种移植瘤。当肿瘤体积达到 300–400 mm³ 时收集肿瘤，并将其切碎成 1–2 mm³ 的碎片。然后将这些细胞来源的异种移植瘤碎片在麻醉状态下皮下接种至指定小鼠的背部中部或腹股沟白色脂肪组织区域。当肿瘤体积达到 50–100 mm³ 时，将小鼠随机分配到不同的治疗组进行指定的治疗。使用游标卡尺常规测量肿瘤大小，并使用以下公式计算肿瘤体积：体积（ mm³ ）= 0.5 ×（长径 × 短径 ² ）。 在体内铁死亡诱导模型中，将经 shNC（阴性对照）或 shGPX4（强力霉素诱导型）处理的 DLD1 细胞来源肿瘤植入 BALB/c 裸鼠的中背部或腹股沟白色脂肪组织（iWAT）区域。植入三天后，将小鼠随机分组，并在饮用水中添加强力霉素（1 mg ml⁻¹ ，HY-N0565，MedChemExpress）。同样，将 MC38 细胞来源肿瘤植入 C57BL/6J 小鼠的中背部或腹股沟白色脂肪组织（iWAT）区域。当肿瘤体积达到 50–100 mm³ 时，将小鼠随机分组，分别接受 IKE（30 mg kg⁻¹ ，腹腔注射，每日一次，S7242，Selleckchem）或抗 PD-1 抗体（每只小鼠 100 μg，BE0146，BioXCell）治疗。 IKE 的制备方法如下：首先配制浓度为 60 mg/ ml 的二甲基亚砜（DMSO）储备液，然后用 DMSO：蓖麻油（乙氧基化）：生理盐水按 1:1:8 的比例稀释，得到工作液。对照组仅注射溶剂。每只小鼠腹腔注射 100 μg 抗 PD-1 抗体或 IgG，每 3 天一次，共注射 3 次。使用数字游标卡尺持续监测肿瘤生长情况，并追踪肿瘤体积随时间的变化。 对于采用 IDO/TDO 抑制剂给药的 iWAT 模型，TDO2 抑制剂 LM10（200 mg kg⁻¹ ，口服，HY-33298，MedChemExpress）和 IDO1 抑制剂 epacadostat（300 mg kg⁻¹ ，口服，HY-15689，MedChemExpress）悬浮于 0.5%羧甲基纤维素钠溶液中，每日经口灌胃给药。Lip-1（10 mg kg⁻¹ ，每日一次，HY-12726，MedChemExpress）于第 0 天开始腹腔注射给药。IKE 或抗 PD-1 的给药方案与上述相同。 在腹膜转移模型中，将 MC38 细胞（5 × 10⁵ ）腹腔注射到小鼠体内。从细胞注射后第 0 天开始，腹腔注射 Lip-1（10 mg / kg，每日一次）。从细胞注射后第 3 天开始，通过灌胃给予 Epacadostat（300 mg/kg， 每日 一次）和 LM10（200 mg / kg，每日一次）。从第 7 天开始，每 3 天腹腔注射一次抗 PD-1 抗体（每只小鼠 100 μg），共注射三次。采用体内成像技术评估肿瘤负荷。 统计学和可重复性 # 本研究未进行正式的功效分析来确定样本量。我们的样本量是根据既往研究 [^21] 中使用的样本量选择的。在实验和结果评估过程中，研究人员并未对分组情况进行盲法处理。在动物实验中，除非另有说明，小鼠均被随机分配到实验组。所有数据均纳入分析，未排除任何数据。数据以均值±标准差（SD）表示。每个实验均进行了三次独立的生物学重复。实验重复次数、 P 值和检验方法详见图表或图例。两组间的比较采用双侧非配对 t 检验或双侧配对 t 检验。≥3 个独立组间的两两比较采用单因素方差分析（ANOVA）和 Tukey 事后多重比较检验。对于肿瘤生长曲线组，两两比较采用双因素方差分析和 Tukey 事后多重比较检验。采用 Kaplan - Meier 法估计生存函数，并使用 log-rank 检验比较不同组的生存分布。统计分析使用 GraphPad 10.0 版软件进行。P 值小于 0.05 表示具有统计学意义。所有统计检验均为双侧检验。所有实验均重复至少三次（除非另有说明），且结果一致。 报告摘要 # 有关研究设计的更多信息，请参阅本文链接的《 自然投资组合报告摘要》 。 数据可用性 # Details of the primer sequences, siRNA, short hairpin RNA and plasmids are provided in Supplementary Table 7 . Detailed information on the antibodies used is listed in Supplementary Table 6 . All other data supporting the findings of this study are available from the corresponding author on reasonable request. snRNA-seq data of PAT from MC38 iWAT tumours are available via Zenodo at https://doi.org/10.5281/zenodo.18426113 (ref. [^60]). Source data are provided with this paper. 代码可用性 # 本研究未生成任何自定义代码或程序。本研究中使用的所有软件和软件包均在 “方法”部分 进行了详细描述。 参考 # 致谢 # 本研究得到了国家重点研发计划（项目编号：2022YFA1105300）、国家自然科学基金（项目编号：82341010、82372920、82403325 和 82403440）、深圳市三名工程（项目编号：SZS
