ystematic benchmarking demonstrated that GLUE is more accurate, robust and scalable than state-of-the-art tools for heterogeneous single-cell multi-omics data. We applied GLUE to various challenging tasks, including triple-omics integration, integrative regulatory inference and multi-omics human cell atlas construction over millions of cells, where GLUE was able to correct previous annotations. GLUE features a modular design that can be flexibly extended and enhanced for new analysis tasks. The full package is available online at https://github.com/gao-lab/GLUE.","body":"本文献笔记由网页剪藏扩展整理而来；原始剪藏见 02 文献精读与汇报库/01_sources/papers/web_clips/Multi-omics single-cell data integration and regulatory inference with graph-linked embedding 。 中文标题 # 基于图关联统一嵌入的单细胞多组学数据整合与调控推断 中文摘要 # 尽管单细胞中同步测量多种组学模态的实验方法已经出现，但大多数单细胞数据集仍仅包含单一模态。整合多模态组学数据的主要障碍在于，不同组学层通常具有不同的特征空间。本文提出计算框架 GLUE（graph-linked unified embedding，图关联统一嵌入），通过显式建模跨组学层的调控相互作用来弥合这一差距。系统基准测试表明，在异构单细胞多组学数据整合方面，GLUE 比现有最先进方法更准确、更稳健且更具可扩展性。作者将 GLUE 应用于三组学整合、整合式调控推断以及数百万细胞规模的多组学人类细胞图谱构建等多种挑战性任务，并显示其能够纠正既有注释。GLUE 采用模块化设计，可灵活扩展和增强以适应新的分析任务。完整软件包已公开发布于 https://github.com/gao-lab/GLUE。该工作表明，通过建模调控相互作用，可以在图谱级尺度上实现不同单细胞数据模态的整合。 一、背景与研究意义 # 研究背景 # 单细胞组学技术已经从单一转录组测量，扩展到染色质可及性、DNA 甲基化以及多模态联合测量。现实问题在于：绝大多数公开数据仍是 非配对 的单模态数据，不同模态之间既没有一一对应的细胞，也缺乏统一的特征空间。比如 scRNA-seq 的特征是基因表达，而 scATAC-seq 的特征是开放染色质区域，直接对齐难度很高。 已有方法通常走两条路线：一是把不同模态强行转换到同一特征空间，再做整合；二是用流形对齐或矩阵分解实现间接匹配。但前者容易损失信息，后者往往难以扩展到三种及以上组学层，或难以处理百万细胞级别的数据。 科学问题 # 如何在不同组学层特征空间不一致的前提下，稳定整合非配对单细胞多组学数据？ 如何把先验调控知识真正纳入整合过程，而不仅仅作为预处理映射规则？ 如何在完成跨模态整合的同时，进一步做调控关系推断与 atlas 级别扩展？ 二、研究思路（技术路线） # 作者提出 GLUE（graph-linked unified embedding）框架，核心思想是把“ 指导图（guidance graph） ”作为跨组学桥梁，把不同模态的特征连接到同一个图结构中，再联合学习特征嵌入和细胞嵌入。 技术路线可概括为： 为每一种组学分别建立一个自编码器，保留各自数据分布特性。 构建指导图，把基因、ATAC peak、DNA 甲基化特征等通过先验调控关系连接起来。 通过图自编码器学习特征嵌入，再通过对抗对齐让不同组学中的细胞嵌入进入同一潜在空间。 在统一嵌入空间中做跨模态对齐、标签转移、调控评分估计与 atlas 级分析。 作者随后用 5 个层面的证据验证该框架： 框架设计本身是否合理； 在多套标准数据上的基准表现是否优于现有方法； 是否能扩展到三组学整合； 是否能用于顺式调控推断； 是否能扩展到百万细胞级图谱整合。 三、主要结果 # Result 1 | GLUE 通过“指导图 + 统一嵌入”解决非配对多组学整合问题 # 核心发现： GLUE 将不同组学的特征先映射到图结构，再联合学习特征嵌入与细胞嵌入，从而避免了简单特征转换导致的信息损失，也为后续调控推断保留了结构基础。 主要证据： 每个组学层使用独立的变分自编码器，适配各自特征空间和数据分布。 指导图中的节点对应不同组学特征，边表示跨层调控关系，如“ATAC peak—gene”或“甲基化—gene”。 细胞嵌入通过对抗判别器进行跨模态对齐，保证不同组学中的相同细胞状态落入相近潜在空间。 方法价值： 该设计把“先验调控知识”从预处理阶段推进到了模型主体中，是 GLUE 区别于普通整合算法的关键。 图注： Figure 1. GLUE 框架示意图。图中展示了指导图、不同组学专属编码器/解码器、特征嵌入、细胞嵌入，以及用于跨模态对齐的判别器共同组成统一学习框架。 Result 2 | GLUE 在系统基准测试中兼具准确性、鲁棒性和可扩展性 # 核心发现： 在多个配对与非配对 scRNA-seq / scATAC-seq 数据集上，GLUE 在生物学保留、组学混合和单细胞配对精度三个维度都优于多种主流方法。 主要证据： 在 SNARE-seq、SHARE-seq、10X Multiome、Nephron、MOp 等数据集上，GLUE 的总体整合得分持续排名第一。 FOSCTTM 指标显示，GLUE 在单细胞精细对齐上误差最低，相比次优方法在多个数据集上均有明显下降。 即使把指导图中的相互作用随机破坏到很高比例，GLUE 的性能仍较稳定，说明对先验知识错误有较强鲁棒性。 在中等规模数据上表现最好；当样本数低于约 1000 个细胞时，性能开始明显受影响，揭示其对数据规模存在一定依赖。 方法价值： GLUE 不是只在“某一个指标”上占优，而是在整合精度、鲁棒性和规模适应性三方面取得平衡。 图注： Figure 2. 系统基准测试结果。包括总体整合得分、FOSCTTM、对错误先验知识的鲁棒性，以及在不同细胞数量下的表现变化，显示 GLUE 在多维度均优于基线方法。 Result 3 | GLUE 可以扩展到三组学整合并提升细胞注释质量 # 核心发现： GLUE 不仅能整合 scRNA-seq 和 scATAC-seq，还能进一步纳入 DNA 甲基化层，实现 RNA、ATAC、methylation 的三组学对齐，并细化细胞亚群注释。 主要证据： 在成年小鼠皮层数据中，GLUE 成功整合了基因表达、染色质可及性和 DNA 甲基化三层数据。 模型允许在指导图中对边设置正负号，因此可以自然表达“甲基化与表达负相关、ATAC 与表达正相关”这类异质调控关系。 通过统一嵌入进行标签转移后，作者识别出多个更细粒度的神经元亚群，修正了原始注释中较粗的分类。 三组学联合建模还揭示了不同表观遗传层对基因表达预测的非冗余贡献，其中 mCH 对神经元基因表达的解释力尤其突出。 方法价值： GLUE 证明了“多于两层”的整合是可行的，而且不只是技术上可整合，还能产出新的生物学解释。 图注： Figure 3. 小鼠皮层三组学整合。图中展示了三种组学在统一嵌入空间中的对齐结果、标签转移后的细胞类型映射，以及不同表观遗传层对表达预测的贡献比较。 Result 4 | GLUE 的统一嵌入可用于整合式调控推断 # 核心发现： GLUE 不仅整合细胞，还能基于特征嵌入的余弦相似度给出调控评分，并在顺式调控关系预测中优于共可及性和相关性方法。 主要证据： 在 PBMC 多组学数据中，作者构建了包含长程峰—基因连接的指导图，并将特征嵌入相似度定义为调控评分。 调控评分与基因组距离呈负相关、与经验峰—基因相关性呈正相关，符合生物学预期。 在 pcHi-C 和 eQTL 外部证据验证下，GLUE 调控评分比 Cicero、LASSO 或简单相关性更能预测真实的调控互作。 作者还进一步推导了 TF—靶基因网络，并发现其与 TRRUST v2 手工整理网络的一致性更高。 方法价值： 这一步让 GLUE 从“整合算法”升级为“整合 + 调控推断”框架，是该文最具方法学延展性的贡献之一。 图注： Figure 4. PBMC 中的整合式调控推断。图中展示调控评分与距离、相关性的关系，以及利用 pcHi-C / eQTL 验证调控预测有效性，并给出 NCF2 与 CD83 的实例。 Result 5 | GLUE 支持百万细胞级 atlas 整合并可修正原始注释 # 核心发现： GLUE 可扩展到数百万细胞的人类多组学图谱整合任务，并能在不损失单细胞分辨率的前提下纠正原始注释中的偏差。 主要证据： 作者把人类胎儿基因表达图谱与染色质可及性图谱整合到同一多组学 atlas 中。 依赖小批量优化、分阶段训练和元细胞预训练策略，GLUE 保持了较好的扩展性。 整合后发现部分原始注释存在偏差，例如某些被注释为星形胶质相关的细胞更接近放射状胶质祖细胞或兴奋性神经元谱系。 对照方法中，online iNMF 虽可扩展，但整合质量较差；Seurat v3 则无法在完整规模上有效运行。 方法价值： 该结果证明 GLUE 不只是实验室规模方法，而是具备 atlas 级应用潜力。 图注： Figure 5. 多组学人类细胞图谱整合。图中展示了 GLUE 在百万细胞级别的人类 RNA / ATAC 图谱对齐效果及其对原始细胞注释的修正能力。 四、方法亮点与机制总结 # 方法亮点 # 指导图真正进入模型主体 ：不是先做 peak-to-gene 映射后就丢弃，而是持续参与嵌入学习。 组学层特异性自编码器 ：避免粗暴统一分布假设，保留不同数据类型的统计特征。 对抗对齐 + 图嵌入联合优化 ：让细胞对齐与特征关系建模同步进行。 天然支持多层组学 ：通过图结构增添节点与带符号边，即可扩展到三组学甚至更多层。 整合与推断一体化 ：统一嵌入既服务于细胞对齐，也服务于 peak-gene / TF-target 调控评分计算。 可以记住的“GLUE 机制” # 可以把 GLUE 记成一句话： 先用指导图把不同组学的特征连接起来，再用图嵌入和对抗学习把不同组学的细胞放进同一个潜在空间，最后在这个统一空间中做标签转移和调控推断。 五、研究亮点与局限 # 研究亮点 # 方法创新清晰 ：不是简单改进现有整合器，而是提出“图关联统一嵌入”这一更通用的建模框架。 验证链完整 ：从双组学、三组学、调控推断到 atlas 级场景，形成层层递进的证据体系。 兼顾算法与生物学问题 ：既有 benchmark 指标，又有真实生物学案例和外部实验数据支持。 开源价值高 ：作者提供了可直接使用的 scglue 软件包与教程，利于后续方法复现和再开发。 研究局限 # 对数据规模存在依赖 ：在极小样本（\u003c1000 cells）时，神经网络方法可能欠训练。 对指导图质量仍有依赖 ：虽然对错误先验有鲁棒性，但完全错误或过度缺失的先验仍会限制结果上限。 调控推断偏全局 ：论文讨论中也指出，当前模型推断的是整个输入数据集上的平均调控关系，时空特异性仍需进一步细化。 atlas 任务训练成本较高 ：相比传统方法，模型训练与调参仍需要一定计算资源与工程门槛。 六、对当前研究的启发 # 如果后续做口腔组织的 RNA + ATAC 或多模态单细胞整合，GLUE 是非常值得优先对比的方法基线。 如果关注转录因子调控网络或 peak-gene 关系，GLUE 比单独跑 Cicero / 相关性分析更有一体化优势。 如果项目中存在跨批次、跨组织、跨平台图谱整合需求，可以借鉴其“元细胞预训练 + 单细胞微调”的思路。 对 wiki 沉淀来说，后续可以把这篇文章归入“单细胞多组学整合方法”“调控推断方法”“图神经网络在生信中的应用”三个主题节点。 七、关联文件 # 原始网页剪藏： 02 文献精读与汇报库/01_sources/papers/web_clips/Multi-omics single-cell data integration and regulatory inference with graph-linked embedding 中文汇报： 文献汇报_Cao_2022_GLUE-单细胞多组学整合 软件仓库： GLUE / scglue","tags":["单细胞","多组学","GLUE","scRNA-seq","scATAC-seq","DNA甲基化","调控推断","图神经网络"],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.562Z","url":"literature/notes/1d8d3773afef60167ef4118a.html"},{"kbId":"KB-000021","title":"Impact of gut microbiome on skin health: gut-skin axis observed through the lenses of therapeutics and skin diseases","subtitle":"","summary":"Mahmud et al. 系统综述了肠道微生物组与皮肤健康之间的相互作用（肠-皮肤轴），涵盖健康皮肤和肠道的微生物生态、饮食因素（母乳/配方奶、高/低脂饮食、蛋白质饮食、膳食纤维）、药物（抗生素、益生元、益生菌、新型生物制剂）对肠道微生物组及皮肤的影响，及其与银屑病、特应性皮炎、寻常痤疮、酒渣鼻、斑秃、化脓性汗腺炎等皮肤疾病的关联。","body":"本文献笔记由 Claudian 自动生成 背景与研究意义 # 肠-皮肤轴（Gut-Skin Axis）概念 # 人体肠道寄居着多样的微生物群落，这些微生物在维持 肠-皮肤动态平衡 中发挥着重要作用。当肠道微生物组与免疫系统之间的关系受损时，会触发连锁反应，最终影响皮肤健康，可能促进皮肤疾病的发生与发展。然而，肠道微生物组影响皮肤健康的具体机制尚不完全清楚。 研究目的 # 本综述系统评估了以下方面的现有数据： 健康皮肤和肠道的 微生物生态学特征 饮食因素 （母乳/配方奶、高脂/低脂饮食、蛋白质饮食、膳食纤维）对肠道微生物组及皮肤的影响 药物干预 （抗生素、益生元、益生菌、新型生物制剂）对皮肤的作用 肠-皮肤轴的潜在 作用机制 肠道微生物组与常见皮肤疾病（银屑病、特应性皮炎、寻常痤疮、酒渣鼻、斑秃、化脓性汗腺炎）的关联 研究方法 # 文献检索与筛选 # 系统综述方法，检索相关数据库，纳入关于肠道微生物组与皮肤健康关联的临床和临床前研究。排除标准包括数据不完整或质量不足的研究。 Figure 1 | PRISMA 研究筛选流程图 # 图注： Figure 1. PRISMA flowchart of study selection process for the systematic review on gut microbiome and skin health. 主要内容 # 1. 皮肤和肠道的微生物生态 # 健康皮肤微生物组 皮肤是一个复杂的生态系统，栖息着细菌、真菌、病毒和古细菌等多种微生物 主要菌群包括： 痤疮丙酸杆菌 （ Cutibacterium acnes ，与痤疮发病相关）、 葡萄球菌 、 棒状杆菌 等 皮肤微生物组受部位（皮脂腺、潮湿、干燥）、年龄、性别和地理位置等多种因素影响 皮肤屏障功能和先天免疫是维持微生物稳态的关键 健康肠道微生物组 肠道是人体最大的微生物栖息地，含有数万亿细菌，主要属于厚壁菌门、拟杆菌门、放线菌门和变形菌门 健康肠道特征： 多样性高 、各菌门比例稳定、功能基因丰富、代谢通路完整 肠道微生物组参与 营养代谢 （维生素合成、SCFA产生）、 免疫调节 和 屏障功能维护 Figure 2 | 皮肤与肠道微生物组成对比 # 图注： Figure 2. Microbial composition of the gut and skin. Gut microbiota is dominated by Firmicutes, Bacteroidetes, Proteobacteria, and Actinobacteria, while skin microbiota varies by site (sebaceous, moist, dry) and includes C. acnes , Staphylococcus , and Corynebacterium . 2. 肠-皮肤通讯的免疫交联机制 # 肠道与皮肤之间的通讯通过多种途径实现： 免疫系统介导 Th1/Th2极化失衡 ：肠道菌群失调可导致全身性Th2免疫偏移，影响皮肤炎症反应 调节性T细胞（Treg） ：肠道共生菌诱导的Treg可迁移至皮肤并调节炎症 树突状细胞和细胞因子 ：肠道菌群代谢产物（如SCFA）可调节系统性炎症水平 代谢产物介导 短链脂肪酸（SCFA） ：由肠道菌群发酵膳食纤维产生，包括丁酸、丙酸、乙酸 丁酸：维持肠道屏障完整性，抑制组蛋白去乙酰化酶（HDAC），具有抗炎作用 丙酸：调节免疫细胞功能，影响皮肤炎症 胆汁酸代谢 ：肠道菌群调控胆汁酸代谢，影响皮肤屏障功能 色氨酸代谢 ：吲哚衍生物可调节皮肤先天免疫（见相关文献： Aberrant amino acid metabolism promotes neurovascular reactivity in rosacea , JCI Insight 2022） 神经内分泌途径 下丘脑-垂体-肾上腺轴（HPA） ：应激可通过HPA轴影响肠道通透性和皮肤炎症 肠神经系统 ：肠道-脑-皮肤轴的组成部分 Figure 3 | 肠-皮肤通讯的免疫交联机制 # 图注： Figure 3. Gut-skin communication through immuno-cross-linking mechanisms. Key pathways include: SCFA (butyrate, propionate, acetate) produced by gut microbiota; Th1/Th2 polarization; Treg cell regulation; dendritic cell (DC) trafficking; and cytokine-mediated systemic inflammation. 3. 饮食和其他物质通过肠道微生物组影响皮肤 # 母乳与配方奶 母乳 ： 含有多种 益生元 （人乳寡糖，HMO），促进婴儿肠道有益菌（如双歧杆菌）定植 含免疫球蛋白（IgA）、乳铁蛋白、溶菌酶等 抗菌因子 母乳喂养可降低婴儿特应性皮炎风险 配方奶 ： 部分水解或深度水解配方可减少过敏风险 添加益生元/益生菌的配方奶对皮肤健康有益 高脂与低脂饮食 高脂饮食 ： 改变肠道菌群结构（厚壁菌门/拟杆菌门比值改变） 增加肠道通透性（\"肠漏\"），促进内毒素（LPS）入血 诱发系统性低度炎症，加剧皮肤炎症（痤疮、银屑病） 低脂饮食 ： 有利于肠道菌群多样性 与皮肤炎症改善相关 高蛋白饮食 过量蛋白质摄入可改变肠道菌群，产生更多 苯酚、吲哚 等代谢产物（经肠道菌群代谢色氨酸产生） 这些代谢产物可能经血液循环到达皮肤，影响皮脂分泌和痤疮发病 膳食纤维 是肠道有益菌的主要能量来源 发酵产生 短链脂肪酸（SCFA） ：丁酸、丙酸、乙酸 SCFA可调节系统性炎症、改善肠道屏障功能、预防\"肠漏\" 充足的膳食纤维摄入与皮肤炎症减轻相关 抗生素 广谱抗生素 破坏肠道菌群多样性，导致 菌群失调 抗生素相关的肠道菌群改变可影响皮肤：诱发痤疮样皮疹或加重特应性皮炎 益生菌/益生元可部分逆转抗生素相关肠道菌群紊乱 益生元（Prebiotics） 不可消化的膳食成分，选择性促进有益菌生长 常见益生元：菊粉、果胶寡糖、半乳糖寡糖（GOS） 益生元可通过调节肠道菌群间接改善皮肤状态 益生菌（Probiotics） 活的口服有益微生物，可调节肠道菌群 皮肤相关益生菌研究： 乳酸杆菌属 （ Lactobacillus ）：改善特应性皮炎、减轻皮肤炎症 双歧杆菌属 （ Bifidobacterium ）：恢复肠道屏障、调节免疫 粪肠球菌 （ Enterococcus faecalis ）：产生抗炎代谢产物 作用机制：竞争性抑制病原体、调节免疫、改善肠道屏障功能 新型生物制剂对肠道微生物组的影响 TNF-α抑制剂 （如英夫利昔单抗）：治疗银屑病和克罗恩病，部分患者肠道菌群改善 IL-17/IL-23抑制剂 ：针对银屑病的生物制剂，影响肠道免疫稳态 JAK抑制剂 ：广泛用于炎症性皮肤病，可能影响肠道菌群 4. 肠道菌群与皮肤疾病的关联 # 银屑病（Psoriasis） 关联证据 ：银屑病患者常伴有肠道炎症（亚临床肠炎）和肠道菌群改变 菌群特征 ：银屑病患者肠道中 阿克曼菌 （ Akkermansia muciniphila ）丰度降低，链球菌丰度升高 机制假说 ：肠道菌群失调 → 免疫激活（Th17/IL-23轴）→ 皮肤银屑病样炎症 治疗启示 ：靶向肠道菌群的干预（益生菌、饮食调节）可能辅助银屑病治疗 特应性皮炎/湿疹（Atopic Dermatitis, AD） 关联证据 ：特应性皮炎患者常伴有肠道菌群失调，且与疾病严重程度相关 \"卫生假说\" ：生命早期肠道菌群多样性降低增加AD风险 菌群特征 ：AD患者肠道中 梭菌属 和 金黄色葡萄球菌 丰度增加，双歧杆菌丰度降低 益生菌治疗证据 ： 产前/产后补充特定益生菌菌株可降低高风险婴儿AD发病率 Lactobacillus rhamnosus GG、 Bifidobacterium lactis Bb-12等菌株显示积极效果 效果因菌株、患者人群和给药时机而异 寻常痤疮（Acne Vulgaris） 关联证据 ：高糖/高脂饮食通过改变肠道菌群加剧痤疮 饮食-肠-皮肤轴 ：高GI饮食/高乳制品摄入 → 肠道菌群失调 + IGF-1升高 → 皮脂分泌增加 + 毛囊角化 → 痤疮 益生菌治疗 ：口服益生菌可改善痤疮（通过降低系统性炎症和IGF-1水平） 肠道-皮肤轴机制 ：肠道炎症 → 促炎因子增加 → 皮脂腺炎症 → 痤疮 酒渣鼻/玫瑰痤疮（Rosacea） 关联证据 ：酒渣鼻患者常伴有小肠细菌过度生长（SIBO），SIBO治疗后酒渣鼻改善 菌群特征 ：酒渣鼻患者肠道中 产气荚膜梭菌 （ Clostridium perfringens ）丰度升高 幽门螺杆菌 ：部分研究提示与红斑毛细血管扩张型酒渣鼻相关 机制假说 ：肠道菌群失调 → 肠道炎症 → 系统性炎症 → 面部血管扩张和红斑 治疗启示 ：抗生素（针对SIBO）和益生菌可能有助于酒渣鼻管理 斑秃（Alopecia Areata, AA） 关联证据 ：斑秃与多种自身免疫病共享肠道菌群特征 机制假说 ：肠道菌群失调 → 免疫耐受破坏 → 自身反应性T细胞攻击毛囊 证据级别 ：目前相关研究较少，机制尚不明确 化脓性汗腺炎（Hidradenitis Suppurativa, HS） 关联证据 ：HS常伴有炎症性肠病（IBD），提示肠道-皮肤轴在HS中发挥作用 菌群特征 ：HS患者肠道中 拟杆菌门 丰度降低 机制假说 ：肠道炎症 → 系统性炎症 → 毛囊阻塞和化脓性炎症 治疗启示 ：抗TNF治疗（阿达木单抗）可同时改善HS和肠道炎症 5. 肠-皮肤轴的作用机制总结 # [肠道微生物组] ↓ ┌──────────────────────────────────────┐ │ 代谢产物：SCFA、胆汁酸、色氨酸代谢物 │ │ 免疫调节：Treg、Th1/Th2平衡、细胞因子 │ │ 肠道屏障：肠漏 → 内毒素入血 │ │ 神经内分泌：HPA轴、肠-脑-皮肤轴 │ └──────────────────────────────────────┘ ↓ [系统性效应] ↓ ┌──────────────────────────────────────┐ │ 皮肤免疫：炎症反应、自身免疫 │ │ 皮肤屏障：表皮屏障功能、皮脂分泌 │ │ 血管反应：血管扩张/收缩 │ │ 毛囊功能：角化、炎症 │ └──────────────────────────────────────┘ ↓ [皮肤疾病：痤疮/AD/银屑病/酒渣鼻/AA/HS] Figure 4 | 肠-皮肤轴详细机制全图 # 图注： Figure 4. Comprehensive mechanism of the gut-skin axis. Gut dysbiosis leads to barrier dysfunction → immune activation → systemic inflammation → skin diseases (Psoriasis, Atopic Dermatitis, Acne, Rosacea, Alopecia Areata, Hidradenitis Suppurativa). 讨论与结论 # 核心发现 # 肠-皮肤轴是皮肤疾病的关键调节者 ：肠道微生物组通过代谢产物、免疫调节、肠道屏障功能和神经内分泌途径系统性地影响皮肤状态 饮食是肠道菌群和皮肤健康的桥梁 ：高脂高糖饮食、膳食纤维不足等饮食模式通过改变肠道菌群加剧皮肤炎症；而均衡饮食、充足膳食纤维和益生元有助于维持皮肤健康 益生菌/益生元是皮肤疾病治疗的新方向 ：特定益生菌菌株（特别是乳酸杆菌和双歧杆菌）在特应性皮炎、痤疮等皮肤病中显示出积极效果 皮肤疾病与肠道菌群失调常共存 ：银屑病、特应性皮炎、酒渣鼻等患者常伴有肠道菌群改变，提示共同的发病机制 研究亮点 # ✅ 系统性综述 ：全面覆盖了肠-皮肤轴的各个方面，从微生物生态到临床疾病关联 ✅ 多学科视角 ：整合了微生物学、免疫学、皮肤科学和营养学等多个领域 ✅ 临床转化潜力 ：为通过调节肠道菌群来治疗皮肤疾病提供了理论基础 研究局限 # 机制研究不足 ：肠-皮肤轴的具体分子机制尚不完全清楚，很多为相关性而非因果性证据 益生菌效果异质性 ：不同研究使用的益生菌菌株、剂量、给药时机和患者人群差异较大，结果难以比较 缺乏高质量RCT ：多数研究为小样本观察性研究，缺乏大规模随机对照试验 个体差异 ：肠道菌群组成受遗传、地理、饮食和生活方式等多种因素影响，\"一刀切\"的干预策略难以适用 时间动态性 ：肠道菌群是动态变化的，横断面研究难以捕捉其时间动态特征 关键图表 (Figure 1-4) # 以下为论文原图，按研究逻辑顺序排列。 Figure 1 | PRISMA 研究筛选流程图 # 图注： Figure 1. PRISMA flowchart of study selection process. 展示了系统综述文献筛选的完整流程，包括识别、筛选、纳入和排除的各阶段。 Figure 2 | 皮肤与肠道微生物组成对比 # 图注： Figure 2. Microbial composition of the gut and skin. 肠道 ：Firmicutes（厚壁菌门）、Bacteroidetes（拟杆菌门）为主，含 Proteobacteria、Actinobacteria 皮肤 ：依部位（皮脂腺/潮湿/干燥）分布不同，C. acnes、Staphylococcus、Corynebacterium 为代表菌属 Figure 3 | 肠-皮肤通讯的免疫交联机制 # 图注： Figure 3. Gut-skin communication through immuno-cross-linking mechanisms. SCFA（丁酸、丙酸、乙酸）介导肠道-皮肤免疫通讯 Th1/Th2 极化失衡、Treg 调节、树突状细胞（DC）迁移 细胞因子（TNF-α、IL-6、IL-17 等）系统性调控 Figure 4 | 肠-皮肤轴详细机制全图 # 图注： Figure 4. Comprehensive mechanism of the gut-skin axis. 起点 ：肠道菌群失调（Gut Dysbiosis） 中间通路 ：SCFA ↓ → 肠道屏障破坏 → 内毒素（LPS）入血 → 免疫激活 下游 ：系统性炎症 → 皮肤疾病（银屑病、特应性皮炎、痤疮、酒渣鼻、斑秃、化脓性汗腺炎） 核心参考文献 # Mahmud MR et al. (2022) . Impact of gut microbiome on skin health: gut-skin axis observed through the lenses of therapeutics and skin diseases. Gut Microbes , 14(1), 2096995. DOI: 10.1080/19490976.2022.2096995 Liu T et al. (2022) . Aberrant amino acid metabolism promotes neurovascular reactivity in rosacea. JCI Insight , 7, e161870. （肠道菌群-皮肤轴中色氨酸代谢的证据） Fang Z et al. (2022) . Bifidobacterium longum mediated tryptophan metabolism to improve atopic dermatitis via the gut-skin axis. Gut Microbes , 14, 2044723. （双歧杆菌通过色氨酸代谢改善特应性皮炎的机制） De Pessemier B et al. (2021) . Gut-skin axis: Current knowledge of the interrelationship between microbial dysbiosis and skin conditions. Microorganisms , 9, 353. Salem I et al. (2018) . The gut microbiome as a major regulator of the gut-skin axis. Front Microbiol , 9, 1459. Siddharthan R et al. (2022) . Gut microbiota and skin diseases: exploring the relationship and therapeutic implications. J Invest Dermatol . Wang B et al. (2017) . Probiotics for the treatment of atopic dermatitis in children: A systematic review and meta-analysis of randomized controlled trials. Allergy . Bowe WP et al. (2014) . Acne and the gut: A review. J Drugs Dermatol . Drago L et al. (2016) . Changing of facial acne: A randomized controlled trial. Gut Pathog . Weinstock LB et al. (2012) . Rosacea and small intestinal bacterial overgrowth: Prevalence and response to rifaximin. J Am Acad Dermatol . 精彩片段（Highlights） # 肠道微生物组通过代谢产物（SCFA等）、免疫调节和神经内分泌途径系统性影响皮肤健康 高脂高糖饮食通过破坏肠道菌群平衡加剧皮肤炎症，而膳食纤维和益生元有助于维护皮肤稳态 特定益生菌菌株（乳酸杆菌、双歧杆菌）对特应性皮炎、痤疮等皮肤疾病显示出治疗潜力 银屑病、特应性皮炎、酒渣鼻等多种皮肤疾病患者常伴有肠道菌群失调 通过调节肠道菌群（饮食干预、益生菌/益生元补充）有望成为皮肤疾病精准治疗的新策略 文献整理时间：2026-04-10 | PMID: 35866234 | PMC: PMC9311318","tags":["肠-皮肤轴","肠道微生物组","皮肤疾病","益生菌","益生元","微生物生态","综述"],"section":"literature","sectionTitle":"文献整理","category":"论文精读","updated":"2026-10-25T17:37:28.562Z","url":"literature/notes/ec47fe76605e29b58c9f52f4.html"},{"kbId":"KB-000020","title":"深度学习在单细胞基因组学与转录组学数据分析中的应用","subtitle":"","summary":"文章系统回顾了深度学习技术在单细胞测序分析中的最新进展，涵盖基因组学、转录组学、空间转录组学以及多组学整合等多个方向。单细胞技术的出现，使研究者能够在单细胞层面解析细胞异质性与分化动态，从而揭示复杂生物系统的组织规律与疾病发生机制。","body":"摘要 LLM 归库摘要 核心内容： 系统综述深度学习在单细胞基因组学、转录组学、空间转录组学与多组学整合中的应用进展。 主要方法： 以 AE、VAE、GAN 为主线，也涉及 CNN、RNN、GCN 与 Transformer 等模型。 关键任务： 聚焦 dropout 插补、批次效应校正、降维、聚类注释、空间映射与多组学整合。 代表方法/框架： 包括 scVI、DCA、DESC、DeepCpG、SCALE、SAILER、Tangram、DestVI 等。 主要结论： 深度学习已显著提升单细胞分析能力，但在标准化 benchmark、可解释性和跨数据集泛化方面仍有明显不足。 关联页面建议： 可后续沉淀到 02 文献精读与汇报库/02_wiki/topics/单细胞组学中的深度学习 。 下一步处理： 若需扩展为结构化 paper note、汇报提纲或图表提炼，可继续调用 paper-import-workflow 。 归库说明： 分类到 02 文献精读与汇报库，置信度 0.96，依据为 DOI、期刊信息与标准论文章节结构。 Biomed. Pharmacother. 2023 | 深度学习在单细胞基因组学与转录组学数据分析中的应用 # Z 2025年11月14日 22:51 今天介绍的是发表在《Biomedicine \u0026 Pharmacotherapy》上的一篇综述论文，题为《深度学习在单细胞基因组学与转录组学数据分析中的应用》。文章系统回顾了深度学习技术在单细胞测序分析中的最新进展，涵盖基因组学、转录组学、空间转录组学以及多组学整合等多个方向。单细胞技术的出现，使研究者能够在单细胞层面解析细胞异质性与分化动态，从而揭示复杂生物系统的组织规律与疾病发生机制。然而，单细胞数据通常维度极高且噪声显著，传统分析方法难以有效处理。深度学习凭借其强大的特征提取与非线性建模能力，成为解决这一难题的理想工具。论文详细介绍了基于自编码器、变分自编码器、生成对抗网络等模型的应用，这些方法在数据去噪、批次效应校正、缺失值插补及细胞聚类等方面均取得了显著成果。研究者认为，尽管深度学习在单细胞领域仍处早期阶段，但其在跨模态数据整合与精准疾病建模中的潜力巨大，未来有望成为推动生物医学智能化的重要引擎。 Erfanian, N.; Heydari, A. A.; Feriz, A. M.; Iañez, P.; Derakhshani, A.; Ghasemigol, M.; Farahpour, M.; Razavi, S. M.; Nasseri, S.; Safarpour, H.; Sahebkar, A. Deep Learning Applications in Single-Cell Genomics and Transcriptomics Data Analysis. Biomedicine \u0026 Pharmacotherapy 2023 , 165, 115077. https://doi.org/10.1016/j.biopha.2023.115077 . 0 摘要 # 传统的整体测序方法仅能测量细胞群体的平均信号，往往掩盖了细胞间的异质性与稀有亚群的存在。相比之下，单细胞分辨率的测序技术使对复杂生物系统与疾病（如癌症、免疫系统以及慢性疾病）的理解得以深化。然而，单细胞技术所生成的数据量极为庞大，且往往具有高维度、稀疏性和复杂性，使得传统计算方法难以胜任分析任务。为应对这些挑战，研究者逐渐将目光转向深度学习（DL）方法，视其为传统机器学习（ML）算法在单细胞研究中的潜在替代方案。深度学习是机器学习的一个分支，能够通过多层结构从原始输入中自动提取高层特征。与传统机器学习相比，深度学习模型在诸多领域与应用中均展现出显著的性能提升。该研究综述了深度学习在基因组学、转录组学、空间转录组学及多组学整合分析中的应用，并探讨深度学习技术是否能在这些领域中展现独特优势，或面临单细胞组学特有的挑战。系统的文献回顾表明，深度学习尚未彻底革新单细胞组学领域最为紧迫的难题。然而，在数据预处理与下游分析中，深度学习模型已展现出可观的潜力，且在诸多情形下超越了以往的主流方法。尽管深度学习在单细胞组学中的发展相对缓慢，近来的研究进展显示，其有望成为推动单细胞研究快速发展的重要工具。 1 引言 # 自从单细胞测序（sc-seq）在2013年被评为“年度方法”以来，单细胞水平的测序技术已成为研究细胞间异质性的常用手段。RNA和DNA的单细胞检测，以及近年来的表观遗传学与蛋白质水平分析，使得研究能够以极高的分辨率对细胞进行分层。单细胞RNA测序（scRNA-seq）能够在单细胞水平上测量整个转录组的基因表达，这种高分辨率使研究者能够根据特征区分不同细胞类型、组织细胞群并识别处于状态转变过程中的细胞。这类分析为理解组织结构及生物体发育过程中的动态变化提供了更全面的视角，也使得先前通过整体RNA测序被视为均一的细胞群体内部异质性得以揭示。同样，单细胞DNA测序（scDNA-seq）可用于揭示体细胞克隆结构，例如在癌症研究中，这有助于追踪细胞谱系发展并深入理解体细胞突变所驱动的进化机制。 单细胞测序带来了巨大的潜力，使研究者能够在单细胞层面重新评估预定义样本群体之间的差异假设，不论这些样本是疾病亚型、治疗组还是形态上不同的细胞类型。因此，近年来，针对生命基本单元的遗传物质进行筛查的研究热情持续高涨。人类细胞图谱（Human Cell Atlas）便是其中的代表性项目，旨在全面测序组成人体的各类细胞及其状态。得益于单细胞DNA与RNA研究的巨大潜力，相关实验技术得到了迅速发展，尤其是微流控技术与组合索引策略的出现，使得单次实验即可测序数十万细胞，甚至已有研究实现了对上百万细胞的同时分析。全球范围内越来越多的大规模单细胞测序数据集被公开（包含数万至数百万细胞），推动了单细胞分析平台的数据爆发式增长。 随着单细胞测序数据规模与数量的持续扩张，科学界面临新的关键问题：如何正确解读并分析日益复杂的单细胞测序数据集？如何整合不同类型的数据以更深入理解特定条件下的生物学动态？以及如何将所得信息转化为医学应用，从快速精准的诊断到个体化治疗与靶向预防？在慢性疾病增加、人口老龄化与资源有限的背景下，向智能化的数据分析与理解转变显得尤为必要。在这一转型中，机器学习（ML）作为核心工具迅速崛起。机器学习致力于建立能够从数据中学习规律的模型，而无需明确的编程指令。伴随过去十年生物医学的飞速进展，机器学习算法的开发与应用也取得了显著突破，其中以深度学习（DL）的发展最为突出。早期的深度学习算法旨在计算机上模拟人脑的学习机制，因此被称为“人工神经网络”（ANN）。深度学习模型通常由多层神经元节点构成，通过多层结构能够学习多层次的数据表示。计算硬件的进步使得深度学习模型的训练变得可行，并促成了其在多个领域的革命性应用。 该综述旨在探讨深度学习在单细胞测序分析中的应用，阐述其在提升单细胞数据处理与分析中的关键作用。文章首先介绍深度学习的基本概念，以便更好地理解其在单细胞领域的应用。鉴于单细胞测序数据的高技术噪声与复杂性，文中还回顾了适用于此类数据的分析技术，以确保结果的稳健性与可重复性。最后，讨论了未来可能的发展方向，指出单细胞组学这一快速演进领域中所面临的新挑战与机遇。 2 深度学习基础 # 深度学习的发展历史悠久，其起点可追溯至1943年McCulloch与Pitts提出的MCP人工神经元模型。随后，Rosenblatt在此基础上提出了感知机的概念，为神经网络的发展奠定了理论基础。1974年，Werbos提出了反向传播算法，使得多层神经网络的训练成为可能。然而，直到2006年Hinton引入了一种新算法，成功解决了反向传播中梯度消失的问题，深度学习技术才真正展现出强大的潜能。 深度学习是机器学习的一个分支，其核心在于利用深度神经网络（DNN）对大规模复杂数据进行分析。深度神经网络由多层人工神经元构成，这些神经元的设计灵感来源于人脑神经元的工作方式。每个神经元接收输入信号的加权和，并通过非线性激活函数进行变换，常用的激活函数包括sigmoid、修正线性单元（ReLU）与双曲正切函数（tanh）。最基础的深度学习结构是深度前馈神经网络（DFNN），其通过堆叠多个神经元层构成。输入信息从输入层经由若干隐藏层传递，最终在输出层生成结果。神经元的大量可训练权重及非线性变换，使深度神经网络能够捕捉数据中潜在的复杂模式。训练过程的核心在于通过优化算法确定这些权重，以提升模型性能。深度学习模型的训练依赖反向传播机制，通过计算预测误差反向更新参数，实现模型的逐步优化。 根据学习方式的不同，深度学习可分为三类：监督学习、无监督学习与半监督学习。监督学习最常见于深度前馈神经网络中，其目标是将输入数据映射为可用于分类或回归等任务的表示。半监督学习则在仅有部分数据带标签的情况下进行训练，通过有限的标注信息指导未标注数据的表示与分类。无监督学习用于在无标签监督的情况下识别数据中的潜在结构或模式，常被应用于单细胞测序数据的降维与细胞聚类分析。 接下来的部分将概述几种在单细胞研究中常用的深度学习模型及其应用。 图1 (a) 前馈神经网络（FFNN）的结构示例。原始输入以X表示，权重张量记为Wi，激活层为αi，蓝色节点b表示偏置项。图中蓝色边代表正权重，红色边代表负权重，数值越小边的透明度越高，反之越深。(b) 卷积神经网络（CNN）用于分类的结构示例。在此假设性结构中，模型将输入依次经过三个卷积阶段（未绘出非线性激活部分）以提取特征，CNN输出随后输入至全连接神经网络以完成分类任务。(c) 循环神经网络（RNN）的结构与训练流程示意图。展开后的结构显示了依赖时间步长的输入、隐藏状态与输出的对应关系。(d) 去噪自编码器（Denoising AE）的示意图。自编码器由编码器与解码器组成，编码器用于提取关键信息并将其映射至潜在空间（通常维度远小于输入空间），解码器则接收编码器生成的潜在向量z，并将其还原至原始输入维度，实现数据重构。(e) 变分自编码器（VAE）的结构示意图，其目标是利用基因表达值生成合成的scRNA-seq数据。(f) 生成对抗网络（GAN）的示意图，用于生成模拟的scRNA-seq数据。在此示例中，scRNA-seq计数矩阵被转换为图像形式，并作为真实样本用于模型训练。 2.1 循环神经网络（RNN） # 循环神经网络（RNN）是一类专用于处理序列数据的模型，常用于自然语言处理与时间序列分析。RNN按时间顺序逐步接收输入，并隐式保留先前输入序列的历史信息。其典型结构与前馈神经网络（FFNN）类似，不同之处在于每个隐藏状态的输出会反馈影响下一时刻的输入。若将不同时间步的隐藏单元输出视为多层网络中的不同神经元输出，RNN的工作机制便更为直观。然而，深层RNN在训练中容易出现梯度消失或爆炸的问题，同时由于层间依赖严格的时间顺序，模型难以并行化，训练成本较高。这些缺陷促使研究者开发了新的序列到序列模型以缓解RNN训练困难。其中，长短期记忆网络（LSTM）在一定程度上解决了梯度问题，而Transformer结构的出现则实现了更深层次、可并行的稳定序列建模。尽管这些模型在单细胞组学中的应用仍较有限，已有研究显示其潜力，例如利用LSTM预测细胞类型与运动性，或使用Transformer从稀疏的scRNA-seq数据中生成有意义的嵌入表示。 2.2 卷积神经网络（CNN） # 卷积神经网络（CNN）是一种特殊类型的神经网络，其在至少一层中使用卷积操作代替FFNN中的张量乘法。这一操作使CNN特别适合处理具有网格状拓扑结构的数据，如图像。与其他人工神经网络相比，CNN具有稀疏连接、权重共享与等变表示三大优势。CNN在计算机视觉与时间序列分析中表现突出，但在单细胞测序分析中应用较少，因为sc-seq数据并不具备网格结构。然而，有研究通过将单细胞测序数据转化为图像形式，再利用CNN进行分析，取得了较为理想的结果。 2.3 自编码器（AE） # 自编码器是一种通过非平凡映射重构输入数据的神经网络，其通常具有“沙漏”式结构，由编码器与解码器两部分组成。编码器负责将输入数据映射到低维潜在空间，实现特征提取与数据压缩；解码器则将潜在向量还原至原始空间，以重建输入数据。在理想情况下，解码器输出应接近训练样本的原貌。去噪自编码器（Denoising AE）是其中一种典型形式，通过学习在噪声干扰下的稳健重建能力。自编码器在单细胞RNA测序分析中应用广泛，包括批次效应消除、缺失值填补及多组学整合等，其在特征学习与降维分析中展现出显著优势。 2.4 变分自编码器（VAE） # 变分自编码器是一类生成模型，能够同时学习潜变量模型与推断模型。与传统AE不同，VAE通过变分推断实现数据的重建，使模型不仅能复现原始数据，还能生成与原始分布相似的新样本。VAE在数学性质与训练稳定性方面优于生成对抗网络（GAN），但也存在两个主要问题。首先，经典VAE生成的样本往往较“模糊”，难以达到GAN那样清晰的生成效果。为此，Huang等人提出了内省变分自编码器（IntroVAE），通过在编码器与解码器间引入对抗机制，有效改善了生成质量，并在图像生成与超分辨率任务中超越了传统GAN。其次是“后验坍塌”问题，即变分后验分布与先验分布过于接近，导致生成质量下降。针对这一问题的研究主要集中于削弱生成模型能力、修改损失目标或调整训练策略等方向。如果能有效克服上述问题，VAE在训练效率与生成质量上均能与GAN媲美。由于VAE的潜空间结构良好，常被用于单细胞组学中的聚类与降维分析，同时也可用于缺失数据填补与合成样本生成，从而提升下游分析性能。 2.5 生成对抗网络（GAN） # 生成对抗网络是一类能够生成逼真合成数据的深度生成模型，广泛应用于计算机视觉、自然语言处理、时间序列生成与生物信息学等领域。GAN由生成器（G）与判别器（D）两部分构成，两者通过零和博弈相互竞争。生成器的目标是产生与真实数据分布相似的伪样本以“欺骗”判别器，而判别器则学习区分真实样本与生成样本。通过多轮对抗训练，生成器逐步提升生成质量，判别器则持续强化辨别能力。GAN的强大生成能力来源于这种对抗机制，其可灵活学习任意分布，无需对先验分布作假设，也不受潜空间维度限制。然而，GAN训练极具挑战性，因生成器与判别器难以达到纳什平衡；同时，若判别器学习过快，梯度消失会导致生成器无法有效更新。此外，“模式崩溃”问题亦常出现，即生成器仅输出有限的样本模式。由于GAN学习分布的质量难以量化，评估通常需依赖对生成结果的直接观察。尽管诸如Wasserstein-GAN（WGAN）与Unrolled-GAN等变体在一定程度上缓解了这些问题，GAN的收敛性仍是难题。凭借生成逼真样本的能力，GAN正逐渐应用于单细胞组学分析领域，已在数据填补、数据增强及疾病进展预测（如阿尔茨海默症的分子演化预测）等方面展现出良好前景。 图2 | RNA测序数据分析的工作流程。 3 单细胞组学的基本概念 # 细胞状态主要由其基因组、表观基因组、转录组、蛋白质组与代谢组之间的相互作用所定义和表征。从这些层面获得的数据通常被统称为“组学”数据。然而，直到近年，由于单细胞分离及检测每个细胞中微量分子所面临的技术难题，在单细胞分辨率下获取多层组学数据仍不可行。随着实验技术与工程手段的快速发展，多种组学层面的信息如今已能在单细胞水平上被检测与测序。单细胞组学技术的出现，使研究者得以探索细胞间及群体内部的异质性，而这些差异在以往的整体测序中常被掩盖并误认为均一。 3.1 转录组学 # 转录组学研究的是转录组，即在特定条件下或特定细胞中由基因组产生的全部RNA转录本。通过高通量测序（如单细胞测序sc-seq）可以实现对转录组的系统分析。比较不同细胞类型或不同刺激条件下的转录组，可识别出差异表达基因。单细胞转录组学为理解细胞分化动态、细胞对刺激的响应以及转录活动的随机性提供了独特视角。近年来的技术进步使得单细胞转录组学能够用于构建健康人体组织、器官及系统的单细胞分辨率参考图谱，这对于多个生物学研究领域都具有重要意义。 3.2 基因组学 # 基因组学是一门研究基因组的结构、功能、进化、定位与编辑的学科。单细胞基因组学则利用组学技术在单细胞层面研究细胞的独特性，从而揭示复杂生物事件与系统的新机制。在单细胞水平上分析多种类型的突变，有助于揭示贯穿人类生命周期的遗传异质性，并提供对遗传多样性更深入的理解。 3.3 表观基因组学 # 表观基因组学研究的是DNA甲基化、组蛋白修饰、染色质可及性及染色体构象等物理性修饰，这些修饰使得具有相同基因型的细胞能够表现出不同的基因表达谱。单细胞水平表征表观基因组的实验技术取得了显著进展，使研究者得以更深入理解表观遗传过程及其与基因调控之间复杂的相互作用。近期的技术创新更进一步实现了对表观遗传维持与重编程动态过程的单细胞层面评估与识别，为揭示细胞命运调控机制提供了新的可能。 表1 | 单细胞RNA测序（scRNA-seq）分析各阶段的计算方法。 4 深度学习在单细胞组学中的应用 # 4.1 单细胞转录组学中的深度学习 # 近年来，单细胞RNA测序（scRNA-seq）极大地推动了对生物过程的理解。通过对人类、小鼠、斑马鱼、青蛙及涡虫等多种生物的细胞异质性研究，单细胞转录组学揭示了许多此前未知的细胞亚群，同时凸显出对更强大的计算分析方法的需求，以便处理日益庞大且复杂的scRNA-seq数据。目前，大量scRNA-seq数据已公开可用，主要托管于Gene Expression Omnibus（GEO）、Human Cell Atlas以及10x Genomics等数据库。下文将概述单细胞RNA测序分析各阶段的主要计算方法（见图2与表1）。 4.1.1 预处理与质量控制 在scRNA-seq实验中，细胞条形码（barcode）用于区分样本中的不同细胞群。然而，条形码有时可能错误地标记多个细胞（称为“双细胞”）或未标记任何细胞（称为空液滴或空孔），因此质量控制（QC）是分析流程中的关键步骤。常用的原始数据预处理工具如Cell Ranger、indrops、SEQC和zUMIs等均可执行QC操作。测序生成的计数矩阵维度取决于条形码与转录本的数量。尽管测序读数与计数数据中的噪声水平因实验而异，大多数分析流程仍使用相似的预处理策略。scRNA-seq数据虽然信息量丰富、可揭示更深层次的生物学规律，但其噪声与复杂性远高于整体RNA测序，给后续分析带来挑战。偏差与技术伪影等非期望变异需通过严格的质量控制与归一化加以校正。常用的QC指标包括每个条形码的总计数（测序深度）、检测到的基因数目及线粒体基因计数比例。此外，样品在解离过程中受损等实验因素亦可能导致低质量文库，影响后续分析结果。因此，如何在文库构建阶段高效识别并过滤低质量细胞仍是当前研究的难题。 深度学习算法因具备多任务处理与可扩展性，被视为构建端到端单细胞分析流程的关键工具。与传统依次执行不同任务的分步框架不同，深度学习模型可同时执行质量控制、数据校正与下游分析，并使各任务相互促进。此类模型有望超越传统分析流程。尽管目前端到端的深度学习模型仍处于早期阶段，一些初步研究（如scVI框架）已显示出显著潜力，证明深度学习在单细胞数据分析管线的构建中具有广阔前景。鉴于当前有关预处理与质量控制的研究相对有限，以下重点讨论深度学习在归一化、数据校正及下游分析中的应用。 4.1.2 归一化 归一化是scRNA-seq预处理阶段的重要环节，旨在校正由低输入量或系统性测量偏差引起的差异。其目标在于消除不同样本或基因间因技术伪影或非目标生物学效应（如批次效应）导致的测量差异。传统的整体RNA测序与微阵列数据归一化方法常被直接用于scRNA-seq数据，但这些方法往往忽略了单细胞数据的特有属性。针对scRNA-seq数据，研究者提出了多类归一化策略，如基于比例缩放的技术、基于回归的偏差校正方法，以及利用外部RNA标准（ERCC）序列的归一化方案。然而，这些方法往往依赖具体实验设计，难以普适应用。尽管已有部分基于深度学习的归一化模型尝试自动化解决技术噪声问题，但如何在归一化阶段全面建模scRNA-seq特有的技术变异仍是该领域的重要研究方向。 4.1.3 数据校正 归一化虽能减少数据噪声与偏差，但处理后的数据仍可能存在额外的变异来源，如批次效应、基因丢失（dropout）及细胞周期差异等。数据校正阶段旨在处理这些技术与生物学变量。通常建议将两类协变量分别建模，因为其来源与影响机制不同。由于这些问题的复杂性，目前尚无广泛应用的深度学习模型可同时解决数据校正的主要挑战。 图3 | 通过互为最近邻（MNN）进行批次效应校正示意图。 (a) 在高维空间中，批次1与批次2存在几乎正交的批次效应差异。(b) 通过识别细胞间的MNN配对，算法能够找到匹配的细胞类型（灰色框所示）。(c) 在每一对MNN细胞之间计算批次校正向量。(d) 将批次1作为参考，通过减去校正向量将批次2的数据对齐并整合至参考批次。(e) 整合后的数据作为新的参考，用于与后续批次重复该校正与整合过程。 4.1.3.1 基因丢失（Dropout） 与整体RNA测序相比，scRNA-seq数据具有更强的稀疏性与噪声特征，其中最显著的问题之一是“dropout”现象——即某基因在部分细胞中高表达，而在其他细胞中未被检测到。该现象可能源于文库构建阶段单细胞mRNA含量极低，或源自基因表达的随机性。一般而言，较短的基因具有更低的读数与更高的dropout率。RNA捕获效率低会导致无法检测到已表达的基因，从而产生“假零值”；某些接近零的表达值也可能属于此类。dropout事件会显著增加技术噪声，干扰聚类及拟时分析等下游任务。因此，区分“真零值”（即基因确实未在该细胞类型中表达）与“假零值”（技术缺失）至关重要。前者反映细胞类型特异性表达，应予保留；后者则需通过填补（imputation）进行修正。 针对bulk RNA测序开发的传统插补方法并不适用于单细胞数据，因为单细胞数据具有更高的细胞间异质性和更严重的缺失问题。当前的插补方法大致分为两类：一类对所有基因表达进行整体修正，如MAGIC与SAVER；另一类仅针对零值或近零值进行填补，如scImpute、DrImpute与LSImpute。然而，这些方法往往难以捕捉数据的非线性结构。随着大规模scRNA-seq数据集的普及，插补方法亟需具备处理数百万细胞的能力。许多早期算法在大规模数据下效率低下，因此研究者逐渐转向深度学习模型以应对精度与计算效率的双重挑战。 大多数用于填补单细胞RNA测序（scRNA-seq）中“基因丢失”(dropout)事件的深度学习算法以自编码器（AE）为基础。2018年，Talwar等人提出了AutoImpute模型，利用过完备自编码器对整个基因表达矩阵进行重建，从而推断缺失值。AutoImpute通过学习输入scRNA-seq数据的潜在分布，对缺失值进行填补，同时仅对生物学上无活性的表达值做最小修改。该模型通过将基因表达模式映射到高维潜空间，学习单细胞中的表达分布与结构，最终重构出完整的表达矩阵模型。研究者指出，AutoImpute在当时是唯一能够在不耗尽内存的情况下，对其测试的最大数据集（约6.8万个外周血单核细胞，68K PBMC）进行插补的模型。 Eraslan等人随后提出了Deep Count Autoencoder（DCA），其在建模计数分布时采用负二项分布（可选是否包含零膨胀），以处理数据的过度离散性并捕捉基因间的非线性依赖。由于DCA的计算复杂度随细胞数线性增长，该模型可扩展至百万级细胞数据集。DCA利用基因间相似性进行降噪，在真实与模拟数据上均提升了传统scRNA-seq分析的准确性。其优点之一在于用户仅需指定噪声模型。相较其他方法，DCA在插补质量与速度上均表现出色，可计算每个零表达值的“dropout概率”，仅在概率较高时进行填补，从而有效区分“真零值”与“假零值”。但在处理非零表达值时，DCA可能产生偏差。 Badsha等人提出了基于迁移学习的TRANSLATE模型，其前身为LATE（Learning with AutoEncoder），同样基于自编码器结构。两者均假设scRNA-seq数据中的零值为缺失值。实验结果显示，该方法能有效恢复非线性基因间关系，降低均方误差，并改善细胞类型区分。LATE与TRANSLATE具有良好的可扩展性，利用GPU可在数小时内完成百万级细胞训练。与DCA相比，TRANSLATE在推断技术性零值上表现更优，而DCA在识别生物学零值方面更具优势。 SAUCIE(Sparse Autoencoder for Unsupervised Clustering, Imputation, and Embedding)是一种带正则化的自编码器，通过重构信号实现去噪与插补。该方法能在高噪声输入下恢复基因间重要关系，从而改善表达谱与下游差异基因分析。ScScope是一种循环自编码器网络，通过循环层迭代执行插补操作，当循环步数设为1时即退化为传统AE结构。其运行效率与其他AE模型相近。 除自编码器外，亦有部分非AE模型用于scRNA-seq数据的插补与去噪。DeepImpute通过多个子神经网络对基因群进行插补，每个子网络利用与目标基因强相关的信号基因进行预测。研究表明，DeepImpute在性能上优于DCA，这得益于其分而治之的架构。Mongia等人提出的Deep Matrix Completion（deepMC）则基于深度矩阵分解原理，利用反向前馈神经网络处理缺失值，在多数实验中均超越现有方法，且无需对基因表达分布作先验假设，具有高性能与简洁性。 Lopez等人开发的Single-cell Variational Inference（scVI）是一种基于深度神经网络的层次贝叶斯模型，假设基因计数服从负二项或零膨胀负二项分布。scVI能够准确恢复基因表达信号并填补零值项，从而提升下游分析的可靠性而不引入伪信号。Patruno等人随后比较了19种去噪与插补方法，从表达谱恢复、细胞相似性、差异基因识别与计算时间等维度进行评估。结果显示，ENHANCE、MAGIC、SAVER及SAVER-X在效率、精度与稳健性方面表现最佳。2023年，Xu等人提出了autoCell，一种基于深度学习的scRNA-seq缺失插补与特征提取方法。该模型结合变分自编码器、图嵌入及概率高斯混合模型，以处理高维稀疏的单细胞数据，提供可视化、聚类、插补及疾病特异性基因网络识别等完整功能。 总体而言，尽管传统插补方法在部分场景中仍有效，但其难以适应大规模单细胞数据的分析需求。随着百万级scRNA-seq数据集的普及，基于深度学习的模型将在处理dropout效应及区分技术零值与生物学零值方面展现更大优势，因此未来仍需进一步优化此类算法以实现更高精度的缺失填补与信号恢复。 4.1.3.2 批次效应校正 当样本分批处理时，因技术差异引入的系统性变异被称为“批次效应”。不同测序仪器、实验平台、实验环境、样本来源乃至操作人员都可能导致批次差异。批次效应的校正通常是推荐步骤，但其效果在不同研究中差异较大。自微阵列时代起，批次校正便是活跃研究方向。Johnson等人早期提出了基于参数与非参数经验贝叶斯框架的批次调整方法。随着测序数据复杂度的提升，出现了更多复杂的校正策略。然而，大多数现有方法最初为整体RNA或微阵列数据设计，需要明确的生物学分组信息，因此并不完全适用于单细胞数据分析。批次效应若未能妥善处理，会严重影响生物信号的准确性并导致错误结论。 针对单细胞特性的统计模型包括线性回归方法ComBat及非线性模型如Seurat的典型相关分析（CCA）与scBatch，它们在尽量保留生物异质性的同时减少技术偏差。此外，limma、MAST与DESeq2等差异分析框架也将批次效应作为协变量纳入建模。Haghverdi等人提出的MNN方法通过识别数据集中“互为最近邻”（mutual nearest neighbors）细胞来建立映射关系，并计算平移向量以对齐数据集，从而在共享空间中重构并消除批次差异。该方法能生成可直接用于下游分析的标准化表达矩阵，适应不同批次间组成差异。 随后，Scanorama与BBKNN两种算法基于降维空间中的MNN关系实现批次整合。Scanorama通过识别并合并不同研究中共享的细胞类型，有效去除批次效应并保持对稀有细胞状态的识别能力，可扩展至百万级细胞。BBKNN则基于图结构连接跨批次的相似细胞，计算效率极高，默认近邻模式下速度可快于其他方法1–2个数量级。 近年来，深度学习在批次效应校正中的应用取得显著进展。残差神经网络（ResNet）与自编码器是两种常用结构。Shaham等人提出基于分布匹配ResNet的非线性批次校正方法，通过最小化不同批次间多维分布的最大均值差（MMD）实现对齐，能够在不改变样本生物特征的情况下消除批次效应。Li等人提出的DESC算法是一种无监督深度学习模型，可同时进行“软聚类”和批次校正。DESC通过深度神经网络将原始数据映射至低维特征空间并迭代优化聚类目标函数，从而同时考虑生物与技术变异。研究显示，DESC在保持细胞类型差异的同时，比基于MNN的方法能更准确地去除技术批次效应。 Shaham还提出基于对抗变分自编码器（VAE）的无批次编码方法，通过对抗训练实现仅依赖生物特征的编码表示，有效减少生物信息损失。Wang等人则开发了BERMUDA框架，利用深度自编码器无监督校正不同批次的scRNA-seq数据，通过批次间信息传递增强生物信号。BERMUDA特别适用于细胞群差异显著的样本，注重跨簇相似性而非群体组成差异。 2023年，Gan等人提出了SCIBER算法，通过差异表达基因匹配批次间的细胞簇，并以参考数据为基准实现快速批次校正。SCIBER在准确性与效率上均优于复杂的先进方法，且适合将用户自有数据与标准数据库（如Human Cell Atlas）整合。总体来看，基于深度学习的批次效应校正方法正迅速发展，为生物数据整合提供了更高效、鲁棒的新思路。 4.1.3.3 降维分析 降维是单细胞RNA测序（scRNA-seq）数据可视化中的关键步骤，因为典型数据集中往往包含数千个基因特征（维度）。常见的降维方法包括主成分分析（PCA）、t分布随机邻域嵌入（t-SNE）、扩散映射（Diffusion Map）、高斯过程潜变量模型（GPLVM）、多核学习的单细胞解释模型（SIMLR）以及统一流形近似与投影（UMAP）。在线性投影的低维空间中，诸如PCA的方法难以捕捉单细胞数据的复杂结构；而非线性降维方法如t-SNE与UMAP在多种应用中表现优异，已被广泛用于单细胞数据处理。然而，这些方法也存在缺陷，包括对随机采样敏感、无法同时捕捉全局与局部结构、参数敏感性强以及计算代价高等问题。 近年来，多种基于深度学习的scRNA-seq降维方法被提出，其中以变分自编码器（VAE）与自编码器（AE）模型最为常见。Ding等人提出了基于VAE的scvis模型，用于从高维空间学习到低维嵌入的参数化映射，从而估计潜在变量的后验分布。与t-SNE等方法相比，scvis能够更好地保留数据的全局结构、具备更高的可解释性并对噪声具有更强的鲁棒性。然而，其计算耗时较长，且在分离细胞群体方面效果略逊。Wang等人提出了VASC模型，一种用于无监督降维与可视化的深度VAE架构，包含一个零膨胀层以模拟基因丢失事件。与PCA、t-SNE及ZIFA等方法相比，VASC能捕捉数据中的非线性模式，在样本量较大时表现出更高的精度与兼容性。 Märtens等人提出的BasisVAE是一种通用的VAE框架，可同时实现降维与特征聚类。该模型通过在VAE解码器中引入层次贝叶斯聚类先验，从而在过度设定聚类数K时仍能获得稀疏解。Peng等人进一步提出结合基因本体论（GO）与深度神经网络的AE模型，通过“基因本体自编码器”（GOAE，非监督）与“基因本体神经网络”（GONN，监督）实现低维表示。结果显示，结合GO先验知识能提升聚类的可解释性与精度，优于现有降维方法。Armaki通过系统评估发现，AE模型在降维方面表现最佳，而VAE在某些方面甚至不如线性PCA。这可能与VAE潜空间的先验假设（如高斯分布）不适用于单细胞数据有关，若改用更合适的先验（如负二项分布）可能改善效果。总体而言，开发高效的深度学习降维算法是未来的关键方向，因为其有潜力进一步提高低维表示的质量。 4.1.3.4 模拟生成与数据增强 由于单细胞数据的获取成本高且样本量有限，利用计算机生成（in-silico）数据进行模拟与增强成为一种高效、可靠且经济的解决方案。数据增强在文本与图像分类等机器学习任务中已是标准实践。随着深度学习的发展，传统的几何变换或噪声注入方法逐渐被基于生成模型（如VAE与GAN）的深度生成技术取代。在计算基因组学中，这两类模型在组学数据生成中均展现出良好性能。 Marouf等人提出了scGAN与cscGAN两种基于GAN的单细胞数据生成模型，统称为scGAN。该模型基于Wasserstein-GAN结构，能够学习scRNA-seq数据的潜在流形并生成逼真的合成样本。scGAN生成的细胞类型与真实数据几乎难以区分，且通过向数据集中加入合成样本，可显著提升稀有细胞群的分类准确率。Heydari等人提出了基于VAE的ACTIVA模型，以改进GAN的训练稳定性与速度。ACTIVA是一种条件对抗变分自编码器，利用细胞类型信息进行条件化生成，从而在单一框架下快速生成指定类型的细胞样本。实验表明，ACTIVA在生成质量上可与scGAN相当，而训练速度快约17倍。 这两类生成模型不仅能为算法基准测试提供数据支持，还能辅助分类器评估与标志基因检测，进而在样本量受限的研究中减少对动物与患者样本的依赖，促进早期生物医学探索。 4.1.4 下游分析 预处理完成后，下游分析用于提取生物学意义并揭示潜在的分子机制。例如，具有相似基因表达的细胞可形成簇群；相似细胞间细微的表达差异可反映连续分化轨迹；而基因间的共表达模式则提示潜在的共调控关系。 4.1.4.1 聚类与细胞注释 聚类是scRNA-seq研究中的核心步骤之一，用于识别细胞亚群并将其归类为生物学上相关的群体。随着单细胞聚类算法的进步，多项细胞图谱项目得以开展，如小鼠细胞图谱、果蝇脑衰老图谱与人类细胞图谱等。传统聚类方法虽能区分主要细胞类型，但深度学习模型在复杂聚类任务中表现更为优越，尤其在高维图像与文本领域，因此研究者也将其引入单细胞分析。 Li等人提出的DESC模型基于AE结构，通过自训练目标分布进行聚类，同时具备去噪与批次效应消除功能。DESC在多个数据集上均取得较高准确率，且在无需预定义批次的情况下保持稳健表现。Chen等人提出scAnCluster框架，将无监督聚类算法scDMFK与scziDesk扩展为端到端的监督聚类与注释系统。该模型利用多项分布建模并结合模糊K均值算法，实现了软聚类与神经网络参数优化，能够在不同数据集间进行细胞类型识别与注释，并有效检测新的细胞类型。 Tian等人提出scDeepCluster，将DCA与DESC结合，采用非线性降维与聚类联合优化。该方法在多项聚类评价指标上超越主流算法，计算复杂度随样本线性增长，且内存占用更低。Peng等人利用DNN与基因本体结合的策略优化细胞聚类，实现了全转录组水平的特征降维与高精度聚类。 此外，基于VAE的scVAE模型能直接使用原始计数数据作为输入，无需复杂的预处理步骤；而scDCCA结合去噪自编码器与对比学习模块，实现了特征学习与聚类一体化的端到端分析。He等人提出的G3DC方法引入基因网络图损失与重构损失，提升了聚类的可辨识性与生物学解释性。Hu等人提出的scDFC算法利用特征聚类与注意力机制模块，实现了多特征类型的高效融合与聚类。 尽管深度学习方法在聚类性能上总体优于传统算法，但仍存在细胞簇数未知、类型未固定与可扩展性不足等问题。此外，技术伪影（如双细胞滴度）可能导致聚类结果混淆。未来研究需在模型稳定性、噪声建模及聚类生物意义验证方面继续探索。 4.1.4.2 细胞间通讯分析 单细胞测序已成为分析组织中细胞通讯的强大工具。细胞间通过配体–受体相互作用调控发育、分化及炎症等过程。多种算法基于配体–受体数据库推断细胞类型间的信号通路。DeepCCI是首个基于深度学习的细胞通讯分析方法，利用图卷积网络（GCN）捕获配体–受体对的全局拓扑特征，并结合细胞配对的基因表达预测通讯关系。GCNG则将空间数据编码为图结构，通过监督学习整合空间与表达信息，能够发现新的细胞外相互作用基因对。由于目前细胞间通讯缺乏可靠的“真值”验证，评估仍依赖低通量实验，未来亟需建立标准化、低成本的验证框架。 4.1.4.3 RNA速度 RNA速度为研究细胞分化提供了新思路。其反映了基于剪接前后mRNA比例的基因表达变化率，即预测单个细胞未来的转录趋势。RNA速度向量可揭示短时间尺度上的细胞命运变化，弥补传统谱系追踪与成像方法的不足。当前算法如VeloViz与scVelo已能在低维空间可视化速度估计，但对复杂系统的理解仍有限。Cui等人提出的DeepVelo模型结合深度图卷积网络（GCN），能在无预设动力学假设下预测RNA速度，尤其适用于具有复杂谱系与异质细胞类型的系统。未来的研究将进一步发展基于深度学习的RNA速度建模，以阐明细胞命运决定与发育轨迹的机制。 4.2 深度学习在单细胞基因组学中的应用 # 传统测序方法仅能获得细胞群体的平均信号，掩盖了细胞异质性与稀有亚群。相比之下，单细胞测序在解析细胞多样性及其临床相关分子特征方面具有显著优势。与scRNA-seq类似，单细胞基因组学广泛应用于DNA/RNA结合蛋白特异性预测、增强子及顺式调控元件识别、甲基化状态检测、基因表达调控、剪接控制及基因型–表型关联分析。然而，单细胞基因组数据庞大且复杂，仅通过传统可视化分析难以揭示其潜在规律。 深度学习在该领域的应用迅速增长，凭借其可扩展性与自动特征提取能力，成为解析单细胞基因组与表观基因组的重要工具。应用包括细胞类型识别、DNA甲基化模式分析、染色质可及性预测、转录因子–基因调控关系建模及组蛋白修饰识别等。相关数据可从公共数据库如NCBI、Ensembl及DDBJ下载。后续章节将重点介绍深度学习在单细胞DNA测序数据分析中的具体应用（见图4）。 图4 | 单细胞基因组学分析中不同阶段所使用算法的概览。 4.2.1 细胞类型识别（CyTOF） 在基因组学研究中，准确识别并聚类不同类型的细胞是一项关键且具有挑战性的任务。Li等人提出了基于自编码器（AE，包括堆叠AE与多层AE）的质量控制与门控方法，用于质谱流式细胞术（CyTOF）的数据分析。CyTOF是一种新兴的高维多参数单细胞分析技术。研究者提出了DeepCyTOF模型，这是一种基于多层AE网络的标准化框架，融合了领域自适应（domain adaptation）原理，用于在监督学习的条件下实现源域（参考样本）与目标域（待校准样本）之间的分布对齐。DeepCyTOF仅需一个样本的标注数据，即可实现多个样本的自动门控。 研究者在两组免疫细胞CyTOF数据上验证了该模型：（a）感染过西尼罗河病毒（WNV）的患者样本；（b）不同年龄的健康人样本。在每个数据集中，他们手动标注一个基线参考样本，并利用DeepCyTOF自动标注剩余未校准样本。结果表明，该方法与人工门控的结果一致性超过99%。此外，他们利用堆叠自编码器（DeepCyTOF的关键模块之一）在FlowCAP-I竞赛中完成半自动门控任务，结果优于其他参赛模型。总体而言，堆叠自编码器结合领域自适应策略可实现CyTOF与流式细胞术数据的高精度半自动门控，仅需手动标注一个参考样本，即可准确识别其余细胞类型。 4.2.2 DNA甲基化 技术的进步使得DNA甲基化得以在单细胞水平上检测。Angermueller等人提出了DeepCpG模型，一种基于卷积神经网络（CNN）的甲基化区域预测算法。DeepCpG由三个模块组成：DNA模块用于提取序列特征，CpG模块用于提取单细胞CpG邻域特征，多任务联合模块则整合二者信息以预测目标CpG位点的甲基化状态。该模型可用于多种下游任务，如推断低覆盖甲基化谱、识别与甲基化状态相关的DNA序列基序以及细胞间异质性。DeepCpG在小鼠与人类数据上均显著优于传统方法。 此外，DeepCpG还被应用于研究人诱导多能干细胞（iPSC）的分化过程，与转录组测序结合以识别外显子跳跃等可变剪接现象。Linker等人进一步表明，单细胞剪接变化可根据局部序列组成与基因组特征精确预测。利用DeepCpG的联合建模策略，他们建立了基于CpG与基因组信息的细胞类型特异性模型，并在细胞分化过程中揭示了DNA甲基化与剪接变化之间的关联，为单细胞水平的可变剪接机制提供了新见解。 另一项新兴的单细胞表观遗传测序方法是scATAC-seq（Assay of Transposase Accessible Chromatin sequencing），用于检测染色质开放区域。其通过Tn5转座酶标记并切割开放染色质区域，再通过双端测序实现高分辨率分析。scATAC-seq数据的预处理流程与scRNA-seq类似，但由于信号稀疏且近似二元（有信号/无信号），在分析上面临更高噪声与复杂性。当前已有多种scATAC分析工具，但普遍存在局限，尚无公认的标准流程。 scATAC-seq不仅能揭示细胞类型及可及区域差异，还可解析顺式调控元件（如启动子与增强子）和反式因子（如转录因子）之间的调控网络。然而，大多数现有工具仅将基因活性矩阵与转录组数据整合，而忽略了全基因组可及性的重要信息。针对整体ATAC-seq已有多种深度学习模型，例如LanceOtron的CNN峰值检测模型与CoRE-ATAC功能分类模型。后者在单核ATAC-seq数据上仍能保持较高准确率（平均精度从0.80下降至0.69），显示其良好的可迁移性。 由于scATAC-seq数据的二值特征，常规的变异基因选择（如PCA）不再适用，取而代之的是潜语义索引（LSI）等方法。然而，LSI为线性方法，难以捕捉峰值间复杂依赖。为此，Xiong等人提出了SCALE模型，结合深度生成框架与高斯混合模型（GMM）先验，以学习scATAC特征的非线性潜空间。SCALE不仅能实现去噪与缺失数据插补，还能在降维任务中优于PCA与LSI，并可扩展至约8万细胞的数据集。然而，其假设所有细胞的测序深度一致，且未考虑批次效应。 为解决这些问题，研究者进一步开发了SAILER模型。SAILER受VAE启发，设计为可扩展且具抗干扰能力的表示学习框架，能够从潜空间中剔除技术性混杂因素，同时保留生物学信号。该方法可处理百万级细胞数据，并在多样本整合中有效消除批次效应，从而构建无混淆的染色质可及性图谱。总体而言，SCALE与SAILER均为单细胞ATAC-seq数据的统一分析框架，兼具降噪、聚类与插补功能。 4.2.3 转录因子–基因关系预测 理解转录因子（TF）与基因间的调控关系对于揭示基因调控机制及细胞异质性至关重要。传统上，研究者利用基因表达数据推断基因间共表达关系、功能关联与调控通路。然而，这些任务通常需分别建模。深度学习方法则能够通过联合学习同时完成多任务，从而更有效地推断基因关系。 Yuan等人提出了卷积神经网络共表达模型（CNNC），这是一种基于CNN的基因关系推断方法。其核心思想是将基因对的共表达数据转化为共现直方图（类似图像），再通过CNN分析不同表达水平下的关联模式。CNNC可用于预测转录因子靶基因、识别疾病相关基因及推断调控路径，并能扩展整合其他组学数据以提升性能。该方法在推断TF–基因与蛋白–蛋白互作方面均优于传统模型，并可用于因果推断与功能分类任务。 Fu等人提出了单细胞因子分析网络（scFAN），用于预测单细胞水平的全基因组TF结合位点。scFAN首先在整体数据上预训练模型，然后结合DNA序列、聚合的scATAC-seq数据及可映射性信息预测细胞层面的TF结合。该方法克服了scATAC-seq稀疏与噪声限制，能准确识别富含特定序列基序的结合峰，并提出“TF活性评分”用于细胞类型分类。结果显示，scFAN能在单细胞尺度上将开放染色质状态与TF结合活性联系起来，为理解细胞调控动态提供了有力工具。 图5 | DeepCpG模型示意图（引自Angermueller等人）。 (a) 由Smallwood等人开发的scBS-seq与Farlik等人提出的scRRBS-seq可获得稀疏的单细胞CpG甲基化图谱，这些数据经过预处理后被编码为二值形式：甲基化位点标记为1，未甲基化位点标记为0，而甲基化状态未知（缺失数据）的CpG位点以问号表示。(b) 在DNA模块中，模型通过两个卷积层与池化层检测局部序列上下文中的预测性基序，并利用一个全连接层对不同基序间的相互作用进行建模。在CpG模块中，采用双向门控循环单元（GRU）扫描多个细胞的CpG邻域（图中每行代表一个细胞），并将提取的信息压缩为固定长度的向量。联合模型进一步学习DNA模块与CpG模块生成的高层特征之间的关联，以预测所有细胞的甲基化状态。(c, d) 经过训练后的DeepCpG模型可用于多种下游任务，例如全基因组范围内的CpG位点缺失值插补（c），以及识别与DNA甲基化水平或细胞间变异相关的DNA序列基序（d）。 4.2.4 拷贝数变异（CNV）与单核苷酸多态性（SNP）预测 全基因组关联分析（GWAS）是鉴定遗传生物标志物（如单核苷酸多态性SNP和拷贝数变异CNV）的标准方法，这些标志物通常与疾病或性状相关。CNV指相较于参考基因组被重复或缺失的DNA片段，长度通常超过1000个碱基对。然而，GWAS在处理CNV与SNP时面临高维度数据带来的挑战：由于需进行大量单独关联检验，必须采用严格的显著性阈值以控制错误率，从而削弱了检测灵敏度。虽然已有多项研究表明深度学习（DL）可应用于基因组数据，但针对CNV集合构建的DL研究仍较有限。 目前，已有多种用于检测单细胞DNA数据中CNV的方法，如dudeML、DeepCNV、RDAClone和rcCAE。dudeML是一种基于深度学习的CNV检测方法，能在低覆盖度样本中准确识别CNV，尤其适用于样本混合或测序深度不足的情况。传统CNV检测通常依赖启发式规则和人工筛选，但在大样本条件下，人工区分真阳性与假阳性既耗时又易产生偏差。DeepCNV通过层次结构压缩高维数据，使其自动化地完成过滤过程，从而减少主观干扰。RDAClone是一种基于自编码器的非线性深度学习模型，可应用于基因组学分析，也能扩展至细胞与基因网络建模。rcCAE方法则利用卷积自编码器从单细胞DNA测序（scDNA-seq）数据中学习细胞的潜在表示，同时提升测序读数质量，有效去除非生物学噪声，从而在低维空间中准确识别细胞亚群及其拷贝数变化。 总体而言，基于深度学习的单细胞基因组分析展现出巨大潜力，能够推动对DNA结构复杂性及表观遗传机制与疾病关系的理解。由于单细胞基因组数据固有的稀疏性、噪声及高维特征，构建更强健的DL模型对于推进该领域的发展至关重要。 4.3 深度学习在空间转录组学中的应用 # 自被评为“年度方法”以来，空间转录组学（Spatial Transcriptomics，ST）已成为单细胞RNA测序（scRNA-seq）的自然延伸，能在不解离组织的情况下实现全转录组范围的空间表达分析。ST为传统RNA测序添加了空间信息，有望弥合细胞状态刻画与组织结构复杂性之间的鸿沟。通过在保留细胞空间位置的同时测定基因表达，ST揭示了细胞间相互作用、器官功能及病理变化，为组织层级的生物学研究带来新的视角。 当前空间分辨的转录组技术可分为两类：（i）实现单细胞分辨率的循环RNA成像技术；（ii）基于阵列的空间RNA测序技术，如Visium、Slide-seq及高清空间转录组（HDST）。前者能精确定位细胞但多重检测能力有限，后者则利用微阵列或微珠阵列在组织切片上捕获mRNA，实现高通量测序。由于阵列捕获信号可能覆盖多个细胞，测得的信号通常为多细胞混合表达。因此，需要计算方法将单细胞转录组与空间信息整合，以在组织中重建高分辨细胞分布。 Lähnemann等人指出，识别空间基因表达模式是单细胞组学计算中的核心挑战之一，这类模式有助于揭示细胞群体的空间分布、标志基因及稀有细胞亚群。此外，ST能将基因表达与组织图像结合，使研究者利用图像处理技术分析组织形态特征，从而更精确地推断组织结构与基因功能的对应关系。 近年来，出现了一系列基于深度学习的ST分析模型。Xu等人提出DeepST框架，可识别空间结构域，在人脑前额叶皮层及乳腺癌组织数据中均优于传统方法。DeepST不仅能整合多批次及多平台数据，还可扩展至其他空间组学类型。Maseda等人开发了DEEPsc算法，可利用参考空间图谱为scRNA-seq数据推断空间位置信息，在斑马鱼、果蝇、大脑皮层及卵泡系统中表现出高精度与稳健性。Biancalani等人提出Tangram框架，可将scRNA-seq或单核RNA-seq数据与组织空间信息精确映射，生成高分辨基因表达空间图谱。 Tan等人开发了SpaCell工具，结合组织空间条码的基因表达与像素强度信息，实现高分辨图像预测与细胞类型识别。Fu等人提出SEDR模型，将空间信息与转录组数据共同嵌入，通过变分图自编码器构建低维潜在空间，提升了聚类准确度并成功重建人脑发育轨迹。O’Connor等人提出的DeLTA 2.0系统则利用深度卷积神经网络自动分析细胞图像，实现无人工干预的基因表达与生长追踪。 尽管ST的深度学习模型仍处早期阶段，但随着数据规模增长与图像技术发展，DL有望成为ST数据整合与分析的核心方法，其未来将大量借鉴计算机视觉领域的创新。 4.4 单细胞转录组与空间转录组整合（空间去卷积） # 由于空间转录组信号通常来源于多个细胞的混合，且无法精确对应细胞边界，因此需结合scRNA-seq数据进行解卷积分析，以推断各空间位置中不同细胞类型的比例。SPOTlight模型采用带标记的非负矩阵分解（NMF）回归方法进行空间信号去卷积，通过细胞类型特异性基因表达特征拟合每个位置的基因计数。尽管SPOTlight在准确度和效率上表现良好，但在整合不同批次或平台数据方面仍有限制。 Stereoscope模型采用负二项分布建模基因表达计数，利用贝叶斯推断估计每种细胞类型在不同空间点的贡献。其后，Cell2location进一步扩展该框架，引入超参数以调节不同技术间的灵敏度差异，提高跨平台整合性能。Lopez等人提出的DestVI模型利用变分推断实现多分辨率空间分析，可在不同位置推断每种细胞类型的基因表达变化，并在肿瘤模型中精确重建空间组织结构。 4.5 深度学习在单细胞多组学整合中的应用 # 单细胞测序（sc-seq）能在单细胞层面测定DNA与RNA，被选为2013年度方法。随着技术进步，多组学测定成为可能，使研究者能在同一样本中同时获取多种分子层面的信息。多组学整合可连接不同生化维度的数据，放大关键生物信号，为药物响应预测、基因依赖性推断及疾病分型提供新思路。 深度学习在多组学整合中的优势在于其高度灵活的结构和跨模态建模能力。例如，Zuo等人提出的scMVAE模型利用三种联合学习策略同时整合scRNA-seq与scATAC-seq数据，生成非线性联合嵌入表示，显著优于传统VAE模型。Amodio等人提出的MAGAN模型通过生成对抗网络（GAN）实现不同组学流形的对齐，用于CyTOF与scRNA-seq数据整合。其他模型如UnionCom、SMILE、SCIM及GLUER则利用图匹配、互信息学习与神经网络映射实现跨模态数据融合。 近年来的代表性模型包括scArches与ExpiMap。前者利用迁移学习实现参考与查询数据集的高效整合，后者基于条件VAE，在保持生物学可解释性的同时显著提升跨物种与跨组织整合能力。 5 结论与展望 # 总体而言，深度学习正推动单细胞数据分析进入快速发展阶段。然而，该领域亟需系统化的基准研究，以比较不同模型在复杂数据集上的表现。目前，大多数研究仅在特定数据上展示优越性，缺乏对模型适用场景与局限性的深入分析。未来，需进一步明确不同DL结构在特定任务中的性能优势，并建立标准化的人类细胞图谱以实现全面验证。 尽管当前单细胞测序数据集规模相对较小，但随着数据共享与技术普及，深度学习模型将在更大规模的生物样本中展现潜力。迁移学习等策略将进一步促进模型知识迁移，使研究者能在有限数据条件下获得可靠结果。 此外，多组学整合与空间组学的发展将推动DL方法在揭示疾病机制、细胞互作及病理演化中的应用。未来，具有生物学可解释性与跨模态泛化能力的DL模型将成为生命科学研究的重要工具，助力精准医学与系统生物学的深入发展。 往期精彩： JMC 2025 | 基于结构的三维小分子药物生成：我们到哪一步了？ NeurIPS 2023 | LinkerNet：基于三维等变扩散的片段构象与连接体协同设计 NMI 2022 | MoLFormer: 大规模化学语言表征能够捕捉分子结构与性质 写作：Z 排版：Barry 文献综述 · 目录 继续滑动看下一个 MolAstra 向上滑动看下一个 闪记 复制 LaTeX 公式","tags":["clippings"],"section":"literature","sectionTitle":"文献整理","category":"网页文献","updated":"2026-10-25T17:37:28.561Z","url":"literature/notes/dcbeeb4ea407709ecf54411c.html"},{"kbId":"KB-000019","title":"Multi-omics single-cell data integration and regulatory inference with graph-linked embedding","subtitle":"","summary":"Despite the emergence of experimental methods for simultaneous measurement of multiple omics modalities in single cells, most single-cell datasets include only one modality. A major obstacle in integrating omics data from multiple modalities is that different omics layers typically have distinct feature spaces. Here, we propose a computational framework called GLUE (graph-linked unified embedding), which bridges the gap by modeling regulatory interactions across omics layers explicitly. Systematic benchmarking demonstrated that GLUE is more accurate, robust and scalable than state-of-the-art tools for heterogeneous single-cell multi-omics data. We applied GLUE to various challenging tasks, including triple-omics integration, integrative regulatory inference and multi-omics human cell atlas construction over millions of cells, where GLUE was able to correct previous annotations. GLUE features a modular design that can be flexibly extended and enhanced for new analysis tasks. The full package is available online at https://github.com/gao-lab/GLUE . Different single-cell data modalities are integrated at atlas-scale by modeling regulatory interactions.","body":"摘要 LLM 归库摘要 核心内容： 本文提出 GLUE（graph-linked unified embedding）框架，用图引导的统一嵌入整合非配对单细胞多组学数据，并同步进行调控推断。 方法要点： 为不同组学分别建立自编码器，用指导图显式编码跨组学调控关系，再通过对抗对齐获得共享细胞嵌入。 主要结果： 在 scRNA-seq、scATAC-seq 与 DNA 甲基化等场景下，GLUE 在准确性、鲁棒性、可扩展性和 atlas 级整合上均优于多种基线方法。 可复用知识： 可作为“非配对单细胞多组学整合 + 调控网络推断”的代表性方法论文，也适合对比 Seurat、LIGER、Harmony、SCENIC、Cicero 等工具链。 与当前研究的关系： 对单细胞转录组/染色质可及性联合分析、细胞图谱整合、调控关系挖掘具有直接参考价值，可迁移到口腔组织或肿瘤微环境多组学研究设计中。 关联页面建议： 后续可整合到 02 文献精读与汇报库/02_wiki/methods/单细胞多组学整合 或相关综述主题页。 扩展整理： 02 文献精读与汇报库/01_sources/papers/文献/2022-05-NatBiotechnol-GLUE-单细胞多组学-调控推断/Multi-omics single-cell data integration and regulatory inference with graph-linked embedding 下一步处理： 如需做深度精读、方法拆解、图表摘录或与现有项目对照，建议继续走 paper-import-workflow 。 归库说明： 分类到 02 文献精读与汇报库，置信度 0.98，依据为明确论文来源、完整论文章节和方法学主题。 抽象的 # 尽管单细胞多组学模态同步测量的实验方法已经出现，但大多数单细胞数据集仅包含一种模态。整合多模态组学数据的主要障碍在于，不同的组学层通常具有不同的特征空间。本文提出了一种名为 GLUE（图链接统一嵌入）的计算框架，它通过显式地建模跨组学层的调控相互作用来弥合这一差距。系统性的基准测试表明，对于异构单细胞多组学数据，GLUE 比现有最先进的工具更准确、更稳健、更具可扩展性。我们将 GLUE 应用于各种具有挑战性的任务，包括三组学整合、整合调控推断以及基于数百万个细胞的多组学人类细胞图谱构建，GLUE 能够修正先前的注释。GLUE 采用模块化设计，可以灵活扩展和增强以适应新的分析任务。完整的软件包可在 https://github.com/gao-lab/GLUE 在线获取。 玩 # 单细胞测序技术的最新进展使得通过多组学层面（例如染色质可及性（单细胞 ATAC 测序 (scATAC-seq) [^1] [^2] ）、DNA 甲基化（snmC-seq [^3] 、sci-MET [^4] ）和转录组（scRNA-seq [^5] [^6] ））探测调控图谱成为可能，为揭示不同细胞类型功能的潜在调控机制提供了独特的机会 [^7] 。尽管同步检测技术近期已出现 [^8] [^9] [^10] [^11] ，但不同组学数据通常是独立测量的，产生的是非配对数据，因此需要高效的计算机多组学整合方法 [^12] [^13] 。 在计算方面，整合非配对多组学数据（也称为对角整合）面临的一个主要障碍是不同模态的特征空间存在差异（例如，scATAC-seq 中的可及染色质区域与 scRNA-seq 中的基因） [^14] 。一种快速解决方法是基于先验知识将多模态数据转换为一个公共特征空间，然后应用单组学数据整合方法 [^15] [^16] [^17] [^18] 。这种显式的“特征转换”方法虽然简单直接，但据报道会导致信息丢失 [^19] 。基于耦合矩阵分解的算法可以避免显式转换，但几乎无法处理超过两个组学层的数据 [^20] [^21] 。另一种方法是通过非线性流形比对来匹配来自不同组学层的细胞，这完全消除了对先验知识的需求，并且理论上可以减少模态间的信息丢失 [^22] [^23] [^24] [^25] ；然而，这种技术主要应用于细胞类型数量有限的小型数据集。 数据量不断增长是另一个严峻的挑战 [^26] 。近年来发展起来的技术能够常规地生成包含数百万个单元格的数据集 [^27] [^28] [^29] ，而目前的集成方法仅应用于规模小得多的数据集 [^15] [^17] [^20] [^21] [^22] [^23] 。为了跟上数据吞吐量的增长，计算集成方法的设计应充分考虑可扩展性。 本文介绍了一种名为 GLUE（图链接统一嵌入）的模块化框架，用于整合非配对的单细胞多组学数据并同时推断调控相互作用。GLUE 通过显式地对跨组学层的调控相互作用进行建模，以生物学上直观的方式弥合了不同组学特征空间之间的鸿沟。系统性的基准测试和案例研究表明，GLUE 对异构单细胞多组学数据具有准确性、鲁棒性和可扩展性。此外，GLUE 被设计成一个通用框架，可以以模块化的方式轻松扩展并快速应用于特定场景。GLUE 可在 https://github.com/gao-lab/GLUE 公开访问。 结果 # 基于图引导嵌入的非配对多组学整合 # 受先前研究的启发，我们将细胞状态建模为通过变分自编码器学习的低维细胞嵌入 [^30] [^31] 。鉴于它们在生物学性质和检测技术方面的内在差异，每个组学层都配备了一个单独的自编码器，该自编码器使用针对特定层特征空间量身定制的概率生成模型（图 1 和 方法 ）。 图 1：GLUE 框架的架构。 利用已有的生物学知识，我们提出使用一种基于知识的图谱（“指导图”），该图谱显式地建模跨层调控相互作用，以连接各层特异性特征空间；图中的顶点对应于不同组学层的特征，边代表有符号的调控相互作用。例如，在整合单细胞 RNA 测序（scRNA-seq）和单细胞 ATAC 测序（scATAC-seq）数据时，顶点是基因和可及染色质区域（即 ATAC 峰），一条正边可以连接一个可及区域及其假定的下游基因。然后，以图 [^32] 编码的特征嵌入为指导，对细胞进行对抗性多模态比对，这是一个迭代优化过程（图 1 和 方法部分 ）。值得注意的是，当迭代过程收敛时，可以利用比对过程的输入来优化该图谱，并将其用于面向数据的调控推断（详见下文）。 系统性基准测试表明其性能优异 # 我们首先使用最近同步 scRNA-seq 和 scATAC-seq 技术生成的三个黄金标准数据集（SNARE-seq [^8] 、SHARE-seq [^9] 和 10X Multiome [^34] ）以及两个非配对数据集（Nephron [^35] 和 MOp [^36] ）对 GLUE 与多种流行的非配对多组学整合方法 15,16,17,18,23,24,25,33 进行了基准测试。 有效的整合方法应匹配来自不同组学层的相应细胞状态，从而生成能够忠实保留生物学变异且组学层混合良好的细胞嵌入。与其他方法相比，GLUE 同时实现了高水平的生物学保留和组学混合（图 2a ，分别由扩展数据图 1 所示的三个独立指标量化），并且在所有基准数据集上，其总体得分始终是最佳方法（图 2b ，有关指标聚合的详细信息，请参见 “方法 ”部分）；这些结果也通过对齐细胞嵌入的均匀流形近似和投影 (UMAP) 可视化得到了验证（补充图 1-5 ） 。 图 2：集成性能的系统基准。 理想的整合方法不仅应在细胞类型层面，而且应在更精细的尺度上产生精确的比对结果。利用黄金标准数据集中真实的细胞间对应关系，我们进一步通过 FOSCTTM（比真实匹配更接近的样本比例）指标 [^25] 量化了单细胞水平的比对误差。在所有三个数据集上，GLUE 均实现了最低的 FOSCTTM 值，与每个数据集上的第二佳方法相比，其比对误差显著降低（图 2c ，SNARE-seq 数据集降低了 3.6 倍，SHARE-seq 数据集降低了 1.7 倍，10X Multiome 数据集降低了 1.5 倍）。 在上述评估过程中，我们采用了一种标准方案（如果 ATAC 峰与 RNA 基因在基因体或近端启动子区域重叠，则将它们关联起来）来构建 GLUE 的指导图，并用于其他基于转换的方法的特征转换。鉴于我们目前对调控相互作用的了解仍然远非完美，一个有效的整合方法必须能够应对此类误差。因此，我们通过随机替换不同比例的现有相互作用，进一步评估了这些方法对调控相互作用数据错误（例如不存在的相互作用）的鲁棒性。对于所有三个数据集，即使在高达 90%的错误率下，GLUE 的性能变化也最小（图 2d 和扩展数据图 2a ），表明其具有卓越的鲁棒性。同样，我们发现使用在更大基因组窗口中定义的替代指导图对整合性能的影响微乎其微（扩展数据图 2b、c ）。 鉴于 GLUE 基于神经网络的特性，在处理小型数据集时可能会出现欠训练的情况。因此，我们使用不同大小的子采样数据集重复了评估。即使只有 2000 个细胞，GLUE 仍然是排名最高的算法，但当数据量减少到少于 1000 个细胞时，对齐误差急剧增加（图 2e 和扩展数据图 2d ）。此外，我们还注意到，GLUE 的集成性能在各种超参数和特征选择设置下都表现出良好的鲁棒性（扩展数据图 3 和图 4 ）。除了细胞嵌入之外，GLUE 的特征嵌入也对超参数设置、先验知识的破坏和数据子采样表现出相当强的鲁棒性（扩展数据图 5 ）。 除了组学层之间的系统性差异外，单细胞数据还常常受到同一层内批次效应的影响。例如，SHARE-seq 数据在四个文库中进行处理，其中一个文库在 scRNA-seq 中与其他三个文库相比显示出批次效应（补充图 6a ）；而肾单位数据分析了四个供体，所有供体在 scRNA-seq 和 scATAC-seq 中均显示出显著的批次效应（补充图 7a,c ）。为了解决此类复杂情况，GLUE 通过将批次作为解码器协变量纳入其中，提供了批次校正功能（ 方法 ）。启用批次校正后，GLUE 能够有效地校正这些批次效应，从而显著改善批次混合（补充图 6b 和补充图 7b,d ）。为了防止过度校正（例如，在强制整合缺乏共同细胞状态的数据集时），我们设计了一种称为整合一致性评分的诊断指标，用于衡量整合后的多组学空间与指导图中的先验知识之间的一致性（ 方法 ）。我们观察到，整合来自不一致组织的数据时，其评分显著低于整合同一组织内的数据（接近于 0），这使其成为衡量整合质量的可靠指标（扩展数据图 6 ）。 GLUE 可实现有效的三组学整合 # 得益于模块化设计和可扩展的对抗比对，GLUE 可以轻松扩展到两个以上的组学层。作为案例研究，我们使用 GLUE 整合了成年小鼠皮层神经元细胞的三个不同的组学层，包括基因表达 [^37] 、染色质可及性 [^38] 和 DNA 甲基化 [^3] 。 与染色质可及性不同，基因体 DNA 甲基化在神经元细胞中通常与基因表达呈负相关 [^39] 。GLUE 通过在引导图中对边的符号进行建模，原生支持多种调控效应的混合。这种策略避免了数据反转，而数据反转是先前方法 [^16] [^17] 所必需的，并且会破坏数据的稀疏性和潜在的分布。对于三组学引导图，我们通过负边将基因体 mCH 和 mCG 水平与基因连接起来，而可及区域与基因之间的正边保持不变。 GLUE 比对成功揭示了三个组学层中共享的细胞状态流形（图 3a-d ）。值得注意的是，原始细胞类型的注释分辨率并不相同，许多细胞类型即使在单个组学层内也能进一步聚类成更小的亚型（补充图 8a-f ）。为了统一细胞类型注释，我们使用整合的细胞嵌入进行了基于邻近的标签转移，并观察到 14 种映射细胞类型中的 12 种具有高度显著的标记重叠（图 3e ，三维 Fisher 精确检验 [^40] ，错误发现率(FDR) \u003c 5 × 10⁻¹}）（补充图 8g-o 和 9 以及 方法 ），表明比对结果可靠。 GLUE 比对有助于改善所有组学层中的细胞分型效果，包括将 scRNA-seq 'MGE' 簇进一步划分为 Pvalb + ('mPv') 和 Sst + ('mSst') 亚型（图 3 和补充图 8 中用绿色圆圈/流式标记），将 scRNA-seq 'CGE' 簇和 scATAC-seq 'Vip' 簇划分为 Vip + ('mVip') 和 Ndnf + ('mNdnf') 亚型（图 3 和补充图 8 中用深蓝色圆圈/流式标记），以及将 snmC-seq 'mDL-3' 细胞和部分 scATAC-seq 'L6 IT' 细胞鉴定为屏状核细胞（图 3 和补充图 8 中用浅蓝色圆圈/流式标记）。 8 ）。 图 3：小鼠皮层的三组学整合。 这种三组学整合也揭示了不同表观遗传调控机制的定量贡献（ 方法 ）。在 mCH、mCG 和染色质可及性中，我们发现 mCH 水平对皮层神经元基因表达的预测能力最高（平均 R 2 = 0.187）。当考虑所有表观遗传层时，表达预测能力进一步提高（平均 R 2 = 0.236），表明存在非冗余的贡献（图 3f ）。在不同层的神经元中，DNA 甲基化（尤其是 mCH）对深层神经元基因表达的预测能力略高于浅层神经元（补充图 10a ）。在所有基因中，不同表观遗传层之间的基因表达预测能力普遍相关（补充图 10b ）。我们也观察到基因特征与预测能力之间存在不同的关联。例如，mCH 对较长基因的表达预测能力更高，这与之前的研究结果一致 [^17] [^41] ，而染色质可及性对表达变异性较高的基因贡献更大（补充图 10c ）。我们还使用在线 iNMF 重复了相同的分析，iNMF 是目前唯一能够同时整合三个组学层的方法，但其细胞类型分辨率和表观遗传相关性均显著降低（补充图 11 ）。 利用 GLUE 进行整合调控推断 # GLUE 中显式建模调控相互作用的图的引入，进一步实现了类似贝叶斯的方法，该方法结合了先验知识和观测数据进行后验调控推断。具体而言，由于特征嵌入旨在同时重建基于知识的指导图和单细胞多组学数据（图 1 ），它们的余弦相似度应反映来自这两个方面的信息，我们将其作为“调控评分”。 作为演示，我们使用了来自 10X 的官方外周血单核细胞多组数据集 [^34] ，并将其作为非配对的单 细胞 RNA 测序 (scRNA-seq) 和单细胞 ATAC 测序 (scATAC-seq) 数据输入到 GLUE 中。为了捕获远程顺式调控相互作用，我们使用了一个长程引导图，该图连接了 150 kb 窗口内的 ATAC 峰和 RNA 基因，并以幂律函数加权，该函数模拟染色质接触概率 [^42] [^43] （ 方法 ）。细胞嵌入的可视化证实了 GLUE 比对的正确性和准确性（补充图 12a,b ）。正如预期的那样，我们发现调控评分与基因组距离呈负相关（图 4a ），与经验峰-基因相关性（使用配对细胞计算，图 4b ）呈正相关，并且在不同的随机种子下均具有稳健性（补充图 12c ）。 图 4：外周血单核细胞中的整合调控推断。 为了进一步评估该评分是否反映了实际的 顺式 调控相互作用，我们将其与外部证据进行了比较，包括 pcHi-C [^44] 和 eQTL [^45] 。在所有距离范围内，pcHi-C 支持的峰-基因对的 GLUE 调控评分均较高（图 4a ），并且比经验峰-基因相关性（图 4b ）以及基于共可及性的调控预测方法 LASSO 和 Cicero [^43] 更能有效地预测 pcHi-C 相互作用（图 4c 和补充图 12d ）。eQTL 也呈现出相同的结果（补充图 12e-h ）。 GLUE 框架还允许通过引导图直观地整合额外的调控证据，例如 pcHi-C。因此，我们进一步使用包含距离加权互作以及 pcHi-C 和 eQTL 支持的互作的复合引导图训练模型（补充图 13 ）。通过将其与从随机打乱的特征嵌入中获得的零分布进行比较来评估调控评分的显著性（ 方法 ）。正如预期的那样，虽然多组学比对对引导图的变化不敏感，但推断的调控互作显示出 pcHi-C 和 eQTL 的更强富集（补充图 13a-d ）。即使这些互作在引导图中受到干扰，也能稳健地恢复大部分同时受到 pcHi-C、eQTL 和相关性支持的高置信度互作（FDR \u003c 0.05）（补充图 13e ）。此外，GLUE 衍生的转录因子 (TF) 靶基因网络（ 方法 ）与 TRRUST v2 数据库中手动整理的连接相比，与单个基于证据的网络相比，显示出更高的一致性（补充图 13f 和补充图 14 和补充数据 2 ）。 我们注意到，GLUE 推断的 顺式 调控相互作用可以为已知转录因子-靶标对的调控机制提供线索。例如，SPI1 是 NCF2 基因的已知调控因子，两者在单核细胞中均高表达（补充图 15a,b ）。GLUE 利用多种证据识别出 NCF2 的三个远端调控峰，分别位于转录起始位点（TSS）下游约 120 kb、下游约 25 kb 和上游约 20 kb 处（图 4d ），所有这些调控峰均与 SPI1 结合。同时，大多数推定的调控相互作用此前未知。例如， CD83 与三个调控峰相关联（两个位于 TSS 上游约 25 kb 处，一个位于 TSS 上游约 10 kb 处），这些调控峰富集了三个转录因子（BCL11A、PAX5 和 RELB）的结合（图 4e ）。 CD83 在单核细胞和 B 细胞中均高表达，但推断的转录因子（TFs）的表达模式更为局限（补充图 15c-f ），提示其活性调控因子可能因细胞类型而异。补充图 16 展示了更多 GLUE 推断的调控相互作用实例。 利用 GLUE 对数百万个细胞进行 Atlas 级集成 # 随着技术的不断发展，单细胞实验的通量也在不断提高。近期研究已构建了包含数百万个细胞的人类基因表达 [^28] 和染色质可及性 [^29] 细胞图谱。由于数据量庞大、异质性极高、每个细胞的覆盖率低以及细胞类型组成不平衡等问题，这些图谱的整合对计算方法提出了巨大的挑战，目前尚未在单细胞水平上实现。 GLUE 是一种采用小批量优化算法的神经网络，具有优异的可扩展性和亚线性时间成本，有望应用于图谱规模（补充图 17a ）。我们利用高效的 GLUE 多阶段训练策略（ 方法部分 ），成功地将基因表达和染色质可及性数据整合到一个统一的多组学人类细胞图谱中（图 5 ）。 图 5：多组学人类细胞图谱的整合。 虽然比对后的图谱与原始注释基本一致 [^29] （补充图 17c-e ），但我们也注意到一些差异。例如，在 scATAC-seq 中最初注释为“星形胶质细胞”的细胞，在 scRNA-seq 中被比对到“兴奋性神经元”簇（补充图 17 中以粉色圆圈/流线突出显示）。进一步检查发现，该簇中典型的放射状胶质细胞标记物，如 PAX6 、 HES1 和 HOPX [^47] [^48] ，在 RNA 和 ATAC 结构域均有活跃转录（补充图 18 ），并且在神经元和胶质细胞标记物处也检测到了染色质启动 [^9] （补充图 19-21 ），这表明该簇由多能神经祖细胞（可能是放射状胶质细胞标记物）组成 ， 而不是最初注释的兴奋性神经元或星形胶质细胞。基于 GLUE 的整合方法还解决了几个注释不明确的 scATAC-seq 簇。例如，“星形胶质细胞/少突胶质细胞”簇被拆分为两部分，并分别与 scRNA-seq 的“星形胶质细胞”和“少突胶质细胞”簇比对（在补充图 17 中分别用蓝色和棕色圆圈/流线突出显示），这也得到了标记表达和可及性分析的支持（补充图 20 和 21 ）。这些结果展示了图谱级多组学整合的独特价值，它能够在不损失单细胞分辨率的情况下，以无偏倚、数据导向的方式跨模态进行细胞分型。特别是，引入批次校正可以进一步实现以整合图谱为全局参考的新数据集的有效整理 [^49] 。 相比之下，我们也尝试使用在线 iNMF 进行数据整合，这是唯一能够全尺度整合数据的方法，但结果远非最佳（补充图 22a、b 和 23 ）。同时，尝试使用常用的 Seurat v3 方法将数据作为聚合元单元进行整合（ 方法 ）也失败了（补充图 22c、d ）。 讨论 # GLUE 框架结合了组学特异性自编码器、基于图的耦合和对抗比对，能够以卓越的准确性和鲁棒性整合非配对单细胞多组学数据。通过显式地建模跨组学层的调控相互作用，GLUE 独特地支持对非配对多组学数据集进行整合调控推断。值得注意的是，在贝叶斯解释中，GLUE 的调控推断可以被视为后验估计，并可根据新数据的到来不断进行改进。 非配对多组学整合在概念上与批次效应校正 [^50] 有一些相似之处，但前者由于具有独特的、组学特有的特征空间而更具挑战性。虽然特征转换看似是一个简单的解决方案，但不可避免的信息损失 [^19] 可能会造成不利影响。Seurat v3（参考文献 [^15] ）和 bindSC [^33] 也设计了启发式策略，除了转换后的数据外，还利用了原始特征空间中的信息，这或许可以解释它们比未采用这些策略的方法性能更优的原因 [^16] [^17] 。同时，已知的细胞类型也被用于通过（半）监督学习来指导整合 [^51] [^52] ，但这种方法在适用性方面存在很大的局限性，因为这种监督通常不可用，而且在许多情况下，这种监督本身就是多组学整合的目的 [^29] 。值得注意的是，其中一种方法采用了类似的自编码器架构和对抗比对 [^52] ，但它依赖于匹配的细胞类型或聚类来指导比对方向。事实上，GLUE 与耦合矩阵分解方法 [^20] [^21] 在概念上更为相似，但性能更优，这主要得益于其基于深度生成模型的设计。 我们注意到，当前框架也适用于整合具有共享特征的组学层（例如，scRNA-seq 和空间转录组学之间的整合 [^53] [^54] ），方法是在指导图中为共享特征使用相同的顶点或连接的代理顶点。此外，还可以通过链接不同组学层的编码器和解码器来实现交叉插补。然而，鉴于最近有报告指出数据插补可能会引入人为误差并降低基因调控推断的准确性 [^55] ，因此该功能可能需要进一步研究。 GLUE 作为一个通用框架，采用模块化设计，其中数据和图自编码器可以独立配置。 近年来，实验性多组学技术的进步提高了配对数据的可用性 [^8] [^9] [^10] [^11] [^34] 。尽管目前大多数同步多组学方案的数据质量或通量仍低于单组学方法 [^64] ，但配对细胞在锚定不同组学层方面具有极高的信息价值，因此应尽可能与非配对细胞结合使用。扩展 GLUE 框架以纳入此类配对信息是直接的，例如，可以通过添加损失项来惩罚配对细胞之间的嵌入距离 [^65] 。这种扩展最终可能为嵌合体整合的一般情况提供解决方案 [^14] 。 除了多组学整合之外，我们还注意到 GLUE 框架可能适用于跨物种整合，尤其是在涉及远缘物种且一对一直系同源基因有限的情况下。具体而言，我们可以将所有直系同源基因编译成 GLUE 指导图，并在无需显式进行直系同源基因转换的情况下进行整合。在这种情况下，GLUE 方法在概念上也可以与最近一项名为 SAMap 的工作相联系 [^66] 。 最后，我们注意到，当前 GLUE 模型推断的调控相互作用是基于整个输入数据集，并且可能是多个时空特异性回路的聚合，尤其对于来自不同组织的数据（例如，图谱）而言更是如此。同时，我们注意到，与粗尺度全局模型（例如，全图谱整合模型）并行，可以通过在来自单个组织的细胞上训练专用模型来进行更精细尺度的调控推断，并可能结合时空特异性先验知识 [^67] 。这种“逐步细化”的扩展将有效地帮助识别时空特异性调控回路和关键调控因子。 我们相信，GLUE 作为一个模块化且通用的框架，为通过大规模多组学整合在单细胞分辨率下有效构建基因调控图谱提供了前所未有的机遇。GLUE 的完整软件包，包括教程和演示案例，均可在 https://github.com/gao-lab/GLUE 在线获取，供社区使用。 方法 # GLUE 框架 # $p \\left(\\right. \\mathbf{x} {k} ; \\theta {k} \\left.\\right) = \\int p \\left(\\right. \\mathbf{x} {k} \\left|\\right. \\mathbf{u} ; \\theta {k} \\left.\\right) p \\left(\\right. \\mathbf{u} \\left.\\right) d \\mathbf{u}$ $$ \\begin{array}{*{20}{c}} {p\\left( {{{{\\mathbf{x}}}}_k;\\theta _k} \\right) = {\\int} p \\left( {{{{\\mathbf{x}}}}_k|{{{\\mathbf{u}}}};\\theta _k} \\right)p\\left( {{{\\mathbf{u}}}} \\right){\\mathrm{d}}{{{\\mathbf{u}}}}} \\end{array} $$ (1) $\\mathcal{L} {\\mathcal{X} {k}} \\left(\\right. \\phi_{k} , \\theta_{k} \\left.\\right) \u0026 = \u0026 \\mathbb{E} {\\mathbf{x} {k} sim p_{d a t a} \\left(\\right. \\mathbf{x} {k} \\left.\\right)} \\left[\\right. \\mathbb{E} {\\mathbf{u} sim q \\left(\\right. \\mathbf{u} \\left|\\right. \\mathbf{x} {k} ; \\phi {k} \\left.\\right)} log ⁡ p \\left(\\right. \\mathbf{x} {k} \\left|\\right. \\mathbf{u} ; \\theta {k} \\left.\\right) \\ - K L \\left(\\right. q \\left(\\right. \\mathbf{u} \\left|\\right. \\mathbf{x} {k} ; \\phi {k} \\left.\\right) \\parallel p \\left(\\right. \\mathbf{u} \\left.\\right) \\left.\\right) \\left]\\right.$ $$ \\begin{array}{rcl}{{{\\mathcal{L}}}}_{{{{\\mathcal{X}}}}_k}\\left( {\\phi _k,\\theta k} \\right) \u0026 = \u0026 {\\Bbb E} {{{{\\mathbf{x}}}} k \\sim p {{{{\\mathrm{data}}}}}\\left( {{{{\\mathbf{x}}}} k} \\right)}\\left[ {{\\Bbb E} {{{{\\mathbf{u}}}} \\sim q\\left( {{{{\\mathbf{u}}}}|{{{\\mathbf{x}}}}_k;\\phi _k} \\right)}\\log p\\left( {{{{\\mathbf{x}}}}_k|{{{\\mathbf{u}}}};\\theta _k} \\right)}\\right. \\ \u0026\u0026 \\left.{ - {{{\\mathrm{KL}}}}\\left( {q\\left( {{{{\\mathbf{u}}}}|{{{\\mathbf{x}}}}_k;\\phi _k} \\right)\\parallel p\\left( {{{\\mathbf{u}}}} \\right)} \\right)} \\right]\\end{array} $$ (2) 由于不同的自编码器是独立参数化并在不同的数据上训练的，因此，除非正确连接，否则为不同组学层学习到的细胞嵌入可能具有不一致的语义含义。 我们将引导图视为观测变量，并将其建模为由低维特征潜在变量（即特征嵌入） $\\mathbf{v} {i} \\in \\mathbb{R}^{m} , i \\in \\mathcal{V}$ 生成。此外，与之前的模型不同，我们现在将 x k 建模为由特征潜在变量 $\\mathbf{v} {i} \\in \\mathbb{R {\\mathbf{u}}}};\\psi } \\right)} \\end{array} $$ (22) 其中归一化器为 $W_{k} = \\sum_{n = 1}^{N_{k}} ⁡ w^{\\left(\\right. n \\left.\\right)}$ 。对抗性对齐仍然相当于最小化方程（ 21 ），但使用加权边缘单元嵌入分布 $q_{k} \\left(\\right. \\mathbf{u} \\left.\\right) = \\frac{1}{W_{k}} \\sum_{n = 1}^{N_{k}} ⁡ w^{\\left(\\right. n \\left.\\right)} q \\left(\\right. \\mathbf{u} \\left|\\right. \\mathbf{x} {k}^{\\left(\\right. n \\left.\\right)} ; \\phi {k} \\left.\\right)$ 。通过分配适当的权重来平衡不同层之间的单元分布， $q_{i} \\left(\\right. \\mathbf{u} \\left.\\right) = q_{j} \\left(\\right. \\mathbf{u} \\left.\\right) , \\forall i \\neq j$ 的最优值可以更接近所需的对齐方式。 为了以无监督的方式获得平衡权重，我们设计了以下两阶段训练流程。首先，我们使用恒定权重 $w^{\\left(\\right. n \\left.\\right)} = 1$ 预训练 GLUE 模型，在此过程中，我们在将细胞嵌入传递给判别器之前，向细胞嵌入中添加噪声 $\\mathbf{\\mathit{\\epsilon}} sim \\mathcal{N} \\left(\\right. \\mathbf{\\mathit{\\epsilon}} ; 0 , \\Sigma \\left.\\right)$ 。我们将 ∑ 设置为每个小批量中细胞嵌入经验方差的 1.5 倍，这有助于生成一个对成分不平衡不敏感的粗略比对。然后，我们使用 Leiden 聚类对每个组学层的粗略比对的细胞嵌入进行聚类。第 i 个簇中细胞的平衡权重 w 计算如下： $w_{i} = \\frac{\\sum_{k_{i} \\neq k_{j}} ⁡ f \\left(\\right. \\mathbf{u} {i} , \\mathbf{u} {j} \\left.\\right)}{n_{i}}$ $$ \\begin{array}{*{20}{c}} {w_i = \\frac{{\\mathop {\\sum }\\nolimits_{k_i \\ne k_j} f\\left( {{{{\\mathbf{u}}}}_i,{{{\\mathbf{u}}}}_j} \\right)}}{{n_i}}} \\end{array} $$ (23) $f \\left(\\right. \\mathbf{u} {i} , \\mathbf{u} {j} \\left.\\right) = \\left{\\right. \\begin{matrix}cos ⁡ \\left(\\left(\\right. \\mathbf{u} {i} , \\mathbf{u} {j} \\left.\\right)\\right)^{4} , \u0026 c o s \\left(\\right. \\mathbf{u} {i} , \\mathbf{u} {j} \\left.\\right) \u003e 0.5 \\ 0 , \u0026 o t h e r w i s e\\end{matrix}$ $$ \\begin{array}{ {20}{c}} {f\\left( {{{{\\mathbf{u}}}}_i,{{{\\mathbf{u}}}}_j} \\right) = \\left{ {\\begin{array}{ {20}{l}} {\\cos \\left( {{{{\\mathbf{u}}}}_i,{{{\\mathbf{u}}}}_j} \\right)^4,} \\hfill \u0026 {{\\mathrm{cos}}({{{\\mathbf{u}}}}_i,{{{\\mathbf{u}}}}_j) \u003e 0.5} \\hfill \\ {0,} \\hfill \u0026 {{\\mathrm{otherwise}}} \\hfill \\end{array}} \\right.} \\end{array} $$ (24) 其中， u 是簇 i ht) = \\frac{{{\\Gamma}\\left( {{\\mathbf{x} {k}} {i} + {\\mathbf{\\theta } {b}} {i}} \\right)}}{{{\\Gamma}\\left( {{\\mathbf{\\theta } {b}} {i}} \\right){\\Gamma}\\left( {{\\mathbf{x} {k}} {i} + 1} \\right)}}\\left( {\\frac{{{{{\\mathbf{\\mu }}}} i}}{{{\\mathbf{\\theta } {b}} {i} + {{{\\mathbf{\\mu }}}} i}}} \\right)^{{\\mathbf{x} {k}} {i}}\\left( {\\frac{{{\\mathbf{\\theta } {b}} {i}}}{{{\\mathbf{\\theta } {b}} {i} + {{{\\mathbf{\\mu }}}} i}}} \\right)^{{\\mathbf{\\theta } {b}}_{i}}} \\end{array} $$ (26) $\\mu_{i} = S o f t m a x_{i} \\left(\\right. \\alpha_{b} \\bigodot \\mathbf{V} {k}^{\\top} \\mathbf{u} + \\beta {b} \\left.\\right) \\cdot \\underset{j \\in \\mathcal{V} {k}}{\\sum} ⁡ \\mathbf{x} {k}_{j}$ $$ \\begin{array}{*{20}{c}} {{{{\\mathbf{\\mu }}}}_i = {{{\\mathrm{Softmax}}}}_i\\left( {{{{\\mathbf{\\alpha }}}}_b \\odot {{{\\mathbf{V}}}} k^ \\top {{{\\mathbf{u}}}} + {{{\\mathbf{\\beta }}}} b} \\right) \\cdot \\mathop {\\sum }\\limits {j \\in {{{\\mathcal{V}}}} k} {\\mathbf{x} {k}} {j}} \\end{array} $$ (27) 其中 $\\alpha \\in \\mathbb{R} {+}^{B \\times \\left|\\right. \\mathcal{V} {k} \\left|\\right.} , \\beta \\in \\mathbb{R}^{B \\times \\left|\\right. \\mathcal{V} {k} \\left|\\right.} , \\theta \\in \\mathbb{R} {+}^{B \\times \\left|\\right. \\mathcal{V}_{k} \\left|\\right.}$ ， α b ， β b ， θ b 分别是 α 、 β 、 θ 的第 b 行。其他概率解码器也可以用类似的方式扩展。 实施细节 # 我们采用线性降维方法，例如主成分分析（PCA，用于单细胞 RNA 测序）或潜在语义索引（LSI，用于单细胞 ATAC 测序），作为数据编码器的第一层转换层（注意解码器仍然在原始特征空间中拟合）。这有效地减小了模型规模并实现了模块化输入，因此也可以使用更高级的降维方法或批次效应校正方法作为 GLUE 集成的预处理步骤。 在模型训练过程中，10% 的单元格被用作验证集。在训练的最后阶段，如果验证损失连续几个 epoch 没有改善，则学习率将降低 10 倍。如果验证损失仍然连续几个 epoch 没有改善，则训练终止。学习率降低的耐心值、训练终止的阈值以及最大训练 epoch 数均根据数据规模和学习率自动设置，以分别对应于学习率为 0.002 时 1000 次、2000 次和 16000 次迭代的学习进度。 除非另有明确说明，所有使用 GLUE 进行的基准测试和案例研究均采用默认超参数。默认超参数集见扩展数据图 3 。 整合一致性评分 # 整合一致性评分衡量的是整合的多组学数据与指导图之间的一致性。首先，我们使用 k 均值聚类算法在对齐的细胞嵌入空间中对所有组学层中的细胞进行联合聚类。对于每个组学层，每个聚类中的细胞被聚合为一个元细胞。这些元细胞被建立为配对样本，基于此可以计算特征相关性。然后，我们利用这些配对的元细胞计算指导图中每条边的 Spearman 相关系数。整合一致性评分定义为所有图边的平均相关系数，并根据边的符号取反，最后根据边的权重进行加权。 系统性基准 # UnionCom [^23] 、Pamona [^24] 和 GLUE 分别使用 Python 包 'unioncom' (v.0.3.0)、'Pamona' (v.0.1.0) 和 'scglue' (v.0.2.0) 执行。MMD-MA [^25] 使用 https://bitbucket.org/noblelab/2020_mmdma_pytorch 提供的 Python 脚本执行。Online iNMF [^16] 、LIGER [^17] 、Harmony [^18] 、bindSC [^33] 和 Seurat v3 (ref. [^15] ) 分别使用 R 包 'rliger' (v.1.0.0)、'rliger' (v.1.0.0)、'harmony' (v.0.1.0)、'bindSC' (v.1.0.0) 和 'Seurat' (v.4.0.2) 执行。对于每种方法，我们都使用了推荐的默认超参数设置和数据预处理步骤。对于单细胞 RNA 测序（scRNA-seq）数据，我们使用 Seurat 的“vst”方法筛选了 2000 个高变异基因。我们采用了两种不同的方案来构建引导图。在标准方案中，如果 ATAC 峰与 RNA 基因在基因体或近端启动子区域（定义为转录起始位点上游 2 kb）重叠，则通过正边将它们连接起来。在另一种方案中，我们使用了更大的基因组窗口，如果 ATAC 峰位于近端基因启动子 150 kb 范围内，则通过正边将它们连接起来；边的权重由幂律函数 $w = \\left(\\left(\\right. d + 1 \\left.\\right)\\right)^{- 0.75}$ （ d 为基因组距离，单位为 kb）决定，该函数已被用于模拟染色质接触的概率 [^42] [^43] 。对于需要特征转换的方法（在线 iNMF、LIGER、bindSC 和 Seurat v.3），我们通过将指导图中与特定基因相连的 ATAC 峰的计数相加，将 scATAC-seq 数据转换为基因水平的活性得分。 值得注意的是，在线 iNMF 和 LIGER 也推荐了一种替代的 ATAC 特征转换方法，即直接计数位于基因体和启动子区域的 ATAC 片段，而无需借助 ATAC 峰（ https://htmlpreview.github.io/? https://github.com/welch-lab/liger/blob/master/vignettes/Integrating_scRNA_and_scATAC_data.html ），我们将其简称为 FiG（基因片段）。我们也尽可能地使用在线 iNMF 和 LIGER 对 FiG 特征转换方法进行了测试。 采用平均精度均值（MAP）来评估细胞类型分辨率。假设 第 i 个细胞的类型为 y ( i ) ，其 K 个有序最近邻细胞的类型分别为 $y_{1}^{\\left(\\right. i \\left.\\right)} , y_{2}^{\\left(\\right. i \\left.\\right)} , \\ldots , y_{K}^{\\left(\\right. i \\left.\\right)}$ ，则平均精度均值定义如下： $M A P = \\frac{1}{N} \\sum_{i = 1}^{N} ⁡ A P^{\\left(\\right. i \\left.\\right)}$ $$ \\begin{array}{*{20}{c}} {{\\mathrm{MAP}} = \\frac{1}{N}\\mathop {\\sum}\\limits_{i = 1}^N {{{{\\mathrm{AP}}}}^{\\left( i \\right)}} } \\end{array} $$ (28) $A P^{\\left(\\right. i \\left.\\right)} = \\left{\\right. \\begin{matrix}\\frac{\\sum_{k = 1}^{K} ⁡ 1_{y^{\\left(\\right. i \\left.\\right)} = y_{k}} \\cdot \\frac{\\sum_{j = 1}^{k} ⁡ 1_{y^{\\left(\\right. i \\left.\\right)} = y_{j}^{\\left(\\right. i \\left.\\right)}}}{k}}{\\sum_{k = 1}^{K} ⁡ 1_{y^{\\left(\\right. i \\left.\\right)} = y_{k}^{\\left(\\right. i \\left.\\right)}}} , \u0026 i f \\sum_{k = 1}^{K} ⁡ 1_{y^{\\left(\\right. i \\left.\\right)} = y_{k}^{\\left(\\right. i \\left.\\right)}} \u003e 0 \\ 0 , \u0026 o t h e r w i s e\\end{matrix}$ $$ \\begin{array}{ {20}{c}} {{{{\\mathrm{AP}}}}^{\\left( i \\right)} = \\left{ {\\begin{array}{ {20}{l}} {\\frac{{\\mathop {\\sum }\\nolimits_{k = 1}^K 1_{y^{\\left( i \\right)} = y_k} \\cdot \\frac{{\\mathop {\\sum }\\nolimits_{j = 1}^k 1_{y^{\\left( i \\right)} = y_j^{\\left( i \\right)}}}}{k}}}{{\\mathop {\\sum }\\nolimits_{k = 1}^K 1_{y^{\\left( i \\right)} = y_k^{\\left( i \\right)}}}},} \\hfill \u0026 {{\\mathrm{if}},\\mathop {\\sum }\\limits_{k = 1}^K 1_{y^{\\left( i \\right)} = y_k^{\\left( i \\right)}} \u003e 0} \\hfill \\ {0,} \\hfill \u0026 {{\\mathrm{otherwise}}} \\hfill \\end{array}} \\right.} \\end{array} $$ (29) 其中 $1_{y^{\\left(\\right. i \\left.\\right)} = y_{k}^{\\left(\\right. i \\left.\\right)}}$ 是一个指示函数，当 $y^{\\left(\\right. i \\left.\\right)} = y_{k}^{\\left(\\right. i \\left.\\right)}$ 时取值为 1，否则为 0。对于每个单元格，平均精度 (AP) 计算其与相邻单元格类型匹配的平均精度，平均精度均值 (MAP) 则计算所有单元格的平均精度均值。我们将 K 设置为每个数据集中单元格总数的 1%。平均精度均值 (MAP) 的取值范围为 0 到 1，值越高表示单元格类型分辨率越高。 单元类型 ASW（平均轮廓宽度）也被用于评估单元类型分辨率，其定义与最近的基准研究 [^73] 中的定义相同： $c e l l t y p e A S W = \\frac{1}{2} \\left(\\right. \\frac{\\sum_{i = 1}^{N} ⁡ s_{c e l l t y p e}^{\\left(\\right. i \\left.\\right)}}{N} + 1 \\left.\\right)$ $$ \\begin{array}{*{20}{c}} {{\\mathrm{cell}},{\\mathrm{type}},{\\mathrm{ASW}} = \\frac{1}{2}\\left( {\\frac{{\\mathop {\\sum }\\nolimits_{i = 1}^N s_{{{{\\mathrm{cell}}}},{{{\\mathrm{type}}}}}^{\\left( i \\right)}}}{N} + 1} \\right)} \\end{array} $$ (30) 其中 $s_{c e l l t y p e}^{\\left(\\right. i \\left.\\right)}$ 表示 第 i 个单元格的单元格类型轮廓宽度， N 为单元格总数。单元格类型 ASW 的取值范围为 0 到 1，值越高表示单元格类型分辨率越高。 邻域一致性（NC）用于评估多组学整合后单组学数据变异的保留情况，其定义遵循先前的研究 [^74] ： $N C = \\frac{1}{N} \\sum_{i = 1}^{N} ⁡ \\frac{\\left|\\right. N N S^{\\left(\\right. i \\left.\\right)} \\cap N N I^{\\left(\\right. i \\left.\\right)} \\left|\\right.}{\\left|\\right. N N S^{\\left(\\right. i \\left.\\right)} \\cup N N I^{\\left(\\right. i \\left.\\right)} \\left|\\right.}$ $$ \\begin{array}{*{20}{c}} {{\\mathrm{NC}} = \\frac{1}{N}\\mathop {\\sum }\\limits_{i = 1}^N \\frac{{\\left| {{{{\\mathrm{NNS}}}}^{\\left( {{{\\mathrm{i}}}} \\right)} \\cap {{{\\mathrm{NNI}}}}^{\\left( {{{\\mathrm{i}}}} \\right)}} \\right|}}{{\\left| {{{{\\mathrm{NNS}}}}^{\\left( {{{\\mathrm{i}}}} \\right)} \\cup {{{\\mathrm{NNI}}}}^{\\left( {{{\\mathrm{i}}}} \\right)}} \\right|}}} \\end{array} $$ (31) 其中，NNS (i) 表示单组学数据中细胞 i 的 k 近邻集合，NNI (i) 表示整合空间中 第 i 个细胞的 K 近邻集合， N 表示细胞总数。我们在每个数据集中将 K 设置为细胞总数的 1%。邻域一致性取值范围为 0 到 1，值越高表示数据变异的保留程度越好。 生物学保护 平均精度均值、细胞类型 ASW 和邻域一致性均用于衡量数据整合的生物学保守性。参照近期基准研究 [^73] 的方法，我们首先对每个指标进行最小-最大缩放，然后计算三个指标的平均值，将它们汇总为一个代表生物学保守性的单一指标： $b i o l o g y c o n s e r v a t i o n = \\frac{s c a l e \\left(\\right. M A P \\left.\\right) + s c a l e \\left(\\right. c e l l t y p e A S W \\left.\\right) + s c a l e \\left(\\right. N C \\left.\\right)}{3}$ $$ \\begin{array}{*{20}{c}} {{\\mathrm{biology}},{\\mathrm{conservation}} = \\frac{{{{{\\mathrm{scale}}}}\\left( {{{{\\mathrm{MAP}}}}} \\right) + {{{\\mathrm{scale}}}}\\left( {{{{\\mathrm{cell}}}},{{{\\mathrm{type}}}},{{{\\mathrm{ASW}}}}} \\right) + {{{\\mathrm{scale}}}}\\left( {{{{\\mathrm{NC}}}}} \\right)}}{3}} \\end{array} $$ (32) Seurat 比对分数 (SAS) 用于评估组学层之间的混合程度，其计算方法如原始论文 [^75] 中所述： $S A S = 1 - \\frac{\\bar{x} - \\frac{K}{N}}{K - \\frac{K}{N}}$ $$ \\begin{array}{*{20}{c}} {{\\mathrm{SAS}} = 1 - \\frac{{\\bar x - \\frac{K}{N}}}{{K - \\frac{K}{N}}}} \\end{array} $$ (33) 其中， $\\bar{x}$ 表示来自同一组学层的 K 个最近邻细胞的平均数量（不同层首先被下采样至与最小层相同的细胞数量）， N 为组学层的数量。我们将 K 设置为下采样细胞数量的 1%。Seurat 比对得分的范围为 0 到 1，值越高表示混合效果越好。 组学层 ASW 也被用于评估组学层之间的混合程度，其定义与最近的基准研究 [^73] 中的定义相同： $o m i c s l a y e r A S W = \\frac{1}{M} \\sum_{j = 1}^{M} ⁡ o m i c s l a y e r A S W_{j}$ $$ \\begin{array}{*{20}{c}} {{\\mathrm{omics}},{\\mathrm{layer}},{\\mathrm{ASW}} = \\frac{1}{M}\\mathop {\\sum}\\limits_{j = 1}^M {{{{\\mathrm{omics}}}},{{{\\mathrm{layer}}}},{{{\\mathrm{ASW}}}}_{{{\\mathrm{j}}}}} } \\end{array} $$ (34) $o m i c s l a y e r A S W_{j} = \\frac{1}{N_{j}} \\sum_{i = 1}^{N_{j}} ⁡ 1 - \\left|\\right. s_{o m i c s l a y e r}^{\\left(\\right. i \\left.\\right)} \\left|\\right.$ $$ \\begin{array}{*{20}{c}} {{{{\\mathrm{omics}}}},{{{\\mathrm{layer}}}},{{{\\mathrm{ASW}}}} {{{\\mathrm{j}}}} = \\frac{1}{{N_j}}\\mathop {\\sum }\\limits {i = 1}^{N_j} 1 - \\left| {s_{{{{\\mathrm{omics}}}},{{{\\mathrm{layer}}}}}^{\\left( i \\right)}} \\right|} \\end{array} $$ (35) 其中 ， $s_{o m i c s l a y e r}^{\\left(\\right. i \\left.\\right)}$ 表示 第 i 个细胞的组学层轮廓宽度， N 表示细胞类型 j 的细胞数量， M 表示细胞类型的总数。组学层 ASW 的取值范围为 0 到 1，值越高表示混合效果越好。 图连通性（GC）也被用于评估组学层之间的混合程度，其定义与最近的基准研究 [^73] 中的定义相同： $G C = \\frac{1}{M} \\sum_{j = 1}^{M} ⁡ \\frac{\\left|\\right. L C C_{j} \\left|\\right.}{N_{j}}$ $$ \\begin{array}{*{20}{c}} {{\\mathrm{GC}} = \\frac{1}{M}\\mathop {\\sum }\\limits_{j = 1}^M \\frac{{\\left| {{{{\\mathrm{LCC}}}}_j} \\right|}}{{N_j}}} \\end{array} $$ (36) 其中，LCC 表示细胞类型 j 的 k 近邻图（ K = 15）中最大连通分量内的细胞数量， N 表示细胞类型 j 的细胞数量， M 表示细胞类型的总数。图连通性的取值范围为 0 到 1，值越高表示混合程度越好。 组学混合 Seurat 比对得分、组学层 ASW 和图连通性均用于衡量数据整合中的组学混合程度。参照近期基准研究 [^73] 的方法，我们首先对每个指标进行最小-最大缩放，然后计算三个指标的平均值，将它们汇总为一个代表组学混合程度的单一指标： $o m i c s m i x i n g = \\frac{s c a l e \\left(\\right. S A S \\left.\\right) + s c a l e \\left(\\right. o m i c s l a y e r A S W \\left.\\right) + s c a l e \\left(\\right. G C \\left.\\right)}{3}$ $$ \\begin{array}{*{20}{c}} {{\\mathrm{omics}},{\\mathrm{mixing}} = \\frac{{{{{\\mathrm{scale}}}}\\left( {{{{\\mathrm{SAS}}}}} \\right) + {{{\\mathrm{scale}}}}\\left( {{{{\\mathrm{omics}}}},{{{\\mathrm{layer}}}},{{{\\mathrm{ASW}}}}} \\right) + {{{\\mathrm{scale}}}}\\left( {{{{\\mathrm{GC}}}}} \\right)}}{3}} \\end{array} $$ (37) 总体整合得分 为了计算总体整合得分，我们采用生物学保守性和组学混合性之间的 6:4 权重，遵循最近的基准研究 [^73] ： $o v e r a l l i n t e g r a t i o n s c o r e = 0.6 \\times b i o l o g y c o n s e r v a t i o n + 0.4 \\times o m i c s m i x i n g$ $$ \\begin{array}{*{20}{c}} {{\\mathrm{overall}},{\\mathrm{integration}},{\\mathrm{score}} = 0.6 \\times {\\mathrm{biology}},{\\mathrm{conservation}} + 0.4 \\times {\\mathrm{omics}},{\\mathrm{mixing}}} \\end{array} $$ (38) FOSCTTM [^25] 用于评估单细胞水平比对的准确率。它在两个已知细胞间配对的数据集上进行计算。假设每个数据集包含 N 个 细胞，并且这些细胞按相同顺序排序，即第一个数据集中的第 i 个细胞与第二个数据集中的第 i 个细胞配对。分别用 x 和 y 表示第一个和第二个数据集的细胞嵌入。FOSCTTM 定义如下： $F O S C T T M = \\frac{1}{2 N} \\left(\\right. \\sum_{i = 1}^{N} ⁡ \\frac{n_{1}^{\\left(\\right. i \\left.\\right)}}{N} + \\sum_{i = 1}^{N} ⁡ \\frac{n_{2}^{\\left(\\right. i \\left.\\right)}}{N} \\left.\\right)$ $$ \\begin{array}{*{20}{c}} {{\\mathrm{FOSCTTM}} = \\frac{1}{{2N}}\\left( {\\mathop {\\sum }\\limits_{i = 1}^N \\frac{{n_1^{\\left( i \\right)}}}{N} + \\mathop {\\sum }\\limits_{i = 1}^N \\frac{{n_2^{\\left( i \\right)}}}{N}} \\right)} \\end{array} $$ (39) $n_{1}^{\\left(\\right. i \\left.\\right)} = \\left|\\right. \\left{\\right. j \\left|\\right. d \\left(\\right. \\mathbf{x} {j} , \\mathbf{y} {i} \\left.\\right) \u003c d \\left(\\right. \\mathbf{x} {i} , \\mathbf{y} {i} \\left.\\right) \\left.\\right} \\left|\\right.$ $$ \\begin{array}{*{20}{c}} {n_1^{\\left( i \\right)} = \\left| {\\left{ {j|d\\left( {{{{\\mathbf{x}}}}_j,{{{\\mathbf{y}}}}_i} \\right) \u003c d\\left( {{{{\\mathbf{x}}}}_i,{{{\\mathbf{y}}}}_i} \\right)} \\right}} \\right|} \\end{array} $$ (40) $n_{2}^{\\left(\\right. i \\left.\\right)} = \\left|\\right. \\left{\\right. j \\left|\\right. d \\left(\\right. \\mathbf{x} {i} , \\mathbf{y} {j} \\left.\\right) \u003c d \\left(\\right. \\mathbf{x} {i} , \\mathbf{y} {i} \\left.\\right) \\left.\\right} \\left|\\right.$ $$ \\begin{array}{*{20}{c}} {n_2^{\\left( i \\right)} = \\left| {\\left{ {j|d\\left( {{{{\\mathbf{x}}}}_i,{{{\\mathbf{y}}}}_j} \\right) \u003c d\\left( {{{{\\mathbf{x}}}}_i,{{{\\mathbf{y}}}}_i} \\right)} \\right}} \\right|} \\end{array} $$ (41) 其中， 、 $n_{1}^{\\left(\\right. i \\left.\\right)}$ 和 、 $n_{2}^{\\left(\\right. i \\left.\\right)}$ 分别表示在第一个和第二个数据集中，与 第 i 个细胞比其在对应数据集中的真实匹配更接近的细胞数量。d 为欧氏距离 。FOSCTTM 的取值范围为 0 到 1，值越低表示准确度越高。 特征一致性用于评估不同模型特征嵌入的一致性。由于原始嵌入空间在不同模型之间无法直接比较，我们将一致性定义为同一模型中特征间余弦相似度的跨模态守恒性。具体而言，我们首先随机抽取2000个特征，并使用来自两个待比较模型的特征嵌入计算它们之间的两两余弦相似度。然后，我们将特征一致性得分定义为两个模型余弦相似度之间的皮尔逊相关系数，并对四个随机子样本取平均值。特征一致性的取值范围为-1到1，数值越高表示一致性越高。 对于基线基准测试，除 Harmony 和 bindSC 外，每种方法均使用不同的随机种子运行八次。Harmony 和 bindSC 具有确定性实现，因此仅运行一次。对于引导图损坏基准测试，我们移除了指定比例的现有峰-基因相互作用，并添加了等量的不存在的相互作用，因此相互作用总数保持不变。值得注意的是，我们还使用损坏的引导图重复了特征转换。损坏过程使用不同的随机种子重复了八次。对于子采样基准测试，我们将 scRNA-seq 和 scATAC-seq 细胞成对进行子采样（以便仍然可以计算 FOSCTTM）。子采样过程也使用不同的随机种子重复了八次。 为了进行系统可扩展性测试（补充图 17a ），所有方法均在一台配备 40 个 CPU 核心（两颗 Intel Xeon Silver 4210 芯片）、250 GB 内存和 NVIDIA GeForce RTX 2080 Ti 图形处理器的 Linux 工作站上运行。训练 GLUE 时仅使用一张图形处理器卡。 三组学整合 # scRNA-seq 和 scATAC-seq 数据的处理方法如前所述（参见 “系统基准测试 ”部分）。由于单 C 位点的覆盖度较低，snmC-seq 数据被转换为基因体内的平均甲基化水平。mCH 和 mCG 水平分别进行定量，每个基因得到两个特征。基因甲基化水平通过每个细胞的全局甲基化水平进行标准化。使用 PCA 进行初始降维（ 参见“实现细节 ”部分）。对于三组学指导图，mCH 和 mCG 水平通过负边与相应的基因连接。 标准化后的甲基化水平为正值，缺失值对应于单细胞中未覆盖的基因。因此，我们使用零膨胀对数正态分布（ZILN）作为数据解码器： $p \\left(\\right. \\mathbf{x} {k} \\left|\\right. \\mathbf{u} , \\mathbf{V} ; \\theta {k} \\left.\\right) = \\underset{i \\in \\mathcal{V} {k}}{\\prod} ⁡ Z I L N \\left(\\right. \\mathbf{x} {k} {i} ; \\mu {i} , \\sigma_{i} , \\delta_{i} \\left.\\right)$ $$ \\begin{array}{*{20}{c}} {p\\left( {{{{\\mathbf{x}}}} k|{{{\\mathbf{u}}}},{{{\\mathbf{V}}}};\\theta k} \\right) = \\mathop {\\prod }\\limits {i \\in {{{\\mathcal{V}}}} k} {{{\\mathrm{ZILN}}}}\\left( {{\\mathbf{x} {k}} {i};{{{\\mathbf{\\mu }}}}_i,{{{\\mathbf{\\sigma }}}}_i,{{{\\mathbf{\\delta }}}}_i} \\right)} \\end{array} $$ (42) $Z I L N \\left(\\right. \\mathbf{x} {k} {i} ; \\mu_{i} , \\sigma_{i} , \\delta_{i} \\left.\\right) = \\left{\\right. \\begin{matrix}\\frac{1 - \\delta_{i}}{\\mathbf{x} {k} {i} \\sigma_{i} \\sqrt{2 \\pi}} exp ⁡ \\left(\\right. - \\frac{\\left(\\left(\\right. log ⁡ \\mathbf{x} {k} {i} - \\mu_{i} \\left.\\right)\\right)^{2}}{2 \\sigma_{i}^{2}} \\left.\\right) , \u0026 \\mathbf{x} {k} {i} \u003e 0 \\ \\delta_{i} , \u0026 \\mathbf{x} {k} {i} = 0\\end{matrix}$ $$ \\begin{array}{ {20}{c}} {{\\mathrm{ZILN}}\\left( {{\\mathbf{x} {k}} {i};{{{\\mathbf{\\mu }}}}_i,{{{\\mathbf{\\sigma }}}}_i,{{{\\mathbf{\\delta }}}}_i} \\right) = \\left{ {\\begin{array}{ {20}{l}} {\\frac{{1 - {{{\\mathbf{\\delta }}}} i}}{{{\\mathbf{x} {k}} {i}{{{\\mathbf{\\sigma }}}} i\\sqrt {2\\pi } }}\\exp \\left( { - \\frac{{\\left( {\\log {\\mathbf{x} {k}} {i} - {{{\\mathbf{\\mu }}}} i} \\right)^2}}{{2{{{\\mathbf{\\sigma }}}} i^2}}} \\right),} \\hfill \u0026 {{\\mathbf{x} {k}} {i} \u003e 0} \\hfill \\ {{{{\\mathbf{\\delta }}}} i,} \\hfill \u0026 {{\\mathbf{x} {k}}_{i} = 0} \\hfill \\end{array}} \\right.} \\end{array} $$ (43) $\\mu_{i} = \\alpha \\bigodot \\mathbf{V}_{k}^{\\top} \\mathbf{u} + \\beta$ $$ \\begin{array}{*{20}{c}} {{{{\\mathbf{\\mu }}}}_i = \\mathbf{\\alpha} \\odot {{{\\mathbf{V}}}}_k^ \\top \\mathbf{u} + \\mathbf{\\beta} } \\end{array} $$ (44) 其中 $\\mu \\in \\mathbb{R}^{\\left|\\right. \\mathcal{V} {k} \\left|\\right.} , \\sigma \\in \\mathbb{R} {+}^{\\left|\\right. \\mathcal{V} {k} \\left|\\right.} , \\delta \\in \\left(\\left(\\right. 0 , 1 \\left.\\right)\\right)^{\\left|\\right. \\mathcal{V} {k} \\left|\\right.}$ 分别是零膨胀对数正态分布的对数尺度均值、对数尺度标准差和零膨胀参数， $\\alpha \\in \\mathbb{R} {+}^{\\left|\\right. \\mathcal{V} {k} \\left|\\right.} , \\beta \\in \\mathbb{R}^{\\left|\\right. \\mathcal{V}_{k} \\left|\\right.}$ 是缩放因子和偏差因子。 为了统一细胞类型标签，我们以 snmC-seq 数据集为参考，进行了基于最近邻的标签转移。在比对后的嵌入空间中，我们为每个 scRNA-seq 和 scATAC-seq 细胞识别了 snmC-seq 中的五个最近邻，并采用多数投票法确定转移的标签。为了验证比对的正确性，我们检测了细胞类型标记基因的显著重叠。首先，我们将所有组学层的特征转换为基因。然后，对于每个组学层，我们使用一对多 Wilcoxon 秩和检验来识别细胞类型标记，检验标准如下：scRNA-seq/scATAC-seq 的 FDR ≥ 0.05 且 log2 倍数变化≥0.00；snmC-seq 的 FDR ≥ 0.05 且 log2 倍数变化≥0.00。标记重叠的显著性通过三因素 Fisher 精确检验确定。 为了在整合后进行相关性和回归分析，我们使用精细尺度的 k 均值聚类算法（ k =200）对来自三个组学层的所有细胞进行聚类。然后，对于每个组学层，通过对每个聚类中的细胞进行表达/可及性计数求和或对其 DNA 甲基化水平取平均值，将每个聚类中的细胞聚合为一个元细胞。这些元细胞被构建为配对样本，基于此可以进行特征相关性和回归分析。 为了使用在线 iNMF 整合相同的数据集，我们按照原始论文 [^16] 中描述的步骤，通过从数据矩阵中减去最大条目来反转 snmC-seq 数据。 基于 GLUE 的顺式调控推断 # 为确保细胞类型的一致性，我们首先筛选出 10X Multiome 和 pcHi-C 数据中重叠的细胞类型。剩余的细胞类型包括 T 细胞、B 细胞和单核细胞。由于 eQTL 数据不具有细胞类型特异性，因此我们直接使用这些数据。对于 scRNA-seq，我们选择了 6000 个高变异基因。为了捕获远端 顺式 调控相互作用，我们使用 “系统基准测试” 部分所述的替代方案，构建了距离在 150 kb 以内的峰-基因对的基础指导图。 为了整合 pcHi-C 和 eQTL 的调控证据，我们将所有证据锚定在 ATAC 峰与 RNA 基因之间的相互作用上。如果满足以下条件，则认为峰-基因对得到 pcHi-C 的支持：（1）基因启动子位于诱饵片段 1 kb 范围内；（2）峰位于另一端片段 1 kb 范围内；（3）在 pcHi-C 中，诱饵片段与另一端片段之间存在显著接触。pcHi-C 支持的峰-基因相互作用的权重通过将启动子到诱饵片段的幂律权重和峰到另一端片段的幂律权重相乘（如上所述）来计算。如果一个峰-基因对得到多个 pcHi-C 接触的支持，则将这些权重相加，并限制为最大值 1。如果满足以下条件，则认为峰-基因对得到 eQTL 的支持：（1）峰与 eQTL 位点重叠；（2）该位点与基因的表达相关。 eQTL 支持的峰-基因相互作用被赋予 1 的权重。复合指导图是通过将 pcHi-C 和 eQTL 支持的相互作用添加到先前的基于距离的相互作用中构建的，允许存在多条边。 对于调控推断，仅考虑距离在 150 kb 以内的峰-基因对。GLUE 训练过程使用不同的随机种子重复四次。每次重复训练中，峰-基因调控得分计算为特征嵌入之间的余弦相似度。最终的调控推断结果通过对四次重复训练的调控得分取平均值得到。为了评估调控得分的显著性，我们将这些得分与通过随机打乱特征嵌入得到的零分布进行比较，并计算经验 P 值，即在零分布中获得更极端得分的概率。最后，我们使用 Benjamini-Hochberg 方法，基于 P 值计算调控推断的错误发现率 (FDR)。对于使用 LASSO 的 顺式 调控推断，我们使用超参数 α = 0.01，该参数针对 pcHi-C 和 eQTL 预测的受试者工作特征曲线下面积 (AUC) 进行了优化。 TF 靶基因调控推断 # 我们使用 SCENIC 工作流程 [^76] 从推断的峰-基因调控相互作用中构建了 TF-基因调控网络。简而言之，SCENIC 工作流程首先基于 scRNA-seq 数据构建基因共表达网络，然后利用外部 顺式 调控证据过滤掉假阳性结果。SCENIC 接受以每个 TF 的基因排名形式提供的 顺式 调控证据，即在其调控区域中 TF 富集水平更高的基因排名更高。为了基于我们推断的峰-基因相互作用构建排名，我们首先将 ENCODE TF 染色质免疫沉淀 (ChIP) 峰 [^77] 与 ATAC 峰进行重叠，并统计每个 ATAC 峰中每个 TF 的 ChIP 峰数量。由于不同基因可能具有不同数量的连接的 ATAC 峰，并且 ATAC 峰的长度也各不相同（较长的峰可能偶然包含更多的 ChIP 峰），因此我们设计了一种基于抽样的方法来评估 TF 富集情况。具体而言，对于每个基因，我们随机抽取了 1000 组 ATAC 峰，这些峰在数量和长度分布上均与连接的 ATAC 峰相匹配。我们将这些随机 ATAC 峰中的 TF ChIP 峰数量作为零分布进行统计。对于每个基因中的每个 TF，通过比较观察到的 ChIP 峰数量与零分布，可以计算出一个经验 P 值。最后，我们根据每个 TF 的经验 P 值对基因进行排序，从而得到 SCENIC 使用的 顺式 调控排名。由于基于峰-基因的推断主要集中于远端调控区域，因此可能会遗漏近端启动子。因此，我们同时向 SCENIC 提供了基于峰和基于近端启动子的 顺式 调控排名。 人类多组学图谱的整合 # scRNA-seq 和 scATAC-seq 图谱的细胞类型组成极不平衡，这主要是由于器官样本量差异造成的（补充图 17b ）。尽管在实际分析中细胞类型未知，但器官来源通常是可用的，可用于平衡整合过程。为了进行器官平衡的数据预处理，我们首先对每个组学层进行子采样，使其与器官组成相匹配。对于 scRNA-seq 数据，我们使用器官平衡的子样本选择了 4000 个高变异基因。然后，为了进行初始降维，我们对器官平衡的子样本分别拟合了 PCA（scRNA-seq）和 LSI（scATAC-seq），并将投影应用于完整数据。PCA/LSI 坐标被用作 GLUE 数据编码器中的第一个转换层（参见 “实现细节 ”部分），以及用于元细胞聚合（见下文）。引导图的构建方法如前所述（参见 “系统基准测试 ”部分）。 这两个图谱包含大量细胞，但每个细胞的覆盖度较低。为了同时缓解 dropout 并提高训练速度，我们在预训练阶段采用了元细胞聚合策略。具体来说，在预训练阶段，我们使用精细尺度的 k 均值聚类算法对每个组学层中的细胞进行聚类（scRNA-seq 的 k =100,000，scATAC-seq 的 k =40,000）。为了同时平衡器官组成，我们首先在之前器官平衡的子样本上拟合 k 均值聚类中心，然后将其应用于完整数据集。每个 k 均值聚类中的细胞通过对其表达/可及性计数求和并对其 PCA/LSI 坐标取平均值而聚合成一个元细胞。然后，我们使用添加噪声对这些聚合的元细胞进行 GLUE 预训练，这些噪声可以大致调整细胞嵌入的方向，但不会实际对齐它们（ 参见“加权对抗比对 ”部分）。为了更好地利用大数据，隐藏层的维度从默认的 256 增加到 512。在第二阶段，使用完整的单细胞数据对 GLUE 进行微调，平衡权重的估计方法详见 “加权对抗比对” 部分。在比较不同方法的可扩展性时，未使用元细胞聚合（补充图 17a ）。 为了与其他整合方法进行比较，我们还尝试了在线 iNMF 和 Seurat v.3。在线 iNMF 是唯一能够扩展到数百万个细胞的方法，因此我们将其应用于完整数据集。另一方面，Seurat v.3 在我们之前的基准测试中表现出第二高的准确率。由于 Seurat v.3 无法扩展到完整数据集，我们也将其应用于 GLUE 训练第一阶段使用的聚合数据（补充图 17a ）。标签迁移采用与三组学情况相同的步骤，只是我们在 50 个最近邻中使用了多数投票法。 报告摘要 # 有关研究设计的更多信息，请参阅本文链接的《 自然研究报告摘要》 。 数据可用性 # 本研究中使用的所有数据集均已发表，并来自公共数据存储库。有关本研究中使用的单细胞组学数据集的详细信息，包括访问代码和 URL，请参见补充表 1。 用于调控推断和评估的 pcHi-C 数据来自原始出版物的补充文件（ https://www.sciencedirect.com/science/article/pii/S0092867416313228），eQTL 数据来自 GTEx v8（ https://www.gtexportal.org/home/datasets ），TF ChIP-seq 数据来自 ENCODE 数据门户（ https://www.encodeproject.org/），TRRUST v2 数据库来自官方网站（ https://www.grnpedia.org/trrust/downloadnetwork.php ）。所有基准测试源数据均可在补充数据 1 中找到。 代码可用性 # GLUE 框架已在 Python 包“scglue”中实现，该包可在 https://github.com/gao-lab/GLUE 获取。为了保证结果的可复现性，所有基准测试和案例研究的脚本均使用 Snakemake (v.6.12.3) 编译，该软件包也可在上述仓库中找到。 参考 # 致谢 # 我们感谢北京大学的唐峰、谢晓松、张志强、陶磊、李晨、卢军以及北京放射医学研究所的丁勇在研究过程中提供的有益讨论和建议，并感谢本研究中使用的数据集的作者们提供的帮助。本研究由国家重点研发计划（项目编号：2016YFC0901603）、北京大学蛋白质与植物基因研究国家重点实验室、北京基因组学高精尖创新中心以及昌平实验室资助。GG 的研究部分由国家高层次青年人才支持计划资助。部分分析工作在北京大学生命科学中心计算平台完成，并得到了北京大学高性能计算平台的支持。图 1 的部分图像来自 Servier Medical Art（ https://smart.servier.com/，CC BY 3.0）下载的数据集。 伦理声明 # 利益冲突 # 作者声明不存在利益冲突。 同行评审 # 同行评审信息 # 《自然生物技术》 感谢 Ricard Argelaguet、Yun Li、Romain Lopez 和其他匿名审稿人对这项工作的同行评审所做出的贡献。 附加信息 # 出版商声明： 施普林格·自然出版社对已出版地图中的管辖权主张和机构隶属关系保持中立。 扩展数据 # 扩展数据图 1 用于评估集成性能的各项指标。 # a ，不同整合方法的平均精度均值与 Seurat 比对得分的关系。平均精度均值越高，表示细胞类型分辨率越高；Seurat 比对得分越高，表示组学混合效果越好。b ， 不同整合方法的细胞类型与组学层平均轮廓宽度的关系。细胞类型平均轮廓宽度越高，表示细胞类型分辨率越高；组学层平均轮廓宽度越高，表示组学混合效果越好。c ， 不同整合方法的邻域保守性与图连通性的关系。邻域保守性越高，表示各原始层中流形结构的保守性越好；图连通性越高，表示组学混合效果越好。n=8 次重
